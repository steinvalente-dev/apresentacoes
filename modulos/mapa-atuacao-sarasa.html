:root{
  --papel:#F3EEE7;
  --tinta:#231F20;
  --vinho:#79242F;
  --chumbo:#4E4E4E;
  --hair:#231F2026;
  --soft:#231F2099;

  --sans:'Poppins',system-ui,sans-serif;
  --label:'Archivo',system-ui,sans-serif;

  --fs-cap:clamp(9px,.64vw,11px);
  --fs-ui:clamp(11.5px,.82vw,14px);
  --fs-h1:clamp(20px,2.3vw,32px);
  --gut:clamp(14px,2vw,30px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--papel);color:var(--tinta);
  font-family:var(--sans);font-size:var(--fs-ui);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ───────── topo ───────── */
.topo{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--gut);
  flex-wrap:wrap;padding:calc(var(--gut)*.8) var(--gut) calc(var(--gut)*.65);
  border-bottom:1px solid var(--hair);
}
.marca{display:flex;align-items:flex-end;gap:clamp(14px,1.6vw,26px)}
.lockup{width:clamp(118px,11vw,164px);height:auto;display:block;flex:0 0 auto}
.titulo{border-left:1px solid var(--hair);padding-left:clamp(14px,1.6vw,26px)}
.olho{
  display:block;font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.18em;text-transform:uppercase;color:var(--chumbo);margin-bottom:7px;
}
h1{font-weight:500;font-size:var(--fs-h1);line-height:1.12;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--vinho)}

.num{display:flex;gap:clamp(14px,2vw,32px)}
.num div{border-left:1px solid var(--hair);padding-left:13px}
.num dt{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.12em;text-transform:uppercase;color:var(--chumbo)}
.num dd{font-size:clamp(17px,1.55vw,24px);font-weight:500;line-height:1.2;margin-top:2px}
.num dd span{color:#231F2059;font-weight:400}

.corpo{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,400px);min-height:0}

/* ───────── mapa ───────── */
.mapa{position:relative;min-height:0;overflow:hidden;background:var(--papel)}
#mapa{display:block;width:100%;height:100%}

.terra path{
  fill:#231F200A;stroke:#231F2033;stroke-width:.6;vector-effect:non-scaling-stroke;
  transition:fill .22s ease;
}
.terra path.c1{fill:#79242F26}
.terra path.c2{fill:#79242F4d}
.terra path.c3{fill:#79242F73}
.terra path.on{fill:#79242F99;stroke:var(--tinta);stroke-width:1.1}
.terra path.mudo{fill:#231F2005;stroke:#231F201f}

.pin{cursor:pointer}
.pin .ponto{stroke-width:1.3;vector-effect:non-scaling-stroke}
.pin[data-st="ativo"] .ponto{fill:var(--vinho);stroke:var(--papel)}
.pin[data-st="pos"]   .ponto{fill:var(--papel);stroke:var(--vinho);stroke-width:2.2}
.pin .conf{fill:none;stroke:var(--tinta);stroke-width:1;stroke-dasharray:2 2.6;
  vector-effect:non-scaling-stroke;opacity:.5}
.pin .halo{fill:none;stroke:var(--tinta);stroke-width:1.3;vector-effect:non-scaling-stroke;
  opacity:0;transition:opacity .18s}
.pin:hover .halo,.pin:focus-visible .halo,.pin.sel .halo{opacity:.9}
.pin.fora{opacity:.12;pointer-events:none}

.rotulos{position:absolute;inset:0;pointer-events:none}
.rot-d{position:absolute;transform:translate(-50%,0);white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.14em;text-transform:uppercase;color:#231F20a6;
  text-shadow:0 0 4px var(--papel),0 0 8px var(--papel);transition:opacity .2s}
.rot-d.fora{opacity:.26}

/* legenda */
.painel-mapa{
  position:absolute;left:var(--gut);bottom:var(--gut);max-width:min(350px,calc(100% - var(--gut)*2));
  background:#F3EEE7ee;backdrop-filter:blur(5px);border:1px solid var(--hair);padding:14px 16px 12px;
}
.painel-mapa h2{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.2em;text-transform:uppercase;color:var(--chumbo);margin-bottom:11px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  padding:4px 6px;margin-left:-6px;transition:background .15s}
.chip:hover{background:#231F200d}
.chip .bolha{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.chip[data-k="ativo"] .bolha{background:var(--vinho)}
.chip[data-k="pos"] .bolha{background:var(--papel);box-shadow:inset 0 0 0 2.2px var(--vinho)}
.chip[data-k="aferir"] .bolha{background:none;border:1.4px dashed var(--tinta);opacity:.6}
.chip .rot{flex:1}
.chip .qtd{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);color:var(--chumbo)}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] .rot{text-decoration:line-through}
.chip[data-k="aferir"][aria-pressed="false"]{opacity:1}
.chip[data-k="aferir"][aria-pressed="false"] .rot{text-decoration:none}
.chip[data-k="aferir"][aria-pressed="true"]{background:#79242F14;box-shadow:inset 0 0 0 1px #79242F4d}

.nota{margin-top:11px;padding-top:10px;border-top:1px solid var(--hair);
  font-size:var(--fs-cap);line-height:1.6;color:var(--chumbo)}
.nota b{color:var(--tinta);font-weight:500}

.vistas{position:absolute;right:var(--gut);top:var(--gut);display:flex;
  border:1px solid var(--hair);background:#F3EEE7e6}
.vistas button{padding:7px 13px;font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.12em;text-transform:uppercase;color:var(--chumbo)}
.vistas button+button{border-left:1px solid var(--hair)}
.vistas button[aria-pressed="true"]{background:var(--vinho);color:var(--papel)}

.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-135%);
  background:var(--tinta);color:var(--papel);padding:5px 9px;white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.06em;
  text-transform:uppercase;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}

/* ───────── dossiê ───────── */
.dossie{border-left:1px solid var(--hair);background:#231F2008;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}

.ficha{padding:calc(var(--gut)*.85) var(--gut);border-bottom:1px solid var(--hair);background:var(--papel)}
.ficha.vazia{color:var(--chumbo)}
.ficha .vazio-t{font-weight:500;font-size:16px;color:var(--tinta);margin-bottom:5px;letter-spacing:-.01em}
.cabeca{display:flex;gap:14px;align-items:flex-start}
.medalha{
  --anel:var(--vinho);
  width:72px;height:72px;flex:0 0 auto;border-radius:50%;
  border:2px solid var(--anel);display:grid;place-items:center;
  background:repeating-linear-gradient(48deg,#231F2012 0 1px,transparent 1px 7px),#79242F0f;
  font-weight:600;font-size:21px;color:var(--vinho);letter-spacing:.01em;
}
.medalha.pos{--anel:#79242F59}
.medalha.comfoto{background-size:cover;background-position:center;color:transparent}
.cabeca .id{min-width:0}
.cabeca h3{font-weight:500;font-size:clamp(16px,1.45vw,20px);line-height:1.18;letter-spacing:-.015em}
.selo{display:inline-flex;align-items:center;gap:7px;margin-top:8px;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase}
.selo::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--vinho)}
.selo.pos::before{background:var(--papel);box-shadow:inset 0 0 0 2px var(--vinho)}
.local{margin-top:8px;font-size:var(--fs-cap);color:var(--chumbo);line-height:1.65}

.campos{margin-top:15px;border-top:1px solid var(--hair)}
.campos div{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #231F2014}
.campos dt{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--chumbo)}
.campos dd{font-size:var(--fs-cap);line-height:1.55}
.campos dd.pend{color:var(--vinho);border-left:2px dashed #79242F80;padding-left:8px;margin-left:-2px}

.busca{padding:11px var(--gut);border-bottom:1px solid var(--hair);display:flex;gap:9px;align-items:center;background:var(--papel)}
.busca input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--hair);
  color:var(--tinta);font-family:var(--sans);font-size:var(--fs-ui);padding:5px 0}
.busca input::placeholder{color:#231F2073}
.busca input:focus{outline:0;border-bottom-color:var(--vinho)}
.limpar{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.1em;
  text-transform:uppercase;color:var(--vinho);visibility:hidden}
.limpar.on{visibility:visible}

.lista{overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--gut)}
.grupo{position:sticky;top:0;z-index:2;background:var(--papel);
  display:flex;align-items:baseline;gap:8px;
  padding:12px var(--gut) 6px;border-bottom:1px solid var(--hair)}
.grupo .dn{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase}
.grupo .sp{font-size:var(--fs-cap);color:#231F2080;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo .dq{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);color:var(--chumbo)}

.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px var(--gut);border-bottom:1px solid #231F200f;transition:background .14s}
.item:hover{background:#231F200d}
.item.sel{background:#79242F14;box-shadow:inset 3px 0 0 var(--vinho)}
.item .mk{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.item[data-st="ativo"] .mk{background:var(--vinho)}
.item[data-st="pos"]   .mk{background:var(--papel);box-shadow:inset 0 0 0 2px var(--vinho)}
.item .nm{flex:1;min-width:0;line-height:1.35}
.item .af{font-family:var(--label);font-weight:600;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--vinho);border:1px dashed #79242F73;padding:1px 5px;flex:0 0 auto}
.vago{padding:var(--gut);color:var(--chumbo)}

/* ───────── linha-guia ───────── */
.guia{position:fixed;inset:0;pointer-events:none;z-index:4}
.guia path{fill:none;stroke:var(--vinho);stroke-width:1.3;stroke-dasharray:2 5;stroke-linecap:round;
  opacity:0;transition:opacity .22s ease}
.guia.on path{opacity:.85;animation:formiga 9s linear infinite}
.guia circle{fill:var(--vinho);opacity:0;transition:opacity .22s}
.guia.on circle{opacity:.9}
@keyframes formiga{to{stroke-dashoffset:-160}}

/* ───────── modo limpo (projeção) ───────── */
.limpo-btn{position:absolute;right:var(--gut);bottom:var(--gut);
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--chumbo);border:1px solid var(--hair);
  background:#F3EEE7e6;padding:7px 12px}
.limpo-btn:hover{color:var(--vinho);border-color:#79242F59}
body.limpo .dossie{display:none}
body.limpo .corpo{grid-template-columns:1fr}
body.limpo .guia{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  .corpo{grid-template-columns:1fr}
  .mapa{height:62vh;min-height:360px}
  .dossie{border-left:0;border-top:1px solid var(--hair);display:block}
  .lista{overflow:visible}
  .guia,.limpo-btn{display:none}
  .num{gap:16px}
  .topo{align-items:flex-start}
  .painel-mapa{left:0;right:0;bottom:0;max-width:none;border-left:0;border-right:0;border-bottom:0}
  .painel-mapa h2{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;gap:2px 14px}
  .chip{width:auto}
  .chip .rot{flex:0 0 auto}
}

/* 3. PREPARO */
const D = {};
GEO.distritos.forEach(d => D[d.n] = d);
const conta = {};
ACERVO.forEach(p => conta[p.dist] = (conta[p.dist] || 0) + 1);

const usado = {};
ACERVO.forEach((p, i) => {
  p.id = 'p' + i;
  const d = D[p.dist];
  if (!d) { p.x = 0; p.y = 0; p.semGeo = true; return; }
  const k = usado[p.dist] = (usado[p.dist] || 0);
  usado[p.dist]++;
  if (k === 0 && conta[p.dist] === 1) { p.x = d.x; p.y = d.y; }
  else {
    const a = k * 2.399963, r = 4.5 + 3.6 * Math.sqrt(k);
    p.x = d.x + Math.cos(a) * r;
    p.y = d.y + Math.sin(a) * r * .92;
  }
  p.sub = d.s;
});

const inicial = n => n.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim().split(/\s+/)
  .filter(w => w.length > 2).slice(0,2).map(w => w[0].toUpperCase()).join('');

const ACENTO = [['Sao','São'],['Jose','José'],['Agua','Água'],['Se','Sé'],['Bras','Brás'],
  ['Belem','Belém'],['Consolacao','Consolação'],['Cecilia','Cecília'],['Republica','República'],
  ['Saude','Saúde'],['Tatuape','Tatuapé'],['Sacoma','Sacomã'],['Butanta','Butantã'],
  ['Brasilandia','Brasilândia'],['Cangaiba','Cangaíba'],['Capao','Capão'],['Carrao','Carrão'],
  ['O','Ó'],['Jacana','Jacanã'],['Jaragua','Jaraguá'],['Angela','Ângela'],['Luis','Luís'],
  ['Bonifacio','Bonifácio'],['Tremembe','Tremembé'],['Curuca','Curuçá'],['Jacui','Jacuí'],
  ['Sonia','Sônia'],['Lider','Líder'],['Grajau','Grajaú'],['Limao','Limão']];
const rot = s => {
  let r = s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m,a,b) => a + b.toUpperCase());
  ACENTO.forEach(([a,b]) => r = r.replace(new RegExp('\\b' + a + '\\b','g'), b));
  return r;
};
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* 4. ESTADO */
const est = { st:new Set(['ativo','pos']), soAferir:false, q:'', dist:null, sel:null, vista:'centro' };
const VISTAS = { centro:[250,372,330,300], cidade:[-14,-14,GEO.w+28,GEO.h+28] };

const visivel = p =>
  est.st.has(p.st) &&
  (!est.soAferir || p.aferir) &&
  (!est.dist || p.dist === est.dist) &&
  (!est.q || norm(p.n).includes(est.q) || norm(p.dist).includes(est.q) || norm(p.sub||'').includes(est.q));

/* 5. MAPA */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mapa');
const tip = document.getElementById('tip');
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
svg.setAttribute('viewBox', VISTAS.centro.join(' '));

const gTerra = document.createElementNS(NS,'g'); gTerra.setAttribute('class','terra');
const gPins  = document.createElementNS(NS,'g'); gPins.setAttribute('class','pins');
svg.append(gTerra, gPins);

GEO.distritos.forEach(d => {
  const c = conta[d.n] || 0;
  const path = document.createElementNS(NS,'path');
  path.setAttribute('d', d.d);
  path.setAttribute('class', c === 0 ? 'c0' : c <= 2 ? 'c1' : c <= 4 ? 'c2' : 'c3');
  path.dataset.dist = d.n;
  if (c) {
    path.style.cursor = 'pointer';
    path.addEventListener('click', e => { e.stopPropagation(); filtraDistrito(d.n); });
  }
  path.addEventListener('pointerenter', () => mostraTip(rot(d.n) + (c ? ' · ' + c + (c>1?' imóveis':' imóvel') : ''), path));
  path.addEventListener('pointerleave', escondeTip);
  d.el = path;
  gTerra.append(path);
});

ACERVO.forEach(p => {
  if (p.semGeo) return;
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','pin'); g.dataset.st = p.st; g.dataset.id = p.id;
  g.setAttribute('tabindex','0'); g.setAttribute('role','button');
  g.setAttribute('aria-label', p.n + ' — ' + (p.st === 'ativo' ? 'contrato ativo' : 'serviços pós-contrato'));
  const halo = document.createElementNS(NS,'circle'); halo.setAttribute('class','halo');
  const conf = p.aferir ? document.createElementNS(NS,'circle') : null;
  if (conf) conf.setAttribute('class','conf');
  const pt = document.createElementNS(NS,'circle'); pt.setAttribute('class','ponto');
  [halo, conf, pt].filter(Boolean).forEach(c => { c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); g.append(c); });
  g.addEventListener('click', e => { e.stopPropagation(); seleciona(p.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seleciona(p.id); } });
  g.addEventListener('pointerenter', () => mostraTip(p.n, pt));
  g.addEventListener('pointerleave', escondeTip);
  g.addEventListener('focus', () => mostraTip(p.n, pt));
  g.addEventListener('blur', escondeTip);
  p.cir = {halo, conf, pt};
  p.el = g;
  gPins.append(g);
});
svg.addEventListener('click', () => seleciona(null));

function mostraTip(txt, ref){
  const r = ref.getBoundingClientRect(), m = svg.getBoundingClientRect();
  tip.textContent = txt;
  tip.style.left = (r.left + r.width/2 - m.left) + 'px';
  tip.style.top  = (r.top - m.top) + 'px';
  tip.classList.add('on');
}
function escondeTip(){ tip.classList.remove('on'); }

let anim;
function setVista(v){
  est.vista = v;
  document.getElementById('v-centro').setAttribute('aria-pressed', v === 'centro');
  document.getElementById('v-cidade').setAttribute('aria-pressed', v === 'cidade');
  const de = svg.getAttribute('viewBox').split(' ').map(Number), para = VISTAS[v];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    svg.setAttribute('viewBox', para.join(' ')); desenhaGuia(); posicionaRotulos(); return;
  }
  cancelAnimationFrame(anim);
  const t0 = performance.now(), dur = 620;
  (function passo(t){
    const k = Math.min(1,(t-t0)/dur), e = 1 - Math.pow(1-k,3);
    svg.setAttribute('viewBox', de.map((a,i) => (a + (para[i]-a)*e).toFixed(1)).join(' '));
    desenhaGuia(); posicionaRotulos();
    if (k < 1) anim = requestAnimationFrame(passo);
  })(t0);
}
document.getElementById('v-centro').onclick = () => setVista('centro');
document.getElementById('v-cidade').onclick = () => setVista('cidade');

/* 6. CONTADORES E FILTROS */
const num = document.getElementById('num');
const linhaNum = (k,v) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>';
function pintaNumeros(){
  const vis = ACERVO.filter(visivel);
  const ds = new Set(vis.map(p => p.dist)), sp = new Set(vis.map(p => p.sub));
  num.innerHTML =
    linhaNum('imóveis', vis.length + (vis.length < ACERVO.length ? ' <span>/ ' + ACERVO.length + '</span>' : '')) +
    linhaNum('distritos', ds.size) +
    linhaNum('subprefeituras', sp.size);
}

const chips = document.getElementById('chips');
const DEFS = [
  {k:'ativo',  rot:'Contrato ativo'},
  {k:'pos',    rot:'Serviços pós-contrato'},
  {k:'aferir', rot:'Endereço a confirmar'}
];
chips.innerHTML = DEFS.map(d => {
  const q = d.k === 'aferir' ? ACERVO.filter(p => p.aferir).length : ACERVO.filter(p => p.st === d.k).length;
  const lig = d.k === 'aferir' ? 'false' : 'true';
  const tit = d.k === 'aferir' ? ' title="isolar só os que faltam confirmar"' : ' title="mostrar ou esconder no mapa"';
  return '<button class="chip" data-k="' + d.k + '" aria-pressed="' + lig + '"' + tit + '>' +
    '<span class="bolha"></span><span class="rot">' + d.rot + '</span><span class="qtd">' + q + '</span></button>';
}).join('');

chips.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'aferir') { est.soAferir = !est.soAferir; b.setAttribute('aria-pressed', est.soAferir); }
  else {
    if (est.st.has(k)) { if (est.st.size === 1) return; est.st.delete(k); } else est.st.add(k);
    b.setAttribute('aria-pressed', est.st.has(k));
  }
  pinta();
});

document.getElementById('nota').innerHTML =
  'Cada imóvel está no <b>centroide do seu distrito</b>, não no lote — ' +
  ACERVO.filter(p => p.aferir).length + ' dos ' + ACERVO.length +
  ' ainda dependem de endereço confirmado com o Estúdio Sarasá. ' +
  'Clique num distrito para isolá-lo; num status, para filtrar.' +
  '<br><span style="opacity:.7">Base cartográfica: distritos administrativos de São Paulo · GeoSampa.</span>';

function filtraDistrito(d){ est.dist = est.dist === d ? null : d; est.sel = null; pinta(); }

/* 7. LISTA */
const lista = document.getElementById('lista');
const acha = id => ACERVO.find(p => p.id === id);
function pintaLista(){
  const vis = ACERVO.filter(visivel);
  if (!vis.length){ lista.innerHTML = '<p class="vago">Nada encontrado com esse recorte. Reative um status ou limpe a busca.</p>'; return; }
  const grupos = {};
  vis.forEach(p => (grupos[p.dist] = grupos[p.dist] || []).push(p));
  const ordem = Object.keys(grupos).sort((a,b) => grupos[b].length - grupos[a].length || a.localeCompare(b,'pt'));
  lista.innerHTML = ordem.map(d =>
    '<div class="grupo"><span class="dn">' + rot(d) + '</span>' +
    '<span class="sp">subpref. ' + rot((D[d] && D[d].s) || '—') + '</span>' +
    '<span class="dq">' + grupos[d].length + '</span></div>' +
    grupos[d].sort((a,b) => a.n.localeCompare(b.n,'pt')).map(p =>
      '<button class="item' + (est.sel === p.id ? ' sel' : '') + '" data-st="' + p.st + '" data-id="' + p.id + '">' +
      '<span class="mk"></span><span class="nm">' + p.n + '</span>' +
      (p.aferir ? '<span class="af" title="endereço a confirmar">aferir</span>' : '') +
      '</button>').join('')
  ).join('');
  lista.querySelectorAll('.item').forEach(b => {
    b.onclick = () => seleciona(b.dataset.id);
    b.onpointerenter = () => { const p = acha(b.dataset.id); if (p && p.el) p.el.classList.add('sel'); };
    b.onpointerleave = () => { const p = acha(b.dataset.id); if (p && p.el && est.sel !== p.id) p.el.classList.remove('sel'); };
  });
}

const q = document.getElementById('q'), limpar = document.getElementById('limpar');
q.addEventListener('input', () => {
  est.q = norm(q.value.trim());
  limpar.classList.toggle('on', !!q.value);
  est.sel = null; pinta();
});
limpar.onclick = () => { q.value = ''; est.q = ''; limpar.classList.remove('on'); pinta(); q.focus(); };

/* 8. FICHA */
const ficha = document.getElementById('ficha');
function pintaFicha(){
  const p = acha(est.sel);
  if (!p){
    ficha.className = 'ficha vazia';
    ficha.innerHTML =
      '<p class="vazio-t">' + (est.dist ? rot(est.dist) + ' isolado no mapa' : 'Nenhum imóvel aberto') + '</p>' +
      '<p>' + (est.dist ? 'Clique de novo no distrito para voltar à cidade, ou abra um imóvel da lista.'
                        : 'Clique num ponto do mapa ou num item da lista para abrir a ficha.') + '</p>';
    return;
  }
  ficha.className = 'ficha';
  const pend = t => '<dd class="pend">' + t + '</dd>';
  ficha.innerHTML =
    '<div class="cabeca">' +
      '<div class="medalha' + (p.st === 'pos' ? ' pos' : '') + (p.foto ? ' comfoto' : '') + '"' +
        (p.foto ? ' style="background-image:url(' + p.foto + ')"' : '') + ' aria-hidden="true">' +
        (p.foto ? '' : inicial(p.n)) + '</div>' +
      '<div class="id"><h3>' + p.n + '</h3>' +
      '<span class="selo' + (p.st === 'pos' ? ' pos' : '') + '">' +
        (p.st === 'ativo' ? 'contrato ativo' : 'serviços pós-contrato') + '</span>' +
      '<p class="local">' + rot(p.dist) + '<br>subpref. ' + rot(p.sub || '—') + '</p>' +
      '</div></div>' +
    '<dl class="campos">' +
      '<div><dt>Endereço</dt>' + (p.end ? '<dd>' + p.end + '</dd>' : pend('confirmar com o Estúdio Sarasá')) + '</div>' +
      '<div><dt>Posição</dt>' + (p.aferir ? pend('centroide do distrito · a aferir') : '<dd>centroide do distrito</dd>') + '</div>' +
      '<div><dt>Tombamento</dt>' + (p.tomb ? '<dd>' + p.tomb + '</dd>' : pend('verificar Conpresp / Condephaat / Iphan')) + '</div>' +
      '<div><dt>Escopo</dt>' + (p.escopo ? '<dd>' + p.escopo + '</dd>' : pend('preencher')) + '</div>' +
      '<div><dt>Vigência</dt>' + (p.vig ? '<dd>' + p.vig + '</dd>' : pend('preencher')) + '</div>' +
    '</dl>';
}

/* 9. LINHA-GUIA */
const guia = document.getElementById('guia');
function desenhaGuia(){
  const p = acha(est.sel);
  const alvo = ficha.querySelector('.medalha');
  const largo = innerWidth > 900 && !document.body.classList.contains('limpo');
  if (!p || !p.el || !alvo || !largo || !visivel(p)) { guia.classList.remove('on'); guia.innerHTML = ''; return; }
  const a = p.cir.pt.getBoundingClientRect(), b = alvo.getBoundingClientRect();
  const x1 = a.left + a.width/2, y1 = a.top + a.height/2;
  const x2 = b.left - 10,        y2 = b.top + b.height/2;
  const mx = x1 + (x2 - x1) * .58;
  guia.setAttribute('viewBox','0 0 ' + innerWidth + ' ' + innerHeight);
  guia.innerHTML = '<path d="M' + x1 + ' ' + y1 + ' H' + mx + ' V' + y2 + ' H' + x2 + '"/>' +
                   '<circle cx="' + x2 + '" cy="' + y2 + '" r="2.6"/>';
  guia.classList.add('on');
}

/* rótulos e escala dos pontos */
const camadaRot = document.getElementById('rotulos');
const comContrato = GEO.distritos.filter(d => conta[d.n]);
comContrato.forEach(d => {
  const el = document.createElement('span');
  el.className = 'rot-d'; el.textContent = rot(d.n);
  d.rotEl = el; camadaRot.append(el);
});

function escalaPins(){
  const ctm = svg.getScreenCTM(); if (!ctm) return ctm;
  const k = ctm.a;
  ACERVO.forEach(p => {
    if (!p.cir) return;
    const sel = est.sel === p.id;
    p.cir.pt.setAttribute('r', ((sel ? 8 : 5.4)/k).toFixed(2));
    p.cir.halo.setAttribute('r', (12/k).toFixed(2));
    if (p.cir.conf) p.cir.conf.setAttribute('r', ((sel ? 11.5 : 8.6)/k).toFixed(2));
  });
  return ctm;
}

function posicionaRotulos(){
  const ctm = escalaPins(); if (!ctm) return;
  const m = svg.getBoundingClientRect(), esc = ctm.a;
  const legenda = document.querySelector('.painel-mapa').getBoundingClientRect();
  const mostra = esc > 1.4;
  const pt = svg.createSVGPoint();
  const vis = {};
  ACERVO.forEach(p => { if (visivel(p)) vis[p.dist] = true; });
  comContrato.forEach(d => {
    d.rotEl.style.display = mostra ? '' : 'none';
    if (!mostra) return;
    pt.x = d.x; pt.y = d.y;
    const s = pt.matrixTransform(ctm);
    const raio = (4.5 + 3.6 * Math.sqrt(Math.max(0, conta[d.n]-1))) * esc + 14;
    let y = s.y + raio;
    if (s.x > legenda.left - 40 && s.x < legenda.right + 40 && y > legenda.top - 14) y = s.y - raio - 4;
    d.rotEl.style.left = (s.x - m.left) + 'px';
    d.rotEl.style.top  = (y - m.top) + 'px';
    d.rotEl.classList.toggle('fora', !vis[d.n]);
  });
}

/* 10. ORQUESTRA */
function seleciona(id){
  est.sel = est.sel === id ? null : id;
  pinta();
  if (est.sel){
    const it = lista.querySelector('.item[data-id="' + est.sel + '"]');
    if (it) it.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }
}
function pinta(){
  ACERVO.forEach(p => {
    if (!p.el) return;
    p.el.classList.toggle('fora', !visivel(p));
    p.el.classList.toggle('sel', est.sel === p.id);
  });
  const alvo = acha(est.sel);
  GEO.distritos.forEach(d => {
    d.el.classList.toggle('on', est.dist === d.n || (!!alvo && alvo.dist === d.n));
    d.el.classList.toggle('mudo', !!est.dist && est.dist !== d.n);
  });
  pintaNumeros(); pintaLista(); pintaFicha(); posicionaRotulos();
  requestAnimationFrame(desenhaGuia);
}

const btnLimpo = document.getElementById('limpo');
function modoLimpo(){
  const on = document.body.classList.toggle('limpo');
  btnLimpo.textContent = on ? 'sair da projeção' : 'modo projeção';
  requestAnimationFrame(() => { posicionaRotulos(); desenhaGuia(); });
}
btnLimpo.onclick = modoLimpo;

addEventListener('resize', () => { desenhaGuia(); posicionaRotulos(); });
lista.addEventListener('scroll', desenhaGuia);
addEventListener('keydown', e => {
  if (e.key === 'Escape') { est.dist = null; seleciona(null); }
  if ((e.key === 'p' || e.key === 'P') && e.target.tagName !== 'INPUT') modoLimpo();
});
document.fonts && document.fonts.ready.then(posicionaRotulos);

pinta();
</script>
