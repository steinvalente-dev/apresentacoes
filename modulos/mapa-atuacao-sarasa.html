:root{
  --papel:#F3EEE7;
  --tinta:#231F20;
  --vinho:#79242F;
  --chumbo:#4E4E4E;
  --hair:#231F2026;
  --soft:#231F2099;

  --sans:'Poppins',system-ui,sans-serif;
  --label:'Archivo',system-ui,sans-serif;

  --fs-cap:clamp(9px,.64vw,11px);
  --fs-ui:clamp(11.5px,.82vw,14px);
  --fs-h1:clamp(20px,2.3vw,32px);
  --gut:clamp(14px,2vw,30px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--papel);color:var(--tinta);
  font-family:var(--sans);font-size:var(--fs-ui);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ───────── topo ───────── */
.topo{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--gut);
  flex-wrap:wrap;padding:calc(var(--gut)*.8) var(--gut) calc(var(--gut)*.65);
  border-bottom:1px solid var(--hair);
}
.marca{display:flex;align-items:flex-end;gap:clamp(14px,1.6vw,26px)}
.lockup{width:clamp(118px,11vw,164px);height:auto;display:block;flex:0 0 auto}
.titulo{border-left:1px solid var(--hair);padding-left:clamp(14px,1.6vw,26px)}
.olho{
  display:block;font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.18em;text-transform:uppercase;color:var(--chumbo);margin-bottom:7px;
}
h1{font-weight:500;font-size:var(--fs-h1);line-height:1.12;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--vinho)}

.num{display:flex;gap:clamp(14px,2vw,32px)}
.num div{border-left:1px solid var(--hair);padding-left:13px}
.num dt{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.12em;text-transform:uppercase;color:var(--chumbo)}
.num dd{font-size:clamp(17px,1.55vw,24px);font-weight:500;line-height:1.2;margin-top:2px}
.num dd span{color:#231F2059;font-weight:400}

.corpo{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,400px);min-height:0}

/* ───────── mapa ───────── */
.mapa{position:relative;min-height:0;overflow:hidden;background:var(--papel)}
#mapa{display:block;width:100%;height:100%}

.estados path{
  fill:#231F200A;stroke:#231F2033;stroke-width:.7;vector-effect:non-scaling-stroke;
  transition:fill .25s ease;
}
.estados path.a1{fill:#79242F1f}
.estados path.a2{fill:#79242F47}
.estados path.a3{fill:#79242F8c}
.estados path.on{fill:#79242F59}
.camada{transition:opacity .45s ease}
.camada.off{opacity:0;pointer-events:none}
.sigla{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.16em;
  color:#231F2073;pointer-events:none;transition:opacity .3s ease}

.terra path{
  fill:#231F200A;stroke:#231F2033;stroke-width:.6;vector-effect:non-scaling-stroke;
  transition:fill .22s ease;
}
.terra path.c1{fill:#79242F26}
.terra path.c2{fill:#79242F4d}
.terra path.c3{fill:#79242F73}
.terra path.on{fill:#79242F99;stroke:var(--tinta);stroke-width:1.1}
.terra path.mudo{fill:#231F2005;stroke:#231F201f}

.pin{cursor:pointer}
.pin .ponto{stroke-width:1.3;vector-effect:non-scaling-stroke}
.pin[data-st="ativo"] .ponto{fill:var(--vinho);stroke:var(--papel)}
.pin[data-st="pos"]   .ponto{fill:var(--papel);stroke:var(--vinho);stroke-width:2.2}
.pin[data-st="exec"]  .ponto{fill:var(--vinho);stroke:var(--papel)}
.pin[data-st="capital"] .ponto{fill:var(--vinho);stroke:var(--papel);stroke-width:2.6}
.pin[data-st="capital"] .halo{opacity:.5}
.pin .conf{fill:none;stroke:var(--tinta);stroke-width:1;stroke-dasharray:2 2.6;
  vector-effect:non-scaling-stroke;opacity:.5}
.pin .alvo{fill:#00000001}            /* área de pegada: invisível, bem maior que o ponto */
.pin .halo{fill:none;stroke:var(--tinta);stroke-width:1.3;vector-effect:non-scaling-stroke;
  opacity:0;transition:opacity .18s}
.pin:hover .halo,.pin:focus-visible .halo,.pin.sel .halo{opacity:.9}
.pin.fora{opacity:.12;pointer-events:none}

.rotulos{position:absolute;inset:0;pointer-events:none}
.rot-d{position:absolute;transform:translate(-50%,0);white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.14em;text-transform:uppercase;color:#231F20a6;
  text-shadow:0 0 4px var(--papel),0 0 8px var(--papel);transition:opacity .2s}
.rot-d.fora{opacity:.26}

/* legenda */
.painel-mapa{
  position:absolute;left:var(--gut);bottom:var(--gut);z-index:6;max-width:min(350px,calc(100% - var(--gut)*2));
  background:#F3EEE7ee;backdrop-filter:blur(5px);border:1px solid var(--hair);padding:14px 16px 12px;
}
.painel-mapa h2{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.2em;text-transform:uppercase;color:var(--chumbo);margin-bottom:11px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  padding:4px 6px;margin-left:-6px;transition:background .15s}
.chip:hover{background:#231F200d}
.chip .bolha{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.chip[data-k="ativo"] .bolha{background:var(--vinho)}
.chip[data-k="pos"] .bolha{background:var(--papel);box-shadow:inset 0 0 0 2.2px var(--vinho)}
.chip[data-k="aferir"] .bolha{background:none;border:1.4px dashed var(--tinta);opacity:.6}
.chip .rot{flex:1}
.chip .qtd{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);color:var(--chumbo)}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] .rot{text-decoration:line-through}
.chip[data-k="aferir"][aria-pressed="false"]{opacity:1}
.chip[data-k="aferir"][aria-pressed="false"] .rot{text-decoration:none}
.chip[data-k="aferir"][aria-pressed="true"]{background:#79242F14;box-shadow:inset 0 0 0 1px #79242F4d}

.nota{margin-top:11px;padding-top:10px;border-top:1px solid var(--hair);
  font-size:var(--fs-cap);line-height:1.6;color:var(--chumbo)}
.nota b{color:var(--tinta);font-weight:500}

.vistas{position:absolute;left:var(--gut);top:var(--gut);z-index:6;display:flex;
  border:1px solid var(--hair);background:#F3EEE7e6}
.vistas button{padding:7px 13px;font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.12em;text-transform:uppercase;color:var(--chumbo)}
.vistas button+button{border-left:1px solid var(--hair)}
.vistas button[aria-pressed="true"]{background:var(--vinho);color:var(--papel)}

.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--tinta);color:var(--papel);padding:5px 9px;white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.06em;
  text-transform:uppercase;transition:opacity .12s;z-index:8}
.tip.on{opacity:1}
/* com foto: vira cartão claro com a miniatura do imóvel */
/* com foto: a imagem solta, sem caixa — só a pílula atrás do nome */
.tip.comfoto{background:none;border:0;padding:0;box-shadow:none;
  text-transform:none;letter-spacing:0;white-space:normal}
.tip .alma{display:flex;flex-direction:column;align-items:center;gap:9px;
  opacity:0;transform:translateY(7px) scale(.93);
  transition:opacity .2s ease,transform .26s cubic-bezier(.2,.9,.3,1)}
.tip.on .alma{opacity:1;transform:none}
.tip.comfoto img{width:104px;height:104px;border-radius:50%;display:block;
  box-shadow:0 0 0 2px var(--vinho),0 12px 26px #231F2040;
  animation:surge .42s cubic-bezier(.2,.9,.3,1) both}
.tip.comfoto.pos img{box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--vinho),0 12px 26px #231F2040}
.pil{display:inline-flex;align-items:center;gap:8px;max-width:230px;
  background:var(--tinta);color:var(--papel);border-radius:999px;padding:6px 14px;
  font-family:var(--sans);font-weight:500;font-size:var(--fs-ui);line-height:1.25;
  text-align:center;box-shadow:0 6px 16px #231F2033}
.pil .st{font-family:var(--label);font-weight:600;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:#F3EEE7a6;display:inline-flex;align-items:center;gap:6px;
  padding-left:9px;border-left:1px solid #F3EEE73d;flex:0 0 auto}
.pil .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--papel)}
.tip.comfoto.pos .pil .st::before{background:var(--tinta);box-shadow:inset 0 0 0 2px var(--papel)}
@keyframes surge{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* ───────── dossiê ───────── */
.dossie{border-left:1px solid var(--hair);background:#231F2008;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}

.ficha{padding:calc(var(--gut)*.85) var(--gut);border-bottom:1px solid var(--hair);background:var(--papel);
  transition:background .25s ease,color .25s ease}
.ficha.vazia{color:var(--chumbo)}
/* imóvel aberto: a ficha vira campo Vinho e passa a ser a coisa mais forte da tela */
.ficha:not(.vazia){background:var(--vinho);color:var(--papel);border-bottom-color:var(--vinho)}
.ficha:not(.vazia) .local{color:#F3EEE7b3}
.ficha:not(.vazia) .campos{border-top-color:#F3EEE740}
.ficha:not(.vazia) .campos div{border-bottom-color:#F3EEE726}
.ficha:not(.vazia) .campos dt{color:#F3EEE7a6}
.ficha:not(.vazia) .campos dd.pend{color:#F3EEE7;border-left-color:#F3EEE780}
.ficha:not(.vazia) .medalha{border-color:var(--papel);
  background:repeating-linear-gradient(48deg,#F3EEE71f 0 1px,transparent 1px 7px),#F3EEE71a;color:var(--papel)}
.ficha:not(.vazia) .selo::before{background:var(--papel)}
.ficha:not(.vazia) .selo.pos::before{background:transparent;box-shadow:inset 0 0 0 2px var(--papel)}
.ficha .vazio-t{font-weight:500;font-size:16px;color:var(--tinta);margin-bottom:5px;letter-spacing:-.01em}
.cabeca{display:flex;gap:14px;align-items:flex-start}
.medalha{
  --anel:var(--vinho);
  width:72px;height:72px;flex:0 0 auto;border-radius:50%;
  border:2px solid var(--anel);display:grid;place-items:center;
  background:repeating-linear-gradient(48deg,#231F2012 0 1px,transparent 1px 7px),#79242F0f;
  font-weight:600;font-size:21px;color:var(--vinho);letter-spacing:.01em;
}
.medalha.pos{--anel:#79242F59}
.medalha.comfoto{background-size:cover;background-position:center;color:transparent;
  background-color:transparent;background-image:none}
.medalha.comfoto img{width:100%;height:100%;border-radius:50%;display:block}
.cabeca .id{min-width:0}
.cabeca h3{font-weight:500;font-size:clamp(16px,1.45vw,20px);line-height:1.18;letter-spacing:-.015em}
.selo{display:inline-flex;align-items:center;gap:7px;margin-top:8px;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase}
.selo::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--vinho)}
.selo.pos::before{background:var(--papel);box-shadow:inset 0 0 0 2px var(--vinho)}
.local{margin-top:8px;font-size:var(--fs-cap);color:var(--chumbo);line-height:1.65}

.campos{margin-top:15px;border-top:1px solid var(--hair)}
.campos div{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #231F2014}
.campos dt{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--chumbo)}
.campos dd{font-size:var(--fs-cap);line-height:1.55}
.campos dd.pend{color:var(--vinho);border-left:2px dashed #79242F80;padding-left:8px;margin-left:-2px}

.busca{padding:11px var(--gut);border-bottom:1px solid var(--hair);display:flex;gap:9px;align-items:center;background:var(--papel)}
.busca input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--hair);
  color:var(--tinta);font-family:var(--sans);font-size:var(--fs-ui);padding:5px 0}
.busca input::placeholder{color:#231F2073}
.busca input:focus{outline:0;border-bottom-color:var(--vinho)}
.limpar{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.1em;
  text-transform:uppercase;color:var(--vinho);visibility:hidden}
.limpar.on{visibility:visible}

.lista{overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--gut)}
.grupo{position:sticky;top:0;z-index:2;background:var(--papel);
  display:flex;align-items:baseline;gap:8px;
  padding:12px var(--gut) 6px;border-bottom:1px solid var(--hair)}
.grupo .dn{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase}
.grupo .sp{font-size:var(--fs-cap);color:#231F2080;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo .dq{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);color:var(--chumbo)}

.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px var(--gut);border-bottom:1px solid #231F200f;transition:background .14s}
.item:hover{background:#231F200d}
.item.sel{background:#79242F14;box-shadow:inset 3px 0 0 var(--vinho)}
.item .mk{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.item[data-st="ativo"] .mk{background:var(--vinho)}
.item[data-st="pos"]   .mk{background:var(--papel);box-shadow:inset 0 0 0 2px var(--vinho)}
.item[data-st="exec"]  .mk{background:var(--vinho)}
.item[data-st="capital"] .mk{background:var(--vinho);box-shadow:0 0 0 3px #79242F33}
.item .nm{flex:1;min-width:0;line-height:1.35}
.item .af{font-family:var(--label);font-weight:600;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--vinho);border:1px dashed #79242F73;padding:1px 5px;flex:0 0 auto}
.vago{padding:var(--gut);color:var(--chumbo)}

/* ───────── linha-guia ───────── */
.guia{position:fixed;inset:0;pointer-events:none;z-index:4}
.guia path{fill:none;stroke:var(--vinho);stroke-width:2.4;stroke-dasharray:3 6.5;stroke-linecap:round;
  opacity:0;transition:opacity .22s ease}
.guia.on path{opacity:1;animation:formiga 7s linear infinite}
.guia circle{fill:var(--vinho);opacity:0;transition:opacity .22s}
.guia.on circle{opacity:.9}
@keyframes formiga{to{stroke-dashoffset:-160}}

/* ───────── modo panorama: a carteira inteira, em varredura ───────── */
#panorama{position:absolute;inset:0;pointer-events:none;z-index:3}
.pan-links{position:absolute;inset:0;width:100%;height:100%}
.pan-links line{stroke:#231F2059;stroke-width:1.2;opacity:0;transition:opacity .5s ease}
.pan-links line.on{opacity:1}
.medalhao{
  position:absolute;border-radius:50%;pointer-events:auto;cursor:pointer;
  background:var(--papel) center/cover no-repeat;
  box-shadow:0 0 0 2px var(--vinho),0 8px 18px #231F2033;
  opacity:0;transform:translate(-50%,-50%) scale(.55);
  transition:opacity .5s ease,transform .62s cubic-bezier(.18,.9,.28,1),
             box-shadow .2s ease;
}
.medalhao.pos{box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--vinho),0 8px 18px #231F2033}
.medalhao.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.medalhao.on:hover{transform:translate(-50%,-50%) scale(1.22);z-index:4;
  box-shadow:0 0 0 2px var(--vinho),0 14px 30px #231F2059}
.medalhao.fora{opacity:.1}
body.panorama .rot-d{display:none!important}
body.panorama .pins{opacity:.3}
body.panorama .estados path{
  fill:#231F200A;stroke:#231F2033;stroke-width:.7;vector-effect:non-scaling-stroke;
  transition:fill .25s ease;
}
.estados path.a1{fill:#79242F1f}
.estados path.a2{fill:#79242F47}
.estados path.a3{fill:#79242F8c}
.estados path.on{fill:#79242F59}
.camada{transition:opacity .45s ease}
.camada.off{opacity:0;pointer-events:none}
.sigla{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.16em;
  color:#231F2073;pointer-events:none;transition:opacity .3s ease}

.terra path{pointer-events:none!important;cursor:default!important}
body.panorama .estados path{
  fill:#231F200A;stroke:#231F2033;stroke-width:.7;vector-effect:non-scaling-stroke;
  transition:fill .25s ease;
}
.estados path.a1{fill:#79242F1f}
.estados path.a2{fill:#79242F47}
.estados path.a3{fill:#79242F8c}
.estados path.on{fill:#79242F59}
.camada{transition:opacity .45s ease}
.camada.off{opacity:0;pointer-events:none}
.sigla{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.16em;
  color:#231F2073;pointer-events:none;transition:opacity .3s ease}

.terra path{fill:#231F2008}
body.panorama .terra path.c1,body.panorama .terra path.c2,body.panorama .terra path.c3{fill:#79242F1a}

/* ───────── modo limpo (projeção) ───────── */
.botoes{position:absolute;right:var(--gut);bottom:var(--gut);z-index:6;display:flex;gap:8px}
.limpo-btn{
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--chumbo);border:1px solid var(--hair);
  background:#F3EEE7e6;padding:7px 12px}
.limpo-btn:hover{color:var(--vinho);border-color:#79242F59}
.limpo-btn[aria-pressed="true"]{background:var(--vinho);color:var(--papel);border-color:var(--vinho)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  .corpo{grid-template-columns:1fr}
  .mapa{height:62vh;min-height:360px}
  .dossie{border-left:0;border-top:1px solid var(--hair);display:block}
  .lista{overflow:visible}
  .guia,.botoes{display:none}
  .num{gap:16px}
  .topo{align-items:flex-start}
  .painel-mapa{left:0;right:0;bottom:0;max-width:none;border-left:0;border-right:0;border-bottom:0}
  .painel-mapa h2{display:none}
  .chips{flex-direction:row;flex-wrap:wrap;gap:2px 14px}
  .chip{width:auto}
  .chip .rot{flex:0 0 auto}
}
</style>
</head>

/* 3. PREPARO */
ACERVO.forEach(p => { if (FOTOS[p.n]) p.foto = FOTOS[p.n]; });

/* obras do portfólio fora da capital + a capital como porta de entrada */
OBRAS_BR.forEach((o, i) => {
  o.id = 'b' + i;
  o.st = o.capital ? 'capital' : 'exec';
  if (o.capital && !o.foto) o.foto = FOTOS['Edifício Martinelli'];
});
/* intensidade lida do "MAPA DE ATUAÇÃO" do portfólio 2026, p.9 — nove estados.
   3 = São Paulo · 2 = atuação com obra listada · 1 = atuação declarada, sem obra aqui */
const ATUACAO = {SP:3, RJ:2, RS:2, MS:2, PE:2, MA:2, AM:2, BA:1, MT:1};
const UF_COM_OBRA = new Set(OBRAS_BR.map(o => o.uf));
const CIDADES_BR  = new Set(OBRAS_BR.map(o => o.c));

const D = {};
GEO.distritos.forEach(d => D[d.n] = d);
const conta = {};
ACERVO.forEach(p => conta[p.dist] = (conta[p.dist] || 0) + 1);

const usado = {};
ACERVO.forEach((p, i) => {
  p.id = 'p' + i;
  const d = D[p.dist];
  if (!d) { p.x = 0; p.y = 0; p.semGeo = true; return; }
  const k = usado[p.dist] = (usado[p.dist] || 0);
  usado[p.dist]++;
  if (k === 0 && conta[p.dist] === 1) { p.x = d.x; p.y = d.y; }
  else {
    const a = k * 2.399963, r = 4.5 + 3.6 * Math.sqrt(k);
    p.x = d.x + Math.cos(a) * r;
    p.y = d.y + Math.sin(a) * r * .92;
  }
  p.sub = d.s;
});

const inicial = n => n.replace(/[^A-Za-zÀ-ÿ ]/g,'').trim().split(/\s+/)
  .filter(w => w.length > 2).slice(0,2).map(w => w[0].toUpperCase()).join('');

const ACENTO = [['Sao','São'],['Jose','José'],['Agua','Água'],['Se','Sé'],['Bras','Brás'],
  ['Belem','Belém'],['Consolacao','Consolação'],['Cecilia','Cecília'],['Republica','República'],
  ['Saude','Saúde'],['Tatuape','Tatuapé'],['Sacoma','Sacomã'],['Butanta','Butantã'],
  ['Brasilandia','Brasilândia'],['Cangaiba','Cangaíba'],['Capao','Capão'],['Carrao','Carrão'],
  ['O','Ó'],['Jacana','Jacanã'],['Jaragua','Jaraguá'],['Angela','Ângela'],['Luis','Luís'],
  ['Bonifacio','Bonifácio'],['Tremembe','Tremembé'],['Curuca','Curuçá'],['Jacui','Jacuí'],
  ['Sonia','Sônia'],['Lider','Líder'],['Grajau','Grajaú'],['Limao','Limão']];
const rot = s => {
  let r = s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m,a,b) => a + b.toUpperCase());
  ACENTO.forEach(([a,b]) => r = r.replace(new RegExp('\\b' + a + '\\b','g'), b));
  return r;
};
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* 4. ESTADO */
let nivel = 'cidade';            /* 'brasil' | 'cidade' — decidido pela largura do viewBox */
const itens = () => nivel === 'brasil' ? OBRAS_BR : ACERVO;
const est = { st:new Set(['ativo','pos']), soAferir:false, q:'', dist:null, sel:null, vista:'centro' };
const VISTAS = {
  centro:[250,372,330,300],
  cidade:[-14,-14,GEO.w+28,GEO.h+28],
  brasil:(function(c){ const f=.04; return [c[0]-c[2]*f, c[1]-c[3]*f, c[2]*(1+f*2), c[3]*(1+f*2)]; })(BR.caixa)
};
/* abaixo de 3.000 unidades de largura a leitura é de cidade; acima, de país */
const CORTE = 3000;

/* o panorama enquadra só a mancha dos imóveis — é o que enche a tela */
function vistaPanorama(){
  const vis = itens().filter(p => !p.semGeo && visivel(p));
  if (!vis.length) return VISTAS.centro;
  const xs = vis.map(p => p.x), ys = vis.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = Math.max(26, (x1-x0)*.10), py = Math.max(26, (y1-y0)*.12);
  return [x0-px, y0-py, (x1-x0)+px*2, (y1-y0)+py*2];
}

const visivel = p => (p.uf !== undefined)
  ? (!est.q || norm(p.n).includes(est.q) || norm(p.c).includes(est.q))
  : (est.st.has(p.st) &&
     (!est.soAferir || p.aferir) &&
     (!est.dist || p.dist === est.dist) &&
     (!est.q || norm(p.n).includes(est.q) || norm(p.dist).includes(est.q) || norm(p.sub||'').includes(est.q)));

/* 5. MAPA */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mapa');
const tip = document.getElementById('tip');
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
svg.setAttribute('viewBox', VISTAS.centro.join(' '));

const gEstados = document.createElementNS(NS,'g'); gEstados.setAttribute('class','estados camada');
const gObras   = document.createElementNS(NS,'g'); gObras.setAttribute('class','pins camada');
const gTerra   = document.createElementNS(NS,'g'); gTerra.setAttribute('class','terra camada');
const gPins    = document.createElementNS(NS,'g'); gPins.setAttribute('class','pins camada');
svg.append(gEstados, gTerra, gObras, gPins);

BR.estados.forEach(e => {
  const path = document.createElementNS(NS,'path');
  path.setAttribute('d', e.d);
  if (ATUACAO[e.n]) path.setAttribute('class','a' + ATUACAO[e.n]);
  path.dataset.uf = e.n;
  path.addEventListener('pointerenter', () => {
    if (nivel !== 'brasil' || panAtivo || !ATUACAO[e.n]) return;
    const q = OBRAS_BR.filter(o => o.uf === e.n && !o.capital).length;
    mostraTip(e.e + (q ? ' · ' + q + (q>1?' obras':' obra') : ' · atuação declarada'), path);
  });
  path.addEventListener('pointerleave', escondeTip);
  e.el = path;
  gEstados.append(path);
});

GEO.distritos.forEach(d => {
  const c = conta[d.n] || 0;
  const path = document.createElementNS(NS,'path');
  path.setAttribute('d', d.d);
  path.setAttribute('class', c === 0 ? 'c0' : c <= 2 ? 'c1' : c <= 4 ? 'c2' : 'c3');
  path.dataset.dist = d.n;
  if (c) {
    path.style.cursor = 'pointer';
    path.addEventListener('click', e => { e.stopPropagation(); filtraDistrito(d.n); });
  }
  path.addEventListener('pointerenter', () => {
    if (panAtivo) return;
    mostraTip(rot(d.n) + (c ? ' · ' + c + (c>1?' imóveis':' imóvel') : ''), path);
  });
  path.addEventListener('pointerleave', escondeTip);
  d.el = path;
  gTerra.append(path);
});

ACERVO.forEach(p => {
  if (p.semGeo) return;
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','pin'); g.dataset.st = p.st; g.dataset.id = p.id;
  g.setAttribute('tabindex','0'); g.setAttribute('role','button');
  g.setAttribute('aria-label', p.n + ' — ' + (p.st === 'ativo' ? 'contrato ativo' : 'serviços pós-contrato'));
  const alvo = document.createElementNS(NS,'circle'); alvo.setAttribute('class','alvo');
  const halo = document.createElementNS(NS,'circle'); halo.setAttribute('class','halo');
  const conf = p.aferir ? document.createElementNS(NS,'circle') : null;
  if (conf) conf.setAttribute('class','conf');
  const pt = document.createElementNS(NS,'circle'); pt.setAttribute('class','ponto');
  [alvo, halo, conf, pt].filter(Boolean).forEach(c => { c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); g.append(c); });
  g.addEventListener('click', e => { e.stopPropagation(); seleciona(p.id); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seleciona(p.id); } });
  g.addEventListener('pointerenter', () => mostraTip(p.n, pt, p));
  g.addEventListener('pointerleave', escondeTip);
  g.addEventListener('focus', () => mostraTip(p.n, pt, p));
  g.addEventListener('blur', escondeTip);
  p.cir = {alvo, halo, conf, pt};
  p.el = g;
  gPins.append(g);
});
OBRAS_BR.forEach(o => {
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','pin'); g.dataset.st = o.st; g.dataset.id = o.id;
  g.setAttribute('tabindex','0'); g.setAttribute('role','button');
  g.setAttribute('aria-label', o.n + ' — ' + o.c);
  const alvo = document.createElementNS(NS,'circle'); alvo.setAttribute('class','alvo');
  const halo = document.createElementNS(NS,'circle'); halo.setAttribute('class','halo');
  const pt   = document.createElementNS(NS,'circle'); pt.setAttribute('class','ponto');
  [alvo, halo, pt].forEach(c => { c.setAttribute('cx',o.x); c.setAttribute('cy',o.y); g.append(c); });
  g.addEventListener('click', e => {
    e.stopPropagation();
    if (o.capital) { seleciona(null); setVista('centro', 1100); return; }
    seleciona(o.id);
  });
  g.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); g.dispatchEvent(new MouseEvent('click')); } });
  g.addEventListener('pointerenter', () => mostraTip(o.n, pt, o));
  g.addEventListener('pointerleave', escondeTip);
  o.cir = {alvo, halo, pt};
  o.el = g;
  gObras.append(g);
});

svg.addEventListener('click', () => seleciona(null));

function mostraTip(txt, ref, p, semFoto){
  clearTimeout(tipTimer);
  const r = ref.getBoundingClientRect(), m = svg.getBoundingClientRect();
  /* já está neste imóvel: não remonta o cartão, que é o que fazia piscar */
  if (p && tip.dataset.de === p.id && tip.classList.contains('on')) return;
  if (p) tip.dataset.de = p.id; else delete tip.dataset.de;
  if (p && p.foto){
    tip.className = 'tip comfoto' + (p.st === 'pos' ? ' pos' : '') + (semFoto ? ' sopil' : '');
    tip.innerHTML = '<span class="alma">' +
      (semFoto ? '' : '<img src="' + p.foto + '" alt="">') +
      '<span class="pil">' + p.n +
      '<span class="st">' + (p.st === 'ativo' ? 'ativo' : 'pós-contrato') + '</span>' +
      '</span></span>';
  } else {
    tip.className = 'tip';
    tip.innerHTML = '<span class="alma">' + txt + '</span>';
  }
  /* posiciona e segura dentro do quadro do mapa: se não couber acima, desce */
  tip.style.visibility = 'hidden';
  tip.style.left = '0px'; tip.style.top = '0px';
  tip.classList.add('on');
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const cx = r.left + r.width/2 - m.left;
  const pad = 10;
  const esq = Math.max(tw/2 + pad, Math.min(cx, m.width - tw/2 - pad));
  const acima = (r.top - m.top) - th - 12;
  if (acima >= pad){
    tip.style.top = (r.top - m.top - 12) + 'px';
    tip.style.transform = 'translate(-50%,-100%)';
  } else {
    tip.style.top = (r.bottom - m.top + 12) + 'px';
    tip.style.transform = 'translate(-50%,0)';
  }
  tip.style.left = esq + 'px';
  tip.style.visibility = '';
}
let tipTimer;
function escondeTip(){ tipTimer = setTimeout(() => tip.classList.remove('on'), 110); }

let anim;
let panAtivo = false, panPendente = false;
function setVista(v, dur){
  est.vista = v;
  ['brasil','cidade','centro'].forEach(n =>
    document.getElementById('v-' + n).setAttribute('aria-pressed', v === n));
  if (v !== 'panorama' && panAtivo) setPanorama(false);
  const de = svg.getAttribute('viewBox').split(' ').map(Number);
  const para = v === 'panorama' ? vistaPanorama() : VISTAS[v];
  const nivelAntes = nivel;
  nivel = (para[2] > CORTE) ? 'brasil' : 'cidade';
  if (nivel !== nivelAntes){ est.sel = null; est.dist = null; pinta(); }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    svg.setAttribute('viewBox', para.join(' ')); desenhaGuia(); posicionaRotulos();
    if (panAtivo) { montaPanorama(panPendente); panPendente = false; }
    return;
  }
  cancelAnimationFrame(anim);
  const t0 = performance.now();
  dur = dur || 620;
  const cx0 = de[0]+de[2]/2, cy0 = de[1]+de[3]/2, cx1 = para[0]+para[2]/2, cy1 = para[1]+para[3]/2;
  const lw0 = Math.log(de[2]), lw1 = Math.log(para[2]);
  const lh0 = Math.log(de[3]), lh1 = Math.log(para[3]);
  (function passo(t){
    const k = Math.min(1,(t-t0)/dur), e = 1 - Math.pow(1-k,3);
    const w = Math.exp(lw0 + (lw1-lw0)*e), h = Math.exp(lh0 + (lh1-lh0)*e);
    const cx = cx0 + (cx1-cx0)*e, cy = cy0 + (cy1-cy0)*e;
    svg.setAttribute('viewBox', [cx-w/2, cy-h/2, w, h].map(n => n.toFixed(1)).join(' '));
    desenhaGuia(); posicionaRotulos();
    if (k < 1) anim = requestAnimationFrame(passo);
    else if (panAtivo) { montaPanorama(panPendente); panPendente = false; }
  })(t0);
}

function escalaPins(){
  const ctm = svg.getScreenCTM(); if (!ctm) return ctm;
  const k = ctm.a;
  ACERVO.concat(OBRAS_BR).forEach(p => {
    if (!p.cir) return;
    const sel = est.sel === p.id;
    const base = p.capital ? 9 : 5.4;
    p.cir.pt.setAttribute('r', ((sel ? base + 2.6 : base)/k).toFixed(2));
    p.cir.halo.setAttribute('r', ((p.capital ? 16 : 12)/k).toFixed(2));
    p.cir.alvo.setAttribute('r', (17/k).toFixed(2));
    if (p.cir.conf) p.cir.conf.setAttribute('r', ((sel ? 11.5 : 8.6)/k).toFixed(2));
  });
  return ctm;
}

function posicionaRotulos(){
  const ctm = escalaPins(); if (!ctm) return;
  const m = svg.getBoundingClientRect(), esc = ctm.a;
  pintaCamadas();

  if (nivel === 'brasil'){
    const p0 = svg.createSVGPoint();
    BR.estados.forEach(e => {
      p0.x = e.x; p0.y = e.y;
      const s = p0.matrixTransform(ctm);
      e.sigEl.style.left = (s.x - m.left) + 'px';
      e.sigEl.style.top  = (s.y - m.top) + 'px';
    });
  }
  const legenda = document.querySelector('.painel-mapa').getBoundingClientRect();
  const mostra = esc > 1.4;
  const pt = svg.createSVGPoint();
  const vis = {};
  ACERVO.forEach(p => { if (visivel(p)) vis[p.dist] = true; });
  comContrato.forEach(d => {
    d.rotEl.style.display = mostra ? '' : 'none';
    if (!mostra) return;
    pt.x = d.x; pt.y = d.y;
    const s = pt.matrixTransform(ctm);
    const raio = (4.5 + 3.6 * Math.sqrt(Math.max(0, conta[d.n]-1))) * esc + 14;
    let y = s.y + raio;
    if (s.x > legenda.left - 40 && s.x < legenda.right + 40 && y > legenda.top - 14) y = s.y - raio - 4;
    d.rotEl.style.left = (s.x - m.left) + 'px';
    d.rotEl.style.top  = (y - m.top) + 'px';
    d.rotEl.classList.toggle('fora', !vis[d.n]);
  });
}

/* 9b. PANORAMA — a carteira inteira aberta, revelada da esquerda para a direita.
   Serve à abertura de apresentação: não se mergulha em nenhum imóvel, mas o
   tamanho da atuação aparece de uma vez. */
const camadaPan = document.getElementById('panorama');
const panLinks  = document.getElementById('pan-links');
const btnPan    = document.getElementById('panorama-btn');
let panTimers = [];
let vistaAnterior = 'centro';
let aberturaCorrendo = false;

function limpaPanorama(){
  panTimers.forEach(clearTimeout); panTimers = [];
  camadaPan.querySelectorAll('.medalhao').forEach(e => e.remove());
  panLinks.innerHTML = '';
}

function montaPanorama(animar){
  const ctm = svg.getScreenCTM(); if (!ctm) return;
  limpaPanorama();
  const m = svg.getBoundingClientRect();
  /* no país os medalhões são menores: deslocar pouco importa mais do que impressionar */
  const S = nivel === 'brasil'
    ? Math.max(30, Math.min(54, m.width / 28))
    : Math.max(38, Math.min(78, m.width / 19));
  const pt = svg.createSVGPoint();

  const nos = itens().filter(p => p.foto && !p.semGeo && visivel(p)).map(p => {
    pt.x = p.x; pt.y = p.y;
    const s = pt.matrixTransform(ctm);
    const x0 = s.x - m.left, y0 = s.y - m.top;
    return { p, x0, y0, x: x0, y: y0 };
  });

  /* relaxação: separa os que se sobrepõem sem soltar do ponto de origem */
  const dmin = S * 1.05, pad = S / 2 + 10;
  for (let it = 0; it < 180; it++){
    for (let i = 0; i < nos.length; i++){
      for (let j = i + 1; j < nos.length; j++){
        const a = nos[i], b = nos[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || .01;
        if (dist < dmin){
          const f = (dmin - dist) / dist * .5;
          dx *= f; dy *= f;
          a.x -= dx; a.y -= dy; b.x += dx; b.y += dy;
        }
      }
    }
    for (const n of nos){
      n.x += (n.x0 - n.x) * .035;
      n.y += (n.y0 - n.y) * .035;
      n.x = Math.max(pad, Math.min(m.width - pad, n.x));
      n.y = Math.max(pad, Math.min(m.height - pad, n.y));
    }
  }

  nos.sort((a, b) => a.x - b.x);   /* a varredura é da esquerda para a direita */
  panLinks.setAttribute('viewBox', '0 0 ' + m.width + ' ' + m.height);

  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const passo = (animar && !reduz) ? Math.min(95, 2900 / Math.max(1, nos.length)) : 0;

  nos.forEach((n, i) => {
    const li = document.createElementNS(NS, 'line');
    li.setAttribute('x1', n.x0.toFixed(1)); li.setAttribute('y1', n.y0.toFixed(1));
    li.setAttribute('x2', n.x.toFixed(1));  li.setAttribute('y2', n.y.toFixed(1));
    panLinks.append(li);

    const el = document.createElement('button');
    el.className = 'medalhao' + (n.p.st === 'pos' ? ' pos' : '');
    el.style.width = el.style.height = S + 'px';
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
    el.style.backgroundImage = 'url(' + n.p.foto + ')';
    el.setAttribute('aria-label', n.p.n);
    el.onclick = () => { setPanorama(false); seleciona(n.p.id); };
    el.onpointerenter = () => mostraTip(n.p.n, el, n.p, true);
    el.onpointerleave = escondeTip;
    camadaPan.append(el);

    const liga = () => { el.classList.add('on'); li.classList.add('on'); };
    if (passo) panTimers.push(setTimeout(liga, 90 + i * passo));
    else requestAnimationFrame(liga);
  });
}

function setPanorama(on){
  if (panAtivo === on) return;
  panAtivo = on;
  document.body.classList.toggle('panorama', on);
  camadaPan.hidden = !on;
  btnPan.setAttribute('aria-pressed', on);
  btnPan.textContent = on ? 'ver os pontos' : 'ver as fotos';
  escondeTip();
  if (on){
    vistaAnterior = (est.vista === 'panorama' || est.vista === 'cidade') ? 'centro' : est.vista;
    panPendente = true;          /* a varredura espera o enquadramento terminar */
    seleciona(null);
    if (nivel === 'brasil'){           /* já estamos no enquadramento certo */
      panPendente = false;
      setTimeout(() => montaPanorama(true), 60);
    } else {
      setVista('panorama', aberturaCorrendo ? 2000 : 760);
    }
    setTimeout(() => ouveInteracao(true), 400);
  } else {
    panPendente = false;
    aberturaCorrendo = false;
    ouveInteracao(false);
    limpaPanorama();
    if (nivel !== 'brasil') setVista(vistaAnterior);
  }
}
btnPan.onclick = () => setPanorama(!panAtivo);

/* no panorama, qualquer gesto do usuário devolve o mapa interativo */
function saiPanorama(e){
  const alvo = e.target && e.target.closest ? e.target.closest('.medalhao,.botoes') : null;
  if (alvo) return;                       /* medalhão e botões têm caminho próprio */
  if (e.type === 'keydown' && (e.key === 'v' || e.key === 'V')) return;
  setPanorama(false);
}
const EVENTOS = ['pointerdown','keydown','wheel','touchstart'];
function ouveInteracao(lig){
  EVENTOS.forEach(ev => lig
    ? addEventListener(ev, saiPanorama, {capture:true, passive:true})
    : removeEventListener(ev, saiPanorama, {capture:true}));
}

/* 9c. ABERTURA — a cidade inteira, a aproximação ao centro, e então a varredura */
function abertura(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  aberturaCorrendo = true;
  svg.setAttribute('viewBox', VISTAS.brasil.join(' '));
  est.vista = 'brasil'; nivel = 'brasil';
  ['brasil','cidade','centro'].forEach(n =>
    document.getElementById('v-' + n).setAttribute('aria-pressed', n === 'brasil'));
  pinta();
  /* o país, a cidade, o centro — e então as fotos */
  setTimeout(() => { if (!panAtivo && est.vista === 'brasil') setVista('cidade', 2400); }, 2000);
  setTimeout(() => { if (!panAtivo && est.vista === 'cidade') setPanorama(true); }, 5000);
}

/* 10. ORQUESTRA */
function seleciona(id){
  est.sel = est.sel === id ? null : id;
  pinta();
  if (est.sel){
    const it = lista.querySelector('.item[data-id="' + est.sel + '"]');
    if (it) it.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }
}
function pinta(){
  ACERVO.concat(OBRAS_BR).forEach(p => {
    if (!p.el) return;
    p.el.classList.toggle('fora', !visivel(p));
    p.el.classList.toggle('sel', est.sel === p.id);
  });
  const alvo = acha(est.sel);
  GEO.distritos.forEach(d => {
    d.el.classList.toggle('on', est.dist === d.n || (!!alvo && alvo.dist === d.n));
    d.el.classList.toggle('mudo', !!est.dist && est.dist !== d.n);
  });
  BR.estados.forEach(e => e.el.classList.toggle('on', !!alvo && alvo.uf === e.n));
  pintaNumeros(); pintaPainel(); pintaLista(); pintaFicha(); posicionaRotulos();
  if (panAtivo && !panPendente) montaPanorama(false);
  requestAnimationFrame(desenhaGuia);
}



addEventListener('resize', () => {
  desenhaGuia(); posicionaRotulos();
  if (panAtivo && !panPendente) montaPanorama(false);
});
lista.addEventListener('scroll', desenhaGuia);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (panAtivo) setPanorama(false); else { est.dist = null; seleciona(null); } }
  if (e.key === 'v' || e.key === 'V') setPanorama(!panAtivo);
});
document.fonts && document.fonts.ready.then(posicionaRotulos);

pinta();
abertura();
</script>
