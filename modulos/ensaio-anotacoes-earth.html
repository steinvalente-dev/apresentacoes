<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ensaio · anotações no visor earth 3d</title>
<link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   ENSAIO · anotações no visor earth 3d · 02/09/2026
   Bancada de ajuste, não peça. Existe para responder três perguntas com
   MEDIÇÃO, antes de escrever uma linha no módulo:

   1 · quais classes e propriedades a `maps3d` REALMENTE expõe neste canal
       beta — o painel de sonda imprime a superfície da API, em vez de eu
       presumir a partir de documentação;
   2 · como as anotações se comportam DURANTE A ÓRBITA: elas rodam, passam
       atrás de prédio e colidem entre si. Captura estática engana;
   3 · se o `HYBRID` resolve nome de rua a um preço aceitável.

   ⚑ POR QUE É UMA BANCADA E NÃO EDIÇÃO DIRETA NO MÓDULO
   A chave tem teto de 1.000 cargas 3D por dia, posto de propósito. Iterar
   recarregando queima uma carga por tentativa. Aqui a camada de anotação é
   uma FUNÇÃO reexecutável — `MSA.desenha(CFG)` — sobre um mapa já
   carregado: uma carga serve uma hora de ajuste.

   Dados levantados do OpenStreetMap (Overpass), 02/09/2026:
     EMEI Presidente Dutra ....... -23.532271, -46.566628 · esquina da R. Santo Elias
     Hosp. Mun. Dr. Cármino Caricchio -23.533119, -46.566394 · frente p/ Av. Celso Garcia
     Rua Síria .................... -23.531960, -46.566169 · azimute 326°
     Rua Santa Maria .............. -23.531979, -46.567132 · azimute 256°
     Rua Santo Elias .............. -23.532135, -46.567222 · azimute 164°
     Avenida Celso Garcia ......... -23.533773, -46.566128 · azimute 260°
   ⚠ Nome de instituição vindo de base colaborativa. Confirmar antes de
     pôr em peça de cliente.
   ═══════════════════════════════════════════════════════════════════════ */
  :root{
    --cal:#F3EEE7; --ferro:#231F20; --vinho:#79242F;
    --mono:ui-monospace,Menlo,monospace;
    --sans:'Poppins',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ferro);color:var(--cal);font-family:var(--sans);overflow:hidden}

  .visor{position:absolute;inset:0}
  gmp-map-3d{position:absolute;inset:0;width:100%;height:100%;
    filter:saturate(.86) contrast(1.03)}

  /* ── a anotação, desenhada por nós ────────────────────────────────────
     MEDIDO em 02/09/2026, e o resultado desmontou a hipótese anterior:

     ✗ `Marker3DElement.append(<div>)` — a API RECUSA. Console:
       "The slotted content is not of type HTMLTemplateElement or PinElement".
       O nó fica no DOM (dá para contá-lo e concluir errado) mas não desenha.
     ✗ `<template>` com o nosso DOM dentro — aceito sem erro, desenha NADA.
     ✗ `PinElement` com background/borderColor nossos — o pino sai vermelho
       #EA4335 do Google de qualquer jeito.
     ✓ `PopoverElement` + `positionAnchor` = LatLngAltitude literal (sem
       marcador nenhum) — aceita DOM arbitrário e desenha com a nossa cor
       exata. É a rota da casa.
     ✓ `Polyline3DElement` vertical — a haste, na nossa cor.
     ✓ `Polygon3DElement` — a pegada do lote. Precisa de HALO Cal por baixo:
       traço Cal sozinho desaparece sobre telhado claro (medido a heading 255).

     `CollisionBehavior` NÃO está em maps3d; está na biblioteca `marker`.
     ─────────────────────────────────────────────────────────────────────── */
  .anot{font-family:var(--sans);line-height:1.15;pointer-events:none;
    white-space:nowrap;border-radius:2px}
  /* o lote do projeto: peso máximo */
  .anot.obra{background:var(--vinho);color:var(--cal);font-weight:600;
    font-size:15px;letter-spacing:-.01em;padding:8px 14px;
    box-shadow:0 2px 14px #231F2099;border:1px solid #F3EEE72e}
  /* contexto — o vizinho. Fundo Cal para não competir com o Vinho */
  .anot.ctx{background:#F3EEE7f2;color:var(--ferro);font-weight:600;
    font-size:12.5px;padding:6px 11px;box-shadow:0 2px 10px #231F2080}
  /* rua: mono, caixa-alta, quase infraestrutura */
  .anot.rua{background:#231F20bd;color:#F3EEE7e6;font-family:var(--mono);
    font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 8px}

  /* ── a bancada. Nada disto vai para peça. ─────────────────────────── */
  #painel{position:absolute;top:0;left:0;right:0;z-index:9;
    background:#12110Eec;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid #F3EEE71f;padding:10px 14px;
    display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    font-family:var(--mono);font-size:11px}
  #painel .tag{color:#E9A184;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid #79242F99;border-radius:999px;padding:4px 10px;white-space:nowrap}
  #painel button{background:#231F20;color:var(--cal);border:1px solid #F3EEE730;
    border-radius:3px;padding:6px 11px;cursor:pointer;font-family:var(--mono);
    font-size:11px;letter-spacing:.06em}
  #painel button:hover{border-color:#E9A184;color:#E9A184}
  #painel button.on{background:var(--vinho);border-color:var(--vinho)}
  #sonda{position:absolute;left:0;bottom:0;max-height:46vh;width:min(560px,52vw);
    z-index:9;overflow:auto;background:#12110Ef2;border-top:1px solid #F3EEE71f;
    border-right:1px solid #F3EEE71f;padding:12px 14px;font-family:var(--mono);
    font-size:11px;line-height:1.6;white-space:pre-wrap;color:#F3EEE7cc}
  #sonda b{color:#E9A184}
  #sonda.off{display:none}
</style>
</head>
<body>

<div class="visor" id="visor"></div>

<div id="painel">
  <span class="tag">bancada · não é peça</span>
  <button id="bt-orb" class="on" type="button">parar órbita</button>
  <button id="bt-anot" class="on" type="button">anotações</button>
  <button id="bt-ruas" class="on" type="button">nomes de rua</button>
  <button id="bt-area" class="on" type="button">pegada dos lotes</button>
  <button id="bt-modo" type="button">modo: SATELLITE</button>
  <button id="bt-oclu" class="on" type="button">visível atrás de prédio</button>
  <button id="bt-haste" class="on" type="button">haste até o solo</button>
  <button id="bt-sonda" type="button">sonda</button>
  <button id="bt-topo" type="button">ir ao topo</button>
</div>

<pre id="sonda" class="off">sondando a API…</pre>

<script src="ms-maps-chave.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   MSA — a camada de anotação, reexecutável.
   `MSA.desenha()` apaga e redesenha tudo a partir de CFG. Chamável do
   console sem recarregar a página, que é o ponto: uma carga 3D serve uma
   hora de ajuste, e a cota da chave agradece.
   ═══════════════════════════════════════════════════════════════════════ */
window.MSA = (function(){
  'use strict';

  var CHAVE = (window.MS_MAPS && window.MS_MAPS.chave) || '';
  var CANAL = (window.MS_MAPS && window.MS_MAPS.canal) || 'beta';

  /* o enquadramento da casa, igual ao do módulo */
  var CAM = {alt:760, range:430, tilt:58, heading:30, tiltEntrada:45};

  /* ⚑ DESVIO DO LOOK-AT — medido, não deduzido.
     Declarar `center` NÃO põe aquele ponto no centro da tela: com tilt 58
     o ponto visado cai ~55 m ANTES do declarado, na direção da câmera. Sem
     compensar, o assunto sobe para o terço superior do quadro; pior, o
     desvio gira com o heading, então na órbita o lote BALANÇA.
     A correção é deslocar o center 0,00050° no rumo do heading, a cada
     quadro. Custa nada e o lote fica parado no centro a volta inteira. */
  var DESVIO = 0.00050;
  function enquadra(h){
    if(!mapa) return;
    var rad = h * Math.PI / 180;
    mapa.center = {
      lat: CFG.centro.lat + DESVIO * Math.cos(rad),
      lng: CFG.centro.lng + DESVIO * Math.sin(rad) / Math.cos(CFG.centro.lat*Math.PI/180),
      altitude: CAM.alt
    };
  }
  var VOLTA = 140000, RAMPA = 700;

  /* ── CFG · tudo que se ajusta vive aqui ────────────────────────────── */

  /* PEGADAS REAIS, levantadas do OpenStreetMap em 02/09/2026 e costuradas
     aqui como literal — a bancada não depende do Overpass, que responde XML
     quando está de mau humor.
       EMEI ....... relation/20299043  (multipolygon, 3 vias costuradas)
       Hospital ... way/375977786
     ⚑ O ACHADO: o segmento -23.532694,-46.566977 → -23.532484,-46.566107
     é o MESMO nos dois anéis. Os dois lotes são confinantes, dividem a
     linha. Confirma o que o Michel disse: o hospital é literalmente do lado.
     ⚠ Nome de instituição e traçado de lote vêm de base colaborativa.
     Confirmar em GeoSampa/BDT antes de ir para peça de cliente.

   ⚑ COMO SABER SE O 3D CAIU POR COTA — 02/09/2026, aconteceu.
     Sintoma: <gmp-map-3d> sem canvas, sem shadowRoot, `cameraPosition`
     null, spinner eterno e ZERO erro no console. Igualzinho a bug nosso.
     O teste que separa: montar um `google.maps.Map` 2D na MESMA página com
     a MESMA chave. Se o 2D renderiza, a chave, o referrer e o faturamento
     estão bons e o que acabou foi `3D Map loads per day` (teto 1.000, posto
     em 30/08). Console → Quotas → Maps JavaScript API, e olhar Metrics
     antes de subir o número: pode ser uso, pode ser vazamento. */
  var ANEL_EMEI = [
    {lat:-23.532685,lng:-46.566980},{lat:-23.532694,lng:-46.566977},
    {lat:-23.532494,lng:-46.566153},{lat:-23.532484,lng:-46.566107},
    {lat:-23.531878,lng:-46.566280},{lat:-23.531848,lng:-46.566325},
    {lat:-23.532040,lng:-46.567106},{lat:-23.532107,lng:-46.567148},
    {lat:-23.532487,lng:-46.567038},{lat:-23.532685,lng:-46.566980}
  ];
  var ANEL_HOSP = [
    {lat:-23.532694,lng:-46.566977},{lat:-23.532484,lng:-46.566107},
    {lat:-23.533206,lng:-46.565904},{lat:-23.533273,lng:-46.565886},
    {lat:-23.533537,lng:-46.565810},{lat:-23.533754,lng:-46.566684},
    {lat:-23.533617,lng:-46.566722},{lat:-23.532694,lng:-46.566977}
  ];
  function centro(a){
    var la=0, lo=0; a.forEach(function(p){ la+=p.lat; lo+=p.lng; });
    return {lat:la/a.length, lng:lo/a.length};
  }

  var CFG = {
    centro: {lat:-23.532700, lng:-46.566600},
    /* a caixa fica no TOPO da haste; `alt` é a altura da haste em metros */
    pontos: [
      {rot:'EMEI Presidente Dutra', tipo:'obra', anel:ANEL_EMEI,
       pos:centro(ANEL_EMEI), alt:52,
       traco:'#79242F', preench:'rgba(121,36,47,0.22)', esp:4.5},
      {rot:'Hospital Municipal Cármino Caricchio', tipo:'ctx', anel:ANEL_HOSP,
       pos:centro(ANEL_HOSP), alt:62,
       traco:'#231F20e6', preench:'rgba(35,31,32,0.10)', esp:2.5}
    ],
    /* âncora de rua puxada para o trecho que confronta o quarteirão — no
       nó mais próximo elas caem fora do quadro em metade das órbitas */
    ruas: [
      {rot:'Rua Santo Elias',   lat:-23.532290, lng:-46.567090, alt:14},
      {rot:'Rua Santa Maria',   lat:-23.531990, lng:-46.566980, alt:14},
      {rot:'Rua Síria',         lat:-23.531930, lng:-46.566250, alt:14},
      {rot:'Av. Celso Garcia',  lat:-23.533800, lng:-46.566300, alt:14}
    ],
    /* interruptores do ensaio */
    anot:true, ruas_on:true, area:true, ocluso:true, haste:true, modo:'SATELLITE'
  };

  var lib=null, mapa=null, marcas=[], orbitando=false, rafOrb=null;
  var sonda = document.getElementById('sonda');
  function diz(t){ sonda.textContent = t; }

  /* ── a SONDA · imprime a superfície real da API ───────────────────────
     Escrito porque presumir campo de API já custou uma peça publicada com
     a câmera a 80°/s. O que este painel imprime é o que existe, não o que
     a documentação diz existir. */
  function sondaApi(){
    var l = [];
    l.push('CANAL v=' + CANAL);
    l.push('');
    l.push('CLASSES em importLibrary("maps3d"):');
    Object.keys(lib).sort().forEach(function(k){ l.push('  ' + k); });
    ['Marker3DElement','Marker3DInteractiveElement','Polyline3DElement',
     'Polygon3DElement','Model3DElement','PopoverElement'].forEach(function(c){
      if(!lib[c]) { l.push(''); l.push(c + ': NÃO EXISTE'); return; }
      var p = [];
      try{
        var proto = lib[c].prototype;
        p = Object.getOwnPropertyNames(proto)
             .filter(function(n){ return n!=='constructor' && n[0]!=='_'; }).sort();
      }catch(e){ p = ['(não inspecionável: ' + e.name + ')']; }
      l.push('');
      l.push(c + ' · ' + p.length + ' membros:');
      l.push('  ' + p.join(' · '));
    });
    l.push('');
    l.push('ENUMS úteis:');
    ['AltitudeMode','MapMode','CollisionBehavior'].forEach(function(e){
      l.push('  ' + e + ': ' + (lib[e] ? Object.keys(lib[e]).join(' | ') : 'ausente'));
    });
    l.push('');
    l.push('ACEITA DOM ARBITRÁRIO NO MARCADOR? — testado abaixo, no desenha()');
    diz(l.join('\n'));
    /* e no console, para copiar */
    console.log('%c[MSA] superfície da API maps3d', 'color:#E9A184', lib);
  }

  /* ── as três primitivas que a API aceita ──────────────────────────── */
  var AM = function(){ return (lib.AltitudeMode||{}); };
  var posto = [];                        /* tudo que foi posto no mapa */

  /* a CAIXA · popover ancorado em coordenada, sem marcador nenhum.
     `lightDismissDisabled` é obrigatório: sem ele, um clique no mapa fecha
     a anotação e ela não volta. */
  function caixa(txt, pos, tipo){
    var pop = new lib.PopoverElement({
      open:true, lightDismissDisabled:true,
      altitudeMode: AM().RELATIVE_TO_GROUND
    });
    var d = document.createElement('div');
    d.className = 'anot ' + tipo;
    d.textContent = txt;
    pop.append(d);
    pop.positionAnchor = pos;            /* literal, não elemento */
    mapa.append(pop); posto.push(pop);
    return pop;
  }

  /* a HASTE · o que faz a caixa POUSAR num lugar em tilt 58. Sem ela a
     anotação flutua e o cliente não sabe do que se fala. */
  function haste(pos, altura, cor, largura){
    var pl = new lib.Polyline3DElement({
      altitudeMode: AM().RELATIVE_TO_GROUND,
      /* `coordinates` está DEPRECIADO (aviso no console em 02/09/2026):
         o campo vigente é `path`. Mesma classe de armadilha que `rounds`. */
      path: [{lat:pos.lat,lng:pos.lng,altitude:0},
             {lat:pos.lat,lng:pos.lng,altitude:altura}],
      strokeColor: cor, strokeWidth: largura || 4,
      drawsOccludedSegments: !!CFG.ocluso, zIndex: 15
    });
    mapa.append(pl); posto.push(pl);
    return pl;
  }

  /* a PEGADA · o lote. Dois polígonos: Cal grosso por baixo (halo) e a cor
     por cima. O halo não é enfeite — traço sem ele desaparece sobre
     telhado claro, medido a heading 255. */
  function area(anel, traco, preench, esp){
    function po(cor, fill, largura, z){
      var pg = new lib.Polygon3DElement({
        altitudeMode: AM().CLAMP_TO_GROUND,
        path: anel,          /* `outerCoordinates` está DEPRECIADO */
        strokeColor: cor, strokeWidth: largura, fillColor: fill,
        drawsOccludedSegments: !!CFG.ocluso, zIndex: z
      });
      mapa.append(pg); posto.push(pg);
    }
    po('#F3EEE7d9', 'rgba(0,0,0,0)', (esp||3)+3, 9);
    po(traco, preench, esp||3, 10);
  }

  /* ── desenha · apaga tudo e refaz a partir de CFG ─────────────────── */
  function desenha(){
    if(!mapa || !lib) return;
    posto.forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
    posto = [];
    if(CFG.area) CFG.pontos.forEach(function(p){
      if(p.anel) area(p.anel, p.traco, p.preench, p.esp); });
    if(CFG.anot) CFG.pontos.forEach(function(p){
      if(CFG.haste) haste(p.pos, p.alt, p.traco, p.tipo === 'obra' ? 5 : 3);
      caixa(p.rot, {lat:p.pos.lat, lng:p.pos.lng, altitude:CFG.haste ? p.alt : 8}, p.tipo);
    });
    if(CFG.ruas_on) CFG.ruas.forEach(function(r){
      caixa(r.rot, {lat:r.lat, lng:r.lng, altitude:r.alt}, 'rua'); });
    console.log('%c[MSA] ' + posto.length + ' elementos no mapa · '
      + mapa.querySelectorAll('gmp-popover').length + ' caixas · '
      + mapa.querySelectorAll('gmp-polygon-3d').length + ' polígonos',
      'color:#E9A184');
    return posto.length;
  }

  /* ── órbita · a mesma do módulo, para julgar no ritmo real ─────────── */
  function orbita(liga){
    orbitando = liga;
    document.getElementById('bt-orb').textContent = liga ? 'parar órbita' : 'orbitar';
    document.getElementById('bt-orb').classList.toggle('on', liga);
    if(!liga){
      if(mapa && mapa.stopCameraAnimation) mapa.stopCameraAnimation();
      if(rafOrb){ cancelAnimationFrame(rafOrb); rafOrb = null; }
      return;
    }
    var alvo = 360/(VOLTA/1000), t0 = performance.now(), ult = t0;
    rafOrb = requestAnimationFrame(function passo(now){
      if(!orbitando || !mapa) return;
      rafOrb = requestAnimationFrame(passo);
      var dt = Math.min((now-ult)/1000, .05); ult = now;
      var k = Math.min(1, (now-t0)/RAMPA);
      var h = ((mapa.heading||0) + alvo*(1-Math.pow(1-k,3))*dt) % 360;
      mapa.heading = h;
      enquadra(h);          /* o lote fica no centro; sem isto, balança */
    });
  }

  /* ── carga ────────────────────────────────────────────────────────── */
  function api(){
    return new Promise(function(ok, erro){
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(CHAVE)
            + '&v=' + encodeURIComponent(CANAL) + '&libraries=maps3d&language=pt-BR&region=BR';
      s.async = true; s.onload = ok; s.onerror = function(){ erro(new Error('rede')); };
      document.head.appendChild(s);
    });
  }
  function monta(){
    if(!CHAVE){ diz('sem chave: ms-maps-chave.js não carregou'); return; }
    diz('carregando a API…');
    api().then(function(){ return google.maps.importLibrary('maps3d'); })
      .then(function(m3d){
        lib = m3d;
        sondaApi();
        if(mapa && mapa.parentNode) mapa.parentNode.removeChild(mapa);
        mapa = new m3d.Map3DElement({
          center: {lat:CFG.centro.lat, lng:CFG.centro.lng, altitude:CAM.alt},
          range: 6000, tilt: CAM.tiltEntrada, heading: CAM.heading,
          mode: (m3d.MapMode && m3d.MapMode[CFG.modo]) || CFG.modo
        });
        document.getElementById('visor').appendChild(mapa);
        /* ⚠ a aproximação em degraus não é enfeite: nascer no range final
           devolve tela azul lisa, sem erro no console. */
        var passos = [6000,2500,1100,CAM.range], i = 0;
        (function passo(){
          if(!mapa) return;
          enquadra(i === 0 ? CAM.heading : (mapa.heading || CAM.heading));
          mapa.range = passos[i];
          mapa.tilt = i === 0 ? CAM.tiltEntrada : CAM.tilt;
          i++;
          if(i < passos.length){ setTimeout(passo, 3000); return; }
          setTimeout(function(){ desenha(); orbita(true); }, 3500);
        })();
      })['catch'](function(e){ diz('não carregou: ' + (e && e.message)); });
  }

  /* ── a bancada ────────────────────────────────────────────────────── */
  function liga(id, campo, depois){
    var b = document.getElementById(id);
    b.addEventListener('click', function(){
      CFG[campo] = !CFG[campo];
      b.classList.toggle('on', CFG[campo]);
      if(depois) depois();
      desenha();
    });
  }
  document.getElementById('bt-orb').addEventListener('click', function(){ orbita(!orbitando); });
  liga('bt-anot','anot'); liga('bt-ruas','ruas_on'); liga('bt-area','area');
  liga('bt-oclu','ocluso'); liga('bt-haste','haste');
  document.getElementById('bt-sonda').addEventListener('click', function(){
    sonda.classList.toggle('off');
    this.classList.toggle('on', !sonda.classList.contains('off'));
  });
  document.getElementById('bt-topo').addEventListener('click', function(){
    if(!mapa) return; orbita(false);
    mapa.center = {lat:CFG.centro.lat, lng:CFG.centro.lng, altitude:CAM.alt};
    mapa.tilt = 26; mapa.heading = 12; mapa.range = 620;   /* tilt baixo: o
      desvio do look-at é desprezível, não se compensa */
  });
  /* ⚑ trocar o modo EXIGE recriar o mapa: é uma carga 3D nova, e a cota
     conta. Por isso é um botão à parte, e não um interruptor qualquer. */
  document.getElementById('bt-modo').addEventListener('click', function(){
    CFG.modo = CFG.modo === 'SATELLITE' ? 'HYBRID' : 'SATELLITE';
    this.textContent = 'modo: ' + CFG.modo;
    orbita(false); monta();
  });

  monta();
  return {desenha:desenha, orbita:orbita, cfg:CFG, enquadra:enquadra,
          mapa:function(){ return mapa; }, lib:function(){ return lib; }};
})();
</script>
</body>
</html>
