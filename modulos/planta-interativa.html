<!DOCTYPE html>
<html lang="pt-BR">

<title>modulo . planta interativa</title>
<!-- =====================================================================
     MODULO . planta interativa

     A prancha em tela cheia que o cliente percorre: zoom, pan, pontos de
     midia e anotacao ao vivo sobre o desenho.

     A decisao que sustenta tudo: o desenho entra como SVG VETORIAL,
     convertido do PDF do Rayon com `mutool convert` - nunca rasterizado.
     Pinos e anotacoes vivem em COORDENADA DE DESENHO; o traco e
     recalculado em pixel de tela a cada quadro, para nao engordar no zoom.

     Receita de solda, pesos medidos e armadilhas:
     ../sistemas/gabaritos/planta-interativa.md

     A planta deste arquivo e SINTETICA, gerada por codigo, e as imagens e
     o clipe sao material de exemplo. Nenhum desenho de projeto entra aqui.
     ===================================================================== -->
<style>
html,body{height:100%}
</style>
<style>
  :root{
    --ink:#100F0D;
    --panel:#1F1D19;
    --panel-2:#2A2722;
    --line:#38342D;
    --text:#EDE9E1;
    --muted:#8F887B;
    --accent:#8E2C34;
    --accent-2:#E4572E;
    --accent-soft:rgba(142,44,52,.28);
    --font-ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  html,body{height:100%;}
  body{
    margin:0;background:var(--ink);color:var(--text);
    font-family:var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;}

  #viewer{
    position:fixed;inset:0;
    background:radial-gradient(120% 120% at 50% 0%, #1B1915 0%, var(--ink) 70%);
    overflow:hidden;touch-action:none;cursor:grab;
  }
  #viewer.dragging{cursor:grabbing;}
  #viewer.marking{cursor:crosshair;}
  #stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
  #stage.anim{transition:transform .34s cubic-bezier(.22,.61,.36,1);}
  #planta{display:block;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.6);}

  /* pinos */
  #pins{position:absolute;inset:0;pointer-events:none;}
  .pin{
    position:absolute;pointer-events:auto;
    width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;
    border:0;border-radius:50%;cursor:pointer;background:var(--accent);
    box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 6px 18px rgba(0,0,0,.4);
    display:grid;place-items:center;transition:transform .18s ease;
  }
  .pin:hover,.pin:focus-visible{transform:scale(1.18);outline:none;}
  .pin .glyph{width:11px;height:11px;fill:#fff;pointer-events:none;}
  .pin .halo{
    position:absolute;inset:-9px;border-radius:50%;
    border:1.5px solid var(--accent);opacity:.5;
    animation:ping 2.8s cubic-bezier(.2,.6,.3,1) infinite;
  }
  @keyframes ping{0%{transform:scale(.72);opacity:.6}70%,100%{transform:scale(1.35);opacity:0}}
  .pin-label{
    position:absolute;left:24px;top:50%;transform:translateY(-50%);
    white-space:nowrap;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    background:rgba(16,15,13,.9);border:1px solid var(--line);
    padding:4px 8px;border-radius:4px;color:var(--text);
    opacity:0;transition:opacity .16s ease;pointer-events:none;
  }
  .pin:hover .pin-label,.pin:focus-visible .pin-label{opacity:1;}
  .mark{
    position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    border:2px solid #37B3A3;background:rgba(55,179,163,.3);pointer-events:none;
  }

  .bar{position:fixed;z-index:20;display:flex;align-items:center;gap:8px;}
  #topleft{top:0;left:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));
    flex-direction:column;align-items:flex-start;gap:6px;}
  .sheet-name,.sheet-sub{background:rgba(16,15,13,.88);border:1px solid var(--line);
    padding:5px 9px;border-radius:5px;}
  .sheet-name{font-size:13px;letter-spacing:.14em;text-transform:uppercase;}
  .sheet-sub{font-size:10.5px;color:var(--muted);letter-spacing:.05em;font-family:var(--font-mono);}
  #topright{top:0;right:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));}
  .btn{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:8px 12px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    cursor:pointer;transition:background .15s ease,border-color .15s ease;
  }
  .btn:hover{background:var(--panel-2);}
  .btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:#fff;}

  #zoomctl{
    position:fixed;z-index:20;right:16px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    background:rgba(22,21,18,.82);border:1px solid var(--line);border-radius:10px;
    padding:12px 10px;backdrop-filter:blur(8px);
  }
  #zoomctl .step{
    width:28px;height:28px;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;
  }
  #zoomctl .step:hover{background:var(--panel-2);}
  #range{writing-mode:vertical-lr;direction:rtl;width:18px;height:190px;
    accent-color:var(--accent-2);cursor:ns-resize;}
  #pct{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #stop{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-family:var(--font-mono);}

  #hint{
    position:fixed;z-index:20;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
    background:rgba(22,21,18,.82);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;backdrop-filter:blur(8px);max-width:calc(100vw - 32px);
  }
  #hint span{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}
  #hint b{color:var(--text);font-weight:500;font-family:var(--font-mono);font-size:10.5px;}

  #marks{
    position:fixed;z-index:21;left:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));
    width:min(320px,calc(100vw - 32px));
    background:rgba(22,21,18,.95);border:1px solid var(--line);border-radius:10px;padding:12px;
  }
  #marks h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;}
  #markout{margin:0;font-family:var(--font-mono);font-size:11px;line-height:1.7;
    max-height:150px;overflow:auto;white-space:pre;}

  #lb[hidden],#lbimg[hidden],#lbvid[hidden]{display:none!important;}
  /* véu: o raio do blur NUNCA anima — só a opacidade do véu, que é composta na GPU */
  #lb{
    position:fixed;inset:0;z-index:40;
    display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;
    padding:clamp(20px,5vh,56px) clamp(16px,5vw,72px) clamp(16px,3vh,28px);
    background:rgba(12,11,9,.52);
    -webkit-backdrop-filter:blur(18px) saturate(.8) brightness(.62);
    backdrop-filter:blur(18px) saturate(.8) brightness(.62);
    opacity:0;transition:opacity .26s ease;
  }
  #lb.on{opacity:1;}
  /* nada anima atrás do véu: o fundo desfocado vira quadro parado, custo zero */
  body.veil .pin .halo{animation:none;}
  body.veil .pin{pointer-events:none;}
  body.veil .bar,body.veil #zoomctl,body.veil #hint,body.veil #marks,body.veil #tools{
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .bar,#zoomctl,#hint,#tools{transition:opacity .25s ease .1s;}
  @supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    #lb{background:rgba(12,11,9,.94);}
  }
  #lbstage{position:relative;min-height:0;}
  #lbimg,#lbvid{
    position:absolute;inset:0;margin:auto;width:auto;height:auto;
    max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6);
    opacity:0;transform:scale(.965);
    transition:opacity .22s ease .04s, transform .38s cubic-bezier(.2,.7,.25,1) .04s;
  }
  #lb.on #lbimg,#lb.on #lbvid{opacity:1;transform:scale(1);}
  #lbfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    opacity:0;transform:translateY(6px);
    transition:opacity .24s ease .12s, transform .24s ease .12s;}
  #lb.on #lbfoot{opacity:1;transform:none;}
  #lbcap{font-size:13px;letter-spacing:.02em;}
  #lbcap small{display:block;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.06em;}
  .lbnav{display:flex;align-items:center;gap:8px;}
  #lbcount{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #lbclose{position:absolute;top:0;right:0;}

  /* camada de anotação: pontos em coordenada de desenho, traço em pixel de tela */
  #ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #viewer.draw{cursor:crosshair;}
  #viewer.erase{cursor:cell;}

  #tools{
    position:fixed;z-index:20;left:16px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:rgba(22,21,18,.82);border:1px solid var(--line);border-radius:10px;
    padding:8px 7px;backdrop-filter:blur(8px);
  }
  .tool{
    width:32px;height:32px;display:grid;place-items:center;padding:0;
    background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer;
    color:var(--muted);transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .tool:hover{background:var(--panel-2);color:var(--text);}
  .tool:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px;}
  .tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
  .tool .ti{width:17px;height:17px;}
  #tools .sep{width:20px;height:1px;background:var(--line);margin:3px 0;}
  .sw{
    width:22px;height:22px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .sw[aria-pressed="true"]{border-color:#fff;}

  @media (max-width:640px){
    #hint{display:none;}
    #topleft .sheet-sub{display:none;}
    #zoomctl{right:10px;padding:8px;}
    #range{height:130px;}
    #tools{left:10px;padding:6px 5px;gap:4px;}
    .tool{width:28px;height:28px;}
  }
  @media (prefers-reduced-motion:reduce){
    #stage.anim{transition:none;}
    .pin .halo{animation:none;}
    .pin{transition:none;}
    #lb,#lbimg,#lbvid,#lbfoot{transition:none;}
    .tool{transition:none;}
    #lbimg,#lbvid{transform:none;}
  }
</style>
</head>

<div id="tools" role="toolbar" aria-label="Ferramentas">
  <button class="tool" data-tool="nav" aria-pressed="true" title="Navegar (V)">
    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 2.2l8.6 5-3.7 1-1.4 3.6z"/></svg></button>
  <button class="tool" data-tool="free" aria-pressed="false" title="Traço livre (D)">
    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 10.5c1.8-5.5 3.2 3.5 5-1.5s3.2 2.5 5-2"/></svg></button>
  <button class="tool" data-tool="line" aria-pressed="false" title="Linha reta (L) — shift trava o ângulo">

  <button class="tool" data-tool="arrow" aria-pressed="false" title="Seta (A) — shift trava o ângulo">
    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13L12.6 3.4M7.2 3h5.6v5.6"/></svg></button>

  <div class="sep"></div>

    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L2.5 7 6 10.5M2.5 7H10a3.5 3.5 0 010 7H7"/></svg></button>
  <button class="tool" id="clearAll" title="Limpar todas as anotações">
    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.2 4.5h9.6M6 4.5V2.8h4v1.7M4.5 4.5l.7 8.7h5.6l.7-8.7"/></svg></button>

<script>
(function(){
  "use strict";

  var MEDIA = window.__MEDIA__;   /* injetado no build */

  /* pontos em coordenadas do desenho (unidades do viewBox do SVG) */
  var PINS=[
    {x:300,y:1330,t:"Estar",icon:"image",media:[
      {type:"image",src:MEDIA.a1,cap:"Estar",sub:"Imagem de exemplo 1 / 2"},
      {type:"image",src:MEDIA.a2,cap:"Estar",sub:"Imagem de exemplo 2 / 2"}]},
    {x:2280,y:170,t:"Cozinha",icon:"image",media:[
      {type:"image",src:MEDIA.a3,cap:"Cozinha",sub:"Imagem de exemplo"}]},
    {x:520,y:2420,t:"Varanda gourmet",icon:"video",media:[
      {type:"video",src:MEDIA.vid,poster:MEDIA.poster,cap:"Varanda gourmet",sub:"Vídeo de exemplo · 6 s · sem áudio"}]}
  ];

  var ICONS={
    image:'<path d="M2 3h12v10H2zM4.5 9.5l2-2 2.2 2.2 1.8-1.8L13 10.5V12H4.5z"/>',
    video:'<path d="M3 3h7v10H3zM11 6.2l3-1.8v7.2l-3-1.8z"/>'
  };

  var viewer=document.getElementById("viewer"),
      stage=document.getElementById("stage"),
      svg=document.getElementById("planta"),
      pinsLayer=document.getElementById("pins"),
      range=document.getElementById("range"),
      pctEl=document.getElementById("pct"),
      stopEl=document.getElementById("stop");

  /* lê a caixa do desenho direto do viewBox do SVG exportado */
  var vb=svg.getAttribute("viewBox").split(/[\s,]+/).map(Number);
  var VBX=vb[0], VBY=vb[1], CW=vb[2], CH=vb[3];
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.style.width=CW+"px"; svg.style.height=CH+"px";

  var scale=1,tx=0,ty=0,fitScale=1,maxScale=1;
  var STOPS=[1,3.4,7.2], stopIdx=0;

  function clamp(v,a,b){return v<a?a:(v>b?b:v);}

  function apply(){
    var w=CW*scale,h=CH*scale,vw=viewer.clientWidth,vh=viewer.clientHeight;
    tx = w<=vw ? (vw-w)/2 : clamp(tx,vw-w,0);
    ty = h<=vh ? (vh-h)/2 : clamp(ty,vh-h,0);
    stage.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")";
    var rel=scale/fitScale;
    pctEl.textContent=Math.round(rel*100)+"%";
    range.value=Math.round(Math.log(rel)/Math.log(maxScale/fitScale)*1000);
    stopEl.textContent = rel<1.5?"Prancha":(rel<5?"Ambiente":"Detalhe");
    render();
  }
  function anim(on){stage.classList.toggle("anim",!!on);}

  function fit(animate){
    var vw=viewer.clientWidth,vh=viewer.clientHeight;
    fitScale=Math.min(vw/CW,vh/CH)*0.94;
    maxScale=fitScale*16;
    scale=fitScale;stopIdx=0;
    anim(!!animate);apply();
    if(animate) setTimeout(function(){anim(false);},380);
  }
  function zoomAt(cx,cy,next,animate){
    next=clamp(next,fitScale*0.9,maxScale);
    var r=viewer.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;
    var px=(x-tx)/scale,py=(y-ty)/scale;
    scale=next;tx=x-px*scale;ty=y-py*scale;
    anim(!!animate);apply();
    if(animate) setTimeout(function(){anim(false);},380);
  }
  function cycle(cx,cy){
    stopIdx=(stopIdx+1)%STOPS.length;
    zoomAt(cx,cy,fitScale*STOPS[stopIdx],true);
  }

  /* ================= pinos ================= */
  var pinEls=[], pinsOn=true;
  PINS.forEach(function(p){
    var b=document.createElement("button");
    b.className="pin";b.type="button";
    b.setAttribute("aria-label","Abrir mídia: "+p.t);
    b.innerHTML='<span class="halo"></span>'+
      '<svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">'+ICONS[p.icon]+'</svg>'+
      '<span class="pin-label">'+p.t+(p.icon==="video"?" · vídeo":"")+'</span>';
    b.addEventListener("click",function(e){e.stopPropagation();openLB(p);});
    b.addEventListener("pointerdown",function(e){e.stopPropagation();});
    pinsLayer.appendChild(b);pinEls.push(b);
  });
  function drawPins(){
    for(var i=0;i<PINS.length;i++){
      pinEls[i].style.left=((PINS[i].x-VBX)*scale+tx)+"px";
      pinEls[i].style.top=((PINS[i].y-VBY)*scale+ty)+"px";
    }
  }

  /* ================= anotação =================
     os pontos ficam em coordenada de desenho (andam com a planta);
     o traço é recalculado em pixel de tela a cada quadro, então a
     espessura e a ponta da seta não engordam no zoom.                 */
  var NS="http://www.w3.org/2000/svg";
  var ink=document.getElementById("ink");
  var strokes=[], live=null, tool="nav";
  var PENS=[{c:"#C1272D",w:2.8,o:1},{c:"#1F3A5F",w:2.8,o:1},{c:"#F5C518",w:17,o:.34}];
  var pen=PENS[0];

  function toDraw(cx,cy){
    var r=viewer.getBoundingClientRect();
    return {x:((cx-r.left)-tx)/scale+VBX, y:((cy-r.top)-ty)/scale+VBY};
  }
  function toScreen(p){return [(p.x-VBX)*scale+tx,(p.y-VBY)*scale+ty];}

  function mkEl(st){
    var el=document.createElementNS(NS, st.type==="point"?"circle":"path");
    if(st.type==="point"){
      el.setAttribute("r","7");el.setAttribute("fill","none");
      el.setAttribute("stroke",st.c);el.setAttribute("stroke-width","2.4");
    }else{
      el.setAttribute("fill","none");el.setAttribute("stroke",st.c);
      el.setAttribute("stroke-width",st.w);el.setAttribute("stroke-opacity",st.o);
      el.setAttribute("stroke-linecap","round");el.setAttribute("stroke-linejoin","round");
    }
    ink.appendChild(el);return el;
  }
  function pathD(st){
    var pts=st.pts,d="",i,s;
    if(!pts.length)return "";
    for(i=0;i<pts.length;i++){s=toScreen(pts[i]);d+=(i?"L":"M")+s[0].toFixed(1)+" "+s[1].toFixed(1);}
    if(st.type==="arrow"&&pts.length>1){
      var a=toScreen(pts[0]),b=toScreen(pts[pts.length-1]);
      var ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=15,w=.44;
      d+="M"+(b[0]-L*Math.cos(ang-w)).toFixed(1)+" "+(b[1]-L*Math.sin(ang-w)).toFixed(1)+
         "L"+b[0].toFixed(1)+" "+b[1].toFixed(1)+
         "L"+(b[0]-L*Math.cos(ang+w)).toFixed(1)+" "+(b[1]-L*Math.sin(ang+w)).toFixed(1);
    }
    return d;
  }
  function drawInk(){
    for(var i=0;i<strokes.length;i++){
      var st=strokes[i];
      if(st.type==="point"){var s=toScreen(st.pts[0]);
        st.el.setAttribute("cx",s[0].toFixed(1));st.el.setAttribute("cy",s[1].toFixed(1));}
      else st.el.setAttribute("d",pathD(st));
    }
  }
  function render(){drawPins();drawInk();}

  function newStroke(type,p){
    var st={type:type,pts:[p,{x:p.x,y:p.y}],c:pen.c,w:pen.w,o:pen.o};
    st.el=mkEl(st);strokes.push(st);return st;
  }
  function dropStroke(i){
    if(i<0||i>=strokes.length)return;
    strokes[i].el.remove();strokes.splice(i,1);refreshPoints();
  }
  function undo(){dropStroke(strokes.length-1);}
  function clearAll(){
    while(strokes.length)strokes.pop().el.remove();
    refreshPoints();
  }

  /* distância do clique ao traço, em pixel de tela */
  function segDist(px,py,a,b){
    var vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1];
    var L=vx*vx+vy*vy, t=L?Math.max(0,Math.min(1,(wx*vx+wy*vy)/L)):0;
    return Math.hypot(px-(a[0]+t*vx),py-(a[1]+t*vy));
  }
  function eraseAt(cx,cy){
    var r=viewer.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,best=-1,bd=1e9;
    for(var i=strokes.length-1;i>=0;i--){
      var st=strokes[i],pts=st.pts,dd=1e9,j;
      if(st.type==="point")dd=Math.hypot.apply(null,(function(s){return [s[0]-px,s[1]-py];})(toScreen(pts[0])));
      else for(j=0;j<pts.length-1;j++)dd=Math.min(dd,segDist(px,py,toScreen(pts[j]),toScreen(pts[j+1])));
      if(dd<bd){bd=dd;best=i;}
    }
    if(best>=0&&bd<=18){dropStroke(best);return true;}
    return false;
  }

  /* lista de pontos: serve para eu montar os pinos definitivos */
  var marksBox=document.getElementById("marks"),markOut=document.getElementById("markout");
  function refreshPoints(){
    var out=[],n=0;
    for(var i=0;i<strokes.length;i++)if(strokes[i].type==="point"){
      var p=strokes[i].pts[0];
      out.push('{x:'+Math.round(p.x)+', y:'+Math.round(p.y)+', t:"ponto '+(n++)+'"},');
    }
    markOut.textContent=out.length?out.join("\n"):"Clique sobre a planta para capturar a coordenada.";
    if(out.length){try{
      var pr=navigator.clipboard&&navigator.clipboard.writeText(out.join("\n"));
      if(pr&&pr.catch)pr.catch(function(){});
    }catch(e){}}
  }
  function addPoint(cx,cy){
    var st={type:"point",pts:[toDraw(cx,cy)],c:pen.c};
    st.el=mkEl(st);strokes.push(st);refreshPoints();drawInk();
  }

  /* ================= ferramentas ================= */
  var HINTS={
    nav:'<span><b>clique</b> aproxima no ponto</span><span><b>clique de novo</b> avança / volta</span><span><b>arrastar</b> caminha</span><span><b>scroll / pinça</b> zoom</span><span><b>esc</b> volta à prancha</span>',
    free:'<span><b>arrastar</b> desenha</span><span><b>dois dedos</b> navegam</span><span><b>ctrl+z</b> desfaz</span><span><b>esc</b> volta a navegar</span>',
    line:'<span><b>arrastar</b> traça a reta</span><span><b>shift</b> trava o ângulo</span><span><b>ctrl+z</b> desfaz</span>',
    arrow:'<span><b>arrastar</b> puxa a seta</span><span><b>shift</b> trava o ângulo</span><span><b>ctrl+z</b> desfaz</span>',
    point:'<span><b>clique</b> marca e copia a coordenada</span><span><b>borracha</b> apaga um a um</span>',
    erase:'<span><b>clique ou arraste</b> sobre o traço para apagar</span><span><b>cesto</b> limpa tudo</span>'
  };
  var hintEl=document.getElementById("hint");
  var toolBtns=[].slice.call(document.querySelectorAll(".tool[data-tool]"));
  function setTool(t){
    tool=t;
    toolBtns.forEach(function(b){b.setAttribute("aria-pressed",b.dataset.tool===t?"true":"false");});
    viewer.classList.toggle("draw",t==="free"||t==="line"||t==="arrow");
    viewer.classList.toggle("marking",t==="point");
    viewer.classList.toggle("erase",t==="erase");
    marksBox.hidden=(t!=="point");
    hintEl.innerHTML=HINTS[t];
  }
  toolBtns.forEach(function(b){b.addEventListener("click",function(){setTool(b.dataset.tool);});});

  var swBtns=[].slice.call(document.querySelectorAll(".sw"));
  swBtns.forEach(function(b){b.addEventListener("click",function(){
    pen=PENS[+b.dataset.pen];
    swBtns.forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false");});
    if(tool==="nav"||tool==="erase")setTool("free");
  });});
  document.getElementById("undo").addEventListener("click",undo);
  document.getElementById("clearAll").addEventListener("click",clearAll);

  var btnPins=document.getElementById("btnpins");
  btnPins.addEventListener("click",function(){
    pinsOn=!pinsOn;pinsLayer.hidden=!pinsOn;
    this.setAttribute("aria-pressed",pinsOn?"true":"false");
    this.textContent=pinsOn?"Pontos ligados":"Pontos desligados";
  });

  /* ================= ponteiro ================= */
  var pointers={},last=null,startPt=null,startT=0,moved=false,pinchBase=null;
  function drawing(){return tool==="free"||tool==="line"||tool==="arrow";}
  function snap(a,b){
    var dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx),L=Math.hypot(dx,dy);
    ang=Math.round(ang/(Math.PI/4))*(Math.PI/4);
    return {x:a.x+L*Math.cos(ang),y:a.y+L*Math.sin(ang)};
  }
  viewer.addEventListener("pointerdown",function(e){
    viewer.setPointerCapture(e.pointerId);
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pointers).length===1){
      last={x:e.clientX,y:e.clientY};startPt={x:e.clientX,y:e.clientY};
      startT=Date.now();moved=false;anim(false);
      if(drawing())live=newStroke(tool==="free"?"free":tool,toDraw(e.clientX,e.clientY));
      else if(tool==="erase")eraseAt(e.clientX,e.clientY);
      else viewer.classList.add("dragging");
    }else{
      if(live){dropStroke(strokes.length-1);live=null;}  /* dois dedos: vira navegação */
      pinchBase=pinchState();
    }
  });
  function pinchState(){
    var k=Object.keys(pointers);if(k.length<2)return null;
    var a=pointers[k[0]],b=pointers[k[1]];
    return {d:Math.hypot(b.x-a.x,b.y-a.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,s:scale};
  }
  viewer.addEventListener("pointermove",function(e){
    if(!pointers[e.pointerId])return;
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pointers).length>=2){
      var now=pinchState();
      if(pinchBase&&now&&pinchBase.d>0){moved=true;zoomAt(now.cx,now.cy,pinchBase.s*(now.d/pinchBase.d),false);}
      return;
    }
    if(!last)return;
    var mx=Math.abs(e.clientX-startPt.x),my=Math.abs(e.clientY-startPt.y);
    if(mx>6||my>6)moved=true;
    if(live){
      var p=toDraw(e.clientX,e.clientY);
      if(live.type==="free"){
        if(Math.hypot(e.clientX-last.x,e.clientY-last.y)>2.5){live.pts.push(p);last={x:e.clientX,y:e.clientY};}
      }else{
        live.pts[1]=e.shiftKey?snap(live.pts[0],p):p;
      }
      drawInk();return;
    }
    if(tool==="erase"){eraseAt(e.clientX,e.clientY);last={x:e.clientX,y:e.clientY};return;}
    var dx=e.clientX-last.x,dy=e.clientY-last.y;
    last={x:e.clientX,y:e.clientY};
    if(moved){tx+=dx;ty+=dy;apply();}
  });
  function endPointer(e){
    delete pointers[e.pointerId];
    if(Object.keys(pointers).length<2)pinchBase=null;
    if(Object.keys(pointers).length>0)return;
    viewer.classList.remove("dragging");
    if(live){
      if(!moved)dropStroke(strokes.length-1);   /* toque sem arrasto não vira traço */
      live=null;
    }else if(!moved&&(Date.now()-startT)<450&&startPt){
      if(tool==="point")addPoint(e.clientX,e.clientY);
      else if(tool==="nav")cycle(e.clientX,e.clientY);
    }
    last=null;startPt=null;
  }
  viewer.addEventListener("pointerup",endPointer);
  viewer.addEventListener("pointercancel",endPointer);
  viewer.addEventListener("wheel",function(e){
    e.preventDefault();
    zoomAt(e.clientX,e.clientY,scale*Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0022)),false);
    stopIdx=0;
  },{passive:false});
  viewer.addEventListener("contextmenu",function(e){e.preventDefault();});

  document.getElementById("btnfit").addEventListener("click",function(){fit(true);});
  document.getElementById("zin").addEventListener("click",function(){
    zoomAt(viewer.clientWidth/2,viewer.clientHeight/2,scale*1.6,true);});
  document.getElementById("zout").addEventListener("click",function(){
    zoomAt(viewer.clientWidth/2,viewer.clientHeight/2,scale/1.6,true);});
  range.addEventListener("input",function(){
    zoomAt(viewer.clientWidth/2,viewer.clientHeight/2,
      fitScale*Math.pow(maxScale/fitScale,(+range.value)/1000),false);
  });

  var lb=document.getElementById("lb"),lbimg=document.getElementById("lbimg"),
      lbvid=document.getElementById("lbvid"),lbcap=document.getElementById("lbcap"),
      lbcount=document.getElementById("lbcount");
  var cur=null,ci=0,closeT=null;
  function tryPlay(){
    if(lbvid.hidden)return;
    lbvid.muted=true;
    var pr=lbvid.play();
    if(pr&&pr.catch)pr.catch(function(){});  /* se o navegador recusar, fica o pôster + controles */
  }
  lbvid.addEventListener("canplay",tryPlay);
  lbvid.addEventListener("loadeddata",tryPlay);
  function openLB(p){
    cur=p;ci=0;
    if(closeT){clearTimeout(closeT);closeT=null;}
    lb.hidden=false;document.body.classList.add("veil");renderLB();
    requestAnimationFrame(function(){requestAnimationFrame(function(){lb.classList.add("on");});});
  }
  function renderLB(){
    if(!cur)return;
    var m=cur.media[ci];
    lbvid.pause();
    if(m.type==="video"){
      lbimg.hidden=true;lbvid.hidden=false;
      lbvid.poster=m.poster||"";
      if(lbvid.getAttribute("src")!==m.src) lbvid.src=m.src;
      lbvid.muted=true;
      try{ if(lbvid.readyState>0) lbvid.currentTime=0; }catch(err){}
      tryPlay();
    }else{
      lbvid.hidden=true;lbvid.removeAttribute("src");
      lbimg.hidden=false;lbimg.src=m.src;lbimg.alt=m.cap+" — "+m.sub;
    }
    lbcap.innerHTML=m.cap+"<small>"+m.sub+"</small>";
    lbcount.textContent=(ci+1)+" / "+cur.media.length;
  }
  function step(d){if(!cur)return;ci=(ci+d+cur.media.length)%cur.media.length;renderLB();}
  document.getElementById("lbnext").addEventListener("click",function(){step(1);});
  document.getElementById("lbprev").addEventListener("click",function(){step(-1);});
  document.getElementById("lbclose").addEventListener("click",closeLB);
  lb.addEventListener("click",function(e){if(e.target===lb||e.target.id==="lbstage")closeLB();});
  function closeLB(){
    if(lb.hidden)return;
    lbvid.pause();lb.classList.remove("on");document.body.classList.remove("veil");cur=null;
    closeT=setTimeout(function(){
      lb.hidden=true;lbvid.removeAttribute("src");lbimg.removeAttribute("src");closeT=null;
    },280);
  }

  window.addEventListener("keydown",function(e){
    if(!lb.hidden){
      if(e.key==="Escape")closeLB();
      if(e.key==="ArrowRight")step(1);
      if(e.key==="ArrowLeft")step(-1);
      return;
    }
    var k=e.key.toLowerCase(),pan=80;
    if((e.ctrlKey||e.metaKey)&&k==="z"){undo();e.preventDefault();return;}
    if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
      var map={v:"nav",d:"free",l:"line",a:"arrow",p:"point",e:"erase"};
      if(map[k]){setTool(map[k]);e.preventDefault();return;}
    }
    if(e.key==="Escape"){ if(tool!=="nav"){setTool("nav");} else {fit(true);} }
    else if(e.key==="0"){fit(true);}
    else if(e.key==="+"||e.key==="="){zoomAt(viewer.clientWidth/2,viewer.clientHeight/2,scale*1.6,true);}
    else if(e.key==="-"){zoomAt(viewer.clientWidth/2,viewer.clientHeight/2,scale/1.6,true);}
    else if(e.key==="ArrowRight"){tx-=pan;apply();}
    else if(e.key==="ArrowLeft"){tx+=pan;apply();}
    else if(e.key==="ArrowDown"){ty-=pan;apply();}
    else if(e.key==="ArrowUp"){ty+=pan;apply();}
    else return;
    e.preventDefault();
  });
  window.addEventListener("resize",function(){
    var rel=scale/fitScale;fit(false);
    scale=clamp(fitScale*rel,fitScale,maxScale);apply();
  });

  setTool("nav");
  fit(false);
})();
</script>

</body>
</html>
