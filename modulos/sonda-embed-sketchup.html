<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>sonda · embed do SketchUp — DESCARTÁVEL</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SONDA DESCARTÁVEL · 02/09/2026
   Existe para responder UMA pergunta que não se responde de outro jeito:
   o viewer do SketchUp aceita ser embedado a partir de
   `steinvalente-dev.github.io`?

   Por que não dá para testar de outro lugar: o bloqueio é por cabeçalho
   (`X-Frame-Options` / `Content-Security-Policy: frame-ancestors`), o
   navegador só reclama no console, e o cabeçalho é servido em função da
   ORIGEM que pede. Testar em localhost responde sobre localhost, não
   sobre o domínio onde a peça vive.

   APAGAR depois de ler o resultado. Não é módulo, não é peça, não entra
   em índice.
   ═══════════════════════════════════════════════════════════════════ */
  :root{--cal:#F3EEE7;--ferro:#231F20}
  *{box-sizing:border-box;margin:0}
  body{background:var(--ferro);color:var(--cal);
    font:14px/1.5 ui-monospace,Menlo,monospace;padding:20px}
  h1{font-size:15px;letter-spacing:.1em;text-transform:uppercase;
    color:#F3EEE7a6;margin-bottom:4px}
  p.av{color:#E9A184;margin-bottom:18px;font-size:12px}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .cx{border:1px solid #F3EEE730;border-radius:3px;overflow:hidden;
    display:flex;flex-direction:column;min-height:50vh}
  .cx h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:9px 11px;background:#F3EEE712;color:#F3EEE7cc;font-weight:400}
  .cx code{display:block;padding:0 11px 9px;font-size:10.5px;color:#F3EEE773;
    word-break:break-all}
  .cx iframe{flex:1;width:100%;border:0;background:#0e0c0d}
  pre{background:#0e0c0d;border:1px solid #F3EEE726;border-radius:3px;
    padding:13px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;
    color:#F3EEE7d9}
</style>
</head>
<body>
<h1>sonda · embed do SketchUp</h1>
<p class="av">Arquivo descartável. Serve para uma medição e depois é apagado.</p>

<div class="par">
  <div class="cx">
    <h2>A · página de embed do 3D Warehouse</h2>
    <code>3dwarehouse.sketchup.com/embed/&lt;id&gt;</code>
    <iframe id="fa" src="https://3dwarehouse.sketchup.com/embed/77fa8a68-583e-4e52-8a24-7bf9bc698723"
            allow="fullscreen; xr-spatial-tracking"></iframe>
  </div>
  <div class="cx">
    <h2>B · viewer direto</h2>
    <code>app.sketchup.com/viewer/3dw?WarehouseModelId=&lt;id&gt;</code>
    <iframe id="fb" src="https://app.sketchup.com/viewer/3dw?WarehouseModelId=77fa8a68-583e-4e52-8a24-7bf9bc698723"
            allow="fullscreen; xr-spatial-tracking"></iframe>
  </div>
</div>

<pre id="log">medindo…</pre>

<script>
/* O `load` do iframe DISPARA mesmo em quadro bloqueado — o navegador carrega
   a própria página de erro dentro dele. Então `load` não decide nada.
   O que decide: tentar tocar em `contentWindow.location.href`. Em quadro que
   carregou de verdade, cross-origin, isso lança SecurityError — e isso é
   SUCESSO. Em quadro bloqueado o documento fica na mesma origem (about:blank)
   e a leitura FUNCIONA — e isso é FALHA. A lógica é invertida de propósito,
   e é a única leitura confiável sem acesso ao cabeçalho.
   O recado do bloqueio também sai no console; ler os dois. */
var linhas = [];
function mede(id, rotulo){
  var f = document.getElementById(id), veredito, detalhe;
  try{
    var h = f.contentWindow.location.href;
    veredito = (h === 'about:blank' || h === '' || h === location.href)
      ? 'BLOQUEADO' : 'inconclusivo';
    detalhe = 'contentWindow.location.href = ' + JSON.stringify(h);
  }catch(e){
    veredito = 'EMBEDA';
    detalhe = 'leitura cross-origin barrada (' + e.name + ') — o quadro tem '
            + 'documento de outra origem, logo carregou';
  }
  linhas.push(rotulo + '\n  -> ' + veredito + '\n  ' + detalhe);
}
/* 9 s: o viewer é pesado (40 MB) e o veredito só vale depois de o quadro ter
   tido chance real de carregar ou de ser recusado. */
setTimeout(function(){
  mede('fa', 'A · 3dwarehouse.sketchup.com/embed/');
  mede('fb', 'B · app.sketchup.com/viewer/3dw');
  document.getElementById('log').textContent =
    'origem desta pagina: ' + location.origin + '\n\n' + linhas.join('\n\n')
    + '\n\nConferir tambem o console: bloqueio por cabecalho aparece la como\n'
    + '"Refused to display ... in a frame because it set X-Frame-Options"\n'
    + 'ou violacao de "frame-ancestors".';
}, 9000);
</script>
</body>
</html>
