       volta para lugar nenhum;
   2 · botão, link, pino e visor — o guarda que já existia;
   3 · o `.nav` e o `.dots`, que ficam FORA do #palco e têm o seu próprio
       handler com stopPropagation.

   Não há afordância desenhada, de propósito: o gesto se descobre no
   primeiro toque errado e um rótulo permanente na tela seria ruído em
   peça de cliente. Se ele pedir, entra como dica que aparece uma vez.  */
palco.addEventListener('click',e=>{if(e.target.closest('.ms-start')){avanca();return}
  if(e.target.closest('a,button,.pin,.lote,.g-earth-3d .visor,.g-modelo-3d .visor,.g-modelo-3d .cenas,.g-mapa-2d .visor'))return;
  const faixa=Math.min(Math.max(78,innerWidth*0.16),230);
  if(e.clientX<=faixa){recua();return}
  avanca()});
let tx=0;
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>52){d<0?avanca():recua()}},{passive:true});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));


/* ─── cortina diagonal: intercepta a primeira saída da abertura, venha de onde
   vier (pílula, seta do chrome, teclado ou toque). ─── */
(function(){
  const cortina=document.getElementById('mscortina');let correndo=false;
  const _go=window.go||go;
  function varre(depois){
    correndo=true;cortina.classList.remove('sai');void cortina.offsetWidth;
    cortina.classList.add('on');
    setTimeout(depois,580);
    setTimeout(()=>{cortina.classList.remove('on');cortina.classList.add('sai')},660);
    setTimeout(()=>{cortina.classList.remove('sai');cortina.style.visibility='hidden';
      void cortina.offsetWidth;cortina.style.visibility='';correndo=false},1340);
  }
  window.go=function(i,tudo){
    const j=Math.max(0,Math.min(DECK.length-1,i));
    /* a diagonal marca duas coisas: a saida da abertura e a entrada de cada
       divisor de secao. Em nenhum outro lugar. */
    const vale = !correndo && j>cur && (cur===0 || DECK[j].g==='divisor');
    if(vale && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      varre(()=>_go(j,tudo));return;
    }
    _go(i,tudo);
  };
})();

/* ─── dois fundos morph, um por papel ──────────────────────────────────────
   O canvas da marca roda o portfólio do Michel; o do divisor roda as imagens
   do deck. Duas instâncias em vez de uma porque o `montar()` fixa o conjunto
   de texturas na carga — não há como trocar a lista depois.
   Custo real: um segundo contexto WebGL2 e ~8 MB de VRAM. Nenhuma das duas
   desenha fora do seu slide: o go() pausa a que não está em cena.
   `?semfundo` desliga as duas. `?semdivisor` desliga só a do divisor.      */
if(!location.search.includes('semfundo')){
  const sobe=(id,imgs,opt)=>{
    try{ return MSFundo.montar(document.getElementById(id), imgs,
      Object.assign({scale:0.85, prep:false, sortear:true}, opt)); }
    catch(e){ console.warn('fundo morph indisponivel em #'+id,e); return null; }
  };
  const subir=()=>{
    /* a paleta do morph sai dos TOKENS, lida no navegador (tok, acima):
       trocar o :root da marca troca o fundo junto, sem hex aqui. */
    /* marca: o campo escuro da marca, trama correndo para a tinta, acento */
    window.MSF  = sobe('msfundo',   CAPA_IMGS,
                       {paper:tok('--escuro'), ink:tok('--tinta'), acc:tok('--acento')});
    /* divisor: acompanha o tema dos divisores do DECK — `terra` pinta o
       campo de acento (padrão da michel stein_), `esc` pinta de escuro */
    const divTerra=DECK.some(x=>x.g==='divisor'&&x.terra);
    window.MSFD = sobe('msfundo-d', DIV_IMGS,
                       divTerra ? {paper:tok('--acento'), ink:tok('--tinta'), acc:tok('--tinta')}
                                : {paper:tok('--escuro'), ink:tok('--tinta'), acc:tok('--acento-claro')});
    const b=document.body.classList;
    if(window.MSF ){ MSF .pausar(!b.contains('com-fundo')||b.contains('fundo-div'));
                     if(b.contains('com-fundo')&&!b.contains('fundo-div')) MSF.entrada(); }
    if(window.MSFD){ MSFD.pausar(!b.contains('fundo-div'));
                     if(b.contains('fundo-div')) MSFD.entrada(); }
  };
  ('requestIdleCallback' in window) ? requestIdleCallback(subir,{timeout:1200}) : setTimeout(subir,300);
}

/* ═══════════════════════════════════════════════════════════════════════════
   CARGA TARDIA DAS IMAGENS (`data-src`)
   O `cheia` escreve `data-src`, não `src`: a imagem entra quando o slide
   chega, mais o vizinho seguinte. Com base64 isso poupa a decodificação de
   todas na abertura; com arquivo ao lado (`img/`, como na EMEI, 24 renders,
   7 MB) é o que torna a peça abrível. ⚑ Peça com imagens em pasta precisa da
   PASTA, não só do .html — entrega-se por link.
   ═════════════════════════════════════════════════════════════════════════ */
(function(){
  function puxa(i){
    const sl=document.querySelectorAll('#palco .slide')[i]; if(!sl) return;
    sl.querySelectorAll('img[data-src]').forEach(function(im){
      im.src=im.dataset.src; delete im.dataset.src;
    });
  }
  window.__msPuxa=function(){ puxa(cur); puxa(cur+1); };
  window.__msPuxa();
})();


/* ═══════════════════════════════════════════════════════════════════════════
   VISOR MAPA 2D — a versao light do slide de localizacao
   Pedido do Michel em 03/09: "tira o mapa de google earth e coloca o google
   maps (2d)", porque "a performance ficou bem lenta".

   O QUE ISTO NAO FAZ, e e o ponto:
   · nao abre contexto WebGL. O `<gmp-map-3d>` desenha malha fotogrametrica
     a cada quadro, e a peca ja tem dois canvas de morph competindo pela
     mesma GPU. Aqui o mapa e telha: desenha e para;
   · nao entra em degraus. A aproximacao em quatro passos existia porque
     nascer no enquadramento final do visor 3d devolvia tela azul lisa. O
     mapa 2d nasce no zoom final sem drama;
   · nao orbita. Nao ha camera para girar, e era a orbita que exigia
     integracao por rAF, rampa, e o reenquadramento a cada quadro.

   O QUE GANHA DE GRACA: o modo HIBRIDO desenha o NOME DAS RUAS. Era um dos
   tres pedidos do Michel para este slide, e no visor 3d custava anotacao
   nossa, medida e ajustada a mao.

   ⚑ SO FUNCIONA POR LINK, igual ao visor 3d: a Maps JavaScript API recusa
   `file://`. A chave vem de modulos/ms-maps-chave.js, restrita por referrer.
   ═════════════════════════════════════════════════════════════════════════ */
window.MSMapa=(function(){
  'use strict';
  /* a chave e lida TARDE: o ms-maps-chave.js entra no fim do body, depois
     deste script. Ler na carga devolvia string vazia. */
  function chave(){ return (window.MS_MAPS&&window.MS_MAPS.chave)||''; }
  function canal(){ return (window.MS_MAPS&&window.MS_MAPS.canal)||'weekly'; }

  var TOTAL=2;
  var mapa=null, montado=false, slide=null, alvo=null, aquecido=false;

  function el(sel){ return slide?slide.querySelector(sel):null; }
  function progresso(p,rotulo){
    var f=el('.barra i'), t=el('.passos');
    if(f) f.style.width=Math.round(Math.min(p,TOTAL)/TOTAL*100)+'%';
    if(t) t.textContent=rotulo;
  }
  function falha(txt){
    if(!slide) return;
    slide.classList.remove('esperando'); slide.classList.add('falhou');
    var b=el('.estado b'), sp=el('.estado span');
    if(b) b.textContent='o mapa nao abriu';
    if(sp) sp.innerHTML=txt;
  }
  function diagnostica(){
    if(location.protocol==='file:')
      return 'Este slide precisa de <b>link</b>: a Maps API recusa arquivo '
           + 'aberto do disco (<code>file://</code>).';
    if(!chave()) return 'A chave nao carregou (<code>ms-maps-chave.js</code>).';
    if(navigator.onLine===false) return 'Sem conexao de rede.';
    return '';
  }

  /* AQUECIMENTO NIVEL 1 — o script da API entra no slide ANTERIOR.
     Mesma ideia da peca cheia, e aqui e ainda mais barato: carregar o
     script `maps` nao cria mapa nenhum, logo nao consome carga de mapa. */
  function api(){
    return new Promise(function(ok,erro){
      if(window.google&&google.maps&&google.maps.importLibrary) return ok();
      var ja=document.getElementById('ms-maps-js');
      if(ja){ ja.addEventListener('load',ok); ja.addEventListener('error',function(){ erro(new Error('rede')); }); return; }
      if(!chave()) return erro(new Error('sem chave'));
      var s=document.createElement('script'); s.id='ms-maps-js';
      s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(chave())
          + '&v='+encodeURIComponent(canal())+'&libraries=maps&language=pt-BR&region=BR';
      s.async=true; s.onload=ok; s.onerror=function(){ erro(new Error('rede')); };
      document.head.appendChild(s);
    });
  }
  function aquece(){ if(aquecido||!chave()) return; aquecido=true; api()['catch'](function(){}); }

  function monta(){
    var vis=el('.visor'); if(!vis) return;
    var lat=parseFloat(vis.dataset.lat), lng=parseFloat(vis.dataset.lng);
    var z=parseInt(vis.dataset.z||'18',10);
    alvo={lat:lat,lng:lng,z:z};
    var d=diagnostica(); if(d){ falha(d); return; }
    progresso(1,'carregando o mapa');
    api().then(function(){ return google.maps.importLibrary('maps'); })
      .then(function(lib){
        mapa=new lib.Map(vis.querySelector('.mapa'),{
          center:{lat:lat,lng:lng}, zoom:z,
          /* HIBRIDO e nao SATELITE: e o hibrido que desenha nome de rua, e
             era isso que o Michel queria ver no slide. Na peca cheia o
             satelite puro se justificava porque em 3d o hibrido cobre a
             cidade de pino de restaurante; em 2d, com a interface toda
             desligada abaixo, sobra so o topografico. */
          mapTypeId:'hybrid',
          tilt:0,
          disableDefaultUI:true,   /* o chrome do mapa nao entra em peca */
          zoomControl:true,
          keyboardShortcuts:false, /* as setas continuam do deck ate o clique */
          gestureHandling:'greedy',
          clickableIcons:false,    /* sem cartao de estabelecimento do Google */
          isFractionalZoomEnabled:true
        });
        /* `tilesloaded` dispara quando a primeira malha de telhas terminou —
           medicao real, nao relogio. */
        google.maps.event.addListenerOnce(mapa,'tilesloaded',function(){
          progresso(TOTAL,'pronto');
          if(slide) slide.classList.remove('esperando');
        });
      })['catch'](function(e){
        falha(diagnostica()
          || 'Nao deu para carregar a API do Google (<code>'
             +((e&&e.message)||'erro')+'</code>). Este slide nao funciona offline.');
      });
  }
  function recentra(){
    if(!mapa||!alvo) return;
    mapa.panTo({lat:alvo.lat,lng:alvo.lng}); mapa.setZoom(alvo.z);
    var b=el('.rec'); if(b){ b.classList.add('feito');
      setTimeout(function(){ b.classList.remove('feito'); },900); }
  }
  function desativa(){
    document.querySelectorAll('.g-mapa-2d').forEach(function(sl){ sl.classList.remove('girando'); });
  }
  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-mapa-2d'); if(!sl) return;
    if(e.target.closest('.rec')){ e.stopPropagation(); recentra(); return; }
    if(e.target.closest('.sair')){ e.stopPropagation(); desativa(); document.body.focus(); return; }
    if(e.target.closest('.veu')){ e.stopPropagation(); sl.classList.add('girando'); }
  });
  /* indices de todo slide mapa-2d: se um dia a peca tiver dois, os dois
     aquecem no slide que os antecede. */
  var PROX=[];
  DECK.forEach(function(s,i){ if(s.g==='mapa-2d') PROX.push(i); });

  return {
    chegou:function(){
      var s=DECK[cur];
      if(PROX.indexOf(cur+1)>=0) aquece();
      if(!s||s.g!=='mapa-2d'){
        desativa();
        /* DESMONTA ao sair: o mapa vetorial e WebGL e ficava vivo atras dos
           slides seguintes (04/09/2026). Na volta remonta — API em cache. */
        if(mapa){ var vis=slide&&slide.querySelector('.visor'); var d=vis&&vis.querySelector('.mapa');
          if(d){ var novo=d.cloneNode(false); d.parentNode.replaceChild(novo,d); } mapa=null; }
        if(montado){ montado=false;
          document.querySelectorAll('.g-mapa-2d').forEach(function(sl){ sl.classList.remove('esperando','pronto','girando','falhou'); }); }
        return;
      }
      slide=document.querySelectorAll('#palco .slide')[cur];
      if(montado){ if(mapa) google.maps.event.trigger(mapa,'resize'); return; }
      montado=true; slide.classList.add('esperando');
      progresso(0,'preparando'); monta();
    }
  };
})();

/* liga ao go(), depois da cortina diagonal — a cortina adia a troca em
   580 ms, por isso a espera aqui. */
(function(){
  var _go=window.go;
  window.go=function(i,tudo){ _go(i,tudo); setTimeout(function(){
    window.__msPuxa(); MSMapa.chegou(); },700); };
  window.__msPuxa(); MSMapa.chegou();
})();

<!-- retorno ao acervo + camada de toque. Comportamento em modulos/ms-voltar.js.
     Reposto em 25/08: veio de outra sessão, no commit e8bf561, e o build local
     não sabia dele. Toda peça do acervo carrega esta linha. -->
<script>
/* ─── ociosidade do ponteiro ───────────────────────────────────────────
   1,8 s parado e o body ganha `ocioso`. Qualquer gesto tira. Genérico de
   propósito: quem decide ONDE o efeito acontece é a classe `em-cheia`.
   ─────────────────────────────────────────────────────────────────── */
(function(){
  var t=null, ATRASO=1800;
  window.__msAcorda=function(){
    document.body.classList.remove('ocioso');
    clearTimeout(t);
    t=setTimeout(function(){ document.body.classList.add('ocioso'); }, ATRASO);
  };
  ['pointermove','pointerdown','wheel','keydown','touchstart'].forEach(function(ev){
    addEventListener(ev, window.__msAcorda, {passive:true});
  });
  window.__msAcorda();
})();
</script>
