.g-prancha .ptop{display:flex;justify-content:space-between;align-items:flex-end;
  gap:clamp(20px,2.5cqw,52px);flex-wrap:wrap}
.g-prancha .ptop h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.g-prancha .plead{font-size:var(--fs-body);color:var(--soft);max-width:52ch;line-height:1.5}
.g-prancha .grade{flex:1;min-height:0;display:grid;gap:clamp(8px,.9cqw,20px)}
.g-prancha .grade .cel{display:flex;flex-direction:column;gap:.5em;min-height:0;
  justify-content:center}
.g-prancha .grade .cel .ph{flex:1;max-height:100%;position:relative;overflow:hidden;
  background:var(--tinta-3)}
.g-prancha .grade .cel .ph img{width:100%;height:100%;object-fit:cover;display:block}
.g-prancha .grade .cel.pilha{gap:clamp(6px,.65cqw,14px)}
.g-prancha .grade .cel.pilha .ph{flex:1;background:transparent}
.g-prancha .grade .cel.pilha .ph img{object-fit:contain}
.g-prancha .pcap{font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.42;
  color:var(--soft);letter-spacing:.02em}
.g-prancha .slot{position:absolute;inset:0;display:grid;place-content:center;gap:.35em;
  text-align:center;padding:1em;
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px);
  border:1px dashed var(--tinta-20)}
.g-prancha .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.4em;line-height:1}
.g-prancha .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--tinta)}
.g-prancha .slot s{text-decoration:none;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-45)}

/* ═══ vazio — o gabarito existe, o dado do projeto não ═════════════════
   Estado legítimo, como o slot de imagem: permite montar a estrutura
   antes de o levantamento existir. Vale para qualquer gabarito que
   dependa de dado, não só o mapa.
   ═══════════════════════════════════════════════════════════════════ */
.vazio{position:absolute;inset:var(--top) var(--gut) var(--bot);
  display:grid;place-content:center;justify-items:center;gap:.55em;text-align:center;
  border:1px dashed var(--tinta-20);
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px)}
.vazio .vmarca{font-family:var(--f-display);font-weight:500;font-style:italic;
  color:var(--acento);font-size:clamp(20px,2.2cqw,34px);line-height:1}
.vazio h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.vazio .vsub{font-size:var(--fs-body);color:var(--soft);max-width:46ch}
.vazio .vnota{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta-45);max-width:52ch;margin-top:.4em}
.vazio .vnota code{text-transform:none;letter-spacing:0}
/* ═══ aviso — gabarito desconhecido ou campo obrigatório ausente ═════════
   03/09/2026. O `return ''` do tpl() virou slide visível: antes um `g`
   errado sumia em silêncio, e um `itens` faltando escrevia `undefined` na
   tela ou derrubava o deck inteiro. Agora o slide aparece hachurado, diz o
   que falta, e o console recebe o mesmo texto. Mesmo desenho do `vazio`.
   ═══════════════════════════════════════════════════════════════════ */
.vazio.aviso{border-color:var(--acento-45)}
.vazio.aviso .vmarca{color:var(--acento)}
.vazio.aviso code{font-family:var(--f-mono);background:var(--tinta-5);padding:.1em .4em;border-radius:2px}

/* ═══ o canto superior direito — texto ou logotipo ═══════════════════════
   Decisão do Michel, 03/09/2026: o padrão da casa é TEXTO (michel stein_,
   AMAZ, Lavrō). A Sarasá leva o LOGOTIPO pequeno, fixo, trocando
   positivo/negativo pelo tema do slide — testado na EMEI Presidente Dutra
   em reunião e aprovado. Quem decide é a constante LOGO_CANTO do bloco da
   marca; o script de marca troca `.marca-txt` por `.marca-lk`.
   Tamanho do logotipo: 120 a 148 px no PADRÃO — reduzido de 132–180 em
   03/09/2026 a pedido do Michel ("pode ficar menor em todos os casos").
   Medido antes de mudar: a 1600 px de largura o antigo dava 152 px, e num
   celular deitado (852 px) a base fixa de 132 px o inflava para 15,5% da
   largura da tela contra 9,5% no desktop. Era isso que o incomodava.
   A troca positivo/negativo é POR TOKEN: o SVG traz fill="var(--tinta)" e
   fill="var(--primaria)"; sobre campo escuro, imagem ou visor os dois viram
   papel e o lockup fica monocromático, como o negativo oficial. SVG
   monocromático usa fill="currentColor" e recebe o mesmo tratamento.   */
.marca{display:flex;align-items:center}
.marca .marca-lk{display:block;width:var(--logo-canto-w,clamp(120px,8.6cqw,148px));
  line-height:0;opacity:.9;transition:opacity .3s ease;color:var(--tinta)}
.marca .marca-lk svg{display:block;width:100%;height:auto}

/* ⚑ NÍVEL MICRO EM TELA DE CELULAR — regra do arquivo de marca, não gosto.
   MARCA-SARASA §4, "Quatro níveis de escala": abaixo de 130 px o lockup
   entra no nível **Micro**, e nele `estúdio` NÃO encolhe — **sai**. É o
   nível de marca d'água, que é exatamente o papel do canto do chrome.
   Então em tela estreita ou baixa o logotipo diminui de verdade E perde
   `estúdio`, em vez de virar um lockup de 84 px ilegível — o que violaria
   a §4 e é o erro que estava para acontecer.
   O corte é por FILL, e isso só funciona porque o SVG oficial separa as
   duas palavras em dois tokens: `estúdio` em --tinta, `Sarasá` em
   --primaria. Medido no lockup-pos.svg: sete paths de cada.
   A caixa não muda de proporção ao esconder `estúdio`: o `S` é o único
   glifo de corpo inteiro (y 0→77) e é ele que define a altura do viewBox.
   Verificado no arquivo de marca, tabela de medidas da §4.
   Limiares: 900 px de largura pega celular deitado e tablet em pé; 520 px
   de altura pega celular deitado em tela curta, onde a largura sozinha não
   denuncia. */
@media (max-width:900px),(max-height:520px){
  .marca .marca-lk{--logo-canto-w:clamp(70px,10cqw,100px);opacity:.82}
  /* o seletor casa a STRING do atributo, não o valor computado: continua
     valendo quando o tema troca --tinta por --papel sobre campo escuro. */
  .marca .marca-lk svg path[fill="var(--tinta)"]{display:none}
}
/* o `hidden` do HTML tem de vencer o display:block acima */
.marca .marca-lk[hidden],.marca .marca-txt[hidden]{display:none}
body.esc .marca .marca-lk,body.terra .marca .marca-lk,body.com-fundo .marca .marca-lk,
body.em-imagem .marca .marca-lk{--tinta:var(--papel);--primaria:var(--papel);--acento:var(--papel);color:var(--papel)}

/* ═══ grafismo de marca na base — opcional, por `graf:1` ══════════════════
   Portado da EMEI (Sarasá: contorno da Fortaleza da Barra Grande). Sempre
   na base, sangrando nas laterais, numa cor só (papel). Nunca atrás de
   texto corrido, tabela ou croqui: entra em divisor e contracapa. O SVG vem
   da constante GRAFISMO do bloco da marca; sem ela, `graf:1` não faz nada. */
#msgraf{position:absolute;left:-2%;right:-2%;bottom:0;z-index:0;
  pointer-events:none;opacity:0;transition:opacity .7s ease;
  color:var(--papel);line-height:0}
#msgraf svg{display:block;width:104%;height:auto}
body.com-graf #msgraf{opacity:.28}
body.no-fim #msgraf{opacity:.18}

/* ═══ marca: lockup em SVG e contracapa com crédito ══════════════════════
   `lockup:1` no slide `marca` troca a sigla em texto pela constante LOCKUP
   do bloco (SVG monocromático em currentColor, cor do papel). A contracapa
   (`fim_:1`) aceita `credito` — a linha pequena de concepção e coordenação. */
.g-marca .lock{width:var(--lk,clamp(200px,25cqw,470px));line-height:0;flex:0 0 auto;color:var(--papel)}
.g-marca .lock svg{display:block;width:100%;height:auto}
.g-marca .credito-peca{font-family:var(--f-mono);font-size:clamp(9px,.7cqw,12.5px);
  letter-spacing:.08em;text-transform:uppercase;color:var(--papel-70);
  margin-top:clamp(14px,2.2cqh,30px);line-height:1.5}

/* ═══ capa em dois momentos — opcional, por `dois:1` no slide `marca` ═════
   Portado de modulos/capa-morph-sarasa.html pela EMEI em 03/09/2026.
   Momento A: a capa institucional (lockup ou sigla, papel, descritor, site,
   pílula), parada na tela enquanto a sala se acomoda. O clique em `começar`
   chama avanca(): o `.cm-b` é um `.passo`, então entra o momento B — o
   TÍTULO da apresentação (kick, t, sub, pe) no lugar do bloco institucional.
   O clique seguinte corre a cortina e entra no deck. Os dois blocos se
   sobrepõem em absoluto e trocam por opacidade; o `.cm-b` vem antes no DOM
   só para o seletor `~` poder apagar o `.cm-a`.                            */
.slide.g-marca.dois{padding:0;justify-content:center}
.g-marca.dois{--lk:clamp(200px,25cqw,470px)}
.g-marca.dois .cm-a,.g-marca.dois .cm-b{position:absolute;left:var(--gut-in);right:var(--gut-in);
  top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(11px,1.6cqh,24px);z-index:1;
  transition:opacity .55s ease,transform .55s ease}
.g-marca.dois .cm-b{opacity:0;transform:translateY(calc(-50% + 12px));pointer-events:none}
.g-marca.dois .cm-b.on{opacity:1;transform:translateY(-50%)}
.g-marca.dois .cm-b.on ~ .cm-a{opacity:0;transform:translateY(calc(-50% - 10px));pointer-events:none}
/* o qualificador vai SOB o lockup, nunca ao lado: ao lado lê como segunda marca */
.g-marca .lk-bloco{display:block}
.g-marca .nucleo{font-family:var(--f-mono);font-size:calc(var(--lk,300px)*.033);
  letter-spacing:.34em;text-transform:uppercase;color:var(--papel-80);line-height:1;
  margin-top:calc(var(--lk,300px)*.034);padding-left:calc(var(--lk,300px)*.010)}
.g-marca .descritor{font-family:var(--f-mono);font-size:clamp(10px,.82cqw,15px);
  letter-spacing:.13em;text-transform:uppercase;color:var(--papel-60);line-height:1.6;
  max-width:34ch;margin-top:calc(var(--lk,300px)*.012)}
.g-marca.dois .cm-b .mega{max-width:26ch}
.g-marca.dois .cm-b .sub{max-width:52ch}
.g-marca .cm-pe{font-family:var(--f-mono);font-size:clamp(9px,.72cqw,13px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--papel-60);margin-top:clamp(10px,1.6cqh,24px);line-height:1}

/* ═══ visores — earth-3d e modelo-3d ═════════════════════════════════════
   Portados da EMEI Presidente Dutra em 03/09/2026 (módulos mestres:
   modulos/mapa-earth-3d.html e modulos/modelo-sketchup.html). Mesma
   gramática nos dois: scrim suave (véu, não tarja), véu de ativação por
   clique, trava de teclado enquanto o visor tem o ponteiro, indicador de
   carga com passo REAL e degradação explícita. O que o modelo tem a mais é
   a RESERVA — as imagens salvas na peça — porque modelo de projeto tem
   substituto útil sem rede, e satélite não.
   ⚑ Os dois estão na lista `em-imagem` do go(): é o que inverte o chrome.
   ⚑ earth-3d SÓ FUNCIONA POR LINK (a Maps API recusa file://). A chave vem
     de modulos/ms-maps-chave.js. Receita: sistemas/gabaritos/mapa-earth-3d.md
   ⚑ modelo-3d exige modelo PÚBLICO no 3D Warehouse. Receita: gabaritos/modelo.md
   ═══════════════════════════════════════════════════════════════════ */
/* ⚑ RENOMEADO NO BUILD para o gabarito `mapa-2d` (versao light).
   E o bloco do earth-3d do esqueleto, com o seletor de slide trocado
   e `gmp-map-3d` virando `.mapa` — a div que o google.maps.Map
   preenche. Sem WebGL, mesma gramatica visual. */
.slide.g-mapa-2d{padding:0;overflow:hidden;background:var(--moldura)}
.g-mapa-2d .visor,.g-mapa-2d .visor{position:absolute;inset:0}
.g-mapa-2d .mapa{position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;filter:saturate(.86) contrast(1.03)}
.g-mapa-2d.girando .mapa{pointer-events:auto}
/* o iframe nasce SEM src e sem ponteiro: `src` só na chegada (são 40 MB);
   ponteiro só depois do clique no véu, senão a roda do mouse dá zoom no
   modelo enquanto se tenta passar o slide. */
.g-mapa-2d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  pointer-events:none;opacity:0;transition:opacity .6s ease;background:var(--moldura)}
.g-mapa-2d.pronto iframe{opacity:1}
.g-mapa-2d.girando iframe{pointer-events:auto}
.g-mapa-2d .scrim,.g-mapa-2d .scrim{position:absolute;inset:0;pointer-events:none;
  transition:opacity .3s ease;
  background:linear-gradient(180deg,var(--tinta-60) 0,var(--tinta-25) 9%,transparent 24%,
    transparent 56%,var(--tinta-35) 88%,var(--tinta-60) 100%)}
.g-mapa-2d.girando .scrim{opacity:0}
.g-mapa-2d .veu,.g-mapa-2d .veu{position:absolute;inset:0;display:grid;place-content:center;
  gap:.6em;text-align:center;background:var(--tinta-25);cursor:pointer;z-index:2;
  transition:opacity .3s ease}
.g-mapa-2d.girando .veu,.g-mapa-2d.girando .veu{opacity:0;pointer-events:none}
.g-mapa-2d .veu b,.g-mapa-2d .veu b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-mapa-2d .veu s,.g-mapa-2d .veu s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--papel-60)}
/* ⚑ o SAIR salva a apresentação. Com o ponteiro dentro do visor o foco vai
   para o mapa ou para o documento do SketchUp e as setas do deck param de
   responder — o evento nem chega ao nosso script. Este botão é o único
   caminho de volta que não depende do teclado. */
.g-mapa-2d .sair,.g-mapa-2d .sair{position:absolute;bottom:clamp(9px,1.4cqh,20px);left:50%;
  transform:translateX(-50%);display:none;align-items:center;z-index:4;cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-90);
  border:1px solid var(--papel-25);border-radius:999px;padding:.55em 1.2em}
.g-mapa-2d.girando .sair,.g-mapa-2d.girando .sair{display:flex}
.g-mapa-2d .rotulo,.g-mapa-2d .rotulo{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;pointer-events:none;
  max-width:min(46ch,60cqw);padding:clamp(14px,2cqh,30px) clamp(18px,1.9cqw,38px);
  background:var(--tinta-45);/* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid var(--papel-10);border-radius:3px;transition:opacity .3s ease}
.g-mapa-2d.girando .rotulo{opacity:0}

/* ⚑ O RÓTULO DO VISOR EM CELULAR — 03/09/2026, pedido do Michel:
   *"na versão móbile precisamos subir com essa caixa de texto, ou reduzir
   drasticamente a informação"*.
   MEDIDO num celular deitado antes de mexer: a caixa saía com 462 × 131 px,
   ou 36% da altura da tela a 800 × 360, e o teste automático confirmou que
   ela CRUZAVA o centro vertical — isto é, cobria justamente o lote de que
   o slide fala. No desktop a mesma caixa ocupa 23% e sobra tela.
   A escolha é a segunda que ele ofereceu, reduzir a informação, e não a
   primeira: subir a caixa só troca o que ela cobre — em vez do lote,
   cobriria as ruas do topo. Então em tela baixa sai o `lead` (a frase
   longa; o `h2` continua dizendo do que se trata), a caixa encolhe e se
   cola na faixa de baixo, liberando o centro.
   O `cap` FICA: em toque é ele que diz que o visor é interativo, e sem
   teclado ninguém descobre isso sozinho. */
@media (max-height:520px),(max-width:760px){
  .g-mapa-2d .rotulo,.g-mapa-2d .rotulo,.g-mapa-2d .rotulo{
    bottom:calc(var(--bot) - clamp(10px,3cqh,26px));
    max-width:min(34ch,66cqw);
    padding:clamp(8px,1.4cqh,14px) clamp(11px,1.5cqw,18px)}
  .g-mapa-2d .rotulo .lead,.g-mapa-2d .rotulo .lead,.g-mapa-2d .rotulo .lead{
    display:none}
  .g-mapa-2d .rotulo h2,.g-mapa-2d .rotulo h2,.g-mapa-2d .rotulo h2{
    font-size:clamp(15px,4.2cqh,22px);margin-top:.16em}
}
.g-mapa-2d .rotulo .kick,.g-mapa-2d .rotulo .kick{display:block;color:var(--papel-80);margin:0;
  font-size:var(--fs-cap);text-transform:uppercase}
.g-mapa-2d .rotulo h2,.g-mapa-2d .rotulo h2{color:var(--papel);font-size:var(--fs-h);line-height:1.04;margin-top:.24em}
.g-mapa-2d .rotulo .lead,.g-mapa-2d .rotulo .lead{color:var(--papel-90);font-size:var(--fs-body);margin-top:.55em;line-height:1.5}
.g-mapa-2d .rotulo .cap,.g-mapa-2d .rotulo .cap{display:block;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.08em;text-transform:uppercase;
  color:var(--papel-60);margin-top:.9em}
/* os comandos que o slide expõe numa reunião. earth: ÓRBITA e RECENTRAR —
   navegar no 3d é fácil e voltar não; sem o recentrar a saída é recarregar
   a página na frente do cliente. modelo: RECOMEÇAR (recarrega o quadro; a
   câmera é do viewer da Trimble) e IMAGENS (a reserva, à mão). */
.g-mapa-2d .cmd,.g-mapa-2d .cmd{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;
  display:flex;align-items:center;gap:clamp(6px,.6cqw,11px);transition:opacity .3s ease}
.g-mapa-2d.girando .cmd{opacity:.35}
.g-mapa-2d.girando .cmd:hover{opacity:1}
.g-mapa-2d .cmd button,.g-mapa-2d .cmd button{cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-60);
  /* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid var(--papel-20);border-radius:999px;padding:.62em 1.2em;
  display:flex;align-items:center;gap:.55em;transition:border-color .2s,color .2s}
.g-mapa-2d .cmd button:hover,.g-mapa-2d .cmd button:hover{border-color:var(--papel);color:#fff} /* #fff: pico de luz do hover, não é cor de marca */
.g-mapa-2d .cmd svg,.g-mapa-2d .cmd svg{display:block;width:1em;height:1em;opacity:.7}
.g-mapa-2d .orb i{display:block;width:7px;height:7px;border-radius:50%;
  background:var(--papel);opacity:.4;transition:opacity .2s}
.g-mapa-2d.orbitando .orb i{opacity:1;animation:pulsa 1.9s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.3}}
.g-mapa-2d .rec.feito{border-color:var(--papel);color:#fff} /* #fff: pico de luz do "feito", não é cor de marca */
/* estado de carga e de falha. Enquanto carrega não há o que navegar: o
   convite do véu e os comandos ficam fora de cena. */
.g-mapa-2d .estado,.g-mapa-2d .estado{position:absolute;inset:0;z-index:5;display:none;
  place-content:center;justify-items:center;text-align:center;padding:0 8cqw;
  gap:.9em;background:var(--moldura)}
.g-mapa-2d.esperando .estado,.g-mapa-2d.falhou .estado,
.g-mapa-2d.esperando .estado,.g-mapa-2d.falhou .estado{display:grid}
.g-mapa-2d.esperando .veu,.g-mapa-2d.esperando .cmd,.g-mapa-2d.falhou .veu,.g-mapa-2d.falhou .cmd,
.g-mapa-2d.esperando .veu,.g-mapa-2d.esperando .cmd,.g-mapa-2d.esperando .rotulo,
.g-mapa-2d.falhou .veu{display:none}
.g-mapa-2d .estado b,.g-mapa-2d .estado b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-mapa-2d .estado span,.g-mapa-2d .estado span{font-size:var(--fs-body);color:var(--papel-60);line-height:1.6;
  max-width:56ch;margin:0 auto}
.g-mapa-2d .estado code,.g-mapa-2d .estado code{font-family:var(--f-mono);font-size:.9em;color:var(--papel)}
/* o indicador de carga: barra com passo REAL (os degraus são nossos) e o
   anel girando para o que não se sabe medir. Pedido do Michel, 02/09. */
.g-mapa-2d .carga,.g-mapa-2d .carga{display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,2cqh,24px)}
.g-mapa-2d.falhou .carga,.g-mapa-2d.falhou .carga{display:none}
.g-mapa-2d .anel,.g-mapa-2d .anel{width:clamp(30px,3.4cqw,46px);height:clamp(30px,3.4cqw,46px);
  border-radius:50%;border:2px solid var(--papel-15);border-top-color:var(--papel);
  animation:gira3d .85s linear infinite}
@keyframes gira3d{to{transform:rotate(360deg)}}
.g-mapa-2d .barra,.g-mapa-2d .barra{width:clamp(150px,17cqw,240px);height:3px;border-radius:999px;
  background:var(--papel-10);overflow:hidden;position:relative}
.g-mapa-2d .barra i,.g-mapa-2d .barra i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:var(--papel);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.g-mapa-2d .passos,.g-mapa-2d .passos{font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.14em;text-transform:uppercase;color:var(--papel-45)}
@media (prefers-reduced-motion:reduce){.g-mapa-2d .anel,.g-mapa-2d .anel{animation:none}}
/* ── a RESERVA do modelo — as imagens salvas na peça. É o que permite chegar
   numa reunião sem rede e ainda ter o que mostrar. `contain`, nunca `cover`. */
.g-modelo-3d .reserva{position:absolute;inset:0;z-index:6;display:none;background:var(--moldura)}
.g-modelo-3d.reserva-on .reserva{display:block}
.g-modelo-3d.reserva-on .estado,.g-modelo-3d.reserva-on .veu,.g-modelo-3d.reserva-on .sair{display:none}
.g-modelo-3d .reserva .ph{position:absolute;inset:0}
.g-modelo-3d .reserva img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;opacity:0;transition:opacity .45s ease}
.g-modelo-3d .reserva img.on{opacity:1}
.g-modelo-3d .reserva .slot{position:absolute;inset:0;display:grid;place-content:center;
  gap:.4em;text-align:center;padding:1em;background:var(--slot-escuro);border:1px dashed var(--papel-20)}
.g-modelo-3d .reserva .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.5em;line-height:1}
.g-modelo-3d .reserva .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--papel)}
.g-modelo-3d .reserva .slot s{text-decoration:none;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--papel-45)}
.g-modelo-3d .cenas{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:7;
  display:none;align-items:center;gap:clamp(7px,.7cqw,12px)}
.g-modelo-3d.reserva-on .cenas{display:flex}
.g-modelo-3d .cenas button{width:var(--pt);height:var(--pt);border-radius:50%;padding:0;
  border:0;background:var(--papel);opacity:.32;cursor:pointer;transition:opacity .2s,transform .2s}
.g-modelo-3d .cenas button.on{opacity:1;transform:scale(1.25)}
.g-modelo-3d .rescap{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:7;display:none;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.1em;
  text-transform:uppercase;color:var(--papel-60);
  text-shadow:0 1px 3px var(--tinta-45),0 2px 14px var(--tinta-35)}
.g-modelo-3d.reserva-on .rescap{display:block}
/* ═══════════════════════════════════════════════════════════════════════════
   BLOCO SARASA — o que a troca de marca pede alem do :root
   Mestre: marca/MARCA-SARASA.md · bloco: marca/sarasa/bloco.html
   Capa:   modulos/capa-morph-sarasa.html
   ═════════════════════════════════════════════════════════════════════════ */

/* 1 · TIPOGRAFIA — a Sarasa nao tem face italica nem monoespacada.
   O esqueleto compoe titulo em DM Mono italica caixa-baixa, que e a voz da
   michel stein_. Aqui titulo e display sao Poppins 600, caixa mista, sem
   italico, tracking -.02em (secao 3 e secao 5 do arquivo de marca). */
h1,h2,h3,.g-marca .assina,.divisor .dt,.g-cheia .ov h2,
.metas .mv,.dfig .tag,.jogada .jt,.sm .smt,.uc .ur{
  font-family:var(--sans);font-weight:600;font-style:normal;
  text-transform:none;letter-spacing:-.02em}
.divisor .dn,.dado .v,ol.lista .q,ol.trio .q,.jn,.smn{
  font-family:var(--label);font-weight:600;font-style:normal}
.kick,.g-cheia .ov .cap,.metas .ml,.dleg,.credito{
  font-family:var(--label);font-weight:600;letter-spacing:.08em}

/* 2 · O ACENTO E CONTEXTUAL, e nao ha quarta cor.
   Sobre Cal o acento e Vinho (8,64). Sobre campo Vinho ou Ferro o Vinho da
   1,63 e some — ali o acento e o proprio Cal. Redefinir o token resolve de
   uma vez, em vez de cacar cada `var(--terra)` da engine. */
body.esc,body.terra,body.com-fundo{--terra:#F3EEE7}
.g-cheia,.fbox,.fbleed,.dfig,.g-earth-3d{--terra:#F3EEE7}
/* o realce e cor, nao tarja: o `mark` do esqueleto e uma pilula preenchida,
   com padding proprio. Sem zerar o padding sobra um vao no meio do titulo. */
u,mark{background:none;padding:0;color:var(--terra)}
body.esc mark,body.esc u{color:#F3EEE7;opacity:.82}

/* 2b · METAS — o esqueleto as escreve em Cal, porque a capa dele roda em
   campo escuro. Em campo Cal voltam para Ferro e Chumbo. */
.metas{border-top-color:var(--hair)}
.metas .ml{color:var(--chumbo);letter-spacing:.08em}
.metas .mv{color:var(--tinta)}
body.esc .metas{border-top-color:#F3EEE73d}
body.esc .metas .ml{color:#F3EEE7a6}
body.esc .metas .mv{color:var(--creme)}

/* 2c · CHROME CORRIDO — Archivo, caixa alta, sem italico */
.chrome,.secao,.pj,.cont{font-family:var(--label);font-weight:600;
  font-style:normal;letter-spacing:.08em}
.secao{font-style:normal;text-transform:uppercase}
.pj{text-transform:none;letter-spacing:.06em}

/* 2d · O LOGOTIPO NO CANTO SUPERIOR DIREITO — teste desta peca.
   ⚑ O padrao da casa continua sendo TEXTO. Aqui vai o logotipo, pequeno,
   fixo ao longo da apresentacao, para o Michel avaliar em reuniao. Se
   funcionar, sobe para o esqueleto e vale para toda frente.
   Tamanho: 132 a 180 px de largura. Nao e capricho — abaixo de 130 px a
   secao 4 do arquivo de marca manda `estudio` SAIR (nivel Micro), porque
   a altura-x dele cai abaixo dos 7 px de piso de leitura. Aqui o lockup
   fica no nivel Compacto, com as duas palavras, que e o que se quer.
   A troca positivo/negativo e por token: sobre campo escuro os dois fills
   viram Cal e o lockup fica monocromatico, exatamente como o
   Sarasa-logotipo-negativo.svg oficial (secao 2). O positivo NUNCA entra
   sobre Vinho ou Ferro. */
.marca{display:flex;align-items:center}
/* ⚑ O LOGOTIPO DO CANTO SUBIU PARA O ESQUELETO em 03/09.
   Este bloco tinha uma copia da largura (132–180 px) e um remendo de token:
   o SVG oficial traz `fill="var(--vinho)"` e o :root antigo nao tinha
   `--vinho`, entao `Sarasa` sumia do canto e sobrava `estudio` — foi o que
   aconteceu na primeira montagem. A copia venceu a regra do esqueleto e
   segurou o logotipo em 152 px depois de o esqueleto ja ter baixado para
   137: medido, nao percebido na leitura.
   A cura nao e remendar o token, e FALAR A LINGUA DELE: o `var(--vinho)`
   do SVG e trocado por `var(--primaria)` na leitura do arquivo (ver o topo
   deste script). Assim o lockup do canto entra no sistema de tokens do
   esqueleto e herda de graca a troca positivo/negativo, a largura nova e o
   nivel Micro em celular. */
/* o veu da faixa do chrome subiu para o esqueleto, sob `em-imagem`: e
   comportamento de motor, nao de marca, e vale para toda frente. */
/* na capa (momento A) e na contracapa o lockup grande JA e o assunto do
   slide — um segundo, minusculo, no canto, leria como repeticao. No momento
   B o lockup grande saiu de cena, e ai o logotipo do canto volta: a partir
   dali ele fica fixo ate o fim, que e o comportamento pedido. O `:has`
   sincroniza sozinho, sem classe de estado para manter. */
body.na-marca .marca,body.no-fim .marca{opacity:0}
body:has(.slide.g-marca .cm-b.on) .marca{opacity:.9}

/* 3 · GRAFISMO DE LINHA — secao 7. Fortaleza da Barra Grande, Guaruja,
   trinta caminhos, um fill. Sempre na base, sempre sangrando nas duas
   laterais, sempre em uma cor so. Nunca atras de texto corrido, de tabela
   ou de croqui: entra em divisor e contracapa, por `graf:1` no DECK. */
#msgraf{position:absolute;left:-2%;right:-2%;bottom:0;z-index:0;
  pointer-events:none;opacity:0;transition:opacity .7s ease;
  color:var(--creme);line-height:0}
#msgraf .grafsvg{display:block;width:104%;height:auto}
body.com-graf #msgraf{opacity:.28}
body.no-fim #msgraf{opacity:.18}

/* 4 · A CAPA DA FRENTE — modulos/capa-morph-sarasa.html, dois momentos.
   Os dois blocos se sobrepoem em absoluto e trocam por opacidade. O `.cm-b`
   vem antes no DOM so para o seletor `~` poder apagar o `.cm-a` — evita
   depender de `:has`. A geometria (--lk e as fracoes dele) e a do modulo,
   convertida de vw para cqw. */
/* ⚑ `.dois` NAO E DETALHE, E O ESCOPO. Esta regra saiu sem ele e a
   `padding:0` da CAPA vazou para a CONTRACAPA, que e `g-marca` tambem:
   lockup, site e credito passaram a encostar na borda esquerda, sem a
   margem `--gut`. O Michel viu no celular em 03/09 e supos ser so mobile —
   a medicao mostrou que era nas duas telas, e no desktop passava por
   sangria proposital. A capa PRECISA de padding zero (os dois momentos se
   posicionam em absoluto contra a borda); a contracapa nao. */
.slide.g-marca.dois{padding:0;justify-content:center}
.g-marca{--lk:clamp(200px,25cqw,470px)}
body.na-marca .chrome{opacity:0;pointer-events:none}
.g-marca .cm-a,.g-marca .cm-b{position:absolute;left:var(--gut-in);right:var(--gut-in);
  top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(11px,1.6cqh,24px);z-index:1;
  transition:opacity .55s ease,transform .55s ease}
.g-marca .cm-b{opacity:0;transform:translateY(calc(-50% + 12px));pointer-events:none}
.g-marca .cm-b.on{opacity:1;transform:translateY(-50%)}
/* o momento B entrando apaga o A. Um clique, uma troca. */
.g-marca .cm-b.on ~ .cm-a{opacity:0;transform:translateY(calc(-50% - 10px));
  pointer-events:none}

/* momento A — lockup, qualificador, descritor, site, pilula.
   ⚑ O qualificador vai SOB o lockup, nunca ao lado: a assinatura A do
   modulo e "linha micro sob o lockup, tratada como qualificador da marca".
   Ao lado ele lê como segunda marca, que e exatamente o que a leitura
   critica da assinatura B rejeitou. Por isso `display:block` e nao flex. */
.g-marca .lk-bloco{display:block}
.g-marca .lock{width:var(--lk);line-height:0;flex:0 0 auto;color:var(--creme)}
.g-marca .lock svg{display:block;width:100%;height:auto}
.g-marca .nucleo{font-family:var(--label);font-weight:600;
  font-size:calc(var(--lk)*.033);letter-spacing:.34em;text-transform:uppercase;
  color:#F3EEE7cc;line-height:1;margin-top:calc(var(--lk)*.034);
  padding-left:calc(var(--lk)*.010)}
.g-marca .descritor{font-family:var(--label);font-weight:600;
  font-size:clamp(10px,.82cqw,15px);letter-spacing:.13em;text-transform:uppercase;
  color:#F3EEE7a6;line-height:1.6;max-width:34ch;margin-top:calc(var(--lk)*.012)}
.g-marca .site{font-family:var(--sans);font-weight:400;
  font-size:clamp(10px,.78cqw,15px);letter-spacing:.14em;color:#F3EEE7a6;line-height:1}
/* pilula: sobre campo Vinho o portador e o Cal — secao 2 */
.g-marca .ms-start{margin-top:clamp(10px,1.6cqh,22px);background:var(--creme);
  color:#79242F;font-family:var(--label);font-weight:600;font-style:normal;
  font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;
  padding:clamp(8px,.95cqh,13px) clamp(16px,1.5cqw,26px);gap:.7em;animation:none}
.g-marca .ms-start:hover{gap:1.05em;transform:translateY(-1px)}

/* momento B — o titulo da apresentacao */
.g-marca .cm-b .mega{max-width:26ch}
.g-marca .cm-b .sub{max-width:52ch}
.g-marca .cm-pe{font-family:var(--label);font-weight:600;
  font-size:clamp(9px,.72cqw,13px);letter-spacing:.14em;text-transform:uppercase;
  color:#F3EEE7a6;margin-top:clamp(10px,1.6cqh,24px);line-height:1}

/* contracapa — QR, lockup, assinatura, credito, no mesmo eixo */
.g-marca .frase{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(9px,1.35cqh,20px)}
.g-marca .assina{font-size:clamp(26px,4.6cqw,92px);color:var(--creme)}
.g-marca .credito-peca{font-family:var(--label);font-weight:600;
  font-size:clamp(9px,.7cqw,12.5px);letter-spacing:.08em;text-transform:uppercase;
  color:#F3EEE7b3;margin-top:clamp(14px,2.2cqh,30px);line-height:1.5}
.g-marca .qr{box-shadow:0 0 0 1px #F3EEE733}

/* 4b · O VEU DA CAPA — diagonal, nao vertical.
   O esqueleto usa um veu de topo e pe, feito para foto atras de texto
   centrado. A capa da frente precisa de CAMPO CHAPADO sob o lockup, do
   lado esquerdo (secao 4 proibe marca sobre imagem sem campo): daqui vem
   o gradiente a 100 graus, do modulo. */
#msveu{background:linear-gradient(100deg,#79242Fd6 0%,#79242F8c 24%,
  #79242F2e 44%,#79242F00 60%)}

/* 5b · VISOR DO MODELO SKETCHUP — portado de modulos/modelo-sketchup.html
   Mesma gramatica do earth-3d: scrim suave, veu de ativacao, trava de
   teclado, indicador de carga e degradacao explicita. O que muda e a
   RESERVA — as imagens salvas na peca, que o earth nao tem porque satelite
   sem rede nao tem substituto util, e modelo de projeto tem. */
.slide.g-modelo-3d{padding:0;overflow:hidden;background:#171314}
.g-modelo-3d .visor{position:absolute;inset:0}
/* o iframe nasce SEM src e sem receber ponteiro. `src` so na chegada: sao
   40 MB. O ponteiro so depois do clique no veu, senao a roda do mouse da
   zoom no modelo enquanto se tenta passar o slide. */
.g-modelo-3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  pointer-events:none;opacity:0;transition:opacity .6s ease;background:#171314}
.g-modelo-3d.pronto iframe{opacity:1}
.g-modelo-3d.girando iframe{pointer-events:auto}
.g-modelo-3d .scrim{position:absolute;inset:0;pointer-events:none;
  transition:opacity .3s ease;
  background:linear-gradient(180deg,#231F2099 0,#231F204d 9%,#231F2000 24%,
    #231F2000 56%,#231F2059 88%,#231F2094 100%)}
.g-modelo-3d.girando .scrim{opacity:0}
.g-modelo-3d .veu{position:absolute;inset:0;display:grid;place-content:center;
  gap:.6em;text-align:center;background:#231F203d;cursor:pointer;z-index:2;
  transition:opacity .3s ease}
.g-modelo-3d.girando .veu{opacity:0;pointer-events:none}
.g-modelo-3d .veu b{font-family:var(--sans);font-weight:600;font-size:var(--fs-item);
  color:var(--creme);letter-spacing:-.02em}
.g-modelo-3d .veu s{text-decoration:none;font-family:var(--label);font-weight:600;
  font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:#F3EEE7a6}
/* ⚑ o SAIR salva a apresentacao. Com o ponteiro dentro do iframe o foco vai
   para o documento do SketchUp e as setas do deck param de responder — o
   evento nem chega ao nosso script. Este botao vive FORA do quadro e e o
   unico caminho de volta que nao depende do teclado. */
.g-modelo-3d .sair{position:absolute;bottom:clamp(9px,1.4cqh,20px);left:50%;
  transform:translateX(-50%);display:none;align-items:center;z-index:4;cursor:pointer;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--creme);background:#231F20e6;
  border:1px solid #F3EEE73d;border-radius:999px;padding:.55em 1.2em}
.g-modelo-3d.girando .sair{display:flex}
.g-modelo-3d .rotulo{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;pointer-events:none;
  max-width:min(46ch,60cqw);padding:clamp(14px,2cqh,30px) clamp(18px,1.9cqw,38px);
  background:#231F2073;/* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid #F3EEE71f;border-radius:3px;transition:opacity .3s ease}
.g-modelo-3d.girando .rotulo{opacity:0}
.g-modelo-3d .rotulo .kick{display:block;color:#F3EEE7c4;margin:0;
  font-size:var(--fs-cap);text-transform:uppercase}
.g-modelo-3d .rotulo h2{color:var(--creme);font-size:var(--fs-h);line-height:1.04;margin-top:.24em}
.g-modelo-3d .rotulo .lead{color:#F3EEE7d9;font-size:var(--fs-body);margin-top:.55em;line-height:1.5}
.g-modelo-3d .rotulo .cap{display:block;font-family:var(--label);font-weight:600;
  font-size:var(--fs-cap);letter-spacing:.08em;text-transform:uppercase;
  color:#F3EEE78f;margin-top:.9em}
/* RECOMECAR recarrega o quadro: a camera e do viewer da Trimble e nao ha API
   para traze-la de volta. IMAGENS troca para a reserva, a mao. */
.g-modelo-3d .cmd{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;
  display:flex;align-items:center;gap:clamp(6px,.6cqw,11px);transition:opacity .3s ease}
.g-modelo-3d.girando .cmd{opacity:.35}
.g-modelo-3d.girando .cmd:hover{opacity:1}
.g-modelo-3d .cmd button{cursor:pointer;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--creme);background:#231F209e;
  /* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid #F3EEE730;border-radius:999px;padding:.62em 1.2em;
  display:flex;align-items:center;gap:.55em;transition:border-color .2s,color .2s}
.g-modelo-3d .cmd button:hover{border-color:#F3EEE7;color:#fff}
.g-modelo-3d .cmd svg{display:block;width:1em;height:1em;opacity:.7}
.g-modelo-3d .estado{position:absolute;inset:0;z-index:5;display:none;
  place-content:center;justify-items:center;text-align:center;padding:0 8cqw;
  gap:.9em;background:#171314}
.g-modelo-3d.esperando .estado,.g-modelo-3d.falhou .estado{display:grid}
.g-modelo-3d.esperando .veu,.g-modelo-3d.esperando .cmd,
.g-modelo-3d.esperando .rotulo,.g-modelo-3d.falhou .veu{display:none}
.g-modelo-3d .estado b{font-family:var(--sans);font-weight:600;font-size:var(--fs-item);
  color:var(--creme);letter-spacing:-.02em}
.g-modelo-3d .estado span{font-size:var(--fs-body);color:#F3EEE7a6;line-height:1.6;
  max-width:56ch;margin:0 auto}
.g-modelo-3d .estado code{font-family:ui-monospace,monospace;font-size:.9em;color:#F3EEE7}
.g-modelo-3d .carga{display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,2cqh,24px)}
.g-modelo-3d.falhou .carga{display:none}
.g-modelo-3d .anel{width:clamp(30px,3.4cqw,46px);height:clamp(30px,3.4cqw,46px);
  border-radius:50%;border:2px solid #F3EEE726;border-top-color:var(--creme);
  animation:gira3d .85s linear infinite}
.g-modelo-3d .barra{width:clamp(150px,17cqw,240px);height:3px;border-radius:999px;
  background:#F3EEE71f;overflow:hidden;position:relative}
.g-modelo-3d .barra i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:var(--creme);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.g-modelo-3d .passos{font-family:var(--label);font-weight:600;font-size:var(--fs-cap);
  letter-spacing:.14em;text-transform:uppercase;color:#F3EEE773}
/* ── A RESERVA — as imagens salvas na peca. Nao e enfeite: e o que permite
   chegar numa reuniao sem rede e ainda ter o que mostrar. */
.g-modelo-3d .reserva{position:absolute;inset:0;z-index:6;display:none;background:#171314}
.g-modelo-3d.reserva-on .reserva{display:block}
.g-modelo-3d.reserva-on .estado,.g-modelo-3d.reserva-on .veu,
.g-modelo-3d.reserva-on .sair{display:none}
.g-modelo-3d .reserva .ph{position:absolute;inset:0}
/* `contain`, nunca `cover`: em peca de arquitetura o que o cover corta e desenho */
.g-modelo-3d .reserva img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;opacity:0;transition:opacity .45s ease}
.g-modelo-3d .reserva img.on{opacity:1}
.g-modelo-3d .reserva .slot{position:absolute;inset:0;display:grid;place-content:center;
  gap:.4em;text-align:center;padding:1em;background:#2A2224;border:1px dashed #F3EEE72e}
.g-modelo-3d .reserva .slot u{text-decoration:none;color:var(--terra);
  font-family:var(--label);font-weight:600;font-size:1.5em}
.g-modelo-3d .reserva .slot b{font-family:var(--sans);font-weight:600;
  font-size:var(--fs-cap);color:var(--creme)}
.g-modelo-3d .reserva .slot s{text-decoration:none;font-family:var(--label);
  font-weight:600;font-size:var(--fs-cap);letter-spacing:.1em;
  text-transform:uppercase;color:#F3EEE773}
.g-modelo-3d .cenas{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:7;
  display:none;align-items:center;gap:clamp(7px,.7cqw,12px)}
.g-modelo-3d.reserva-on .cenas{display:flex}
.g-modelo-3d .cenas button{width:var(--pt);height:var(--pt);border-radius:50%;padding:0;
  border:0;background:var(--creme);opacity:.32;cursor:pointer;
  transition:opacity .2s,transform .2s}
.g-modelo-3d .cenas button.on{opacity:1;transform:scale(1.25)}
.g-modelo-3d .rescap{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:7;display:none;
  font-family:var(--label);font-weight:600;font-size:var(--fs-cap);letter-spacing:.1em;
  text-transform:uppercase;color:#F3EEE7a6;
  text-shadow:0 1px 3px #231F2073,0 2px 14px #231F2059}
.g-modelo-3d.reserva-on .rescap{display:block}

(function(){

    /* 02/09/2026 — não há mais escala a calcular: o quadro preenche a área
       segura e a composição respira em cqw/cqh. O que sobrou aqui é só
       medir o regime (retrato ou paisagem) e publicar `--k` para quem

<script>

/* ─── fundo morph pontilhado · núcleo ────────────────────────────────────────
   Preset "linha MS" (20/08/2026): serigrafia + paralaxe, contraste 0.65.
   Entrada em diagonal, ao estilo da vitrine, introduz a primeira peça.
   API: MSFundo.montar(canvas, imagens, opcoes?) → {entrada(), pausar(v), cor(o)}
   opcoes: {ink, paper, acc, scale, prep:false, sortear:true}.
   prep:false pula a auto-exposição em JS — use com imagem já corrigida no
   arquivo, que é o que permite carrossel de oito a dez peças sem travar.
   sortear embaralha a ordem na carga. cor() troca a paleta com interpolação. */
window.MSFundo=(function(){
const VS=`#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID==1 ? 3.0 : -1.0, gl_VertexID==2 ? 3.0 : -1.0);
  gl_Position = vec4(p,0.0,1.0);
}`;
const FS=`#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D uA,uB;
uniform vec2 uRes,uSA,uSB,uM;
uniform float uT,uTime,uAmp,uEdge,uDot,uAng,uAng2,uContrast,uGamma,uMode,uTrans,
              uGrain,uZoom,uAcc,uVig,uBleed,uFit,uCur,uMAmt,uMRad,uEnter;
uniform vec3 uInk,uPaper,uAccent;

float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.5);return fract(p.x*p.y*95.43);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float bayer(vec2 p){
  int x=int(mod(p.x,8.0)),y=int(mod(p.y,8.0));
  int m[64]=int[64](0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21);
  return (float(m[y*8+x])+0.5)/64.0;
}
// enquadra (contain ou sangria) e devolve luminância; uBleed vira linha em massa tonal
float lum(sampler2D t, vec2 imgSize, vec2 uv){
  float ca=uRes.x/uRes.y, ia=imgSize.x/imgSize.y;
  vec2 sc = uFit>0.5 ? (ca>ia ? vec2(1.0,ca/ia) : vec2(ia/ca,1.0))
                     : (ca>ia ? vec2(ia/ca,1.0) : vec2(1.0,ca/ia));
  vec2 q=(uv-0.5)/(sc*(uFit>0.5?1.0:0.86))+0.5;
  if(q.x<-0.05||q.x>1.05||q.y<-0.05||q.y>1.05) return 1.0;
  vec2 qq=vec2(clamp(q.x,0.0,1.0),1.0-clamp(q.y,0.0,1.0));
  vec4 c=mix(texture(t,qq),textureLod(t,qq,2.0+uBleed*4.5),uBleed);
  float l=mix(1.0, dot(c.rgb,vec3(0.299,0.587,0.114)), c.a);
  if(q.x<0.0||q.x>1.0||q.y<0.0||q.y>1.0) l=mix(1.0,l,uBleed*0.6);
  return l;
}
float cover(vec2 q,float cell,float r){          // cobertura de um ponto da trama
  vec2 g=mod(q,cell)-cell*0.5;
  return 1.0-smoothstep(-0.9,0.9,length(g)-r);
}

void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float br=sin(uTime*0.18)*0.5+0.5;
  uv=(uv-0.5)*(1.0-uZoom*br)+0.5+vec2(sin(uTime*0.07),cos(uTime*0.05))*uZoom*0.35;

  // ---- cursor ---------------------------------------------------------------
  float asp=uRes.x/uRes.y;
  vec2 mp=uM/uRes;
  vec2 dm=(uv-mp)*vec2(asp,1.0);
  float rr=length(dm)/(max(uMRad,1.0)/uRes.y);
  float fm=exp(-rr*rr*2.0)*uMAmt;
  float cellMod=1.0, angMod=0.0, glitch=0.0, light=1.0, sharp=0.0;
  vec2 pxA=vec2(0.0), pxB=vec2(0.0);
  if(uCur>0.5&&uCur<1.5){                                   // foco: resolve onde se olha
    cellMod=1.0-fm*0.45; sharp=fm*0.30;
  }else if(uCur>1.5&&uCur<2.5){                             // luz: claridade rasante
    float ring=exp(-pow(rr-1.35,2.0)*3.0)*uMAmt;
    light=1.0-fm*0.55+ring*0.20;
  }else if(uCur>2.5&&uCur<3.5){                             // paralaxe: as duas camadas
    /* as amplitudes trocam de papel ao longo da passagem: a que entra com 0.026
       termina em 0.012, que é exatamente o valor com que reaparece como camada A
       no ciclo seguinte. Sem isso há um salto a cada troca de peça.            */
    vec2 d=(mp-0.5)*uMAmt;
    pxA=d*mix(0.012,0.026,uT); pxB=d*mix(0.026,0.012,uT);
  }else if(uCur>3.5&&uCur<4.5){                             // ímã: a trama abre
    cellMod=1.0+fm*1.8; angMod=fm*30.0;
  }else if(uCur>4.5){                                       // quebra: fenda fina
    float t2=floor(uTime*7.0);
    float w2=(1.5+9.0*uMAmt)/uRes.x;
    float band=step(abs(uv.x-mp.x),w2);
    uv.y+=band*(hash(vec2(t2,7.0))-0.5)*0.10*uMAmt;
    float rowH=0.030;
    float row=floor((uv.y-mp.y)/rowH);
    float h=hash(vec2(row,t2));
    float tear=step(0.55,h)*step(abs(uv.y-mp.y),rowH*1.6)*step(abs(uv.x-mp.x),0.06+0.10*uMAmt);
    uv.x+=(h-0.5)*0.045*uMAmt*tear;
    glitch=max(band,tear*0.55);
    cellMod=1.0+band*0.6*uMAmt;
  }

  // ---- luminâncias das duas peças ------------------------------------------
  float t=uT;
  vec2 n=vec2(fbm(uv*2.6+uTime*0.03), fbm(uv*2.6+7.3-uTime*0.025))*2.0-1.0;

  float vA=pow(1.0-a,uGamma), vB=pow(1.0-b,uGamma);

  // frente que varre da esquerda para a direita
  float soft=0.06+uEdge*0.55;

  float w=clamp((front-uv.x+soft)/(2.0*soft),0.0,1.0);

  float cell=max(uDot*cellMod,2.0);

    float th=mix(fbm(uv*7.5+31.7),vnoise(uv*uRes.x/26.0),0.35);
    float e=clamp(uEdge,0.02,1.0);

    float own=step(hash(floor(q/cell)+0.5),w);

  }else if(uTrans<2.5){                            // serigrafia — duas telas, dois ângulos
    vec2 qB=rot(radians(uAng+angMod+uAng2))*p;
    float iA=cover(q ,cell,sqrt(max(vA*(1.0-w),0.0))*cell*0.70)*smoothstep(0.0,0.02,vA*(1.0-w));
    float iB=cover(qB,cell,sqrt(max(vB*w      ,0.0))*cell*0.70)*smoothstep(0.0,0.02,vB*w);
    ink=1.0-(1.0-iA)*(1.0-iB);

    float th=mix(uv.x,1.0-vA,0.42);

    band=exp(-pow((front-th)/soft,2.0)*2.0);
  }

  if(uTrans>1.5&&uTrans<2.5){                      // serigrafia já montou a tinta
  }else if(uMode<0.5){ ink=cover(q,cell,sqrt(max(v,0.0))*cell*0.70); }
  else if(uMode<1.5){ ink=1.0-smoothstep(-0.8,0.8,abs(mod(q.y,cell)-cell*0.5)-v*cell*0.5); }

  /* ---- entrada diagonal: a trama nasce ao longo de uma reta inclinada ---- */
  float sx=uv.x+(uv.y-0.5)*0.26;                 // eixo da varredura, ~14° de inclinação
  float bandW=0.30;
  float fEnter=uEnter*(1.0+2.0*bandW)-bandW;

  float fio=exp(-pow((sx-fEnter)/0.0045,2.0))*step(0.001,uEnter)*step(uEnter,0.999);
  ink*=rev; band=mix(band,0.0,1.0-rev);

  vec3 col=mix(uPaper,tinta,clamp(ink,0.0,1.0));
  col=mix(col,uAccent,clamp(fio,0.0,1.0)*0.85);
  col=mix(col,uAccent,glitch*0.12*uMAmt);
  col+= (hash(gl_FragCoord.xy+fract(uTime)*97.0)-0.5)*uGrain;

  col=mix(col,uPaper*0.96+uInk*0.04,smoothstep(0.42,0.95,d)*uVig);

  const COR={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};
  const ALVO={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};

    if(OPT.prep===false) return src;   // já pré-exposta no arquivo

    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);

    for(let k=0;k<a.length;k+=64){s+=(a[k]*.299+a[k+1]*.587+a[k+2]*.114)/255;n++;}

    const g=Math.max(0.42,Math.log(0.50)/Math.log(Math.max(mean,0.03)));

     inclusive sob o mapa e o globo — um shader de 2× fbm por pixel em tela

     barato; quando a aceleração cai (driver, atualização do Chrome), é o

     `pausar(false)`/`entrada()` religam. `visible` (aba oculta) idem. */

    const kc=1-Math.exp(-dt*3.2);
    for(const nome of ['ink','paper','acc'])
      for(let c=0;c<3;c++) COR[nome][c]+=(ALVO[nome][c]-COR[nome][c])*kc;
    const e0=t*t*(3-2*t);

    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.tex);

    gl.uniform2f(U.uSA,A.w,A.h);gl.uniform2f(U.uSB,B.w,B.h);gl.uniform2f(U.uM,mx,my);

    gl.uniform1f(U.uDot,P.dot*k);gl.uniform1f(U.uAng,P.angle);gl.uniform1f(U.uAng2,P.angle2);
    gl.uniform1f(U.uBleed,P.bleed);gl.uniform1f(U.uContrast,P.contrast);gl.uniform1f(U.uGamma,P.gamma);
    gl.uniform1f(U.uAmp,P.amp);gl.uniform1f(U.uEdge,P.edge);gl.uniform1f(U.uZoom,P.zoom);
    gl.uniform1f(U.uAcc,P.accent);gl.uniform1f(U.uGrain,P.grain);gl.uniform1f(U.uVig,P.vig);

    cor(o){ if(o.ink)ALVO.ink=hex(o.ink); if(o.paper)ALVO.paper=hex(o.paper);

})();

  pts.forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;});
  const mx=(x1-x0)*0.035+10, my=(y1-y0)*0.035+10;
  x0-=mx;x1+=mx;y0-=my;y1+=my;
  let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(w/h>asp){ h=w/asp; } else { w=h*asp; }
  x0=cx-w/2;y0=cy-h/2;
  return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}
function mapaRua(sang){

  const alvo=[];

  const fl=MAP.msrua.flat(); const r0=fl[Math.floor(fl.length*0.28)];

  MAP.lotes.forEach((l,i)=>{

/* ─── locador: os perímetros maiores que o recorte ───────────────────────
   Quando o mapa tem perímetros muito maiores que o recorte principal,
   desenhá-los por cima só cruzaria a tela com uma linha. Vão como locador
   no canto, com o retângulo do recorte atual dentro.
   Duas camadas: MAP.aiu (tracejada, primária) e MAP.req (cheia, acento).
   Os rótulos vêm de MAP.aiuRotulo e MAP.reqRotulo; sem eles, não há texto. */
function locador(P,vb,W){
  const A=[].concat(MAP.aiu||[],MAP.req||[]).flat();
  if(!A.length) return '';
  const H=Math.round(W*1.02), pad=9;
  let la0=1e9,la1=-1e9,lo0=1e9,lo1=-1e9;
  A.forEach(([la,lo])=>{if(la<la0)la0=la;if(la>la1)la1=la;if(lo<lo0)lo0=lo;if(lo>lo1)lo1=lo;});
  const kx=(W-2*pad)/(lo1-lo0), ky=(H-2*pad)/(la1-la0), k=Math.min(kx,ky);
  const cx=(lo0+lo1)/2, cy=(la0+la1)/2;
  const X=lo=>pad+(W-2*pad)/2+(lo-cx)*k, Y=la=>pad+(H-2*pad)/2-(la-cy)*k;
  /* 1 vértice a cada N: um perímetro oficial pode ter milhares de vértices e o locador tem 190 px de largura */
  const cam=(an,n)=>an.filter((_,i)=>i%n===0||i===an.length-1)
    .map(([la,lo])=>`${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join(' ');
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--papel)" stroke="var(--tinta)" stroke-opacity=".28" stroke-width="1"/>`;
  (MAP.aiu||[]).forEach(an=>{g+=`<polygon points="${cam(an,9)}" fill="var(--primaria)" fill-opacity=".13" stroke="var(--primaria)" stroke-width="1" stroke-opacity=".7" stroke-dasharray="3 2.5"/>`;});
  (MAP.req||[]).forEach(an=>{g+=`<polygon points="${cam(an,2)}" fill="var(--acento)" fill-opacity=".16" stroke="var(--acento)" stroke-width="1.3"/>`;});
  /* o retângulo do recorte que está sendo mostrado ao lado */
  const v=vb.split(' ').map(Number);
  const cantos=[[v[0],v[1]],[v[0]+v[2],v[1]],[v[0]+v[2],v[1]+v[3]],[v[0],v[1]+v[3]]]
    .map(([x,y])=>{const la=P.la(y),lo=P.lo(x);return `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`;}).join(' ');
  g+=`<polygon points="${cantos}" fill="none" stroke="var(--tinta)" stroke-width="1.6"/>`;
  if(MAP.reqRotulo) g+=`<text x="${pad}" y="${H-19}" font-family="var(--f-mono)" font-size="10.5" fill="var(--acento)">${MAP.reqRotulo}</text>`;
  if(MAP.aiuRotulo) g+=`<text x="${pad}" y="${H-6}" font-family="var(--f-mono)" font-size="10.5" fill="var(--primaria)">${MAP.aiuRotulo}</text>`;
  return g;
}

  MAP.pts.forEach((p,i)=>{if(!p.toq)return;

    if(p.anc) s+=`<circle cx="${X}" cy="${Y}" r="21" fill="none" stroke="var(--acento)" stroke-width="1.6" stroke-dasharray="3 3" opacity=".85"/>`;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${X}" cy="${Y}" r="24"/><circle class="anel" cx="${X}" cy="${Y}" r="18"/><circle cx="${X}" cy="${Y}" r="${p.anc?15:12}" fill="var(--acento)" stroke="var(--papel)" stroke-width="${p.anc?2.6:1.8}"/><text x="${X}" y="${Y+5}" text-anchor="middle" font-family="var(--f-mono)" font-weight="500" font-size="15" fill="var(--papel)">${p.k}</text></g>`;});
  s+=barra(P,200,48,P.h-20);
  if(sang){
    const v=vb2.split(' ').map(Number), W=Math.round(v[2]*0.30);

    s+=`<g transform="translate(${gx.toFixed(1)},${gy.toFixed(1)})">${locador(P,vb2,W)}</g>`;

}
function ligaHover(root){

          +`${p.pct!=null?p.pct.toString().replace('.',',')+'% de subvenção — ':''}`

      }else{
        d=p.viz.length?'Credenciados no raio de 200 m: '+p.viz.map(([m,n])=>`${n} a ${m} m`).join(' · ')+'.':'Nenhum credenciado dentro de 200 m.';
        if(p.fora.length)d+=` O mais próximo fora do raio é ${p.fora[0][1]}, a ${p.fora[0][0]} m.`;

      mostra(p.n,p.toq?`${p.pt} pontos de proximidade`:'projeto credenciado',d);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelector('.mapa').addEventListener('mouseleave',()=>{solta();limpa();});
  box.classList.add('vazio');

function isometrico(cena,esc){
  /* sobre a oliva a tinta some: o desenho troca de cor, nao de forma */
  const TI = esc ? 'var(--papel)' : 'var(--tinta)';
  const W=620,H=660,ux=0.866,uy=0.5;
  /* o viewBox sai do proprio desenho. Escrito a mao, ele decepava os dois
     ultimos predios da carteira toda vez que o espacamento mudava. */
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  const marca=(px,py)=>{if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;};
  const janelaIso=(padx,pady)=>{
    const x0=bx0-padx,y0=by0-pady,w=(bx1-bx0)+padx*2,h=(by1-by0)+pady*2;
    return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;};
  const S=1.16;const iso=(x,y,z)=>[300+(x-y)*ux*S,H-130-((x+y)*uy*.52*S)-z*S];
  const P=(a)=>a.map(p=>p.join(',')).join(' ');
  function caixa(cx,cy,w,d,pav,alt,rot,pal){
    /* pal: o prédio grande ficou fora dos cenários; entra só como escala */
    const o=pal?0.34:1, h=pav*alt,pts=[];
    const A=iso(cx,cy,0),Bp=iso(cx+w,cy,0),C=iso(cx+w,cy+d,0),D=iso(cx,cy+d,0);
    const A2=iso(cx,cy,h),B2=iso(cx+w,cy,h),C2=iso(cx+w,cy+d,h),D2=iso(cx,cy+d,h);
    /* o vertice mais proximo da camera e A (menor x+y). As duas faces visiveis
       sao as que encostam na aresta A-A2: a esquerda (A-D) e a direita (A-B).
       Antes desenhava-se B-C, que fica ESCONDIDA atras do solido, e a esquerda
       ficava vazada. Corrigido em 21/08/2026.                                */
    let g=`<polygon points="${P([A,D,D2,A2])}" fill="${TI}" fill-opacity="${(.17*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A,Bp,B2,A2])}" fill="${TI}" fill-opacity="${(.075*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A2,B2,C2,D2])}" fill="var(--acento)" fill-opacity="${(.26*o).toFixed(3)}" stroke="var(--acento)" stroke-width="1.2" stroke-opacity="${o}"/>`;
    /* aresta vertical da frente, marcada: e ela que le a altura */
    g+=`<line x1="${A[0]}" y1="${A[1]}" x2="${A2[0]}" y2="${A2[1]}" stroke="${TI}" stroke-width="1.1" stroke-opacity="${(.55*o).toFixed(2)}"/>`;
    for(let i=1;i<pav;i++){const l=iso(cx,cy+d,i*alt),m=iso(cx,cy,i*alt),o=iso(cx+w,cy,i*alt);
      g+=`<polyline points="${P([l,m,o])}" fill="none" stroke="${TI}" stroke-width=".5" stroke-opacity="${(.3*o).toFixed(2)}"/>`;}
    [A,Bp,C,D,A2,B2,C2,D2].forEach(q=>marca(q[0],q[1]));
    const top=iso(cx+w/2,cy+d/2,h);
    if(rot){ const lw=rot.length*4.6; marca(top[0]-lw,top[1]-46); marca(top[0]+lw,top[1]-30); }
    /* 34 px acima da cumeeira: com 16 o rotulo encostava no telhado */
    g+=`<text x="${top[0]}" y="${top[1]-34}" text-anchor="middle" font-family="var(--f-mono)" font-style="italic" font-size="15" fill="${TI}" opacity="${pal?0.55:1}">${rot}</text>`;
    return g;
  }
  function arvore(x,y){const b=iso(x,y,0),t=iso(x,y,26);
    return `<line x1="${b[0]}" y1="${b[1]}" x2="${t[0]}" y2="${t[1]}" stroke="var(--primaria)" stroke-width="1.6"/><circle cx="${t[0]}" cy="${t[1]}" r="9" fill="var(--primaria)" fill-opacity=".45" stroke="var(--primaria)" stroke-width="1"/>`;}
  function carro(x,y){const a=iso(x,y,0),b=iso(x+16,y,0),c=iso(x+16,y+8,0),d=iso(x,y+8,0),
    a2=iso(x,y,9),b2=iso(x+16,y,9),c2=iso(x+16,y+8,9),d2=iso(x,y+8,9);
    return `<polygon points="${P([a,b,c,d])}" fill="${TI}" fill-opacity=".1"/><polygon points="${P([a2,b2,c2,d2])}" fill="${TI}" fill-opacity=".3" stroke="${TI}" stroke-width=".8"/><polygon points="${P([b,c,c2,b2])}" fill="${TI}" fill-opacity=".2" stroke="${TI}" stroke-width=".8"/>`;}
  let s=`<svg viewBox="55 66 545 596" role="img" aria-label="Escala comparativa de porte">`;
  /* a fileira da carteira e mais longa que a do porte: o chao e a rua
     acompanham, senao os dois ultimos predios ficam sem calcada */
  const XM = cena==='portfolio' ? 500 : 330;
  const g0=iso(-34,40,0),g1=iso(XM,40,0),g2=iso(XM,200,0),g3=iso(-34,200,0);
  s+=`<polygon points="${P([g0,g1,g2,g3])}" fill="${TI}" fill-opacity=".045"/>`;
  const r0=iso(-34,52,0),r1=iso(XM,52,0),r2=iso(XM,80,0),r3=iso(-34,80,0);
  s+=`<polygon points="${P([r0,r1,r2,r3])}" fill="${TI}" fill-opacity=".1"/>`;
  if(cena==='portfolio'){
    /* a carteira desenhada: 4 pequenos e 3 medios, na mesma escala do slide
       do porte. E o mesmo desenho, para o olho reconhecer o tamanho.     */
    /* tudo numa fileira só: com os pequenos atrás dos médios a conta não
       se lia. Agora é da esquerda para a direita, 4 + 3, mesma linha. */
    /* mais respiro entre os volumes: colados, a conta de 4 + 3 nao se lia */
    let x=0;
    for(let i=0;i<4;i++){ s+=caixa(x,96,38,34,5,10,i===1?'4 × pequeno':''); x+=62; }
    x+=34;
    for(let i=0;i<3;i++){ s+=caixa(x,96,52,42,12,10,i===1?'3 × médio':''); x+=78; }
    /* a arvore acompanha a fileira inteira, ate o ultimo predio */
    for(let v=-18;v<=x-30;v+=56) s+=arvore(v,66);
    const vb=janelaIso(26,22);
    const cy2=(by1+26);
    s+=`<text x="${((bx0+bx1)/2).toFixed(1)}" y="${(cy2+16).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="13" fill="${TI}" opacity=".5">15.600 m² construídos · mesma escala do slide do porte</text>`;
    marca(bx0,cy2+22);marca(bx1,cy2+22);
    return s.replace('viewBox="55 66 545 596"','viewBox="'+janelaIso(26,22)+'"')+`</svg>`;
  }
  s+=caixa(0,96,52,44,5,10,'pequeno · 5 pav');
  s+=caixa(112,96,62,50,12,10,'médio · 12 pav');
  s+=caixa(238,96,72,56,24,10,'grande · 24 pav','pal');
  [ -18, 46, 100, 160, 216, 288 ].forEach(x=>{s+=arvore(x,66);});
  s+=carro(56,60); s+=carro(196,60);
  s+=`<text x="${W/2}" y="${H-16}" text-anchor="middle" font-family="var(--f-mono)" font-size="14" fill="${TI}" opacity=".55">escala comparativa · pé-direito de 3 m</text>`;
  return s+`</svg>`;
}

/* ─── aviso: o slide que diz o que está errado ────────────────────────────
   03/09/2026. Gabarito desconhecido ou campo obrigatório ausente vira um
   slide hachurado com o diagnóstico, e o mesmo texto vai ao console como
   console.error (para o build barrar a peça). Antes,
   o primeiro sumia em silêncio e o segundo escrevia `undefined` na tela ou
   derrubava o deck inteiro (`cur is not defined`).                       */
function aviso(s,titulo,nota){
  const limpo=x=>String(x).replace(/<[^>]+>/g,'');
  console.error('deck · '+limpo(titulo)+(nota?' — '+limpo(nota):''));
  return `<div class="vazio aviso rev"><div class="vmarca">_</div>`
    + `<h2>${titulo}</h2>`
    + (s.t?`<p class="vsub">${s.t}</p>`:'')
    + (nota?`<p class="vnota">${nota}</p>`:'')+`</div>`;
}
/* campos sem os quais o gabarito não renderiza. `cols` é reservado: quem o
   traz como array tem de trazer `linhas` — a armadilha paga em 23/08 e 29/08. */
const EXIGE={
  duo:['figs','leg'], tabela:['cols','linhas'], porte:['cols','linhas'],
  lista:['itens'], fim:['itens'], sumario:['itens'], trio:['itens'],
  jogadas:['itens'], fotos:['itens'], unit:['cards'], players:['casas'],
  avulso:['grupos'], plug:['ancoras'], duasfrentes:['esq','dir'],
  divisor:['dt'], 'earth-3d':['lat','lng'], 'modelo-3d':['modelo']
};
/* bloco de marca antigo, sem a linha UNDERSCORE: vale o padrão da casa (ligado) */
const US=(typeof UNDERSCORE==='undefined')?true:!!UNDERSCORE;
function tpl(s){
  const faltam=(EXIGE[s.g]||[]).filter(c=>s[c]==null);
  if(faltam.length)
    return aviso(s,'gabarito '+s.g+': falta '+faltam.map(c=>`<code>${c}</code>`).join(', '),
      'formato de cada campo em sistemas/DECK-MONTAR.md');
  if(s.g!=='prancha' && Array.isArray(s.cols) && !Array.isArray(s.linhas))
    return aviso(s,'gabarito '+s.g+': <code>cols</code> sem <code>linhas</code>',
      '`cols` é campo reservado da tabela; quem o usa traz `linhas` em seguida');
  const k=s.kick?`<div class="kick${s.barra?' barra':''} rev">${s.kick}</div>`:'';
  const et=s.etapas?' passo etapa':'';
  const grande=(s.g==='frase'||s.g==='capa'||s.g==='jogadas');
  /* R$ é símbolo de moeda, não texto: sobrevive ao text-transform:lowercase
     dos títulos. Aplicado no render para não poluir o DECK com <span>. */
  const RS=x=>String(x).replace(/R\$/g,'<span class="ru">R$</span>');
  const t=s.t?`<h1 class="${grande?'mega':'big'} rev">${RS(s.t)}</h1>`:'';
  const sub=s.sub?`<p class="sub rev">${s.sub}</p>`:'';
  const prem=s.prem?`<p class="prem rev">${s.prem}</p>`:'';
  const pre=s.pre?`<p class="sub rev" style="margin-top:0;margin-bottom:clamp(10px,1.6vh,22px);max-width:44ch">${s.pre}</p>`:'';
  /* o texto de apoio do dado não fica na tela: o slide mostra número e
     rótulo, e a memória de cálculo abre no ponteiro. Menos coisa competindo
     pela atenção, e o argumento continua a um gesto de distância. */
  const dad=s.dados?`<div class="dados rev">`+s.dados.map(([v,l,n],j)=>
    `<div class="dado${n?' tem':''}"${n?` tabindex="0" data-dn="${j}"`:''}>`
    +`<span class="v">${RS(v)}</span><span class="l">${l}</span>`
    +(n?`<span class="n">${n}</span>`:'')+`</div>`).join('')+`</div>`:'';
  /* pilula da abertura: markup identico ao do capa-morph_R6, inclusive a
     seta como glifo &rarr;. Tentei SVG para nao depender de fonte de
     sistema e o desenho saiu diferente do padrao — o R6 manda.          */
  const inicio=s.comecar?'<button class="ms-start">começar <span class="seta">&rarr;</span></button>':'';
  if(s.g==='marca'){
    /* CONTRACAPA — campo Vinho, QR e credito. MARCA-SARASA secao 5. */
    if(s.fim_) return `<div class="frase">`
      +(s.qr?`<div class="qr rev">${QR}</div>`:'')
      +`<div class="lock rev">${LOCKUP}</div>`
      +(s.assinatura?`<div class="assina rev">${s.assinatura}</div>`:'')
      +(s.site?`<div class="site rev">${s.site}</div>`:'')
      +(s.credito?`<div class="credito-peca rev">${s.credito}</div>`:'')
      +`</div>`;
    /* ABERTURA — a capa da frente, dois momentos. Ver a nota no CSS. */
    return `<div class="cm-b passo">`
      +(s.kick?`<div class="kick">${s.kick}</div>`:'')
      +(s.t?`<h1 class="mega">${s.t}</h1>`:'')
      +(s.sub?`<p class="sub">${s.sub}</p>`:'')
      +(s.pe?`<div class="cm-pe">${s.pe}</div>`:'')
      +`</div>`
      +`<div class="cm-a">`
      +  `<div class="lk-bloco"><div class="lock">${LOCKUP}</div>`
      +  (s.papel?`<div class="nucleo">${s.papel}</div>`:'')+`</div>`
      +  (s.descritor?`<div class="descritor">${s.descritor}</div>`:'')
      +  (s.site?`<div class="site">${s.site}</div>`:'')
      +  `<button class="ms-start">começar <span class="seta">&rarr;</span></button>`
      +`</div>`;
  }
  const met=s.metas?`<div class="metas rev">`+s.metas.map(([l,v])=>`<div><span class="ml">${l}</span><span class="mv">${v}</span></div>`).join('')+`</div>`:'';
  if(s.g==='capa') return `<div class="wrap">${k}${t}${sub}${met}${inicio}</div>`;
  if(s.g==='divisor') return `<div class="divisor"><span class="dn rev">${s.dn||''}</span><h1 class="dt rev">${RS(s.dt)}${US?'<i class="pisca">_</i>':''}</h1>${s.ds?`<p class="ds rev">${s.ds}</p>`:''}</div>`;
  if(s.g==='frase') return `<div class="wrap">${k}${pre}${t}${sub}${prem}${dad}</div>`;
  if(s.g==='jogadas') return `<div class="wrap">${k}${t}<div class="jogadas rev">`+s.itens.map(([n,ti,d])=>`<div class="jogada${et}"><span class="jn">${n}</span><span class="jt">${ti}</span><span class="jd">${d}</span></div>`).join('')+`</div></div>`;
  if(s.g==='unit') return `<div class="wrap">${k}${t}${sub}<div class="unit rev">`+s.cards.map(([ti,a,r,l,m])=>`<div class="uc${et}"><span class="ut">${ti}</span><span class="ua">${a}</span><span class="ur">${RS(r)}</span><span class="ul">${l}</span><span class="um">${m}</span></div>`).join('')+`</div></div>`;
  if(s.g==='trio') return `<div class="wrap">${k}${t}${sub}<ol class="trio">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='lista'||s.g==='fim') return `<div class="wrap${s.largo?' largo':''}">${k}${pre}${t}${sub}<ol class="lista${s.largo?' largo':''}">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='cheia'){
    /* render em sangria total. Ver sistemas/gabaritos/render-cheia.md */
    const img = s.src
      /* `data-src`, não `src`: o render entra quando o slide chega (e o
         seguinte), pelo __msPuxa(). Vale para base64 e para arquivo ao lado. */
      ? `<img decoding="async" data-src="${s.src}" alt="${(s.cap||'').replace(/"/g,'&quot;')}">`
      : `<div class="slot"><u>_</u><b>${s.lbl||'render'}</b><s>16:9 · sangria total</s></div>`;
    return `<div class="full"><div class="ph">${img}</div></div>`
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>`;
  }
  if(s.g==='duo'){
    const RES=IMG;
    /* o slot so aparece se a imagem falhar — antes ele ficava por cima da foto */
    const f=s.figs.map(([tag,src,cap,cl])=>`<div class="dfig ${cl}"><img src="${RES[src]||src}" alt="${cap}" onerror="const p=this.parentNode;this.remove();p.classList.add('semimg')"><span class="tag">${tag}</span><div class="slot"><b>slot de imagem</b><span>${cap}</span></div><span class="dcap">${cap}</span></div>`).join('');
    return `<div class="wrap" style="max-width:none">${k}${t}${sub}<div class="dcols rev">${f}</div><p class="dleg rev">${s.leg}</p></div>`;
  }
  if(s.g==='fotos'){
    const li=s.itens.map(([q,x],i)=>`<li class="passo" data-f="${i}"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('');
    const im=s.itens.map(([q,x,src,cap],i)=>src?`<img data-f="${i}" src="${IMG[src]||src}" alt="${cap}" onerror="this.dataset.err=1">`:'').join('');
    return `<div class="wrap">${k}${t}<ol class="lista">${li}</ol></div>
      <div class="fbleed">${im}<div class="slot"><b>slot de imagem</b><span class="scap"></span><span class="sfon"></span></div><span class="cred"></span></div>`;
  }
  /* ⚑ `prancha` vem ANTES do `const tab`. Os dois usam `cols`, e com
     significados incompatíveis: aqui é um NÚMERO de colunas, lá é um array
     de cabeçalhos. Deixar o `tab` correr primeiro derruba o deck inteiro
     com `s.cols.map is not a function`. É a armadilha do campo reservado,
     registrada em 23/08 e paga de novo em 29/08.
     Receita: sistemas/gabaritos/prancha-referencia.md */
  if(s.g==='prancha'){
    const foto=(src,cap,ar)=>`<div class="ph"${ar?` style="flex:0 0 auto;aspect-ratio:${ar}"`:''}>`
      + (src?`<img loading="lazy" src="${src}" alt="${(cap||'').replace(/"/g,'&quot;')}">`
            :`<div class="slot"><u>_</u><b>${cap||'imagem'}</b><s>16:9 ou 4:3</s></div>`)+`</div>`;
    const cels=(s.items||[]).map(it=>{
      if(it.pilha){
        return `<div class="cel pilha rev" style="aspect-ratio:${it.ar||'0.70'}">`
          + it.pilha.map(f=>foto(f.src,f.cap,null)).join('')
          + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
      }
      return `<div class="cel rev">`+foto(it.src,it.cap,it.ar||s.ar)
        + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
    }).join('');
    /* a proporção decide as colunas: retrato aceita 3 ou 4, deitada pede 2.
       Aviso no console em vez de regra escondida num .md.
       Ver sistemas/gabaritos/prancha-referencia.md */
    (function(){
      const ars=(s.items||[]).map(i=>parseFloat(i.ar||s.ar||0)).filter(n=>n>0);
      if(!ars.length) return;
      const med=ars.reduce((a,b)=>a+b,0)/ars.length, c=s.cols||3;
      if(med>1.2&&c>2) console.warn('prancha: imagem deitada (ar~'+med.toFixed(2)+') em '+c+' colunas. Deitada pede 2, ou 3 recortando em quadrado.');
      if(med<0.85&&c<3) console.warn('prancha: imagem em retrato (ar~'+med.toFixed(2)+') em '+c+' colunas. Retrato aceita 3 ou 4.');
    })();
    const topo=(s.top&&(s.top.h2||s.top.lead))
      ? `<div class="ptop rev"><h2>${s.top.h2||''}</h2>`
        + (s.top.lead?`<div class="plead">${s.top.lead}</div>`:'')+`</div>` : '';
    const centra=s.ar||(s.items||[]).some(i=>i.ar||i.pilha);
    return `<div class="pbody">${topo}<div class="grade" style="grid-template-columns:repeat(${s.cols||3},1fr)`
      + (centra?';align-content:center;align-items:center':'')+`">${cels}</div></div>`;
  }
  if(s.g==='modelo-3d'){
    /* O MODELO DO PROJETO, VIVO — modulos/modelo-sketchup.html
       `app.sketchup.com/viewer/3dw?WarehouseModelId=<id>` embeda direto, com
       painel de cenas, sombras e projeções, sem marca de terceiro (medido em
       02/09/2026 no domínio real). ⚑ O modelo TEM DE ESTAR PÚBLICO no 3D
       Warehouse: modelo privado devolve 404 para quem abre o link.
       `res` são as imagens de reserva — sem elas o slide não sobrevive a
       rede ruim; slot vazio aparece hachurado. Receita: gabaritos/modelo.md */
    const cenas = (s.res||[]).map((r,i)=>
      `<button type="button" data-i="${i}"${i?'':' class="on"'} title="${(r.cap||'').replace(/"/g,'&quot;')}"></button>`).join('');
    const fotos = (s.res||[]).length
      ? (s.res||[]).map((r,i)=>`<img loading="lazy" src="${r.src}" alt="${(r.cap||'').replace(/"/g,'&quot;')}"${i?'':' class="on"'}>`).join('')
      : `<div class="slot"><u>_</u><b>imagens de reserva</b><s>exportar as cenas do SketchUp</s></div>`;
    return `<div class="visor" data-modelo="${s.modelo}">`
      + `<iframe title="Modelo 3D do projeto — SketchUp Viewer"`
      + ` allow="fullscreen; xr-spatial-tracking"`
      + ` referrerpolicy="no-referrer-when-downgrade"></iframe>`
      + `<div class="scrim"></div>`
      + `<div class="veu"><b>clique para navegar no modelo</b>`
      + `<s>cenas, sombras e órbita ficam com você · o teclado passa a ser do modelo</s></div>`
      + `<button class="sair" type="button">devolver o teclado ao slide</button></div>`
      + `<div class="rotulo">`
      + (s.kick?`<span class="kick">${s.kick}</span>`:'')
      + (s.h2?`<h2>${s.h2}</h2>`:'')
      + (s.lead?`<div class="lead">${s.lead}</div>`:'')
      + (s.cap?`<span class="cap">${s.cap}</span>`:'')
      + `</div>`
      + `<div class="cmd">`
      +   `<button class="rec" type="button" title="recarregar o modelo na cena inicial">`
      +     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
      +     ` stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
      +     `<path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v5h-5"/></svg>recomeçar</button>`
      +   `<button class="img" type="button" title="não carregou? mostrar as imagens salvas">`
      +     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
      +     ` stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
      +     `<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/>`
      +     `<path d="M21 16l-5-5-6 6"/></svg>imagens</button>`
      + `</div>`
      + `<div class="estado">`
      +   `<div class="carga"><div class="anel"></div>`
      +   `<div class="barra"><i></i></div>`
      +   `<div class="passos">preparando</div></div>`
      +   `<b>carregando o modelo 3d</b><span></span></div>`
      + `<div class="reserva"><div class="ph">${fotos}</div>`
      +   `<span class="rescap">${((s.res||[])[0]||{}).cap||''}</span></div>`
      + (cenas?`<div class="cenas">${cenas}</div>`:'');
  }
  if(s.g==='earth-3d'){
    /* visor fotorrealista do Google Earth — sistemas/gabaritos/mapa-earth-3d.md
       ⚑ SÓ FUNCIONA POR LINK. A Maps JavaScript API recusa file://; peça com
       este slide se entrega publicada, nunca como arquivo anexado. A chave
       vem de modulos/ms-maps-chave.js, restrita por referrer.
       `alt` é altitude ACIMA DO NÍVEL DO MAR (São Paulo ~760), não altura de
       voo: errar para baixo enterra a câmera e a tela fica azul, sem erro. */
    return `<div class="visor" data-lat="${s.lat}" data-lng="${s.lng}" data-alt="${s.alt||760}">`
      + `<div class="scrim"></div>`
      + `<div class="veu"><b>clique para navegar no 3d</b>`
      + `<s>arrastar gira · ctrl + arrastar inclina · o teclado passa a ser do mapa</s></div>`
      + `<button class="sair" type="button">devolver o teclado ao slide</button></div>`
      + `<div class="rotulo">`
      + (s.kick?`<span class="kick">${s.kick}</span>`:'')
      + (s.h2?`<h2>${s.h2}</h2>`:'')
      + (s.lead?`<div class="lead">${s.lead}</div>`:'')
      + (s.cap?`<span class="cap">${s.cap}</span>`:'')
      + `</div>`
      + `<div class="cmd">`
      +   `<button class="rec" type="button" title="voltar ao ponto central">`
      +     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
      +     ` stroke-linecap="round" aria-hidden="true">`
      +     `<circle cx="12" cy="12" r="7"/>`
      +     `<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>`
      +     `<path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>recentrar</button>`
      +   `<button class="orb" type="button"><i></i>orbitar</button>`
      + `</div>`
      + `<div class="estado">`
      +   `<div class="carga"><div class="anel"></div>`
      +   `<div class="barra"><i></i></div>`
      +   `<div class="passos">preparando</div></div>`
      +   `<b>carregando a malha 3d</b>`
      /* <span> vazio de propósito: é onde o falha() escreve o diagnóstico */
      +   `<span></span></div>`;
  }
  if(s.g==='mapa-2d'){
    /* LIGHT · MAPA 2D no lugar do visor earth 3d.
       Mesma gramatica visual do earth-3d — scrim, veu de ativacao, rotulo,
       botao de recentrar, trava de teclado — e o CSS e literalmente o mesmo
       bloco, renomeado no build. O que muda e o motor: `google.maps.Map` em
       vez de `<gmp-map-3d>`.
       O QUE SE GANHA, e por que a versao light existe:
       · zero WebGL. O globo 3d desenha malha fotogrametrica a cada quadro;
         o mapa 2d desenha telha e para;
       · o modo HIBRIDO traz NOME DE RUA de graca, que era um dos tres
         pedidos do Michel para o slide de localizacao;
       · carga de mapa 2d nao consome a cota `3D Map loads per day`.
       O que se perde e a leitura de gabarito dos vizinhos — em 2d nao ha
       volume. Por isso a peca cheia continua existindo. */
    return `<div class="visor" data-lat="${s.lat}" data-lng="${s.lng}" data-z="${s.z||18}">`
      + `<div class="mapa"></div>`
      + `<div class="scrim"></div>`
      + `<div class="veu"><b>clique para navegar no mapa</b>`
      + `<s>arrastar move · rolar aproxima · o teclado passa a ser do mapa</s></div>`
      + `<button class="sair" type="button">devolver o teclado ao slide</button></div>`
      + `<div class="rotulo">`
      + (s.kick?`<span class="kick">${s.kick}</span>`:'')
      + (s.h2?`<h2>${s.h2}</h2>`:'')
      + (s.lead?`<div class="lead">${s.lead}</div>`:'')
      + (s.cap?`<span class="cap">${s.cap}</span>`:'')
      + `</div>`
      + `<div class="cmd">`
      +   `<button class="rec" type="button" title="voltar ao ponto central">`
      +     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"`
      +     ` stroke-linecap="round" aria-hidden="true">`
      +     `<circle cx="12" cy="12" r="7"/>`
      +     `<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>`
      +     `<path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>recentrar</button>`
      + `</div>`
      + `<div class="estado">`
      +   `<div class="carga"><div class="anel"></div>`
      +   `<div class="barra"><i></i></div>`
      +   `<div class="passos">preparando</div></div>`
      +   `<b>carregando o mapa</b><span></span></div>`;
  }
  const tab=s.cols?`<div class="rev"><table class="tb"><thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`+
    s.linhas.map((r,i)=>`<tr class="${s.hi===i?'hi':''}${s.fora===i?' fora':''}">`+r.map((c,j)=>`<td class="${j>0&&r.length>2?'':(j===r.length-1?'d':'')}">${c}</td>`).join('')+`</tr>`).join('')+`</tbody></table></div>`:'';
  if(s.g==='porte'){
    const f2=s.fecho?`<p class="sub rev" style="max-width:44ch">${s.fecho}</p>`:'';
    const nota=(n)=>n?`<div class="notaN"><span class="nn">${RS(n[0])}</span><span class="nt">${n[1]}</span></div>`:'';
    /* troca:1 — dois estados no MESMO slide. O isometrico e o titulo nao
       re-animam; o clique so faz o bloco da direita atravessar. Como dois
       slides, tudo entrava de novo a cada passagem. */
    const miolo = s.troca
      ? `<div class="trbox rev"><div class="tr tr-a">${tab}${nota(s.nota)}</div>`
        + `<div class="tr tr-b passo">${nota(s.nota2)}${dad}</div></div>`
      : `${tab}${s.nota?`<div class="rev">${nota(s.nota)}</div>`:''}${dad}${f2}`;
    return `<div class="pcols${s.alto?' alto':''}${s.meia?' meia':''}">`
      + `<div class="iso${s.troca?'':' rev'}">${isometrico(s.iso,s.esc)}</div>`
      + `<div class="wrap">${k}${t}${sub}${miolo}</div></div>`;
  }
  if(s.g==='tabela'){
    const f=s.fecho?`<p class="sub rev" style="max-width:56ch">${s.fecho}</p>`:'';
    const nt=s.nota?`<div class="notaN rev"><span class="nn">${RS(s.nota[0])}</span><span class="nt">${s.nota[1]}</span></div>`:'';
    return `<div class="wrap">${k}${t}${sub}${tab}${f}${nt}${prem}</div>`;
  }
  if(s.g==='plug'){
    /* mapa-resumo: as âncoras em pílula, cada uma com as oportunidades que
       saem do seu entorno. A distribuição se redesenha sozinha porque ela é
       mesmo indefinida — o que se afirma é estar plugado em todas, não um
       número por âncora.                                                  */
    const A=s.ancoras.map((n,i)=>`<div class="pg" data-a="${i}">`
      +`<span class="pgn">${n}</span>`
      +`<span class="pgo" data-o="${i}"></span></div>`).join('');
    return `<div class="wrap largo">${k}${t}${sub}<div class="pgrid rev">${A}</div>`
      +`<p class="pgr rev">${s.rodape||''}</p></div>`;
  }
  if(s.g==='duasfrentes'){
    /* pilula + subtitulo em duas linhas, e item numerado em mono terracota.
       23/08: a caixa terracota CRESCE para baixo a cada item revelado — o
       pacote se fecha na frente do cliente. O que nao entra fica FORA da
