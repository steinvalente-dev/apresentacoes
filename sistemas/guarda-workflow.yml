# Para ativar: mover para .github/workflows/guarda.yml (exige permissão Workflows no token, ou fazer pelo site do GitHub).
# Guarda do repositório público: roda a cada push e fica vermelho se entrar
# nome de cliente, endereço, CNPJ, valor, URL da área de cliente ou segredo.
# Não impede o Pages de publicar (Pages publica direto de main) — é o alarme.
# O bloqueio de verdade é rodar `python3 sistemas/guarda-publico.py` ANTES do push.
name: guarda-publico
on: [push, pull_request]
jobs:
  guarda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dado de cliente ou segredo no público?
        run: python3 sistemas/guarda-publico.py
      - name: sintaxe dos scripts inline do index.html
        run: |
          python3 - <<'PY'
          import re, subprocess, sys, pathlib
          s = pathlib.Path('index.html').read_text(encoding='utf-8')
          for i, js in enumerate(re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', s, re.S)):
              p = pathlib.Path(f'/tmp/inline{i}.js'); p.write_text(js)
              r = subprocess.run(['node', '--check', str(p)], capture_output=True, text=True)
              if r.returncode: print(r.stderr); sys.exit(1)
          print('index.html: scripts ok')
          PY
      - name: peça órfã (html sem registro no index)
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          s = open('index.html', encoding='utf-8').read()
          reg = set(re.findall(r'(?:href|ver)\s*:\s*"([^"?]+)"', s))
          IGN = ('index.html','sistemas/','modulos/','fundo/','ferramentas/','superado/','.git', '.github')
          orfas = sorted(str(p) for p in pathlib.Path('.').rglob('*.html') if not str(p).startswith(IGN) and str(p) not in reg)
          print('\n'.join(orfas) if orfas else 'nenhuma órfã'); sys.exit(1 if orfas else 0)
          PY
