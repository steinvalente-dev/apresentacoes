/* ══════════════════════════════════════════════════════════════════════════
   O QUADRO · TELA CHEIA · revisto em 02/09/2026
   ──────────────────────────────────────────────────────────────────────────
   ⚑ O texto abaixo descreve uma decisão de 25/08 que foi REVERTIDA. Fica
     aqui porque explica por que o esqueleto tinha ficado diferente das
     peças de referência, e o que se perdeu no caminho.

   ERA ASSIM (25/08 a 02/09): o deck vivia num quadro de 1600 × 900 FIXO,
   em pixels, escalado por `transform` até caber na tela — como vídeo em
   tela cheia. Vantagem real: nenhuma prancha transbordava, por construção.
   **Preço, que ninguém tinha medido: tarja preta em cima e embaixo em toda
   tela que não fosse 16:9 exato.** Isto é o letterbox, e é errado.

   É ASSIM (02/09 em diante): o quadro PREENCHE a área segura. Tela cheia,
   sem tarja, que é o que a `casa-ittb` e a `tokyo-centro` sempre fizeram —
   e são elas o padrão da casa, não este arquivo.

   O QUE VOLTA A SER RESPONSABILIDADE DE QUEM MONTA:
   · **transbordo.** A garantia por construção morreu com o quadro fixo.
     Em troca, o build de cada peça roda a varredura de transbordo em cinco
     proporções (21:9, 16:9, 16:10, 3:2, 4:3) e falha antes de publicar.
     A varredura não é opcional — é o que substitui a garantia.
   · **as `@media` de largura retiradas em 25/08** ("viraram código morto
     dentro do quadro fixo") voltam a poder disparar abaixo de ~1200px de
     largura. Não foram restauradas: em uso real — monitor e projetor — os
     limiares não são alcançados, e restaurar vinte regras às cegas é
     trabalho especulativo. O que estava lá está em
     `_R8/cel-responsivo.css.txt`, e a varredura é que aponta se falta.
   · o notch e a Dynamic Island continuam cobertos: o quadro é medido
     contra `#moldura`, que já é a área segura.

   As unidades de dentro seguem em `cqw`/`cqh`, do CONTÊINER. Com
   `container-type:size` no quadro, 1cqw = 1% da largura DO QUADRO — e o
   quadro agora tem a largura da tela. Num monitor de 1600 isso dá os mesmos
   16px de antes; num ultrawide dá mais, que é o que se quer. Foi por isso
   que a troca do quadro fixo para tela cheia não exigiu reescrever as 275
   clamps: a unidade continua a mesma, só o contêiner cresceu.
   ══════════════════════════════════════════════════════════════════════════ */
#moldura{position:fixed;
  top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);
  bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);
  overflow:hidden}
/* ⚑ TELA CHEIA — corrigido em 02/09/2026, e é a lei da casa.
   O quadro PREENCHE a área segura. Não tem largura fixa, não tem
   transform:scale, e por isso não produz tarja preta em cima nem embaixo,
   em monitor nenhum. Foi o erro da peça EMEI Presidente Dutra: a versão de
   19/08 travava 1600 × 900 e escalava, o que em qualquer tela que não fosse
   16:9 exato devolvia letterbox. As peças de referência da casa —
   `casa-ittb` e `tokyo-centro` — nunca fizeram isso: compõem contra a
   viewport, e são elas o padrão.
   O `container-type:size` FICA. É ele que mantém as clamps em `cqw`/`cqh`
   funcionando: num quadro de 1600 de largura, 1cqw continua valendo 16px —
   igual ao que valia antes. O que mudou é que agora o quadro tem a largura
   da tela, não a de um retângulo desenhado. Nenhuma clamp precisou mudar
   por causa disto. */
#quadro{position:absolute;inset:0;width:100%;height:100%;
  container-type:size;container-name:q;overflow:hidden}

/* ─── retrato ────────────────────────────────────────────────────────────
   Num celular em pé, 16:9 dá 390 x 219 — a peça inteira, correta, pequena.
   O aviso de girar NÃO mora aqui: é comportamento universal do acervo e vive
   em modulos/ms-voltar.js, que o desenha sozinho ao detectar deck de tela
   fixa em retrato. Ter um aviso próprio aqui faria aparecerem dois.
   A classe `retrato` fica: é barata e diz em que regime o quadro está. */

/* ═══ cheia — o render em tela cheia ═══════════════════════════════════
   Portado da casa ITTB em 29/08/2026, com vw/vh trocados por cqw/cqh.
   A mecânica que define o gabarito: com o ponteiro parado 1,8 s, o véu do
   pé, o gradiente do topo e o chrome esvanecem — a imagem fica inteira.
   `ocioso` é genérico, no body; `em-cheia` restringe o efeito a este
   gabarito. Sem a segunda, o texto sumiria em todo slide.
   Receita: sistemas/gabaritos/render-cheia.md
   ═══════════════════════════════════════════════════════════════════ */
/* ⚑ A EXCEÇÃO DA TELA CHEIA — 02/09/2026.
   O slide preenche a tela; a IMAGEM não estoura. `contain` em vez de
   `cover`: numa tela de proporção diferente da do render, sobra campo
   neutro nas bordas e a imagem entra INTEIRA. Numa peça de arquitetura
   isso não é detalhe — o que o `cover` cortava era desenho, e desenho
   cortado é informação perdida. O campo que sobra é a moldura, nunca o
   tema do slide: assim a borda lê como passe-partout e não como erro. */
.g-cheia{padding:0;background-image:none;background:var(--moldura)}
.g-cheia .full{position:absolute;inset:0}
.g-cheia .full .ph{position:absolute;inset:0}
.g-cheia .full .ph img{width:100%;height:100%;object-fit:contain;display:block}
/* ⚑ GRADIENTES SUAVES — 02/09/2026. Vinham pesados (b8 no topo, E6 a 62%
   no pé) e chapavam o render. Aqui é véu, não tarja: entra a um terço da
   opacidade anterior e fecha mais curto. A legibilidade do chrome deixou
   de depender do gradiente e passou a vir do `text-shadow` de baixo — que
   é o que permite o véu ser leve sem o texto sumir sobre céu branco. */
.g-cheia .full:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--tinta-35) 0,var(--tinta-10) 8%,transparent 20%)}
.g-cheia .ov{position:absolute;inset:auto 0 0 0;
  padding:clamp(50px,8cqh,120px) calc(var(--gut) * 1.9) var(--bot) var(--gut);
  background:linear-gradient(transparent,var(--tinta-15) 44%,var(--tinta-60) 100%);color:var(--papel)}
/* sombra de leitura: invisível como forma, decisiva sobre céu claro. É ela
   que sustenta o chrome e a legenda agora que o véu é leve. */
body.em-imagem .chrome,.g-cheia .ov h2,.g-cheia .ov .cap{
  text-shadow:0 1px 3px var(--tinta-45),0 2px 14px var(--tinta-35)}
/* ⚑ SLIDE DE FUNDO EM IMAGEM: o chrome inverte e ganha véu próprio.
   Medido em 02/09/2026 — sobre o céu branco de um render isométrico o
   chrome em Cal dava 1,04:1, ou seja invisível; e sobre imagem de satélite
   escura o chrome em tinta era igualmente ilegível. Voltar a chapar a
   imagem estaria contra a decisão do mesmo dia (véu, não tarja), então o
   véu é confinado à FAIXA DO CHROME: 116px no topo, contra os 20% de
   altura que o gradiente da prancha cobria. Assim o canto fica legível
   sobre qualquer imagem — céu branco, satélite, fachada colorida — e a
   imagem segue limpa no meio, que é onde ela é vista. */
body.em-imagem .chrome{color:var(--papel-90)}
body.em-imagem .chrome.topo{
  background:linear-gradient(var(--tinta-60) 0,var(--tinta-35) 46%,transparent 100%)}
body.em-imagem .chrome.pe{
  background:linear-gradient(transparent 0,var(--tinta-25) 60%,var(--tinta-50) 100%)}
.g-cheia .ov h2{color:var(--papel);font-family:var(--f-display);font-weight:500;
  font-style:italic;text-transform:lowercase;font-size:var(--fs-h);
  letter-spacing:-.022em;line-height:1}
.g-cheia .ov .cap{color:var(--papel-70);margin-top:.7em;max-width:70ch;
  font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.45}
/* ══ CHIP `abre` — a peca que mora ao lado ═══════════════════════════════
   17/09/2026. Modulo que ainda nao e' gabarito (a planta interativa) roda em
   arquivo proprio, na MESMA PASTA da peca, e o deck so o chama. O `href` e'
   relativo por regra: as duas moram juntas, entao o caminho da pasta de
   cliente nunca precisa ser escrito.

   Canto inferior DIREITO, oposto ao titulo. E irmao do `.ov`, nao filho:
   o `.ov` esvanece com o ponteiro parado e o chip nao pode esvanecer junto —
   botao que some e' botao que nao se acha no meio da fala.

   Pastilha clara, como a `.nav`: a mesma medida de leitura garantida sobre
   render de qualquer cor. */
.g-cheia .abrir{position:absolute;right:var(--gut);bottom:calc(var(--bot) + clamp(14px,2.2cqh,30px));
  z-index:3;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.2em;
  text-decoration:none;cursor:pointer;
  background:color-mix(in srgb,var(--papel) 94%,transparent);
  -webkit-backdrop-filter:blur(7px) saturate(1.1);backdrop-filter:blur(7px) saturate(1.1);
  border:1px solid var(--tinta-20);border-radius:999px;
  padding:clamp(9px,1.2cqh,15px) clamp(16px,1.8cqw,28px);
  box-shadow:0 1px 5px var(--tinta-15);color:var(--tinta);
  transition:transform .25s ease,box-shadow .25s ease}
.g-cheia .abrir b{font-family:var(--f-corpo);font-weight:600;
  font-size:var(--fs-cap);letter-spacing:-.005em;line-height:1.1}
.g-cheia .abrir s{text-decoration:none;font-family:var(--f-mono);font-weight:500;
  font-size:calc(var(--fs-cap)*.88);letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta-60)}
.g-cheia .abrir:hover{transform:translateY(-2px);box-shadow:0 3px 12px var(--tinta-20)}
.g-cheia .slot{position:absolute;inset:0;display:grid;place-content:center;
  gap:.35em;text-align:center;padding:1em;background:var(--slot-escuro);
  border:1px dashed var(--papel-20)}
.g-cheia .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.5em;line-height:1}
.g-cheia .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--papel)}
.g-cheia .slot s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--papel-45)}
/* ═══ cheia CLARO — desenho de fundo branco pede slide branco ══════════
   Regra do Michel, 10/09/2026, montando a Fazenda Lageado: planta, corte,
   fachada e mosaico de pranchas são traço preto sobre papel; postos sobre
   a moldura escura do `cheia` liam como negativo. `claro:1` no slide troca
   o campo por Cal e desfaz, só ali, tudo o que o `em-imagem` inverteu — o
   véu do pé, o gradiente do topo, o chrome e o logotipo do canto.
   Antes disto a saída era escurecer o pé do próprio arquivo de imagem, o
   que resolvia na tela e sujava o acervo de desenho.                     */
.g-cheia.claro{background:var(--papel)}
.g-cheia.claro .full:after{
  background:linear-gradient(var(--papel-90) 0,var(--papel-45) 8%,transparent 20%)}
.g-cheia.claro .ov{
  background:linear-gradient(transparent,var(--papel-60) 44%,var(--papel-90) 100%)}
.g-cheia.claro .ov h2{color:var(--tinta)}
.g-cheia.claro .ov .cap{color:var(--tinta-70)}
body.em-imagem.claro .chrome{color:var(--tinta-80)}
body.em-imagem.claro .chrome.topo{
  background:linear-gradient(var(--papel-90) 0,var(--papel-50) 46%,transparent 100%)}
body.em-imagem.claro .chrome.pe{
  background:linear-gradient(transparent 0,var(--papel-40) 60%,var(--papel-80) 100%)}
body.em-imagem.claro .chrome,
.g-cheia.claro .ov h2,.g-cheia.claro .ov .cap{
  text-shadow:0 1px 3px var(--papel-70),0 2px 14px var(--papel-45)}
/* nada a declarar aqui: sem a inversão acima, o lockup já herda os tokens
   da raiz — que é o logotipo colorido. */
/* o slot vazio também é claro: montar a estrutura antes das imagens é o modo
   normal de trabalho, e uma sequência de retângulos escuros no meio de slides
   claros lê como peça quebrada, não como andaime. */
.g-cheia.claro .slot{
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px);
  border:1px dashed var(--tinta-20)}
.g-cheia.claro .slot b{color:var(--tinta)}
.g-cheia.claro .slot s{color:var(--tinta-45)}


/* == GABARITO `video` - sangria total =====================================
   14/09/2026, pedido do Michel para a projecao mapeada sobre a maquete:
   *"o video, eu queria que ele aparecesse em tela cheia"*.

   Irmao do `cheia`, e de proposito: mesmo campo, mesmo overlay, mesma
   tipografia. So o conteudo e que se move.

   `contain`, nunca `cover`: projecao mapeada e enquadramento estudado -
   cortar a maquete para preencher a tela estragaria o assunto.

   MUDO E EM LACO, por tres razoes: autoplay so passa mudo em qualquer
   navegador; numa reuniao som que comeca sozinho e acidente; e em laco o
   slide aguenta o tempo que a conversa levar, sem ninguem reapertar play.
   `playsinline` e o que impede o iOS de abrir o video em tela cheia
   propria e engolir a apresentacao. */
.g-video{padding:0;background-image:none;background:var(--moldura)}
.g-video .full{position:absolute;inset:0}
.g-video video{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;background:var(--moldura)}
.g-video .full:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--tinta-90) 0,var(--tinta-45) 8%,transparent 20%)}
.g-video .ov{position:absolute;inset:auto 0 0 0;z-index:2;pointer-events:none;
  padding:0 var(--gut) calc(var(--bot) + clamp(10px,2cqh,30px));
  background:linear-gradient(transparent,var(--tinta-60) 44%,var(--tinta-90) 100%)}
.g-video .ov h2{color:var(--papel);font-family:var(--f-display);font-weight:500;
  font-size:var(--fs-h);line-height:1.04;max-width:26ch}
.g-video .ov .cap{display:block;color:var(--papel-70);margin-top:.7em;max-width:70ch;
  font-size:var(--fs-body);line-height:1.5}
.g-video .vcmd{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(10px,2cqh,30px));z-index:3;display:flex;gap:8px}
.g-video .vcmd button{cursor:pointer;display:flex;align-items:center;gap:.5em;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.06em;
  text-transform:uppercase;color:var(--papel-80);background:var(--tinta-45);
  border:1px solid var(--papel-25);border-radius:2px;
  padding:.5em .9em;transition:border-color .2s ease,color .2s ease}
.g-video .vcmd button:hover{border-color:var(--papel);color:#fff} /* #fff: pico de luz do hover, nao e cor de marca */
.g-video .vcmd i{display:block;width:7px;height:7px;border-radius:50%;
  background:currentColor;opacity:.3;transition:opacity .2s ease}
.g-video.tocando .vcmd i{opacity:1}
.g-video .slot{position:absolute;inset:0;display:grid;place-content:center;
  text-align:center;gap:.35em;background:repeating-linear-gradient(45deg,
  var(--papel-3) 0 6px,transparent 6px 12px)}
.g-video .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  color:var(--papel-80);font-size:clamp(13px,1.15cqw,18px)}
.g-video .slot s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--papel-45)}

/* == GABARITO `carrossel` - os desenhos passando, o numero em cima ========
   14/09/2026. O slide do cadastro mostrava a implantacao grande e um mosaico
   de miniaturas ao lado. O Michel, vendo pronto: *"as imagens pequenas nao
   estao com um peso grafico muito bom, isso nao funciona muito bem. A
   implantacao em tela cheia, e o proximo slide talvez um carrossel de
   imagens, uns seis desenhos, eles ficam se alternando, e em cima disso a
   gente deixa o texto do numero total de desenhos"*.

   O DIAGNOSTICO POR TRAS: miniatura de prancha nao se le - vira textura
   cinza. E o assunto do slide nunca foi ler desenho nenhum, foi mostrar
   VOLUME de trabalho. Um desenho por vez, grande, passando, conta isso
   melhor do que doze ilegiveis, e o numero no canto fecha o argumento.

   Uma imagem por vez, `contain` e cross-fade. Sem escala, sem deslize: o
   assunto e o desenho, e movimento sobre desenho de traco cansa a vista
   em projecao.

   As imagens ficam TODAS no DOM desde o inicio, so com opacidade zero - sao
   base64, ja estao no arquivo, e trocar `src` daria um piscar branco no
   primeiro ciclo. */
.g-carrossel{padding:0;background-image:none;background:var(--moldura)}
.g-carrossel .full{position:absolute;inset:0}
.g-carrossel .full img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;opacity:0;transition:opacity .9s ease}
.g-carrossel .full img.on{opacity:1}
.g-carrossel .full:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--tinta-90) 0,var(--tinta-45) 8%,transparent 20%)}
.g-carrossel .ov{position:absolute;inset:auto 0 0 0;z-index:2;pointer-events:none;
  padding:0 var(--gut) calc(var(--bot) + clamp(10px,2cqh,30px));
  background:linear-gradient(transparent,var(--tinta-60) 44%,var(--tinta-90) 100%)}
.g-carrossel .ov h2{color:var(--papel);font-family:var(--f-display);font-weight:500;
  font-size:var(--fs-h);line-height:1.04;max-width:26ch}
.g-carrossel .ov .cap{display:block;color:var(--papel-70);margin-top:.7em;max-width:70ch;
  font-size:var(--fs-body);line-height:1.5}
/* o contador: quantos ja passaram de quantos. Fica do lado oposto do texto,
   pequeno, e e o unico cronometro visivel - ninguem precisa adivinhar se a
   coisa esta rodando. */
.g-carrossel .cont-c{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(10px,2cqh,30px));z-index:3;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.1em;
  color:var(--papel-60);display:flex;gap:6px;align-items:center}
.g-carrossel .cont-c u{text-decoration:none;display:block;width:5px;height:5px;
  border-radius:50%;background:var(--papel-25);transition:background .3s ease}
.g-carrossel .cont-c u.on{background:var(--papel-80)}
/* == variante clara: desenho de traco pede campo de papel (regra de 10/09) */
.g-carrossel.claro{background:var(--papel)}
.g-carrossel.claro .full:after{
  background:linear-gradient(var(--papel-90) 0,var(--papel-45) 8%,transparent 20%)}
.g-carrossel.claro .ov{
  background:linear-gradient(transparent,var(--papel-60) 44%,var(--papel-90) 100%)}
.g-carrossel.claro .ov h2{color:var(--tinta)}
.g-carrossel.claro .ov .cap{color:var(--tinta-70)}
.g-carrossel.claro .cont-c{color:var(--tinta-60)}
.g-carrossel.claro .cont-c u{background:var(--tinta-20)}
.g-carrossel.claro .cont-c u.on{background:var(--tinta-80)}
.g-carrossel .slot{position:absolute;inset:0;display:grid;place-content:center;
  text-align:center;gap:.35em;background:repeating-linear-gradient(45deg,
  var(--papel-3) 0 6px,transparent 6px 12px)}
.g-carrossel .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  color:var(--papel-80);font-size:clamp(13px,1.15cqw,18px)}
.g-carrossel.claro .slot{background:repeating-linear-gradient(45deg,
  var(--tinta-3) 0 6px,transparent 6px 12px)}
.g-carrossel.claro .slot b{color:var(--tinta)}

/* == SUBDIVISOR: separa sem abrir secao ==================================
   14/09/2026. O Michel quis danos e estrutura numa secao so - *"so para
   deixar mais didatico, principalmente o indice, eu quero ter menos topicos
   para nao deixar tao cansativa a apresentacao"* - mas sem perder a virada
   de assunto no meio: *"a gente tem tipo um subdivisor no meio do caminho"*.

   O que abre secao no motor nao e o gabarito `divisor`, e o campo `sec`.
   Entao subdivisor e um divisor SEM `sec`: ele respira a tela inteira e
   anuncia a virada, mas nao ganha ponto no chrome nem linha no indice.
   `subdiv:1` so trata a tipografia - menor que um divisor de secao, para a
   hierarquia ficar visivel na propria pagina, e sem numero. */
.divisor.menor .dt{font-size:clamp(26px,5.2cqh,58px);max-width:18ch}
.divisor.menor .ds{margin-top:.8em;max-width:46ch}

/* == GABARITO `logo` - a entrada da marca ================================
   16/09/2026, pedido do Michel: *"la na apresentacao da AMAZ a gente fez uma
   introducao de logo muito impactante, onde a gente tinha um slide de fundo
   animado, e eu queria exatamente isso para o Museu do Cafe"*.

   Portado do sistema da AMAZ (`amaz-convergencia`, gabarito `logo`), que
   ficou preso naquela peca. Aqui vira gabarito do motor: serve a qualquer
   marca que precise de uma entrada, nao so a esta.

   TRES CAMADAS, e a ordem importa:
   1 · o video em sangria total, `cover` - aqui cortar e certo, o fundo e
       atmosfera e nao informacao (o oposto do gabarito `video`);
   2 · o veu, em gradiente diagonal da cor da marca: escuro onde o lockup
       pousa, aberto do outro lado para a imagem respirar;
   3 · o lockup, revelado por VARREDURA (`clip-path`) da esquerda para a
       direita. Nao e fade: varredura tem direcao, e direcao faz a marca
       parecer que chega, nao que aparece.

   `prefers-reduced-motion` entrega o lockup inteiro, parado. */
.g-logo{padding:0;background-image:none;align-items:flex-start}
.g-logo .bleed{position:absolute;inset:0;overflow:hidden;z-index:0;background:var(--moldura)}
.g-logo .bleed video,.g-logo .bleed img{position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;display:block}
.g-logo .bleed:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    /* ⚑ 16/09/2026 — DUAS camadas, e a de cima existe por um motivo. Com o
       veu numa cor so, um fundo que tem sol (o cafezal com lens flare) perde
       justamente o que tem de vivo: o campo de cor apaga o brilho. Esta
       camada e' o sol atravessando o veu, ancorada onde o flare nasce no
       video — direita, um pouco acima do meio. Se o fundo nao tiver sol, ela
       so aquece a lateral e nao atrapalha. */
    radial-gradient(112% 86% at 91% 40%,
      color-mix(in srgb,var(--m-acento,var(--acento)) 30%,transparent) 0%,
      color-mix(in srgb,var(--m-acento,var(--acento)) 10%,transparent) 34%,
      transparent 66%),
    /* `--m-veu` multiplica a rampa inteira de uma vez: 1 e a carga
       cheia, .5 e metade. Um botao so, em vez de oito. */
    linear-gradient(96deg,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(90% * var(--m-veu,1)),transparent) 0%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(88% * var(--m-veu,1)),transparent) 30%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(82% * var(--m-veu,1)),transparent) 46%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(72% * var(--m-veu,1)),transparent) 58%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(59% * var(--m-veu,1)),transparent) 69%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(46% * var(--m-veu,1)),transparent) 80%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(36% * var(--m-veu,1)),transparent) 90%,
    color-mix(in srgb,var(--m-campo,var(--tinta)) calc(32% * var(--m-veu,1)),transparent) 100%)}
.g-logo .logowrap{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;height:100%;
  gap:clamp(14px,2.6cqh,36px);padding:0 var(--gut)}
.g-logo .ante{display:flex;align-items:center;gap:13px;
  font-family:var(--f-mono);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.22em;text-transform:uppercase;color:var(--m-apoio,var(--papel-70))}
.g-logo .ante:before{content:'';width:44px;height:2px;
  background:var(--m-acento,var(--acento))}
/* a varredura. `overflow:hidden` no invólucro para o clip nao vazar sombra */
.g-logo .lock{overflow:hidden;width:clamp(240px,46cqw,720px);max-width:100%}
/* 16/09/2026 — a varredura passa de 1,05 s para 1,95 s a pedido do Michel:
   *"a entrada do novo logo deve ser mais lenta"*. Entrada de marca nao e'
   transicao de interface; e' o tempo que a sala leva para parar e olhar.
   A curva tambem abriu (.18/.5 -> .14/.46 no comeco): segura a velocidade
   por mais tempo antes de assentar, em vez de frear cedo. */
.g-logo .lock img{display:block;width:100%;height:auto;
  /* sombra na cor do campo, nao preta: descola o lockup de um fundo que se
     mexe sem sujar a cor da marca. Acompanha a varredura, porque o filtro se
     aplica depois do clip-path. */
  filter:drop-shadow(0 3px 22px color-mix(in srgb,var(--m-campo,var(--tinta)) 62%,transparent));
  clip-path:inset(0 100% 0 0);
  transition:clip-path 1.95s cubic-bezier(.14,.46,.22,1) var(--logo-espera,.32s)}
.g-logo.revelado .lock img{clip-path:inset(0 0 0 0)}

/* ══ CONSTRUCAO DA MARCA — lockup em SVG ═════════════════════════════════
   O contorno e' desenhado forma a forma, da esquerda para a direita, e o
   preenchimento entra atras do proprio traco.

   `pathLength="1"` no arquivo e' o que faz isto ser CSS puro: o comprimento
   de todo caminho passa a valer 1, entao `stroke-dasharray:1` com
   `stroke-dashoffset` de 1 a 0 desenha qualquer forma sem medir nada em JS —
   e uma vesica grande leva o mesmo tempo que um losango pequeno, que e' o
   que faz o conjunto ler como UMA construcao.

   `--i` vem do proprio arquivo, por forma, na ordem da esquerda para a
   direita. `--logo-espera` empurra tudo para depois do fundo tocar sozinho.
   O traco e' fino de proposito: ele nao e' um contorno de marca, e' o rastro
   da construcao, e desaparece dentro do preenchimento. */
.g-logo .lock.viva{overflow:visible;
  filter:drop-shadow(0 3px 22px color-mix(in srgb,var(--m-campo,var(--tinta)) 55%,transparent))}
.g-logo .lock.viva svg{display:block;width:100%;height:auto;overflow:visible}
/* ⚑ ANIMACAO, E NAO TRANSICAO — e o motivo e' um defeito medido.
   Com transicao, antes do atraso vencer o caminho fica em
   `stroke-dashoffset:1`, que em tese nao desenha nada. Na pratica o Chromium
   emite um segmento de comprimento zero no inicio de cada subcaminho, e a
   juncao arredondada dele vira um PONTO. Medido em 16/09/2026 comparando o
   slide com e sem o SVG no mesmo quadro de video: 218 pixels acesos,
   espalhados por toda a caixa — um ponto por subcaminho. O Michel viu:
   *"vejo pequenos pontinhos brancos na tela, como se fosse uma previa dos
   pontos de ancora"*. Era exatamente isso.

   `animation` com `animation-fill-mode:both` resolve na raiz: antes do
   atraso o elemento segura o quadro 0%, e nele `stroke-opacity:0`. Nao
   importa o que o rasterizador faca com o tracejado degenerado — esta
   transparente. A juncao arredondada tambem saiu; nao fazia falta. */
@keyframes ms-constroi{
  0%  {stroke-opacity:0;fill-opacity:0;stroke-dashoffset:1}
  4%  {stroke-opacity:1}
  44% {stroke-opacity:1;fill-opacity:0;stroke-dashoffset:0}
  70% {fill-opacity:1}
  100%{stroke-opacity:0;fill-opacity:1;stroke-dashoffset:0}
}
.g-logo .lock.viva svg path{
  fill:var(--m-apoio,var(--papel));fill-opacity:0;
  stroke:var(--m-apoio,var(--papel));stroke-opacity:0;
  stroke-width:var(--logo-traco,.7);
  stroke-dasharray:1;stroke-dashoffset:1}
/* 2,4 s de fundo sozinho antes do primeiro traco. Pedido do Michel: o video
   precisa existir como video antes de virar pano de fundo da marca. */
.g-logo.revelado .lock.viva svg path{
  animation:ms-constroi 2.6s cubic-bezier(.3,.6,.3,1) both;
  animation-delay:calc(var(--logo-espera,2.4s) + var(--i,0)*var(--logo-passo,42ms))}
.g-logo .dep{font-size:var(--fs-body);line-height:1.6;max-width:46ch;
  color:var(--m-apoio,var(--papel-80))}
.g-logo .slot{position:relative;z-index:1;display:grid;place-content:center;
  height:100%;width:100%;text-align:center;color:var(--papel-70);
  font-family:var(--f-display);font-style:italic}
@media (prefers-reduced-motion: reduce){
  .g-logo .lock img{clip-path:inset(0 0 0 0);transition:none}
  .g-logo.revelado .lock.viva svg path{animation:none;fill-opacity:1;stroke-opacity:0}
}
.chrome,.g-cheia .ov,.g-cheia .full:after{transition:opacity .55s cubic-bezier(.4,0,.2,1)}
body.em-cheia.ocioso .chrome,
body.em-cheia.ocioso .slide.ativo .ov,
body.em-cheia.ocioso .slide.ativo .full:after{opacity:0}
/* o visor 3d NÃO some com o ponteiro parado: ali o chrome carrega os botões
   de órbita e de recentrar, e apagar controle enquanto a câmera gira deixa
   quem apresenta sem volante. O `em-cheia` é que restringe o efeito à
   prancha de imagem — por isso a regra acima não menciona `em-imagem`. */
@media (prefers-reduced-motion: reduce){
  body.em-cheia.ocioso .chrome,
  body.em-cheia.ocioso .slide.ativo .ov,
  body.em-cheia.ocioso .slide.ativo .full:after{opacity:1}
}

/* ═══ ESCOLHA — a bifurcação ════════════════════════════════════════════
   Uma página com pílulas onde quem apresenta decide o caminho. Pedido do
   Michel em 04/09: antes de entrar no 3d, escolher entre o modelo
   interativo e as imagens.

   ⚑ O DESTINO É POR GABARITO, NÃO POR ÍNDICE. Cada pílula declara `para`
   com o NOME de um gabarito, e o motor procura o próximo slide daquele
   gabarito. Índice chumbado já quebrou um teste nesta peça quando uma
   seção entrou no meio; numa bifurcação quebraria na frente do cliente.

   A pílula é a mesma do `começar` da capa — é a linguagem da casa para
   "clique aqui e algo acontece", e não se inventa uma segunda. */
.g-escolha .opcoes{display:flex;flex-wrap:wrap;gap:clamp(10px,1.5cqw,22px);
  margin-top:clamp(20px,3.4cqh,48px)}
.g-escolha .pill{display:flex;flex-direction:column;align-items:flex-start;
  gap:.34em;cursor:pointer;text-align:left;
  background:var(--papel);color:var(--tinta);border:1px solid var(--papel);
  border-radius:999px;padding:clamp(12px,1.7cqh,20px) clamp(20px,2.1cqw,34px);
  transition:transform .25s ease,background .25s ease,color .25s ease}
.g-escolha .pill b{font-family:var(--f-corpo);font-weight:600;
  font-size:var(--fs-item);letter-spacing:-.01em;line-height:1.1}
.g-escolha .pill s{text-decoration:none;font-family:var(--f-mono);font-weight:500;
  font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-60)}
.g-escolha .pill:hover{transform:translateY(-2px)}
.g-escolha .pill:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
/* sobre campo escuro a pílula já é o claro da tela: inverte o hover para não
   piscar branco em branco */
body.esc .g-escolha .pill:hover,body.com-fundo .g-escolha .pill:hover{
  background:var(--acento-claro)}

/* ═══ GALERIA — mosaico, e a lupa em tela cheia ══════════════════════════
   Pedido do Michel em 04/09: cada proposta abre como mosaico; clicar numa
   imagem a expande em tela cheia.

   ⚑ `contain` TAMBÉM NA MINIATURA, e é decisão, não descuido. `cover` é o
   normal em mosaico, e aqui está proibido pela regra 2 do DECK-MONTAR: o
   que o cover corta, em peça de arquitetura, é desenho. Como os seis
   renders saem dos mesmos pontos de câmera e têm a mesma proporção, o
   `contain` fica visualmente idêntico ao `cover` e não corre risco.

   ⚑ A LUPA É CAMADA, NÃO SLIDE. Decisão do Michel: as setas passeiam pelas
   vistas daquela versão e o deck só avança quando a lupa fecha. É o que
   permite ficar numa imagem enquanto o cliente fala.
   O `X` é grande de propósito (44 px de alvo, mínimo de toque) e some com
   o ponteiro parado, voltando a qualquer gesto — mesma mecânica do overlay
   descritivo da prancha `cheia`, e o `ocioso` que a comanda já é genérico
   no body. A IMAGEM nunca some; só o controle. */
.g-galeria{padding:calc(var(--top) + clamp(10px,1.8cqh,26px)) var(--gut) calc(var(--bot) + clamp(10px,1.8cqh,26px));
  background:var(--moldura)}
.g-galeria .galtopo{flex:0 0 auto;margin-bottom:clamp(12px,2cqh,26px)}
.g-galeria .mosaico{flex:1 1 auto;display:grid;gap:clamp(6px,.8cqw,14px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(132px,19cqw,330px),1fr));
  align-content:center;min-height:0}
.g-galeria .tijolo{position:relative;display:block;padding:0;cursor:pointer;
  background:var(--slot-escuro);border:1px solid var(--papel-10);border-radius:3px;
  overflow:hidden;aspect-ratio:16/9;
  transition:border-color .25s ease,transform .25s ease}
.g-galeria .tijolo img{width:100%;height:100%;object-fit:contain;display:block}
.g-galeria .tijolo .tlbl{position:absolute;inset:auto 0 0 0;
  padding:.5em .62em;font-family:var(--f-mono);font-weight:500;
  font-size:clamp(8px,.62cqw,10.5px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--papel-90);text-align:left;
  background:linear-gradient(transparent,var(--tinta-70));
  text-shadow:0 1px 3px var(--tinta-60)}
.g-galeria .tijolo:hover{border-color:var(--papel);transform:translateY(-2px)}
.g-galeria .tijolo:focus-visible{outline:2px solid var(--papel);outline-offset:2px}

.g-galeria .lupa{position:absolute;inset:0;z-index:6;display:none;
  background:var(--moldura)}
.g-galeria.lupando .lupa{display:block}
.g-galeria .lupa .lph{position:absolute;inset:0}
.g-galeria .lupa img{width:100%;height:100%;object-fit:contain;display:block}
.g-galeria .lupa .lupaov{position:absolute;inset:auto 0 0 0;
  padding:clamp(40px,7cqh,100px) calc(var(--gut) * 1.9) var(--bot) var(--gut);
  background:linear-gradient(transparent,var(--tinta-15) 44%,var(--tinta-60) 100%);
  color:var(--papel);pointer-events:none}
.g-galeria .lupa .lupaov h3{font-family:var(--f-display);font-weight:500;
  font-style:italic;text-transform:lowercase;font-size:var(--fs-h);
  text-shadow:0 1px 3px var(--tinta-45),0 2px 14px var(--tinta-35)}
.g-galeria .lupa .lupaov span{display:block;margin-top:.4em;font-size:var(--fs-body);
  color:var(--papel-90);max-width:52ch;
  text-shadow:0 1px 3px var(--tinta-45),0 2px 14px var(--tinta-35)}
/* o X: alvo de 44 px, o mínimo de toque, e contraste próprio para não
   depender do que houver atrás */
.g-galeria .lupa .fechar{position:absolute;top:clamp(10px,1.6cqh,22px);
  right:clamp(10px,1.4cqw,24px);width:clamp(38px,3.1cqw,50px);height:clamp(38px,3.1cqw,50px);
  display:grid;place-items:center;cursor:pointer;border-radius:50%;
  background:var(--tinta-70);color:var(--papel);border:1px solid var(--papel-25);
  font-size:calc(var(--seta) * .34);line-height:1}
.g-galeria .lupa .fechar:hover{background:var(--tinta);border-color:var(--papel)}
.g-galeria .lupa .lseta{position:absolute;top:50%;transform:translateY(-50%);
  width:var(--seta);height:var(--seta);display:grid;place-items:center;cursor:pointer;
  border-radius:50%;background:var(--tinta-50);color:var(--papel);
  border:1px solid var(--papel-20);font-size:calc(var(--seta) * .34);line-height:1}
.g-galeria .lupa .lseta:hover{background:var(--tinta-80);border-color:var(--papel)}
.g-galeria .lupa .lant{left:clamp(8px,1.2cqw,20px)}
.g-galeria .lupa .lpro{right:clamp(8px,1.2cqw,20px)}
.g-galeria .lupa .lconta{position:absolute;top:clamp(14px,2.2cqh,28px);
  left:var(--gut);font-family:var(--f-mono);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.14em;color:var(--papel-70);
  text-shadow:0 1px 3px var(--tinta-60)}
/* ⚑ O CONTROLE SOME, A IMAGEM NÃO. Ponteiro parado 1,8 s e o body ganha
   `ocioso` (mecanismo genérico, no fim do arquivo); qualquer gesto tira. */
.g-galeria .lupa .fechar,.g-galeria .lupa .lseta,
.g-galeria .lupa .lupaov,.g-galeria .lupa .lconta{
  transition:opacity .55s cubic-bezier(.4,0,.2,1)}
body.ocioso .g-galeria.lupando .fechar,
body.ocioso .g-galeria.lupando .lseta,
body.ocioso .g-galeria.lupando .lupaov,
body.ocioso .g-galeria.lupando .lconta{opacity:0}
@media (prefers-reduced-motion: reduce){
  body.ocioso .g-galeria.lupando .fechar,
  body.ocioso .g-galeria.lupando .lseta,
  body.ocioso .g-galeria.lupando .lupaov,
  body.ocioso .g-galeria.lupando .lconta{opacity:1}
}

/* ═══ prancha — a grade de referência ══════════════════════════════════
   Portada da casa ITTB em 29/08/2026. Nomes próprios (.pbody, .ptop,
   .plead, .pcap) porque .body, .top e .cap já existem em outros gabaritos.
   Receita: sistemas/gabaritos/prancha-referencia.md
   ═══════════════════════════════════════════════════════════════════ */
.g-prancha{padding:calc(var(--top) + clamp(6px,1.6cqh,26px)) var(--gut)
           calc(var(--bot) + clamp(6px,1.6cqh,26px))}
.g-prancha .pbody{flex:1;display:flex;flex-direction:column;
  gap:clamp(14px,2.4cqh,34px);min-height:0;height:100%}
.g-prancha .ptop{display:flex;justify-content:space-between;align-items:flex-end;
  gap:clamp(20px,2.5cqw,52px);flex-wrap:wrap}
.g-prancha .ptop h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.g-prancha .plead{font-size:var(--fs-body);color:var(--soft);max-width:52ch;line-height:1.5}
.g-prancha .pkick{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.16em;
  text-transform:uppercase;color:var(--acento);margin-bottom:6px}
body.esc .g-prancha .pkick{color:var(--acento-claro)}
.g-prancha .grade{flex:1;min-height:0;display:grid;gap:clamp(8px,.9cqw,20px)}
.g-prancha .grade .cel{display:flex;flex-direction:column;gap:.5em;min-height:0;
  justify-content:center}
.g-prancha .grade .cel .ph{flex:1;max-height:100%;position:relative;overflow:hidden;
  background:var(--tinta-3)}
.g-prancha .grade .cel .ph img{width:100%;height:100%;object-fit:cover;display:block}
.g-prancha .grade .cel.pilha{gap:clamp(6px,.65cqw,14px)}
.g-prancha .grade .cel.pilha .ph{flex:1;background:transparent}
.g-prancha .grade .cel.pilha .ph img{object-fit:contain}
/* `caber:1` no slide — FOLHA TÉCNICA INTEIRA. Prancha de mapeamento não se
   recorta: a legenda e o carimbo fazem parte do documento, e `cover` come um
   ou outro. Aqui a imagem é contida e a célula é limitada pela ALTURA, não
   pela largura — é o que impede a folha de 1,42:1 de transbordar em tela
   larga e baixa (medido em 18/09/2026: +389px em 2560×1080 com
   `aspect-ratio` na célula). */
.g-prancha.caber .grade .cel .ph{background:var(--papel)}
/* `caber` + `pilha`: a célula PERDE o `aspect-ratio`. Com ele, a altura vira
   função da largura e a pilha estoura o quadro em tela larga e baixa —
   medido em 18/09/2026: +390px em 2560×1080 com duas elevações empilhadas.
   Sem ele, a coluna divide a ALTURA disponível e cada desenho se contém
   dentro da sua parte. */
.g-prancha.caber .grade .cel.pilha{aspect-ratio:auto!important}
/* sem `aspect-ratio` a celula perde a altura definida, e uma linha de grade
   sem altura definida cresce ate o tamanho do conteudo — que aqui e a altura
   intrinseca das imagens. `minmax(0,1fr)` devolve o teto: a linha ocupa o que
   sobra, e nao mais do que isso. */
.g-prancha.caber .grade{grid-auto-rows:minmax(0,1fr);align-items:stretch}
/* `align-items:stretch` fecha a conta: com o `center` da regra base o item
   nao recebe a altura da linha — e sizedo pelo conteudo e so centralizado,
   entao o teto da linha nao o alcanca. Medido: celula de 1.655 px numa linha
   de 769. */
.g-prancha.caber .grade .cel.pilha .ph{background:var(--papel);min-height:0}
/* `min-height:0` nao e detalhe: num flex em coluna o minimo de cada item e o
   TAMANHO DO CONTEUDO, e imagem tem altura intrinseca. Sem isto os tres
   desenhos se recusam a encolher e a pilha transborda. */
.g-prancha.caber .grade .cel .ph img{object-fit:contain}
/* ⚑ `juntar` — as duas imagens vem para o MEIO do slide.
   Com `caber`, a imagem usa `object-fit:contain` e se centraliza na propria
   celula. Desenho alto e estreito em celula de meia tela sobra branco dos dois
   lados de cada uma, e o par se afasta: a legenda-mestre do Lageado ficava com
   as duas colunas grudadas nas bordas, com o vazio todo no centro. Pedido do
   Michel em 19/09/2026.
   `object-position` resolve sem mexer na grade: a primeira celula empurra a
   imagem para a direita, a ultima para a esquerda, e o branco vai para fora.
   So faz sentido com DUAS colunas — por isso e' campo, e nao regra geral. */
.g-prancha.juntar .grade .cel:first-child .ph img{object-position:100% 50%}
.g-prancha.juntar .grade .cel:last-child  .ph img{object-position:0% 50%}
.g-prancha .pcap{font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.42;
  color:var(--soft);letter-spacing:.02em}
.g-prancha .slot{position:absolute;inset:0;display:grid;place-content:center;gap:.35em;
  text-align:center;padding:1em;
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px);
  border:1px dashed var(--tinta-20)}
.g-prancha .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.4em;line-height:1}
.g-prancha .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--tinta)}
.g-prancha .slot s{text-decoration:none;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-45)}

/* ═══ vazio — o gabarito existe, o dado do projeto não ═════════════════
   Estado legítimo, como o slot de imagem: permite montar a estrutura
   antes de o levantamento existir. Vale para qualquer gabarito que
   dependa de dado, não só o mapa.
   ═══════════════════════════════════════════════════════════════════ */
.vazio{position:absolute;inset:var(--top) var(--gut) var(--bot);
  display:grid;place-content:center;justify-items:center;gap:.55em;text-align:center;
  border:1px dashed var(--tinta-20);
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px)}
.vazio .vmarca{font-family:var(--f-display);font-weight:500;font-style:italic;
  color:var(--acento);font-size:clamp(20px,2.2cqw,34px);line-height:1}
.vazio h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.vazio .vsub{font-size:var(--fs-body);color:var(--soft);max-width:46ch}
.vazio .vnota{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta-45);max-width:52ch;margin-top:.4em}
.vazio .vnota code{text-transform:none;letter-spacing:0}
/* ═══ aviso — gabarito desconhecido ou campo obrigatório ausente ═════════
   03/09/2026. O `return ''` do tpl() virou slide visível: antes um `g`
   errado sumia em silêncio, e um `itens` faltando escrevia `undefined` na
   tela ou derrubava o deck inteiro. Agora o slide aparece hachurado, diz o
   que falta, e o console recebe o mesmo texto. Mesmo desenho do `vazio`.
   ═══════════════════════════════════════════════════════════════════ */
.vazio.aviso{border-color:var(--acento-45)}
.vazio.aviso .vmarca{color:var(--acento)}
.vazio.aviso code{font-family:var(--f-mono);background:var(--tinta-5);padding:.1em .4em;border-radius:2px}

/* ═══ o canto superior direito — texto ou logotipo ═══════════════════════
   Decisão do Michel, 03/09/2026: o padrão da casa é TEXTO (michel stein_,
   AMAZ, Lavrō). A Sarasá leva o LOGOTIPO pequeno, fixo, trocando
   positivo/negativo pelo tema do slide — testado na EMEI Presidente Dutra
   em reunião e aprovado. Quem decide é a constante LOGO_CANTO do bloco da
   marca; o script de marca troca `.marca-txt` por `.marca-lk`.
   Tamanho do logotipo: 120 a 148 px no PADRÃO — reduzido de 132–180 em
   03/09/2026 a pedido do Michel ("pode ficar menor em todos os casos").
   Medido antes de mudar: a 1600 px de largura o antigo dava 152 px, e num
   celular deitado (852 px) a base fixa de 132 px o inflava para 15,5% da
   largura da tela contra 9,5% no desktop. Era isso que o incomodava.
   A troca positivo/negativo é POR TOKEN: o SVG traz fill="var(--tinta)" e
   fill="var(--primaria)"; sobre campo escuro, imagem ou visor os dois viram
   papel e o lockup fica monocromático, como o negativo oficial. SVG
   monocromático usa fill="currentColor" e recebe o mesmo tratamento.   */
.marca{display:flex;align-items:center}
.marca .marca-lk{display:block;width:var(--logo-canto-w,clamp(104px,7.4cqw,128px));
  line-height:0;opacity:.9;transition:opacity .3s ease;color:var(--tinta)}
.marca .marca-lk svg{display:block;width:100%;height:auto}

/* ⚑ NÍVEL MICRO EM TELA DE CELULAR — regra do arquivo de marca, não gosto.
   MARCA-SARASA §4, "Quatro níveis de escala": abaixo de 130 px o lockup
   entra no nível **Micro**, e nele `estúdio` NÃO encolhe — **sai**. É o
   nível de marca d'água, que é exatamente o papel do canto do chrome.
   Então em tela estreita ou baixa o logotipo diminui de verdade E perde
   `estúdio`, em vez de virar um lockup de 84 px ilegível — o que violaria
   a §4 e é o erro que estava para acontecer.
   O corte é por FILL, e isso só funciona porque o SVG oficial separa as
   duas palavras em dois tokens: `estúdio` em --tinta, `Sarasá` em
   --primaria. Medido no lockup-pos.svg: sete paths de cada.
   A caixa não muda de proporção ao esconder `estúdio`: o `S` é o único
   glifo de corpo inteiro (y 0→77) e é ele que define a altura do viewBox.
   Verificado no arquivo de marca, tabela de medidas da §4.
   Limiares: 900 px de largura pega celular deitado e tablet em pé; 520 px
   de altura pega celular deitado em tela curta, onde a largura sozinha não
   denuncia. */
@media (max-width:900px),(max-height:520px){
  /* ⚑ `!important` porque o bloco de marca escreve `--logo-canto-w` no
     ESTILO INLINE do nó (`lk.style.setProperty`), e inline vence folha. Sem
     isto o nível Micro da §4 nunca disparava para quem declara `largura` —
     medido em 17/09/2026: em tela de 430 px o lockup ficava com 132 px, 31%
     da largura, e com `estúdio` abaixo do piso de 130 px. */
  .marca .marca-lk{--logo-canto-w:clamp(70px,10cqw,100px)!important;opacity:.82}
  /* o seletor casa a STRING do atributo, não o valor computado: continua
     valendo quando o tema troca --tinta por --papel sobre campo escuro. */
  .marca .marca-lk svg path[fill="var(--tinta)"]{display:none}
}
/* o `hidden` do HTML tem de vencer o display:block acima */
.marca .marca-lk[hidden],.marca .marca-txt[hidden]{display:none}
/* ⚑ `em-imagem` NÃO inverte quando o slide é `claro`: ali o campo é papel, e
   o lockup tem de sair com a cor dele — `estúdio` em Ferro e `Sarasá` em
   Vinho, que é como o SVG oficial separa os dois tokens (MARCA-SARASA §4).
   Antes disto a regra do `claro` zerava os três com `initial` e as duas
   palavras caíam para preto. Pedido do Michel em 17/09/2026, com o campo da
   planta interativa virando branco. */
body.esc .marca .marca-lk,body.terra .marca .marca-lk,body.com-fundo .marca .marca-lk,
body.em-imagem:not(.claro) .marca .marca-lk{--tinta:var(--papel);--primaria:var(--papel);--acento:var(--papel);color:var(--papel)}

/* ═══ grafismo de marca na base — opcional, por `graf:1` ══════════════════
   Portado da EMEI (Sarasá: contorno da Fortaleza da Barra Grande). Sempre
   na base, sangrando nas laterais, numa cor só (papel). Nunca atrás de
   texto corrido, tabela ou croqui: entra em divisor e contracapa. O SVG vem
   da constante GRAFISMO do bloco da marca; sem ela, `graf:1` não faz nada. */
#msgraf{position:absolute;left:-2%;right:-2%;bottom:0;z-index:0;
  pointer-events:none;opacity:0;transition:opacity .7s ease;
  color:var(--papel);line-height:0}
#msgraf svg{display:block;width:104%;height:auto}
body.com-graf #msgraf{opacity:.28}
body.no-fim #msgraf{opacity:.18}

/* ═══ marca: lockup em SVG e contracapa com crédito ══════════════════════
   `lockup:1` no slide `marca` troca a sigla em texto pela constante LOCKUP
   do bloco (SVG monocromático em currentColor, cor do papel). A contracapa
   (`fim_:1`) aceita `credito` — a linha pequena de concepção e coordenação. */
.g-marca .lock{width:var(--lk,clamp(200px,25cqw,470px));line-height:0;flex:0 0 auto;color:var(--papel)}
.g-marca .lock svg{display:block;width:100%;height:auto}
.g-marca .credito-peca{font-family:var(--f-mono);font-size:clamp(9px,.7cqw,12.5px);
  letter-spacing:.08em;text-transform:uppercase;color:var(--papel-70);
  margin-top:clamp(14px,2.2cqh,30px);line-height:1.5}

/* ═══ capa em dois momentos — opcional, por `dois:1` no slide `marca` ═════
   Portado de modulos/capa-morph-sarasa.html pela EMEI em 03/09/2026.
   Momento A: a capa institucional (lockup ou sigla, papel, descritor, site,
   pílula), parada na tela enquanto a sala se acomoda. O clique em `começar`
   chama avanca(): o `.cm-b` é um `.passo`, então entra o momento B — o
   TÍTULO da apresentação (kick, t, sub, pe) no lugar do bloco institucional.
   O clique seguinte corre a cortina e entra no deck. Os dois blocos se
   sobrepõem em absoluto e trocam por opacidade; o `.cm-b` vem antes no DOM
   só para o seletor `~` poder apagar o `.cm-a`.                            */
.slide.g-marca.dois{padding:0;justify-content:center}
.g-marca.dois{--lk:clamp(200px,25cqw,470px)}
.g-marca.dois .cm-a,.g-marca.dois .cm-b{position:absolute;left:var(--gut-in);right:var(--gut-in);
  top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(11px,1.6cqh,24px);z-index:1;
  transition:opacity .55s ease,transform .55s ease}
.g-marca.dois .cm-b{opacity:0;transform:translateY(calc(-50% + 12px));pointer-events:none}
.g-marca.dois .cm-b.on{opacity:1;transform:translateY(-50%)}
.g-marca.dois .cm-b.on ~ .cm-a{opacity:0;transform:translateY(calc(-50% - 10px));pointer-events:none}
/* o qualificador vai SOB o lockup, nunca ao lado: ao lado lê como segunda marca */
.g-marca .lk-bloco{display:block}
.g-marca .nucleo{font-family:var(--f-mono);font-size:calc(var(--lk,300px)*.033);
  letter-spacing:.34em;text-transform:uppercase;color:var(--papel-80);line-height:1;
  margin-top:calc(var(--lk,300px)*.034);padding-left:calc(var(--lk,300px)*.010)}
.g-marca .descritor{font-family:var(--f-mono);font-size:clamp(10px,.82cqw,15px);
  letter-spacing:.13em;text-transform:uppercase;color:var(--papel-60);line-height:1.6;
  max-width:34ch;margin-top:calc(var(--lk,300px)*.012)}
.g-marca.dois .cm-b .mega{max-width:26ch}
.g-marca.dois .cm-b .sub{max-width:52ch}
.g-marca .cm-pe{font-family:var(--f-mono);font-size:clamp(9px,.72cqw,13px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--papel-60);margin-top:clamp(10px,1.6cqh,24px);line-height:1}

/* ═══ VIVA — a peça vizinha, dentro do slide ══════════════════════════════
   Um quadro de sangria total com um arquivo que mora NA MESMA PASTA da peça.
   Hoje é a planta interativa; serve para qualquer módulo que ainda não seja
   gabarito do esqueleto.

   ⚑ O ARQUIVO SABE QUE ESTÁ AQUI. Ele liga o modo `embutida` (o chrome dele
     sai, porque o do deck já cobre os mesmos cantos) e, no fim do roteiro,
     devolve o clicker ao deck por `postMessage`. Receita:
     sistemas/gabaritos/planta-interativa.md

   ⚑ `viva` está na lista `em-imagem` do go() e na `G_TRAVA`: o fundo é visor,
     então o chrome inverte; e o slide não troca por toque nem por arrasto —
     dentro dele o dedo desenha e arrasta a planta. As setinhas seguem. */
/* ⚑ `semtopo:1` — QUANDO A PECA VIZINHA JA TEM CABECALHO. O `viva` nasceu
   para a planta interativa, que esconde o chrome dela e usa o do deck. O
   mapa de atuacao e outra coisa: ele e peca de tela cheia com cabecalho
   proprio completo — logotipo a esquerda, titulo e os tres contadores a
   direita. Sobrepor o chrome do deck poe logotipo em cima de logotipo e
   as bolinhas de secao em cima do titulo.

   Entao o topo do deck sai e o PE FICA: as setas e o contador de pranchas
   sao a unica forma de sair do slide, porque `viva` esta na `G_TRAVA` e o
   toque no palco nao avanca.

   O caminho completo seria dar ao modulo um modo `embutida`, como a planta
   tem — ele esconderia o proprio chrome e desviaria do nosso pela medida
   que ja chega por `postMessage`. Fica anotado: o modulo e mantido fora
   desta peca, e mexer nele e decisao do Michel.                        */
body.semtopo .chrome.topo{opacity:0;pointer-events:none}
.slide.g-viva{padding:0;overflow:hidden;background:var(--moldura)}
/* peça com a lupa aberta: a pílula sai de cena (ver "A LUPA DA PEÇA" no JS) */
body.lupa-viva .nav{opacity:0;pointer-events:none;transition:opacity .22s ease}
.g-viva .visor{position:absolute;inset:0}
.g-viva iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  opacity:0;transition:opacity .5s ease}
.g-viva.pronto iframe{opacity:1}
/* enquanto carrega: campo parado com o anel do resto da casa. São 6 MB de
   arquivo local — um piscar, mas um piscar que não pode ser tela preta. */
/* enquanto carrega: o MESMO indicador do `earth-3d` e do `modelo-3d` — anel
   girando para o que não se sabe medir. São 6 MB de arquivo local; costuma
   ser um piscar, mas um piscar que não pode ser campo vazio. Os seletores do
   indicador estão logo abaixo, no bloco dos visores, e ganharam `.g-viva`. */
/* slide `claro`: o campo de espera acompanha, senão o branco da peça entra
   depois de um retângulo escuro — um salto de cor no meio da fala. */
body.claro .g-viva,body.claro .g-viva .estado{background:var(--papel)}
body.claro .g-viva .estado b{color:var(--tinta)}
body.claro .g-viva .estado s{color:var(--tinta-60)}
body.claro .g-viva .anel{border-color:var(--tinta-15);border-top-color:var(--tinta)}
.g-viva .estado{position:absolute;inset:0;z-index:5;display:grid;place-content:center;
  justify-items:center;gap:.7em;text-align:center;padding:0 12%;
  background:var(--moldura);
  opacity:1;transition:opacity .45s ease;pointer-events:none}
.g-viva.pronto .estado{opacity:0}

/* ═══ visores — earth-3d e modelo-3d ═════════════════════════════════════
   Portados da EMEI Presidente Dutra em 03/09/2026 (módulos mestres:
   modulos/mapa-earth-3d.html e modulos/modelo-sketchup.html). Mesma
   gramática nos dois: scrim suave (véu, não tarja), véu de ativação por
   clique, trava de teclado enquanto o visor tem o ponteiro, indicador de
   carga com passo REAL e degradação explícita. O que o modelo tem a mais é
   a RESERVA — as imagens salvas na peça — porque modelo de projeto tem
   substituto útil sem rede, e satélite não.
   ⚑ Os dois estão na lista `em-imagem` do go(): é o que inverte o chrome.
   ⚑ earth-3d SÓ FUNCIONA POR LINK (a Maps API recusa file://). A chave vem
     de modulos/ms-maps-chave.js. Receita: sistemas/gabaritos/mapa-earth-3d.md
   ⚑ modelo-3d exige modelo PÚBLICO no 3D Warehouse. Receita: gabaritos/modelo.md
   ═══════════════════════════════════════════════════════════════════ */
.slide.g-earth-3d,.slide.g-modelo-3d{padding:0;overflow:hidden;background:var(--moldura)}
.g-earth-3d .visor,.g-modelo-3d .visor{position:absolute;inset:0}
.g-earth-3d gmp-map-3d{position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;filter:saturate(.86) contrast(1.03)}
.g-earth-3d.girando gmp-map-3d{pointer-events:auto}
/* o iframe nasce SEM src e sem ponteiro: `src` só na chegada (são 40 MB);
   ponteiro só depois do clique no véu, senão a roda do mouse dá zoom no
   modelo enquanto se tenta passar o slide. */
.g-modelo-3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  pointer-events:none;opacity:0;transition:opacity .6s ease;background:var(--moldura)}
.g-modelo-3d.pronto iframe{opacity:1}
.g-modelo-3d.girando iframe{pointer-events:auto}
.g-earth-3d .scrim,.g-modelo-3d .scrim{position:absolute;inset:0;pointer-events:none;
  transition:opacity .3s ease;
  background:linear-gradient(180deg,var(--tinta-60) 0,var(--tinta-25) 9%,transparent 24%,
    transparent 56%,var(--tinta-35) 88%,var(--tinta-60) 100%)}
.g-modelo-3d.girando .scrim{opacity:0}
.g-earth-3d .veu,.g-modelo-3d .veu{position:absolute;inset:0;display:grid;place-content:center;
  gap:.6em;text-align:center;background:var(--tinta-25);cursor:pointer;z-index:2;
  transition:opacity .3s ease}
.g-earth-3d.girando .veu,.g-modelo-3d.girando .veu{opacity:0;pointer-events:none}
.g-earth-3d .veu b,.g-modelo-3d .veu b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-earth-3d .veu s,.g-modelo-3d .veu s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--papel-60)}
/* ⚑ o SAIR salva a apresentação. Com o ponteiro dentro do visor o foco vai
   para o mapa ou para o documento do SketchUp e as setas do deck param de
   responder — o evento nem chega ao nosso script. Este botão é o único
   caminho de volta que não depende do teclado. */
.g-earth-3d .sair,.g-modelo-3d .sair{position:absolute;bottom:clamp(9px,1.4cqh,20px);left:50%;
  transform:translateX(-50%);display:none;align-items:center;z-index:4;cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-90);
  border:1px solid var(--papel-25);border-radius:999px;padding:.55em 1.2em}
.g-earth-3d.girando .sair,.g-modelo-3d.girando .sair{display:flex}
.g-earth-3d .rotulo,.g-modelo-3d .rotulo{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;pointer-events:none;
  max-width:min(46ch,60cqw);padding:clamp(14px,2cqh,30px) clamp(18px,1.9cqw,38px);
  background:var(--tinta-45);/* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid var(--papel-10);border-radius:3px;transition:opacity .3s ease}
.g-modelo-3d.girando .rotulo{opacity:0}

/* ⚑ RÓTULO COMPACTO — 11/09/2026, pedido do Michel no slide da localização:
   *"elimine o endereço. Vamos deixar onde a fazenda está. Embaixo você pode
   deixar aquele texto pequeno... essa caixa toda fica um pouco mais compacta
   no canto esquerdo inferior"*.
   Tirar o `lead` do deck.json já encolhe a caixa; isto aperta o resto —
   largura, respiro e corpo do h2 — para a caixa virar etiqueta e o visor
   ficar com a tela. Campo do slide, não padrão: peça que precise do
   endereço na tela continua sem declarar `compacto`. */
.g-earth-3d .rotulo.compacto,.g-modelo-3d .rotulo.compacto{
  max-width:min(32ch,42cqw);
  padding:clamp(10px,1.5cqh,20px) clamp(13px,1.4cqw,26px)}
.g-earth-3d .rotulo.compacto h2,.g-modelo-3d .rotulo.compacto h2{
  font-size:clamp(17px,2.6cqh,30px);line-height:1.06}
.g-earth-3d .rotulo.compacto .cap,.g-modelo-3d .rotulo.compacto .cap{
  margin-top:.7em;white-space:normal}

/* ⚑ O RÓTULO DO VISOR EM CELULAR — 03/09/2026, pedido do Michel:
   *"na versão móbile precisamos subir com essa caixa de texto, ou reduzir
   drasticamente a informação"*.
   MEDIDO num celular deitado antes de mexer: a caixa saía com 462 × 131 px,
   ou 36% da altura da tela a 800 × 360, e o teste automático confirmou que
   ela CRUZAVA o centro vertical — isto é, cobria justamente o lote de que
   o slide fala. No desktop a mesma caixa ocupa 23% e sobra tela.
   A escolha é a segunda que ele ofereceu, reduzir a informação, e não a
   primeira: subir a caixa só troca o que ela cobre — em vez do lote,
   cobriria as ruas do topo. Então em tela baixa sai o `lead` (a frase
   longa; o `h2` continua dizendo do que se trata), a caixa encolhe e se
   cola na faixa de baixo, liberando o centro.
   O `cap` FICA: em toque é ele que diz que o visor é interativo, e sem
   teclado ninguém descobre isso sozinho. */
@media (max-height:520px),(max-width:760px){
  .g-earth-3d .rotulo,.g-modelo-3d .rotulo,.g-mapa-2d .rotulo{
    bottom:calc(var(--bot) - clamp(10px,3cqh,26px));
    max-width:min(34ch,66cqw);
    padding:clamp(8px,1.4cqh,14px) clamp(11px,1.5cqw,18px)}
  .g-earth-3d .rotulo .lead,.g-modelo-3d .rotulo .lead,.g-mapa-2d .rotulo .lead{
    display:none}
  .g-earth-3d .rotulo h2,.g-modelo-3d .rotulo h2,.g-mapa-2d .rotulo h2{
    font-size:clamp(15px,4.2cqh,22px);margin-top:.16em}
}
.g-earth-3d .rotulo .kick,.g-modelo-3d .rotulo .kick{display:block;color:var(--papel-80);margin:0;
  font-size:var(--fs-cap);text-transform:uppercase}
.g-earth-3d .rotulo h2,.g-modelo-3d .rotulo h2{color:var(--papel);font-size:var(--fs-h);line-height:1.04;margin-top:.24em}
.g-earth-3d .rotulo .lead,.g-modelo-3d .rotulo .lead{color:var(--papel-90);font-size:var(--fs-body);margin-top:.55em;line-height:1.5}
.g-earth-3d .rotulo .cap,.g-modelo-3d .rotulo .cap{display:block;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.08em;text-transform:uppercase;
  color:var(--papel-60);margin-top:.9em}
/* os comandos que o slide expõe numa reunião. earth: ÓRBITA e RECENTRAR —
   navegar no 3d é fácil e voltar não; sem o recentrar a saída é recarregar
   a página na frente do cliente. modelo: RECOMEÇAR (recarrega o quadro; a
   câmera é do viewer da Trimble) e IMAGENS (a reserva, à mão). */
.g-earth-3d .cmd,.g-modelo-3d .cmd{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;
  display:flex;align-items:center;gap:clamp(6px,.6cqw,11px);transition:opacity .3s ease}
.g-modelo-3d.girando .cmd{opacity:.35}
.g-modelo-3d.girando .cmd:hover{opacity:1}
.g-earth-3d .cmd button,.g-modelo-3d .cmd button{cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-60);
  /* sem backdrop-filter: sobre mapa vivo o blur é recalculado a cada quadro (04/09/2026) */
  border:1px solid var(--papel-20);border-radius:999px;padding:.62em 1.2em;
  display:flex;align-items:center;gap:.55em;transition:border-color .2s,color .2s}
.g-earth-3d .cmd button:hover,.g-modelo-3d .cmd button:hover{border-color:var(--papel);color:#fff} /* #fff: pico de luz do hover, não é cor de marca */
.g-earth-3d .cmd svg,.g-modelo-3d .cmd svg{display:block;width:1em;height:1em;opacity:.7}
.g-earth-3d .orb i{display:block;width:7px;height:7px;border-radius:50%;
  background:var(--papel);opacity:.4;transition:opacity .2s}
.g-earth-3d.orbitando .orb i{opacity:1;animation:pulsa 1.9s ease-in-out infinite}
/* ── LIGAR E DESLIGAR OS NOMES — 11/09/2026, pedido do Michel.
   Mesmo indicador do orbitar, e ACESO quando os nomes estão na tela: numa
   reunião a pergunta é "estão ligados?", não "o que este botão faz?". O
   botão só existe no slide que declara `anot` ou `ruas`. */
.g-earth-3d .pin i{display:block;width:7px;height:7px;border-radius:50%;
  background:currentColor;opacity:.28;transition:opacity .2s ease}
.g-earth-3d.com-anot .pin i{opacity:1}
@keyframes pulsa{50%{opacity:.3}}
.g-earth-3d .rec.feito{border-color:var(--papel);color:#fff} /* #fff: pico de luz do "feito", não é cor de marca */
/* estado de carga e de falha. Enquanto carrega não há o que navegar: o
   convite do véu e os comandos ficam fora de cena. */
.g-earth-3d .estado,.g-modelo-3d .estado{position:absolute;inset:0;z-index:5;display:none;
  place-content:center;justify-items:center;text-align:center;padding:0 8cqw;
  gap:.9em;background:var(--moldura)}
.g-earth-3d.esperando .estado,.g-earth-3d.falhou .estado,
.g-modelo-3d.esperando .estado,.g-modelo-3d.falhou .estado{display:grid}
/* a legenda entra junto com o visor: enquanto carrega ou depois de falhar
   nao ha camada para ligar, e uma lista de camadas sobre a tela de estado e
   promessa que a peca nao pode cumprir. */
.g-earth-3d.esperando .legenda,.g-earth-3d.falhou .legenda,
.g-earth-3d.esperando .veu,.g-earth-3d.esperando .cmd,.g-earth-3d.falhou .veu,.g-earth-3d.falhou .cmd,
.g-modelo-3d.esperando .veu,.g-modelo-3d.esperando .cmd,.g-modelo-3d.esperando .rotulo,
.g-modelo-3d.falhou .veu{display:none}
.g-earth-3d .estado b,.g-modelo-3d .estado b,.g-viva .estado b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-earth-3d .estado span,.g-modelo-3d .estado span,.g-viva .estado s{
  display:block;text-decoration:none;font-size:var(--fs-body);color:var(--papel-60);line-height:1.6;
  max-width:56ch;margin:0 auto}
.g-earth-3d .estado code,.g-modelo-3d .estado code{font-family:var(--f-mono);font-size:.9em;color:var(--papel)}
/* o indicador de carga: barra com passo REAL (os degraus são nossos) e o
   anel girando para o que não se sabe medir. Pedido do Michel, 02/09. */
.g-earth-3d .carga,.g-modelo-3d .carga,.g-viva .carga{display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,2cqh,24px)}
.g-earth-3d.falhou .carga,.g-modelo-3d.falhou .carga{display:none}
.g-earth-3d .anel,.g-modelo-3d .anel,.g-viva .anel{width:clamp(30px,3.4cqw,46px);height:clamp(30px,3.4cqw,46px);
  border-radius:50%;border:2px solid var(--papel-15);border-top-color:var(--papel);
  animation:gira3d .85s linear infinite}
@keyframes gira3d{to{transform:rotate(360deg)}}
.g-earth-3d .barra,.g-modelo-3d .barra{width:clamp(150px,17cqw,240px);height:3px;border-radius:999px;
  background:var(--papel-10);overflow:hidden;position:relative}
.g-earth-3d .barra i,.g-modelo-3d .barra i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:var(--papel);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.g-earth-3d .passos,.g-modelo-3d .passos{font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.14em;text-transform:uppercase;color:var(--papel-45)}
@media (prefers-reduced-motion:reduce){.g-earth-3d .anel,.g-modelo-3d .anel,.g-viva .anel{animation:none}}

/* ══ A ANOTAÇÃO DENTRO DO VISOR 3D ═══════════════════════════════════════
   Rótulo de lote e nome de rua desenhados DENTRO da malha, não por cima
   dela. Medido em 02/09/2026 na bancada `modulos/ensaio-anotacoes-earth.html`,
   que continua publicada e é onde se ajusta sem republicar a peça.

   ⚑ A ROTA, e as três que não funcionam. A API `maps3d` não aceita DOM
   arbitrário num marcador: `Marker3DElement.append(<div>)` é RECUSADO
   ("The slotted content is not of type HTMLTemplateElement or PinElement")
   e a armadilha é que o nó FICA no DOM — dá para contá-lo e concluir que
   funcionou, sem nada desenhado. `<template>` é aceito e desenha nada.
   `PinElement` sai vermelho #EA4335 do Google mesmo declarando a nossa cor.
   O que funciona é `PopoverElement` com `positionAnchor` numa COORDENADA
   literal, sem marcador nenhum: aceita DOM arbitrário e desenha na cor da
   casa. Daí estas classes existirem — elas são o conteúdo do popover.

   ⚑ SEM `backdrop-filter` (regra 2 do DECK-MOTOR): sobre mapa que repinta a
   cada quadro o navegador recalcula o blur da região a cada quadro. Fundo
   opaco e sombra dão a mesma leitura por nada.

   Três pesos, e a hierarquia é o assunto: o lote do projeto manda, o
   vizinho é contexto, a rua é quase infraestrutura. */
.g-earth-3d .anot{font-family:var(--f-corpo);line-height:1.15;pointer-events:none;
  white-space:nowrap;border-radius:2px}
/* ⚑ FUNDO LEVEMENTE TRANSPARENTE — 11/09/2026, pedido do Michel: *"seria
   possível deixar o fundo dos pinos levemente transparente? eles ficam um
   pouquinho poluídos quando estão próximos um do outro"*.
   Uma peça com nove anotações num núcleo de 200 m tem caixas encostando em
   algum ângulo da órbita. Opaco, o amontoado vira parede; a 80% o telhado
   atravessa e o olho separa uma caixa da outra.
   O contorno COMPENSA o que a opacidade perdeu: sobre telhado claro uma
   caixa translúcida sem borda some. Daí a borda subir, e a sombra descer —
   sombra forte é o que mais suja quando as caixas se tocam.
   Não se vai abaixo de ~78%: o texto começa a disputar com a textura da
   malha, e o pino existe para ser lido de longe, numa sala. */
.g-earth-3d .anot.obra{background:color-mix(in srgb,var(--primaria) 82%,transparent);
  color:var(--papel);font-weight:600;
  font-size:clamp(12px,1.05cqw,16px);letter-spacing:-.01em;padding:.5em .9em;
  box-shadow:0 1px 9px var(--tinta-45);border:1px solid var(--papel-25)}
.g-earth-3d .anot.ctx{background:color-mix(in srgb,var(--papel) 78%,transparent);
  color:var(--tinta);font-weight:600;
  font-size:clamp(10.5px,.88cqw,13.5px);padding:.45em .8em;
  box-shadow:0 1px 7px var(--tinta-35);border:1px solid var(--tinta-20)}
/* ══ A CAMADA DO PROCESSO DO CAFÉ ════════════════════════════════════════
   Duas informações na mesma caixa, em cores diferentes, porque são coisas
   diferentes: ONDE se está (o número e o nome da parada, em Cal) e O QUE o
   café é naquele ponto (a etapa, em acento). Fonte do conteúdo: consulta ao
   João Piza, 18/09/2026, no Diário de bordo. */
/* ⚑ 20/09/2026 — A CAIXA VIROU BOLINHA. Sete paradas num nucleo de 800 m:
   em qualquer angulo da orbita duas caixas de texto se tocam, e o resolvedor
   de colisao so' sabia esconder uma. A bolinha com o numero quase nunca
   colide, e o texto aparece ao pousar o mouse. O numero sozinho tambem
   fecha a leitura com o croqui do processo, que e' numerado. */

<script>

/* ─── fundo morph pontilhado · núcleo ────────────────────────────────────────
   Preset "linha MS" (20/08/2026): serigrafia + paralaxe, contraste 0.65.
   Entrada em diagonal, ao estilo da vitrine, introduz a primeira peça.
   API: MSFundo.montar(canvas, imagens, opcoes?) → {entrada(), pausar(v), cor(o)}
   opcoes: {ink, paper, acc, scale, prep:false, sortear:true}.
   prep:false pula a auto-exposição em JS — use com imagem já corrigida no
   arquivo, que é o que permite carrossel de oito a dez peças sem travar.
   sortear embaralha a ordem na carga. cor() troca a paleta com interpolação. */
window.MSFundo=(function(){
const VS=`#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID==1 ? 3.0 : -1.0, gl_VertexID==2 ? 3.0 : -1.0);
  gl_Position = vec4(p,0.0,1.0);
}`;
const FS=`#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D uA,uB;
uniform vec2 uRes,uSA,uSB,uM;
uniform float uT,uTime,uAmp,uEdge,uDot,uAng,uAng2,uContrast,uGamma,uMode,uTrans,
              uGrain,uZoom,uAcc,uVig,uBleed,uFit,uCur,uMAmt,uMRad,uEnter;
uniform vec3 uInk,uPaper,uAccent;

float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.5);return fract(p.x*p.y*95.43);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float bayer(vec2 p){
  int x=int(mod(p.x,8.0)),y=int(mod(p.y,8.0));
  int m[64]=int[64](0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21);
  return (float(m[y*8+x])+0.5)/64.0;
}
// enquadra (contain ou sangria) e devolve luminância; uBleed vira linha em massa tonal
float lum(sampler2D t, vec2 imgSize, vec2 uv){
  float ca=uRes.x/uRes.y, ia=imgSize.x/imgSize.y;
  vec2 sc = uFit>0.5 ? (ca>ia ? vec2(1.0,ca/ia) : vec2(ia/ca,1.0))
                     : (ca>ia ? vec2(ia/ca,1.0) : vec2(1.0,ca/ia));
  vec2 q=(uv-0.5)/(sc*(uFit>0.5?1.0:0.86))+0.5;
  if(q.x<-0.05||q.x>1.05||q.y<-0.05||q.y>1.05) return 1.0;
  vec2 qq=vec2(clamp(q.x,0.0,1.0),1.0-clamp(q.y,0.0,1.0));
  vec4 c=mix(texture(t,qq),textureLod(t,qq,2.0+uBleed*4.5),uBleed);
  float l=mix(1.0, dot(c.rgb,vec3(0.299,0.587,0.114)), c.a);
  if(q.x<0.0||q.x>1.0||q.y<0.0||q.y>1.0) l=mix(1.0,l,uBleed*0.6);
  return l;
}
float cover(vec2 q,float cell,float r){          // cobertura de um ponto da trama
  vec2 g=mod(q,cell)-cell*0.5;
  return 1.0-smoothstep(-0.9,0.9,length(g)-r);
}

void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float br=sin(uTime*0.18)*0.5+0.5;
  uv=(uv-0.5)*(1.0-uZoom*br)+0.5+vec2(sin(uTime*0.07),cos(uTime*0.05))*uZoom*0.35;

  // ---- cursor ---------------------------------------------------------------
  float asp=uRes.x/uRes.y;
  vec2 mp=uM/uRes;
  vec2 dm=(uv-mp)*vec2(asp,1.0);
  float rr=length(dm)/(max(uMRad,1.0)/uRes.y);
  float fm=exp(-rr*rr*2.0)*uMAmt;
  float cellMod=1.0, angMod=0.0, glitch=0.0, light=1.0, sharp=0.0;
  vec2 pxA=vec2(0.0), pxB=vec2(0.0);
  if(uCur>0.5&&uCur<1.5){                                   // foco: resolve onde se olha
    cellMod=1.0-fm*0.45; sharp=fm*0.30;
  }else if(uCur>1.5&&uCur<2.5){                             // luz: claridade rasante
    float ring=exp(-pow(rr-1.35,2.0)*3.0)*uMAmt;
    light=1.0-fm*0.55+ring*0.20;
  }else if(uCur>2.5&&uCur<3.5){                             // paralaxe: as duas camadas
    /* as amplitudes trocam de papel ao longo da passagem: a que entra com 0.026
       termina em 0.012, que é exatamente o valor com que reaparece como camada A
       no ciclo seguinte. Sem isso há um salto a cada troca de peça.            */
    vec2 d=(mp-0.5)*uMAmt;
    pxA=d*mix(0.012,0.026,uT); pxB=d*mix(0.026,0.012,uT);
  }else if(uCur>3.5&&uCur<4.5){                             // ímã: a trama abre
    cellMod=1.0+fm*1.8; angMod=fm*30.0;
  }else if(uCur>4.5){                                       // quebra: fenda fina
    float t2=floor(uTime*7.0);
    float w2=(1.5+9.0*uMAmt)/uRes.x;
    float band=step(abs(uv.x-mp.x),w2);
    uv.y+=band*(hash(vec2(t2,7.0))-0.5)*0.10*uMAmt;
    float rowH=0.030;
    float row=floor((uv.y-mp.y)/rowH);
    float h=hash(vec2(row,t2));
    float tear=step(0.55,h)*step(abs(uv.y-mp.y),rowH*1.6)*step(abs(uv.x-mp.x),0.06+0.10*uMAmt);
    uv.x+=(h-0.5)*0.045*uMAmt*tear;
    glitch=max(band,tear*0.55);
    cellMod=1.0+band*0.6*uMAmt;
  }

  // ---- luminâncias das duas peças ------------------------------------------
  float t=uT;
  vec2 n=vec2(fbm(uv*2.6+uTime*0.03), fbm(uv*2.6+7.3-uTime*0.025))*2.0-1.0;
  float bump=sin(t*3.14159);
  vec2 dA=uv+pxA, dB=uv+pxB;
  if(uTrans<0.5){ dA+=n*uAmp*t*bump; dB-=n*uAmp*(1.0-t)*bump; }
  float a=clamp((lum(uA,uSA,dA)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float b=clamp((lum(uB,uSB,dB)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float vA=pow(1.0-a,uGamma), vB=pow(1.0-b,uGamma);

  // frente que varre da esquerda para a direita
  float soft=0.06+uEdge*0.55;
  float front=mix(-soft,1.0+soft,t);
  float w=clamp((front-uv.x+soft)/(2.0*soft),0.0,1.0);

  float cell=max(uDot*cellMod,2.0);
  vec2 p=gl_FragCoord.xy-0.5*uRes;
  vec2 q=rot(radians(uAng+angMod))*p;
  float v=0.0, ink=0.0, band=0.0;

  if(uTrans<0.5){                                  // morph — dissolução por ruído
    float th=mix(fbm(uv*7.5+31.7),vnoise(uv*uRes.x/26.0),0.35);
    float e=clamp(uEdge,0.02,1.0);
    float lo=th*(1.0-e);
    float k=smoothstep(lo,lo+e,t);
    v=mix(vA,vB,k);
    band=smoothstep(0.42,0.5,k)*(1.0-smoothstep(0.5,0.58,k));
  }else if(uTrans<1.5){                            // entrelaço — cada ponto escolhe um lado
    float own=step(hash(floor(q/cell)+0.5),w);
    v=mix(vA,vB,own);
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else if(uTrans<2.5){                            // serigrafia — duas telas, dois ângulos
    vec2 qB=rot(radians(uAng+angMod+uAng2))*p;
    float iA=cover(q ,cell,sqrt(max(vA*(1.0-w),0.0))*cell*0.70)*smoothstep(0.0,0.02,vA*(1.0-w));
    float iB=cover(qB,cell,sqrt(max(vB*w      ,0.0))*cell*0.70)*smoothstep(0.0,0.02,vB*w);
    ink=1.0-(1.0-iA)*(1.0-iB);
    v=vA*(1.0-w)+vB*w;
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else{                                           // maré — a massa do desenho conduz
    float th=mix(uv.x,1.0-vA,0.42);
    float k=smoothstep(th-soft,th+soft,front);
    v=mix(vA,vB,k);
    v*=1.0-0.30*exp(-pow((front-th)/soft,2.0)*2.0);
    band=exp(-pow((front-th)/soft,2.0)*2.0);
  }
  v*=light;

  if(uTrans>1.5&&uTrans<2.5){                      // serigrafia já montou a tinta
  }else if(uMode<0.5){ ink=cover(q,cell,sqrt(max(v,0.0))*cell*0.70); }
  else if(uMode<1.5){ ink=1.0-smoothstep(-0.8,0.8,abs(mod(q.y,cell)-cell*0.5)-v*cell*0.5); }
  else if(uMode<2.5){ ink=step(bayer(gl_FragCoord.xy/max(1.0,cell/6.0)),v); }
  else { ink=v; }
  ink*=smoothstep(0.0,0.05,v);

  /* ---- entrada diagonal: a trama nasce ao longo de uma reta inclinada ---- */
  float sx=uv.x+(uv.y-0.5)*0.26;                 // eixo da varredura, ~14° de inclinação
  float bandW=0.30;
  float fEnter=uEnter*(1.0+2.0*bandW)-bandW;
  float rev=clamp((fEnter-sx)/bandW+0.5,0.0,1.0);
  float fio=exp(-pow((sx-fEnter)/0.0045,2.0))*step(0.001,uEnter)*step(uEnter,0.999);
  ink*=rev; band=mix(band,0.0,1.0-rev);

  vec3 tinta=mix(uInk,uAccent,clamp(band,0.0,1.0)*uAcc);
  vec3 col=mix(uPaper,tinta,clamp(ink,0.0,1.0));
  col=mix(col,uAccent,clamp(fio,0.0,1.0)*0.85);
  col=mix(col,uAccent,glitch*0.12*uMAmt);
  col+= (hash(gl_FragCoord.xy+fract(uTime)*97.0)-0.5)*uGrain;
  float d=length((uv-0.5)*vec2(asp,1.0));
  col=mix(col,uPaper*0.96+uInk*0.04,smoothstep(0.42,0.95,d)*uVig);
  frag=vec4(col,1.0);
}`;

function montar(cv, IMGS, OPT){

  if(!gl) return {entrada(){},pausar(){}};
  function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
