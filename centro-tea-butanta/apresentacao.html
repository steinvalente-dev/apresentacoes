function ligaHover(root){
  const box=root.querySelector('#minfo'); if(!box)return;
  const base=box.innerHTML;
  let tmr;
  const pinta=html=>{box.classList.add('trocando');clearTimeout(tmr);
    tmr=setTimeout(()=>{box.innerHTML=html;box.classList.remove('trocando');},170);};
  const mostra=(n,p,d,f)=>{box.classList.remove('vazio');
    pinta((f?`<span class="mfoto"><img src="${f}" alt="${n}"></span>`:'')
      +`<span class="mtx"><span class="mn">${n}</span>${p?`<span class="mp">${p}</span>`:''}${d?`<span class="md">${d}</span>`:''}</span>`);};
  const limpa=()=>{box.classList.add('vazio');pinta(base);};
  const solta=()=>root.querySelectorAll('.pin.on,.raio.on,.lote.on').forEach(e=>e.classList.remove('on'));
  root.querySelectorAll('.lote').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');const i=+g.dataset.l,l=MAP.lotes[i];
      mostra(l.n,l.end,l.d, (typeof FOTO_LOTE!=='undefined'?FOTO_LOTE[i]:null)||null);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelectorAll('.pin').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');
      const i=+g.dataset.i,p=MAP.pts[i],rr=root.querySelector(`.raio[data-i="${i}"]`);
      if(rr)rr.classList.add('on');
      let d='';
      if(p.cred){
        const brl=v=>'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
        d=`${p.quem}. Categoria ${p.cat}, ${p.pts} pontos, `
          +`${p.pct!=null?p.pct.toString().replace('.',',')+'% de subvenção — ':''}`
          +`${brl(p.vl)} concedidos no chamamento ${p.cham}.`;
      }else{
        d=p.viz.length?'Credenciados no raio de 200 m: '+p.viz.map(([m,n])=>`${n} a ${m} m`).join(' · ')+'.':'Nenhum credenciado dentro de 200 m.';
        if(p.fora.length)d+=` O mais próximo fora do raio é ${p.fora[0][1]}, a ${p.fora[0][0]} m.`;
      }
      mostra(p.n,p.toq?`${p.pt} pontos de proximidade`:'projeto credenciado',d);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelector('.mapa').addEventListener('mouseleave',()=>{solta();limpa();});
  box.classList.add('vazio');
}
function isometrico(cena,esc){
  /* sobre a oliva a tinta some: o desenho troca de cor, nao de forma */
  const TI = esc ? 'var(--papel)' : 'var(--tinta)';
  const W=620,H=660,ux=0.866,uy=0.5;
  /* o viewBox sai do proprio desenho. Escrito a mao, ele decepava os dois
     ultimos predios da carteira toda vez que o espacamento mudava. */
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  const marca=(px,py)=>{if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;};
  const janelaIso=(padx,pady)=>{
    const x0=bx0-padx,y0=by0-pady,w=(bx1-bx0)+padx*2,h=(by1-by0)+pady*2;
    return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;};
  const S=1.16;const iso=(x,y,z)=>[300+(x-y)*ux*S,H-130-((x+y)*uy*.52*S)-z*S];
  const P=(a)=>a.map(p=>p.join(',')).join(' ');
  function caixa(cx,cy,w,d,pav,alt,rot,pal){
    /* pal: o prédio grande ficou fora dos cenários; entra só como escala */
    const o=pal?0.34:1, h=pav*alt,pts=[];
    const A=iso(cx,cy,0),Bp=iso(cx+w,cy,0),C=iso(cx+w,cy+d,0),D=iso(cx,cy+d,0);
    const A2=iso(cx,cy,h),B2=iso(cx+w,cy,h),C2=iso(cx+w,cy+d,h),D2=iso(cx,cy+d,h);
    /* o vertice mais proximo da camera e A (menor x+y). As duas faces visiveis
       sao as que encostam na aresta A-A2: a esquerda (A-D) e a direita (A-B).
       Antes desenhava-se B-C, que fica ESCONDIDA atras do solido, e a esquerda
       ficava vazada. Corrigido em 21/08/2026.                                */
    let g=`<polygon points="${P([A,D,D2,A2])}" fill="${TI}" fill-opacity="${(.17*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A,Bp,B2,A2])}" fill="${TI}" fill-opacity="${(.075*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A2,B2,C2,D2])}" fill="var(--acento)" fill-opacity="${(.26*o).toFixed(3)}" stroke="var(--acento)" stroke-width="1.2" stroke-opacity="${o}"/>`;
    /* aresta vertical da frente, marcada: e ela que le a altura */
    g+=`<line x1="${A[0]}" y1="${A[1]}" x2="${A2[0]}" y2="${A2[1]}" stroke="${TI}" stroke-width="1.1" stroke-opacity="${(.55*o).toFixed(2)}"/>`;
    for(let i=1;i<pav;i++){const l=iso(cx,cy+d,i*alt),m=iso(cx,cy,i*alt),o=iso(cx+w,cy,i*alt);
      g+=`<polyline points="${P([l,m,o])}" fill="none" stroke="${TI}" stroke-width=".5" stroke-opacity="${(.3*o).toFixed(2)}"/>`;}
    [A,Bp,C,D,A2,B2,C2,D2].forEach(q=>marca(q[0],q[1]));
    const top=iso(cx+w/2,cy+d/2,h);
    if(rot){ const lw=rot.length*4.6; marca(top[0]-lw,top[1]-46); marca(top[0]+lw,top[1]-30); }
    /* 34 px acima da cumeeira: com 16 o rotulo encostava no telhado */
    g+=`<text x="${top[0]}" y="${top[1]-34}" text-anchor="middle" font-family="var(--f-mono)" font-style="italic" font-size="15" fill="${TI}" opacity="${pal?0.55:1}">${rot}</text>`;
    return g;
  }
  function arvore(x,y){const b=iso(x,y,0),t=iso(x,y,26);
    return `<line x1="${b[0]}" y1="${b[1]}" x2="${t[0]}" y2="${t[1]}" stroke="var(--primaria)" stroke-width="1.6"/><circle cx="${t[0]}" cy="${t[1]}" r="9" fill="var(--primaria)" fill-opacity=".45" stroke="var(--primaria)" stroke-width="1"/>`;}
  function carro(x,y){const a=iso(x,y,0),b=iso(x+16,y,0),c=iso(x+16,y+8,0),d=iso(x,y+8,0),
    a2=iso(x,y,9),b2=iso(x+16,y,9),c2=iso(x+16,y+8,9),d2=iso(x,y+8,9);
    return `<polygon points="${P([a,b,c,d])}" fill="${TI}" fill-opacity=".1"/><polygon points="${P([a2,b2,c2,d2])}" fill="${TI}" fill-opacity=".3" stroke="${TI}" stroke-width=".8"/><polygon points="${P([b,c,c2,b2])}" fill="${TI}" fill-opacity=".2" stroke="${TI}" stroke-width=".8"/>`;}
  let s=`<svg viewBox="55 66 545 596" role="img" aria-label="Escala comparativa de porte">`;
  /* a fileira da carteira e mais longa que a do porte: o chao e a rua
     acompanham, senao os dois ultimos predios ficam sem calcada */
  const XM = cena==='portfolio' ? 500 : 330;
  const g0=iso(-34,40,0),g1=iso(XM,40,0),g2=iso(XM,200,0),g3=iso(-34,200,0);
  s+=`<polygon points="${P([g0,g1,g2,g3])}" fill="${TI}" fill-opacity=".045"/>`;
  const r0=iso(-34,52,0),r1=iso(XM,52,0),r2=iso(XM,80,0),r3=iso(-34,80,0);
  s+=`<polygon points="${P([r0,r1,r2,r3])}" fill="${TI}" fill-opacity=".1"/>`;
  if(cena==='portfolio'){
    /* a carteira desenhada: 4 pequenos e 3 medios, na mesma escala do slide
       do porte. E o mesmo desenho, para o olho reconhecer o tamanho.     */
    /* tudo numa fileira só: com os pequenos atrás dos médios a conta não
       se lia. Agora é da esquerda para a direita, 4 + 3, mesma linha. */
    /* mais respiro entre os volumes: colados, a conta de 4 + 3 nao se lia */
    let x=0;
    for(let i=0;i<4;i++){ s+=caixa(x,96,38,34,5,10,i===1?'4 × pequeno':''); x+=62; }
    x+=34;
    for(let i=0;i<3;i++){ s+=caixa(x,96,52,42,12,10,i===1?'3 × médio':''); x+=78; }
    /* a arvore acompanha a fileira inteira, ate o ultimo predio */
    for(let v=-18;v<=x-30;v+=56) s+=arvore(v,66);
    const vb=janelaIso(26,22);
    const cy2=(by1+26);
    s+=`<text x="${((bx0+bx1)/2).toFixed(1)}" y="${(cy2+16).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="13" fill="${TI}" opacity=".5">15.600 m² construídos · mesma escala do slide do porte</text>`;
    marca(bx0,cy2+22);marca(bx1,cy2+22);
    return s.replace('viewBox="55 66 545 596"','viewBox="'+janelaIso(26,22)+'"')+`</svg>`;
  }
  s+=caixa(0,96,52,44,5,10,'pequeno · 5 pav');
  s+=caixa(112,96,62,50,12,10,'médio · 12 pav');
  s+=caixa(238,96,72,56,24,10,'grande · 24 pav','pal');
  [ -18, 46, 100, 160, 216, 288 ].forEach(x=>{s+=arvore(x,66);});
  s+=carro(56,60); s+=carro(196,60);
  s+=`<text x="${W/2}" y="${H-16}" text-anchor="middle" font-family="var(--f-mono)" font-size="14" fill="${TI}" opacity=".55">escala comparativa · pé-direito de 3 m</text>`;
  return s+`</svg>`;
}

{"g":"tempo","kick":"o lugar no tempo","cobre":640,"de":1925,"ate":2026,"items":[{"ano":"1930","src":"img/tempo-1930.jpg","ficha":"Levantamento Sara Brasil · 1930 · carta","t":"Sara Brasil: o sítio antes de tudo","cap":"Chácara rural na divisa do município. O córrego Charco Grande corta o terreno e a mata ocupa o que hoje é o parque. Não há uma construção sequer no perímetro."},{"ano":"1940","x":1940,"ficha":"Foto aérea · 1940 · a baixar","t":"Levantamento a incorporar","vazio":"Foto aérea 1940 · quadrícula FM5-019 · a baixar no GeoSampa"},{"ano":"1954","x":1954,"ficha":"Foto aérea · 1954 · a baixar","t":"Levantamento a incorporar","vazio":"Foto aérea 1954 · quadrícula FX03-173 · a baixar no GeoSampa"},{"ano":"s/d","x":1962,"src":"img/tempo-vasp.jpg","ficha":"Carta Vasp-Cruzeiro · <span class=\"pend\">sem data no metadado — confirmar no DPH<\/span>","t":"Vasp-Cruzeiro: a era hípica desenhada","cap":"A pista oval de treino e as duas fileiras de cocheiras aparecem com todos os módulos. É a única peça que registra o conjunto em pleno funcionamento — e a borda esquerda está cortada no fim do mosaico."},{"ano":"1988","src":"img/tempo-1988.jpg","ficha":"Folhas do Livro da Vegetação · 1988 · carta","t":"Livro da Vegetação: o miolo limpo","cap":"A carta registra a massa verde apenas no perímetro do conjunto. Entre os dois agrupamentos de edificações não há arborização mapeada. É o ponto de partida do argumento."},{"ano":"1996","x":1996,"ficha":"Foto aérea · 1994/1996 · a baixar","t":"Levantamento a incorporar","vazio":"Foto aérea 1994/1996 · a baixar no GeoSampa"},{"ano":"2001","x":2001,"ficha":"Foto aérea · 2000/2001 · a baixar","t":"Levantamento a incorporar","vazio":"Fotos aéreas 2000 e 2001 · a baixar no GeoSampa"},{"ano":"2004","src":"img/tempo-2004.jpg","ficha":"Ortofoto MDC · 2004 · 1:1.000","t":"A alameda ainda aberta","cap":"Dezesseis anos depois, a alameda central entre os dois agrupamentos continua livre. Telhados íntegros, perímetro arborizado, miolo sem nada."},{"ano":"2017","src":"img/tempo-2017.jpg","ficha":"Ortofoto PMD · 2017","t":"As primeiras árvores no miolo","cap":"Aqui começam a aparecer, esparsas, as árvores entre as fileiras. Nenhuma plantada por projeto: são espontâneas, nascidas da ausência de manejo depois do fim da atividade hípica."},{"ano":"2020","src":"img/tempo-2020.jpg","ficha":"Ortofoto · 2020 · 10 cm/px","t":"O miolo tomado","cap":"Em três anos a alameda fecha. As copas encostam nos telhados e passam a representar risco direto sobre o bem tombado. É o estado que o projeto encontra."}]},

{"g":"lista","largo":1,"kick":"o que o lugar oferece","t":"qualidades e oportunidades","itens":[["01","<b>Sequência pronta.<\/b> Os braços longilíneos são percurso linear e previsível, sem bifurcação."],["02","<b>Compartimentação pronta.<\/b> A malha de baias está na escala do atendimento em grupo pequeno."],["03","<b>Arvoredo maduro.<\/b> Estímulo natural é regulador, e não se planta em dois anos."],["04","<b>Endereço com história.<\/b> Um bem ocioso volta à vida pública."]]},
{"g":"lista","largo":1,"kick":"o que o lugar impõe","t":"desafios","itens":[["01","<b>Geometria restritiva.<\/b> Espaços estreitos e alongados; na origem, longos corredores. Condiciona tudo que peça vão livre."],["02","<b>Arborização em posição de risco.<\/b> Exemplares encostados no beiral, com galhos sobre a estrutura do telhado. Risco de dano ao bem e de acidente."],["03","<b>Acústica.<\/b> Pé-direito alto, superfície dura e vão contínuo produzem reverberação longa — o risco sensorial mais sério do conjunto."]]},
{"g":"lista","largo":1,"kick":"o que o tombamento permite","t":"a proteção como liberdade","itens":[["01","<b>A proteção recai sobre as fachadas.<\/b> As características arquitetônicas externas são o objeto do tombamento."],["02","<b>O interior está livre de obrigação de preservação.<\/b> A reorganização interna é possível — e necessária para gerar os salões amplos."],["03","<b>A área livre do parque dispensa análise prévia.<\/b> O que exige vão grande encontra lugar sem passar pelo rito."],["04","<b>O que se altera deixa testemunho.<\/b> A própria resolução exige preservar o traço do elemento original — é a base da intervenção legível."]]},

{"g":"confronto","kick":"a resposta, em área","t":"o mesmo programa, dois lugares","lados":[{"rot":"o projeto que não avançou","nm":"TEA Oeste · Butantã","src":"img/implantacao-tea-oeste.jpg","alt":"Implantação do TEA Oeste, com as áreas úteis destacadas","linhas":[["ambientes","2.556,55 m²"],["circulação","1.543,24 m²"]],"total":["área construída","4.099,79 m²"]},{"rot":"a nossa proposta","nm":"Chácara do Jockey","src":"img/implantacao-jockey.jpg","linhas":[["ambientes","a confirmar"],["circulação","a confirmar"]],"total":["área construída","a confirmar"],"alt":"Implantação da proposta na Chácara do Jockey, com as áreas úteis e o segundo pavimento destacados"}],"nota":"Área construída maior não é mais programa: <b>1.543 m², 38% do total<\/b>, são circulação. O termo de referência pede 4.684 m²."},
{"g":"lista","largo":1,"kick":"a resposta","t":"cabe, e cumpre","itens":[["01","<b>Cabe em área.<\/b> O programa útil do modelo entra no conjunto existente."],["02","<b>Cumpre todos os papéis.<\/b> Atendimento, cultura, esporte, autonomia e acolhimento de famílias."],["03","<b>E ganha o que terreno vazio não dá.<\/b> Arvoredo maduro, escala construída e história."]]},

{"g":"lista","largo":1,"kick":"as camadas","t":"as camadas · do conjunto ao partido","itens":[["01","<b>O conjunto hoje.<\/b> A planta como ela é."],["02","<b>Vocação dos espaços.<\/b> Que uso cada braço pede, pelo que já é."],["03","<b>Circulação solicitada.<\/b> Os fluxos que o termo de referência determina."],["04","<b>Circulação pretendida.<\/b> O que propomos — e é daqui que decorre o resto."],["05","<b>Acessos separados.<\/b> Serviço, visitantes e usuários, com chegada de van pela frente."]]},

/* ─── aviso: o slide que diz o que está errado ────────────────────────────
   03/09/2026. Gabarito desconhecido ou campo obrigatório ausente vira um
   slide hachurado com o diagnóstico, e o mesmo texto vai ao console como
   console.error (para o build barrar a peça). Antes,
   o primeiro sumia em silêncio e o segundo escrevia `undefined` na tela ou
   derrubava o deck inteiro (`cur is not defined`).                       */
function aviso(s,titulo,nota){
  const limpo=x=>String(x).replace(/<[^>]+>/g,'');
  console.error('deck · '+limpo(titulo)+(nota?' — '+limpo(nota):''));
  return `<div class="vazio aviso rev"><div class="vmarca">_</div>`
    + `<h2>${titulo}</h2>`
    + (s.t?`<p class="vsub">${s.t}</p>`:'')
    + (nota?`<p class="vnota">${nota}</p>`:'')+`</div>`;
}
/* campos sem os quais o gabarito não renderiza. `cols` é reservado: quem o

const EXIGE={
  duo:['figs','leg'], tabela:['cols','linhas'], porte:['cols','linhas'],
  lista:['itens'], fim:['itens'], sumario:['itens'], trio:['itens'],
  jogadas:['itens'], fotos:['itens'], unit:['cards'], players:['casas'],
  conceitos:['itens'], confronto:['lados'],

  sequencia:['items'], tempo:['items']
  /* `meia` sai do EXIGE em 30/10/2026: passou a aceitar `src` OU `imgs`

};
/* bloco de marca antigo, sem a linha UNDERSCORE: vale o padrão da casa (ligado) */
const US=(typeof UNDERSCORE==='undefined')?true:!!UNDERSCORE;
function tpl(s){
  const faltam=(EXIGE[s.g]||[]).filter(c=>s[c]==null);

  const notaHTML=(n)=>{ if(!n) return '';

                   +`<span class="vv">${RS(l.total[1])}</span></div>`:'');
      return `<div class="lado">`
        + (l.rot?`<div class="rot">${l.rot}</div>`:'')
        + (l.nm?`<div class="nm">${RS(l.nm)}</div>`:'')
        + `<figure class="fig">${fig}</figure>`
        + (qd?`<div class="qd">${qd}</div>`:'')
        + `</div>`;
    }).join('');
    return `<div class="wrap">${k}${t}${sub}<div class="conf rev">${lados}</div>`
      + (s.nota?notaHTML(s.nota).replace('class="notaN"','class="notaN rev"'):'')+`</div>`;
  }
  if(s.g==='conceitos'){
    const li=(s.itens||[]).map((c,i)=>{
      const ims=Array.isArray(c.imgs)&&c.imgs.length;
      const miolo = ims
        ? `<div class="full">`+c.imgs.map((src,k)=>`<img decoding="async" class="${k===0?'on':''}" src="${IMG[src]||src}" alt="">`).join('')+`</div>`
        : `<div class="full"><div class="vazio">${c.slot||'slot de imagem'}</div></div>`;
      return `<li class="cnc passo">`
        + `<figure class="disco">${miolo}<span class="nn">${String(i+1).padStart(2,'0')}</span></figure>`
        + `<span class="q">${RS(c.q||'')}</span>`
        + `<span class="tx">${c.x||''}</span></li>`;
    }).join('');
    return `<div class="wrap">${k}${t}${sub}<ol class="cncs">${li}</ol></div>`;
  }
  if(s.g==='trio') return `<div class="wrap">${k}${t}${sub}<ol class="trio">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='lista'||s.g==='fim') return `<div class="wrap${s.largo?' largo':''}">${k}${pre}${t}${sub}<ol class="lista${s.largo?' largo':''}">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='escolha'){
    /* A BIFURCAÇÃO. Cada opção declara `para` com o NOME de um gabarito, e
       o motor procura o próximo slide daquele gabarito — nunca índice. */
    const o=(s.opcoes||[]).map(op=>
      `<button class="pill" type="button" data-para="${op.para||''}"`
      + (op.ir!=null?` data-ir="${op.ir}"`:'') + `>`
      + `<b>${op.rot||''}</b>`
      + (op.sub?`<s>${op.sub}</s>`:'') + `</button>`).join('');
    return `<div class="wrap">${k}${t}${sub}<div class="opcoes rev">${o}</div></div>`;
  }
  if(s.g==='galeria'){
    /* MOSAICO + LUPA. `fotos:[{src,rot,cap}]`.
       `data-src`: as miniaturas entram quando o slide chega, pelo
       __msPuxa() — seis por galeria, e sem isto as vinte e quatro entrariam
       na carga. A lupa recebe o `src` no clique, da miniatura já baixada:
       é o mesmo arquivo, então não há segunda carga. */
    const F=s.fotos||[];
    const tij=F.map((f,i)=>
      `<button class="tijolo" type="button" data-i="${i}" data-cap="${(f.cap||'').replace(/"/g,'&quot;')}" data-rot="${(f.rot||'').replace(/"/g,'&quot;')}">`
      + (f.src
          ? `<img decoding="async" data-src="${f.src}" alt="${(f.rot||f.cap||'').replace(/"/g,'&quot;')}">`
          : `<div class="slot"><u>_</u><b>${f.rot||'vista'}</b></div>`)
      + (f.rot?`<span class="tlbl">${f.rot}</span>`:'')
      + `</button>`).join('');
    return `<div class="galtopo">${k}${t}${sub}</div>`
      + `<div class="mosaico rev">${tij}</div>`
      + `<div class="lupa">`
      +   `<div class="lph"><img alt=""></div>`
      +   `<div class="lconta"></div>`
      +   `<div class="lupaov"><h3></h3><span></span></div>`
      +   `<button class="lseta lant" type="button" aria-label="vista anterior">&#8249;</button>`
      +   `<button class="lseta lpro" type="button" aria-label="próxima vista">&#8250;</button>`
      +   `<button class="fechar" type="button" aria-label="fechar a imagem">&#10005;</button>`
      + `</div>`;
  }
  if(s.g==='cheia'){
    /* render em sangria total. Ver sistemas/gabaritos/render-cheia.md */
    const img = s.src
      /* `data-src`, não `src`: o render entra quando o slide chega (e o
         seguinte), pelo __msPuxa(). Vale para base64 e para arquivo ao lado. */
      ? `<img decoding="async" data-src="${s.src}" alt="${(s.cap||'').replace(/"/g,'&quot;')}">`
      : `<div class="slot"><u>_</u><b>${s.lbl||'render'}</b><s>16:9 · sangria total</s></div>`;
    /* `abre`: chip para uma peca que mora ao lado, na mesma pasta. Ver
       "CHIP `abre`" no CSS — ele fica FORA do `.ov` de proposito. */
    const ab = s.abre && s.abre.href
      ? `<a class="abrir" href="${s.abre.href}" target="_blank" rel="noopener">`
        + `<b>${s.abre.rot||'abrir'}</b>`
        + (s.abre.sub?`<s>${s.abre.sub}</s>`:'') + `</a>`
      : '';
    return `<div class="full"><div class="ph">${img}</div></div>`
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>` + ab;
  }
  if(s.g==='video'){
    /* `vsrc` chega como data-URI de video, posto pelo montar.py. Sem ele o
       slide mostra o slot, como qualquer gabarito de imagem. */
    const F = s.vsrc ? (Array.isArray(s.vsrc)?s.vsrc:[s.vsrc]) : [];
    /* ⚑ 16/09/2026: `vsrc` pode chegar como data-URI (peca embutida) OU como
       caminho `img/x.webm` (peca em modo pasta — o montar passou a escrever
       video ao lado). O slice do data-URI devolvia lixo no caminho, e
       `type` errado faz o navegador descartar a fonte sem nem tentar. */
    const tipo = u => u.startsWith('data:') ? (u.slice(5, u.indexOf(';')) || 'video/mp4')
                    : (/\.webm$/i.test(u) ? 'video/webm' : 'video/mp4');
    const v = F.length
      ? `<video class="vid" playsinline muted loop preload="none">`
        + F.map(u=>`<source src="${u}" type="${tipo(u)}">`).join('') + `</video>`
      : `<div class="slot"><b>${s.lbl||'video'}</b><s>16:9 - sangria total</s></div>`;
    return `<div class="full">${v}</div>`
      + (F.length?`<div class="vcmd"><button class="vpp" type="button"><i></i>pausar</button></div>`:'')
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>`;
  }
  if(s.g==='carrossel'){
    const L = s.imgs||[];
    const im = L.length
      ? L.map((src,i)=>`<img decoding="async" class="${i===0?'on':''}" src="${src}" alt="">`).join('')
      : `<div class="slot"><b>${s.lbl||'desenhos'}</b></div>`;
    const pts = L.map((_,i)=>`<u class="${i===0?'on':''}"></u>`).join('');
    return `<div class="full">${im}</div>`
      + (L.length>1?`<div class="cont-c">${pts}</div>`:'')
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>`;
  }
  if(s.g==='logo'){
    /* o video usa a MESMA classe `vid` do gabarito `video`: assim o MSVideo
       cuida de tocar ao chegar e parar ao sair, sem um segundo relogio. */
    const F = s.vsrc ? (Array.isArray(s.vsrc)?s.vsrc:[s.vsrc]) : [];
    /* ⚑ 16/09/2026: `vsrc` pode chegar como data-URI (peca embutida) OU como
       caminho `img/x.webm` (peca em modo pasta — o montar passou a escrever
       video ao lado). O slice do data-URI devolvia lixo no caminho, e
       `type` errado faz o navegador descartar a fonte sem nem tentar. */
    const tipo = u => u.startsWith('data:') ? (u.slice(5, u.indexOf(';')) || 'video/mp4')
                    : (/\.webm$/i.test(u) ? 'video/webm' : 'video/mp4');
    const fundo = F.length
      ? `<video class="vid" playsinline muted loop preload="none">`
        + F.map(u=>`<source src="${u}" type="${tipo(u)}">`).join('') + `</video>`
      : (s.fundo?`<img src="${s.fundo}" alt="">`:'');
    return `<div class="bleed">${fundo}</div>`
      + `<div class="logowrap">`
      /* o `ante` e o `dep` esperam junto: `--i` e' o mesmo relogio de todo
         item `rev` do motor, entao nao ha mecanismo novo aqui. */
      +   (s.ante?`<div class="ante rev" style="--i:52">${s.ante}</div>`:'')
      +   (s.marcasvg?`<div class="lock viva">${s.marcasvg}</div>`
          : s.marca?`<div class="lock"><img src="${s.marca}" alt="${(s.alt||'').replace(/"/g,'&quot;')}"></div>`
                  :`<div class="slot">marca</div>`)
      +   (s.dep?`<p class="dep rev" style="--i:148">${s.dep}</p>`:'')
      + `</div>`;
  }
  if(s.g==='duo'){
    const RES=IMG;
    /* o slot so aparece se a imagem falhar — antes ele ficava por cima da foto */
    const f=s.figs.map(([tag,src,cap,cl])=>`<div class="dfig ${cl}"><img src="${RES[src]||src}" alt="${cap}" onerror="const p=this.parentNode;this.remove();p.classList.add('semimg')"><span class="tag">${tag}</span><div class="slot"><b>slot de imagem</b><span>${cap}</span></div><span class="dcap">${cap}</span></div>`).join('');
    return `<div class="wrap" style="max-width:none">${k}${t}${sub}<div class="dcols${s.alto?' alto':''} rev">${f}</div><p class="dleg rev">${s.leg}</p></div>`;
  }
  if(s.g==='meia'){
    const ests=(Array.isArray(s.estados)&&s.estados.length)?s.estados:null;
    if(!s.src && !(Array.isArray(s.imgs)&&s.imgs.length))
      return aviso(s,'gabarito meia: falta <code>src</code> ou <code>imgs</code>',
        'formato de cada campo em sistemas/DECK-MONTAR.md');
    /* `estados`: a metade direita fica parada e so a coluna da esquerda troca,
       um clique por estado. Cabecalho e texto no MESMO `.passo` — ver o bloco
       `meia` com ESTADOS no CSS. O primeiro nao e passo: e o estado de chegada. */
    /* `mosaico:1`: a metade direita vira tres fitas verticais. As imagens
       se repartem em volta (1,4,7… / 2,5,8… / 3,6,9…) e nao em blocos, para
       que fotos vizinhas na lista nao caiam lado a lado na mesma altura.
       Cada fita traz a sua lista DUAS vezes — ver o bloco MOSAICO no CSS. */
    const mos=()=>{
      const im=s.imgs||[], cols=[[],[],[]];
      im.forEach((src,i)=>cols[i%3].push(src));
      return `<div class="mos">`+cols.map(c=>`<div class="col"><div class="fita">`
        + c.concat(c).map(src=>`<img decoding="async" loading="lazy" src="${IMG[src]||src}" alt="">`).join('')
        + `</div></div>`).join('')+`</div>`;
    };
    const mesq=(e)=>((e.src && Array.isArray(s.imgs) && s.imgs.length)
            ? `<img class="mfigesq" src="${IMG[e.src]||e.src}" alt="${(e.leg||e.t||'').replace(/"/g,'&quot;')}">`
            : '')+`${e.cap||''}`;
    return `<div class="wrap">${k}${t}${sub}<div class="meia${s.largo?' largo':''}${s.sangra?' sangra':''}${s.espelho?' espelho':''}">`
      + (ests
          ? `<div class="mtx estados rev" style="--i:2">`
            + ests.map((e,i)=>`<div class="mest${i?' passo':''}${e.servicos?' servicos':''}${e.serif?' serif':''}${e.dados?' dados':''}${e.manchete?' manchete':''}">`
                + (e.lk&&typeof LOGO_CANTO==='object'&&LOGO_CANTO.svg
                    ? `<span class="lk">${LOGO_CANTO.svg}</span>` : '')
                + (e.kick?`<div class="kick">${e.kick}</div>`:'')
                + (e.t?`<h1 class="big">${RS(e.t)}</h1>`:'')
                + (e.lead?`<span class="lead">${e.lead}</span>`:'')
                + mesq(e)
                + ((Array.isArray(e.linha)&&e.linha.length)
                    ? `<ul class="tl">`+e.linha.map(([a,x],j)=>
                        `<li style="--tli:${j}"><span class="an" style="--tli:${j}">${a}</span>`
                        + `<span class="mk" style="--tli:${j}">${x}</span></li>`).join('')+`</ul>`
                    : '')
                + (e.botao
                    ? `<a class="bt" href="${e.botao.url}" target="_blank" rel="noopener"`
                      + ` onclick="event.stopPropagation()">${e.botao.t}`
                      + `<i class="sq">&#8594;</i></a>` : '')
              + `</div>`).join('')
            + `</div>`
          : `<div class="mtx rev" style="--i:2">`
            +   ((s.src && Array.isArray(s.imgs) && s.imgs.length)
                  ? `<img class="mfigesq" src="${IMG[s.src]||s.src}" alt="${(s.leg||s.t||'').replace(/"/g,'&quot;')}">`
                  : '')
            +   `${s.cap||''}</div>`)
      + `<div class="mfig rev" style="--i:6">`
      +   (s.mosaico ? mos()
          : Array.isArray(s.imgs)&&s.imgs.length
            ? `<div class="full">`
              + s.imgs.map((src,i)=>`<img decoding="async" class="${i===0?'on':''}" src="${IMG[src]||src}" alt="">`).join('')
              + `</div>`
              + (Array.isArray(s.legs)&&s.legs.length
                   ? `<div class="legs">`+s.imgs.map((_,i)=>`<span class="${i===0?'on':''}">${s.legs[i]||''}</span>`).join('')+`</div>`
                   : '')
              + (s.imgs.length>1?`<div class="cont-c">`+s.imgs.map((_,i)=>`<u class="${i===0?'on':''}"></u>`).join('')+`</div>`:'')
            : `<img src="${IMG[s.src]||s.src}" alt="${(s.leg||s.t||'').replace(/"/g,'&quot;')}"`
              + ` onerror="this.dataset.err=1">`)
      +   (s.leg?`<span class="mleg">${s.leg}</span>`:'')
      + `</div></div></div>`;
  }
  if(s.g==='sequencia'){
    /* a primeira etapa nao e' `.passo`: e' o estado de chegada do slide */
    const it=s.items||[], N=String(it.length).padStart(2,'0');
    const et=it.map((x,i)=>`<div class="seq-etapa${i?' passo':''}">`
      + `<span class="seq-cap">`
      +   `<span class="sq">${String(i+1).padStart(2,'0')} / ${N}</span>`
      +   `<span class="st">${x.t||''}</span>`
      +   `<span class="sd">${x.cap||''}</span></span>`
      + `<img src="${IMG[x.src]||x.src}" alt="${(x.t||'').replace(/"/g,'&quot;')}"`
      +   ` onerror="this.dataset.err=1"></div>`).join('');
    return `<div class="wrap">${k}${t}${sub}<div class="seq">${et}`
      + `<span class="seqnav"><button type="button" data-sq="-1" aria-label="Etapa anterior">&#9664;</button>`
      + `<b></b>`
      + `<button type="button" data-sq="1" aria-label="Pr&#243;xima etapa">&#9654;</button></span>`
      + `</div></div>`;
  }
  /* ⚑ `tempo` usa `items` (inglês), como `sequencia` e `prancha`: é a chave
     que o `coleta_imagens` do montar.py já varre atrás de `src`. Chamar de
     `itens` obrigaria a mexer no montador — e a imagem entraria crua. */
  if(s.g==='tempo'){
    const it=s.items||[], de=+s.de||1925, ate=+s.ate||2026;
    const pos=v=>((v-de)/(ate-de)*100);
    const ondeX=x=>(x.x!=null?+x.x:(parseInt(x.ano,10)||de));
    const imgs=it.map((x,i)=>x.src
      ? `<img decoding="async" data-i="${i}" src="${IMG[x.src]||x.src}"`
        + ` alt="${(x.t||x.ano||'').replace(/"/g,'&quot;')}" onerror="this.dataset.err=1">`
      : '').join('');
    const marcos=it.map((x,i)=>
      `<button type="button" class="tm ${x.src?'tem':'falta'}${i%2?' alto':''}"`
      + ` data-i="${i}" style="left:${pos(ondeX(x)).toFixed(3)}%"`
      + ` aria-label="${(x.ano||'').replace(/"/g,'&quot;')}"><i></i><b>${x.ano||''}</b></button>`
    ).join('');
    return `<div class="tvista">`
      +   `<div class="tcam">${imgs}</div>`
      +   `<div class="tvazio"><div><b></b><span></span></div></div>`
      +   `<div class="tveu a"></div><div class="tveu b"></div>`
      +   `<div class="tesc"><u></u><span></span></div>`
      +   `<div class="tzoom">`
      +     `<button type="button" data-t="rev">&#8634; rever do in&iacute;cio</button>`
      +     `<button type="button" data-t="menos" aria-label="Afastar">&minus;</button>`
      +     `<button type="button" data-t="mais" aria-label="Aproximar">+</button>`
      +     `<button type="button" data-t="ajustar">ajustar</button>`
      +   `</div>`
      + `</div>`
      + `<div class="ttx">`
      +   `<div class="talto rev" style="--i:1">${k}<h1 class="tano"></h1><div class="tficha"></div></div>`
      +   `<div class="tmeio rev" style="--i:3"><p class="ttit"></p><p class="tlead"></p></div>`
      +   `<div class="tregua rev" style="--i:5"><div class="ttrilho">`
      +     `<div class="tpreenche"></div><div class="tviajante"></div>${marcos}</div>`
      +     `<div class="tleg"><span><u class="t1"></u> em m&atilde;os</span>`
      +     `<span><u class="t2"></u> a baixar</span>`
      +     `<button type="button" class="trebob" data-t="rev">&#8634; rever do in&iacute;cio</button></div>`
      +   `</div>`
      + `</div>`;
  }
  if(s.g==='fotos'){
    const li=s.itens.map(([q,x],i)=>`<li class="passo" data-f="${i}"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('');
    const im=s.itens.map(([q,x,src,cap],i)=>src?`<img data-f="${i}" src="${IMG[src]||src}" alt="${cap}" onerror="this.dataset.err=1">`:'').join('');
    return `<div class="wrap">${k}${t}<ol class="lista">${li}</ol></div>
      <div class="fbleed">${im}<div class="slot"><b>slot de imagem</b><span class="scap"></span><span class="sfon"></span></div><span class="cred"></span></div>`;
  }
  /* ⚑ `prancha` vem ANTES do `const tab`. Os dois usam `cols`, e com
     significados incompatíveis: aqui é um NÚMERO de colunas, lá é um array
     de cabeçalhos. Deixar o `tab` correr primeiro derruba o deck inteiro
     com `s.cols.map is not a function`. É a armadilha do campo reservado,
     registrada em 23/08 e paga de novo em 29/08.
     Receita: sistemas/gabaritos/prancha-referencia.md */
  if(s.g==='prancha'){
    const foto=(src,cap,ar)=>`<div class="ph"${ar?` style="flex:0 0 auto;aspect-ratio:${ar}"`:''}>`
      + (src?`<img loading="lazy" src="${src}" alt="${(cap||'').replace(/"/g,'&quot;')}">`
            :`<div class="slot"><u>_</u><b>${cap||'imagem'}</b><s>16:9 ou 4:3</s></div>`)+`</div>`;
    const cels=(s.items||[]).map(it=>{
      if(it.pilha){
        return `<div class="cel pilha rev" style="aspect-ratio:${it.ar||'0.70'}">`
          + it.pilha.map(f=>foto(f.src,f.cap,null)).join('')
          + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
      }
      return `<div class="cel rev">`+foto(it.src,it.cap,it.ar||s.ar)
        + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
    }).join('');
    /* a proporção decide as colunas: retrato aceita 3 ou 4, deitada pede 2.
       Aviso no console em vez de regra escondida num .md.
       Ver sistemas/gabaritos/prancha-referencia.md */
    (function(){
      const ars=(s.items||[]).map(i=>parseFloat(i.ar||s.ar||0)).filter(n=>n>0);
      if(!ars.length) return;
      const med=ars.reduce((a,b)=>a+b,0)/ars.length, c=s.cols||3;
      if(med>1.2&&c>2) console.warn('prancha: imagem deitada (ar~'+med.toFixed(2)+') em '+c+' colunas. Deitada pede 2, ou 3 recortando em quadrado.');
      if(med<0.85&&c<3) console.warn('prancha: imagem em retrato (ar~'+med.toFixed(2)+') em '+c+' colunas. Retrato aceita 3 ou 4.');
    })();
    /* `top.kick`: o mesmo kicker dos outros gabaritos, para o numero que
       resume a folha ("30 manifestacoes") nao ter de morar no lead. */
    const topo=(s.top&&(s.top.h2||s.top.lead||s.top.kick))
      ? `<div class="ptop rev">`
        + (s.top.kick?`<div class="pkick">${s.top.kick}</div>`:'')
        + (s.top.h2?`<h2>${s.top.h2}</h2>`:'')
        + (s.top.lead?`<div class="plead">${s.top.lead}</div>`:'')+`</div>` : '';
    /* ⚑ `caber` NAO centraliza por estilo inline: a celula precisa RECEBER a
       altura da linha, e `align-items:center` faz o oposto — ela e sizeda
       pelo conteudo e so centralizada, entao o teto da linha nao a alcanca.
       Medido em 18/09/2026: celula de 1.655 px numa linha de 769. Quem
       centraliza no `caber` e o `object-fit:contain`, dentro da celula. */
    const centra=!s.caber&&(s.ar||(s.items||[]).some(i=>i.ar||i.pilha));
    return `<div class="pbody">${topo}<div class="grade" style="grid-template-columns:repeat(${s.cols||3},1fr)`

    const inf=`<div id="minfo" class="vazio rev"><span class="mn">${s.hint||''}</span></div>`;

    const cl=s.sang?' sang':'';

/* `fim:1` e `fim_:1` valem o mesmo: o go() lê `fim_` */

let secs=[];DECK.forEach((s,i)=>{if(s.sec)secs.push({nome:s.sec,i,num:(s.secn===0||s.secn===false)?0:-1})});
(function(){let c=0;secs.forEach(x=>{if(x.num===-1){c++;x.num=c}})})();
let sa='';DECK.forEach(s=>{if(s.sec)sa=s.sec;s._sec=sa});
/* ⚑ 16/09/2026 — O NUMERO DO CAPITULO TEM UMA FONTE SO.

   menos sensível à passagem. Eu preciso deixar ele amarrado ao botão da
   tela, aquelas duas setinhas, ou ao teclado. E dessa maneira eu vou poder
   interagir livremente, sem me preocupar de sair do slide certo"*.

   Num slide que se manipula — girar um globo, abrir uma vista, arrastar
   sobre uma planta — o dedo está conversando com o CONTEÚDO, e o mesmo
   gesto avançava a apresentação. Em mouse isso quase não aparecia porque o
   guarda de `click` já excluía os visores; o swipe, não: ele era global e
   nem olhava onde o dedo tinha encostado.

   Travado = nem clique nem swipe mudam de slide. Restam a pílula, as duas
   setas do chrome, os pontinhos e o teclado — que é exatamente o controle
   que ele pediu.

   Automático por gabarito (o autor não declara nada), e `trava:1` no slide
   força a mesma coisa em qualquer outro — a porta para a camada interativa
   sobre a ortofoto. */
const G_TRAVA=['earth-3d','modelo-3d','mapa','galeria','viva'];
const travado=i=>{const s=DECK[i]; return !!s&&(s.trava===1||s.trava===true||G_TRAVA.indexOf(s.g)>=0);};
const INTERATIVO='a,button,.pin,.lote,.g-earth-3d .visor,.g-modelo-3d .visor,'
  +'.g-modelo-3d .cenas,.g-mapa-2d .visor,.g-galeria .lupa,.g-galeria .mosaico,'
  +'.g-escolha .opcoes,.g-video .vcmd,gmp-map-3d,iframe';
palco.addEventListener('click',e=>{if(e.target.closest('.ms-start')){avanca();return}
  if(e.target.closest(INTERATIVO))return;
  if(travado(cur))return;
  const faixa=Math.min(Math.max(78,innerWidth*0.16),230);
  if(e.clientX<=faixa){recua();return}
  avanca()});
/* ── O SWIPE, com três guardas que ele não tinha ──────────────────────────
   1 · slide travado não aceita swipe;
   2 · gesto que COMEÇOU num elemento interativo não conta — arrastar o
       globo é arrastar o globo;
   3 · o gesto tem de ser horizontal e franco: 90 px (era 52, que um
       arrasto curto de mapa cruza sem querer) e mais horizontal do que
       vertical, senão rolar a tela troca de slide.
   O limiar é em px de dedo, não em vw, pela mesma razão da faixa de toque. */
let tx=0, ty=0, tvale=false;
addEventListener('touchstart',e=>{
  const t0=e.touches[0]; tx=t0.clientX; ty=t0.clientY;
  tvale = !travado(cur) && !(t0.target.closest&&t0.target.closest(INTERATIVO));
},{passive:true});
addEventListener('touchend',e=>{
  if(!tvale) return;
  const t1=e.changedTouches[0], dx=t1.clientX-tx, dy=t1.clientY-ty;
  if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?avanca():recua(); }
},{passive:true});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));


/* ══ VÍDEO EM SANGRIA TOTAL ═══════════════════════════════════════════════
   Toca ao chegar no slide, PARA ao sair, e volta ao início. Parar importa:
   um <video> em laço fora de cena continua decodificando quadro a quadro
   atrás de tudo — é o mesmo defeito do contexto WebGL que fez o visor 3d
   desmontar em 04/09, e aqui custa bateria de iPad no meio da reunião.

   `play()` devolve uma promessa que o navegador REJEITA quando a política
   de autoplay barra; sem o catch isso vira `Unhandled rejection` no
   console e o validador reprova a peça. Barrado, o slide fica no primeiro
   quadro e o botão continua servindo — é o comportamento certo, não um
   erro a esconder.

   `currentTime=0` ao sair: voltar ao slide recomeça a projeção, que é o
   que a sala espera de uma animação curta em laço. */
/* == O RELOGIO DO CARROSSEL ==============================================
   Um `setInterval` por slide em cena, e so enquanto ele esta em cena: fora
   dele o relogio e parado e o carrossel volta ao primeiro desenho, para
   quem retorna ao slide ver a sequencia do comeco.

   PASSO de 3,2 s: medido contra leitura em projecao - abaixo de ~3 s o olho
   ainda esta reconhecendo a planta quando ela troca, e acima de ~4 s a
   sequencia parece travada. O cross-fade de 0,9 s esta no CSS.

   `prefers-reduced-motion` para tudo: quem pediu menos movimento no sistema
   ve o primeiro desenho, parado. O slide continua dizendo o que precisa -
   o numero esta no texto, nao na animacao. */
var MSCarrosselPos=0;
window.MSCarrossel=(function(){
  var PASSO=3200, timer=null;
  function para(){ if(timer){ clearInterval(timer); timer=null; } }
  function zera(sl){
    var im=sl.querySelectorAll('.full img'), pt=sl.querySelectorAll('.cont-c u'),
        lg=sl.querySelectorAll('.legs span');
    im.forEach(function(e,i){ e.classList.toggle('on',i===0); });
    pt.forEach(function(e,i){ e.classList.toggle('on',i===0); });
    lg.forEach(function(e,i){ e.classList.toggle('on',i===0); });
  }
  return { chegou:function(){
    para();
    /* `conceitos` tem UMA pilha por circulo, nao uma por slide: um interval
       so, com as tres defasadas pelo indice do disco, para nao trocarem
       todas no mesmo quadro. 30/10/2026. */
    var atualC=document.querySelectorAll('#palco .slide')[cur];
    if(atualC&&atualC.classList.contains('g-conceitos')){
      var discos=[].slice.call(atualC.querySelectorAll('.disco .full'))
        .filter(function(f){ return f.querySelectorAll('img').length>1; });
      if(!discos.length) return;
      discos.forEach(function(f){
        var im=f.querySelectorAll('img');
        im.forEach(function(e,k){ e.classList.toggle('on',k===0); });
      });
      if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var tick=0;
      timer=setInterval(function(){
        tick++;
        discos.forEach(function(f,d){
          if((tick+d)%discos.length!==0) return;      /* defasagem por disco */
          var im=f.querySelectorAll('img');
          var atu=f.querySelector('img.on'), j=[].indexOf.call(im,atu);
          if(j<0) j=0;
          im[j].classList.remove('on');
          im[(j+1)%im.length].classList.add('on');
        });
      },PASSO);
      return;
    }
    var todos=document.querySelectorAll('#palco .slide.g-carrossel,#palco .slide.g-meia');
    var atual=document.querySelectorAll('#palco .slide')[cur];
    var meia=!!(atual&&atual.classList.contains('g-meia')&&atual.querySelector('.full img'));
    todos.forEach(function(sl){ if(sl!==atual && !sl.classList.contains('g-meia')) zera(sl); });
    if(!atual||!(atual.classList.contains('g-carrossel')||meia)) return;
    var im=atual.querySelectorAll('.full img');
    if(im.length<2) return;
    /* ⚑ no `meia` a pilha NAO volta ao comeco: a abertura institucional sao
       tres slides seguidos e o avanco do slide nao pode reiniciar a sequencia
       — e' o que o Michel pediu em 30/10/2026. No `carrossel` continua
       zerando, porque la a pilha E' o conteudo do slide. */
    var i=0, lg=atual.querySelectorAll('.legs span');
    if(meia){ i=MSCarrosselPos%im.length; } else { zera(atual); }
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      if(meia){ im.forEach(function(e,k){ e.classList.toggle('on',k===i); }); }
      return;
    }
    var pt=atual.querySelectorAll('.cont-c u');
    im.forEach(function(e,k){ e.classList.toggle('on',k===i); });
    pt.forEach(function(e,k){ e.classList.toggle('on',k===i); });
    lg.forEach(function(e,k){ e.classList.toggle('on',k===i); });
    timer=setInterval(function(){
      im[i].classList.remove('on'); if(pt[i]) pt[i].classList.remove('on');
      if(lg&&lg[i]) lg[i].classList.remove('on');
      i=(i+1)%im.length;
      im[i].classList.add('on');    if(pt[i]) pt[i].classList.add('on');
      if(lg&&lg[i]) lg[i].classList.add('on');
      if(meia) MSCarrosselPos=i;
    },PASSO);
  } };
})();


window.MSVideo=(function(){
  function todos(){ return document.querySelectorAll('#palco .slide video.vid'); }
  function selo(v,tocando){
    var sl=v.closest('.g-video'); if(sl) sl.classList.toggle('tocando',tocando);
    var b=sl&&sl.querySelector('.vpp');
    if(b) b.lastChild.textContent=tocando?'pausar':'tocar';
  }
  function toca(v){
    var pr=v.play();
    if(pr&&pr['catch']) pr['catch'](function(){ selo(v,false); });
    selo(v,true);
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.g-video .vpp'); if(!b) return;
    e.stopPropagation();
    var v=b.closest('.g-video').querySelector('video.vid'); if(!v) return;
    if(v.paused) toca(v); else { v.pause(); selo(v,false); }
  });
  return { chegou:function(){
    var atual=document.querySelectorAll('#palco .slide')[cur];
    todos().forEach(function(v){
      if(atual&&atual.contains(v)){ toca(v); }
      else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; selo(v,false); }
    });
  } };
})();


window.MSTempo=(function(){
  /* ══ A LINHA DO TEMPO DO LUGAR ═════════════════════════════════════════
     Irmão do MSViva: monta na chegada e guarda o estado por slide, para
     quem volta ao slide reencontrar o enquadramento onde deixou.

     A "volta no tempo" roda ao chegar: entra no levantamento mais recente
     e retrocede até o primeiro, 0,76 s por marco. PULA os marcos sem
     imagem — hachura piscando no meio da sequência não comunica nada, e a
     lacuna continua visível na régua, por onde o anel passa. Qualquer
     clique, arrasto ou tecla interrompe e devolve o controle: ninguém
     fica refém da animação na frente do cliente.

     `prefers-reduced-motion` não rebobina: mostra o primeiro marco,
     parado. Mesma regra do carrossel. */
  'use strict';
  var PASSO=760;
  function dados(){ return (typeof DECK!=='undefined' && DECK[cur]) || {}; }
  function atual(){
    var sl=document.querySelectorAll('#palco .slide')[cur];
    return (sl && sl.classList.contains('g-tempo')) ? sl : null;
  }
  function est(sl){
    if(!sl.__t) sl.__t={i:-1,k:1,x:0,y:0,S:0,reb:null,ar:null};
    return sl.__t;
  }
  function cheios(it){ var r=[]; it.forEach(function(x,i){ if(x.src) r.push(i); }); return r; }

  function aplica(sl){
    var e=est(sl), cam=sl.querySelector('.tcam'), v=sl.querySelector('.tvista');
    if(!cam||!v) return;
    var W=v.clientWidth, H=v.clientHeight, S=Math.max(W,H);
    if(!S) return;
    e.S=S; cam.style.width=cam.style.height=S+'px';
    /* KMIN mostra o quadro inteiro mesmo em tela mais alta que 16:9, onde a
       sangria cortaria parte do recorte. Um passo a menos devolve tudo. */
    var KMIN=Math.min(1,W/S);
    e.k=Math.max(KMIN,Math.min(5,e.k));
    e.x=(S*e.k<=W)?(W-S*e.k)/2:Math.min(0,Math.max(W-S*e.k,e.x));
    e.y=(S*e.k<=H)?(H-S*e.k)/2:Math.min(0,Math.max(H-S*e.k,e.y));
    cam.style.transform='translate('+e.x+'px,'+e.y+'px) scale('+e.k+')';
    var bm=sl.querySelector('[data-t="menos"]');
    if(bm) bm.disabled=(e.k<=KMIN*1.001);
    var cobre=+dados().cobre||640, mpp=cobre/(S*e.k),
        alvo=[5,10,20,50,100,200,500,1000], px=0, u=0;
    for(var i=0;i<alvo.length;i++){ u=i; px=alvo[i]/mpp; if(px>=70&&px<=200) break; }
    var esc=sl.querySelector('.tesc');
    if(esc){ esc.querySelector('u').style.width=Math.round(px)+'px';
             esc.querySelector('span').textContent=alvo[u]+' m'; }
  }
  function ajusta(sl){ var e=est(sl); e.k=1; aplica(sl); }

  function mostra(sl,i){
    var it=dados().items||[], x=it[i]; if(!x) return;
    var e=est(sl); e.i=i;
    var de=+dados().de||1925, ate=+dados().ate||2026;
    var ondeX=(x.x!=null?+x.x:(parseInt(x.ano,10)||de));
    var pc=((ondeX-de)/(ate-de)*100)+'%';
    sl.querySelectorAll('.tcam img').forEach(function(im){
      im.classList.toggle('on', +im.dataset.i===i); });
    sl.querySelectorAll('.tm').forEach(function(b){
      b.classList.toggle('on', +b.dataset.i===i); });
    sl.querySelector('.tpreenche').style.width=pc;
    sl.querySelector('.tviajante').style.left=pc;
    var vz=sl.querySelector('.tvazio');
    vz.classList.toggle('on', !x.src);
    vz.querySelector('b').textContent=x.ano||'';
    vz.querySelector('span').textContent=x.vazio||'';
    sl.querySelector('.tano').textContent=x.ano||'';
    sl.querySelector('.tficha').innerHTML=x.ficha||'';
    sl.querySelector('.ttit').innerHTML=x.t||'';
    sl.querySelector('.tlead').innerHTML=x.cap||'';
  }

  function para(sl){ var e=est(sl); if(e.reb){ clearTimeout(e.reb); e.reb=null; }
    sl.classList.remove('andando'); }
  function rebobina(sl){
    var it=dados().items||[], c=cheios(it); if(!c.length) return;
    para(sl);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ mostra(sl,c[0]); return; }
    var j=c.length-1, e=est(sl);
    mostra(sl,c[j]); sl.classList.add('andando');
    (function passo(){
      e.reb=setTimeout(function(){
        j--; if(j<0){ para(sl); return; }
        mostra(sl,c[j]); passo();
      },PASSO);
    })();
  }

  function liga(sl){
    if(sl.dataset.tligado) return; sl.dataset.tligado='1';
    var v=sl.querySelector('.tvista'), e=est(sl);
    sl.querySelectorAll('.tm').forEach(function(b){
      b.addEventListener('click',function(){ para(sl); mostra(sl,+b.dataset.i); }); });
    sl.querySelectorAll('[data-t]').forEach(function(b){
      b.addEventListener('click',function(ev){
        ev.stopPropagation();
        var a=b.dataset.t;
        if(a==='rev'){ rebobina(sl); return; }
        para(sl);
        if(a==='ajustar'){ ajusta(sl); return; }
        var W=v.clientWidth,H=v.clientHeight,f=(a==='mais'?1.4:1/1.4);
        var kn=Math.max(Math.min(1,W/e.S),Math.min(5,e.k*f));
        e.x=W/2-(W/2-e.x)*(kn/e.k); e.y=H/2-(H/2-e.y)*(kn/e.k); e.k=kn; aplica(sl);
      });
    });
    v.addEventListener('wheel',function(ev){
      ev.preventDefault(); para(sl);
      var r=v.getBoundingClientRect(), px=ev.clientX-r.left, py=ev.clientY-r.top;
      var kn=Math.max(Math.min(1,v.clientWidth/e.S),
                      Math.min(5,e.k*(ev.deltaY<0?1.14:1/1.14)));
      e.x=px-(px-e.x)*(kn/e.k); e.y=py-(py-e.y)*(kn/e.k); e.k=kn; aplica(sl);
    },{passive:false});
    v.addEventListener('pointerdown',function(ev){
      if(ev.target.closest('.tzoom')) return;
      para(sl);
      e.ar={px:ev.clientX,py:ev.clientY,x:e.x,y:e.y};
      v.classList.add('arrasta'); v.setPointerCapture(ev.pointerId);
    });
    v.addEventListener('pointermove',function(ev){
      if(!e.ar) return;
      e.x=e.ar.x+(ev.clientX-e.ar.px); e.y=e.ar.y+(ev.clientY-e.ar.py); aplica(sl);
    });
    ['pointerup','pointercancel'].forEach(function(n){
      v.addEventListener(n,function(){ e.ar=null; v.classList.remove('arrasta'); }); });
    window.addEventListener('resize',function(){ if(atual()===sl) aplica(sl); });
  }

  return {
    chegou:function(){
      /* parar a rebobinagem de QUALQUER slide de tempo fora de cena */
      document.querySelectorAll('#palco .slide.g-tempo').forEach(function(o){
        if(o!==atual()) para(o); });
      var sl=atual(); if(!sl) return;
      liga(sl); ajusta(sl); rebobina(sl);
    }
  };
})();

window.MSViva=(function(){
  /* Monta o quadro na chegada e NÃO desmonta na saída: o arquivo é local, e
     desmontar jogaria fora o zoom, as camadas ligadas e a anotação que a
     pessoa fez na frente do cliente. Isto é o oposto do `modelo-3d`, que
     desmonta — lá são 40 MB de WebGL de outro domínio; aqui é um SVG local.

     O FOCO É O PONTO DELICADO. O clicker só anda no roteiro da planta se o
     quadro tiver o foco; e só volta a trocar de slide quando o foco sai. Por
     isso: foca ao chegar, devolve ao corpo ao sair. */
  function quadro(sl){ return sl&&sl.querySelector('iframe'); }
  /* A MEDIDA VAI DAQUI. A peca tem chrome proprio nas mesmas bordas e precisa
     desviar do nosso; proporcao adivinhada la dentro nao fecha (medido: em
     2560x1080 o topo do deck continua alto e um `9vh` ja encolheu). Entao
     quem sabe o tamanho manda o numero. */
  function medida(q){
    if(!q||!q.contentWindow) return;
    var t=document.querySelector('.chrome.topo'), p=document.querySelector('.chrome.pe');
    try{ q.contentWindow.postMessage({ms:'viva-chrome',
      topo: t?Math.round(t.getBoundingClientRect().height):null,
      pe:   p?Math.round(p.getBoundingClientRect().height):null}, location.origin); }catch(x){}
  }
  addEventListener('resize',function(){
    var s=DECK[cur]; if(!s||s.g!=='viva') return;
    medida(quadro(document.querySelectorAll('#palco .slide')[cur]));
  });
  /* o recado do fim do roteiro — ver o `postMessage` na peça */
  /* A LUPA DA PEÇA ESCONDE A PÍLULA. Com a imagem aberta em tela cheia, um
     clique na seta tiraria a pessoa do slide sem ela querer — e o que está
     na tela naquele instante é assunto da peça, não do deck. A peça avisa
     quando abre e quando fecha. O `.chrome` fica: os dois logotipos
     continuam em cena. */
  addEventListener('message',function(e){
    if(e.origin!==location.origin) return;
    var x=e.data;
    if(x&&x.ms==='viva-lupa'){ document.body.classList.toggle('lupa-viva',!!x.on); return; }
    var d=e.data; if(!d||d.ms!=='viva') return;
    var s=DECK[cur]; if(!s||s.g!=='viva') return;
    if(d.vai<0) recua(); else avanca();
  });
  return { chegou:function(){
    var atual=document.querySelectorAll('#palco .slide')[cur],
        s=DECK[cur], eViva=!!s&&s.g==='viva';
    if(!eViva){
      /* saiu: o foco volta ao documento, senão o clicker continua falando com
         a planta que nem está mais na tela. */
      if(document.activeElement&&document.activeElement.tagName==='IFRAME')
        document.activeElement.blur();
      if(document.body.focus) document.body.focus();
      return;
    }
    var q=quadro(atual); if(!q) return;
    /* ⚑ `recarrega:1` — a peca que ABRE SOZINHA tem de abrir de novo. O
       padrao do `viva` e montar uma vez e nunca desmontar, porque a planta
       interativa guarda zoom, camadas e a anotacao feita na frente do
       cliente: recarregar la seria perder trabalho. O mapa de atuacao e o
       oposto — ele tem uma abertura de 9,5 s (Brasil, Sao Paulo, centro,
       varredura das fotos) que E o argumento do slide. Voltar ao slide e
       encontrar o mapa parado no fim da sequencia entrega o resultado sem
       o movimento que o explica. 02/11/2026. */
    if(!q.src||q.src==='about:blank'||s.recarrega){
      atual.classList.remove('pronto');
      q.addEventListener('load',function(){
        atual.classList.add('pronto');
        medida(q);
        try{ q.contentWindow.focus(); }catch(x){}
      },{once:true});
      q.src=q.dataset.src;
    }else{
      atual.classList.add('pronto');
      medida(q);
      try{ q.contentWindow.focus(); }catch(x){}
    }
  } };
})();


/* ─── cortina diagonal: intercepta a primeira saída da abertura, venha de onde
   vier (pílula, seta do chrome, teclado ou toque). ─── */
(function(){
  const cortina=document.getElementById('mscortina');let correndo=false;
  const _go=window.go||go;
  function varre(depois){
    correndo=true;cortina.classList.remove('sai');void cortina.offsetWidth;
    cortina.classList.add('on');
    setTimeout(depois,580);
    setTimeout(()=>{cortina.classList.remove('on');cortina.classList.add('sai')},660);
    setTimeout(()=>{cortina.classList.remove('sai');cortina.style.visibility='hidden';
      void cortina.offsetWidth;cortina.style.visibility='';correndo=false},1340);
  }
  window.go=function(i,tudo){
    const j=Math.max(0,Math.min(DECK.length-1,i));
    /* a diagonal marca duas coisas: a saida da abertura e a entrada de cada
       divisor de secao. Em nenhum outro lugar. */
    const vale = !correndo && j>cur && (cur===0 || DECK[j].g==='divisor');
    if(vale && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      varre(()=>_go(j,tudo));return;
    }
    _go(i,tudo);
  };
})();

/* ─── dois fundos morph, um por papel ──────────────────────────────────────
   O canvas da marca roda o portfólio do Michel; o do divisor roda as imagens
   do deck. Duas instâncias em vez de uma porque o `montar()` fixa o conjunto
   de texturas na carga — não há como trocar a lista depois.
   Custo real: um segundo contexto WebGL2 e ~8 MB de VRAM. Nenhuma das duas
   desenha fora do seu slide: o go() pausa a que não está em cena.
   `?semfundo` desliga as duas. `?semdivisor` desliga só a do divisor.      */
if(!location.search.includes('semfundo')){
  const sobe=(id,imgs,opt)=>{
    try{ return MSFundo.montar(document.getElementById(id), imgs,
      Object.assign({scale:0.85, prep:false, sortear:true}, opt)); }
    catch(e){ console.warn('fundo morph indisponivel em #'+id,e); return null; }
  };
  const subir=()=>{
    /* a paleta do morph sai dos TOKENS, lida no navegador (tok, acima):
       trocar o :root da marca troca o fundo junto, sem hex aqui. */
    /* marca: o campo escuro da marca, trama correndo para a tinta, acento */

      var h=p.h||74;
      haste(m3d,{lat:p.lat,lng:p.lng},h,ACENTO+'ff',4);
      caixa(m3d,p.rot,{lat:p.lat,lng:p.lng,altitude:h},'cafe',p);
    });
    if(posto.length){
      resolveColisao();
      tAnot=setInterval(resolveColisao,140);
    }
  }

  function aproxima(p){
    ANCORA={lat:p.lat,lng:p.lng,alt:p.alt};
    /* ⚠ A APROXIMACAO NAO E ENFEITE. Criar o visor com o range final devolve
       tela azul lisa: o motor ainda nao tem a malha e a camera nasce dentro
       do chao. Nao existe evento de "terminei" — gmp-steadychange nao dispara
       neste preview —, por isso a espera e por relogio, e generosa. */
    var passos=DEGRAUS.concat([CAM.range]), i=0;
    (function passo(){
      if(!mapa) return;
      mapa.center={lat:p.lat,lng:p.lng,altitude:p.alt};
      mapa.range=passos[i];
      mapa.tilt=(i===0)?CAM.tiltEntrada:CAM.tilt;
      mapa.heading=CAM.heading;
      i++;
      progresso(1+i,'aproximando · '+i+' de '+passos.length);
      if(i<passos.length){ setTimeout(passo,PAUSA); return; }
      progresso(TOTAL-1,'assentando a malha');
      setTimeout(function(){
        var d=diagnostica(); if(d){ falha(d); return; }
        progresso(TOTAL,'pronto');
        if(slide) slide.classList.remove('esperando');
        /* a anotacao entra com a malha assentada, nunca antes: a caixa
           ancorada em coordenada precisa do terreno para saber onde pousar. */
        desenhaAnot();
        orbita(true);            /* entra girando, devagar */
      },4000);
    })();
  }
  function orbita(liga){
    if(!mapa||!slide) return;
    orbitando=liga;
    slide.classList.toggle('orbitando',liga);
    var bt=slide.querySelector('.orb');
    if(bt) bt.lastChild.textContent=liga?'parar':'orbitar';
    if(!liga){
      /* para tambem a animacao nativa: o RECENTRAR usa `flyCameraTo`, e se
         ele estiver no ar a orbita e a viagem disputam a mesma camera. */
      if(mapa.stopCameraAnimation) mapa.stopCameraAnimation();
      if(rafOrb){ cancelAnimationFrame(rafOrb); rafOrb=null; }
      return;
    }
    /* ── a rotacao, integrada quadro a quadro ────────────────────────────
       `alvo` em graus por segundo, derivado de VOLTA. A rampa e easeOut
       sobre a VELOCIDADE: sobe rapido e assenta — a sensacao de "cliquei e
       esta acontecendo". Rampa linear da partida mole; easeIn da exatamente
       o que o Michel nao quer.
       O `dt` e medido, nao presumido: em quadro perdido a camera nao pula
       nem trava, porque o avanco e velocidade x tempo real. Teto de 50 ms
       para aba que voltou do segundo plano nao dar um salto. */
    var alvo=360/(VOLTA/1000);
    var t0=performance.now(), ult=t0;
    rafOrb=requestAnimationFrame(function passo(now){
      if(!orbitando||!mapa) return;
      rafOrb=requestAnimationFrame(passo);
      var dt=Math.min((now-ult)/1000,0.05); ult=now;
      var k=Math.min(1,(now-t0)/RAMPA);
      var vel=alvo*(1-Math.pow(1-k,3));
      mapa.heading=((mapa.heading||0)+vel*dt)%360;
    });
  }
  /* ── RECENTRAR ─────────────────────────────────────────────────────────
     Volta ao enquadramento canonico. `flyCameraTo` e da propria API e faz a
     volta com animacao; sem ela, escreve-se center/range/tilt/heading direto
     — corte em vez de voo, mas cumpre. A orbita para antes: duas animacoes
     de camera se atropelam. E volta a girar quando a viagem termina, porque
     e assim que o slide se comporta. */
  function recentra(){
    if(!mapa||!ANCORA) return;
    var girava=orbitando;
    if(girava) orbita(false);
    var alvo={center:{lat:ANCORA.lat,lng:ANCORA.lng,altitude:ANCORA.alt},
              range:CAM.range,tilt:CAM.tilt,heading:CAM.heading};
    if(mapa.flyCameraTo){ mapa.flyCameraTo({endCamera:alvo,durationMillis:2200}); }
    else { mapa.center=alvo.center; mapa.range=alvo.range;
           mapa.tilt=alvo.tilt; mapa.heading=alvo.heading; }
    var bt=slide&&slide.querySelector('.rec');
    if(bt){ bt.classList.add('feito'); setTimeout(function(){ bt.classList.remove('feito'); },900); }
    if(girava) setTimeout(function(){ orbita(true); },2400);
  }
  function monta(){
    var vis=slide.querySelector('.visor');
    var p={lat:parseFloat(vis.dataset.lat),lng:parseFloat(vis.dataset.lng),
           alt:parseFloat(vis.dataset.alt)||760};
    /* ensaio sem republicar: ?ll=lat,lng troca o ponto; ?alt=760 a altitude */
    var q=new URLSearchParams(location.search);
    var ll=(q.get('ll')||'').match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
    if(ll){ p.lat=parseFloat(ll[1]); p.lng=parseFloat(ll[2]); }
    if(q.get('alt')) p.alt=parseFloat(q.get('alt'))||p.alt;

    if(!chave()){ falha('Sem chave da Maps Platform nao ha o que desenhar. Ela mora em <code>modulos/ms-maps-chave.js</code>.'); return; }
    if(location.protocol==='file:'){
      falha('Esta pagina esta aberta como arquivo (<code>file://</code>) e a Maps JavaScript API recusa essa origem. Este slide so funciona pelo link publicado — e por isso que a peca se entrega por endereco, nunca como anexo.');
      return;
    }
    gritou=null;
    /* se o aquecimento ja rodou, esta promessa ja esta resolvida e o passo
       "carregando a api" passa num piscar — o indicador salta direto para
       "aproximando · 1 de 4". */
    lib3d().then(function(m3d){
        lib=m3d;
        if(mapa&&mapa.parentNode) mapa.parentNode.removeChild(mapa);
        mapa=new m3d.Map3DElement({
          center:{lat:p.lat,lng:p.lng,altitude:p.alt},
          range:CAM.range,tilt:CAM.tiltEntrada,heading:CAM.heading,
          /* MapMode, nao Map3DMode. SATELLITE e nao HYBRID: o hibrido cobre
             a cidade de pinos de restaurante e rotulo de rua. */
          mode:m3d.MapMode?m3d.MapMode.SATELLITE:'SATELLITE'});
        vis.insertBefore(mapa,vis.firstChild);
        setTimeout(function(){
          var d=diagnostica(); if(d){ falha(d); return; }
          aproxima(p);
        },1400);
      })['catch'](function(e){
        var d=diagnostica();
        falha(d||'Nao deu para carregar a API do Google (<code>'+((e&&e.message)||'erro')
          +'</code>). Este slide nao funciona offline.');
      });
  }
  function desativa(){
    document.querySelectorAll('.g-earth-3d').forEach(function(sl){ sl.classList.remove('girando'); });
  }
  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-earth-3d'); if(!sl) return;
    if(e.target.closest('.pin')){ e.stopPropagation(); alternaAnot(!anotLiga); return; }
    if(e.target.closest('.caf')){ e.stopPropagation(); alternaCafe(!cafeLiga); return; }
    if(e.target.closest('.tul')){ e.stopPropagation();
      var g0=gavetaDe(); abreGaveta(!(g0&&g0.hasAttribute('data-on'))); return; }
    if(e.target.closest('.gfecha')){ e.stopPropagation(); abreGaveta(false); return; }
    if(e.target.closest('.anot[data-abre]')||e.target.closest('.abre-tulha')){
      e.stopPropagation(); abreGaveta(true); return; }
    if(e.target.closest('.rota')){ e.stopPropagation(); return; }
    var pt=e.target.closest('.gpt');
    if(pt){ e.stopPropagation(); leGaveta(pt.closest('.gaveta'),+pt.dataset.i); return; }
    if(e.target.closest('.gaveta')){ e.stopPropagation(); return; }
    if(e.target.closest('.cam')){ e.stopPropagation(); alternaCaminho(!caminhoLiga); return; }
    if(e.target.closest('.orb')){ e.stopPropagation(); orbita(!orbitando); return; }
    if(e.target.closest('.rec')){ e.stopPropagation(); recentra(); return; }
    if(e.target.closest('.sair')){ e.stopPropagation(); desativa(); document.body.focus(); return; }
    /* ⚑ O VÉU SÓ DESTRAVA — NÃO PARA A ÓRBITA (14/09/2026, pedido do Michel:
       *"eu queria clicar, tirar esse overlay da tela, e a órbita continua.
       Se eu interagir com o conteúdo, clicar e arrastar, aí sim ela é
       pausada"*).
       Antes o clique no véu fazia as duas coisas de uma vez, e o slide
       entrava parado justamente no momento em que a sala olha para ele.
       Agora destravar e assumir a câmera são dois gestos separados. */
    if(e.target.closest('.veu')){ e.stopPropagation(); sl.classList.add('girando'); }
  });

  /* ⚑ A LISTA ACENDE O PINO. O caminho inverso — pino acende a lista — nao
     funciona: o conteudo do popover do Earth nao recebe ponteiro. Este
     funciona porque a lista e' DOM nosso de ponta a ponta. */
  function acende(n){
    document.querySelectorAll('.anot.cafe').forEach(function(a){
      a.classList.toggle('aceso', n!=null && a.dataset.n===String(n));
    });
  }
  ['mouseover','focusin'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      var li=e.target.closest&&e.target.closest('.rota button[data-n]');
      acende(li?li.dataset.n:null);
    },true);
  });
  document.addEventListener('mouseleave',function(e){
    if(e.target.closest&&e.target.closest('.rota')) acende(null);
  },true);
  /* passar o mouse já lê; o foco do teclado também, para quem não usa mouse */
  ['mouseover','focusin'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      var pt=e.target.closest&&e.target.closest('.gpt');
      if(pt) leGaveta(pt.closest('.gaveta'),+pt.dataset.i);
    },true);
  });
  /* ── QUEM PEGA A CÂMERA PARA A ÓRBITA — mas só quem pega de verdade ──────
     O sinal é ARRASTO, não toque: `pointerdown` sozinho inclui o clique que
     acabou de tirar o véu, e um clique seco no mapa não é intenção de
     navegar. Espera-se deslocamento acima de LIMIAR antes de parar.
     `wheel` conta na hora: zoom já é comando de câmera.
     No `pointerup` a escuta se desfaz — sem rastro de listener por arrasto. */
  var LIMIAR=7;
  document.addEventListener('pointerdown',function(e){
    var sl=e.target.closest&&e.target.closest('.g-earth-3d'); if(!sl) return;
    if(!e.target.closest('.visor')) return;      /* chrome e botões não contam */
    if(e.target.closest('.veu,.cmd,.sair')) return;
    if(!orbitando) return;
    var x0=e.clientX, y0=e.clientY, parou=false;
    function move(ev){
      if(parou) return;
      if(Math.abs(ev.clientX-x0)>LIMIAR||Math.abs(ev.clientY-y0)>LIMIAR){
        parou=true; orbita(false); solta();
      }
    }
    function solta(){
      document.removeEventListener('pointermove',move,true);
      document.removeEventListener('pointerup',solta,true);
      document.removeEventListener('pointercancel',solta,true);
    }
    document.addEventListener('pointermove',move,true);
    document.addEventListener('pointerup',solta,true);
    document.addEventListener('pointercancel',solta,true);
  },true);
  document.addEventListener('wheel',function(e){
    var sl=e.target.closest&&e.target.closest('.g-earth-3d .visor');
    if(sl&&orbitando) orbita(false);
  },{capture:true,passive:true});
  /* indices de todo slide earth-3d do deck. Generico de proposito: se um dia
     a peca tiver dois visores, os dois aquecem no slide que os antecede. */
  var PROX=[];
  DECK.forEach(function(s,i){ if(s.g==='earth-3d') PROX.push(i); });

  return {
    chegou:function(){
      var s=DECK[cur];
      /* NIVEL 1 — aquece ao chegar no slide imediatamente anterior */
      if(PROX.indexOf(cur+1)>=0) aquece();
      if(!s||s.g!=='earth-3d'){
        desativa(); if(orbitando) orbita(false);
        /* DESMONTA ao sair: o Map3DElement e um contexto WebGL vivo que ficava
           atras de todos os slides seguintes (04/09/2026). Na volta remonta —
           a API ja esta carregada e o indicador de carga e honesto. */
        /* a anotacao vai com o mapa: os popovers sao filhos dele, e o
           relogio do resolvedor de colisao tem de parar. */
        limpaAnot();
        if(mapa){ if(mapa.parentNode) mapa.parentNode.removeChild(mapa); mapa=null; }
        if(montado){ montado=false;
          document.querySelectorAll('.g-earth-3d').forEach(function(sl){ sl.classList.remove('esperando','pronto','girando','falhou'); }); }
        return;
      }
      slide=document.querySelectorAll('#palco .slide')[cur];
      if(montado){ if(!orbitando&&mapa) orbita(true); return; }
      montado=true; slide.classList.add('esperando');
      progresso(1,'carregando a api'); monta();
    },

    /* ── COSTURAS DE TESTE ────────────────────────────────────────────────
       Só o gate `colisao.js` chama. Existem porque a Maps API não sai do
       container de build: o visor nunca monta, a anotação nunca desenharia,
       e a prioridade entre as camadas — que é lógica NOSSA e regride sem
       ninguém ver — ficaria sem cobertura. Com estas duas o gate injeta um
       dublê da `maps3d` e exercita o desenho e o resolvedor de verdade.
       Não fazem nada em apresentação: ninguém as chama. */
    __teste:function(o){ lib=o.lib; mapa=o.mapa; anotLiga=true; desenhaAnot(); },
    __alterna:function(l){ alternaAnot(l); },
    __resolve:resolveColisao
  };
})();

window.MSModelo=(function(){

    if(!imgs.length) return;

      falha('O quadro do viewer nao respondeu em '+(PRAZO_DOC/1000)+' s. '
        +'Pode ser a rede, pode ser rede corporativa que bloqueia quadro de '
        +'outro dominio, e pode ser o modelo nao estar <b>publico</b> no 3D '
        +'Warehouse — modelo privado devolve 404 para quem abre o link.');

  function recomeca(){
    if(!slide) return;
    /* recarregar e o unico caminho de volta: a camera e do viewer da Trimble

       a aparecer — o que e honesto. */
    if(tDoc) clearTimeout(tDoc);

  document.addEventListener('click',function(e){

    slide=sl;
    if(e.target.closest('.rec')){ e.stopPropagation(); recomeca(); return; }

    var bt=e.target.closest('.cenas button');
    if(bt){ e.stopPropagation(); vaiPara(parseInt(bt.dataset.i,10)); return; }
    if(e.target.closest('.sair')){ e.stopPropagation(); sl.classList.remove('girando');
      document.body.focus(); return; }
    if(e.target.closest('.veu')){ e.stopPropagation(); sl.classList.add('girando'); }
  });
  /* setas passeiam pelas imagens de reserva quando ela esta no ar */
  addEventListener('keydown',function(e){
    if(!caiu||!slide) return;
    var imgs=[].slice.call(slide.querySelectorAll('.reserva .ph img'));
    if(!imgs.length) return;
    var atual=imgs.findIndex(function(i){ return i.classList.contains('on'); });
    if(e.key==='ArrowRight'){ e.preventDefault(); vaiPara(atual+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); vaiPara(atual-1); }
  });
  return {
    chegou:function(){
      var s=DECK[cur];
      if(!s||s.g!=='modelo-3d'){
        /* DESMONTA ao sair: o viewer do SketchUp (~40 MB, WebGL) ficava vivo
           atras dos slides seguintes (04/09/2026). src vazio libera; na volta
           monta() recarrega, com o indicador de carga. A reserva fica. */
        if(tDoc){ clearTimeout(tDoc); tDoc=null; }
        if(tModelo){ clearTimeout(tModelo); tModelo=null; }
        document.querySelectorAll('.g-modelo-3d').forEach(function(sl){
          sl.classList.remove('girando','esperando','pronto','falhou');
          var q=sl.querySelector('iframe'); if(q&&q.src&&q.src!=='about:blank') q.src='about:blank'; });
        montado=false;

      slide=document.querySelectorAll('#palco .slide')[cur];
      monta();
    }
  };
})();

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ESCOLHA E GALERIA — o motor das duas
   Pedidos do Michel em 04/09/2026. Ficam AQUI, no esqueleto, e não na peça:
   bifurcação e mosaico não são assunto da EMEI, são gabarito da casa.
   ═════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  /* ── A BIFURCAÇÃO ────────────────────────────────────────────────────
     `para` é o NOME de um gabarito, e o destino é o PRÓXIMO slide daquele
     gabarito. Nunca índice: quando uma seção entra no meio do DECK, índice
     chumbado aponta para o slide errado — já quebrou um teste nesta peça, e
     numa bifurcação quebraria na frente do cliente.
     `ir` aceita índice absoluto, para o caso raro de destino que não é
     gabarito próprio. Se nenhum dos dois resolve, a pílula AVANÇA — nunca
     fica morta na tela. */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.g-escolha .pill');
    if(!b) return;
    e.stopPropagation();
    var i=-1;
    if(b.dataset.ir!=null && b.dataset.ir!=='') i=parseInt(b.dataset.ir,10);
    if(i<0 && b.dataset.para){
      for(var j=cur+1;j<DECK.length;j++){ if(DECK[j].g===b.dataset.para){ i=j; break; } }
    }
    go(i>=0?i:cur+1,true);
  });

  /* ── A GALERIA E A LUPA ──────────────────────────────────────────────
     A lupa é CAMADA sobre o slide, não slide. Decisão do Michel: as setas
     passeiam pelas vistas daquela versão e o deck só anda quando ela fecha.
     É o que permite ficar numa imagem enquanto o cliente fala.

     ⚑ A MINIATURA JÁ BAIXOU A IMAGEM. A lupa copia o `src` da miniatura em
     vez de montar um caminho: mesmo arquivo, cache do navegador, zero
     segunda carga. Se a miniatura ainda não chegou (o __msPuxa entra no
     slide), cai no `data-src`.

     ⚑ `em-imagem` ENTRA COM A LUPA. A galeria fechada é mosaico sobre a
     moldura e o logotipo do canto lê em positivo; aberta, ele fica sobre um
     render e tem de virar monocromático em Cal. Falha silenciosa clássica —
     é a regra 6 do DECK-MONTAR, e já custou duas rodadas em 02/09. */
  var atual=-1;

  function galeria(){ return document.querySelector('#palco .slide.ativo.g-galeria'); }
  function fotos(sl){ return [].slice.call(sl.querySelectorAll('.tijolo')); }

  function abre(sl,i){
    var t=fotos(sl); if(!t.length) return;
    atual=(i+t.length)%t.length;
    var tij=t[atual], im=tij.querySelector('img');
    var alvo=sl.querySelector('.lupa img');
    if(im) alvo.src=im.currentSrc||im.src||im.dataset.src||'';
    alvo.alt=tij.dataset.rot||'';
    sl.querySelector('.lupa .lupaov h3').textContent=tij.dataset.rot||'';
    sl.querySelector('.lupa .lupaov span').textContent=tij.dataset.cap||'';
    sl.querySelector('.lupa .lconta').textContent=(atual+1)+' / '+t.length;
    var so=t.length<2;
    sl.querySelector('.lupa .lant').hidden=so;
    sl.querySelector('.lupa .lpro').hidden=so;
    sl.classList.add('lupando');
    document.body.classList.add('em-imagem');
    if(window.__msAcorda) window.__msAcorda();   /* o X aparece ao abrir */
  }
  function fecha(sl){
    if(!sl) return;
    sl.classList.remove('lupando');
    atual=-1;
    /* devolve o chrome ao estado do SLIDE, que o go() calcula: a galeria
       fechada não é fundo de imagem. */
    document.body.classList.toggle('em-imagem',
      !!(DECK[cur] && (DECK[cur].g==='cheia'||DECK[cur].g==='earth-3d'
                       ||DECK[cur].g==='modelo-3d'||DECK[cur].g==='mapa-2d'
                       ||DECK[cur].g==='video'||DECK[cur].g==='carrossel'
                       ||DECK[cur].g==='logo')));
  }
  window.__msLupaFecha=function(){ fecha(galeria()); };

  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-galeria');
    if(!sl) return;
    var tij=e.target.closest('.tijolo');
    if(tij){ e.stopPropagation(); abre(sl,parseInt(tij.dataset.i,10)); return; }
    if(!sl.classList.contains('lupando')) return;
    e.stopPropagation();                       /* lupa aberta: o deck não anda */
    if(e.target.closest('.fechar')){ fecha(sl); return; }
    if(e.target.closest('.lant')){ abre(sl,atual-1); return; }
    if(e.target.closest('.lpro')){ abre(sl,atual+1); return; }
    /* clique no fundo da lupa fecha: é o gesto que todo mundo tenta */
    fecha(sl);
  });

  /* teclado da lupa. Registrado na FASE DE CAPTURA para chegar antes do
     handler do deck — sem isso a seta avançaria o slide E a vista. */
  addEventListener('keydown',function(e){
    var sl=galeria(); if(!sl||!sl.classList.contains('lupando')) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); fecha(sl); return; }
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){
      e.preventDefault(); e.stopPropagation(); abre(sl,atual+1); return; }
    if(e.key==='ArrowLeft'||e.key==='PageUp'){
      e.preventDefault(); e.stopPropagation(); abre(sl,atual-1); return; }
  },true);
})();

/* ─── ociosidade do ponteiro ───────────────────────────────────────────
   1,8 s parado e o body ganha `ocioso`. Qualquer gesto tira. Genérico de
   propósito: quem decide ONDE o efeito acontece é a classe `em-cheia`.
   ─────────────────────────────────────────────────────────────────── */
(function(){
  var t=null, ATRASO=1800;
  window.__msAcorda=function(){
    document.body.classList.remove('ocioso');
    clearTimeout(t);
    t=setTimeout(function(){ document.body.classList.add('ocioso'); }, ATRASO);
  };
  ['pointermove','pointerdown','wheel','keydown','touchstart'].forEach(function(ev){
    addEventListener(ev, window.__msAcorda, {passive:true});
  });
  window.__msAcorda();
})();
</script>
