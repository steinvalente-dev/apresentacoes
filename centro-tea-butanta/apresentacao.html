.uc .ua{font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:5px;display:block}
.uc .ur{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.5cqw,58px);letter-spacing:-.05em;line-height:1;color:var(--acento);margin-top:clamp(12px,1.8cqh,22px);display:block}
body.esc .uc .ur{color:var(--acento-claro)}
.uc .ul{font-size:var(--fs-cap);letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:8px;display:block}
.uc .um{font-size:var(--fs-body);color:var(--soft);margin-top:9px;line-height:1.55;display:block}
body.esc .uc .ua,body.esc .uc .ul,body.esc .uc .um{color:var(--papel-70)}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */

/* barra de destaque no kicker */
.kick.barra{display:inline-block;background:var(--acento);color:var(--papel);padding:7px 14px 6px;letter-spacing:.2em;margin-bottom:clamp(16px,2.3cqh,30px)}
/* trio tempo/memoria/dominio */
ol.trio{list-style:none;margin-top:clamp(22px,3.4cqh,52px);display:grid;gap:clamp(14px,2.2cqh,30px)}
ol.trio li{display:grid;grid-template-columns:minmax(0,.46fr) minmax(0,1fr);gap:clamp(16px,2.6cqw,52px);
  align-items:baseline;border-top:1px solid var(--hair);padding-top:clamp(11px,1.6cqh,20px)}
ol.trio .q{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(24px,3.6cqw,58px);letter-spacing:-.05em;line-height:1;color:var(--acento)}
ol.trio .t{font-size:var(--fs-body);line-height:1.6}

/* ══ CONFRONTO — duas implantacoes lado a lado, cada uma com o seu quadro ══
   02/11/2026. Nasce da tabela "o programa e o conjunto existente": comparar
   duas areas por numero exige que quem ouve confie no numero. Com as duas
   plantas na tela, o argumento se ve antes de se ler — e o quadro embaixo
   de cada uma so confirma o que o desenho ja disse.

   ⚑ AS DUAS COLUNAS SAO IGUAIS, sempre. Mesmo quando um dos lados ainda nao
   tem planta: o lado vazio mantem a largura e mostra o slot hachurado. Dar
   mais espaco ao lado que tem imagem faria a comparacao mentir antes de
   comecar.

   ⚑ A IMAGEM E `contain`, nunca `cover`. A regra do `cover` vale para
   fotografia; aqui sao PLANTAS, e cortar planta para preencher caixa e
   exatamente o erro que o quadro de areas existe para evitar.

   ⚑ A ALTURA DA FIGURA VEM DA LINHA DO GRID, com `min-height:0` em todo o
   caminho — sem isso a figura obedece so a largura e empurra o quadro de
   areas para fora da tela em projetor largo e baixo.                    */
.g-confronto .wrap{max-width:none;flex:1;min-height:0;display:flex;flex-direction:column}
.conf{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(22px,3.2cqw,60px);margin-top:clamp(12px,1.9cqh,30px)}
.conf .lado{min-width:0;min-height:0;display:flex;flex-direction:column}
.conf .rot{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.2em;
  text-transform:uppercase;color:var(--soft);margin-bottom:clamp(3px,.5cqh,7px)}
.conf .nm{font-family:var(--f-display);font-style:italic;font-weight:500;
  letter-spacing:-.035em;line-height:1.05;color:var(--tinta);
  font-size:clamp(17px,1.75cqw,30px);margin-bottom:clamp(9px,1.4cqh,20px)}
body.esc .conf .nm{color:var(--papel)}
.conf .fig{flex:1;min-height:0;position:relative;border-radius:2px;
  background:color-mix(in srgb,var(--tinta) 4%,transparent)}
.conf .fig img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center}
.conf .fig .vazio{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);text-align:center;padding:12%;
  background:repeating-linear-gradient(135deg,transparent 0 9px,
    color-mix(in srgb,var(--tinta) 7%,transparent) 9px 10px)}
/* o quadro de areas: tres linhas, e a ultima e a que se le */
.conf .qd{margin-top:clamp(10px,1.6cqh,24px);
  border-top:1.5px solid color-mix(in srgb,var(--tinta) 22%,transparent)}
.conf .qd div{display:flex;justify-content:space-between;align-items:baseline;
  gap:1em;padding:clamp(4px,.7cqh,10px) 0;
  border-bottom:1px solid color-mix(in srgb,var(--tinta) 11%,transparent)}
.conf .qd div:last-child{border-bottom:0}
.conf .qd .rr{font-size:var(--fs-cap);letter-spacing:.06em;color:var(--soft)}
.conf .qd .vv{font-family:var(--f-corpo);font-weight:500;
  font-size:clamp(13px,1.08cqw,19px);color:var(--tinta);
  font-variant-numeric:tabular-nums;white-space:nowrap}
body.esc .conf .qd .vv{color:var(--papel)}
.conf .qd .tot{border-top:1.5px solid var(--primaria);border-bottom:0;
  margin-top:clamp(2px,.3cqh,5px)}
.conf .qd .tot .rr{color:var(--primaria);font-weight:600}
.conf .qd .tot .vv{color:var(--primaria);font-weight:600;
  font-size:clamp(15px,1.32cqw,24px)}
/* ⚑ a nota da casa tem `max-width:34ch` no texto, que e o certo para um
   paragrafo ao lado de um numero grande. Aqui ela corre sob duas colunas:
   com 34ch quebrava em quatro linhas curtas e comia a altura que a planta
   precisava para nao encolher. */
.g-confronto .notaN{margin-top:clamp(10px,1.5cqh,22px)}
.g-confronto .notaN .nt{max-width:none}
body.esc .conf .qd .tot .rr,body.esc .conf .qd .tot .vv{color:var(--acento-claro)}

/* ══ CONCEITOS — os circulos desenhados, um por clique ════════════════════
   30/10/2026. Nasce do `trio`, que era lista de tres linhas. O Michel:
   *"a gente nao deve usar a palavra circulos... eu queria que a gente
   desenhasse esses circulos na tela"* — e cada um ganha preenchimento de
   imagem, com um mini carrossel rodando dentro.

   ⚑ O CIRCULO EXISTE DESDE A CHEGADA, o conteudo e que entra. Os tres
   aneis estao na tela quando o slide abre: o slide ANUNCIA que sao tres, e
   a fala constroi um a um. Fazer o anel aparecer junto esconderia a
   estrutura do argumento ate o ultimo clique.

   ⚑ O `.passo` E O <li> INTEIRO — disco, rotulo e texto no mesmo elemento.
   Separados, o motor (um `.passo` por vez, em ordem de documento) andaria
   os tres discos primeiro e so depois os tres textos. Mesma armadilha do
   `sequencia` e do `meia` com estados.

   ⚑ SEM `translateY`. O `.passo` da casa desloca, que e certo para item de
   lista chegando. Aqui o anel JA ESTA no lugar e so o miolo acende: mover
   faria o circuloporar de posicao contra os vizinhos parados.          */
ol.cncs{list-style:none;margin-top:clamp(18px,2.8cqh,44px);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(18px,3cqw,56px);align-items:start}
ol.cncs li.cnc{opacity:1;transform:none;display:flex;flex-direction:column;
  align-items:center;text-align:center;min-width:0}
/* o disco: anel sempre visivel, miolo que acende */
/* ⚑ `--moldura` NAO serve de fundo aqui. Ela e a TARJA — tinta puxada ao
   preto —, certa atras de uma foto que sangra, e o disco vazio com ela vira
   um buraco preto no meio do papel. O fundo do anel e um veu de tinta a 4%:
   o circulo le como area reservada, nao como objeto. */
.cncs .disco{position:relative;width:100%;max-width:clamp(118px,15.5cqw,232px);
  aspect-ratio:1;border-radius:50%;overflow:hidden;margin:0 0 clamp(12px,1.8cqh,24px);
  border:1.5px solid var(--tinta-20);
  background:color-mix(in srgb,var(--tinta) 4%,transparent);
  transition:border-color .45s ease,transform .45s ease}
.cncs li.cnc.on .disco{border-color:var(--primaria);transform:scale(1.02)}
/* o miolo — imagem, pilha ou hachura — so aparece com o passo */
.cncs .disco .full{position:absolute;inset:0;opacity:0;transition:opacity .55s ease}
.cncs li.cnc.on .disco .full{opacity:1}
.cncs .disco .full img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;opacity:0;transition:opacity .9s ease}
.cncs .disco .full img.on{opacity:1}
/* slot vazio: a hachura da casa, dentro do circulo, para o slide poder ser
   apresentado antes de a imagem chegar */
.cncs .disco .vazio{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);text-align:center;padding:14%;
  background:repeating-linear-gradient(135deg,transparent 0 9px,
    color-mix(in srgb,var(--tinta) 7%,transparent) 9px 10px)}
/* o numero fica no anel, nao no miolo: ele pertence a estrutura, que ja
   esta na tela, e nao ao conteudo, que entra */
.cncs .nn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--f-display);font-style:italic;font-weight:500;
  font-size:clamp(28px,4.2cqw,64px);line-height:1;color:var(--tinta-20);
  transition:opacity .45s ease}
.cncs li.cnc.on .nn{opacity:0}
.cncs .q{display:block;font-family:var(--f-display);font-style:italic;font-weight:500;
  font-size:clamp(19px,2.3cqw,38px);letter-spacing:-.04em;line-height:1.05;
  color:var(--primaria);margin-bottom:clamp(6px,.9cqh,14px);
  /* duas linhas reservadas: um rotulo que quebra (o patrimonio historico)
     empurraria so o seu texto para baixo e os tres deixariam de alinhar */
  min-height:2.1em;
  opacity:0;transition:opacity .45s ease .12s}
.cncs .tx{display:block;font-size:var(--fs-body);line-height:1.55;
  max-width:34ch;color:var(--tinta);
  opacity:0;transition:opacity .45s ease .2s}
.cncs li.cnc.on .q,.cncs li.cnc.on .tx{opacity:1}
body.esc .cncs .q,body.com-fundo .cncs .q{color:var(--acento-claro)}
body.terra .cncs .q{color:var(--papel)}
body.esc .cncs li.cnc.on .disco,body.terra .cncs li.cnc.on .disco{
  border-color:var(--acento-claro)}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */

/* nota com numero grande */
.notaN{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2cqw,28px);align-items:center;margin-top:clamp(18px,2.6cqh,40px);
  border-top:1px solid var(--hair);padding-top:clamp(12px,1.8cqh,22px)}
.notaN .nn{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,6.4cqw,104px);letter-spacing:-.06em;line-height:.9;color:var(--acento)}
.notaN .nt{font-size:var(--fs-item);line-height:1.5;max-width:34ch;color:var(--soft)}
/* foto full bleed */
.fbleed{position:absolute;top:0;right:0;bottom:0;width:48cqw;overflow:hidden;background:var(--tinta-5)}
.fbleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease}
.fbleed img.on{opacity:1}
.fbleed .slot{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  padding:clamp(18px,2.6cqw,42px);font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.65;color:var(--soft)}
.fbleed .slot b{color:var(--acento);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.fbleed .cred{position:absolute;left:clamp(18px,2.6cqw,42px);bottom:clamp(14px,2cqh,26px);font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.1em;color:var(--papel);text-shadow:0 1px 6px var(--tinta-80);opacity:0;transition:opacity .5s}
.fbleed .cred.on{opacity:.92}
.slide.temfoto{padding-right:calc(48cqw + clamp(22px,3cqw,56px))}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:960px) */

/* moldura do mapa */
.mapa{border:1.5px solid var(--acento);padding:0;background:var(--papel);position:relative}
.mapa::after{content:"";position:absolute;inset:5px;border:.5px solid var(--acento-35);pointer-events:none}
#minfo .mn,#minfo .mp,#minfo .md{transition:opacity .22s ease,transform .22s ease}
#minfo.trocando .mn,#minfo.trocando .mp,#minfo.trocando .md{opacity:0;transform:translateY(5px)}
.lote{cursor:pointer}
.lote path{transition:fill-opacity .18s,stroke-opacity .18s,stroke-width .18s}
.lote.on path{fill-opacity:.42!important;stroke-opacity:1!important;stroke-width:2.6!important}
/* ===== v3 · fundo morph + antes/depois ===== */
#msfundo{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;opacity:0;
  transition:opacity .8s ease;pointer-events:none}
#msveu{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s ease;
  background:linear-gradient(180deg,var(--tinta-40) 0%,transparent 30%,transparent 58%,var(--tinta-50) 100%)}
body.com-fundo #msfundo,body.com-fundo #msveu{opacity:1}
#palco{z-index:1}
body.com-fundo .slide.ativo{background:transparent}
body.com-fundo{color:var(--papel)}
body.com-fundo #quadro{background:var(--escuro)}
body.com-fundo .kick,body.com-fundo .sub{color:var(--papel-80)}
.ms-start{display:inline-flex;align-items:center;gap:11px;margin-top:clamp(22px,3.4cqh,44px);
  background:var(--acento);color:var(--papel);border:0;cursor:pointer;font-family:var(--f-mono);font-style:italic;
  font-size:var(--fs-body);letter-spacing:.02em;padding:11px 22px 10px;border-radius:100px;
  animation:convite 2.6s ease-in-out infinite}
.ms-start:hover{animation:none;filter:brightness(1.08)}
.ms-start i{font-style:normal;font-size:.8em;opacity:.85}
@keyframes convite{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pisca{animation:pisca 1060ms step-end infinite}
@keyframes pisca{50%{opacity:0}}
/* antes e depois */
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2cqw,34px);width:100%;align-items:stretch}
.dfig{position:relative;min-height:clamp(220px,52cqh,620px);background:var(--tinta-5);border:1px solid var(--hair);overflow:hidden}
.dfig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dfig.pb img{filter:grayscale(1) contrast(1.06)}
/* `caber` — a quarta posição da fig aceita classe, e esta troca o `cover` por
   `contain`. CROQUI NÃO SE RECORTA: em 17/09/2026 o croqui do reforço perdeu
   a cota de baixo e a última barra, porque a imagem é 4:3 e o slot é mais
   largo. Foto aguenta perder borda; desenho cotado, não. */
.dfig.caber img{object-fit:contain;background:var(--papel)}
/* `alto:1` no slide — par de imagens EM PÉ. O slot do duo é deitado, e
   imagem em pé dentro dele, contida, fica pequena no meio de duas faixas de
   branco. Aqui ele cresce até o que a página permite. Medido em 17/09/2026
   com a parede das fissuras: 0,75 de razão num slot 1,9:1 usava 40% da
   largura da coluna. */
.dcols.alto .dfig{min-height:clamp(260px,57cqh,820px)}
.dfig .slot{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  padding:clamp(14px,2cqw,28px);font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.6;color:var(--soft)}
.dfig .slot b{color:var(--acento);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.dfig .tag{position:absolute;top:0;left:0;background:var(--tinta);color:var(--papel);font-family:var(--f-display);
  font-style:italic;font-size:var(--fs-item);padding:7px 15px 6px;letter-spacing:-.02em}
.dfig.pb .tag{background:var(--tinta)}
.dfig.ag .tag{background:var(--acento)}
.dleg{font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:10px}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */


/* ═══ abertura de marca — gabarito `marca` ══════════════════════════════════
   Regra permanente (21/08/2026): toda apresentação abre por este slide, no
   arranjo fixado em agosto/2026 — marca, papel, slogan e site empilhados no
   mesmo eixo, bloco centrado à esquerda, fundo oliva, texto creme.
   O nome do projeto vem no slide seguinte, no gabarito `capa`.             */
.slide.g-marca{justify-content:center}
/* a abertura fica limpa: nada de secao, bolinhas ou contador sobre a marca */
body.na-marca .chrome{opacity:0;pointer-events:none}
.g-marca .frase{display:flex;flex-direction:column;align-items:flex-start;
  gap:clamp(9px,1.35cqh,20px)}
/* marca + papel: margem no <em>, NUNCA gap de flex — o gap descola o
   underscore do nome. Armadilha já paga duas vezes.                        */
.g-marca .sigla-mini{font-family:var(--f-display);font-weight:500;font-style:italic;
  font-size:clamp(11px,1.0cqw,20px);text-transform:lowercase;letter-spacing:-.01em;
  line-height:1;color:var(--papel-90)}
.g-marca .sigla-mini i{font-style:normal;color:var(--acento)}
.g-marca .sigla-mini em{font-family:var(--f-display);font-style:normal;font-weight:400;
  font-size:.68em;letter-spacing:.02em;text-transform:none;color:var(--papel-70);
  margin-left:1.1em;position:relative;top:-.04em}
.g-marca .slogan{font-family:var(--f-display);font-weight:500;font-style:italic;
  font-size:clamp(22px,3.75cqw,82px);text-transform:lowercase;letter-spacing:-.028em;
  line-height:1.04;color:var(--papel);white-space:nowrap}
.g-marca .slogan i{font-style:normal;color:var(--acento)}
.g-marca .site{font-family:var(--f-corpo);font-weight:400;
  font-size:clamp(10px,.78cqw,15px);letter-spacing:.14em;color:var(--papel-70);line-height:1}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:620px) */


/* cortina diagonal — a saída da abertura para o primeiro slide */
#mscortina{position:absolute;top:-12%;bottom:-12%;left:0;width:132%;z-index:95;
  pointer-events:none;background:var(--papel);
  border-left:3px solid var(--acento);border-right:3px solid var(--acento);
  transform:translateX(-134%) skewX(-14deg);visibility:hidden}
#mscortina.on{visibility:visible;transform:translateX(-2%) skewX(-14deg);
  transition:transform .60s cubic-bezier(.62,0,.30,1)}
#mscortina.sai{visibility:visible;transform:translateX(134%) skewX(-14deg);
  transition:transform .64s cubic-bezier(.55,0,.35,1)}

/* metas da capa de projeto — cliente · etapa · data */
.metas{display:flex;flex-wrap:wrap;gap:clamp(18px,2.6cqw,44px);
  margin-top:clamp(20px,3cqh,40px);padding-top:clamp(12px,1.8cqh,22px);
  border-top:1px solid var(--papel-25)}
.metas div{display:flex;flex-direction:column;gap:5px}
.metas .ml{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.2em;
  text-transform:uppercase;color:var(--papel-70)}
.metas .mv{font-family:var(--f-mono);font-style:italic;font-size:var(--fs-item);
  letter-spacing:-.02em;color:var(--papel)}
@media(prefers-reduced-motion:reduce){#mscortina{display:none}}

/* ═══ ajustes de 21/08/2026 ════════════════════════════════════════════════ */

/* pílula da abertura: igual à do capamorph_R6 — menor, só "começar" e a seta */
.g-marca .ms-start{margin-top:clamp(14px,2.2cqh,30px);font-style:normal;
  font-size:var(--fs-cap);letter-spacing:.16em;gap:.6em;
  padding:clamp(7px,.85cqh,11px) clamp(14px,1.35cqw,22px);animation:none}
.g-marca .ms-start:hover{gap:.95em;transform:translateY(-1px)}

/* fechamento: QR acima da marca, mesmo eixo */
.g-marca .qr{width:clamp(64px,7cqw,128px);line-height:0;border-radius:3px;
  overflow:hidden;box-shadow:0 0 0 1px var(--papel-15);margin-bottom:clamp(6px,1cqh,14px)}
.g-marca .qr svg{display:block;width:100%;height:auto}
.g-marca .assina{font-family:var(--f-display);font-weight:500;font-style:italic;
  font-size:clamp(26px,4.2cqw,90px);text-transform:lowercase;letter-spacing:-.03em;
  line-height:1;color:var(--papel)}
.g-marca .assina i{font-style:normal;color:var(--acento)}

/* divisor: o underscore piscante avisa que o assunto mudou.
   O terracota é EXCLUSIVO do divisor — nenhum outro slide usa. */
.divisor .dt i{font-style:normal;color:var(--papel);opacity:.72;margin-left:.06em}

/* chrome: as bolinhas e o rótulo de seção estavam apagados demais para ler */
.chrome{color:var(--tinta-80)}
body.esc .chrome,body.com-fundo .chrome{color:var(--papel-90)}
body.terra .chrome{color:var(--papel-90)}
.sdot{opacity:.42}
.sdot:hover{opacity:.8}
.sdot span{letter-spacing:.1em}
.sdot:hover span{opacity:1}
.chrome .secao .sn{opacity:.7}
/* == SELO DE SUB-MARCA no canto superior esquerdo ========================
   16/09/2026, pedido do Michel para a secao do museu: *"esse logo destacado,
   eu quero que ele apareca no canto superior esquerdo dos slides. Entao os
   slides do museu especificamente vao fugir um pouquinho a regra"*.

   O canto superior esquerdo ja era ocupado pelo indicador de secao (`03
   danos e estrutura`). Os dois nao cabem, e nao deveriam: dentro da secao do
   museu o proprio logo diz onde se esta, e o numero continua nos pontinhos
   do centro. Entao o selo SUBSTITUI o indicador enquanto vale, e o indicador
   volta sozinho no slide seguinte.

   ⚑ A assinatura do escritorio, no canto direito, NAO sai. Duas marcas na
   mesma barra e' o certo aqui: uma e' de quem apresenta, a outra e' do que
   esta sendo apresentado. Trocar a assinatura seria dizer que a peca e do
   museu, e nao e.

   Altura casada com a do texto que ele substitui, para a barra nao pular. */
/* ⚑ MASCARA, NAO <img>. O chrome se inverte sozinho conforme o fundo do
   slide (regra `em-imagem`), e um PNG colorido nao acompanharia: o logo
   Vinho sumiria sobre foto escura, e o negativo sumiria sobre desenho claro.
   Como mascara, o selo e' pintado por `background`, e entao obedece a mesma
   regra de tres superficies do resto da barra:
     slide claro  -> a cor da sub-marca
     slide escuro -> Cal
   Um arquivo so, nas duas situacoes, e sem ninguem escolher versao.

   ⚑ ARMADILHA, medida em 16/09/2026: mascara CSS passa por CORS, e `file://`
   tem origem `null` — o Chromium bloqueia, e o selo simplesmente nao aparece
   ao abrir o HTML direto do disco. Por http(s) da mesma origem funciona. Nao
   e' bug do selo nem do arquivo: conferir SEMPRE servindo, nunca por
   `file://`. (Falhar assim e o melhor dos casos: mascara que nao carrega
   apaga o elemento, nao pinta a caixa.) */
.chrome.topo .selo{display:block;height:clamp(24px,4cqh,46px);
  /* a proporcao vem do arquivo, medida uma vez pelo go() — sub-marca nova
     entra sem ninguem acertar largura na mao */
  aspect-ratio:var(--selo-ar,3.6);
  background:var(--m-marca,var(--tinta));
  -webkit-mask:var(--selo) no-repeat left center/contain;
          mask:var(--selo) no-repeat left center/contain}
body.em-imagem .chrome.topo .selo{background:var(--papel-90)}
body.em-imagem.claro .chrome.topo .selo{background:var(--m-marca,var(--tinta))}
/* ⚑ o `hidden` do HTML tem de vencer o display:block acima — sem isto
   sobra uma caixa sem mascara, e caixa sem mascara e o `background`
   inteiro: o retangulo Vinho que apareceu em todo slide fora da secao. */
.chrome.topo .selo[hidden]{display:none}
body.com-selo .chrome.topo .secao{display:none}
/* ⚑ na abertura o selo SAI: o lockup ja esta gigante no meio da tela, e a
   marca repetida em miniatura no canto so tira forca da entrada. */
body.em-logo .chrome.topo .selo{display:none}
body.em-logo .chrome.topo .secao{display:inline}


/* ══ SEQUENCIA — uma coisa só, camada por camada ═════════════════════════
   20/09/2026. Texto em 1/3 à esquerda, imagem em 2/3 à direita, uma etapa por
   vez, com controle próprio no slide.

   ⚑ A ETAPA É UM ELEMENTO SÓ. Legenda e imagem no mesmo `.passo`, empilhado
   sobre a área inteira, com a grade de 1/3 e 2/3 por dentro. Separados, o
   motor — que liga um passo por vez em ordem de documento — andava as sete
   legendas primeiro e só depois as sete imagens.

   ⚑ CROSSFADE E NADA MAIS. O `.passo` da casa entra com `translateY(14px)`,
   que é o certo para item de lista chegando. Aqui seria erro: as sete imagens
   são o MESMO telhado no MESMO enquadramento, e o que a sequência mostra é
   uma camada aparecendo sobre a anterior. Deslocar quebra o registro, e a
   pessoa deixa de ver "a manta entrou" para ver "a imagem trocou".

   ⚑ A ALTURA MANDA. O `.slide` é coluna flex; sem `flex:1;min-height:0` no
   caminho até a figura, ela só obedece à largura e estoura em tela larga e
   baixa (2560×1080 deu +307px na conferência).

   ⚑ SÓ A ÚLTIMA LIGADA APARECE. Os `.passo` acumulam. `:has(~ .passo.on)`
   apaga toda etapa que tenha uma etapa ligada DEPOIS dela — inclusive a base,
   que não é passo. Sobra exatamente a última ligada.                    ══ */
.g-sequencia .wrap{max-width:none;flex:1;min-height:0;display:flex;flex-direction:column}
.g-sequencia .seq{position:relative;flex:1;min-height:0;
  margin-top:clamp(10px,1.6cqh,26px)}
.g-sequencia .seq-etapa{position:absolute;inset:0;display:grid;
  grid-template-columns:1fr 2fr;gap:clamp(18px,2.4cqw,44px);
  opacity:0;transform:none;transition:opacity .5s ease}
.g-sequencia .seq-etapa:not(.passo),
.g-sequencia .seq-etapa.passo.on{opacity:1}
.g-sequencia .seq-etapa:has(~ .seq-etapa.passo.on){opacity:0}
/* ⚑ SEM TEXTO, A IMAGEM FICA COM A PRANCHA INTEIRA. O `sequencia` nasceu
   com 1/3 de texto e 2/3 de imagem. Numa sequencia construtiva que ainda
   nao recebeu as etiquetas — e ela e montada ANTES delas, porque a ordem
   dos quadros e o que se confere primeiro — a coluna da esquerda fica
   vazia e come um terco da tela. `:has()` detecta isso no proprio
   conteudo: nenhuma etapa com `.st` ou `.sd` preenchido, a grade vira uma
   coluna so. Quando os textos entrarem, o layout de 1/3 volta sozinho,
   sem ninguem mexer num campo. 02/11/2026. */
.g-sequencia .seq:not(:has(.st:not(:empty))):not(:has(.sd:not(:empty))) .seq-etapa{
  grid-template-columns:1fr}
.g-sequencia .seq:not(:has(.st:not(:empty))):not(:has(.sd:not(:empty))) .seq-cap{
  position:absolute;left:0;bottom:0;padding-bottom:0;z-index:2}

/* ancorada embaixo: a legenda cresce para CIMA a partir do rodape da
   coluna, e o `padding-bottom` guarda a faixa do controle. */
.g-sequencia .seq-cap{min-width:0;display:flex;flex-direction:column;
  justify-content:flex-end;padding-bottom:calc(var(--seta) + 30px)}
.g-sequencia .sq{display:block;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.16em;color:var(--acento);margin-bottom:5px}
.g-sequencia .st{display:block;font-family:var(--f-display);font-style:italic;
  font-size:var(--fs-h3);line-height:1.15;margin-bottom:clamp(6px,.9cqh,12px);
  color:var(--acento)}
/* o corpo sobe de `--fs-body` para `--fs-lead` e vai para o vinho: a leitura
   estava timida do lado de uma imagem que ocupa dois tercos da tela. */
.g-sequencia .sd{display:block;font-size:var(--fs-lead);line-height:1.45;
  color:var(--acento)}
.g-sequencia .sd ul{margin:clamp(8px,1.2cqh,16px) 0 0;padding-left:15px}
.g-sequencia .sd li{margin-bottom:5px}
.g-sequencia .sd b{color:var(--acento);font-weight:600}
/* ⚑ O GRIFO INVERTE porque o texto virou vinho: faixa cheia (100%) e letra
   no creme. A varredura e' a mesma — como a letra ja' nasce creme, a palavra
   e' PINTADA da esquerda para a direita quando a faixa passa. */
.g-sequencia .sd mark{--grifo-cor:var(--acento);color:var(--papel);
  padding:.04em .2em;margin:0 -.04em;font-weight:500}

.g-sequencia .seq-etapa img{min-width:0;min-height:0;width:100%;height:100%;
  object-fit:contain;object-position:center}

/* o controle fica FORA da pilha: dentro de uma etapa, esvaneceria com ela.
   Mesma pastilha da navegação do rodapé, porque faz a mesma coisa — só que
   dentro do slide e sem sair dele. */
/* ⚑ EM VINHO, NAO EM PAPEL. Pedido do Michel: o controle desta sequencia
   nao e' o chrome do rodape, e' parte do slide — a pessoa precisa achar que
   ali se clica. Cheio, na cor da marca. */
.g-sequencia .seqnav{position:absolute;left:0;bottom:0;z-index:2;
  display:inline-flex;align-items:center;gap:clamp(6px,.7cqw,11px);
  background:var(--acento);border:0;border-radius:999px;
  padding:clamp(4px,.4cqw,7px) clamp(6px,.6cqw,10px);
  box-shadow:0 2px 10px var(--acento-25);color:var(--papel)}
.g-sequencia .seqnav b{font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.1em;font-weight:400;opacity:.88;font-variant-numeric:tabular-nums;
  padding:0 clamp(2px,.3cqw,5px)}
.g-sequencia .seqnav button{width:var(--seta);height:var(--seta);border-radius:50%;
  border:0;background:var(--papel-20);color:var(--papel);cursor:pointer;
  font-size:calc(var(--fs-cap) * 1.05);line-height:1;display:grid;place-items:center;
  transition:background .16s ease,opacity .16s ease}
.g-sequencia .seqnav button:hover:not(:disabled){background:var(--papel-40)}
.g-sequencia .seqnav button:disabled{opacity:.42;cursor:default;background:var(--papel-10)}
@media (prefers-reduced-motion:reduce){.g-sequencia .seq-etapa{transition:none}}

/* ══ A ROTA, EM LISTA FIXA ═══════════════════════════════════════════════
   20/09/2026. O texto da parada saiu do mouseover do pino — o conteúdo do
   popover do Earth não recebe ponteiro — e virou lista na tela, ligada à
   camada "processo do café". Some junto com ela.

   Fica acima da legenda de camadas, na mesma coluna e na mesma língua: o
   canto direito é o chrome, o resto da tela é a paisagem.              ══ */
.g-earth-3d .rota{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(52px,7cqh,96px) + clamp(112px,17cqh,210px));
  z-index:3;display:none;flex-direction:column;gap:.05em;
  min-width:clamp(176px,15.5cqw,254px);max-width:clamp(176px,15.5cqw,254px);
  background:var(--tinta-60);border:1px solid var(--papel-20);border-radius:10px;
  padding:clamp(7px,.9cqh,12px) clamp(8px,.85cqw,13px)}
.g-earth-3d.com-cafe .rota{display:flex}
.g-earth-3d .rota h4{margin:0 0 .45em;font-family:var(--f-mono);
  font-size:calc(var(--fs-cap)*.9);letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;color:var(--papel-45)}
.g-earth-3d .rota button{display:grid;grid-template-columns:1.6em 1fr;
  align-items:baseline;gap:.15em .55em;width:100%;padding:.22em .4em;
  background:none;border:0;border-radius:6px;text-align:left;cursor:default;
  transition:background .14s ease}
.g-earth-3d .rota button:hover,.g-earth-3d .rota button:focus-visible{
  background:var(--papel-10);outline:none}
.g-earth-3d .rota .rn{font-family:var(--f-mono);font-size:calc(var(--fs-cap)*.95);
  color:var(--m-acento,var(--acento));font-variant-numeric:tabular-nums}
.g-earth-3d .rota .rt{font-family:var(--f-corpo);font-size:var(--fs-cap);
  font-weight:600;color:var(--papel-80);line-height:1.15}
.g-earth-3d .rota .rs{grid-column:2;font-family:var(--f-mono);
  font-size:calc(var(--fs-cap)*.82);letter-spacing:.03em;line-height:1.25;
  color:var(--papel-45)}
/* a porta da tulha: é ação, não parada — filete e cursor de clique */
.g-earth-3d .rota .rtul{margin-top:.3em;padding-top:.45em;
  border-top:1px solid var(--papel-20);cursor:pointer}
.g-earth-3d .rota .rtul .rt{color:var(--m-acento,var(--acento))}
/* o pino que a linha acende */
.g-earth-3d .anot.cafe.aceso u{transform:scale(1.35);
  background:var(--m-acento,var(--acento));color:var(--tinta)}

/* ══ A GAVETA DA TULHA ═══════════════════════════════════════════════════
   20/09/2026. Entra pela direita sobre o visor, sem tirar o 3D da tela: o
   Michel continua falando do conjunto enquanto mostra o que há por dentro.

   ⚑ A LEITURA É FIXA. Balão no cursor cobriria o desenho e saltaria de lugar
   a cada ponto. Aqui o texto troca numa faixa abaixo da figura, sempre no
   mesmo sítio, e o ponto ativo acende.                                  ══ */
.g-earth-3d .gaveta{position:absolute;top:0;right:0;bottom:0;z-index:40;
  width:min(46%,780px);display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--papel) 95%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-left:1px solid var(--tinta-15);box-shadow:-12px 0 44px var(--tinta-20);
  /* ⚑ A FAIXA DE CIMA E A DE BAIXO SAO DO CHROME. A marca mora no alto a
     direita e a pastilha de navegacao no rodape: sem reservar as duas, o
     titulo da gaveta entra por baixo do logo e a nota fica atras da
     pastilha. */
  padding:clamp(50px,7.4cqh,94px) clamp(16px,1.7cqw,32px) clamp(54px,8cqh,98px);
  transform:translateX(101%);visibility:hidden;
  transition:transform .42s cubic-bezier(.22,.61,.36,1),visibility 0s .42s}
.g-earth-3d .gaveta[data-on]{transform:none;visibility:visible;transition-delay:0s}
.g-earth-3d .gaveta .gfecha{position:absolute;top:clamp(50px,7.4cqh,94px);
  right:clamp(14px,1.4cqw,26px);width:var(--seta);
  height:var(--seta);border:0;border-radius:50%;background:var(--tinta-10);
  color:var(--tinta);cursor:pointer;font-size:var(--fs-cap);line-height:1;
  display:grid;place-items:center}
.g-earth-3d .gaveta .gfecha:hover{background:var(--tinta-20)}
.g-earth-3d .gkick{display:block;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.16em;text-transform:uppercase;color:var(--acento);
  padding-right:calc(var(--seta) + 14px)}
.g-earth-3d .gaveta h3{font-family:var(--f-display);font-style:italic;
  font-size:var(--fs-h3);line-height:1.12;margin:4px 0 clamp(5px,.8cqh,10px)}
.g-earth-3d .gsub{font-size:var(--fs-body);line-height:1.45;color:var(--soft);
  margin:0 0 clamp(8px,1.2cqh,16px)}

.g-earth-3d .gfig{position:relative;flex:1;min-height:0;display:flex}
.g-earth-3d .gfig img{width:100%;height:100%;object-fit:contain;object-position:center}
.g-earth-3d .gpt{position:absolute;translate:-50% -50%;width:clamp(21px,1.9cqw,32px);
  height:clamp(21px,1.9cqw,32px);border-radius:50%;border:0;cursor:pointer;
  background:var(--acento);color:var(--papel);font-family:var(--f-mono);
  font-size:var(--fs-cap);display:grid;place-items:center;padding:0;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--papel) 70%,transparent);
  transition:transform .18s ease,box-shadow .18s ease}
.g-earth-3d .gpt u,.g-earth-3d .gpt s{display:none}
.g-earth-3d .gpt:hover,.g-earth-3d .gpt[data-on]{transform:translate(0) scale(1.22);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--acento) 22%,transparent)}
.g-earth-3d .gpt[data-on]{background:var(--tinta)}

/* ⚑ ALTURA FIXA, NÃO MÍNIMA. Com `min-height` o bloco crescia conforme o
   texto, e a figura — que divide a mesma coluna flex — encolhia e voltava a
   cada ponto: o "soquinho" que o Michel viu. Fixa a altura, a figura fica
   parada e o texto longo rola dentro do próprio bloco. */
/* ⚑ O GRIFO NÃO ESPERA AQUI. O atraso padrão de 640 ms existe para o grifo
   chegar depois dos `rev` do slide. Dentro da gaveta o texto é recriado a
   cada ponto que se pousa o mouse, e esperar meio segundo a cada troca seria
   sentido como travamento. */
.g-earth-3d .gler{--gd:90ms;border-top:1px solid var(--tinta-15);
  padding-top:clamp(7px,1cqh,13px);margin-top:clamp(7px,1cqh,13px);
  height:clamp(96px,15cqh,178px);overflow:auto}
.g-earth-3d .gler b{display:block;font-family:var(--f-display);font-style:italic;
  font-size:calc(var(--fs-body) * 1.18);color:var(--acento);margin-bottom:3px}
.g-earth-3d .gler b::before{content:attr(data-n) " · ";font-family:var(--f-mono);
  font-style:normal;font-size:var(--fs-cap);letter-spacing:.1em;opacity:.7}
.g-earth-3d .gler span{display:block;font-size:var(--fs-body);line-height:1.45;
  color:var(--soft)}
.g-earth-3d .gnota{font-size:var(--fs-cap);line-height:1.4;color:var(--soft);
  opacity:.8;margin:clamp(6px,.9cqh,12px) 0 0}
@media (prefers-reduced-motion:reduce){.g-earth-3d .gaveta{transition:none}}

/* ══ MEIA — texto de um lado, desenho do outro ═══════════════════════════
   20/09/2026. Meio a meio: o texto lê no ritmo de parágrafo e o desenho
   ocupa metade da tela, sem virar miniatura de legenda.

   ⚑ A ALTURA MANDA, como no `sequencia`: `flex:1;min-height:0` em todo o
   caminho até a figura, e `object-fit:contain` na caixa flexionada. Sem
   isso a imagem só obedece à largura e estoura em tela baixa.         ══ */
.g-meia .wrap{max-width:none;flex:1;min-height:0;display:flex;flex-direction:column}
.g-meia .meia{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(20px,2.8cqw,52px);margin-top:clamp(10px,1.6cqh,26px)}
/* `largo:1` — quando a figura é que manda. Meio a meio é o certo para um
   desenho só; para prancha composta, metade da tela transforma a figura em
   miniatura e o texto em parede. 1/3 e 2/3, como no `sequencia`. */
.g-meia .meia.largo{grid-template-columns:1fr 2fr}
.g-meia .mtx{min-width:0;display:flex;flex-direction:column;justify-content:center;
  font-size:var(--fs-lead);line-height:1.5;color:var(--soft)}
.g-meia .mtx p{margin:0 0 .75em}
.g-meia .mtx p:last-child{margin-bottom:0}
.g-meia .mtx b{color:var(--tinta);font-weight:600}
.g-meia .mfig{min-width:0;min-height:0;display:flex;flex-direction:column;
  gap:clamp(5px,.7cqh,10px)}
.g-meia .mfig img{flex:1;min-height:0;width:100%;object-fit:contain;
  object-position:center}
.g-meia .mleg{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.08em;
  color:var(--soft);text-align:right}

/* == `meia` com PILHA de imagens — o carrossel institucional ===============
   30/10/2026. `meia` ganhou `imgs:[...]`: a metade direita vira um carrossel
   que anda sozinho, no mesmo relogio do gabarito `carrossel` (MSCarrossel).
   Serve a abertura institucional — tres slides de texto com a mesma pilha de
   obras correndo ao lado, sem que o avanco do slide reinicie a sequencia.

   ⚑ `cover`, nao `contain`. A regra do contain vale para DESENHO, que nao
   pode ser cortado. Aqui sao FOTOGRAFIAS de proporcao variada: com contain a
   imagem pula de tamanho a cada troca e a metade direita fica cheia de vazio.
   Se a pilha for de desenho, usar o gabarito `carrossel`.                   */
.g-meia .full{position:relative;flex:1;min-height:0;overflow:hidden;
  border-radius:2px;background:var(--moldura)}
.g-meia .full img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;opacity:0;transition:opacity .9s ease}
.g-meia .full img.on{opacity:1}
.g-meia .cont-c{display:flex;gap:6px;justify-content:flex-end;
  font-family:var(--f-mono)}
.g-meia .cont-c u{text-decoration:none;display:block;width:5px;height:5px;
  border-radius:50%;background:var(--tinta-20)}
.g-meia .cont-c u.on{background:var(--tinta-80)}
/* `meia` com `src` E `imgs`: a imagem do `src` vai para a coluna da ESQUERDA
   (mapa, diagrama) e a pilha corre na direita. */
.g-meia .mtx .mfigesq{display:block;width:100%;max-height:30cqh;
  object-fit:contain;object-position:center;margin:0 auto}
/* legenda por imagem da pilha: uma por vez, no mesmo cross-fade. A faixa tem
   altura propria para o layout nao pular quando a legenda troca de 1 para 2
   linhas — e' o mesmo motivo pelo qual as imagens usam `cover`. */
.g-meia .legs{position:relative;min-height:2.6em;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.08em;color:var(--soft);text-align:right}
/* ⚑ DUAS TARJAS SOLIDAS NAO PODEM SE CRUZAR. Com legenda em texto puro o
   cross-fade some; com a tarja Vinho, por um instante aparecem dois
   retangulos sobrepostos com dois textos — foi o que o Michel viu na
   captura ("Casa do Artesao" por cima de "Museu da Energia"). A troca
   passa a ser por VAZIO: a que sai apaga em .3s, a que entra espera .35s. */
.g-meia .legs span{position:absolute;inset:0;opacity:0;transition:opacity .3s ease}
.g-meia .legs span.on{opacity:1;transition:opacity .45s ease .35s}

/* ══ `meia` COM SANGRIA — a metade direita vai ate a borda ════════════════
   02/11/2026, pedido do Michel: *"a metade direita, onde aparecem as
   imagens, elas devem ser tela cheia, sem espaco branco nenhum em volta"*.
   Cara de revista: a foto encosta no papel em tres lados e a coluna de
   texto respira do outro.

   ⚑ A SANGRIA E OPT-IN (`sangra:1`). Ela sai do `padding` do `.slide` por
   margem negativa — e o `.slide` tem padding em cima TAMBEM para o chrome
   (logotipo, bolinhas de secao). Ligada num `meia` que tenha titulo no topo
   da prancha, a foto sobe por tras do titulo. Aqui funciona porque com
   `estados` o titulo mora DENTRO da coluna da esquerda.

   ⚑ A COLUNA DA ESQUERDA NAO MUDA DE LARGURA. A sangria so estica a figura
   para dentro das margens; o grid continua 1fr 1fr, medido no espaco util.
   Esticar a coluna de texto junto jogaria a primeira letra contra a borda.*/
/* ⚑ SANGRIA POR POSICIONAMENTO, NAO POR MARGEM NEGATIVA. A primeira versao
   puxava a figura para fora com margem negativa nos quatro lados. Nao
   funciona: num item de grid esticado, a altura da LINHA ja foi decidida
   pela coluna de texto, e a margem negativa SOMA a essa altura em vez de
   recortar — a figura saiu com 1308px numa tela de 1080 e o validador
   acusou +242px de transbordo. Medido em 02/11/2026.

   Fora do fluxo, a figura se posiciona contra o `.slide`, que e o ancestral
   posicionado mais proximo, e `inset:0` chega a borda REAL do papel.

   ⚑ `left:50%` nao e aproximacao, e identidade. A caixa de conteudo do
   slide e a largura menos duas goteiras; com `gap:0` a segunda coluna de
   `1fr 1fr` comeca em `gut + (L - 2*gut)/2`, que e exatamente `L/2`. Por
   isso o respiro entre texto e foto vai no `padding-right` da coluna da
   esquerda, nunca no `gap`: mexer no gap desalinha a conta.             */
.g-meia .meia.sangra{gap:0;margin-top:0}
.g-meia .meia.sangra .mtx{padding-right:clamp(20px,2.8cqw,52px)}
/* ⚑ A FIGURA EM SANGRIA NAO SE DESLOCA AO ENTRAR. `.rev` entra com
   `translateY(14px)`, que e o certo para um bloco que tem folga em volta.
   Aqui a figura ocupa a tela INTEIRA: deslocar 14px para baixo empurra a
   borda de baixo para fora e o slide ganha 14px de rolagem — constante em
   toda tela, que foi como o validador apontou. Fica so o esvanecimento. */
.g-meia .meia.sangra .mfig{position:absolute;inset:0 0 0 50%;margin:0}
.g-meia .meia.sangra .mfig.rev{transform:none}

/* ══ `espelho:1` — a sangria troca de lado ═══════════════════════════════
   02/11/2026. Duas pranchas seguidas com a foto a direita leem como uma
   so; espelhar a segunda e o que faz a dupla respirar. A figura vai para
   a metade ESQUERDA e o texto para a direita.
   ⚑ As tres contas do lado direito viram as mesmas do esquerdo, trocadas:
   a figura fica `inset:0 50% 0 0`, o respiro passa para o `padding-left`
   da coluna, e o masthead recolhe para a metade DIREITA — que e onde a
   Cal esta agora. Trocar so a figura deixaria o logotipo em cima dela. */
/* ⚑ `order` NAO MOVE UM ITEM SOZINHO NUM GRID DE UM ITEM SO. Com a figura
   fora do fluxo (`position:absolute`), o grid tem um unico filho, e o
   posicionamento automatico o joga na PRIMEIRA coluna qualquer que seja o
   `order` — o texto foi parar debaixo da foto, invisivel. A coluna se
   nomeia: `grid-column:2`. */
.g-meia .meia.sangra.espelho .mtx{grid-column:2;padding-right:0;
  padding-left:clamp(20px,2.8cqw,52px)}
.g-meia .meia.sangra.espelho .mfig{inset:0 50% 0 0}
body.meia-sangra.espelho .chrome.topo{right:0;
  left:calc(50% - var(--gut) + clamp(20px,2.8cqw,52px))}
/* a legenda continua ocupando a largura da figura; so muda de borda. Zerar
   o `left` encolheria a caixa e o texto quebraria letra a letra. */
.g-meia .meia.sangra.espelho .legs{text-align:right}
.g-meia .meia.sangra.espelho .legs span{left:auto;right:0}
.g-meia .meia.sangra.espelho .cont-c{right:auto;left:clamp(16px,1.8cqw,34px)}
.g-meia .meia.sangra .full{border-radius:0}
/* ══ O MASTHEAD RECOLHE PARA O PAPEL ═════════════════════════════════════
   02/11/2026. A primeira resposta ao logotipo sobre a foto foi um veu de
   Cal na faixa do chrome. O Michel nao gostou — e tinha razao: o veu
   conserta o sintoma sujando a foto, que e justamente o que a sangria
   queria limpar.

   A resposta certa e tirar o chrome de cima da foto. Numa prancha com
   sangria o topo recolhe para a metade do papel, e logotipo, secao e
   bolinhas passam a morar no mesmo alinhamento da coluna de texto — que e
   onde a Cal esta, e onde o logotipo Vinho foi desenhado para viver. A
   foto fica inteira, sem veu.

   `right:50%` mais o respiro da coluna: o logotipo encosta exatamente na
   mesma vertical em que o texto termina. As bolinhas recentram no meio da
   metade esquerda (`left:25%`), nao no meio da tela.                    */
/* a conta: o chrome tem `padding:0 var(--gut)`, entao a borda do conteudo
   fica `gut` para dentro da caixa. Para o logotipo terminar na MESMA
   vertical em que o texto termina (50% menos o respiro da coluna), o
   `right` devolve esse `gut`. */
body.meia-sangra .chrome.topo{
  right:calc(50% - var(--gut) + clamp(20px,2.8cqw,52px))}
body.meia-sangra .chrome.topo .dots{left:50%}
/* ⚑ NA PRANCHA INSTITUCIONAL O LOGOTIPO SAI DO CHROME E ENTRA NA COLUNA.
   No resto da peca ele e assinatura de canto, pequena, porque o assunto e
   o projeto. Aqui o assunto E a casa — e entao ele nao e chrome, e
   conteudo: mora no bloco de texto, acima do kicker, no mesmo recuo do
   titulo e das datas, e cresce ate o corpo de um cabecalho de revista.

   A primeira tentativa foi reordenar o selo DO CHROME para a esquerda. Nao
   serve: o chrome e uma faixa de altura fixa colada no alto da tela, entao
   o logotipo ficava ancorado no topo do papel e nao no bloco de texto —
   que foi o que o Michel apontou. Aqui ele anda junto com o texto.     */
/* ⚑ ESCONDER O `.selo` NAO BASTA: o logotipo do canto e o `.marca`
   (LOGO_CANTO), nao o selo de sub-marca. Com so o selo escondido a peca
   saiu com o logotipo DUAS vezes — o pequeno no alto e o grande na
   coluna. Os dois saem; na prancha institucional o unico logotipo e o
   que mora no texto. */
body.inst .chrome.topo .selo,
body.inst .chrome.topo .marca,
body.inst .chrome.topo .secao{display:none}
.g-meia .mest .lk{display:block;width:clamp(150px,15cqw,290px);
  margin:0 0 clamp(18px,2.8cqh,40px)}
.g-meia .mest .lk svg{display:block;width:100%;height:auto}
/* ⚑ legenda e bolinhas SOBEM PARA CIMA DA FOTO. Fora da sangria elas moram
   embaixo, na coluna flex; aqui nao ha "embaixo" — embaixo e a borda da
   tela. Viram camada, ancorada no canto inferior da propria figura. */
.g-meia .meia.sangra .legs{position:absolute;inset:auto auto
    calc(var(--bot) + clamp(6px,1cqh,18px)) clamp(16px,1.8cqw,34px);
  right:clamp(16px,1.8cqw,34px);min-height:0;text-align:left;z-index:2}
.g-meia .meia.sangra .legs span{position:absolute;inset:auto auto 0 0;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* ⚑ A LEGENDA SOBRE FOTO PEDE TARJA, NAO VARREDURA. A varredura e
   translucida: serve sobre papel, e sobre uma foto de contraste variavel
   some na metade clara. Aqui e campo cheio no Vinho, com a Cal por cima —
   a mesma `mark.tarja` da casa, aplicada pelo gabarito e nao pelo texto. */
/* corpo proprio, maior que a legenda de rodape: o Michel pediu forca aqui
   porque e a legenda que conta o que a Sarasa faz, obra por obra, enquanto
   a pilha corre. Quem para para ler, le isto. */
.g-meia .meia.sangra .legs{font-size:clamp(11px,.92cqw,16px)}
.g-meia .meia.sangra .legs span{background:var(--primaria);color:var(--papel);
  padding:.46em .85em .52em;border-radius:2px;letter-spacing:.08em;
  font-weight:600}
.g-meia .meia.sangra .cont-c{position:absolute;inset:auto
    clamp(16px,1.8cqw,34px) calc(var(--bot) + clamp(6px,1cqh,18px)) auto;
  z-index:2}
.g-meia .meia.sangra .cont-c u{background:var(--papel-40)}
.g-meia .meia.sangra .cont-c u.on{background:var(--papel)}

/* ══ MOSAICO — tres colunas que correm, em vez de uma foto por vez ═══════
   02/11/2026, pedido do Michel: *"a ideia e subdividir isso em tres
   colunas verticais... a da esquerda sobe lentamente, a do meio desce, e a
   da direita sobe tambem... quase que imediato eu vou enxergar muitas
   fotos"*. O carrossel mostra UMA obra bem; o mosaico mostra a EXTENSAO
   da casa. Sao argumentos diferentes, e por isso convivem: o mosaico
   abre, o carrossel fica no slide dos servicos.

   ⚑ A COLUNA TRAZ A LISTA DUAS VEZES e anda exatamente -50%. E o que faz
   a volta ser invisivel: ao chegar em -50% o que esta na tela e a copia,
   pixel a pixel igual ao quadro inicial, e o salto para 0 nao se ve.
   Qualquer outro valor mostra a emenda.

   ⚑ DIRECOES E TEMPOS DIFERENTES POR COLUNA. Tres colunas subindo juntas
   leem como UMA imagem grande rolando. Alternar o sentido e desencontrar
   os tempos (38s / 31s / 44s) e o que faz o conjunto parecer muitas obras
   em vez de uma parede andando.

   ⚑ `prefers-reduced-motion` PARA TUDO, e o mosaico continua servindo:
   parado, ele e uma grade de obras, que e a mensagem. Nao ha informacao
   so no movimento.                                                      */
.g-meia .mos{position:absolute;inset:0;overflow:hidden;display:grid;
  grid-template-columns:repeat(3,1fr);gap:var(--mos-gap,3px);
  background:var(--moldura)}
.g-meia .mos .col{position:relative;overflow:hidden}
.g-meia .mos .fita{display:flex;flex-direction:column;gap:var(--mos-gap,3px);
  position:absolute;left:0;right:0;top:0;will-change:transform}
/* ⚑ ALTURA NATURAL, SEM PROPORCAO FORCADA. Travar tudo em 3/4 corta uma
   panoramica ate sobrar um naco do meio — e o pedido era "no melhor
   enquadramento possivel". Cada foto entra inteira, na sua proporcao, e a
   coluna fica com alturas desiguais: e o que faz a parede parecer um
   mosaico de revista em vez de uma grade de fichas. */
.g-meia .mos .fita img{width:100%;height:auto;display:block}
@keyframes ms-mos-sobe{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes ms-mos-desce{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.g-meia .mos .col:nth-child(1) .fita{animation:ms-mos-sobe 38s linear infinite}
.g-meia .mos .col:nth-child(2) .fita{animation:ms-mos-desce 31s linear infinite}
.g-meia .mos .col:nth-child(3) .fita{animation:ms-mos-sobe 44s linear infinite}
@media(prefers-reduced-motion:reduce){
  .g-meia .mos .fita{animation:none!important}}

/* == `meia` com ESTADOS — um slide, varios textos ==========================
   30/10/2026. Antes, a abertura institucional eram TRES slides `meia` com a
   mesma pilha de dez fotos. Dois custos: o avanco re-animava a metade direita
   (o carrossel nao reinicia, mas o slide entra de novo, e a troca aparece),
   e o montar embutia as dez imagens UMA VEZ POR SLIDE — 3,78 MB para 1,26 MB
   de foto. Agora e UM slide com `estados:[{kick,t,cap,src}]`: a metade
   direita fica parada e so a coluna da esquerda troca, a cada clique.

   ⚑ A ETAPA E UM ELEMENTO SO — a mesma armadilha do `sequencia`. Cabecalho e
   texto no MESMO `.passo`: separados, o motor (que liga um `.passo` por vez,
   em ordem de documento) andaria os tres titulos primeiro e so depois os tres
   textos. Por isso o `kick` e o `t` do estado descem para dentro da coluna da
   esquerda, em vez de ficarem na faixa de largura total do topo.

   ⚑ SO A ULTIMA LIGADA APARECE. `:has(~ .mest.passo.on)` apaga todo estado
   que tenha um estado ligado DEPOIS dele — inclusive o primeiro, que nao e
   passo. Sobra exatamente a ultima ligada.

   ⚑ A ALTURA VEM DA GRADE, nao de medicao. Todos os estados caem na MESMA
   celula (`grid-area:1/1`), entao a coluna nasce com a altura do maior e nada
   salta na troca — o mesmo motivo pelo qual a faixa de `legs` tem altura
   propria.

   ⚑ CROSSFADE E NADA MAIS, como no `sequencia`: o `.passo` da casa entra com
   `translateY`, que e certo para item de lista chegando. Aqui a coluna esta
   ancorada ao lado de uma imagem parada, e deslocar faria o texto deslizar
   contra ela.                                                             */
.g-meia .mtx.estados{display:grid;justify-content:stretch}
.g-meia .mest{grid-area:1/1;min-width:0;display:flex;flex-direction:column;
  justify-content:center;opacity:0;transform:none;transition:opacity .5s ease}
.g-meia .mest:not(.passo),
.g-meia .mest.passo.on{opacity:1}
.g-meia .mest:has(~ .mest.passo.on){opacity:0}
/* ESTADO DE SERVICOS — lista de verbetes, nao texto corrido. 30/10/2026,
   pedido do Michel: *"esta muito texto corrido, esta um pouco chato"*. O
   rotulo (Projetos, Investigacao, Oficios...) sai do meio do paragrafo,
   vira cabeca de verbete em display italico na primaria, e o que ele
   enumera desce para a linha de baixo. Mesmo texto, outra leitura.        */
.g-meia .mest.servicos p{margin:0 0 clamp(6px,.85cqh,12px);line-height:1.4}
.g-meia .mest.servicos p b{display:block;font-family:var(--f-display);
  font-style:italic;font-weight:500;letter-spacing:-.035em;line-height:1.05;
  font-size:clamp(15px,1.35cqw,24px);color:var(--primaria);
  margin-bottom:clamp(1px,.2cqh,3px)}
body.esc .g-meia .mest.servicos p b{color:var(--acento-claro)}
/* o cabecalho do estado: mesma tipografia do topo, so que dentro da coluna */
.g-meia .mest .kick{margin-bottom:clamp(6px,1cqh,14px)}
/* ⚑ o titulo volta a TINTA. A coluna inteira e `--soft` — ela e texto de
   apoio ao lado da imagem —, e o h1 herdava isso: no topo do slide, onde
   ele morava antes, a cor vinha do chrome. Dentro da coluna, herdada, a
   chamada saia mais fraca que o proprio corpo do texto. */
.g-meia .mest h1{color:var(--tinta);margin:0 0 clamp(16px,2.4cqh,34px)}
body.esc .g-meia .mest h1,body.terra .g-meia .mest h1{color:var(--papel)}

/* ══ A SERIFADA NO SLOGAN — `serif:1` no estado ═══════════════════════════
   02/11/2026. EM EXPERIMENTO: o §3 da MARCA-SARASA deixou serifada x sans em
   aberto, a decidir vendo o primeiro deck. Isto e esse deck. Playfair
   Display entra pelo bloco da marca em duas faces, e so o slogan a usa —
   corpo, rotulo e chrome seguem Poppins/Archivo.

   ⚑ A DIDONE NAO ACEITA O TRACKING DA CASA. O `h1` do motor traz
   `letter-spacing:-.045em`, que e o certo para a geometrica: fecha o
   rio entre letras de haste reta. Numa didone, o contraste grosso-fino JA
   e o que aperta a palavra — somar tracking negativo encosta a serifa de
   uma letra na barriga da outra, e some com o par `fi`. Aqui volta a zero.

   ⚑ E NAO ACEITA `lowercase`. O motor baixa a caixa de todo titulo, que na
   Poppins le como assinatura. A didone tem maiuscula desenhada para ser
   vista — e o slogan e justamente onde ela deve aparecer. `none`.        */
.g-meia .mest.serif h1{font-family:var(--f-serif);font-style:italic;
  font-weight:400;letter-spacing:0;text-transform:none;line-height:1.04;
  font-size:clamp(25px,2.75cqw,47px);
  margin:0 0 clamp(10px,1.5cqh,21px)}
/* `manchete:1` — o slogan em corpo de capa de revista. Peso 700 e
   entrelinha fechada: numa didone, titulo grande pede MENOS entrelinha,
   porque a altura-x alta ja separa as linhas sozinha. */
.g-meia .mest.serif.manchete h1{font-weight:700;line-height:.95;
  font-size:clamp(44px,5.9cqw,104px);margin:0 0 clamp(16px,2.5cqh,36px)}

/* ══ BOTAO DE PILULA VAZADA — `botao:{t,url}` no estado ══════════════════
   02/11/2026. Contorno e texto no Vinho, fundo nenhum: solido ele viraria
   o elemento mais pesado da prancha e disputaria com a manchete, que e
   quem tem de ganhar. Vazado, convida sem gritar.
   ⚑ `pointer-events:auto`: o palco inteiro e area de clique para avancar
   de slide, entao um link dentro dele precisa reivindicar o ponteiro — e
   `stopPropagation` no clique, senao abrir o site avanca a prancha junto. */
.g-meia .mest .bt{display:inline-flex;align-items:center;gap:.55em;
  align-self:start;margin-top:clamp(18px,2.8cqh,40px);
  font-family:var(--f-corpo);font-weight:600;
  font-size:clamp(11px,.92cqw,16px);letter-spacing:.06em;
  color:var(--primaria);text-decoration:none;
  padding:.72em 1.35em;border:1.5px solid var(--primaria);border-radius:999px;
  pointer-events:auto;cursor:pointer;
  transition:background .25s ease,color .25s ease}
.g-meia .mest .bt:hover,.g-meia .mest .bt:focus-visible{
  background:var(--primaria);color:var(--papel)}
.g-meia .mest .bt .sq{font-style:normal;transition:transform .25s ease}
.g-meia .mest .bt:hover .sq{transform:translateX(3px)}
body.esc .g-meia .mest .bt{color:var(--papel);border-color:var(--papel)}
body.esc .g-meia .mest .bt:hover{background:var(--papel);color:var(--primaria)}

/* ══ LINHA DO TEMPO no estado — `linha:[[ano,texto],…]` ══════════════════
   02/11/2026. Os marcos da casa, resumidos da apresentacao institucional.
   Filete vertical a esquerda e um marco por linha: cabe onde um paragrafo
   nao caberia, e e o formato em que uma trajetoria se le de relance.
   ⚑ O ano em `tabular-nums`: sem isso o 1 estreito da didone desalinha a
   coluna de anos, e e justamente a coluna que da a leitura de sequencia. */
/* ⚑ UM GRID SO PARA A LISTA INTEIRA, nao um por linha. Com `display:grid`
   em cada `li`, cada linha mede a propria coluna de ano e o texto comeca
   alguns pixels adiante ou atras do vizinho — some a coluna, que e o que
   faz a sequencia ser lida como sequencia. `display:contents` no `li`
   entrega os dois filhos ao grid do `ul`, que entao alinha todos.
   Alinhar por `tabular-nums` nao resolveria: a feature `tnum` nao
   sobrevive ao subset das faces da marca — e nao deve, pelo peso. */
.g-meia .mest .tl{list-style:none;margin:0;padding:0 0 0 clamp(13px,1.5cqw,26px);
  border-left:1.5px solid color-mix(in srgb,var(--primaria) 24%,transparent);
  display:grid;grid-template-columns:auto minmax(0,1fr);
  column-gap:clamp(10px,1.1cqw,20px);row-gap:clamp(7px,1.05cqh,15px);
  align-items:baseline;
  /* o bloco descola do lead: a linha do tempo e outra camada de leitura,
     e colada nele parecia continuacao do paragrafo. */
  margin-top:clamp(14px,2.2cqh,32px)}
.g-meia .mest .tl li{display:contents}
/* a data em pilula Vinho. ⚑ `justify-self:start` mais largura minima: sem
   os dois, a pilula estica ate a coluna inteira num grid `auto` e as de
   ano curto ficam com ar sobrando dentro. */
/* ⚑ a data em SANS, nao na serifada. A didone e para a manchete e para o
   lead — o que se le devagar. A data dentro de uma pilula e rotulo: pede
   a face de rotulo da casa, que e o que o resto da peca usa para numero
   e metadado. Serifada aqui vira enfeite em cima de enfeite. */
.g-meia .mest .tl .an{font-family:var(--f-corpo);font-style:normal;
  font-weight:600;color:var(--papel);background:var(--primaria);
  font-size:clamp(11px,.92cqw,16px);letter-spacing:.04em;line-height:1;
  justify-self:start;padding:.34em .72em .4em;border-radius:999px;
  white-space:nowrap}
body.esc .g-meia .mest .tl .an{background:var(--papel);color:var(--primaria)}
/* ⚑ A LINHA DO TEMPO ENTRA DO PASSADO PARA O FUTURO, um marco de cada vez.
   Nao e enfeite: a ordem da animacao E a leitura — a casa comecou ali e
   chegou aqui. Por isso o atraso cresce com o indice, e por isso ela so
   dispara quando o estado acende (`.on`), nunca na carga da prancha.
   O indice vem do proprio grid, com `--tli` escrito no render: contar por
   `nth-child` nao serve, porque `display:contents` no `li` faz o ano e o
   texto virarem irmaos no mesmo grid. */
.g-meia .mest .tl .an,.g-meia .mest .tl .mk{
  opacity:0;transform:translateY(7px)}
.mest:not(.passo) .tl .an,.mest:not(.passo) .tl .mk,
.mest.passo.on .tl .an,.mest.passo.on .tl .mk{
  opacity:1;transform:none;
  transition:opacity .42s ease,transform .42s cubic-bezier(.2,.7,.3,1);
  transition-delay:calc(var(--tld,.5s) + var(--tli,0)*.17s)}
@media(prefers-reduced-motion:reduce){
  .g-meia .mest .tl .an,.g-meia .mest .tl .mk{
    opacity:1!important;transform:none!important;transition:none!important}}
.g-meia .mest .tl .mk{font-size:clamp(12px,1cqw,17px);line-height:1.35;
  color:var(--soft)}
body.esc .g-meia .mest .tl{border-left-color:var(--papel-40)}
body.esc .g-meia .mest .tl .an{color:var(--acento-claro)}
/* o lead: a primeira linha do corpo, em serifada romana, maior. E o que da
   a passada de olho — quem le so uma frase, le esta. */
.g-meia .mest.serif .lead{display:block;font-family:var(--f-serif);
  font-style:normal;font-weight:400;color:var(--tinta);
  font-size:clamp(13px,1.05cqw,18px);line-height:1.42;
  margin:0 0 clamp(8px,1.2cqh,17px);max-width:44ch}
body.esc .g-meia .mest.serif .lead{color:var(--papel)}
/* filete entre o lead e os verbetes — a regra de revista */
/* o filete do lead sai quando ha linha do tempo: dois filetes a dois
   centimetros um do outro disputam, e o da linha do tempo carrega
   informacao. */
.g-meia .mest.serif:has(.tl) .lead::after{display:none}
.g-meia .mest.serif .lead::after{content:"";display:block;
  width:clamp(38px,4cqw,72px);height:1.5px;background:var(--primaria);
  margin-top:clamp(7px,1cqh,14px)}

/* ══ OS DADOS DO INSTITUCIONAL — verbete, nao paragrafo ═══════════════════
   O `<b>` de cada paragrafo (70 anos, tres geracoes, nove estados) vira
   numero de verbete: serifada, no Vinho, em corpo maior que o texto que
   explica. Mesma mecanica do estado de `servicos`, outra escala — la o
   rotulo e uma palavra de categoria, aqui e um DADO, e o dado e o que a
   pessoa leva embora de uma passada de olho. */
.g-meia .mest.dados p{margin:0 0 clamp(8px,1.2cqh,17px);max-width:40ch}
.g-meia .mest.dados p b{display:block;font-family:var(--f-serif);
  font-style:normal;font-weight:400;letter-spacing:-.01em;line-height:1;
  font-size:clamp(17px,1.7cqw,30px);color:var(--primaria);
  margin-bottom:clamp(2px,.35cqh,5px)}
body.esc .g-meia .mest.dados p b{color:var(--acento-claro)}

/* ══ GRIFO ═══════════════════════════════════════════════════════════════
   `<mark>` vale em qualquer texto de qualquer gabarito, como `<b>`.

   20/09/2026 — passa de TARJA a VARREDURA. A regra antiga era acento cheio
   com texto em papel: serve para uma palavra dentro de uma célula, e foi
   para isso que nasceu. Sobre uma oração inteira de texto corrido ela deixa
   de grifar e passa a interromper — vira caixa, e o olho lê a caixa antes da
   frase. A varredura cobre só a metade de baixo da linha, como caneta que
   não sobe até o topo da letra: marca a palavra e a oração igualmente bem.

   A tarja continua disponível em `<mark class="tarja">`, para o caso curto
   em campo apertado. Nenhum deck usava `<mark>` quando isto mudou.
   ═══════════════════════════════════════════════════════════════════════ */
/* ⚑ MESMA MECANICA DO `.grifo`, acima: uma so' forma de grifar no motor.
   Faixa alta (a cobertura do destaque do navegador, nao os 44% de baixo) e
   varredura da esquerda para a direita quando o slide se revela. O tom cai
   de 35% para 20% porque a area dobrou — no tom de antes viraria bloco. */
mark{
  /* ⚑ O AMARELO DO NAVEGADOR. `mark` traz `background-color:yellow` do UA, e
     a faixa e' translucida: sem zerar a cor de fundo, o grifo sai verde-limao
     em vez do acento. Antes isso nao aparecia porque a regra usava o atalho
     `background`, que ja zera a cor; agora so' a imagem e' declarada. */
  background-color:transparent;
  background-image:linear-gradient(var(--grifo-cor,var(--acento-20)),
                                   var(--grifo-cor,var(--acento-20)));
  background-repeat:no-repeat;
  background-position:0 .14em;
  background-size:0% calc(100% - .22em);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  color:inherit;padding:0 .14em;margin:0 -.14em;border-radius:2px;
  font-style:inherit}
.revelado mark{animation:ms-grifo 620ms cubic-bezier(.62,0,.30,1) forwards;
  animation-delay:var(--gd,640ms)}
/* ⚑ dentro de um passo, a varredura espera o passo acender — senao ela
   acontece atras de uma linha ainda invisivel e a linha entra com o grifo
   pronto. */
.revelado .passo mark{animation:none}
.revelado .passo.on mark{animation:ms-grifo 620ms cubic-bezier(.62,0,.30,1) forwards;
  animation-delay:var(--gdp,220ms)}
body.esc mark,body.com-fundo mark{--grifo-cor:var(--papel-20)}
body.terra mark{--grifo-cor:var(--papel-20)}
@media(prefers-reduced-motion:reduce){
  mark{background-size:100% calc(100% - .22em)!important;animation:none!important}}
mark.tarja{background:var(--acento);color:var(--papel);padding:.12em .42em .16em;
  border-radius:2px;font-weight:500;margin:0;animation:none}
body.esc mark.tarja{background:var(--acento-claro);color:var(--tinta)}
table.tb th mark{letter-spacing:.16em}

/* nota de ressalva: quando o número é leitura nossa, não dado declarado */
.notaN .nn{font-family:var(--f-display);font-weight:500;color:var(--acento)}

/* colisao de nome: `.seta` ja era o botao redondo de navegacao do chrome,
   e a seta da pilula saia dentro de um circulo. O markup segue igual ao do
   R6; o reset e local.                                                    */
.ms-start .seta{width:auto;height:auto;border:0;border-radius:0;display:inline;
  background:none;color:inherit;font-size:inherit;font-style:normal;opacity:.85;
  transform:none;cursor:inherit}

/* antes e depois: legenda sobre a foto, slot so quando a imagem nao carrega */
.dfig .slot{opacity:0;pointer-events:none}
.dfig.semimg .slot{opacity:1}
.dfig .dcap{position:absolute;left:0;right:0;bottom:0;padding:clamp(26px,4cqh,52px) clamp(12px,1.4cqw,20px) clamp(9px,1.2cqh,14px);
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.1em;color:var(--papel-90);
  background:linear-gradient(to top,var(--tinta-80),transparent)}
.dfig.semimg .dcap{display:none}

/* o terracota cheio ficou reservado ao divisor de secao. O kicker em barra
   passa para a oliva, para nao competir com a troca de assunto. */
.kick.barra{background:var(--primaria);color:var(--papel)}
body.esc .kick.barra,body.com-fundo .kick.barra{background:var(--papel-10);color:var(--papel)}

/* ═══ ajustes de 22/08/2026 ════════════════════════════════════════════════ */

/* caixa de texto mais larga: o título vinha muito empilhado na esquerda */
.mega{max-width:24ch}
.big{max-width:26ch}
.sub{max-width:66ch}
.wrap.largo .sub{max-width:74ch}

/* lista larga — texto maior e rótulo de uma palavra só */
ol.lista.largo li{grid-template-columns:clamp(78px,7.6cqw,132px) 1fr}
ol.lista.largo .t{font-size:clamp(15px,1.52cqw,25px);line-height:1.48}
ol.lista.largo .q{font-size:clamp(10px,.86cqw,14px);letter-spacing:.16em}

/* a nota de número não precisa de fio próprio: as linhas da tabela bastam */
.notaN{border-top:0;padding-top:0;margin-top:clamp(20px,3cqh,44px)}

/* ─── mapa em sangria: metade direita de fora a fora, sem moldura ───
   O mapa do cluster é denso; a moldura terracota estrangulava a leitura. */
.mcols.sang{display:block}
.mcols.sang .mtxt{max-width:min(100%,640px)}
/* a moldura dupla de terracota e do mapa emoldurado; na sangria ela sai */
.mapa.sang::after{display:none}
.mapa.sang{position:absolute;top:0;right:0;bottom:0;width:48cqw;border:0;
  padding:0;background:var(--papel-2);display:block;overflow:hidden}
.mapa.sang svg{width:100%;height:100%;max-height:none;display:block}
.slide.temmapa{padding-right:calc(48cqw + clamp(22px,3cqw,56px))}
/* legenda empilhada na vertical, debaixo do texto */
.mcols.sang .leg{flex-direction:column;gap:clamp(6px,.86cqh,11px);align-items:flex-start}
.mcols.sang .leg span{display:flex;align-items:center}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:960px) */


/* fotinha do empreendimento no painel de informação do mapa */
#minfo{display:grid;grid-template-columns:1fr;gap:clamp(10px,1.4cqw,18px);align-items:start}
#minfo:has(.mfoto){grid-template-columns:clamp(78px,7.4cqw,124px) 1fr}
#minfo .mfoto{display:block;line-height:0;overflow:hidden;background:var(--tinta-5);
  aspect-ratio:3/4;border:1px solid var(--hair)}
#minfo .mfoto img{width:100%;height:100%;object-fit:cover;display:block}
#minfo .mtx{display:block;min-width:0}
body.esc #minfo .mfoto,body.terra #minfo .mfoto{border-color:var(--papel-25)}

/* ─── revelação por clique: o fio varre da esquerda, o texto desce ───
   Rápido, mas com ênfase. Vale para as fichas de porte e para as jogadas. */
.passo.etapa{opacity:1;transform:none;border-top-color:transparent;position:relative}
.passo.etapa::before{content:"";position:absolute;left:0;right:0;top:-1.5px;height:1.5px;
  background:currentColor;transform:scaleX(0);transform-origin:left center;
  transition:transform .40s cubic-bezier(.52,0,.18,1)}
.passo.etapa.on::before{transform:scaleX(1)}
.passo.etapa>*{opacity:0;transform:translateY(-11px);
  transition:opacity .28s ease,transform .28s cubic-bezier(.3,.8,.3,1)}
.passo.etapa.on>*{opacity:1;transform:none}
.passo.etapa.on>*:nth-child(1){transition-delay:.30s}
.passo.etapa.on>*:nth-child(2){transition-delay:.36s}
.passo.etapa.on>*:nth-child(3){transition-delay:.42s}
.passo.etapa.on>*:nth-child(4){transition-delay:.48s}
.passo.etapa.on>*:nth-child(5){transition-delay:.54s}
@media(prefers-reduced-motion:reduce){
  .passo.etapa::before{transform:scaleX(1)}
  .passo.etapa>*{opacity:1;transform:none;transition:none}
}

/* ─── fechamento: bolinhas no alto ao centro, setas no pé à direita ───
   Some só o rótulo de seção e o nome do projeto, que ali seriam repetição. */
body.no-fim .secao,body.no-fim .chrome.topo .marca,body.no-fim .chrome.pe .pj{opacity:0}
body.no-fim .chrome{opacity:1;pointer-events:none}
body.no-fim .dots,body.no-fim .nav{pointer-events:auto}
/* no slide de mapa em sangria a marca do alto-direita cairia sobre o mapa */
body:has(.slide.ativo.temmapa) .chrome.topo .marca{opacity:0}

/* o painel do mapa e posicionado por bottom:0 — o translateY de entrada do
   .rev o empurrava 14 px para fora e criava barra de rolagem. Entra so em
   opacidade. */
.mapa.sang.rev,.revelado .mapa.sang.rev{transform:none}
/* o crédito da foto batia no contador do chrome; sobe acima do rodapé */
.fbleed .cred{bottom:calc(var(--bot) + clamp(6px,1cqh,12px))}
/* na foto de sangria a marca do alto-direita também cairia sobre a imagem */
body:has(.slide.ativo.temfoto) .chrome.topo .marca{opacity:0}
/* numeração da lista sobre a oliva: o terracota cheio some no fundo verde */
body.esc ol.lista .q,body.com-fundo ol.lista .q{color:var(--acento-claro)}
body.terra ol.lista .q{color:var(--papel)}

/* ═══ 22/08/2026 · o rótulo da linha é título, e título é grande ═══════════
   Vale para toda lista: "âncoras / regra / mix", os números 01–04, as datas
   de encaminhamento. Mesmo tratamento do trio (tempo/memória/domínio):
   DM Mono 500 itálico, caixa-baixa, terracota. O texto corrido não muda.
   Exceção: a linha do tempo ao lado da foto de sangria, onde o rótulo é
   data de acontecimento e não cabeça de assunto.                          */
ol.lista li{grid-template-columns:clamp(104px,10.6cqw,208px) 1fr;
  gap:clamp(14px,2cqw,34px);align-items:baseline}
ol.lista .q{font-family:var(--f-display);font-weight:500;font-style:italic;
  font-size:clamp(19px,2.5cqw,42px);letter-spacing:-.045em;line-height:1.02;
  text-transform:lowercase;color:var(--acento)}
ol.lista.largo li{grid-template-columns:clamp(120px,12cqw,240px) 1fr}
ol.lista.largo .q{font-size:clamp(21px,2.85cqw,50px);letter-spacing:-.05em}

/* a linha do tempo da foto de sangria mantém a data pequena */
.slide.temfoto ol.lista li{grid-template-columns:clamp(46px,4.6cqw,78px) 1fr;
  gap:clamp(10px,1.4cqw,22px)}
.slide.temfoto ol.lista .q{font-family:var(--f-mono);font-weight:400;font-style:normal;
  font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;line-height:1.5}

/* ═══ 22/08/2026 · segunda rodada ══════════════════════════════════════════ */

/* alinhamento: o rótulo grande centra com o bloco de texto, não flutua no topo */
ol.lista li{align-items:center}
ol.trio li{align-items:center}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */


/* ─── mapa em sangria: as três faixas ficam ancoradas ───────────────────
   Antes tudo dividia o mesmo fluxo, então o painel de hover empurrava o
   título e o layout dançava a cada passagem de mouse. Agora: título e
   legenda grudados no alto, painel de informação grudado no pé, e o vazio
   fica no meio. Nada se move.                                          */
.slide.temmapa{justify-content:stretch}

.frcols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,3.6cqw,72px);

/* ─── popover de justificativa ───────────────────────────────────────────

mark.pop{cursor:help;position:relative;transition:filter .2s}

/* a caixa é terracota e nasce colada à linha do elemento que a abriu.

/* ═══ 22/08/2026 · terceira rodada ═════════════════════════════════════════ */

.jogada .jd ul.jsub{list-style:none;margin-top:.7em;display:grid;gap:.55em}

.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));

.pgo i{display:block;width:clamp(13px,1.24cqw,21px);height:clamp(13px,1.24cqw,21px);

.pgo i:nth-child(2){animation-delay:.07s}

/* ═══ fundo morph no divisor de seção · padrão travado em 22/08/2026 ═══════
   Copiado de modulos/divisor-morph.html. Véu do divisor a 0,60 — quase o
   triplo do véu do índice (0,18) — porque o divisor carrega o maior tipo do
   deck, e a trama compete com o título. Não recalibrar.                   */
/* (o véu do divisor migrou para #msveu-d, no bloco do segundo canvas) */

/* especificidade: body.com-fundo pinta o corpo de oliva e venceria o
   body.terra do divisor por vir depois na folha. Mesmo conflito que o
   .slide.ativo{background:transparent} resolveu na abertura. */
body.com-fundo.terra #quadro{background:var(--acento)}
body.com-fundo.terra .kick,body.com-fundo.terra .sub{color:var(--papel-70)}
/* o chrome invertido do divisor tem de sobreviver ao com-fundo */
body.com-fundo.terra .chrome{color:var(--papel-90)}

/* ═══ o segundo canvas: o fundo dos divisores ══════════════════════════════
   Mesma geometria do primeiro, empilhado atrás do palco. Só um dos dois
   aparece por vez, e o que não aparece está pausado pelo go(). */
#msfundo-d{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;
  opacity:0;transition:opacity .8s ease;pointer-events:none}
#msveu-d{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  background:var(--acento);transition:opacity .3s ease}
#msveu-d::after{content:"";position:absolute;inset:0;opacity:.5;
  background:linear-gradient(180deg,var(--acento) 0%,transparent 26%,
                             transparent 74%,var(--acento) 100%)}
body.fundo-div #msfundo-d{opacity:1}
body.fundo-div #msveu-d{opacity:.60}   /* travado em 22/08/2026 */
/* no divisor o canvas e o véu da marca somem, e vice-versa */
body.fundo-div #msfundo,body.fundo-div #msveu{opacity:0}

/* ═══ 23/08/2026 · legibilidade e grifo ════════════════════════════════════ */

/* o terracota cheio sobre a oliva some. O `lista` já tinha o clareado; o
   `trio` e o `jogadas` não tinham, e é ali que o texto ficava ilegível. */
body.esc ol.trio .q,body.com-fundo ol.trio .q{color:var(--acento-claro)}
body.terra ol.trio .q{color:var(--papel)}
body.esc .jogada .jn,body.esc .jogada .jt{color:var(--papel)}
body.esc .frt{color:var(--acento-claro)}

/* ─── grifo — a faixa que destaca a frase ────────────────────────────────
   Trazido da apresentação da Lavro (mecânica de 22/08). Não é negrito: é
   marca de caneta POR TRÁS do texto, que se desenha da esquerda para a
   direita. Usa background-size animado em vez de pseudo-elemento absoluto,
   para acompanhar a quebra de linha com box-decoration-break: clone.     */
.grifo{
  background-image:linear-gradient(var(--grifo-cor,var(--acento-20)),var(--grifo-cor,var(--acento-20)));
  background-repeat:no-repeat;
  background-position:0 .14em;
  background-size:0% calc(100% - .22em);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .14em;margin:0 -.14em;border-radius:2px}
.revelado .grifo{animation:ms-grifo 620ms cubic-bezier(.62,0,.30,1) forwards;
  animation-delay:var(--gd,760ms)}
@keyframes ms-grifo{to{background-size:100% calc(100% - .22em)}}
/* sobre oliva e terracota a marca inverte para o creme */
body.esc .grifo,body.com-fundo .grifo{--grifo-cor:var(--papel-20)}
body.terra .grifo{--grifo-cor:var(--papel-20)}
@media(prefers-reduced-motion:reduce){
  .grifo{background-size:100% calc(100% - .22em)!important;animation:none!important}}

/* R$ nunca vira r$: os títulos são caixa-baixa, o símbolo da moeda não */
.ru{text-transform:none}

/* subitens da jogada com bolinha, não traço */
.jogada .jd ul.jsub li::before{width:.42em;height:.42em;border-radius:50%;
  background:currentColor;opacity:.75;top:.55em}

/* linha de tabela fora do estudo: o valor também apaga */
table.tb tr.fora td{opacity:.38}

/* o texto de apoio do dado vive no popover, não no slide */
.dado .n{display:none}
.dado.tem{cursor:help;position:relative;transition:border-color .22s}
.dado.tem .l::after{content:"+";margin-left:.5em;font-family:var(--f-mono);
  opacity:.5;transition:opacity .22s}
/* no hover o dado inteiro assume o destaque: a linha, o número e o rótulo */
.dado.tem:hover,.dado.tem.aberto{border-top-color:var(--acento)}
.dado.tem:hover .v,.dado.tem.aberto .v,
.dado.tem:hover .l,.dado.tem.aberto .l{color:var(--acento)}
.dado.tem:hover .l::after,.dado.tem.aberto .l::after{opacity:1}
body.esc .dado.tem:hover,body.esc .dado.tem.aberto{border-top-color:var(--acento-claro)}
body.esc .dado.tem:hover .v,body.esc .dado.tem.aberto .v,
body.esc .dado.tem:hover .l,body.esc .dado.tem.aberto .l{color:var(--acento-claro)}
.dado .v,.dado .l{transition:color .22s ease}
/* os dois slides da carteira: texto ancorado no topo, para o isométrico e o
   título ficarem parados na tela enquanto só o conteúdo da direita troca */
.pcols.alto{align-items:start}
.pcols.alto .wrap{padding-top:clamp(10px,2.4cqh,44px)}
.pcols.alto .notaN{margin-top:clamp(16px,2.4cqh,34px)}

/* ─── só trama: o mesmo carrossel da marca, sob véu quase opaco ──────────
   Nos slides verdes de conteúdo o fundo não é imagem, é textura. O véu vai
   a 0,90 e troca o gradiente diagonal por oliva chapada: a foto some, o
   pontilhado continua respirando. Nenhum contexto WebGL novo.           */
body.fundo-trama #msveu{background:var(--escuro);opacity:.90;
  transition:opacity .45s ease,background-color .45s ease}
body.fundo-trama #msfundo{opacity:1}
body.fundo-trama .slide.ativo{background:transparent}

/* ─── carteira: dois estados no mesmo slide ──────────────────────────────
   Os dois blocos ocupam a MESMA célula de grade, então a caixa cresce pelo
   mais alto e nada salta quando um troca pelo outro. O isométrico e o
   título ficam fora dessa troca — não re-animam. */
.trbox{display:grid;margin-top:clamp(14px,2.2cqh,30px)}
.trbox>.tr{grid-area:1/1;transition:opacity .42s ease,transform .42s ease}
.tr-b{opacity:0;transform:translateY(9px);pointer-events:none}
.tr-b.on{opacity:1;transform:none;pointer-events:auto}
.trbox:has(.tr-b.on) .tr-a{opacity:0;transform:translateY(-9px);pointer-events:none}
.trbox .notaN{margin-top:clamp(14px,2cqh,26px)}
.trbox .dados{margin-top:clamp(14px,2cqh,28px)}
/* o slide da carteira divide a tela ao meio: o desenho tem sete volumes */
.pcols.meia{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pcols.meia .iso svg{max-height:60cqh}
@media(prefers-reduced-motion:reduce){.trbox>.tr{transition:none}}
/* na meia tela o número e o texto empilham: lado a lado a coluna de texto
   ficava com quatro palavras por linha */

.pcols.meia .notaN .nt{max-width:46ch}
.pcols.meia .notaN .nn{font-size:clamp(34px,5.2cqw,86px)}

/* ═══ 23/08 · duas frentes: pílula, subtítulo e item numerado ══════════════ */
.frcab{display:flex;flex-direction:column;align-items:flex-start;

body.esc .frsub{color:var(--papel-70)}
.frl li{grid-template-columns:auto 1fr;gap:clamp(10px,1.2cqw,20px);align-items:baseline}

body.esc .tt,body.com-fundo .tt{color:var(--acento-claro)}

.frcols{align-items:start}
.frcx{position:relative;padding:clamp(11px,1.5cqh,18px) clamp(12px,1.15cqw,19px);

.smgrid{display:grid;grid-template-columns:repeat(var(--smc,3),minmax(0,1fr));

   O tratamento responsivo por gabarito que existia aqui foi retirado em
