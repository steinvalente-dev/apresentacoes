const FS=`#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D uA,uB;
uniform vec2 uRes,uSA,uSB,uM;
uniform float uT,uTime,uAmp,uEdge,uDot,uAng,uAng2,uContrast,uGamma,uMode,uTrans,
              uGrain,uZoom,uAcc,uVig,uBleed,uFit,uCur,uMAmt,uMRad,uEnter;
uniform vec3 uInk,uPaper,uAccent;

float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.5);return fract(p.x*p.y*95.43);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float bayer(vec2 p){
  int x=int(mod(p.x,8.0)),y=int(mod(p.y,8.0));
  int m[64]=int[64](0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21);
  return (float(m[y*8+x])+0.5)/64.0;
}
// enquadra (contain ou sangria) e devolve luminância; uBleed vira linha em massa tonal
float lum(sampler2D t, vec2 imgSize, vec2 uv){
  float ca=uRes.x/uRes.y, ia=imgSize.x/imgSize.y;
  vec2 sc = uFit>0.5 ? (ca>ia ? vec2(1.0,ca/ia) : vec2(ia/ca,1.0))

  vec2 q=(uv-0.5)/(sc*(uFit>0.5?1.0:0.86))+0.5;
  if(q.x<-0.05||q.x>1.05||q.y<-0.05||q.y>1.05) return 1.0;
  vec2 qq=vec2(clamp(q.x,0.0,1.0),1.0-clamp(q.y,0.0,1.0));
  vec4 c=mix(texture(t,qq),textureLod(t,qq,2.0+uBleed*4.5),uBleed);
  float l=mix(1.0, dot(c.rgb,vec3(0.299,0.587,0.114)), c.a);

}

  uv=(uv-0.5)*(1.0-uZoom*br)+0.5+vec2(sin(uTime*0.07),cos(uTime*0.05))*uZoom*0.35;

  // ---- cursor ---------------------------------------------------------------
  float asp=uRes.x/uRes.y;
  vec2 mp=uM/uRes;
  vec2 dm=(uv-mp)*vec2(asp,1.0);
  float rr=length(dm)/(max(uMRad,1.0)/uRes.y);

    float row=floor((uv.y-mp.y)/rowH);
    float h=hash(vec2(row,t2));
    float tear=step(0.55,h)*step(abs(uv.y-mp.y),rowH*1.6)*step(abs(uv.x-mp.x),0.06+0.10*uMAmt);
    uv.x+=(h-0.5)*0.045*uMAmt*tear;
    glitch=max(band,tear*0.55);
    cellMod=1.0+band*0.6*uMAmt;
  }

  // ---- luminâncias das duas peças ------------------------------------------
  float t=uT;
  vec2 n=vec2(fbm(uv*2.6+uTime*0.03), fbm(uv*2.6+7.3-uTime*0.025))*2.0-1.0;
  float bump=sin(t*3.14159);
  vec2 dA=uv+pxA, dB=uv+pxB;
  if(uTrans<0.5){ dA+=n*uAmp*t*bump; dB-=n*uAmp*(1.0-t)*bump; }
  float a=clamp((lum(uA,uSA,dA)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float b=clamp((lum(uB,uSB,dB)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float vA=pow(1.0-a,uGamma), vB=pow(1.0-b,uGamma);

  // frente que varre da esquerda para a direita
  float soft=0.06+uEdge*0.55;
  float front=mix(-soft,1.0+soft,t);
  float w=clamp((front-uv.x+soft)/(2.0*soft),0.0,1.0);

  float cell=max(uDot*cellMod,2.0);
  vec2 p=gl_FragCoord.xy-0.5*uRes;
  vec2 q=rot(radians(uAng+angMod))*p;
  float v=0.0, ink=0.0, band=0.0;

  if(uTrans<0.5){                                  // morph — dissolução por ruído
    float th=mix(fbm(uv*7.5+31.7),vnoise(uv*uRes.x/26.0),0.35);
    float e=clamp(uEdge,0.02,1.0);
    float lo=th*(1.0-e);
    float k=smoothstep(lo,lo+e,t);
    v=mix(vA,vB,k);
    band=smoothstep(0.42,0.5,k)*(1.0-smoothstep(0.5,0.58,k));
  }else if(uTrans<1.5){                            // entrelaço — cada ponto escolhe um lado
    float own=step(hash(floor(q/cell)+0.5),w);
    v=mix(vA,vB,own);
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else if(uTrans<2.5){                            // serigrafia — duas telas, dois ângulos
    vec2 qB=rot(radians(uAng+angMod+uAng2))*p;
    float iA=cover(q ,cell,sqrt(max(vA*(1.0-w),0.0))*cell*0.70)*smoothstep(0.0,0.02,vA*(1.0-w));
    float iB=cover(qB,cell,sqrt(max(vB*w      ,0.0))*cell*0.70)*smoothstep(0.0,0.02,vB*w);
    ink=1.0-(1.0-iA)*(1.0-iB);
    v=vA*(1.0-w)+vB*w;
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else{                                           // maré — a massa do desenho conduz
    float th=mix(uv.x,1.0-vA,0.42);
    float k=smoothstep(th-soft,th+soft,front);
    v=mix(vA,vB,k);
    v*=1.0-0.30*exp(-pow((front-th)/soft,2.0)*2.0);
    band=exp(-pow((front-th)/soft,2.0)*2.0);
  }
  v*=light;

  if(uTrans>1.5&&uTrans<2.5){                      // serigrafia já montou a tinta
  }else if(uMode<0.5){ ink=cover(q,cell,sqrt(max(v,0.0))*cell*0.70); }
  else if(uMode<1.5){ ink=1.0-smoothstep(-0.8,0.8,abs(mod(q.y,cell)-cell*0.5)-v*cell*0.5); }
  else if(uMode<2.5){ ink=step(bayer(gl_FragCoord.xy/max(1.0,cell/6.0)),v); }
  else { ink=v; }
  ink*=smoothstep(0.0,0.05,v);

  /* ---- entrada diagonal: a trama nasce ao longo de uma reta inclinada ---- */
  float sx=uv.x+(uv.y-0.5)*0.26;                 // eixo da varredura, ~14° de inclinação
  float bandW=0.30;
  float fEnter=uEnter*(1.0+2.0*bandW)-bandW;
  float rev=clamp((fEnter-sx)/bandW+0.5,0.0,1.0);
  float fio=exp(-pow((sx-fEnter)/0.0045,2.0))*step(0.001,uEnter)*step(uEnter,0.999);
  ink*=rev; band=mix(band,0.0,1.0-rev);

  vec3 tinta=mix(uInk,uAccent,clamp(band,0.0,1.0)*uAcc);
  vec3 col=mix(uPaper,tinta,clamp(ink,0.0,1.0));
  col=mix(col,uAccent,clamp(fio,0.0,1.0)*0.85);
  col=mix(col,uAccent,glitch*0.12*uMAmt);
  col+= (hash(gl_FragCoord.xy+fract(uTime)*97.0)-0.5)*uGrain;
  float d=length((uv-0.5)*vec2(asp,1.0));
  col=mix(col,uPaper*0.96+uInk*0.04,smoothstep(0.42,0.95,d)*uVig);
  frag=vec4(col,1.0);
}`;

function montar(cv, IMGS, OPT){
  OPT = OPT || {};
  const gl=cv.getContext('webgl2',{antialias:false,powerPreference:'low-power'});
  if(!gl) return {entrada(){},pausar(){}};
  function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);gl.bindVertexArray(gl.createVertexArray());
  const U={};for(const k of ['uA','uB','uRes','uSA','uSB','uM','uT','uTime','uAmp','uEdge','uDot',
   'uAng','uAng2','uContrast','uGamma','uMode','uTrans','uEnter','uGrain','uZoom','uAcc','uVig',
   'uBleed','uFit','uCur','uMAmt','uMRad','uInk','uPaper','uAccent'])U[k]=gl.getUniformLocation(pr,k);
  gl.uniform1i(U.uA,0);gl.uniform1i(U.uB,1);
  const P={trans:2,cur:3,mode:0,fit:1,dot:4.5,angle:22,angle2:32,bleed:.42,contrast:.65,
    gamma:1.45,amp:.08,edge:1.0,speed:.30,zoom:.01,accent:0,grain:0,vig:.86,mforce:.46,mrad:240};
  const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
  /* padrão de fábrica da engine (preset "linha MS"), só para chamada sem
     opções. O deck NUNCA cai aqui: subir() passa a paleta lida dos tokens. */
  const INK=hex(OPT.ink||'#0e0f0b'),PAPER=hex(OPT.paper||'#6B6A4B'),
        ACC=hex(OPT.acc||'#B85C38'),SCALE=OPT.scale||0.9;
  /* paleta trocável em tempo real: MSFundo.montar(...).cor({paper:tok('--acento')}) */
  const COR={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};
  const ALVO={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};
  function prep(src){
    if(OPT.prep===false) return src;   // já pré-exposta no arquivo
    const w=src.naturalWidth,h=src.naturalHeight;
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
    let d;try{d=x.getImageData(0,0,w,h);}catch(e){return src;}
    const a=d.data;let s=0,n=0;
    for(let k=0;k<a.length;k+=64){s+=(a[k]*.299+a[k+1]*.587+a[k+2]*.114)/255;n++;}
    const mean=s/Math.max(n,1); if(mean>=0.45) return src;
    const g=Math.max(0.42,Math.log(0.50)/Math.log(Math.max(mean,0.03)));
    const lut=new Uint8Array(256);for(let v=0;v<256;v++)lut[v]=Math.round(255*Math.pow(v/255,g));
    for(let k=0;k<a.length;k+=4){a[k]=lut[a[k]];a[k+1]=lut[a[k+1]];a[k+2]=lut[a[k+2]];}
    x.putImageData(d,0,0);return c;
  }
  function mkTex(raw){
    const src=prep(raw);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.generateMipmap(gl.TEXTURE_2D);
    return {tex:t,w:src.width||src.naturalWidth,h:src.height||src.naturalHeight};
  }
  let S=[],i=0,t=0,clock=0,last=performance.now(),ready=false,visible=true,paused=false;
  let mx=0,my=0,tmx=0,tmy=0,mAmt=0,mOn=false,enter=1,enterT=0;
  const easeOut=x=>1-Math.pow(1-x,3);
  function resize(){const d=Math.min(devicePixelRatio||1,2)*SCALE;
    cv.width=Math.round(cv.clientWidth*d)||Math.round(innerWidth*d);
    cv.height=Math.round(cv.clientHeight*d)||Math.round(innerHeight*d);
    gl.viewport(0,0,cv.width,cv.height);}
  addEventListener('resize',resize);resize();
  addEventListener('pointermove',e=>{const k=cv.width/(cv.clientWidth||innerWidth);
    tmx=e.clientX*k;tmy=cv.height-e.clientY*k;
    if(mAmt<0.02){mx=tmx;my=tmy;}mOn=true;});
  addEventListener('pointerleave',()=>mOn=false);
  document.addEventListener('visibilitychange',()=>{visible=!document.hidden; if(visible) acorda();});
  if('IntersectionObserver' in window)
    new IntersectionObserver(e=>{visible=e[0].isIntersecting&&!document.hidden; if(visible) acorda();},{threshold:.01}).observe(cv);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) paused=true;
  let FILA=IMGS.slice();
  if(OPT.sortear){ for(let j=FILA.length-1;j>0;j--){
    const r=Math.floor(Math.random()*(j+1)); const t=FILA[j]; FILA[j]=FILA[r]; FILA[r]=t; } }
  (async()=>{ for(const src of FILA){
    const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>r(null);x.src=src;});
    if(im) S.push(mkTex(im)); if(S.length===2) ready=true;
    await new Promise(r=>setTimeout(r,0));
  } if(S.length) ready=true; })();
  /* ⚑ O laço PARA quando pausado. Até 04/09/2026 `pausar(true)` só congelava
     o relógio: o rAF e o gl.drawArrays continuavam a 60 fps em TODO slide,
     inclusive sob o mapa e o globo — um shader de 2× fbm por pixel em tela
     cheia, invisível (canvas em opacity 0), disputando a GPU com o Maps.
     Medido em Chromium com WebGL em software (SwiftShader): o fundo sozinho
     derrubava um slide de texto de 38 para 2,5 fps. Em GPU de verdade é
     barato; quando a aceleração cai (driver, atualização do Chrome), é o
     que trava a peça. Agora: pausado desenha UM último quadro e sai do laço;
     `pausar(false)`/`entrada()` religam. `visible` (aba oculta) idem. */
  let rafId=null;
  function acorda(){ if(rafId===null) rafId=requestAnimationFrame(frame); }
  function frame(now){
    rafId=null;
    if(!visible){ last=now; return; }                       /* aba oculta: dorme até o visibilitychange */
    if(!ready){ last=now; rafId=requestAnimationFrame(frame); return; }  /* texturas a caminho: espera sem desenhar */
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(!paused){clock+=dt;t+=dt*P.speed*0.5;if(t>=1){t=0;i=(i+1)%S.length;}}
    const A=S[i],B=S[(i+1)%S.length],k=cv.width/(cv.clientWidth||innerWidth);
    const kp=1-Math.exp(-dt*9.05),ka=1-Math.exp(-dt*4.35);
    mx+=(tmx-mx)*kp;my+=(tmy-my)*kp;mAmt+=((mOn?1:0)-mAmt)*ka;
    if(enter<1){enterT+=dt;enter=Math.min(1,easeOut(Math.max(0,enterT-0.15)/1.45));}
    const kc=1-Math.exp(-dt*3.2);
    for(const nome of ['ink','paper','acc'])
      for(let c=0;c<3;c++) COR[nome][c]+=(ALVO[nome][c]-COR[nome][c])*kc;
    const e0=t*t*(3-2*t);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.tex);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.tex);
    gl.uniform2f(U.uRes,cv.width,cv.height);
    gl.uniform2f(U.uSA,A.w,A.h);gl.uniform2f(U.uSB,B.w,B.h);gl.uniform2f(U.uM,mx,my);
    gl.uniform1f(U.uT,Math.min(1,Math.max(0,(e0-0.5)*1.55+0.5)));
    gl.uniform1f(U.uTime,clock);gl.uniform1f(U.uEnter,enter);
    gl.uniform1f(U.uDot,P.dot*k);gl.uniform1f(U.uAng,P.angle);gl.uniform1f(U.uAng2,P.angle2);
    gl.uniform1f(U.uBleed,P.bleed);gl.uniform1f(U.uContrast,P.contrast);gl.uniform1f(U.uGamma,P.gamma);
    gl.uniform1f(U.uAmp,P.amp);gl.uniform1f(U.uEdge,P.edge);gl.uniform1f(U.uZoom,P.zoom);
    gl.uniform1f(U.uAcc,P.accent);gl.uniform1f(U.uGrain,P.grain);gl.uniform1f(U.uVig,P.vig);
    gl.uniform1f(U.uMode,P.mode);gl.uniform1f(U.uTrans,P.trans);gl.uniform1f(U.uFit,P.fit);
    gl.uniform1f(U.uCur,P.cur);gl.uniform1f(U.uMAmt,mAmt*P.mforce);gl.uniform1f(U.uMRad,P.mrad*k);
    gl.uniform3fv(U.uInk,COR.ink);gl.uniform3fv(U.uPaper,COR.paper);gl.uniform3fv(U.uAccent,COR.acc);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!paused) rafId=requestAnimationFrame(frame);          /* pausado: este foi o último quadro */
  }
  acorda();
  return {entrada(){enter=0;enterT=0;acorda();}, pausar(v){paused=!!v; if(!paused) acorda();}, P:P,
    cor(o){ if(o.ink)ALVO.ink=hex(o.ink); if(o.paper)ALVO.paper=hex(o.paper);
            if(o.acc)ALVO.acc=hex(o.acc); }};
}
return {montar:montar};
})();

/* ─── tokens lidos pelo JS ────────────────────────────────────────────────
   O CSS já usa var(); o WebGL do fundo precisa de número. tok('--acento')
   devolve o hex do token como o navegador o resolveu — inclusive quando o
   token é um color-mix(). Medido num elemento vivo, nunca por regex no CSS. */
function tok(nome){
  const e=document.createElement('i'); e.style.color=`var(${nome})`;
  document.body.appendChild(e);
  const c=getComputedStyle(e).color; e.remove();
  const n=(c.match(/[\d.]+/g)||[]).map(parseFloat);
  const k=c.startsWith('color(')?255:1;          /* color(srgb r g b) vem em 0..1 */
  return '#'+n.slice(0,3).map(v=>Math.round(v*k).toString(16).padStart(2,'0')).join('');
}

const F_ANTES=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_DEPOIS=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO1=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO2=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO3=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO4=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
/* lote destacado no mapa da quadra -> foto do empreendimento */
const FOTO_LOTE={0:F_FOTO1,1:F_FOTO2,2:F_FOTO3,3:F_FOTO4};

/* categorias de lote do mapa: cor por token, para a marca pintar o mapa junto com o resto.
   `novo` e `planta` são cor de dado (derivados no :root), não papel de marca. */
const COR={toq:'var(--acento)',ret:'var(--tinta)',obra:'var(--primaria)',novo:'var(--mapa-novo)',planta:'var(--mapa-planta)'};
function wpx(lat,lon,z){const n=Math.pow(2,z)*256,la=lat*Math.PI/180;
  return [(lon+180)/360*n,(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n];}
function proj(m){const {z,ox,oy,esc,mpp,fw,fh}=m;
  const n=Math.pow(2,z)*256;
  return {X:(la,lo)=>+((wpx(la,lo,z)[0]-ox)*esc).toFixed(1),
          Y:(la,lo)=>+((wpx(la,lo,z)[1]-oy)*esc).toFixed(1),
          /* inverso: o locador precisa de lat/lon a partir do pixel do viewBox */
          lo:x=>(x/esc+ox)/n*360-180,
          la:y=>{const t=Math.PI-2*Math.PI*(y/esc+oy)/n;
                 return 180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t)));},
          r:v=>+(v/mpp*esc).toFixed(1),w:fw,h:fh};}
const via=(P,a)=>a.map(c=>`${P.X(c[0],c[1])},${P.Y(c[0],c[1])}`).join(' ');
const vias=(P,arr,attr)=>arr.map(c=>`<polyline points="${via(P,c)}" ${attr}/>`).join('');
function barra(P,m,x,y){const L=P.r(m);
  return `<g transform="translate(${x},${y})"><line x1="0" y1="0" x2="${L}" y2="0" stroke="var(--tinta)" stroke-width="1.4"/><line x1="0" y1="-5" x2="0" y2="5" stroke="var(--tinta)" stroke-width="1.4"/><line x1="${L}" y1="-5" x2="${L}" y2="5" stroke="var(--tinta)" stroke-width="1.4"/><text x="${(L/2).toFixed(1)}" y="-10" text-anchor="middle" font-family="var(--f-mono)" font-size="15" fill="var(--tinta)" opacity=".72">${m} m</text></g>`;}


/* ─── janela retrato para o mapa em sangria ───────────────────────────────
   O painel do mapa e 48vw x 100vh — em 16:9 isso da 0,85 de proporcao.
   O viewBox cheio da base e paisagem, entao com `slice` os rotulos da
   esquerda eram decepados. Aqui se recorta uma janela ja no formato do
   painel, centrada no que interessa, e o slice so come a folga.          */
function janela(P,pts,asp){
  asp=asp||0.85;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;});
  const mx=(x1-x0)*0.035+10, my=(y1-y0)*0.035+10;
  x0-=mx;x1+=mx;y0-=my;y1+=my;
  let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(w/h>asp){ h=w/asp; } else { w=h*asp; }
  x0=cx-w/2;y0=cy-h/2;
  return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}
function mapaRua(sang){
  const B=MAP.base.rua,P=proj(B);
  const rot={0:[16,30,'start'],1:[0,-18,'middle'],2:[24,-6,'start'],3:[0,30,'middle'],4:[0,-16,'middle'],5:[-20,2,'end'],6:[-20,2,'end']};
  /* a janela tem de conter os rotulos, nao so os poligonos: eles saem bem
     para fora do lote e eram decepados pelo slice. Largura estimada pelo
     avanco da DM Mono, ~0,60 em, a 17 px.                                */
  const alvo=[];
  MAP.lotes.forEach((l,i)=>{
    l.r.forEach(c=>alvo.push([P.X(c[0],c[1]),P.Y(c[0],c[1])]));
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    const lw=l.n.length*10.2, ax=X+o[0], ay=Y+o[1];
    const e=o[2]==='start'?[ax,ax+lw]:o[2]==='end'?[ax-lw,ax]:[ax-lw/2,ax+lw/2];
    alvo.push([e[0],ay-14],[e[1],ay+6]);
  });
  const vb=sang?janela(P,alvo):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb}" role="img" aria-label="mapa de lotes">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  MAP.fundo.forEach(r=>{s+=`<polygon points="${via(P,r)}" fill="none" stroke="var(--tinta)" stroke-opacity=".16" stroke-width=".8"/>`;});
  s+=vias(P,MAP.msrua,'fill="none" stroke="var(--acento)" stroke-opacity=".15" stroke-width="'+P.r(12)+'" stroke-linecap="round"');
  const fl=MAP.msrua.flat(); const r0=fl[Math.floor(fl.length*0.28)];
  s+=`<text x="${P.X(r0[0],r0[1])}" y="${P.Y(r0[0],r0[1])-16}" text-anchor="middle" font-family="var(--f-mono)" font-style="italic" font-size="17" fill="var(--acento)" opacity=".95">${MAP.rotulo||''}</text>`;
  MAP.lotes.forEach((l,i)=>{
    const c=COR[l.t];
    s+=`<g class="lote" data-l="${i}" tabindex="0"><path d="M${via(P,l.r).replace(/ /g,'L')}Z" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="1.8" stroke-opacity=".85" stroke-dasharray="6 4"/></g>`;});
  MAP.lotes.forEach((l,i)=>{
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    s+=`<text x="${X+o[0]}" y="${Y+o[1]}" text-anchor="${o[2]}" font-family="var(--f-mono)" font-style="italic" font-size="17" fill="var(--tinta)" paint-order="stroke" stroke="var(--papel)" stroke-width="4" pointer-events="none">${l.n}</text>`;});
  s+=barra(P,50,44,P.h-20);
  return s+`</svg>`;
}

/* ─── locador: os perímetros maiores que o recorte ───────────────────────
   Quando o mapa tem perímetros muito maiores que o recorte principal,
   desenhá-los por cima só cruzaria a tela com uma linha. Vão como locador
   no canto, com o retângulo do recorte atual dentro.
   Duas camadas: MAP.aiu (tracejada, primária) e MAP.req (cheia, acento).
   Os rótulos vêm de MAP.aiuRotulo e MAP.reqRotulo; sem eles, não há texto. */
function locador(P,vb,W){
  const A=[].concat(MAP.aiu||[],MAP.req||[]).flat();
  if(!A.length) return '';
  const H=Math.round(W*1.02), pad=9;
  let la0=1e9,la1=-1e9,lo0=1e9,lo1=-1e9;
  A.forEach(([la,lo])=>{if(la<la0)la0=la;if(la>la1)la1=la;if(lo<lo0)lo0=lo;if(lo>lo1)lo1=lo;});
  const kx=(W-2*pad)/(lo1-lo0), ky=(H-2*pad)/(la1-la0), k=Math.min(kx,ky);
  const cx=(lo0+lo1)/2, cy=(la0+la1)/2;
  const X=lo=>pad+(W-2*pad)/2+(lo-cx)*k, Y=la=>pad+(H-2*pad)/2-(la-cy)*k;
  /* 1 vértice a cada N: um perímetro oficial pode ter milhares de vértices e o locador tem 190 px de largura */
  const cam=(an,n)=>an.filter((_,i)=>i%n===0||i===an.length-1)
    .map(([la,lo])=>`${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join(' ');
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--papel)" stroke="var(--tinta)" stroke-opacity=".28" stroke-width="1"/>`;
  (MAP.aiu||[]).forEach(an=>{g+=`<polygon points="${cam(an,9)}" fill="var(--primaria)" fill-opacity=".13" stroke="var(--primaria)" stroke-width="1" stroke-opacity=".7" stroke-dasharray="3 2.5"/>`;});
  (MAP.req||[]).forEach(an=>{g+=`<polygon points="${cam(an,2)}" fill="var(--acento)" fill-opacity=".16" stroke="var(--acento)" stroke-width="1.3"/>`;});
  /* o retângulo do recorte que está sendo mostrado ao lado */
  const v=vb.split(' ').map(Number);
  const cantos=[[v[0],v[1]],[v[0]+v[2],v[1]],[v[0]+v[2],v[1]+v[3]],[v[0],v[1]+v[3]]]
    .map(([x,y])=>{const la=P.la(y),lo=P.lo(x);return `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`;}).join(' ');
  g+=`<polygon points="${cantos}" fill="none" stroke="var(--tinta)" stroke-width="1.6"/>`;
  if(MAP.reqRotulo) g+=`<text x="${pad}" y="${H-19}" font-family="var(--f-mono)" font-size="10.5" fill="var(--acento)">${MAP.reqRotulo}</text>`;
  if(MAP.aiuRotulo) g+=`<text x="${pad}" y="${H-6}" font-family="var(--f-mono)" font-size="10.5" fill="var(--primaria)">${MAP.aiuRotulo}</text>`;
  return g;
}
function mapaCluster(sang){
  const B=MAP.base.cluster,P=proj(B),r=P.r(200);
  const alvo2=[];MAP.pts.forEach(q=>{const X=P.X(q.lat,q.lon),Y=P.Y(q.lat,q.lon);
    alvo2.push([X-r,Y-r],[X+r,Y+r]);});
  const vb2=sang?janela(P,alvo2):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb2}" role="img" aria-label="mapa de cluster — raios de 200 m">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  s+=vias(P,MAP.calc,'fill="none" stroke="var(--primaria)" stroke-width="11" stroke-opacity=".3" stroke-linecap="round"');
  s+=vias(P,MAP.calc,'fill="none" stroke="var(--mapa-escuro)" stroke-width="2.4" stroke-dasharray="1.5 6" stroke-linecap="round" stroke-opacity="1"');
  s+=vias(P,MAP.sj,'fill="none" stroke="var(--acento)" stroke-width="16" stroke-opacity=".2" stroke-linecap="round"');
  s+=vias(P,MAP.sj,'fill="none" stroke="var(--acento)" stroke-width="2.6" stroke-dasharray="11 7" stroke-linecap="round" stroke-opacity=".95"');
  const sjf=MAP.sj.flat(); const m0=sjf[Math.floor(sjf.length*0.5)];
  if(m0&&MAP.sjRotulo) s+=`<text x="${P.X(m0[0],m0[1])+14}" y="${P.Y(m0[0],m0[1])-12}" font-family="var(--f-mono)" font-style="italic" font-size="19" fill="var(--acento)" paint-order="stroke" stroke="var(--papel)" stroke-width="4">${MAP.sjRotulo||''}</text>`;
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<circle class="raio" data-i="${i}" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="${r}" fill="var(--primaria)" fill-opacity=".11" stroke="var(--primaria)" stroke-opacity=".34" stroke-width="1"/>`;});
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="16"/><circle class="anel" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="9"/><circle cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="4" fill="var(--mapa-escuro)"/></g>`;});
  MAP.pts.forEach((p,i)=>{if(!p.toq)return;
    const X=P.X(p.lat,p.lon),Y=P.Y(p.lat,p.lon);
    if(p.anc) s+=`<circle cx="${X}" cy="${Y}" r="21" fill="none" stroke="var(--acento)" stroke-width="1.6" stroke-dasharray="3 3" opacity=".85"/>`;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${X}" cy="${Y}" r="24"/><circle class="anel" cx="${X}" cy="${Y}" r="18"/><circle cx="${X}" cy="${Y}" r="${p.anc?15:12}" fill="var(--acento)" stroke="var(--papel)" stroke-width="${p.anc?2.6:1.8}"/><text x="${X}" y="${Y+5}" text-anchor="middle" font-family="var(--f-mono)" font-weight="500" font-size="15" fill="var(--papel)">${p.k}</text></g>`;});
  s+=barra(P,200,48,P.h-20);
  if(sang){
    const v=vb2.split(' ').map(Number), W=Math.round(v[2]*0.30);
    const gx=v[0]+v[2]*0.035, gy=v[1]+v[3]-Math.round(W*1.02)-v[3]*0.035;
    s+=`<g transform="translate(${gx.toFixed(1)},${gy.toFixed(1)})">${locador(P,vb2,W)}</g>`;
  }
  return s+`</svg>`;
}
function ligaHover(root){
  const box=root.querySelector('#minfo'); if(!box)return;
  const base=box.innerHTML;
  let tmr;
  const pinta=html=>{box.classList.add('trocando');clearTimeout(tmr);
    tmr=setTimeout(()=>{box.innerHTML=html;box.classList.remove('trocando');},170);};
  const mostra=(n,p,d,f)=>{box.classList.remove('vazio');
    pinta((f?`<span class="mfoto"><img src="${f}" alt="${n}"></span>`:'')
      +`<span class="mtx"><span class="mn">${n}</span>${p?`<span class="mp">${p}</span>`:''}${d?`<span class="md">${d}</span>`:''}</span>`);};
  const limpa=()=>{box.classList.add('vazio');pinta(base);};
  const solta=()=>root.querySelectorAll('.pin.on,.raio.on,.lote.on').forEach(e=>e.classList.remove('on'));
  root.querySelectorAll('.lote').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');const i=+g.dataset.l,l=MAP.lotes[i];
      mostra(l.n,l.end,l.d, (typeof FOTO_LOTE!=='undefined'?FOTO_LOTE[i]:null)||null);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelectorAll('.pin').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');
      const i=+g.dataset.i,p=MAP.pts[i],rr=root.querySelector(`.raio[data-i="${i}"]`);
      if(rr)rr.classList.add('on');
      let d='';
      if(p.cred){
        const brl=v=>'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
        d=`${p.quem}. Categoria ${p.cat}, ${p.pts} pontos, `
          +`${p.pct!=null?p.pct.toString().replace('.',',')+'% de subvenção — ':''}`
          +`${brl(p.vl)} concedidos no chamamento ${p.cham}.`;
      }else{
        d=p.viz.length?'Credenciados no raio de 200 m: '+p.viz.map(([m,n])=>`${n} a ${m} m`).join(' · ')+'.':'Nenhum credenciado dentro de 200 m.';
        if(p.fora.length)d+=` O mais próximo fora do raio é ${p.fora[0][1]}, a ${p.fora[0][0]} m.`;
      }
      mostra(p.n,p.toq?`${p.pt} pontos de proximidade`:'projeto credenciado',d);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelector('.mapa').addEventListener('mouseleave',()=>{solta();limpa();});
  box.classList.add('vazio');
}
function isometrico(cena,esc){
  /* sobre a oliva a tinta some: o desenho troca de cor, nao de forma */
  const TI = esc ? 'var(--papel)' : 'var(--tinta)';
  const W=620,H=660,ux=0.866,uy=0.5;
  /* o viewBox sai do proprio desenho. Escrito a mao, ele decepava os dois
     ultimos predios da carteira toda vez que o espacamento mudava. */
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  const marca=(px,py)=>{if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;};
  const janelaIso=(padx,pady)=>{
    const x0=bx0-padx,y0=by0-pady,w=(bx1-bx0)+padx*2,h=(by1-by0)+pady*2;
    return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;};
  const S=1.16;const iso=(x,y,z)=>[300+(x-y)*ux*S,H-130-((x+y)*uy*.52*S)-z*S];
  const P=(a)=>a.map(p=>p.join(',')).join(' ');
  function caixa(cx,cy,w,d,pav,alt,rot,pal){
    /* pal: o prédio grande ficou fora dos cenários; entra só como escala */
    const o=pal?0.34:1, h=pav*alt,pts=[];
    const A=iso(cx,cy,0),Bp=iso(cx+w,cy,0),C=iso(cx+w,cy+d,0),D=iso(cx,cy+d,0);
    const A2=iso(cx,cy,h),B2=iso(cx+w,cy,h),C2=iso(cx+w,cy+d,h),D2=iso(cx,cy+d,h);
    /* o vertice mais proximo da camera e A (menor x+y). As duas faces visiveis
       sao as que encostam na aresta A-A2: a esquerda (A-D) e a direita (A-B).
       Antes desenhava-se B-C, que fica ESCONDIDA atras do solido, e a esquerda
       ficava vazada. Corrigido em 21/08/2026.                                */
    let g=`<polygon points="${P([A,D,D2,A2])}" fill="${TI}" fill-opacity="${(.17*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A,Bp,B2,A2])}" fill="${TI}" fill-opacity="${(.075*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A2,B2,C2,D2])}" fill="var(--acento)" fill-opacity="${(.26*o).toFixed(3)}" stroke="var(--acento)" stroke-width="1.2" stroke-opacity="${o}"/>`;
    /* aresta vertical da frente, marcada: e ela que le a altura */
    g+=`<line x1="${A[0]}" y1="${A[1]}" x2="${A2[0]}" y2="${A2[1]}" stroke="${TI}" stroke-width="1.1" stroke-opacity="${(.55*o).toFixed(2)}"/>`;
    for(let i=1;i<pav;i++){const l=iso(cx,cy+d,i*alt),m=iso(cx,cy,i*alt),o=iso(cx+w,cy,i*alt);
      g+=`<polyline points="${P([l,m,o])}" fill="none" stroke="${TI}" stroke-width=".5" stroke-opacity="${(.3*o).toFixed(2)}"/>`;}
    [A,Bp,C,D,A2,B2,C2,D2].forEach(q=>marca(q[0],q[1]));
    const top=iso(cx+w/2,cy+d/2,h);
    if(rot){ const lw=rot.length*4.6; marca(top[0]-lw,top[1]-46); marca(top[0]+lw,top[1]-30); }
    /* 34 px acima da cumeeira: com 16 o rotulo encostava no telhado */
    g+=`<text x="${top[0]}" y="${top[1]-34}" text-anchor="middle" font-family="var(--f-mono)" font-style="italic" font-size="15" fill="${TI}" opacity="${pal?0.55:1}">${rot}</text>`;
    return g;
  }
  function arvore(x,y){const b=iso(x,y,0),t=iso(x,y,26);
    return `<line x1="${b[0]}" y1="${b[1]}" x2="${t[0]}" y2="${t[1]}" stroke="var(--primaria)" stroke-width="1.6"/><circle cx="${t[0]}" cy="${t[1]}" r="9" fill="var(--primaria)" fill-opacity=".45" stroke="var(--primaria)" stroke-width="1"/>`;}
  function carro(x,y){const a=iso(x,y,0),b=iso(x+16,y,0),c=iso(x+16,y+8,0),d=iso(x,y+8,0),
    a2=iso(x,y,9),b2=iso(x+16,y,9),c2=iso(x+16,y+8,9),d2=iso(x,y+8,9);
    return `<polygon points="${P([a,b,c,d])}" fill="${TI}" fill-opacity=".1"/><polygon points="${P([a2,b2,c2,d2])}" fill="${TI}" fill-opacity=".3" stroke="${TI}" stroke-width=".8"/><polygon points="${P([b,c,c2,b2])}" fill="${TI}" fill-opacity=".2" stroke="${TI}" stroke-width=".8"/>`;}
  let s=`<svg viewBox="55 66 545 596" role="img" aria-label="Escala comparativa de porte">`;
  /* a fileira da carteira e mais longa que a do porte: o chao e a rua
     acompanham, senao os dois ultimos predios ficam sem calcada */
  const XM = cena==='portfolio' ? 500 : 330;
  const g0=iso(-34,40,0),g1=iso(XM,40,0),g2=iso(XM,200,0),g3=iso(-34,200,0);
  s+=`<polygon points="${P([g0,g1,g2,g3])}" fill="${TI}" fill-opacity=".045"/>`;
  const r0=iso(-34,52,0),r1=iso(XM,52,0),r2=iso(XM,80,0),r3=iso(-34,80,0);
  s+=`<polygon points="${P([r0,r1,r2,r3])}" fill="${TI}" fill-opacity=".1"/>`;
  if(cena==='portfolio'){
    /* a carteira desenhada: 4 pequenos e 3 medios, na mesma escala do slide
       do porte. E o mesmo desenho, para o olho reconhecer o tamanho.     */
    /* tudo numa fileira só: com os pequenos atrás dos médios a conta não
       se lia. Agora é da esquerda para a direita, 4 + 3, mesma linha. */
    /* mais respiro entre os volumes: colados, a conta de 4 + 3 nao se lia */
    let x=0;
    for(let i=0;i<4;i++){ s+=caixa(x,96,38,34,5,10,i===1?'4 × pequeno':''); x+=62; }
    x+=34;
    for(let i=0;i<3;i++){ s+=caixa(x,96,52,42,12,10,i===1?'3 × médio':''); x+=78; }
    /* a arvore acompanha a fileira inteira, ate o ultimo predio */
    for(let v=-18;v<=x-30;v+=56) s+=arvore(v,66);
    const vb=janelaIso(26,22);
    const cy2=(by1+26);
    s+=`<text x="${((bx0+bx1)/2).toFixed(1)}" y="${(cy2+16).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="13" fill="${TI}" opacity=".5">15.600 m² construídos · mesma escala do slide do porte</text>`;
    marca(bx0,cy2+22);marca(bx1,cy2+22);
    return s.replace('viewBox="55 66 545 596"','viewBox="'+janelaIso(26,22)+'"')+`</svg>`;
  }
  s+=caixa(0,96,52,44,5,10,'pequeno · 5 pav');
  s+=caixa(112,96,62,50,12,10,'médio · 12 pav');
  s+=caixa(238,96,72,56,24,10,'grande · 24 pav','pal');
  [ -18, 46, 100, 160, 216, 288 ].forEach(x=>{s+=arvore(x,66);});
  s+=carro(56,60); s+=carro(196,60);
  s+=`<text x="${W/2}" y="${H-16}" text-anchor="middle" font-family="var(--f-mono)" font-size="14" fill="${TI}" opacity=".55">escala comparativa · pé-direito de 3 m</text>`;
  return s+`</svg>`;
}

/* Gabaritos com máquina própria que NÃO estão no DECK-modelo, mas estão na
   engine — copiar o exemplo do gabarito quando entrarem na peça:
   {g:'earth-3d',lat:-23.55,lng:-46.63,alt:760,kick:'',h2:'',lead:'',cap:''}
     → sistemas/gabaritos/mapa-earth-3d.md · só funciona por link
   {g:'modelo-3d',modelo:'<id do 3D Warehouse>',res:[{src,cap}],kick:'',h2:'',lead:'',cap:''}
     → sistemas/gabaritos/modelo.md · modelo PÚBLICO
   Abertura em dois momentos (capa da frente com título dentro):
   {g:'marca',dois:1,fundo:1,esc:1,lockup:1,papel:'',descritor:'',site:'',
     kick:'',t:'',sub:'',pe:''}                                            */
/* a chave numerada do mapa vem do MAP (MAP.chave), calculada a partir da
   camada oficial — escrita à mão ela fica desatualizada */
const CHAVE=(typeof MAP!=='undefined'&&MAP.chave)?MAP.chave:[];

/* ═══ O QUE VEM DO BLOCO DA MARCA, além do :root e das fontes ═════════════
   Cinco constantes. Cada bloco de marca traz as suas; o esqueleto sai com
   os valores da michel stein_ (texto no canto, sem lockup, sem grafismo,
   sem QR, com underscore). Quem monta cola as do bloco por cima destas.
   LOGO_CANTO — o canto superior direito do chrome:
     {modo:'texto', html:'michel stein<u>_</u>'}   ← padrão da casa
     {modo:'logo',  svg:'<svg …>', largura:'clamp(132px,9.5cqw,180px)'}
       o SVG usa fill="var(--tinta)"/"var(--primaria)" (positivo) ou
       fill="currentColor" (monocromático); o CSS troca para papel no escuro.
   LOCKUP   — SVG monocromático (currentColor) para `lockup:1` no slide marca.
   GRAFISMO — SVG monocromático (currentColor) para `graf:1`; vai no #msgraf.
   QR       — SVG do QR da marca (fill="var(--papel)" no fundo, stroke=
              "var(--tinta)" nos módulos) para `qr:1` na contracapa. Vazio =
              `qr:1` não desenha nada. O QR é da MARCA (aponta para o site
              dela), por isso não mora aqui: saiu do esqueleto em 03/09/2026.
   UNDERSCORE — true/false. O `_` terracota depois da sigla, do slogan e do
              nome do divisor é ASSINATURA da michel stein_; Sarasá, AMAZ e
              Lavrō desligam (cada uma tem a sua: lockup, barra, mácron).
   ═══════════════════════════════════════════════════════════════════ */
/* COLAR:constantes */
const LOGO_CANTO={modo:'texto',html:'michel stein<u>_</u>'};   /* texto, não logotipo */
const LOCKUP='';     /* a marca é texto: sigla + underscore */
const GRAFISMO='';   /* a michel stein_ não tem grafismo de base */
const UNDERSCORE=true;   /* o `_` terracota depois da sigla, do slogan e do divisor: só esta marca */
const QR='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29"><path fill="var(--papel)" d="M0 0h29v29h-29z"/><path stroke="var(--tinta)" d="M2 2.5h7m1 0h2m4 0h3m1 0h7m-25 1h1m5 0h1m4 0h1m1 0h2m1 0h1m1 0h1m5 0h1m-25 1h1m1 0h3m1 0h1m2 0h2m1 0h1m1 0h2m2 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m1 0h1m1 0h2m1 0h4m1 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m1 0h5m1 0h3m1 0h1m1 0h3m1 0h1m-25 1h1m5 0h1m1 0h1m3 0h1m5 0h1m5 0h1m-25 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-17 1h1m6 0h1m-16 1h1m3 0h1m1 0h6m2 0h1m1 0h6m2 0h1m-24 1h3m3 0h2m1 0h1m1 0h1m1 0h3m3 0h2m1 0h1m-24 1h2m1 0h1m1 0h3m2 0h1m2 0h3m1 0h3m1 0h2m-22 1h1m14 0h1m2 0h2m1 0h2m-22 1h1m3 0h2m2 0h3m3 0h4m1 0h4m-25 1h5m5 0h1m1 0h5m3 0h1m2 0h1m-20 1h4m1 0h1m1 0h1m1 0h1m1 0h3m1 0h4m-21 1h1m4 0h1m6 0h2m2 0h3m1 0h2m-24 1h2m1 0h1m2 0h1m3 0h1m4 0h8m-15 1h2m1 0h1m2 0h1m1 0h1m3 0h1m-21 1h7m1 0h1m2 0h1m1 0h2m1 0h1m1 0h1m1 0h1m-21 1h1m5 0h1m7 0h1m1 0h1m3 0h5m-25 1h1m1 0h3m1 0h1m1 0h2m2 0h1m3 0h7m-23 1h1m1 0h3m1 0h1m4 0h1m2 0h2m1 0h3m2 0h3m-25 1h1m1 0h3m1 0h1m4 0h1m2 0h1m1 0h3m2 0h1m1 0h1m-24 1h1m5 0h1m2 0h2m1 0h1m1 0h2m1 0h7m-24 1h7m1 0h1m1 0h3m1 0h2m2 0h1m3 0h3"/></svg>';
/* /COLAR */
const palco=document.getElementById('palco');
/* as fotos moram em js_fotos.js como constantes; o DECK guarda o NOME delas.
   Assim o array de slides continua legivel e o base64 fica de fora.        */
const IMG={};
['F_ANTES','F_DEPOIS','F_FOTO1','F_FOTO2','F_FOTO3','F_FOTO4'].forEach(k=>{
  try{ IMG[k]=eval(k); }catch(e){ IMG[k]=''; }
});

/* ─── aviso: o slide que diz o que está errado ────────────────────────────
   03/09/2026. Gabarito desconhecido ou campo obrigatório ausente vira um
   slide hachurado com o diagnóstico, e o mesmo texto vai ao console como
   console.error (para o build barrar a peça). Antes,
   o primeiro sumia em silêncio e o segundo escrevia `undefined` na tela ou
   derrubava o deck inteiro (`cur is not defined`).                       */
function aviso(s,titulo,nota){
  const limpo=x=>String(x).replace(/<[^>]+>/g,'');
  console.error('deck · '+limpo(titulo)+(nota?' — '+limpo(nota):''));
  return `<div class="vazio aviso rev"><div class="vmarca">_</div>`
    + `<h2>${titulo}</h2>`
    + (s.t?`<p class="vsub">${s.t}</p>`:'')
    + (nota?`<p class="vnota">${nota}</p>`:'')+`</div>`;
}
/* campos sem os quais o gabarito não renderiza. `cols` é reservado: quem o
   traz como array tem de trazer `linhas` — a armadilha paga em 23/08 e 29/08. */
const EXIGE={
  duo:['figs','leg'], tabela:['cols','linhas'], porte:['cols','linhas'],
  lista:['itens'], fim:['itens'], sumario:['itens'], trio:['itens'],
  jogadas:['itens'], fotos:['itens'], unit:['cards'], players:['casas'],
  avulso:['grupos'], plug:['ancoras'], duasfrentes:['esq','dir'],
  divisor:['dt'], 'earth-3d':['lat','lng'], 'modelo-3d':['modelo']
};
/* bloco de marca antigo, sem a linha UNDERSCORE: vale o padrão da casa (ligado) */
const US=(typeof UNDERSCORE==='undefined')?true:!!UNDERSCORE;
function tpl(s){
  const faltam=(EXIGE[s.g]||[]).filter(c=>s[c]==null);
  if(faltam.length)
    return aviso(s,'gabarito '+s.g+': falta '+faltam.map(c=>`<code>${c}</code>`).join(', '),
      'formato de cada campo em sistemas/DECK-MONTAR.md');
  if(s.g!=='prancha' && Array.isArray(s.cols) && !Array.isArray(s.linhas))
    return aviso(s,'gabarito '+s.g+': <code>cols</code> sem <code>linhas</code>',
      '`cols` é campo reservado da tabela; quem o usa traz `linhas` em seguida');
  const k=s.kick?`<div class="kick${s.barra?' barra':''} rev">${s.kick}</div>`:'';
  const et=s.etapas?' passo etapa':'';
  const grande=(s.g==='frase'||s.g==='capa'||s.g==='jogadas');
  /* R$ é símbolo de moeda, não texto: sobrevive ao text-transform:lowercase
     dos títulos. Aplicado no render para não poluir o DECK com <span>. */
  const RS=x=>String(x).replace(/R\$/g,'<span class="ru">R$</span>');
  const t=s.t?`<h1 class="${grande?'mega':'big'} rev">${RS(s.t)}</h1>`:'';
  const sub=s.sub?`<p class="sub rev">${s.sub}</p>`:'';
  const prem=s.prem?`<p class="prem rev">${s.prem}</p>`:'';
  const pre=s.pre?`<p class="sub rev" style="margin-top:0;margin-bottom:clamp(10px,1.6vh,22px);max-width:44ch">${s.pre}</p>`:'';
  /* o texto de apoio do dado não fica na tela: o slide mostra número e
     rótulo, e a memória de cálculo abre no ponteiro. Menos coisa competindo
     pela atenção, e o argumento continua a um gesto de distância. */
  const dad=s.dados?`<div class="dados rev">`+s.dados.map(([v,l,n],j)=>
    `<div class="dado${n?' tem':''}"${n?` tabindex="0" data-dn="${j}"`:''}>`
    +`<span class="v">${RS(v)}</span><span class="l">${l}</span>`
    +(n?`<span class="n">${n}</span>`:'')+`</div>`).join('')+`</div>`:'';
  /* pilula da abertura: markup identico ao do capa-morph_R6, inclusive a
     seta como glifo &rarr;. Tentei SVG para nao depender de fonte de
     sistema e o desenho saiu diferente do padrao — o R6 manda.          */
  const inicio=s.comecar?'<button class="ms-start">começar <span class="seta">&rarr;</span></button>':'';
  if(s.g==='marca'){
    const u=!US?'':s.pisca?'<i class="pisca">_</i>':'<i>_</i>';
    /* a marca em si: sigla em texto (michel stein_) ou LOCKUP em SVG
       (`lockup:1`, Sarasá/AMAZ). O papel (`arquiteto`, `núcleo de
       arquitetura`) vai SOB a marca, nunca ao lado. */
    const marca=(rev)=> (s.lockup&&LOCKUP)
      ? `<div class="lk-bloco${rev}"><div class="lock">${LOCKUP}</div>${s.papel?`<div class="nucleo">${s.papel}</div>`:''}</div>`
      : `<div class="sigla-mini${rev}">${s.sigla||''}${US?'<i>_</i>':''}${s.papel?`<em>${s.papel}</em>`:''}</div>`;
    /* CONTRACAPA — QR, marca, assinatura, site e o crédito da peça */
    if(s.fim_) return `<div class="frase">`
      +((s.qr&&QR)?`<div class="qr rev">${QR}</div>`:'')
      +marca(' rev')
      +(s.assinatura?`<div class="assina rev">${s.assinatura}${s.lockup?'':u}</div>`:'')
      +(s.site?`<div class="site rev">${s.site}</div>`:'')
      +(s.credito?`<div class="credito-peca rev">${s.credito}</div>`:'')
      +`</div>`;
    /* ABERTURA EM DOIS MOMENTOS (`dois:1`) — a capa da frente e o título da
       apresentação no mesmo slide; o `começar` chama avanca() e revela o B.
       Ver a nota no CSS (.g-marca.dois). */
    if(s.dois) return `<div class="cm-b passo">`
      +(s.kick?`<div class="kick">${s.kick}</div>`:'')
      +(s.t?`<h1 class="mega">${RS(s.t)}</h1>`:'')
      +(s.sub?`<p class="sub">${s.sub}</p>`:'')
      +(s.pe?`<div class="cm-pe">${s.pe}</div>`:'')
      +`</div>`
      +`<div class="cm-a">`+marca('')
      +(s.descritor?`<div class="descritor">${s.descritor}</div>`:'')
      +(s.site?`<div class="site">${s.site}</div>`:'')
      +`<button class="ms-start">começar <span class="seta">&rarr;</span></button>`
      +`</div>`;
    /* ABERTURA PADRÃO — marca, papel, slogan e site empilhados */
    return `<div class="frase">`
      +marca(' rev')
      +(s.slogan?`<div class="slogan rev">${s.slogan}${u}</div>`:'')
      +(s.site?`<div class="site rev">${s.site}</div>`:'')
      +inicio+`</div>`;
  }
  const met=s.metas?`<div class="metas rev">`+s.metas.map(([l,v])=>`<div><span class="ml">${l}</span><span class="mv">${v}</span></div>`).join('')+`</div>`:'';
  if(s.g==='capa') return `<div class="wrap">${k}${t}${sub}${met}${inicio}</div>`;
  if(s.g==='divisor') return `<div class="divisor"><span class="dn rev">${s.dn||''}</span><h1 class="dt rev">${RS(s.dt)}${US?'<i class="pisca">_</i>':''}</h1>${s.ds?`<p class="ds rev">${s.ds}</p>`:''}</div>`;
  if(s.g==='frase') return `<div class="wrap">${k}${pre}${t}${sub}${prem}${dad}</div>`;
  if(s.g==='jogadas') return `<div class="wrap">${k}${t}<div class="jogadas rev">`+s.itens.map(([n,ti,d])=>`<div class="jogada${et}"><span class="jn">${n}</span><span class="jt">${ti}</span><span class="jd">${d}</span></div>`).join('')+`</div></div>`;
  if(s.g==='unit') return `<div class="wrap">${k}${t}${sub}<div class="unit rev">`+s.cards.map(([ti,a,r,l,m])=>`<div class="uc${et}"><span class="ut">${ti}</span><span class="ua">${a}</span><span class="ur">${RS(r)}</span><span class="ul">${l}</span><span class="um">${m}</span></div>`).join('')+`</div></div>`;
  if(s.g==='trio') return `<div class="wrap">${k}${t}${sub}<ol class="trio">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='lista'||s.g==='fim') return `<div class="wrap${s.largo?' largo':''}">${k}${pre}${t}${sub}<ol class="lista${s.largo?' largo':''}">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='escolha'){
    /* A BIFURCAÇÃO. Cada opção declara `para` com o NOME de um gabarito, e
       o motor procura o próximo slide daquele gabarito — nunca índice. */
    const o=(s.opcoes||[]).map(op=>
      `<button class="pill" type="button" data-para="${op.para||''}"`
      + (op.ir!=null?` data-ir="${op.ir}"`:'') + `>`
      + `<b>${op.rot||''}</b>`
      + (op.sub?`<s>${op.sub}</s>`:'') + `</button>`).join('');
    return `<div class="wrap">${k}${t}${sub}<div class="opcoes rev">${o}</div></div>`;
  }
  if(s.g==='galeria'){
    /* MOSAICO + LUPA. `fotos:[{src,rot,cap}]`.
       `data-src`: as miniaturas entram quando o slide chega, pelo
       __msPuxa() — seis por galeria, e sem isto as vinte e quatro entrariam
       na carga. A lupa recebe o `src` no clique, da miniatura já baixada:
       é o mesmo arquivo, então não há segunda carga. */
    const F=s.fotos||[];
    const tij=F.map((f,i)=>
      `<button class="tijolo" type="button" data-i="${i}" data-cap="${(f.cap||'').replace(/"/g,'&quot;')}" data-rot="${(f.rot||'').replace(/"/g,'&quot;')}">`
      + (f.src
          ? `<img decoding="async" data-src="${f.src}" alt="${(f.rot||f.cap||'').replace(/"/g,'&quot;')}">`
          : `<div class="slot"><u>_</u><b>${f.rot||'vista'}</b></div>`)
      + (f.rot?`<span class="tlbl">${f.rot}</span>`:'')
      + `</button>`).join('');
    return `<div class="galtopo">${k}${t}${sub}</div>`
      + `<div class="mosaico rev">${tij}</div>`
      + `<div class="lupa">`
      +   `<div class="lph"><img alt=""></div>`
      +   `<div class="lconta"></div>`
      +   `<div class="lupaov"><h3></h3><span></span></div>`
      +   `<button class="lseta lant" type="button" aria-label="vista anterior">&#8249;</button>`
      +   `<button class="lseta lpro" type="button" aria-label="próxima vista">&#8250;</button>`
      +   `<button class="fechar" type="button" aria-label="fechar a imagem">&#10005;</button>`
      + `</div>`;
  }
  if(s.g==='cheia'){
    /* render em sangria total. Ver sistemas/gabaritos/render-cheia.md */
    const img = s.src
      /* `data-src`, não `src`: o render entra quando o slide chega (e o
         seguinte), pelo __msPuxa(). Vale para base64 e para arquivo ao lado. */
      ? `<img decoding="async" data-src="${s.src}" alt="${(s.cap||'').replace(/"/g,'&quot;')}">`
      : `<div class="slot"><u>_</u><b>${s.lbl||'render'}</b><s>16:9 · sangria total</s></div>`;
    return `<div class="full"><div class="ph">${img}</div></div>`
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>`;
  }
  if(s.g==='duo'){
    const RES=IMG;
    /* o slot so aparece se a imagem falhar — antes ele ficava por cima da foto */
    const f=s.figs.map(([tag,src,cap,cl])=>`<div class="dfig ${cl}"><img src="${RES[src]||src}" alt="${cap}" onerror="const p=this.parentNode;this.remove();p.classList.add('semimg')"><span class="tag">${tag}</span><div class="slot"><b>slot de imagem</b><span>${cap}</span></div><span class="dcap">${cap}</span></div>`).join('');
    return `<div class="wrap" style="max-width:none">${k}${t}${sub}<div class="dcols rev">${f}</div><p class="dleg rev">${s.leg}</p></div>`;
  }
  if(s.g==='fotos'){
    const li=s.itens.map(([q,x],i)=>`<li class="passo" data-f="${i}"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('');
    const im=s.itens.map(([q,x,src,cap],i)=>src?`<img data-f="${i}" src="${IMG[src]||src}" alt="${cap}" onerror="this.dataset.err=1">`:'').join('');
    return `<div class="wrap">${k}${t}<ol class="lista">${li}</ol></div>
      <div class="fbleed">${im}<div class="slot"><b>slot de imagem</b><span class="scap"></span><span class="sfon"></span></div><span class="cred"></span></div>`;
  }
  /* ⚑ `prancha` vem ANTES do `const tab`. Os dois usam `cols`, e com
     significados incompatíveis: aqui é um NÚMERO de colunas, lá é um array
     de cabeçalhos. Deixar o `tab` correr primeiro derruba o deck inteiro
     com `s.cols.map is not a function`. É a armadilha do campo reservado,
     registrada em 23/08 e paga de novo em 29/08.
     Receita: sistemas/gabaritos/prancha-referencia.md */
  if(s.g==='prancha'){
    const foto=(src,cap,ar)=>`<div class="ph"${ar?` style="flex:0 0 auto;aspect-ratio:${ar}"`:''}>`
      + (src?`<img loading="lazy" src="${src}" alt="${(cap||'').replace(/"/g,'&quot;')}">`
            :`<div class="slot"><u>_</u><b>${cap||'imagem'}</b><s>16:9 ou 4:3</s></div>`)+`</div>`;
    const cels=(s.items||[]).map(it=>{
      if(it.pilha){
        return `<div class="cel pilha rev" style="aspect-ratio:${it.ar||'0.70'}">`
          + it.pilha.map(f=>foto(f.src,f.cap,null)).join('')
          + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
      }
      return `<div class="cel rev">`+foto(it.src,it.cap,it.ar||s.ar)
        + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
    }).join('');
    /* a proporção decide as colunas: retrato aceita 3 ou 4, deitada pede 2.
       Aviso no console em vez de regra escondida num .md.
       Ver sistemas/gabaritos/prancha-referencia.md */
    (function(){
      const ars=(s.items||[]).map(i=>parseFloat(i.ar||s.ar||0)).filter(n=>n>0);
      if(!ars.length) return;
      const med=ars.reduce((a,b)=>a+b,0)/ars.length, c=s.cols||3;
      if(med>1.2&&c>2) console.warn('prancha: imagem deitada (ar~'+med.toFixed(2)+') em '+c+' colunas. Deitada pede 2, ou 3 recortando em quadrado.');
      if(med<0.85&&c<3) console.warn('prancha: imagem em retrato (ar~'+med.toFixed(2)+') em '+c+' colunas. Retrato aceita 3 ou 4.');
    })();
    const topo=(s.top&&(s.top.h2||s.top.lead))
      ? `<div class="ptop rev"><h2>${s.top.h2||''}</h2>`
        + (s.top.lead?`<div class="plead">${s.top.lead}</div>`:'')+`</div>` : '';
    const centra=s.ar||(s.items||[]).some(i=>i.ar||i.pilha);
    return `<div class="pbody">${topo}<div class="grade" style="grid-template-columns:repeat(${s.cols||3},1fr)`
      + (centra?';align-content:center;align-items:center':'')+`">${cels}</div></div>`;
  }
  if(s.g==='modelo-3d'){
    /* O MODELO DO PROJETO, VIVO — modulos/modelo-sketchup.html
       `app.sketchup.com/viewer/3dw?WarehouseModelId=<id>` embeda direto, com
       painel de cenas, sombras e projeções, sem marca de terceiro (medido em
       02/09/2026 no domínio real). ⚑ O modelo TEM DE ESTAR PÚBLICO no 3D
       Warehouse: modelo privado devolve 404 para quem abre o link.
       `res` são as imagens de reserva — sem elas o slide não sobrevive a
       rede ruim; slot vazio aparece hachurado. Receita: gabaritos/modelo.md */
    const cenas = (s.res||[]).map((r,i)=>
      `<button type="button" data-i="${i}"${i?'':' class="on"'} title="${(r.cap||'').replace(/"/g,'&quot;')}"></button>`).join('');
    const fotos = (s.res||[]).length
      ? (s.res||[]).map((r,i)=>`<img loading="lazy" src="${r.src}" alt="${(r.cap||'').replace(/"/g,'&quot;')}"${i?'':' class="on"'}>`).join('')

sl.forEach((el,i)=>{

     próprio markup — assim o DECK não precisa declarar `pops` para isso */
  el.querySelectorAll('.dado.tem').forEach(d=>{

    d.classList.add('pop'); d.dataset.pop=k;
  });

  const cx=document.createElement('div'); cx.className='popbox';
  el.appendChild(cx);

  const abre=(g)=>{const d=ps[g.dataset.pop]; if(!d)return;
    clearTimeout(t);
    /* só o texto: o título já está na tela, no próprio elemento que abriu.
       Repeti-lo dentro da caixa era eco. */
    cx.innerHTML=`<span class="popd">${d[1]}</span>`;

       devolve pixel de TELA e style.left/top são pixel de LAYOUT. Sem dividir
       por k a caixa saía do lugar em toda tela que não fosse 1600x900 — e
       quanto mais longe da medida de projeto, mais longe ela ia. */

    /* sem espaço embaixo, a caixa vira para cima do elemento em vez de
       sangrar para fora da tela */
    const h=cx.offsetHeight, folga=(innerHeight-r.bottom)/K-24;
    cx.style.top = (h>folga ? ((r.top-e.top)/K-h-12) : ((r.bottom-e.top)/K+12))+'px';
    cx.classList.add('on'); g.classList.add('aberto');};
  const fecha=(g)=>{t=setTimeout(()=>cx.classList.remove('on'),160);
    if(g)g.classList.remove('aberto');};
  el.querySelectorAll('.pop').forEach(g=>{
    g.addEventListener('mouseenter',()=>abre(g));
    g.addEventListener('focus',()=>abre(g));
    g.addEventListener('mouseleave',()=>fecha(g));
    g.addEventListener('blur',()=>fecha(g));
    g.addEventListener('click',e=>{e.stopPropagation();abre(g);});
    g.tabIndex=0;
  });
  cx.addEventListener('mouseenter',()=>clearTimeout(t));
  cx.addEventListener('mouseleave',()=>fecha(null));

     Trocar o :root da marca troca a anotação junto. */
  var posto=[], tAnot=null;

  function limpaAnot(){
    posto.forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
    posto=[];
    if(tAnot){ clearInterval(tAnot); tAnot=null; }
  }
  function caixa(m3d,txt,pos,tipo){
    var pop=new m3d.PopoverElement({
      open:true,
      /* sem isto um clique no mapa fecha a anotação — e ela não volta */
      lightDismissDisabled:true,
      altitudeMode:m3d.AltitudeMode.RELATIVE_TO_GROUND});
    var d=document.createElement('div');
    d.className='anot '+tipo; d.textContent=txt;
    pop.append(d);
    pop.positionAnchor=pos;          /* literal, não elemento */
    mapa.append(pop);
    pop._tipo=tipo; pop._el=d;
    posto.push(pop); return pop;
  }
  function haste(m3d,pos,altura,cor,larg){
    var pl=new m3d.Polyline3DElement({
      altitudeMode:m3d.AltitudeMode.RELATIVE_TO_GROUND,
      path:[{lat:pos.lat,lng:pos.lng,altitude:0},
            {lat:pos.lat,lng:pos.lng,altitude:altura}],
      strokeColor:cor,strokeWidth:larg||4,
      drawsOccludedSegments:true,zIndex:15});
    mapa.append(pl); posto.push(pl); return pl;
  }
  function area(m3d,anel,traco,fill,esp){
    function po(cor,f,w,z){
      var pg=new m3d.Polygon3DElement({
        altitudeMode:m3d.AltitudeMode.CLAMP_TO_GROUND,
        path:anel,strokeColor:cor,strokeWidth:w,fillColor:f,
        drawsOccludedSegments:true,zIndex:z});
      mapa.append(pg); posto.push(pg);
    }
    po(tok('--papel')+'d9','#00000000',(esp||3)+3,9);   /* halo */
    po(traco,fill,esp||3,10);
  }

  /* ── PRIORIDADE ENTRE AS CAMADAS ─────────────────────────────────────
     `CollisionBehavior` NÃO existe em `maps3d` — está na biblioteca
     `marker`, que este gabarito não carrega. Logo o desempate é nosso, e
     sem ele o nome de rua atravessa o rótulo do lote em algum ângulo da
     órbita. Pedido do Michel em 04/09: *"faça com que o nome da rua não se
     sobreponha às anotações de projeto, que são mais importantes"*.

     A regra é hierárquica e fixa: lote e contexto sempre aparecem; rua
     cede. Depois as ruas cedem entre si, na ordem em que foram declaradas
     — numa volta de 140 s elas cruzam umas às outras também.

     `visibility`, não `display`: escondido com `display:none` o retângulo
     vira zero, o teste seguinte diz "não colide" e o rótulo pisca a cada
     passada. Com `visibility` a caixa continua medindo. As duas escritas
     de estilo acontecem no mesmo turno de JS, então só o estado final
     pinta — não há tremida.

     Por relógio e não por evento: `gmp-steadychange` não dispara neste
     preview (é o mesmo motivo por que a aproximação espera por relógio), e
     um rAF próprio sobre visor vivo é exatamente o que a regra 1 do
     DECK-MOTOR mandou tirar. 140 ms lê ~10 retângulos pequenos: sete vezes
     por segundo, contra os 60 de um rAF. */
  var FOLGA=6;
  function resolveColisao(){
    var proj=[], ruas=[];
    posto.forEach(function(n){
      if(!n._el) return;
      (n._tipo==='rua'?ruas:proj).push(n._el);
    });
    if(!ruas.length) return;
    var fixos=proj.map(function(e){ return e.getBoundingClientRect(); })
                  .filter(function(r){ return r.width>0; });
    var bate=function(r,c){
      return !(r.right<c.left-FOLGA||r.left>c.right+FOLGA||
               r.bottom<c.top-FOLGA||r.top>c.bottom+FOLGA); };
    ruas.forEach(function(e){
      e.style.visibility='visible';               /* mede sempre visível */
      var r=e.getBoundingClientRect();
      if(!r.width) return;
      var cede=fixos.some(function(c){ return bate(r,c); });
      if(!cede) fixos.push(r);                    /* rua que fica vira obstáculo */
      e.style.visibility=cede?'hidden':'visible';
    });
  }

  function desenhaAnot(){
    limpaAnot();
    var s=DECK[cur]; if(!s||!mapa||!lib) return;
    var m3d=lib;
    if(!m3d.PopoverElement) return;    /* preview sem popover: sai calado */
    var VINHO=tok('--primaria'), FERRO=tok('--tinta');
    (s.anot||[]).forEach(function(a){
      var cor=a.tipo==='ctx'?FERRO:VINHO;
      if(a.anel&&a.anel.length){
        var anel=a.anel.map(function(q){ return {lat:q[0],lng:q[1]}; });
        area(m3d,anel,cor+(a.tipo==='ctx'?'e6':'ff'),
             cor+(a.tipo==='ctx'?'1a':'38'), a.tipo==='ctx'?2.5:4.5);
      }
      var pos={lat:a.lat,lng:a.lng};
      var h=a.h||(a.tipo==='ctx'?62:52);
      haste(m3d,pos,h,cor+(a.tipo==='ctx'?'cc':'ff'),a.tipo==='ctx'?3:5);
      caixa(m3d,a.rot,{lat:a.lat,lng:a.lng,altitude:h},a.tipo==='ctx'?'ctx':'obra');
    });
    (s.ruas||[]).forEach(function(r){
      caixa(m3d,r.rot,{lat:r.lat,lng:r.lng,altitude:r.h||14},'rua');
    });
    if(posto.length){
      resolveColisao();
      tAnot=setInterval(resolveColisao,140);
    }
  }

  function aproxima(p){
    ANCORA={lat:p.lat,lng:p.lng,alt:p.alt};
    /* ⚠ A APROXIMACAO NAO E ENFEITE. Criar o visor com o range final devolve
       tela azul lisa: o motor ainda nao tem a malha e a camera nasce dentro
       do chao. Nao existe evento de "terminei" — gmp-steadychange nao dispara
       neste preview —, por isso a espera e por relogio, e generosa. */
    var passos=DEGRAUS.concat([CAM.range]), i=0;
    (function passo(){
      if(!mapa) return;
      mapa.center={lat:p.lat,lng:p.lng,altitude:p.alt};
      mapa.range=passos[i];
      mapa.tilt=(i===0)?CAM.tiltEntrada:CAM.tilt;
      mapa.heading=CAM.heading;
      i++;
      progresso(1+i,'aproximando · '+i+' de '+passos.length);
      if(i<passos.length){ setTimeout(passo,PAUSA); return; }
      progresso(TOTAL-1,'assentando a malha');
      setTimeout(function(){
        var d=diagnostica(); if(d){ falha(d); return; }
        progresso(TOTAL,'pronto');
        if(slide) slide.classList.remove('esperando');
        /* a anotacao entra com a malha assentada, nunca antes: a caixa
           ancorada em coordenada precisa do terreno para saber onde pousar. */
        desenhaAnot();
        orbita(true);            /* entra girando, devagar */
      },4000);
    })();
  }
  function orbita(liga){
    if(!mapa||!slide) return;
    orbitando=liga;
    slide.classList.toggle('orbitando',liga);
    var bt=slide.querySelector('.orb');
    if(bt) bt.lastChild.textContent=liga?'parar':'orbitar';
    if(!liga){
      /* para tambem a animacao nativa: o RECENTRAR usa `flyCameraTo`, e se
         ele estiver no ar a orbita e a viagem disputam a mesma camera. */
      if(mapa.stopCameraAnimation) mapa.stopCameraAnimation();
      if(rafOrb){ cancelAnimationFrame(rafOrb); rafOrb=null; }
      return;
    }
    /* ── a rotacao, integrada quadro a quadro ────────────────────────────
       `alvo` em graus por segundo, derivado de VOLTA. A rampa e easeOut
       sobre a VELOCIDADE: sobe rapido e assenta — a sensacao de "cliquei e
       esta acontecendo". Rampa linear da partida mole; easeIn da exatamente
       o que o Michel nao quer.
       O `dt` e medido, nao presumido: em quadro perdido a camera nao pula
       nem trava, porque o avanco e velocidade x tempo real. Teto de 50 ms
       para aba que voltou do segundo plano nao dar um salto. */
    var alvo=360/(VOLTA/1000);
    var t0=performance.now(), ult=t0;
    rafOrb=requestAnimationFrame(function passo(now){
      if(!orbitando||!mapa) return;
      rafOrb=requestAnimationFrame(passo);
      var dt=Math.min((now-ult)/1000,0.05); ult=now;
      var k=Math.min(1,(now-t0)/RAMPA);
      var vel=alvo*(1-Math.pow(1-k,3));
      mapa.heading=((mapa.heading||0)+vel*dt)%360;
    });
  }
  /* ── RECENTRAR ─────────────────────────────────────────────────────────
     Volta ao enquadramento canonico. `flyCameraTo` e da propria API e faz a
     volta com animacao; sem ela, escreve-se center/range/tilt/heading direto
     — corte em vez de voo, mas cumpre. A orbita para antes: duas animacoes
     de camera se atropelam. E volta a girar quando a viagem termina, porque
     e assim que o slide se comporta. */
  function recentra(){
    if(!mapa||!ANCORA) return;
    var girava=orbitando;
    if(girava) orbita(false);
    var alvo={center:{lat:ANCORA.lat,lng:ANCORA.lng,altitude:ANCORA.alt},
              range:CAM.range,tilt:CAM.tilt,heading:CAM.heading};
    if(mapa.flyCameraTo){ mapa.flyCameraTo({endCamera:alvo,durationMillis:2200}); }
    else { mapa.center=alvo.center; mapa.range=alvo.range;
           mapa.tilt=alvo.tilt; mapa.heading=alvo.heading; }
    var bt=slide&&slide.querySelector('.rec');
    if(bt){ bt.classList.add('feito'); setTimeout(function(){ bt.classList.remove('feito'); },900); }
    if(girava) setTimeout(function(){ orbita(true); },2400);
  }
  function monta(){
    var vis=slide.querySelector('.visor');
    var p={lat:parseFloat(vis.dataset.lat),lng:parseFloat(vis.dataset.lng),
           alt:parseFloat(vis.dataset.alt)||760};
    /* ensaio sem republicar: ?ll=lat,lng troca o ponto; ?alt=760 a altitude */
    var q=new URLSearchParams(location.search);
    var ll=(q.get('ll')||'').match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
    if(ll){ p.lat=parseFloat(ll[1]); p.lng=parseFloat(ll[2]); }
    if(q.get('alt')) p.alt=parseFloat(q.get('alt'))||p.alt;

    if(!chave()){ falha('Sem chave da Maps Platform nao ha o que desenhar. Ela mora em <code>modulos/ms-maps-chave.js</code>.'); return; }
    if(location.protocol==='file:'){
      falha('Esta pagina esta aberta como arquivo (<code>file://</code>) e a Maps JavaScript API recusa essa origem. Este slide so funciona pelo link publicado — e por isso que a peca se entrega por endereco, nunca como anexo.');
      return;
    }
    gritou=null;
    /* se o aquecimento ja rodou, esta promessa ja esta resolvida e o passo
       "carregando a api" passa num piscar — o indicador salta direto para
       "aproximando · 1 de 4". */
    lib3d().then(function(m3d){
        lib=m3d;
        if(mapa&&mapa.parentNode) mapa.parentNode.removeChild(mapa);
        mapa=new m3d.Map3DElement({
          center:{lat:p.lat,lng:p.lng,altitude:p.alt},
          range:CAM.range,tilt:CAM.tiltEntrada,heading:CAM.heading,
          /* MapMode, nao Map3DMode. SATELLITE e nao HYBRID: o hibrido cobre
             a cidade de pinos de restaurante e rotulo de rua. */
          mode:m3d.MapMode?m3d.MapMode.SATELLITE:'SATELLITE'});
        vis.insertBefore(mapa,vis.firstChild);
        setTimeout(function(){
          var d=diagnostica(); if(d){ falha(d); return; }
          aproxima(p);
        },1400);
      })['catch'](function(e){
        var d=diagnostica();
        falha(d||'Nao deu para carregar a API do Google (<code>'+((e&&e.message)||'erro')
          +'</code>). Este slide nao funciona offline.');
      });
  }
  function desativa(){
    document.querySelectorAll('.g-earth-3d').forEach(function(sl){ sl.classList.remove('girando'); });
  }
  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-earth-3d'); if(!sl) return;
    if(e.target.closest('.orb')){ e.stopPropagation(); orbita(!orbitando); return; }
    if(e.target.closest('.rec')){ e.stopPropagation(); recentra(); return; }
    if(e.target.closest('.sair')){ e.stopPropagation(); desativa(); document.body.focus(); return; }
    if(e.target.closest('.veu')){ e.stopPropagation(); sl.classList.add('girando');
      if(orbitando) orbita(false); }          /* quem pegou o mouse manda */
  });
  /* indices de todo slide earth-3d do deck. Generico de proposito: se um dia
     a peca tiver dois visores, os dois aquecem no slide que os antecede. */
  var PROX=[];
  DECK.forEach(function(s,i){ if(s.g==='earth-3d') PROX.push(i); });

  return {
    chegou:function(){
      var s=DECK[cur];
      /* NIVEL 1 — aquece ao chegar no slide imediatamente anterior */
      if(PROX.indexOf(cur+1)>=0) aquece();
      if(!s||s.g!=='earth-3d'){
        desativa(); if(orbitando) orbita(false);
        /* DESMONTA ao sair: o Map3DElement e um contexto WebGL vivo que ficava
           atras de todos os slides seguintes (04/09/2026). Na volta remonta —
           a API ja esta carregada e o indicador de carga e honesto. */
        /* a anotacao vai com o mapa: os popovers sao filhos dele, e o
           relogio do resolvedor de colisao tem de parar. */
        limpaAnot();
        if(mapa){ if(mapa.parentNode) mapa.parentNode.removeChild(mapa); mapa=null; }
        if(montado){ montado=false;
          document.querySelectorAll('.g-earth-3d').forEach(function(sl){ sl.classList.remove('esperando','pronto','girando','falhou'); }); }
        return;
      }
      slide=document.querySelectorAll('#palco .slide')[cur];
      if(montado){ if(!orbitando&&mapa) orbita(true); return; }
      montado=true; slide.classList.add('esperando');
      progresso(1,'carregando a api'); monta();
    },

    /* ── COSTURAS DE TESTE ────────────────────────────────────────────────
       Só o gate `colisao.js` chama. Existem porque a Maps API não sai do
       container de build: o visor nunca monta, a anotação nunca desenharia,
       e a prioridade entre as camadas — que é lógica NOSSA e regride sem
       ninguém ver — ficaria sem cobertura. Com estas duas o gate injeta um
       dublê da `maps3d` e exercita o desenho e o resolvedor de verdade.
       Não fazem nada em apresentação: ninguém as chama. */
    __teste:function(o){ lib=o.lib; mapa=o.mapa; desenhaAnot(); },
    __resolve:resolveColisao
  };
})();


/* ═══════════════════════════════════════════════════════════════════════════
   VISOR DO MODELO SKETCHUP — portado de modulos/modelo-sketchup.html
   Irmao do MSEarth: um mostra ONDE o projeto esta, este mostra O QUE ele e.

   Medido em 02/09/2026 com sonda publicada no dominio real: o
   `app.sketchup.com/viewer/3dw?WarehouseModelId=<id>` aceita ser embedado a
   partir de steinvalente-dev.github.io, direto, com painel de Cenas,
   Sombras, projecoes e elevacoes padrao, e sem marca de terceiro.

   ⚑ TRES COISAS QUE NAO SAO DETALHE:
   1. o iframe monta AO CHEGAR no slide, nunca na carga — 40 MB;
   2. o modelo TEM DE ESTAR PUBLICO no 3D Warehouse: deck publicado e
      servido a visitante anonimo, e modelo privado devolve 404;
   3. nao ha como detectar iframe recusado por cabecalho — `onerror` nao
      dispara e o documento e cross-origin. O que se detecta e a AUSENCIA
      de `load` no prazo. Dai a reserva ter TRES portas: relogio,
      `navigator.onLine === false`, e um botao — porque o caso "carregou
      uma pagina de erro" so quem ve e quem apresenta.
   ═════════════════════════════════════════════════════════════════════════ */
window.MSModelo=(function(){
  'use strict';
  var BASE='https://app.sketchup.com/viewer/3dw?WarehouseModelId=';
  var TOTAL=3;
  var PRAZO_DOC=25000;      /* documento nao chegou: rede ou bloqueio      */
  var PRAZO_MODELO=12000;   /* documento chegou; janela ate declarar pronto */
  var montado=false, caiu=false, tDoc=null, tModelo=null, slide=null;

  function el(sel){ return slide?slide.querySelector(sel):null; }
  function progresso(p,rotulo){
    var f=el('.barra i'), t=el('.passos');
    if(f) f.style.width=Math.round(Math.min(p,TOTAL)/TOTAL*100)+'%';
    if(t) t.textContent=rotulo;
  }
  function falha(txt){
    if(!slide) return;
    slide.classList.remove('esperando'); slide.classList.add('falhou');
    var b=el('.estado b'), sp=el('.estado span');
    if(b) b.textContent='o modelo 3d nao abriu';
    if(sp) sp.innerHTML=txt+'<br><br>As imagens salvas continuam valendo — botao <b>imagens</b>.';
  }
  function reserva(liga){
    caiu=!!liga;
    if(slide){ slide.classList.toggle('reserva-on',caiu);
               if(caiu) slide.classList.remove('girando'); }
  }
  function vaiPara(i){
    var imgs=slide.querySelectorAll('.reserva .ph img');
    var bts=slide.querySelectorAll('.cenas button');
    if(!imgs.length) return;
    i=(i+imgs.length)%imgs.length;
    imgs.forEach(function(im,j){ im.classList.toggle('on',j===i); });
    bts.forEach(function(b,j){ b.classList.toggle('on',j===i); });
    var cap=imgs[i].getAttribute('alt')||'';
    var rc=el('.rescap'); if(rc) rc.textContent=cap;
  }
  function monta(){
    if(montado||!slide) return;
    montado=true;
    var q=el('iframe'), id=el('.visor').dataset.modelo;
    slide.classList.add('esperando');
    progresso(1,'pedindo o modelo');

    if(navigator.onLine===false){
      /* sem rede nao ha o que esperar: cai direto para a reserva, que e
         exatamente o cenario para o qual ela existe. */
      reserva(true); falha('Sem conexao de rede.'); return;
    }
    q.addEventListener('load',function(){
      if(tDoc){ clearTimeout(tDoc); tDoc=null; }
      progresso(2,'montando a malha');
      /* o documento chegou; o modelo ainda desce. A janela abaixo e tempo,
         nao medicao — e esta dito como tal, aqui e no modulo. */
      tModelo=setTimeout(function(){
        progresso(TOTAL,'pronto');
        slide.classList.remove('esperando');
        slide.classList.add('pronto');
      },PRAZO_MODELO);
    });
    tDoc=setTimeout(function(){
      falha('O quadro do viewer nao respondeu em '+(PRAZO_DOC/1000)+' s. '
        +'Pode ser a rede, pode ser rede corporativa que bloqueia quadro de '
        +'outro dominio, e pode ser o modelo nao estar <b>publico</b> no 3D '
        +'Warehouse — modelo privado devolve 404 para quem abre o link.');
    },PRAZO_DOC);
    q.src=BASE+encodeURIComponent(id);
  }
  function recomeca(){
    if(!slide) return;
    /* recarregar e o unico caminho de volta: a camera e do viewer da Trimble
       e nao ha API para traze-la. Custa uma nova carga, e o indicador volta
       a aparecer — o que e honesto. */
    if(tDoc) clearTimeout(tDoc);
    if(tModelo) clearTimeout(tModelo);
    montado=false;
    slide.classList.remove('pronto','girando','falhou');
    el('iframe').src='about:blank';
    reserva(false);
    monta();
  }
  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-modelo-3d'); if(!sl) return;
    slide=sl;
    if(e.target.closest('.rec')){ e.stopPropagation(); recomeca(); return; }
    if(e.target.closest('.img')){ e.stopPropagation(); reserva(!caiu); return; }
    var bt=e.target.closest('.cenas button');
    if(bt){ e.stopPropagation(); vaiPara(parseInt(bt.dataset.i,10)); return; }
    if(e.target.closest('.sair')){ e.stopPropagation(); sl.classList.remove('girando');
      document.body.focus(); return; }
    if(e.target.closest('.veu')){ e.stopPropagation(); sl.classList.add('girando'); }
  });
  /* setas passeiam pelas imagens de reserva quando ela esta no ar */
  addEventListener('keydown',function(e){
    if(!caiu||!slide) return;
    var imgs=[].slice.call(slide.querySelectorAll('.reserva .ph img'));
    if(!imgs.length) return;
    var atual=imgs.findIndex(function(i){ return i.classList.contains('on'); });
    if(e.key==='ArrowRight'){ e.preventDefault(); vaiPara(atual+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); vaiPara(atual-1); }
  });
  return {
    chegou:function(){
      var s=DECK[cur];
      if(!s||s.g!=='modelo-3d'){
        /* DESMONTA ao sair: o viewer do SketchUp (~40 MB, WebGL) ficava vivo
           atras dos slides seguintes (04/09/2026). src vazio libera; na volta
           monta() recarrega, com o indicador de carga. A reserva fica. */
        if(tDoc){ clearTimeout(tDoc); tDoc=null; }
        if(tModelo){ clearTimeout(tModelo); tModelo=null; }
        document.querySelectorAll('.g-modelo-3d').forEach(function(sl){
          sl.classList.remove('girando','esperando','pronto','falhou');
          var q=sl.querySelector('iframe'); if(q&&q.src&&q.src!=='about:blank') q.src='about:blank'; });
        montado=false;
        return;
      }
      slide=document.querySelectorAll('#palco .slide')[cur];
      monta();
    }
  };
})();

/* liga as duas coisas ao go(), depois da cortina diagonal — a cortina adia a
   troca em 580 ms, por isso a espera aqui. */
(function(){
  var _go=window.go;
  window.go=function(i,tudo){ _go(i,tudo); setTimeout(function(){
    window.__msPuxa(); MSEarth.chegou(); MSModelo.chegou(); },700); };
  window.__msPuxa(); MSEarth.chegou(); MSModelo.chegou();
})();

<!-- retorno ao acervo + camada de toque. Comportamento em modulos/ms-voltar.js.
     Reposto em 25/08: veio de outra sessão, no commit e8bf561, e o build local
     não sabia dele. Toda peça do acervo carrega esta linha. -->
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ESCOLHA E GALERIA — o motor das duas
   Pedidos do Michel em 04/09/2026. Ficam AQUI, no esqueleto, e não na peça:
   bifurcação e mosaico não são assunto da EMEI, são gabarito da casa.
   ═════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  /* ── A BIFURCAÇÃO ────────────────────────────────────────────────────
     `para` é o NOME de um gabarito, e o destino é o PRÓXIMO slide daquele
     gabarito. Nunca índice: quando uma seção entra no meio do DECK, índice
     chumbado aponta para o slide errado — já quebrou um teste nesta peça, e
     numa bifurcação quebraria na frente do cliente.
     `ir` aceita índice absoluto, para o caso raro de destino que não é
     gabarito próprio. Se nenhum dos dois resolve, a pílula AVANÇA — nunca
     fica morta na tela. */
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.g-escolha .pill');
    if(!b) return;
    e.stopPropagation();
    var i=-1;
    if(b.dataset.ir!=null && b.dataset.ir!=='') i=parseInt(b.dataset.ir,10);
    if(i<0 && b.dataset.para){
      for(var j=cur+1;j<DECK.length;j++){ if(DECK[j].g===b.dataset.para){ i=j; break; } }
    }
    go(i>=0?i:cur+1,true);
  });

  /* ── A GALERIA E A LUPA ──────────────────────────────────────────────
     A lupa é CAMADA sobre o slide, não slide. Decisão do Michel: as setas
     passeiam pelas vistas daquela versão e o deck só anda quando ela fecha.
     É o que permite ficar numa imagem enquanto o cliente fala.

     ⚑ A MINIATURA JÁ BAIXOU A IMAGEM. A lupa copia o `src` da miniatura em
     vez de montar um caminho: mesmo arquivo, cache do navegador, zero
     segunda carga. Se a miniatura ainda não chegou (o __msPuxa entra no
     slide), cai no `data-src`.

     ⚑ `em-imagem` ENTRA COM A LUPA. A galeria fechada é mosaico sobre a
     moldura e o logotipo do canto lê em positivo; aberta, ele fica sobre um
     render e tem de virar monocromático em Cal. Falha silenciosa clássica —
     é a regra 6 do DECK-MONTAR, e já custou duas rodadas em 02/09. */
  var atual=-1;

  function galeria(){ return document.querySelector('#palco .slide.ativo.g-galeria'); }
  function fotos(sl){ return [].slice.call(sl.querySelectorAll('.tijolo')); }

  function abre(sl,i){
    var t=fotos(sl); if(!t.length) return;
    atual=(i+t.length)%t.length;
    var tij=t[atual], im=tij.querySelector('img');
    var alvo=sl.querySelector('.lupa img');
    if(im) alvo.src=im.currentSrc||im.src||im.dataset.src||'';
    alvo.alt=tij.dataset.rot||'';
    sl.querySelector('.lupa .lupaov h3').textContent=tij.dataset.rot||'';
    sl.querySelector('.lupa .lupaov span').textContent=tij.dataset.cap||'';
    sl.querySelector('.lupa .lconta').textContent=(atual+1)+' / '+t.length;
    var so=t.length<2;
    sl.querySelector('.lupa .lant').hidden=so;
    sl.querySelector('.lupa .lpro').hidden=so;
    sl.classList.add('lupando');
    document.body.classList.add('em-imagem');
    if(window.__msAcorda) window.__msAcorda();   /* o X aparece ao abrir */
  }
  function fecha(sl){
    if(!sl) return;
    sl.classList.remove('lupando');
    atual=-1;
    /* devolve o chrome ao estado do SLIDE, que o go() calcula: a galeria
       fechada não é fundo de imagem. */
    document.body.classList.toggle('em-imagem',
      !!(DECK[cur] && (DECK[cur].g==='cheia'||DECK[cur].g==='earth-3d'
                       ||DECK[cur].g==='modelo-3d'||DECK[cur].g==='mapa-2d')));
  }
  window.__msLupaFecha=function(){ fecha(galeria()); };

  document.addEventListener('click',function(e){
    var sl=e.target.closest&&e.target.closest('.g-galeria');
    if(!sl) return;
    var tij=e.target.closest('.tijolo');
    if(tij){ e.stopPropagation(); abre(sl,parseInt(tij.dataset.i,10)); return; }
    if(!sl.classList.contains('lupando')) return;
    e.stopPropagation();                       /* lupa aberta: o deck não anda */
    if(e.target.closest('.fechar')){ fecha(sl); return; }
    if(e.target.closest('.lant')){ abre(sl,atual-1); return; }
    if(e.target.closest('.lpro')){ abre(sl,atual+1); return; }
    /* clique no fundo da lupa fecha: é o gesto que todo mundo tenta */
    fecha(sl);
  });

  /* teclado da lupa. Registrado na FASE DE CAPTURA para chegar antes do
     handler do deck — sem isso a seta avançaria o slide E a vista. */
  addEventListener('keydown',function(e){
    var sl=galeria(); if(!sl||!sl.classList.contains('lupando')) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); fecha(sl); return; }
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){
      e.preventDefault(); e.stopPropagation(); abre(sl,atual+1); return; }
    if(e.key==='ArrowLeft'||e.key==='PageUp'){
      e.preventDefault(); e.stopPropagation(); abre(sl,atual-1); return; }
  },true);
})();

/* ─── ociosidade do ponteiro ───────────────────────────────────────────
   1,8 s parado e o body ganha `ocioso`. Qualquer gesto tira. Genérico de
   propósito: quem decide ONDE o efeito acontece é a classe `em-cheia`.
   ─────────────────────────────────────────────────────────────────── */
(function(){
  var t=null, ATRASO=1800;
  window.__msAcorda=function(){
    document.body.classList.remove('ocioso');
    clearTimeout(t);
    t=setTimeout(function(){ document.body.classList.add('ocioso'); }, ATRASO);
  };
  ['pointermove','pointerdown','wheel','keydown','touchstart'].forEach(function(ev){
    addEventListener(ev, window.__msAcorda, {passive:true});
  });
  window.__msAcorda();
})();
</script>
