<!-- Fontes embutidas em woff2/base64, subconjunto latino + pontuacao.
     Regra do PRANCHA-SISTEMA: nenhuma dependencia de CDN. O arquivo abre
     igual sem rede, e a tipografia da marca nunca cai para fallback. -->
<style>
/* ═══ FONTES DA MARCA ═══════════════════════════════════════════════════
   AQUI ENTRAM AS @font-face EM BASE64, do bloco da marca (quantas a marca
   tiver: seis na michel stein_, quatro na Sarasá e na AMAZ, oito na Lavrō).
   Sem elas a peça cai na fonte do sistema num notebook de cliente —
   inclusive online, porque não há link para CDN nenhum. É a diferença
   entre a peça rodar sem internet e parecer outra coisa na reunião.
   michel stein_ → marca/michel-stein/bloco.html · Sarasá → marca/sarasa/bloco.html
   AMAZ → marca/amaz/bloco.html · Lavrō → marca/lavro/bloco.html
   ═══════════════════════════════════════════════════════════════════ */

/* ═══ TOKENS DA MARCA — o ÚNICO bloco que se troca ═══════════════════════
   Um nome por PAPEL, igual nos quatro blocos de marca (03/09/2026):
     --papel     fundo claro; texto sobre campo escuro
     --tinta     texto sobre papel; glifos do chrome; filetes
     --primaria  a cor da marca: blocos, pílulas, kicker em barra
     --acento    o destaque: um traço, uma palavra, o popover, o divisor
     --escuro    fundo do tema escuro (`esc`). Se a marca não tiver, é a tinta
     --acento-claro  o acento sobre campo escuro, onde o acento cheio some
     --f-display  títulos, números grandes, rótulos-título
     --f-corpo    texto corrido
     --f-mono     kicker, chrome, legenda, metadado
   Trocar de marca = substituir ESTE bloco pelo :root do bloco da marca.
   Nada abaixo dele (derivados, escala) se toca. Está com os valores da
   michel stein_ para o esqueleto abrir pintado.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --papel:#EDE6DA;  --tinta:#211D1A;  --primaria:#6B6A4B;  --acento:#B85C38;
  --escuro:#6B6A4B;         /* na michel stein_ o tema escuro é a oliva     */
  --acento-claro:#E9A184;   /* terracota clareado, para ler sobre a oliva   */
  --f-display:'DM Mono',ui-monospace,monospace;
  --f-corpo:'Inter',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,monospace;
}

/* ═══ DERIVADOS — motor, calculados dos tokens acima. NÃO se colam ═══════
   Todo hex que o CSS e os scripts usavam à mão saiu daqui: o papel e a
   tinta em transparências (--papel-70 = papel a 70%), o acento em duas,
   e os tons de apoio. Trocar a marca trocou tudo isto junto.
   Aliases dos nomes antigos (--creme, --oliva, --terra, --mono, --sans…)
   ficam para módulo externo que ainda os use. Não escrever código novo
   com eles.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --moldura:color-mix(in srgb,var(--tinta) 80%,#000);  /* a tarja: tinta puxada ao preto puro (#000 é semântico) */
  --soft:var(--tinta-60); --hair:var(--tinta-15);
  --papel-2:color-mix(in srgb,var(--papel) 95%,var(--tinta));       /* papel um tom abaixo (fundo de mapa) */
  --slot-escuro:color-mix(in srgb,var(--moldura) 75%,var(--escuro)); /* slot vazio sobre a moldura */
  /* categorias do mapa de lotes — cor de dado, não de marca; a marca pode sobrescrever */
  --mapa-escuro:color-mix(in srgb,var(--primaria) 60%,var(--tinta));
  --mapa-novo:color-mix(in srgb,var(--primaria) 70%,var(--papel));
  --mapa-planta:#6E6486;   /* roxo de categoria: só existe para se distinguir dos outros */
  /* transparências */
  --papel-90:color-mix(in srgb,var(--papel) 90%,transparent); --papel-80:color-mix(in srgb,var(--papel) 80%,transparent); --papel-70:color-mix(in srgb,var(--papel) 70%,transparent); --papel-60:color-mix(in srgb,var(--papel) 60%,transparent); --papel-50:color-mix(in srgb,var(--papel) 50%,transparent);
  --papel-45:color-mix(in srgb,var(--papel) 45%,transparent); --papel-40:color-mix(in srgb,var(--papel) 40%,transparent); --papel-35:color-mix(in srgb,var(--papel) 35%,transparent); --papel-25:color-mix(in srgb,var(--papel) 25%,transparent); --papel-20:color-mix(in srgb,var(--papel) 20%,transparent);
  --papel-15:color-mix(in srgb,var(--papel) 15%,transparent); --papel-10:color-mix(in srgb,var(--papel) 10%,transparent); --papel-5:color-mix(in srgb,var(--papel) 5%,transparent); --papel-3:color-mix(in srgb,var(--papel) 3%,transparent);
  --tinta-90:color-mix(in srgb,var(--tinta) 90%,transparent); --tinta-80:color-mix(in srgb,var(--tinta) 80%,transparent); --tinta-70:color-mix(in srgb,var(--tinta) 70%,transparent); --tinta-60:color-mix(in srgb,var(--tinta) 60%,transparent); --tinta-50:color-mix(in srgb,var(--tinta) 50%,transparent);
  --tinta-45:color-mix(in srgb,var(--tinta) 45%,transparent); --tinta-40:color-mix(in srgb,var(--tinta) 40%,transparent); --tinta-35:color-mix(in srgb,var(--tinta) 35%,transparent); --tinta-25:color-mix(in srgb,var(--tinta) 25%,transparent); --tinta-20:color-mix(in srgb,var(--tinta) 20%,transparent);
  --tinta-15:color-mix(in srgb,var(--tinta) 15%,transparent); --tinta-10:color-mix(in srgb,var(--tinta) 10%,transparent); --tinta-5:color-mix(in srgb,var(--tinta) 5%,transparent); --tinta-3:color-mix(in srgb,var(--tinta) 3%,transparent);
  --acento-90:color-mix(in srgb,var(--acento) 90%,transparent); --acento-80:color-mix(in srgb,var(--acento) 80%,transparent); --acento-70:color-mix(in srgb,var(--acento) 70%,transparent); --acento-60:color-mix(in srgb,var(--acento) 60%,transparent); --acento-50:color-mix(in srgb,var(--acento) 50%,transparent);
  --acento-45:color-mix(in srgb,var(--acento) 45%,transparent); --acento-40:color-mix(in srgb,var(--acento) 40%,transparent); --acento-35:color-mix(in srgb,var(--acento) 35%,transparent); --acento-25:color-mix(in srgb,var(--acento) 25%,transparent); --acento-20:color-mix(in srgb,var(--acento) 20%,transparent);
  --acento-15:color-mix(in srgb,var(--acento) 15%,transparent); --acento-10:color-mix(in srgb,var(--acento) 10%,transparent); --acento-5:color-mix(in srgb,var(--acento) 5%,transparent); --acento-3:color-mix(in srgb,var(--acento) 3%,transparent);
  /* aliases antigos */
  --creme:var(--papel); --oliva:var(--primaria); --terra:var(--acento);
  --mono:var(--f-mono); --sans:var(--f-corpo); --disp:var(--f-display); --label:var(--f-mono);
  --vinho:var(--primaria); --escura:var(--escuro); --grafite:var(--tinta); --marca:var(--primaria);
}
:root{
  /* ═══ ESCALA: É MOTOR, NÃO MARCA ════════════════════════════════════
     ⚑ ESTES NÚMEROS NÃO SE TOCAM, E O MOTIVO NÃO É "estão travados".
     O motivo é que o Michel reconhece a proporção de longe: corpo de texto,
     margem e botão de navegação têm de sair IGUAIS em toda peça, de toda
     frente. Peça que muda a proporção é peça errada, não peça diferente.

     Recalibrados em 02/09/2026 para os valores da `casa-ittb`, que é a peça
     de referência da casa. A tabela de 19/08 tinha encolhido tudo para
     caber num quadro de 1600 × 900 — corpo com teto de 17px onde a ITTB usa
     20, seta de 30px onde a ITTB usa 56. Era isso que se via como "está
     pouco diferente do que eu esperava".

     Unidades em cqw/cqh, do #quadro — que agora tem o tamanho da tela.
     1cqw = 1% da largura; num monitor de 1600 dá os mesmos 16px de sempre.
     ══════════════════════════════════════════════════════════════════ */
  /* margem e faixas */
  --gut:clamp(26px,4.75cqw,96px);        /* margem do chrome            */
  --gut-in:clamp(38px,8cqw,190px);       /* margem interna — o respiro  */
  --top:clamp(70px,9.4cqh,116px);        /* faixa do chrome alto        */
  --bot:clamp(62px,8.2cqh,104px);        /* faixa do chrome baixo       */
  --y-topo:clamp(17px,2.5cqh,38px);
  --h-faixa:clamp(22px,1.9cqw,38px);
  /* texto */
  --fs-mega:clamp(38px,4.6cqw,92px);     /* ITTB --fs-h1                */
  --fs-big:clamp(24px,2.65cqw,52px);     /* ITTB --fs-h2                */
  --fs-h:clamp(19px,2.1cqw,40px);
  --fs-item:clamp(17px,1.38cqw,28px);    /* ITTB --fs-item              */
  --fs-lead:clamp(15px,1.25cqw,24px);
  --fs-body:clamp(13.5px,1.03cqw,20px);  /* ITTB --fs-body              */
  --fs-small:clamp(12px,.88cqw,17px);
  --fs-kick:clamp(10.5px,.8cqw,15px);
  --fs-cap:clamp(9.5px,.72cqw,14px);     /* ITTB --fs-cap               */
  --fs-num:clamp(28px,3.15cqw,58px);
  --fs-div:clamp(42px,6cqw,124px);       /* nome da seção no divisor    */
  --fs-secao:clamp(15px,1.42cqw,29px);
  --fs-marca:clamp(14px,1.28cqw,26px);   /* assinatura, alto direita    */
  --fs-pe:clamp(13px,1.16cqw,23px);      /* projeto · cliente, pé       */
  /* navegação */
  --seta:clamp(38px,2.9cqw,56px);        /* ITTB — o tamanho do botão   */
  --pt:clamp(6px,.44cqw,9px);            /* bolinha de seção            */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
/* o body deixou de ser o fundo da prancha e virou a MOLDURA: quem pinta o
   tema é o #quadro. Nasceu no tempo do letterbox, em que as tarjas mudavam
   de cor a cada slide e a peça piscava por fora. Sem tarja continua certo:
   o #quadro é a superfície, e a moldura é o campo que sobra sob o `contain`
   da prancha de imagem — o único lugar onde ela ainda aparece. */
body{background:var(--moldura);color:var(--tinta);font-family:var(--f-corpo);-webkit-font-smoothing:antialiased;
  transition:color .38s ease}
#quadro{background:var(--papel);transition:background .38s ease}
body.esc{color:var(--papel)}
body.esc #quadro{background:var(--escuro)}
#palco{position:absolute;inset:0}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(var(--top) + clamp(14px,2.4cqh,40px)) var(--gut) calc(var(--bot) + clamp(14px,2.4cqh,40px));
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .15s,transform .15s}
.slide.ativo{opacity:1;pointer-events:auto;transform:none;transition:opacity .44s ease,transform .44s ease}
.rev{opacity:0;transform:translateY(14px)}
.revelado .rev{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*42ms)}
.passo{opacity:0;transform:translateY(14px);transition:opacity .34s,transform .34s}
.passo.on{opacity:1;transform:none}
h1,h2,h3{font-family:var(--f-display);font-weight:500;font-style:italic;letter-spacing:-.045em;line-height:1.02;text-transform:lowercase}
u{text-decoration:none;color:var(--acento)}
.kick{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin-bottom:clamp(14px,2cqh,28px)}
body.esc .kick{color:var(--papel-70)}
.mega{font-size:var(--fs-mega);max-width:19ch}
.big{font-size:var(--fs-big);max-width:22ch}
.sub{font-size:var(--fs-body);line-height:1.62;max-width:58ch;color:var(--soft);margin-top:clamp(11px,1.8cqh,28px)}
body.esc .sub{color:var(--papel-80)}
.prem{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.7;color:var(--acento);
  border-left:2px solid var(--acento);padding-left:13px;margin-top:clamp(14px,2cqh,26px);max-width:62ch}
body.esc .prem{color:var(--acento-claro);border-color:var(--acento-claro)}
.dados{display:grid;gap:clamp(14px,2cqw,34px);margin-top:clamp(18px,3cqh,52px);
  grid-template-columns:repeat(auto-fit,minmax(clamp(150px,15cqw,230px),1fr))}
.dado{border-top:1px solid var(--hair);padding-top:clamp(10px,1.4cqh,18px)}
body.esc .dado{border-color:var(--papel-25)}
.dado .v{font-family:var(--f-display);font-weight:500;font-size:var(--fs-num);letter-spacing:-.05em;line-height:1;display:block}
.dado .l{font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:10px;display:block;line-height:1.5}
body.esc .dado .l{color:var(--papel-70)}
.dado .n{font-size:var(--fs-body);color:var(--soft);margin-top:8px;line-height:1.5;display:block}
body.esc .dado .n{color:var(--papel-70)}
ol.lista{list-style:none;margin-top:clamp(20px,3cqh,42px);display:grid;gap:clamp(10px,1.5cqh,20px)}
ol.lista li{display:grid;grid-template-columns:clamp(46px,4.6cqw,78px) 1fr;gap:clamp(10px,1.4cqw,22px);
  align-items:baseline;border-top:1px solid var(--hair);padding-top:clamp(9px,1.2cqh,15px)}
body.esc ol.lista li{border-color:var(--papel-25)}
ol.lista .q{font-family:var(--f-display);font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--acento)}
ol.lista .t{font-size:var(--fs-item);line-height:1.5}
ol.lista .t b{font-weight:600}
table.tb{width:100%;border-collapse:collapse;margin-top:clamp(20px,3cqh,42px);font-size:var(--fs-item)}
table.tb th{font-family:var(--f-mono);font-weight:400;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--tinta)}
body.esc table.tb th{color:var(--papel-70);border-color:var(--papel)}
table.tb td{padding:clamp(11px,1.5cqh,19px) 0;border-bottom:1px solid var(--hair);vertical-align:baseline;line-height:1.45}
body.esc table.tb td{border-color:var(--papel-20)}
table.tb td+td,table.tb th+th{padding-left:clamp(14px,2cqw,40px);text-align:right}
table.tb td.d{font-family:var(--f-display);font-weight:500;font-size:clamp(15px,1.5cqw,25px);letter-spacing:-.03em;white-space:nowrap}
table.tb tr.hi td{color:var(--acento)}
body.esc table.tb tr.hi td{color:var(--acento-claro)}
/* mapa */
.mcols{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(20px,3cqw,56px);align-items:center;width:100%}
.mtxt{min-width:0}
.mapa{min-width:0;display:flex;align-items:center;justify-content:center}
.mapa svg{width:100%;height:auto;max-height:calc(100cqh - var(--top) - var(--bot) - clamp(28px,4.8cqh,80px));display:block}
.mapa image{opacity:.92}
.pin{cursor:pointer}
.pin circle.hit{fill:transparent}
.pin .anel{fill:none;stroke:var(--acento);stroke-width:0;opacity:0;transition:stroke-width .16s,opacity .16s}
.pin.on .anel{stroke-width:2.4;opacity:.9}
.raio{transition:fill-opacity .16s,stroke-opacity .16s}
.raio.on{fill-opacity:.3!important;stroke-opacity:.75!important}
#minfo{margin-top:clamp(11px,1.6cqh,20px);border-top:1px solid var(--hair);padding-top:clamp(8px,1.1cqh,14px);min-height:clamp(70px,8.6cqh,102px)}
#minfo .mn{font-family:var(--f-display);font-style:italic;font-size:var(--fs-h);letter-spacing:-.03em;line-height:1.1;display:block}
#minfo .mp{font-family:var(--f-mono);font-weight:500;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;color:var(--acento);margin-top:8px;display:block}
#minfo .md{font-size:var(--fs-body);color:var(--soft);line-height:1.55;margin-top:8px;display:block}
#minfo.vazio .mn{color:var(--soft);font-size:var(--fs-body);font-style:normal;font-family:var(--f-corpo)}
.leg{display:flex;flex-wrap:wrap;gap:clamp(11px,1.6cqw,26px);margin-top:clamp(9px,1.3cqh,16px);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
body.esc .leg{color:var(--papel-70)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.leg i.ln{width:16px;height:0;border-top:1.5px dashed var(--acento);border-radius:0;vertical-align:3px}
.pend{font-family:var(--f-mono);font-size:var(--fs-cap);color:var(--acento);border-left:2px dashed var(--acento);
  padding-left:12px;margin-top:clamp(12px,1.8cqh,22px);line-height:1.6;max-width:64ch}
.credito{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-35);margin-top:10px}
/* fotos */
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:clamp(20px,3cqw,56px);align-items:center;width:100%}
.fbox{position:relative;aspect-ratio:4/3;background:var(--tinta-5);border:1px solid var(--hair);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.fbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
.fbox img.on{opacity:1}
.fbox .slot{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:clamp(14px,2cqw,26px);
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.6;color:var(--soft)}
.fbox .slot b{color:var(--acento);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.fcap{font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:11px;line-height:1.6}
/* chrome */
.chrome{position:absolute;left:0;right:0;pointer-events:none;z-index:9;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.16em;text-transform:lowercase;color:var(--soft);padding:0 var(--gut);
  display:flex;align-items:center;justify-content:space-between;height:var(--top)}
body.esc .chrome{color:var(--papel-70)}
.chrome.pe{top:auto;bottom:0;height:var(--bot)}
.chrome.topo{top:0}
.secao{font-style:italic;position:relative;padding-left:26px;white-space:nowrap}
.secao .sn{position:absolute;left:0;top:50%;transform:translateY(-50%);font-style:normal;opacity:.55}
.dots{display:flex;gap:clamp(9px,.8cqw,14px);pointer-events:auto}
.sdot{width:var(--pt);height:var(--pt);border-radius:50%;background:currentColor;opacity:.28;cursor:pointer;position:relative;transition:opacity .25s}
.sdot.on{opacity:1}
.sdot span{position:absolute;bottom:150%;left:50%;transform:translateX(-50%);opacity:0;white-space:nowrap;font-style:italic;letter-spacing:.1em;transition:opacity .2s;pointer-events:none}
.sdot:hover span{opacity:.9}
.marca{font-style:italic;font-weight:500;text-transform:lowercase}
/* ── navegação · pastilha de leitura garantida ──────────────────────────
   Regra de sistema, 23/08/2026 (prancha/PRANCHA-SISTEMA.md, seção Chrome,
   commit b3f95705). O contador e as setas param de herdar a cor do slide e
   passam a viver numa pastilha própria: fundo creme a 94%, glifo em tinta,
   filete de tinta a 22% e sombra baixa.
   Por que clara e não escura: medida contra creme, oliva, tinta, terracota
   e foto, a clara entrega piso de 11,9:1 contra ~6:1 da escura. A fraqueza
   dela — sumir como forma sobre fundo creme — é o que o filete resolve.
   `backdrop-filter` é reforço, não requisito: sem suporte, os 94% de
   opacidade já entregam o contraste sozinhos. ── */
.nav{display:flex;align-items:center;gap:clamp(8px,.9cqw,14px);pointer-events:auto;
  background:color-mix(in srgb,var(--papel) 94%,transparent);
  -webkit-backdrop-filter:blur(7px) saturate(1.1);backdrop-filter:blur(7px) saturate(1.1);
  border:1px solid var(--tinta-20);border-radius:999px;

/* ─── fechamento: bolinhas no alto ao centro, setas no pé à direita ───

/* numeração da lista sobre a oliva: o terracota cheio some no fundo verde */

/* ═══ 22/08/2026 · o rótulo da linha é título, e título é grande ═══════════

/* ═══ 22/08/2026 · segunda rodada ══════════════════════════════════════════ */

ol.trio li{align-items:center}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */


/* ─── mapa em sangria: as três faixas ficam ancoradas ───────────────────
   Antes tudo dividia o mesmo fluxo, então o painel de hover empurrava o
   título e o layout dançava a cada passagem de mouse. Agora: título e

.slide.temmapa{justify-content:stretch}

/* tabela: a linha que está fora do estudo entra apagada */

/* duas frentes lado a lado */
.frcols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,3.6cqw,72px);

.frl{list-style:none;display:grid;gap:clamp(9px,1.3cqh,18px);

  padding-top:clamp(7px,1cqh,13px)}
.frl li:first-child{border-top:0;padding-top:0}

.frd{font-size:var(--fs-body);line-height:1.5;color:var(--soft)}

/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */


/* ─── popover de justificativa ───────────────────────────────────────────

mark.pop{cursor:help;position:relative;transition:filter .2s}
mark.pop:hover,mark.pop.aberto{filter:brightness(1.12)}
.obs{font-family:var(--f-mono);font-size:.86em;letter-spacing:.1em;

body.terra .obs{color:var(--papel)}

/* a caixa é terracota e nasce colada à linha do elemento que a abriu.

.popbox{position:absolute;z-index:40;max-width:min(44ch,58cqw);
  background:var(--acento);color:var(--papel);

/* subitens dentro de uma jogada: cada velocidade na sua linha */
.jogada .jd ul.jsub{list-style:none;margin-top:.7em;display:grid;gap:.55em}

/* [quadro 1600x900: nunca dispara — retirado] (max-width:1080px) */

  border-radius:50%;background:var(--acento);

.pgr{margin-top:clamp(18px,2.6cqh,36px);font-size:var(--fs-cap);letter-spacing:.14em;

body.esc .pgr{color:var(--papel-70)}
@media(prefers-reduced-motion:reduce){.pgo i{animation:none}}

/* ═══ fundo morph no divisor de seção · padrão travado em 22/08/2026 ═══════
   Copiado de modulos/divisor-morph.html. Véu do divisor a 0,60 — quase o
   triplo do véu do índice (0,18) — porque o divisor carrega o maior tipo do
   deck, e a trama compete com o título. Não recalibrar.                   */
/* (o véu do divisor migrou para #msveu-d, no bloco do segundo canvas) */

/* especificidade: body.com-fundo pinta o corpo de oliva e venceria o
   body.terra do divisor por vir depois na folha. Mesmo conflito que o
   .slide.ativo{background:transparent} resolveu na abertura. */
body.com-fundo.terra #quadro{background:var(--acento)}
body.com-fundo.terra .kick,body.com-fundo.terra .sub{color:var(--papel-70)}
/* o chrome invertido do divisor tem de sobreviver ao com-fundo */
body.com-fundo.terra .chrome{color:var(--papel-90)}

/* ═══ o segundo canvas: o fundo dos divisores ══════════════════════════════
   Mesma geometria do primeiro, empilhado atrás do palco. Só um dos dois
   aparece por vez, e o que não aparece está pausado pelo go(). */
#msfundo-d{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;
  opacity:0;transition:opacity .8s ease;pointer-events:none}
#msveu-d{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  background:var(--acento);transition:opacity .3s ease}
#msveu-d::after{content:"";position:absolute;inset:0;opacity:.5;
  background:linear-gradient(180deg,var(--acento) 0%,transparent 26%,
                             transparent 74%,var(--acento) 100%)}
body.fundo-div #msfundo-d{opacity:1}
body.fundo-div #msveu-d{opacity:.60}   /* travado em 22/08/2026 */
/* no divisor o canvas e o véu da marca somem, e vice-versa */
body.fundo-div #msfundo,body.fundo-div #msveu{opacity:0}

/* ═══ 23/08/2026 · legibilidade e grifo ════════════════════════════════════ */

/* o terracota cheio sobre a oliva some. O `lista` já tinha o clareado; o
   `trio` e o `jogadas` não tinham, e é ali que o texto ficava ilegível. */
body.esc ol.trio .q,body.com-fundo ol.trio .q{color:var(--acento-claro)}
body.terra ol.trio .q{color:var(--papel)}
body.esc .jogada .jn,body.esc .jogada .jt{color:var(--papel)}
body.esc .frt{color:var(--acento-claro)}

/* ─── grifo — a faixa que destaca a frase ────────────────────────────────
   Trazido da apresentação da Lavro (mecânica de 22/08). Não é negrito: é
   marca de caneta POR TRÁS do texto, que se desenha da esquerda para a
   direita. Usa background-size animado em vez de pseudo-elemento absoluto,
   para acompanhar a quebra de linha com box-decoration-break: clone.     */
.grifo{
  background-image:linear-gradient(var(--grifo-cor,var(--acento-20)),var(--grifo-cor,var(--acento-20)));
  background-repeat:no-repeat;
  background-position:0 .14em;
  background-size:0% calc(100% - .22em);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .14em;margin:0 -.14em;border-radius:2px}
.revelado .grifo{animation:ms-grifo 620ms cubic-bezier(.62,0,.30,1) forwards;
  animation-delay:var(--gd,760ms)}
@keyframes ms-grifo{to{background-size:100% calc(100% - .22em)}}
/* sobre oliva e terracota a marca inverte para o creme */
body.esc .grifo,body.com-fundo .grifo{--grifo-cor:var(--papel-20)}
body.terra .grifo{--grifo-cor:var(--papel-20)}
@media(prefers-reduced-motion:reduce){
  .grifo{background-size:100% calc(100% - .22em)!important;animation:none!important}}

/* R$ nunca vira r$: os títulos são caixa-baixa, o símbolo da moeda não */
.ru{text-transform:none}

/* subitens da jogada com bolinha, não traço */
.jogada .jd ul.jsub li::before{width:.42em;height:.42em;border-radius:50%;
  background:currentColor;opacity:.75;top:.55em}

/* linha de tabela fora do estudo: o valor também apaga */
table.tb tr.fora td{opacity:.38}

/* o texto de apoio do dado vive no popover, não no slide */
.dado .n{display:none}
.dado.tem{cursor:help;position:relative;transition:border-color .22s}
.dado.tem .l::after{content:"+";margin-left:.5em;font-family:var(--f-mono);
  opacity:.5;transition:opacity .22s}
/* no hover o dado inteiro assume o destaque: a linha, o número e o rótulo */
.dado.tem:hover,.dado.tem.aberto{border-top-color:var(--acento)}
.dado.tem:hover .v,.dado.tem.aberto .v,
.dado.tem:hover .l,.dado.tem.aberto .l{color:var(--acento)}
.dado.tem:hover .l::after,.dado.tem.aberto .l::after{opacity:1}
body.esc .dado.tem:hover,body.esc .dado.tem.aberto{border-top-color:var(--acento-claro)}
body.esc .dado.tem:hover .v,body.esc .dado.tem.aberto .v,
body.esc .dado.tem:hover .l,body.esc .dado.tem.aberto .l{color:var(--acento-claro)}
.dado .v,.dado .l{transition:color .22s ease}
/* os dois slides da carteira: texto ancorado no topo, para o isométrico e o
   título ficarem parados na tela enquanto só o conteúdo da direita troca */
.pcols.alto{align-items:start}
.pcols.alto .wrap{padding-top:clamp(10px,2.4cqh,44px)}
.pcols.alto .notaN{margin-top:clamp(16px,2.4cqh,34px)}

/* ─── só trama: o mesmo carrossel da marca, sob véu quase opaco ──────────
   Nos slides verdes de conteúdo o fundo não é imagem, é textura. O véu vai
   a 0,90 e troca o gradiente diagonal por oliva chapada: a foto some, o
   pontilhado continua respirando. Nenhum contexto WebGL novo.           */
body.fundo-trama #msveu{background:var(--escuro);opacity:.90;
  transition:opacity .45s ease,background-color .45s ease}
body.fundo-trama #msfundo{opacity:1}
body.fundo-trama .slide.ativo{background:transparent}

/* ─── carteira: dois estados no mesmo slide ──────────────────────────────
   Os dois blocos ocupam a MESMA célula de grade, então a caixa cresce pelo
   mais alto e nada salta quando um troca pelo outro. O isométrico e o
   título ficam fora dessa troca — não re-animam. */
.trbox{display:grid;margin-top:clamp(14px,2.2cqh,30px)}
.trbox>.tr{grid-area:1/1;transition:opacity .42s ease,transform .42s ease}
.tr-b{opacity:0;transform:translateY(9px);pointer-events:none}
.tr-b.on{opacity:1;transform:none;pointer-events:auto}
.trbox:has(.tr-b.on) .tr-a{opacity:0;transform:translateY(-9px);pointer-events:none}
.trbox .notaN{margin-top:clamp(14px,2cqh,26px)}
.trbox .dados{margin-top:clamp(14px,2cqh,28px)}
/* o slide da carteira divide a tela ao meio: o desenho tem sete volumes */
.pcols.meia{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pcols.meia .iso svg{max-height:60cqh}
@media(prefers-reduced-motion:reduce){.trbox>.tr{transition:none}}
/* na meia tela o número e o texto empilham: lado a lado a coluna de texto
   ficava com quatro palavras por linha */

.pcols.meia .notaN .nt{max-width:46ch}
.pcols.meia .notaN .nn{font-size:clamp(34px,5.2cqw,86px)}

/* ═══ 23/08 · duas frentes: pílula, subtítulo e item numerado ══════════════ */
.frcab{display:flex;flex-direction:column;align-items:flex-start;
  gap:clamp(7px,1cqh,12px);padding-bottom:clamp(10px,1.4cqh,17px);
  border-bottom:1.5px solid currentColor}
.frpil{font-family:var(--f-display);font-style:italic;font-weight:500;
  font-size:clamp(14px,1.5cqw,25px);letter-spacing:-.03em;line-height:1;
  text-transform:lowercase;color:var(--papel);background:var(--acento);
  padding:clamp(6px,.8cqh,11px) clamp(11px,1.1cqw,18px);border-radius:999px}
.frsub{font-size:var(--fs-cap);letter-spacing:.2em;text-transform:uppercase;
  color:var(--soft)}
body.esc .frsub{color:var(--papel-70)}
.frl li{grid-template-columns:auto 1fr;gap:clamp(10px,1.2cqw,20px);align-items:baseline}
.frn{font-family:var(--f-mono);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.1em;color:var(--acento);line-height:1.6}
body.esc .frn{color:var(--acento-claro)}
.frtx{display:grid;gap:4px;min-width:0}

/* ═══ 23/08 · destaque terracota dentro de título ═══════════════════════════ */
.tt{color:var(--acento)}
body.esc .tt,body.com-fundo .tt{color:var(--acento-claro)}

/* ═══ 23/08 · duas frentes: a caixa terracota que cresce ════════════════════
   Cada item revelado empurra a caixa para baixo — o pacote se fecha na frente

.frcols{align-items:start}
.frcx{position:relative;padding:clamp(11px,1.5cqh,18px) clamp(12px,1.15cqw,19px);

.frcx .frti{color:var(--papel)}
.frcx .frd{color:var(--papel-80)}
.frcx .frn,body.esc .frcx .frn{color:var(--papel);opacity:.62}
.frfora{margin-top:clamp(13px,1.9cqh,26px);display:grid;gap:6px;

/* ═══ 23/08 · sumário: o argumento inteiro, seis blocos ═════════════════════ */

.smt{font-family:var(--f-display);font-style:italic;font-size:clamp(15px,1.75cqw,29px);

/* [quadro 1600x900: nunca dispara — retirado] (max-width:960px) */

/* ─── prancha que transborda para de centralizar ─────────────────────────

   contêiner centralizado, o topo sai ACIMA da origem de rolagem e fica
   inalcançável — `scrollTop` já em 0 com o kicker em −127px. Com o quadro
   fixo nenhuma prancha transborda e isto nunca dispara; fica como rede.
   O tratamento responsivo por gabarito que existia aqui foi retirado em
   25/08 e está em `_R8/cel-responsivo.css.txt` — o quadro fixo o dispensa. */
.slide.rola{justify-content:flex-start}



/* ══════════════════════════════════════════════════════════════════════════
   O QUADRO · TELA CHEIA · revisto em 02/09/2026
   ──────────────────────────────────────────────────────────────────────────
   ⚑ O texto abaixo descreve uma decisão de 25/08 que foi REVERTIDA. Fica
     aqui porque explica por que o esqueleto tinha ficado diferente das
     peças de referência, e o que se perdeu no caminho.

   ERA ASSIM (25/08 a 02/09): o deck vivia num quadro de 1600 × 900 FIXO,
   em pixels, escalado por `transform` até caber na tela — como vídeo em
   tela cheia. Vantagem real: nenhuma prancha transbordava, por construção.
   **Preço, que ninguém tinha medido: tarja preta em cima e embaixo em toda
   tela que não fosse 16:9 exato.** Isto é o letterbox, e é errado.

   É ASSIM (02/09 em diante): o quadro PREENCHE a área segura. Tela cheia,
   sem tarja, que é o que a `casa-ittb` e a `tokyo-centro` sempre fizeram —
   e são elas o padrão da casa, não este arquivo.

   O QUE VOLTA A SER RESPONSABILIDADE DE QUEM MONTA:
   · **transbordo.** A garantia por construção morreu com o quadro fixo.
     Em troca, o build de cada peça roda a varredura de transbordo em cinco
     proporções (21:9, 16:9, 16:10, 3:2, 4:3) e falha antes de publicar.
     A varredura não é opcional — é o que substitui a garantia.
   · **as `@media` de largura retiradas em 25/08** ("viraram código morto
     dentro do quadro fixo") voltam a poder disparar abaixo de ~1200px de
     largura. Não foram restauradas: em uso real — monitor e projetor — os
     limiares não são alcançados, e restaurar vinte regras às cegas é
     trabalho especulativo. O que estava lá está em
     `_R8/cel-responsivo.css.txt`, e a varredura é que aponta se falta.
   · o notch e a Dynamic Island continuam cobertos: o quadro é medido
     contra `#moldura`, que já é a área segura.

   As unidades de dentro seguem em `cqw`/`cqh`, do CONTÊINER. Com
   `container-type:size` no quadro, 1cqw = 1% da largura DO QUADRO — e o
   quadro agora tem a largura da tela. Num monitor de 1600 isso dá os mesmos
   16px de antes; num ultrawide dá mais, que é o que se quer. Foi por isso
   que a troca do quadro fixo para tela cheia não exigiu reescrever as 275
   clamps: a unidade continua a mesma, só o contêiner cresceu.
   ══════════════════════════════════════════════════════════════════════════ */
#moldura{position:fixed;
  top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);
  bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);
  overflow:hidden}
/* ⚑ TELA CHEIA — corrigido em 02/09/2026, e é a lei da casa.
   O quadro PREENCHE a área segura. Não tem largura fixa, não tem
   transform:scale, e por isso não produz tarja preta em cima nem embaixo,
   em monitor nenhum. Foi o erro da peça EMEI Presidente Dutra: a versão de
   19/08 travava 1600 × 900 e escalava, o que em qualquer tela que não fosse
   16:9 exato devolvia letterbox. As peças de referência da casa —
   `casa-ittb` e `tokyo-centro` — nunca fizeram isso: compõem contra a
   viewport, e são elas o padrão.
   O `container-type:size` FICA. É ele que mantém as clamps em `cqw`/`cqh`
   funcionando: num quadro de 1600 de largura, 1cqw continua valendo 16px —
   igual ao que valia antes. O que mudou é que agora o quadro tem a largura
   da tela, não a de um retângulo desenhado. Nenhuma clamp precisou mudar
   por causa disto. */
#quadro{position:absolute;inset:0;width:100%;height:100%;
  container-type:size;container-name:q;overflow:hidden}

/* ─── retrato ────────────────────────────────────────────────────────────
   Num celular em pé, 16:9 dá 390 x 219 — a peça inteira, correta, pequena.
   O aviso de girar NÃO mora aqui: é comportamento universal do acervo e vive
   em modulos/ms-voltar.js, que o desenha sozinho ao detectar deck de tela
   fixa em retrato. Ter um aviso próprio aqui faria aparecerem dois.
   A classe `retrato` fica: é barata e diz em que regime o quadro está. */

/* ═══ cheia — o render em tela cheia ═══════════════════════════════════
   Portado da casa ITTB em 29/08/2026, com vw/vh trocados por cqw/cqh.
   A mecânica que define o gabarito: com o ponteiro parado 1,8 s, o véu do
   pé, o gradiente do topo e o chrome esvanecem — a imagem fica inteira.
   `ocioso` é genérico, no body; `em-cheia` restringe o efeito a este
   gabarito. Sem a segunda, o texto sumiria em todo slide.
   Receita: sistemas/gabaritos/render-cheia.md
   ═══════════════════════════════════════════════════════════════════ */
/* ⚑ A EXCEÇÃO DA TELA CHEIA — 02/09/2026.
   O slide preenche a tela; a IMAGEM não estoura. `contain` em vez de
   `cover`: numa tela de proporção diferente da do render, sobra campo
   neutro nas bordas e a imagem entra INTEIRA. Numa peça de arquitetura
   isso não é detalhe — o que o `cover` cortava era desenho, e desenho
   cortado é informação perdida. O campo que sobra é a moldura, nunca o
   tema do slide: assim a borda lê como passe-partout e não como erro. */
.g-cheia{padding:0;background-image:none;background:var(--moldura)}
.g-cheia .full{position:absolute;inset:0}
.g-cheia .full .ph{position:absolute;inset:0}
.g-cheia .full .ph img{width:100%;height:100%;object-fit:contain;display:block}
/* ⚑ GRADIENTES SUAVES — 02/09/2026. Vinham pesados (b8 no topo, E6 a 62%
   no pé) e chapavam o render. Aqui é véu, não tarja: entra a um terço da
   opacidade anterior e fecha mais curto. A legibilidade do chrome deixou
   de depender do gradiente e passou a vir do `text-shadow` de baixo — que
   é o que permite o véu ser leve sem o texto sumir sobre céu branco. */
.g-cheia .full:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--tinta-35) 0,var(--tinta-10) 8%,transparent 20%)}
.g-cheia .ov{position:absolute;inset:auto 0 0 0;
  padding:clamp(50px,8cqh,120px) calc(var(--gut) * 1.9) var(--bot) var(--gut);
  background:linear-gradient(transparent,var(--tinta-15) 44%,var(--tinta-60) 100%);color:var(--papel)}
/* sombra de leitura: invisível como forma, decisiva sobre céu claro. É ela
   que sustenta o chrome e a legenda agora que o véu é leve. */
body.em-imagem .chrome,.g-cheia .ov h2,.g-cheia .ov .cap{
  text-shadow:0 1px 3px var(--tinta-45),0 2px 14px var(--tinta-35)}
/* ⚑ SLIDE DE FUNDO EM IMAGEM: o chrome inverte e ganha véu próprio.
   Medido em 02/09/2026 — sobre o céu branco de um render isométrico o
   chrome em Cal dava 1,04:1, ou seja invisível; e sobre imagem de satélite
   escura o chrome em tinta era igualmente ilegível. Voltar a chapar a
   imagem estaria contra a decisão do mesmo dia (véu, não tarja), então o
   véu é confinado à FAIXA DO CHROME: 116px no topo, contra os 20% de
   altura que o gradiente da prancha cobria. Assim o canto fica legível
   sobre qualquer imagem — céu branco, satélite, fachada colorida — e a
   imagem segue limpa no meio, que é onde ela é vista. */
body.em-imagem .chrome{color:var(--papel-90)}
body.em-imagem .chrome.topo{
  background:linear-gradient(var(--tinta-60) 0,var(--tinta-35) 46%,transparent 100%)}
body.em-imagem .chrome.pe{
  background:linear-gradient(transparent 0,var(--tinta-25) 60%,var(--tinta-50) 100%)}
.g-cheia .ov h2{color:var(--papel);font-family:var(--f-display);font-weight:500;
  font-style:italic;text-transform:lowercase;font-size:var(--fs-h);
  letter-spacing:-.022em;line-height:1}
.g-cheia .ov .cap{color:var(--papel-70);margin-top:.7em;max-width:70ch;
  font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.45}
.g-cheia .slot{position:absolute;inset:0;display:grid;place-content:center;
  gap:.35em;text-align:center;padding:1em;background:var(--slot-escuro);
  border:1px dashed var(--papel-20)}
.g-cheia .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.5em;line-height:1}
.g-cheia .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--papel)}
.g-cheia .slot s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--papel-45)}
.chrome,.g-cheia .ov,.g-cheia .full:after{transition:opacity .55s cubic-bezier(.4,0,.2,1)}
body.em-cheia.ocioso .chrome,
body.em-cheia.ocioso .slide.ativo .ov,
body.em-cheia.ocioso .slide.ativo .full:after{opacity:0}
/* o visor 3d NÃO some com o ponteiro parado: ali o chrome carrega os botões
   de órbita e de recentrar, e apagar controle enquanto a câmera gira deixa
   quem apresenta sem volante. O `em-cheia` é que restringe o efeito à
   prancha de imagem — por isso a regra acima não menciona `em-imagem`. */
@media (prefers-reduced-motion: reduce){
  body.em-cheia.ocioso .chrome,
  body.em-cheia.ocioso .slide.ativo .ov,
  body.em-cheia.ocioso .slide.ativo .full:after{opacity:1}
}

/* ═══ prancha — a grade de referência ══════════════════════════════════
   Portada da casa ITTB em 29/08/2026. Nomes próprios (.pbody, .ptop,
   .plead, .pcap) porque .body, .top e .cap já existem em outros gabaritos.
   Receita: sistemas/gabaritos/prancha-referencia.md
   ═══════════════════════════════════════════════════════════════════ */
.g-prancha{padding:calc(var(--top) + clamp(6px,1.6cqh,26px)) var(--gut)
           calc(var(--bot) + clamp(6px,1.6cqh,26px))}
.g-prancha .pbody{flex:1;display:flex;flex-direction:column;
  gap:clamp(14px,2.4cqh,34px);min-height:0;height:100%}
.g-prancha .ptop{display:flex;justify-content:space-between;align-items:flex-end;
  gap:clamp(20px,2.5cqw,52px);flex-wrap:wrap}
.g-prancha .ptop h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.g-prancha .plead{font-size:var(--fs-body);color:var(--soft);max-width:52ch;line-height:1.5}
.g-prancha .grade{flex:1;min-height:0;display:grid;gap:clamp(8px,.9cqw,20px)}
.g-prancha .grade .cel{display:flex;flex-direction:column;gap:.5em;min-height:0;
  justify-content:center}
.g-prancha .grade .cel .ph{flex:1;max-height:100%;position:relative;overflow:hidden;
  background:var(--tinta-3)}
.g-prancha .grade .cel .ph img{width:100%;height:100%;object-fit:cover;display:block}
.g-prancha .grade .cel.pilha{gap:clamp(6px,.65cqw,14px)}
.g-prancha .grade .cel.pilha .ph{flex:1;background:transparent}
.g-prancha .grade .cel.pilha .ph img{object-fit:contain}
.g-prancha .pcap{font-family:var(--f-mono);font-size:var(--fs-cap);line-height:1.42;
  color:var(--soft);letter-spacing:.02em}
.g-prancha .slot{position:absolute;inset:0;display:grid;place-content:center;gap:.35em;
  text-align:center;padding:1em;
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px);
  border:1px dashed var(--tinta-20)}
.g-prancha .slot u{text-decoration:none;color:var(--acento);font-family:var(--f-display);
  font-weight:500;font-style:italic;font-size:1.4em;line-height:1}
.g-prancha .slot b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-cap);color:var(--tinta)}
.g-prancha .slot s{text-decoration:none;font-family:var(--f-mono);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-45)}

/* ═══ vazio — o gabarito existe, o dado do projeto não ═════════════════
   Estado legítimo, como o slot de imagem: permite montar a estrutura
   antes de o levantamento existir. Vale para qualquer gabarito que
   dependa de dado, não só o mapa.
   ═══════════════════════════════════════════════════════════════════ */
.vazio{position:absolute;inset:var(--top) var(--gut) var(--bot);
  display:grid;place-content:center;justify-items:center;gap:.55em;text-align:center;
  border:1px dashed var(--tinta-20);
  background:repeating-linear-gradient(45deg,var(--tinta-3) 0 6px,transparent 6px 12px)}
.vazio .vmarca{font-family:var(--f-display);font-weight:500;font-style:italic;
  color:var(--acento);font-size:clamp(20px,2.2cqw,34px);line-height:1}
.vazio h2{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-h);letter-spacing:-.022em;line-height:1}
.vazio .vsub{font-size:var(--fs-body);color:var(--soft);max-width:46ch}
.vazio .vnota{font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta-45);max-width:52ch;margin-top:.4em}
.vazio .vnota code{text-transform:none;letter-spacing:0}
/* ═══ aviso — gabarito desconhecido ou campo obrigatório ausente ═════════
   03/09/2026. O `return ''` do tpl() virou slide visível: antes um `g`
   errado sumia em silêncio, e um `itens` faltando escrevia `undefined` na
   tela ou derrubava o deck inteiro. Agora o slide aparece hachurado, diz o
   que falta, e o console recebe o mesmo texto. Mesmo desenho do `vazio`.
   ═══════════════════════════════════════════════════════════════════ */
.vazio.aviso{border-color:var(--acento-45)}
.vazio.aviso .vmarca{color:var(--acento)}
.vazio.aviso code{font-family:var(--f-mono);background:var(--tinta-5);padding:.1em .4em;border-radius:2px}

/* ═══ o canto superior direito — texto ou logotipo ═══════════════════════
   Decisão do Michel, 03/09/2026: o padrão da casa é TEXTO (michel stein_,
   AMAZ, Lavrō). A Sarasá leva o LOGOTIPO pequeno, fixo, trocando
   positivo/negativo pelo tema do slide — testado na EMEI Presidente Dutra
   em reunião e aprovado. Quem decide é a constante LOGO_CANTO do bloco da
   marca; o script de marca troca `.marca-txt` por `.marca-lk`.
   Tamanho do logotipo: 132 a 180 px — abaixo de ~130 px o lockup da
   Sarasá perde a palavra `estúdio` (nível Micro do arquivo de marca).
   A troca positivo/negativo é POR TOKEN: o SVG traz fill="var(--tinta)" e
   fill="var(--primaria)"; sobre campo escuro, imagem ou visor os dois viram
   papel e o lockup fica monocromático, como o negativo oficial. SVG
   monocromático usa fill="currentColor" e recebe o mesmo tratamento.   */
.marca{display:flex;align-items:center}
.marca .marca-lk{display:block;width:var(--logo-canto-w,clamp(132px,9.5cqw,180px));
  line-height:0;opacity:.9;transition:opacity .3s ease;color:var(--tinta)}
.marca .marca-lk svg{display:block;width:100%;height:auto}
/* o `hidden` do HTML tem de vencer o display:block acima */
.marca .marca-lk[hidden],.marca .marca-txt[hidden]{display:none}
body.esc .marca .marca-lk,body.terra .marca .marca-lk,body.com-fundo .marca .marca-lk,
body.em-imagem .marca .marca-lk{--tinta:var(--papel);--primaria:var(--papel);--acento:var(--papel);color:var(--papel)}

/* ═══ grafismo de marca na base — opcional, por `graf:1` ══════════════════
   Portado da EMEI (Sarasá: contorno da Fortaleza da Barra Grande). Sempre
   na base, sangrando nas laterais, numa cor só (papel). Nunca atrás de
   texto corrido, tabela ou croqui: entra em divisor e contracapa. O SVG vem
   da constante GRAFISMO do bloco da marca; sem ela, `graf:1` não faz nada. */
#msgraf{position:absolute;left:-2%;right:-2%;bottom:0;z-index:0;
  pointer-events:none;opacity:0;transition:opacity .7s ease;
  color:var(--papel);line-height:0}
#msgraf svg{display:block;width:104%;height:auto}
body.com-graf #msgraf{opacity:.28}
body.no-fim #msgraf{opacity:.18}

/* ═══ marca: lockup em SVG e contracapa com crédito ══════════════════════
   `lockup:1` no slide `marca` troca a sigla em texto pela constante LOCKUP
   do bloco (SVG monocromático em currentColor, cor do papel). A contracapa
   (`fim_:1`) aceita `credito` — a linha pequena de concepção e coordenação. */
.g-marca .lock{width:var(--lk,clamp(200px,25cqw,470px));line-height:0;flex:0 0 auto;color:var(--papel)}
.g-marca .lock svg{display:block;width:100%;height:auto}
.g-marca .credito-peca{font-family:var(--f-mono);font-size:clamp(9px,.7cqw,12.5px);
  letter-spacing:.08em;text-transform:uppercase;color:var(--papel-70);
  margin-top:clamp(14px,2.2cqh,30px);line-height:1.5}

/* ═══ capa em dois momentos — opcional, por `dois:1` no slide `marca` ═════
   Portado de modulos/capa-morph-sarasa.html pela EMEI em 03/09/2026.
   Momento A: a capa institucional (lockup ou sigla, papel, descritor, site,
   pílula), parada na tela enquanto a sala se acomoda. O clique em `começar`
   chama avanca(): o `.cm-b` é um `.passo`, então entra o momento B — o
   TÍTULO da apresentação (kick, t, sub, pe) no lugar do bloco institucional.
   O clique seguinte corre a cortina e entra no deck. Os dois blocos se
   sobrepõem em absoluto e trocam por opacidade; o `.cm-b` vem antes no DOM
   só para o seletor `~` poder apagar o `.cm-a`.                            */
.slide.g-marca.dois{padding:0;justify-content:center}
.g-marca.dois{--lk:clamp(200px,25cqw,470px)}
.g-marca.dois .cm-a,.g-marca.dois .cm-b{position:absolute;left:var(--gut-in);right:var(--gut-in);
  top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
  align-items:flex-start;gap:clamp(11px,1.6cqh,24px);z-index:1;
  transition:opacity .55s ease,transform .55s ease}
.g-marca.dois .cm-b{opacity:0;transform:translateY(calc(-50% + 12px));pointer-events:none}
.g-marca.dois .cm-b.on{opacity:1;transform:translateY(-50%)}
.g-marca.dois .cm-b.on ~ .cm-a{opacity:0;transform:translateY(calc(-50% - 10px));pointer-events:none}
/* o qualificador vai SOB o lockup, nunca ao lado: ao lado lê como segunda marca */
.g-marca .lk-bloco{display:block}
.g-marca .nucleo{font-family:var(--f-mono);font-size:calc(var(--lk,300px)*.033);
  letter-spacing:.34em;text-transform:uppercase;color:var(--papel-80);line-height:1;
  margin-top:calc(var(--lk,300px)*.034);padding-left:calc(var(--lk,300px)*.010)}
.g-marca .descritor{font-family:var(--f-mono);font-size:clamp(10px,.82cqw,15px);
  letter-spacing:.13em;text-transform:uppercase;color:var(--papel-60);line-height:1.6;
  max-width:34ch;margin-top:calc(var(--lk,300px)*.012)}
.g-marca.dois .cm-b .mega{max-width:26ch}
.g-marca.dois .cm-b .sub{max-width:52ch}
.g-marca .cm-pe{font-family:var(--f-mono);font-size:clamp(9px,.72cqw,13px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--papel-60);margin-top:clamp(10px,1.6cqh,24px);line-height:1}

/* ═══ visores — earth-3d e modelo-3d ═════════════════════════════════════
   Portados da EMEI Presidente Dutra em 03/09/2026 (módulos mestres:
   modulos/mapa-earth-3d.html e modulos/modelo-sketchup.html). Mesma
   gramática nos dois: scrim suave (véu, não tarja), véu de ativação por
   clique, trava de teclado enquanto o visor tem o ponteiro, indicador de
   carga com passo REAL e degradação explícita. O que o modelo tem a mais é
   a RESERVA — as imagens salvas na peça — porque modelo de projeto tem
   substituto útil sem rede, e satélite não.
   ⚑ Os dois estão na lista `em-imagem` do go(): é o que inverte o chrome.
   ⚑ earth-3d SÓ FUNCIONA POR LINK (a Maps API recusa file://). A chave vem
     de modulos/ms-maps-chave.js. Receita: sistemas/gabaritos/mapa-earth-3d.md
   ⚑ modelo-3d exige modelo PÚBLICO no 3D Warehouse. Receita: gabaritos/modelo.md
   ═══════════════════════════════════════════════════════════════════ */
.slide.g-earth-3d,.slide.g-modelo-3d{padding:0;overflow:hidden;background:var(--moldura)}
.g-earth-3d .visor,.g-modelo-3d .visor{position:absolute;inset:0}
.g-earth-3d gmp-map-3d{position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;filter:saturate(.86) contrast(1.03)}
.g-earth-3d.girando gmp-map-3d{pointer-events:auto}
/* o iframe nasce SEM src e sem ponteiro: `src` só na chegada (são 40 MB);
   ponteiro só depois do clique no véu, senão a roda do mouse dá zoom no
   modelo enquanto se tenta passar o slide. */
.g-modelo-3d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  pointer-events:none;opacity:0;transition:opacity .6s ease;background:var(--moldura)}
.g-modelo-3d.pronto iframe{opacity:1}
.g-modelo-3d.girando iframe{pointer-events:auto}
.g-earth-3d .scrim,.g-modelo-3d .scrim{position:absolute;inset:0;pointer-events:none;
  transition:opacity .3s ease;
  background:linear-gradient(180deg,var(--tinta-60) 0,var(--tinta-25) 9%,transparent 24%,
    transparent 56%,var(--tinta-35) 88%,var(--tinta-60) 100%)}
.g-modelo-3d.girando .scrim{opacity:0}
.g-earth-3d .veu,.g-modelo-3d .veu{position:absolute;inset:0;display:grid;place-content:center;
  gap:.6em;text-align:center;background:var(--tinta-25);cursor:pointer;z-index:2;
  transition:opacity .3s ease}
.g-earth-3d.girando .veu,.g-modelo-3d.girando .veu{opacity:0;pointer-events:none}
.g-earth-3d .veu b,.g-modelo-3d .veu b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-earth-3d .veu s,.g-modelo-3d .veu s{text-decoration:none;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--papel-60)}
/* ⚑ o SAIR salva a apresentação. Com o ponteiro dentro do visor o foco vai
   para o mapa ou para o documento do SketchUp e as setas do deck param de
   responder — o evento nem chega ao nosso script. Este botão é o único
   caminho de volta que não depende do teclado. */
.g-earth-3d .sair,.g-modelo-3d .sair{position:absolute;bottom:clamp(9px,1.4cqh,20px);left:50%;
  transform:translateX(-50%);display:none;align-items:center;z-index:4;cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-90);
  border:1px solid var(--papel-25);border-radius:999px;padding:.55em 1.2em}
.g-earth-3d.girando .sair,.g-modelo-3d.girando .sair{display:flex}
.g-earth-3d .rotulo,.g-modelo-3d .rotulo{position:absolute;left:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;pointer-events:none;
  max-width:min(46ch,60cqw);padding:clamp(14px,2cqh,30px) clamp(18px,1.9cqw,38px);
  background:var(--tinta-45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid var(--papel-10);border-radius:3px;transition:opacity .3s ease}
.g-modelo-3d.girando .rotulo{opacity:0}
.g-earth-3d .rotulo .kick,.g-modelo-3d .rotulo .kick{display:block;color:var(--papel-80);margin:0;
  font-size:var(--fs-cap);text-transform:uppercase}
.g-earth-3d .rotulo h2,.g-modelo-3d .rotulo h2{color:var(--papel);font-size:var(--fs-h);line-height:1.04;margin-top:.24em}
.g-earth-3d .rotulo .lead,.g-modelo-3d .rotulo .lead{color:var(--papel-90);font-size:var(--fs-body);margin-top:.55em;line-height:1.5}
.g-earth-3d .rotulo .cap,.g-modelo-3d .rotulo .cap{display:block;font-family:var(--f-mono);
  font-size:var(--fs-cap);letter-spacing:.08em;text-transform:uppercase;
  color:var(--papel-60);margin-top:.9em}
/* os comandos que o slide expõe numa reunião. earth: ÓRBITA e RECENTRAR —
   navegar no 3d é fácil e voltar não; sem o recentrar a saída é recarregar
   a página na frente do cliente. modelo: RECOMEÇAR (recarrega o quadro; a
   câmera é do viewer da Trimble) e IMAGENS (a reserva, à mão). */
.g-earth-3d .cmd,.g-modelo-3d .cmd{position:absolute;right:var(--gut);
  bottom:calc(var(--bot) + clamp(4px,1.4cqh,22px));z-index:3;
  display:flex;align-items:center;gap:clamp(6px,.6cqw,11px);transition:opacity .3s ease}
.g-modelo-3d.girando .cmd{opacity:.35}
.g-modelo-3d.girando .cmd:hover{opacity:1}
.g-earth-3d .cmd button,.g-modelo-3d .cmd button{cursor:pointer;
  font-family:var(--f-mono);font-size:var(--fs-cap);letter-spacing:.12em;
  text-transform:uppercase;color:var(--papel);background:var(--tinta-60);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid var(--papel-20);border-radius:999px;padding:.62em 1.2em;
  display:flex;align-items:center;gap:.55em;transition:border-color .2s,color .2s}
.g-earth-3d .cmd button:hover,.g-modelo-3d .cmd button:hover{border-color:var(--papel);color:#fff} /* #fff: pico de luz do hover, não é cor de marca */
.g-earth-3d .cmd svg,.g-modelo-3d .cmd svg{display:block;width:1em;height:1em;opacity:.7}
.g-earth-3d .orb i{display:block;width:7px;height:7px;border-radius:50%;
  background:var(--papel);opacity:.4;transition:opacity .2s}
.g-earth-3d.orbitando .orb i{opacity:1;animation:pulsa 1.9s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.3}}
.g-earth-3d .rec.feito{border-color:var(--papel);color:#fff} /* #fff: pico de luz do "feito", não é cor de marca */
/* estado de carga e de falha. Enquanto carrega não há o que navegar: o
   convite do véu e os comandos ficam fora de cena. */
.g-earth-3d .estado,.g-modelo-3d .estado{position:absolute;inset:0;z-index:5;display:none;
  place-content:center;justify-items:center;text-align:center;padding:0 8cqw;
  gap:.9em;background:var(--moldura)}
.g-earth-3d.esperando .estado,.g-earth-3d.falhou .estado,
.g-modelo-3d.esperando .estado,.g-modelo-3d.falhou .estado{display:grid}
.g-earth-3d.esperando .veu,.g-earth-3d.esperando .cmd,.g-earth-3d.falhou .veu,.g-earth-3d.falhou .cmd,
.g-modelo-3d.esperando .veu,.g-modelo-3d.esperando .cmd,.g-modelo-3d.esperando .rotulo,
.g-modelo-3d.falhou .veu{display:none}
.g-earth-3d .estado b,.g-modelo-3d .estado b{font-family:var(--f-display);font-weight:500;font-style:italic;
  text-transform:lowercase;font-size:var(--fs-item);color:var(--papel);letter-spacing:-.02em}
.g-earth-3d .estado span,.g-modelo-3d .estado span{font-size:var(--fs-body);color:var(--papel-60);line-height:1.6;
  max-width:56ch;margin:0 auto}
.g-earth-3d .estado code,.g-modelo-3d .estado code{font-family:var(--f-mono);font-size:.9em;color:var(--papel)}
/* o indicador de carga: barra com passo REAL (os degraus são nossos) e o
   anel girando para o que não se sabe medir. Pedido do Michel, 02/09. */
.g-earth-3d .carga,.g-modelo-3d .carga{display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,2cqh,24px)}
.g-earth-3d.falhou .carga,.g-modelo-3d.falhou .carga{display:none}
.g-earth-3d .anel,.g-modelo-3d .anel{width:clamp(30px,3.4cqw,46px);height:clamp(30px,3.4cqw,46px);
  border-radius:50%;border:2px solid var(--papel-15);border-top-color:var(--papel);
  animation:gira3d .85s linear infinite}
@keyframes gira3d{to{transform:rotate(360deg)}}
.g-earth-3d .barra,.g-modelo-3d .barra{width:clamp(150px,17cqw,240px);height:3px;border-radius:999px;
  background:var(--papel-10);overflow:hidden;position:relative}
.g-earth-3d .barra i,.g-modelo-3d .barra i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:var(--papel);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.g-earth-3d .passos,.g-modelo-3d .passos{font-family:var(--f-mono);font-size:var(--fs-cap);

<script>

/* ─── fundo morph pontilhado · núcleo ────────────────────────────────────────

   Entrada em diagonal, ao estilo da vitrine, introduz a primeira peça.
   API: MSFundo.montar(canvas, imagens, opcoes?) → {entrada(), pausar(v), cor(o)}
   opcoes: {ink, paper, acc, scale, prep:false, sortear:true}.
   prep:false pula a auto-exposição em JS — use com imagem já corrigida no

   sortear embaralha a ordem na carga. cor() troca a paleta com interpolação. */
window.MSFundo=(function(){
const VS=`#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID==1 ? 3.0 : -1.0, gl_VertexID==2 ? 3.0 : -1.0);
  gl_Position = vec4(p,0.0,1.0);

const FS=`#version 300 es
precision highp float;
out vec4 frag;
uniform sampler2D uA,uB;
uniform vec2 uRes,uSA,uSB,uM;
uniform float uT,uTime,uAmp,uEdge,uDot,uAng,uAng2,uContrast,uGamma,uMode,uTrans,

float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);

    60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21);

  if(q.x<-0.05||q.x>1.05||q.y<-0.05||q.y>1.05) return 1.0;

    float e=clamp(uEdge,0.02,1.0);

    float own=step(hash(floor(q/cell)+0.5),w);

    float th=mix(uv.x,1.0-vA,0.42);
    float k=smoothstep(th-soft,th+soft,front);
    v=mix(vA,vB,k);

  if(uTrans>1.5&&uTrans<2.5){                      // serigrafia já montou a tinta
  }else if(uMode<0.5){ ink=cover(q,cell,sqrt(max(v,0.0))*cell*0.70); }
  else if(uMode<1.5){ ink=1.0-smoothstep(-0.8,0.8,abs(mod(q.y,cell)-cell*0.5)-v*cell*0.5); }

  /* ---- entrada diagonal: a trama nasce ao longo de uma reta inclinada ---- */
  float sx=uv.x+(uv.y-0.5)*0.26;                 // eixo da varredura, ~14° de inclinação
  float bandW=0.30;
  float fEnter=uEnter*(1.0+2.0*bandW)-bandW;
  float rev=clamp((fEnter-sx)/bandW+0.5,0.0,1.0);
  float fio=exp(-pow((sx-fEnter)/0.0045,2.0))*step(0.001,uEnter)*step(uEnter,0.999);
  ink*=rev; band=mix(band,0.0,1.0-rev);

  vec3 tinta=mix(uInk,uAccent,clamp(band,0.0,1.0)*uAcc);

    const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>r(null);x.src=src;});
    if(im) S.push(mkTex(im)); if(S.length===2) ready=true;
    await new Promise(r=>setTimeout(r,0));
  } if(S.length) ready=true; })();
  function frame(now){
    requestAnimationFrame(frame);
    if(!visible||!ready){last=now;return;}
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(!paused){clock+=dt;t+=dt*P.speed*0.5;if(t>=1){t=0;i=(i+1)%S.length;}}
    const A=S[i],B=S[(i+1)%S.length],k=cv.width/(cv.clientWidth||innerWidth);
    const kp=1-Math.exp(-dt*9.05),ka=1-Math.exp(-dt*4.35);
    mx+=(tmx-mx)*kp;my+=(tmy-my)*kp;mAmt+=((mOn?1:0)-mAmt)*ka;
    if(enter<1){enterT+=dt;enter=Math.min(1,easeOut(Math.max(0,enterT-0.15)/1.45));}
    const kc=1-Math.exp(-dt*3.2);
    for(const nome of ['ink','paper','acc'])
      for(let c=0;c<3;c++) COR[nome][c]+=(ALVO[nome][c]-COR[nome][c])*kc;
    const e0=t*t*(3-2*t);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.tex);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.tex);
    gl.uniform2f(U.uRes,cv.width,cv.height);
    gl.uniform2f(U.uSA,A.w,A.h);gl.uniform2f(U.uSB,B.w,B.h);gl.uniform2f(U.uM,mx,my);
    gl.uniform1f(U.uT,Math.min(1,Math.max(0,(e0-0.5)*1.55+0.5)));
    gl.uniform1f(U.uTime,clock);gl.uniform1f(U.uEnter,enter);
    gl.uniform1f(U.uDot,P.dot*k);gl.uniform1f(U.uAng,P.angle);gl.uniform1f(U.uAng2,P.angle2);
    gl.uniform1f(U.uBleed,P.bleed);gl.uniform1f(U.uContrast,P.contrast);gl.uniform1f(U.uGamma,P.gamma);
    gl.uniform1f(U.uAmp,P.amp);gl.uniform1f(U.uEdge,P.edge);gl.uniform1f(U.uZoom,P.zoom);
    gl.uniform1f(U.uAcc,P.accent);gl.uniform1f(U.uGrain,P.grain);gl.uniform1f(U.uVig,P.vig);
    gl.uniform1f(U.uMode,P.mode);gl.uniform1f(U.uTrans,P.trans);gl.uniform1f(U.uFit,P.fit);
    gl.uniform1f(U.uCur,P.cur);gl.uniform1f(U.uMAmt,mAmt*P.mforce);gl.uniform1f(U.uMRad,P.mrad*k);
    gl.uniform3fv(U.uInk,COR.ink);gl.uniform3fv(U.uPaper,COR.paper);gl.uniform3fv(U.uAccent,COR.acc);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
  return {entrada(){enter=0;enterT=0;}, pausar(v){paused=!!v;}, P:P,
    cor(o){ if(o.ink)ALVO.ink=hex(o.ink); if(o.paper)ALVO.paper=hex(o.paper);
            if(o.acc)ALVO.acc=hex(o.acc); }};
}
return {montar:montar};
})();

<script>
/* ─── tokens lidos pelo JS ────────────────────────────────────────────────
   O CSS já usa var(); o WebGL do fundo precisa de número. tok('--acento')
   devolve o hex do token como o navegador o resolveu — inclusive quando o
   token é um color-mix(). Medido num elemento vivo, nunca por regex no CSS. */
function tok(nome){
  const e=document.createElement('i'); e.style.color=`var(${nome})`;
  document.body.appendChild(e);
  const c=getComputedStyle(e).color; e.remove();
  const n=(c.match(/[\d.]+/g)||[]).map(parseFloat);
  const k=c.startsWith('color(')?255:1;          /* color(srgb r g b) vem em 0..1 */
  return '#'+n.slice(0,3).map(v=>Math.round(v*k).toString(16).padStart(2,'0')).join('');
}
const MAP = {
  /* ═══ DADO DO PROJETO ═══════════════════════════════════════════════
     Andaime vazio, com o contrato à vista. O deck de origem trazia 107 KB
     de lotes reais — endereço, nome de operador, coordenada — e isso não
     entra num arquivo público. Como montar o seu: sistemas/gabaritos/mapa-lotes.md
     ═══════════════════════════════════════════════════════════════════ */
  "base": {
    "rua":     {"img": "", "w": 1200, "h": 1500, "tex": ""},
    "cluster": {"img": "", "w": 1024, "h": 768,  "tex": ""}
  },
  "lotes": [
    /* {"n":"rótulo","end":"Endereço, 000","lat":-23.55,"lon":-46.63,
        "d":[[x,y],…] (contorno),"r":0,"t":0,"offset":[0,0]} */
  ],
  "pts":   [],   /* pontos do mapa de cluster */
  "msrua": [],   /* recorte da rua           */
  "sj":    [],   /* recorte auxiliar         */
  "fundo": [],   /* massa de fundo           */
  "aiu": 0, "calc": 0, "chave": 0, "req": 0
} /* ← DADO DESTE DECK. O do estudo de posicionamento tinha 107 KB de lotes
       reais, com endereço e nome de operador: saiu daqui porque este arquivo é
       público. Ao montar um mapa, gerar o MAP do projeto — receita em
       sistemas/gabaritos/mapa-lotes.md. */;
/* imagens embutidas — carrossel da capa (capamorph_R6) e o par antes/depois */
/* carrossel da abertura — nove peças de 640 px em WebP, com a
   auto-exposição já aplicada no arquivo. A engine sobe com prep:false:
   sem isso são nove correções de histograma na thread principal, na carga. */
/* carrossel da abertura e dos divisores — imagens DESTA apresentação.
   Regra de 22/08/2026: cada deck usa as suas, senão a trama de fundo vira
   enfeite genérico e briga com o assunto. Três a cinco imagens, não dez —
   cada uma de 1024 px custa ~3,7 MB de VRAM.
   640 px de largura, WebP, com a auto-exposição da engine JÁ APLICADA no
   arquivo — por isso a chamada sobe com prep:false. A gama de cada uma
   saiu de log(0,50)/log(média), piso 0,42, igual ao prep() da engine. */
/* ═══ dois carrosséis, dois canvas ════════════════════════════════════════
   Decisão do Michel em 22/08/2026, depois de ver os dois lados:

   CAPA_IMGS — as nove peças do portfólio dele. Ficam ATRÁS DA MARCA, na
   abertura e no fechamento. É a assinatura: a frase da marca roda sempre
   sobre o trabalho de quem assina, seja qual for o deck.

   DIV_IMGS — as imagens DESTE deck. Ficam atrás dos divisores de seção.
   Três a cinco imagens do próprio projeto, não dez.

   Todas a 640 px em WebP, com a auto-exposição da engine JÁ APLICADA no
   arquivo — por isso as duas chamadas sobem com prep:false. A gama de cada
   uma saiu de log(0,50)/log(média), piso 0,42, igual ao prep() da engine. */
const CAPA_IMGS=[] /* ← acervo da MARCA. Vem do bloco da marca. Vazio = fundo chapado, que é estado aceitável. */;
const DIV_IMGS=[] /* ← imagens DESTE deck para o divisor. Vazio = divisor só trama, que é o padrão. */;
const F_ANTES=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_DEPOIS=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO1=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO2=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO3=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO4=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
/* lote destacado no mapa da quadra -> foto do empreendimento */
const FOTO_LOTE={0:F_FOTO1,1:F_FOTO2,2:F_FOTO3,3:F_FOTO4};

/* categorias de lote do mapa: cor por token, para a marca pintar o mapa junto com o resto.
   `novo` e `planta` são cor de dado (derivados no :root), não papel de marca. */
const COR={toq:'var(--acento)',ret:'var(--tinta)',obra:'var(--primaria)',novo:'var(--mapa-novo)',planta:'var(--mapa-planta)'};
function wpx(lat,lon,z){const n=Math.pow(2,z)*256,la=lat*Math.PI/180;
  return [(lon+180)/360*n,(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n];}
function proj(m){const {z,ox,oy,esc,mpp,fw,fh}=m;
  const n=Math.pow(2,z)*256;
  return {X:(la,lo)=>+((wpx(la,lo,z)[0]-ox)*esc).toFixed(1),
          Y:(la,lo)=>+((wpx(la,lo,z)[1]-oy)*esc).toFixed(1),
          /* inverso: o locador precisa de lat/lon a partir do pixel do viewBox */
          lo:x=>(x/esc+ox)/n*360-180,
          la:y=>{const t=Math.PI-2*Math.PI*(y/esc+oy)/n;
                 return 180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t)));},
          r:v=>+(v/mpp*esc).toFixed(1),w:fw,h:fh};}
const via=(P,a)=>a.map(c=>`${P.X(c[0],c[1])},${P.Y(c[0],c[1])}`).join(' ');
const vias=(P,arr,attr)=>arr.map(c=>`<polyline points="${via(P,c)}" ${attr}/>`).join('');
function barra(P,m,x,y){const L=P.r(m);
  return `<g transform="translate(${x},${y})"><line x1="0" y1="0" x2="${L}" y2="0" stroke="var(--tinta)" stroke-width="1.4"/><line x1="0" y1="-5" x2="0" y2="5" stroke="var(--tinta)" stroke-width="1.4"/><line x1="${L}" y1="-5" x2="${L}" y2="5" stroke="var(--tinta)" stroke-width="1.4"/><text x="${(L/2).toFixed(1)}" y="-10" text-anchor="middle" font-family="var(--f-mono)" font-size="15" fill="var(--tinta)" opacity=".72">${m} m</text></g>`;}


/* ─── janela retrato para o mapa em sangria ───────────────────────────────
   O painel do mapa e 48vw x 100vh — em 16:9 isso da 0,85 de proporcao.
   O viewBox cheio da base e paisagem, entao com `slice` os rotulos da
   esquerda eram decepados. Aqui se recorta uma janela ja no formato do
   painel, centrada no que interessa, e o slice so come a folga.          */
function janela(P,pts,asp){
  asp=asp||0.85;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;});
  const mx=(x1-x0)*0.035+10, my=(y1-y0)*0.035+10;
  x0-=mx;x1+=mx;y0-=my;y1+=my;
  let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(w/h>asp){ h=w/asp; } else { w=h*asp; }
  x0=cx-w/2;y0=cy-h/2;
  return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}
function mapaRua(sang){
  const B=MAP.base.rua,P=proj(B);
  const rot={0:[16,30,'start'],1:[0,-18,'middle'],2:[24,-6,'start'],3:[0,30,'middle'],4:[0,-16,'middle'],5:[-20,2,'end'],6:[-20,2,'end']};
  /* a janela tem de conter os rotulos, nao so os poligonos: eles saem bem
     para fora do lote e eram decepados pelo slice. Largura estimada pelo
     avanco da DM Mono, ~0,60 em, a 17 px.                                */
  const alvo=[];
  MAP.lotes.forEach((l,i)=>{
    l.r.forEach(c=>alvo.push([P.X(c[0],c[1]),P.Y(c[0],c[1])]));
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    const lw=l.n.length*10.2, ax=X+o[0], ay=Y+o[1];
    const e=o[2]==='start'?[ax,ax+lw]:o[2]==='end'?[ax-lw,ax]:[ax-lw/2,ax+lw/2];
    alvo.push([e[0],ay-14],[e[1],ay+6]);
  });
  const vb=sang?janela(P,alvo):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb}" role="img" aria-label="mapa de lotes">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  MAP.fundo.forEach(r=>{s+=`<polygon points="${via(P,r)}" fill="none" stroke="var(--tinta)" stroke-opacity=".16" stroke-width=".8"/>`;});
  s+=vias(P,MAP.msrua,'fill="none" stroke="var(--acento)" stroke-opacity=".15" stroke-width="'+P.r(12)+'" stroke-linecap="round"');
  const fl=MAP.msrua.flat(); const r0=fl[Math.floor(fl.length*0.28)];
  s+=`<text x="${P.X(r0[0],r0[1])}" y="${P.Y(r0[0],r0[1])-16}" text-anchor="middle" font-family="var(--f-mono)" font-style="italic" font-size="17" fill="var(--acento)" opacity=".95">${MAP.rotulo||''}</text>`;
  MAP.lotes.forEach((l,i)=>{
    const c=COR[l.t];
    s+=`<g class="lote" data-l="${i}" tabindex="0"><path d="M${via(P,l.r).replace(/ /g,'L')}Z" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="1.8" stroke-opacity=".85" stroke-dasharray="6 4"/></g>`;});
  MAP.lotes.forEach((l,i)=>{
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    s+=`<text x="${X+o[0]}" y="${Y+o[1]}" text-anchor="${o[2]}" font-family="var(--f-mono)" font-style="italic" font-size="17" fill="var(--tinta)" paint-order="stroke" stroke="var(--papel)" stroke-width="4" pointer-events="none">${l.n}</text>`;});
  s+=barra(P,50,44,P.h-20);
  return s+`</svg>`;
}

/* ─── locador: os perímetros maiores que o recorte ───────────────────────
   Quando o mapa tem perímetros muito maiores que o recorte principal,
   desenhá-los por cima só cruzaria a tela com uma linha. Vão como locador
   no canto, com o retângulo do recorte atual dentro.
   Duas camadas: MAP.aiu (tracejada, primária) e MAP.req (cheia, acento).
   Os rótulos vêm de MAP.aiuRotulo e MAP.reqRotulo; sem eles, não há texto. */
function locador(P,vb,W){
  const A=[].concat(MAP.aiu||[],MAP.req||[]).flat();
  if(!A.length) return '';
  const H=Math.round(W*1.02), pad=9;
  let la0=1e9,la1=-1e9,lo0=1e9,lo1=-1e9;
  A.forEach(([la,lo])=>{if(la<la0)la0=la;if(la>la1)la1=la;if(lo<lo0)lo0=lo;if(lo>lo1)lo1=lo;});
  const kx=(W-2*pad)/(lo1-lo0), ky=(H-2*pad)/(la1-la0), k=Math.min(kx,ky);
  const cx=(lo0+lo1)/2, cy=(la0+la1)/2;
  const X=lo=>pad+(W-2*pad)/2+(lo-cx)*k, Y=la=>pad+(H-2*pad)/2-(la-cy)*k;
  /* 1 vértice a cada N: um perímetro oficial pode ter milhares de vértices e o locador tem 190 px de largura */
  const cam=(an,n)=>an.filter((_,i)=>i%n===0||i===an.length-1)
    .map(([la,lo])=>`${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join(' ');
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--papel)" stroke="var(--tinta)" stroke-opacity=".28" stroke-width="1"/>`;
  (MAP.aiu||[]).forEach(an=>{g+=`<polygon points="${cam(an,9)}" fill="var(--primaria)" fill-opacity=".13" stroke="var(--primaria)" stroke-width="1" stroke-opacity=".7" stroke-dasharray="3 2.5"/>`;});
  (MAP.req||[]).forEach(an=>{g+=`<polygon points="${cam(an,2)}" fill="var(--acento)" fill-opacity=".16" stroke="var(--acento)" stroke-width="1.3"/>`;});
  /* o retângulo do recorte que está sendo mostrado ao lado */
  const v=vb.split(' ').map(Number);
  const cantos=[[v[0],v[1]],[v[0]+v[2],v[1]],[v[0]+v[2],v[1]+v[3]],[v[0],v[1]+v[3]]]
    .map(([x,y])=>{const la=P.la(y),lo=P.lo(x);return `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`;}).join(' ');
  g+=`<polygon points="${cantos}" fill="none" stroke="var(--tinta)" stroke-width="1.6"/>`;
  if(MAP.reqRotulo) g+=`<text x="${pad}" y="${H-19}" font-family="var(--f-mono)" font-size="10.5" fill="var(--acento)">${MAP.reqRotulo}</text>`;
  if(MAP.aiuRotulo) g+=`<text x="${pad}" y="${H-6}" font-family="var(--f-mono)" font-size="10.5" fill="var(--primaria)">${MAP.aiuRotulo}</text>`;
  return g;
}
function mapaCluster(sang){
  const B=MAP.base.cluster,P=proj(B),r=P.r(200);
  const alvo2=[];MAP.pts.forEach(q=>{const X=P.X(q.lat,q.lon),Y=P.Y(q.lat,q.lon);
    alvo2.push([X-r,Y-r],[X+r,Y+r]);});
  const vb2=sang?janela(P,alvo2):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb2}" role="img" aria-label="mapa de cluster — raios de 200 m">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  s+=vias(P,MAP.calc,'fill="none" stroke="var(--primaria)" stroke-width="11" stroke-opacity=".3" stroke-linecap="round"');
  s+=vias(P,MAP.calc,'fill="none" stroke="var(--mapa-escuro)" stroke-width="2.4" stroke-dasharray="1.5 6" stroke-linecap="round" stroke-opacity="1"');
  s+=vias(P,MAP.sj,'fill="none" stroke="var(--acento)" stroke-width="16" stroke-opacity=".2" stroke-linecap="round"');
  s+=vias(P,MAP.sj,'fill="none" stroke="var(--acento)" stroke-width="2.6" stroke-dasharray="11 7" stroke-linecap="round" stroke-opacity=".95"');
  const sjf=MAP.sj.flat(); const m0=sjf[Math.floor(sjf.length*0.5)];
  if(m0&&MAP.sjRotulo) s+=`<text x="${P.X(m0[0],m0[1])+14}" y="${P.Y(m0[0],m0[1])-12}" font-family="var(--f-mono)" font-style="italic" font-size="19" fill="var(--acento)" paint-order="stroke" stroke="var(--papel)" stroke-width="4">${MAP.sjRotulo||''}</text>`;
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<circle class="raio" data-i="${i}" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="${r}" fill="var(--primaria)" fill-opacity=".11" stroke="var(--primaria)" stroke-opacity=".34" stroke-width="1"/>`;});
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="16"/><circle class="anel" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="9"/><circle cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="4" fill="var(--mapa-escuro)"/></g>`;});
  MAP.pts.forEach((p,i)=>{if(!p.toq)return;
    const X=P.X(p.lat,p.lon),Y=P.Y(p.lat,p.lon);
    if(p.anc) s+=`<circle cx="${X}" cy="${Y}" r="21" fill="none" stroke="var(--acento)" stroke-width="1.6" stroke-dasharray="3 3" opacity=".85"/>`;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${X}" cy="${Y}" r="24"/><circle class="anel" cx="${X}" cy="${Y}" r="18"/><circle cx="${X}" cy="${Y}" r="${p.anc?15:12}" fill="var(--acento)" stroke="var(--papel)" stroke-width="${p.anc?2.6:1.8}"/><text x="${X}" y="${Y+5}" text-anchor="middle" font-family="var(--f-mono)" font-weight="500" font-size="15" fill="var(--papel)">${p.k}</text></g>`;});
  s+=barra(P,200,48,P.h-20);
  if(sang){
    const v=vb2.split(' ').map(Number), W=Math.round(v[2]*0.30);
    const gx=v[0]+v[2]*0.035, gy=v[1]+v[3]-Math.round(W*1.02)-v[3]*0.035;
    s+=`<g transform="translate(${gx.toFixed(1)},${gy.toFixed(1)})">${locador(P,vb2,W)}</g>`;
  }
  return s+`</svg>`;
}
function ligaHover(root){
  const box=root.querySelector('#minfo'); if(!box)return;
  const base=box.innerHTML;
  let tmr;
  const pinta=html=>{box.classList.add('trocando');clearTimeout(tmr);
    tmr=setTimeout(()=>{box.innerHTML=html;box.classList.remove('trocando');},170);};
  const mostra=(n,p,d,f)=>{box.classList.remove('vazio');
    pinta((f?`<span class="mfoto"><img src="${f}" alt="${n}"></span>`:'')
      +`<span class="mtx"><span class="mn">${n}</span>${p?`<span class="mp">${p}</span>`:''}${d?`<span class="md">${d}</span>`:''}</span>`);};
  const limpa=()=>{box.classList.add('vazio');pinta(base);};
  const solta=()=>root.querySelectorAll('.pin.on,.raio.on,.lote.on').forEach(e=>e.classList.remove('on'));
  root.querySelectorAll('.lote').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');const i=+g.dataset.l,l=MAP.lotes[i];
      mostra(l.n,l.end,l.d, (typeof FOTO_LOTE!=='undefined'?FOTO_LOTE[i]:null)||null);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelectorAll('.pin').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');
      const i=+g.dataset.i,p=MAP.pts[i],rr=root.querySelector(`.raio[data-i="${i}"]`);
      if(rr)rr.classList.add('on');
      let d='';
      if(p.cred){
        const brl=v=>'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
        d=`${p.quem}. Categoria ${p.cat}, ${p.pts} pontos, `
          +`${p.pct!=null?p.pct.toString().replace('.',',')+'% de subvenção — ':''}`
          +`${brl(p.vl)} concedidos no chamamento ${p.cham}.`;
