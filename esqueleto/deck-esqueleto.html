<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- robots.txt nao funciona em Pages de projeto: o buscador so le o da raiz
     do dominio. A meta tag e a unica protecao. Regra do runbook, 22/08. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>deck · esqueleto</title>
<!-- Fontes embutidas em woff2/base64, subconjunto latino + pontuacao.
     Regra do PRANCHA-SISTEMA: nenhuma dependencia de CDN. O arquivo abre
     igual sem rede, e a tipografia da marca nunca cai para fallback. -->
<style>
/* ═══ FONTES DA MARCA ═══════════════════════════════════════════════════
   AQUI ENTRAM AS SEIS @font-face EM BASE64, do bloco da marca.
   Sem elas a peça cai na fonte do sistema num notebook de cliente —
   inclusive online, porque não há link para CDN nenhum. É a diferença
   entre a peça rodar sem internet e parecer outra coisa na reunião.
   michel stein_ → marca/michel-stein/bloco.html · AMAZ → marca/amaz/bloco.html
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* ═══ CORES: VÊM DA MARCA ═══════════════════════════════════════════
     Estas quatro linhas são a única coisa de marca que sobrou aqui, e
     estão com os valores da michel stein_ para o esqueleto abrir pintado.
     Trocar de marca = substituir este bloco pelo :root do bloco da marca.
     Os nomes seguem por cor (--creme, --oliva…) porque toda peça publicada
     usa assim; quando virarem papel (--papel, --primaria…), muda aqui.
     ══════════════════════════════════════════════════════════════════ */
  --creme:#EDE6DA; --tinta:#211D1A; --oliva:#6B6A4B; --terra:#B85C38;
  --moldura:#1A1714;
  --soft:#211D1A99; --hair:#211D1A26;
  --mono:'DM Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;

  /* ═══ ESCALA: É MOTOR, NÃO MARCA ════════════════════════════════════
     ⚑ ESTES NÚMEROS NÃO SE TOCAM, E O MOTIVO NÃO É "estão travados".
     O motivo é que o Michel reconhece a proporção de longe: corpo de texto,
     margem e botão de navegação têm de sair IGUAIS em toda peça, de toda
     frente. Peça que muda a proporção é peça errada, não peça diferente.

     Recalibrados em 02/09/2026 para os valores da `casa-ittb`, que é a peça
     de referência da casa. A tabela de 19/08 tinha encolhido tudo para
     caber num quadro de 1600 × 900 — corpo com teto de 17px onde a ITTB usa
     20, seta de 30px onde a ITTB usa 56. Era isso que se via como "está
     pouco diferente do que eu esperava".

     Unidades em cqw/cqh, do #quadro — que agora tem o tamanho da tela.
     1cqw = 1% da largura; num monitor de 1600 dá os mesmos 16px de sempre.
     ══════════════════════════════════════════════════════════════════ */
  /* margem e faixas */
  --gut:clamp(26px,4.75cqw,96px);        /* margem do chrome            */
  --gut-in:clamp(38px,8cqw,190px);       /* margem interna — o respiro  */
  --top:clamp(70px,9.4cqh,116px);        /* faixa do chrome alto        */
  --bot:clamp(62px,8.2cqh,104px);        /* faixa do chrome baixo       */
  --y-topo:clamp(17px,2.5cqh,38px);
  --h-faixa:clamp(22px,1.9cqw,38px);
  /* texto */
  --fs-mega:clamp(38px,4.6cqw,92px);     /* ITTB --fs-h1                */
  --fs-big:clamp(24px,2.65cqw,52px);     /* ITTB --fs-h2                */
  --fs-h:clamp(19px,2.1cqw,40px);
  --fs-item:clamp(17px,1.38cqw,28px);    /* ITTB --fs-item              */
  --fs-lead:clamp(15px,1.25cqw,24px);
  --fs-body:clamp(13.5px,1.03cqw,20px);  /* ITTB --fs-body              */
  --fs-small:clamp(12px,.88cqw,17px);
  --fs-kick:clamp(10.5px,.8cqw,15px);
  --fs-cap:clamp(9.5px,.72cqw,14px);     /* ITTB --fs-cap               */
  --fs-num:clamp(28px,3.15cqw,58px);
  --fs-div:clamp(42px,6cqw,124px);       /* nome da seção no divisor    */
  --fs-secao:clamp(15px,1.42cqw,29px);
  --fs-marca:clamp(14px,1.28cqw,26px);   /* assinatura, alto direita    */
  --fs-pe:clamp(13px,1.16cqw,23px);      /* projeto · cliente, pé       */
  /* navegação */
  --seta:clamp(38px,2.9cqw,56px);        /* ITTB — o tamanho do botão   */
  --pt:clamp(6px,.44cqw,9px);            /* bolinha de seção            */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
/* o body deixou de ser o fundo da prancha e virou a MOLDURA: quem pinta o
   tema é o #quadro. Nasceu no tempo do letterbox, em que as tarjas mudavam
   de cor a cada slide e a peça piscava por fora. Sem tarja continua certo:
   o #quadro é a superfície, e a moldura é o campo que sobra sob o `contain`
   da prancha de imagem — o único lugar onde ela ainda aparece. */
body{background:var(--moldura);color:var(--tinta);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  transition:color .38s ease}
#quadro{background:var(--creme);transition:background .38s ease}
body.esc{color:var(--creme)}
body.esc #quadro{background:var(--oliva)}
#palco{position:absolute;inset:0}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(var(--top) + clamp(14px,2.4cqh,40px)) var(--gut) calc(var(--bot) + clamp(14px,2.4cqh,40px));
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .15s,transform .15s}
.slide.ativo{opacity:1;pointer-events:auto;transform:none;transition:opacity .44s ease,transform .44s ease}
.rev{opacity:0;transform:translateY(14px)}
.revelado .rev{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*42ms)}
.passo{opacity:0;transform:translateY(14px);transition:opacity .34s,transform .34s}
.passo.on{opacity:1;transform:none}
h1,h2,h3{font-family:var(--mono);font-weight:500;font-style:italic;letter-spacing:-.045em;line-height:1.02;text-transform:lowercase}
u{text-decoration:none;color:var(--terra)}
.kick{font-family:var(--mono);font-size:var(--fs-cap);letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin-bottom:clamp(14px,2cqh,28px)}
body.esc .kick{color:#EDE6DAaa}
.mega{font-size:var(--fs-mega);max-width:19ch}
.big{font-size:var(--fs-big);max-width:22ch}
.sub{font-size:var(--fs-body);line-height:1.62;max-width:58ch;color:var(--soft);margin-top:clamp(11px,1.8cqh,28px)}
body.esc .sub{color:#EDE6DAcc}
.prem{font-family:var(--mono);font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.7;color:var(--terra);
  border-left:2px solid var(--terra);padding-left:13px;margin-top:clamp(14px,2cqh,26px);max-width:62ch}
body.esc .prem{color:#E9A184;border-color:#E9A184}
.dados{display:grid;gap:clamp(14px,2cqw,34px);margin-top:clamp(18px,3cqh,52px);
  grid-template-columns:repeat(auto-fit,minmax(clamp(150px,15cqw,230px),1fr))}
.dado{border-top:1px solid var(--hair);padding-top:clamp(10px,1.4cqh,18px)}
body.esc .dado{border-color:#EDE6DA3d}
.dado .v{font-family:var(--mono);font-weight:500;font-size:var(--fs-num);letter-spacing:-.05em;line-height:1;display:block}
.dado .l{font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:10px;display:block;line-height:1.5}
body.esc .dado .l{color:#EDE6DAaa}
.dado .n{font-size:var(--fs-body);color:var(--soft);margin-top:8px;line-height:1.5;display:block}
body.esc .dado .n{color:#EDE6DAbb}
ol.lista{list-style:none;margin-top:clamp(20px,3cqh,42px);display:grid;gap:clamp(10px,1.5cqh,20px)}
ol.lista li{display:grid;grid-template-columns:clamp(46px,4.6cqw,78px) 1fr;gap:clamp(10px,1.4cqw,22px);
  align-items:baseline;border-top:1px solid var(--hair);padding-top:clamp(9px,1.2cqh,15px)}
body.esc ol.lista li{border-color:#EDE6DA3d}
ol.lista .q{font-family:var(--mono);font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
ol.lista .t{font-size:var(--fs-item);line-height:1.5}
ol.lista .t b{font-weight:600}
table.tb{width:100%;border-collapse:collapse;margin-top:clamp(20px,3cqh,42px);font-size:var(--fs-item)}
table.tb th{font-family:var(--mono);font-weight:400;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--tinta)}
body.esc table.tb th{color:#EDE6DAaa;border-color:#EDE6DA}
table.tb td{padding:clamp(11px,1.5cqh,19px) 0;border-bottom:1px solid var(--hair);vertical-align:baseline;line-height:1.45}
body.esc table.tb td{border-color:#EDE6DA30}
table.tb td+td,table.tb th+th{padding-left:clamp(14px,2cqw,40px);text-align:right}
table.tb td.d{font-family:var(--mono);font-weight:500;font-size:clamp(15px,1.5cqw,25px);letter-spacing:-.03em;white-space:nowrap}
table.tb tr.hi td{color:var(--terra)}
body.esc table.tb tr.hi td{color:#E9A184}
/* mapa */
.mcols{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(20px,3cqw,56px);align-items:center;width:100%}
.mtxt{min-width:0}
.mapa{min-width:0;display:flex;align-items:center;justify-content:center}
.mapa svg{width:100%;height:auto;max-height:calc(100cqh - var(--top) - var(--bot) - clamp(28px,4.8cqh,80px));display:block}
.mapa image{opacity:.92}
.pin{cursor:pointer}
.pin circle.hit{fill:transparent}
.pin .anel{fill:none;stroke:var(--terra);stroke-width:0;opacity:0;transition:stroke-width .16s,opacity .16s}
.pin.on .anel{stroke-width:2.4;opacity:.9}
.raio{transition:fill-opacity .16s,stroke-opacity .16s}
.raio.on{fill-opacity:.3!important;stroke-opacity:.75!important}
#minfo{margin-top:clamp(11px,1.6cqh,20px);border-top:1px solid var(--hair);padding-top:clamp(8px,1.1cqh,14px);min-height:clamp(70px,8.6cqh,102px)}
#minfo .mn{font-family:var(--mono);font-style:italic;font-size:var(--fs-h);letter-spacing:-.03em;line-height:1.1;display:block}
#minfo .mp{font-family:var(--mono);font-weight:500;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;color:var(--terra);margin-top:8px;display:block}
#minfo .md{font-size:var(--fs-body);color:var(--soft);line-height:1.55;margin-top:8px;display:block}
#minfo.vazio .mn{color:var(--soft);font-size:var(--fs-body);font-style:normal;font-family:var(--sans)}
.leg{display:flex;flex-wrap:wrap;gap:clamp(11px,1.6cqw,26px);margin-top:clamp(9px,1.3cqh,16px);font-size:var(--fs-cap);
  letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
body.esc .leg{color:#EDE6DAbb}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.leg i.ln{width:16px;height:0;border-top:1.5px dashed var(--terra);border-radius:0;vertical-align:3px}
.pend{font-family:var(--mono);font-size:var(--fs-cap);color:var(--terra);border-left:2px dashed var(--terra);
  padding-left:12px;margin-top:clamp(12px,1.8cqh,22px);line-height:1.6;max-width:64ch}
.credito{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#211D1A55;margin-top:10px}
/* fotos */
.fcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:clamp(20px,3cqw,56px);align-items:center;width:100%}
.fbox{position:relative;aspect-ratio:4/3;background:#211D1A0d;border:1px solid var(--hair);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.fbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
.fbox img.on{opacity:1}
.fbox .slot{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:clamp(14px,2cqw,26px);
  font-family:var(--mono);font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.6;color:var(--soft)}
.fbox .slot b{color:var(--terra);font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.fcap{font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:11px;line-height:1.6}
/* chrome */
.chrome{position:absolute;left:0;right:0;pointer-events:none;z-index:9;font-family:var(--mono);font-size:var(--fs-cap);
  letter-spacing:.16em;text-transform:lowercase;color:var(--soft);padding:0 var(--gut);
  display:flex;align-items:center;justify-content:space-between;height:var(--top)}
body.esc .chrome{color:#EDE6DAb0}
.chrome.pe{top:auto;bottom:0;height:var(--bot)}
.chrome.topo{top:0}
.secao{font-style:italic;position:relative;padding-left:26px;white-space:nowrap}
.secao .sn{position:absolute;left:0;top:50%;transform:translateY(-50%);font-style:normal;opacity:.55}
.dots{display:flex;gap:clamp(9px,.8cqw,14px);pointer-events:auto}
.sdot{width:var(--pt);height:var(--pt);border-radius:50%;background:currentColor;opacity:.28;cursor:pointer;position:relative;transition:opacity .25s}
.sdot.on{opacity:1}
.sdot span{position:absolute;bottom:150%;left:50%;transform:translateX(-50%);opacity:0;white-space:nowrap;font-style:italic;letter-spacing:.1em;transition:opacity .2s;pointer-events:none}
.sdot:hover span{opacity:.9}
.marca{font-style:italic;font-weight:500;text-transform:lowercase}
/* ── navegação · pastilha de leitura garantida ──────────────────────────
   Regra de sistema, 23/08/2026 (prancha/PRANCHA-SISTEMA.md, seção Chrome,
   commit b3f95705). O contador e as setas param de herdar a cor do slide e
   passam a viver numa pastilha própria: fundo creme a 94%, glifo em tinta,
   filete de tinta a 22% e sombra baixa.
   Por que clara e não escura: medida contra creme, oliva, tinta, terracota
   e foto, a clara entrega piso de 11,9:1 contra ~6:1 da escura. A fraqueza
   dela — sumir como forma sobre fundo creme — é o que o filete resolve.
   `backdrop-filter` é reforço, não requisito: sem suporte, os 94% de
   opacidade já entregam o contraste sozinhos. ── */
.nav{display:flex;align-items:center;gap:clamp(8px,.9cqw,14px);pointer-events:auto;
  background:rgba(237,230,218,.94);
  -webkit-backdrop-filter:blur(7px) saturate(1.1);backdrop-filter:blur(7px) saturate(1.1);
  border:1px solid rgba(33,29,26,.22);border-radius:999px;
  padding:clamp(4px,.42cqw,6px) clamp(7px,.7cqw,11px) clamp(4px,.42cqw,6px) clamp(11px,1.05cqw,17px);
  box-shadow:0 1px 5px rgba(33,29,26,.16);
  color:var(--tinta)}
.cont{font-variant-numeric:tabular-nums;letter-spacing:.1em;color:var(--tinta);opacity:.72}
/* 02/09/2026 — a seta passa a ter o tamanho da casa ITTB (`--seta`, 38 a
   56px). Vinha em 23–30px, e era isso que o Michel chamou de "botõezinho".
   O glifo acompanha por proporção, não por px fixo. */
.seta{width:var(--seta);height:var(--seta);
  border:1px solid rgba(33,29,26,.34);border-radius:50%;
  display:grid;place-items:center;cursor:pointer;opacity:.9;
  transition:opacity .2s,transform .1s,background .2s;
  background:none;color:var(--tinta);font-size:calc(var(--seta)*.31);line-height:1}
.seta:hover{opacity:1;background:rgba(33,29,26,.08)}
.seta:active{transform:scale(.94)}
body.na-capa .chrome.pe .pj,body.na-capa .marca{opacity:0}
/* [quadro 1600x900: nunca dispara — retirado] (max-height:780px) */

/* [quadro 1600x900: nunca dispara — retirado] (max-width:960px) */

/* ===== v2 ===== */
body.terra{color:#FBF3EA}
body.terra #quadro{background:var(--terra)}
body.terra .kick,body.terra .sub,body.terra .leg{color:#FBF3EAbb}
body.terra .dado{border-color:#FBF3EA44}
body.terra .dado .l,body.terra .dado .n{color:#FBF3EAc4}
body.terra u{color:#FBF3EA}
body.esc u{color:#D9C7A8}
.wrap{max-width:min(100%,1180px)}
.sub{max-width:52ch}
.mega{max-width:16ch}
/* divisor de ato */
.divisor{justify-content:center}
.divisor .dn{font-family:var(--mono);font-weight:500;font-size:clamp(54px,13cqw,190px);line-height:.82;letter-spacing:-.07em;opacity:.16;display:block}
.divisor .dt{font-family:var(--mono);font-style:italic;font-weight:500;font-size:clamp(30px,6.6cqw,104px);letter-spacing:-.055em;line-height:1;text-transform:lowercase;margin-top:clamp(-30px,-3.4cqw,-14px)}
.divisor .ds{font-size:var(--fs-item);color:var(--soft);margin-top:clamp(16px,2.4cqh,32px);max-width:44ch;line-height:1.6}
body.esc .divisor .ds,body.terra .divisor .ds{color:#EDE6DAc4}
/* duas jogadas */
.jogadas{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4cqw,80px);margin-top:clamp(24px,4cqh,60px)}
.jogada{border-top:1.5px solid currentColor;padding-top:clamp(12px,1.8cqh,22px)}
.jogada .jn{font-family:var(--mono);font-weight:500;font-size:clamp(46px,8.4cqw,132px);line-height:.86;letter-spacing:-.07em;display:block;opacity:.9}
.jogada .jt{font-family:var(--mono);font-style:italic;font-size:clamp(17px,2.1cqw,32px);letter-spacing:-.03em;line-height:1.12;margin-top:clamp(10px,1.5cqh,20px);display:block}
.jogada .jd{font-size:var(--fs-body);line-height:1.55;margin-top:clamp(8px,1.2cqh,14px);display:block;opacity:.72;max-width:26ch}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */

/* porte com isometria */
.pcols{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1fr);gap:clamp(20px,3.4cqw,64px);align-items:center;width:100%}
.iso{min-width:0}.iso svg{width:100%;height:auto;max-height:52cqh;display:block}
/* unitario por porte */
.unit{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.6cqw,52px);margin-top:clamp(22px,3.4cqh,54px)}
.uc{border-top:1.5px solid currentColor;padding-top:clamp(12px,1.7cqh,20px)}
.uc .ut{font-family:var(--mono);font-style:italic;font-size:var(--fs-item);letter-spacing:-.02em;display:block}

.uc .ur{font-family:var(--mono);font-weight:500;font-size:clamp(24px,3.5cqw,58px);letter-spacing:-.05em;line-height:1;color:var(--terra);margin-top:clamp(12px,1.8cqh,22px);display:block}
body.esc .uc .ur{color:#E9A184}
.uc .ul{font-size:var(--fs-cap);letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:8px;display:block}
.uc .um{font-size:var(--fs-body);color:var(--soft);margin-top:9px;line-height:1.55;display:block}

/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */

.kick.barra{display:inline-block;background:var(--terra);color:#FBF3EA;padding:7px 14px 6px;letter-spacing:.2em;margin-bottom:clamp(16px,2.3cqh,30px)}
/* trio tempo/memoria/dominio */
ol.trio{list-style:none;margin-top:clamp(22px,3.4cqh,52px);display:grid;gap:clamp(14px,2.2cqh,30px)}
ol.trio li{display:grid;grid-template-columns:minmax(0,.46fr) minmax(0,1fr);gap:clamp(16px,2.6cqw,52px);
  align-items:baseline;border-top:1px solid var(--hair);padding-top:clamp(11px,1.6cqh,20px)}
ol.trio .q{font-family:var(--mono);font-style:italic;font-weight:500;font-size:clamp(24px,3.6cqw,58px);letter-spacing:-.05em;line-height:1;color:var(--terra)}
ol.trio .t{font-size:var(--fs-body);line-height:1.6}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:860px) */

/* nota com numero grande */

/* ═══ 22/08/2026 · terceira rodada ═════════════════════════════════════════ */

/* subitens dentro de uma jogada: cada velocidade na sua linha */

.jogada .jd ul.jsub li{padding-left:1.1em;position:relative;line-height:1.5}

/* ─── a carteira que se redistribui ──────────────────────────────────────
   Sete âncoras em pílula; abaixo de cada uma, as oportunidades do entorno.
   O sorteio existe para dizer que a distribuição é indefinida de propósito. */
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:clamp(8px,1cqw,18px);margin-top:clamp(24px,3.6cqh,58px);width:100%;
  align-items:start}
/* [quadro 1600x900: nunca dispara — retirado] (max-width:1080px) */

/* [quadro 1600x900: nunca dispara — retirado] (max-width:620px) */

.pg{display:flex;flex-direction:column;align-items:center;gap:clamp(9px,1.3cqh,17px)}

  letter-spacing:-.02em;line-height:1.15;text-align:center;
  padding:clamp(7px,.9cqh,12px) clamp(9px,.9cqw,15px);border-radius:999px;

  display:flex;align-items:center;justify-content:center;

.pgo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  min-height:clamp(20px,2.4cqh,30px);align-content:flex-start}
.pgo i{display:block;width:clamp(13px,1.24cqw,21px);height:clamp(13px,1.24cqw,21px);
  border-radius:50%;background:var(--terra);
  animation:pgpop .34s cubic-bezier(.3,1.5,.5,1) backwards}
.pgo i:nth-child(2){animation-delay:.07s}
.pgo i:nth-child(3){animation-delay:.14s}
.pgo i:nth-child(n+4){animation-delay:.21s}
@keyframes pgpop{from{transform:scale(0);opacity:0}}
.pg.vazia .pgn{opacity:.42}
.pgr{margin-top:clamp(18px,2.6cqh,36px);font-size:var(--fs-cap);letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft)}

@media(prefers-reduced-motion:reduce){.pgo i{animation:none}}

/* ═══ fundo morph no divisor de seção · padrão travado em 22/08/2026 ═══════
   Copiado de modulos/divisor-morph.html. Véu do divisor a 0,60 — quase o
   triplo do véu do índice (0,18) — porque o divisor carrega o maior tipo do
   deck, e a trama compete com o título. Não recalibrar.                   */
/* (o véu do divisor migrou para #msveu-d, no bloco do segundo canvas) */

/* especificidade: body.com-fundo pinta o corpo de oliva e venceria o
   body.terra do divisor por vir depois na folha. Mesmo conflito que o
   .slide.ativo{background:transparent} resolveu na abertura. */
body.com-fundo.terra #quadro{background:var(--terra)}
body.com-fundo.terra .kick,body.com-fundo.terra .sub{color:#FBF3EAbb}
/* o chrome invertido do divisor tem de sobreviver ao com-fundo */
body.com-fundo.terra .chrome{color:#FBF3EAdb}

/* ═══ o segundo canvas: o fundo dos divisores ══════════════════════════════
   Mesma geometria do primeiro, empilhado atrás do palco. Só um dos dois
   aparece por vez, e o que não aparece está pausado pelo go(). */
#msfundo-d{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;
  opacity:0;transition:opacity .8s ease;pointer-events:none}
#msveu-d{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  background:var(--terra);transition:opacity .3s ease}
#msveu-d::after{content:"";position:absolute;inset:0;opacity:.5;
  background:linear-gradient(180deg,var(--terra) 0%,transparent 26%,
                             transparent 74%,var(--terra) 100%)}
body.fundo-div #msfundo-d{opacity:1}
body.fundo-div #msveu-d{opacity:.60}   /* travado em 22/08/2026 */
/* no divisor o canvas e o véu da marca somem, e vice-versa */
body.fundo-div #msfundo,body.fundo-div #msveu{opacity:0}

/* ═══ 23/08/2026 · legibilidade e grifo ════════════════════════════════════ */

/* o terracota cheio sobre a oliva some. O `lista` já tinha o clareado; o
   `trio` e o `jogadas` não tinham, e é ali que o texto ficava ilegível. */
body.esc ol.trio .q,body.com-fundo ol.trio .q{color:#E9A184}
body.terra ol.trio .q{color:#FBF3EA}
body.esc .jogada .jn,body.esc .jogada .jt{color:#F0E7DC}
body.esc .frt{color:#E9A184}

/* ─── grifo — a faixa que destaca a frase ────────────────────────────────
   Trazido da apresentação da Lavro (mecânica de 22/08). Não é negrito: é
   marca de caneta POR TRÁS do texto, que se desenha da esquerda para a
   direita. Usa background-size animado em vez de pseudo-elemento absoluto,
   para acompanhar a quebra de linha com box-decoration-break: clone.     */
.grifo{
  background-image:linear-gradient(var(--grifo-cor,#B85C3833),var(--grifo-cor,#B85C3833));
  background-repeat:no-repeat;
  background-position:0 .14em;
  background-size:0% calc(100% - .22em);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .14em;margin:0 -.14em;border-radius:2px}
.revelado .grifo{animation:ms-grifo 620ms cubic-bezier(.62,0,.30,1) forwards;
  animation-delay:var(--gd,760ms)}
@keyframes ms-grifo{to{background-size:100% calc(100% - .22em)}}
/* sobre oliva e terracota a marca inverte para o creme */
body.esc .grifo,body.com-fundo .grifo{--grifo-cor:#EDE6DA2e}
body.terra .grifo{--grifo-cor:#FBF3EA33}
@media(prefers-reduced-motion:reduce){
  .grifo{background-size:100% calc(100% - .22em)!important;animation:none!important}}

/* R$ nunca vira r$: os títulos são caixa-baixa, o símbolo da moeda não */
.ru{text-transform:none}

/* subitens da jogada com bolinha, não traço */

/* linha de tabela fora do estudo: o valor também apaga */

/* o texto de apoio do dado vive no popover, não no slide */
.dado .n{display:none}
.dado.tem{cursor:help;position:relative;transition:border-color .22s}
.dado.tem .l::after{content:"+";margin-left:.5em;font-family:var(--mono);
  opacity:.5;transition:opacity .22s}
/* no hover o dado inteiro assume o destaque: a linha, o número e o rótulo */
.dado.tem:hover,.dado.tem.aberto{border-top-color:var(--terra)}

.dado.tem:hover .l,.dado.tem.aberto .l{color:var(--terra)}
.dado.tem:hover .l::after,.dado.tem.aberto .l::after{opacity:1}
body.esc .dado.tem:hover,body.esc .dado.tem.aberto{border-top-color:#E9A184}
body.esc .dado.tem:hover .v,body.esc .dado.tem.aberto .v,
body.esc .dado.tem:hover .l,body.esc .dado.tem.aberto .l{color:#E9A184}
.dado .v,.dado .l{transition:color .22s ease}
/* os dois slides da carteira: texto ancorado no topo, para o isométrico e o
   título ficarem parados na tela enquanto só o conteúdo da direita troca */
.pcols.alto{align-items:start}
.pcols.alto .wrap{padding-top:clamp(10px,2.4cqh,44px)}

/* ─── só trama: o mesmo carrossel da marca, sob véu quase opaco ──────────
   Nos slides verdes de conteúdo o fundo não é imagem, é textura. O véu vai
   a 0,90 e troca o gradiente diagonal por oliva chapada: a foto some, o
   pontilhado continua respirando. Nenhum contexto WebGL novo.           */
body.fundo-trama #msveu{background:var(--oliva);opacity:.90;
  transition:opacity .45s ease,background-color .45s ease}
body.fundo-trama #msfundo{opacity:1}
body.fundo-trama .slide.ativo{background:transparent}

/* ─── carteira: dois estados no mesmo slide ──────────────────────────────
   Os dois blocos ocupam a MESMA célula de grade, então a caixa cresce pelo
   mais alto e nada salta quando um troca pelo outro. O isométrico e o
   título ficam fora dessa troca — não re-animam. */
.trbox{display:grid;margin-top:clamp(14px,2.2cqh,30px)}
.trbox>.tr{grid-area:1/1;transition:opacity .42s ease,transform .42s ease}
.tr-b{opacity:0;transform:translateY(9px);pointer-events:none}

.trbox:has(.tr-b.on) .tr-a{opacity:0;transform:translateY(-9px);pointer-events:none}
.trbox .notaN{margin-top:clamp(14px,2cqh,26px)}

/* o slide da carteira divide a tela ao meio: o desenho tem sete volumes */

   tela cheia. Vantagem real: nenhuma prancha transbordava, por construção.

     dentro do quadro fixo") voltam a poder disparar abaixo de ~1200px de
     largura. Não foram restauradas: em uso real — monitor e projetor — os
     limiares não são alcançados, e restaurar vinte regras às cegas é
     trabalho especulativo. O que estava lá está em
     `_R8/cel-responsivo.css.txt`, e a varredura é que aponta se falta.
   · o notch e a Dynamic Island continuam cobertos: o quadro é medido
     contra `#moldura`, que já é a área segura.

   As unidades de dentro seguem em `cqw`/`cqh`, do CONTÊINER. Com
   `container-type:size` no quadro, 1cqw = 1% da largura DO QUADRO — e o
   quadro agora tem a largura da tela. Num monitor de 1600 isso dá os mesmos

   que a troca do quadro fixo para tela cheia não exigiu reescrever as 275

   transform:scale, e por isso não produz tarja preta em cima nem embaixo,
   em monitor nenhum. Foi o erro da peça EMEI Presidente Dutra: a versão de
   19/08 travava 1600 × 900 e escalava, o que em qualquer tela que não fosse
   16:9 exato devolvia letterbox. As peças de referência da casa —
   `casa-ittb` e `tokyo-centro` — nunca fizeram isso: compõem contra a
   viewport, e são elas o padrão.

uniform sampler2D uA,uB;
uniform vec2 uRes,uSA,uSB,uM;
uniform float uT,uTime,uAmp,uEdge,uDot,uAng,uAng2,uContrast,uGamma,uMode,uTrans,
              uGrain,uZoom,uAcc,uVig,uBleed,uFit,uCur,uMAmt,uMRad,uEnter;
uniform vec3 uInk,uPaper,uAccent;

float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.5);return fract(p.x*p.y*95.43);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
float bayer(vec2 p){
  int x=int(mod(p.x,8.0)),y=int(mod(p.y,8.0));
  int m[64]=int[64](0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21);
  return (float(m[y*8+x])+0.5)/64.0;
}
// enquadra (contain ou sangria) e devolve luminância; uBleed vira linha em massa tonal
float lum(sampler2D t, vec2 imgSize, vec2 uv){
  float ca=uRes.x/uRes.y, ia=imgSize.x/imgSize.y;
  vec2 sc = uFit>0.5 ? (ca>ia ? vec2(1.0,ca/ia) : vec2(ia/ca,1.0))
                     : (ca>ia ? vec2(ia/ca,1.0) : vec2(1.0,ca/ia));
  vec2 q=(uv-0.5)/(sc*(uFit>0.5?1.0:0.86))+0.5;
  if(q.x<-0.05||q.x>1.05||q.y<-0.05||q.y>1.05) return 1.0;
  vec2 qq=vec2(clamp(q.x,0.0,1.0),1.0-clamp(q.y,0.0,1.0));
  vec4 c=mix(texture(t,qq),textureLod(t,qq,2.0+uBleed*4.5),uBleed);
  float l=mix(1.0, dot(c.rgb,vec3(0.299,0.587,0.114)), c.a);
  if(q.x<0.0||q.x>1.0||q.y<0.0||q.y>1.0) l=mix(1.0,l,uBleed*0.6);
  return l;
}
float cover(vec2 q,float cell,float r){          // cobertura de um ponto da trama
  vec2 g=mod(q,cell)-cell*0.5;
  return 1.0-smoothstep(-0.9,0.9,length(g)-r);
}

void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float br=sin(uTime*0.18)*0.5+0.5;
  uv=(uv-0.5)*(1.0-uZoom*br)+0.5+vec2(sin(uTime*0.07),cos(uTime*0.05))*uZoom*0.35;

  // ---- cursor ---------------------------------------------------------------
  float asp=uRes.x/uRes.y;
  vec2 mp=uM/uRes;
  vec2 dm=(uv-mp)*vec2(asp,1.0);
  float rr=length(dm)/(max(uMRad,1.0)/uRes.y);
  float fm=exp(-rr*rr*2.0)*uMAmt;
  float cellMod=1.0, angMod=0.0, glitch=0.0, light=1.0, sharp=0.0;
  vec2 pxA=vec2(0.0), pxB=vec2(0.0);
  if(uCur>0.5&&uCur<1.5){                                   // foco: resolve onde se olha
    cellMod=1.0-fm*0.45; sharp=fm*0.30;
  }else if(uCur>1.5&&uCur<2.5){                             // luz: claridade rasante
    float ring=exp(-pow(rr-1.35,2.0)*3.0)*uMAmt;
    light=1.0-fm*0.55+ring*0.20;
  }else if(uCur>2.5&&uCur<3.5){                             // paralaxe: as duas camadas
    /* as amplitudes trocam de papel ao longo da passagem: a que entra com 0.026
       termina em 0.012, que é exatamente o valor com que reaparece como camada A
       no ciclo seguinte. Sem isso há um salto a cada troca de peça.            */
    vec2 d=(mp-0.5)*uMAmt;
    pxA=d*mix(0.012,0.026,uT); pxB=d*mix(0.026,0.012,uT);
  }else if(uCur>3.5&&uCur<4.5){                             // ímã: a trama abre
    cellMod=1.0+fm*1.8; angMod=fm*30.0;
  }else if(uCur>4.5){                                       // quebra: fenda fina
    float t2=floor(uTime*7.0);
    float w2=(1.5+9.0*uMAmt)/uRes.x;
    float band=step(abs(uv.x-mp.x),w2);
    uv.y+=band*(hash(vec2(t2,7.0))-0.5)*0.10*uMAmt;
    float rowH=0.030;
    float row=floor((uv.y-mp.y)/rowH);
    float h=hash(vec2(row,t2));
    float tear=step(0.55,h)*step(abs(uv.y-mp.y),rowH*1.6)*step(abs(uv.x-mp.x),0.06+0.10*uMAmt);
    uv.x+=(h-0.5)*0.045*uMAmt*tear;
    glitch=max(band,tear*0.55);
    cellMod=1.0+band*0.6*uMAmt;
  }

  // ---- luminâncias das duas peças ------------------------------------------
  float t=uT;
  vec2 n=vec2(fbm(uv*2.6+uTime*0.03), fbm(uv*2.6+7.3-uTime*0.025))*2.0-1.0;
  float bump=sin(t*3.14159);
  vec2 dA=uv+pxA, dB=uv+pxB;
  if(uTrans<0.5){ dA+=n*uAmp*t*bump; dB-=n*uAmp*(1.0-t)*bump; }
  float a=clamp((lum(uA,uSA,dA)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float b=clamp((lum(uB,uSB,dB)-0.5)*(uContrast+sharp)+0.5,0.0,1.0);
  float vA=pow(1.0-a,uGamma), vB=pow(1.0-b,uGamma);

  // frente que varre da esquerda para a direita
  float soft=0.06+uEdge*0.55;
  float front=mix(-soft,1.0+soft,t);
  float w=clamp((front-uv.x+soft)/(2.0*soft),0.0,1.0);

  float cell=max(uDot*cellMod,2.0);
  vec2 p=gl_FragCoord.xy-0.5*uRes;
  vec2 q=rot(radians(uAng+angMod))*p;
  float v=0.0, ink=0.0, band=0.0;

  if(uTrans<0.5){                                  // morph — dissolução por ruído
    float th=mix(fbm(uv*7.5+31.7),vnoise(uv*uRes.x/26.0),0.35);
    float e=clamp(uEdge,0.02,1.0);
    float lo=th*(1.0-e);
    float k=smoothstep(lo,lo+e,t);
    v=mix(vA,vB,k);
    band=smoothstep(0.42,0.5,k)*(1.0-smoothstep(0.5,0.58,k));
  }else if(uTrans<1.5){                            // entrelaço — cada ponto escolhe um lado
    float own=step(hash(floor(q/cell)+0.5),w);
    v=mix(vA,vB,own);
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else if(uTrans<2.5){                            // serigrafia — duas telas, dois ângulos
    vec2 qB=rot(radians(uAng+angMod+uAng2))*p;
    float iA=cover(q ,cell,sqrt(max(vA*(1.0-w),0.0))*cell*0.70)*smoothstep(0.0,0.02,vA*(1.0-w));
    float iB=cover(qB,cell,sqrt(max(vB*w      ,0.0))*cell*0.70)*smoothstep(0.0,0.02,vB*w);
    ink=1.0-(1.0-iA)*(1.0-iB);
    v=vA*(1.0-w)+vB*w;
    band=exp(-pow((uv.x-front)/(soft*0.8),2.0)*2.0);
  }else{                                           // maré — a massa do desenho conduz
    float th=mix(uv.x,1.0-vA,0.42);
    float k=smoothstep(th-soft,th+soft,front);
    v=mix(vA,vB,k);
    v*=1.0-0.30*exp(-pow((front-th)/soft,2.0)*2.0);
    band=exp(-pow((front-th)/soft,2.0)*2.0);
  }
  v*=light;

  if(uTrans>1.5&&uTrans<2.5){                      // serigrafia já montou a tinta
  }else if(uMode<0.5){ ink=cover(q,cell,sqrt(max(v,0.0))*cell*0.70); }
  else if(uMode<1.5){ ink=1.0-smoothstep(-0.8,0.8,abs(mod(q.y,cell)-cell*0.5)-v*cell*0.5); }
  else if(uMode<2.5){ ink=step(bayer(gl_FragCoord.xy/max(1.0,cell/6.0)),v); }
  else { ink=v; }
  ink*=smoothstep(0.0,0.05,v);

  /* ---- entrada diagonal: a trama nasce ao longo de uma reta inclinada ---- */
  float sx=uv.x+(uv.y-0.5)*0.26;                 // eixo da varredura, ~14° de inclinação
  float bandW=0.30;
  float fEnter=uEnter*(1.0+2.0*bandW)-bandW;
  float rev=clamp((fEnter-sx)/bandW+0.5,0.0,1.0);
  float fio=exp(-pow((sx-fEnter)/0.0045,2.0))*step(0.001,uEnter)*step(uEnter,0.999);
  ink*=rev; band=mix(band,0.0,1.0-rev);

  vec3 tinta=mix(uInk,uAccent,clamp(band,0.0,1.0)*uAcc);
  vec3 col=mix(uPaper,tinta,clamp(ink,0.0,1.0));
  col=mix(col,uAccent,clamp(fio,0.0,1.0)*0.85);
  col=mix(col,uAccent,glitch*0.12*uMAmt);
  col+= (hash(gl_FragCoord.xy+fract(uTime)*97.0)-0.5)*uGrain;
  float d=length((uv-0.5)*vec2(asp,1.0));
  col=mix(col,uPaper*0.96+uInk*0.04,smoothstep(0.42,0.95,d)*uVig);
  frag=vec4(col,1.0);
}`;

function montar(cv, IMGS, OPT){
  OPT = OPT || {};
  const gl=cv.getContext('webgl2',{antialias:false,powerPreference:'low-power'});
  if(!gl) return {entrada(){},pausar(){}};
  function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);gl.bindVertexArray(gl.createVertexArray());
  const U={};for(const k of ['uA','uB','uRes','uSA','uSB','uM','uT','uTime','uAmp','uEdge','uDot',
   'uAng','uAng2','uContrast','uGamma','uMode','uTrans','uEnter','uGrain','uZoom','uAcc','uVig',
   'uBleed','uFit','uCur','uMAmt','uMRad','uInk','uPaper','uAccent'])U[k]=gl.getUniformLocation(pr,k);
  gl.uniform1i(U.uA,0);gl.uniform1i(U.uB,1);
  const P={trans:2,cur:3,mode:0,fit:1,dot:4.5,angle:22,angle2:32,bleed:.42,contrast:.65,
    gamma:1.45,amp:.08,edge:1.0,speed:.30,zoom:.01,accent:0,grain:0,vig:.86,mforce:.46,mrad:240};
  const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
  const INK=hex(OPT.ink||'#0e0f0b'),PAPER=hex(OPT.paper||'#6B6A4B'),
        ACC=hex(OPT.acc||'#B85C38'),SCALE=OPT.scale||0.9;
  /* paleta trocável em tempo real: MSFundo.montar(...).cor({paper:'#B85C38'}) */
  const COR={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};
  const ALVO={ink:INK.slice(),paper:PAPER.slice(),acc:ACC.slice()};
  function prep(src){
    if(OPT.prep===false) return src;   // já pré-exposta no arquivo
    const w=src.naturalWidth,h=src.naturalHeight;
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
    let d;try{d=x.getImageData(0,0,w,h);}catch(e){return src;}
    const a=d.data;let s=0,n=0;
    for(let k=0;k<a.length;k+=64){s+=(a[k]*.299+a[k+1]*.587+a[k+2]*.114)/255;n++;}
    const mean=s/Math.max(n,1); if(mean>=0.45) return src;
    const g=Math.max(0.42,Math.log(0.50)/Math.log(Math.max(mean,0.03)));
    const lut=new Uint8Array(256);for(let v=0;v<256;v++)lut[v]=Math.round(255*Math.pow(v/255,g));
    for(let k=0;k<a.length;k+=4){a[k]=lut[a[k]];a[k+1]=lut[a[k+1]];a[k+2]=lut[a[k+2]];}
    x.putImageData(d,0,0);return c;
  }
  function mkTex(raw){
    const src=prep(raw);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.generateMipmap(gl.TEXTURE_2D);
    return {tex:t,w:src.width||src.naturalWidth,h:src.height||src.naturalHeight};
  }
  let S=[],i=0,t=0,clock=0,last=performance.now(),ready=false,visible=true,paused=false;
  let mx=0,my=0,tmx=0,tmy=0,mAmt=0,mOn=false,enter=1,enterT=0;
  const easeOut=x=>1-Math.pow(1-x,3);
  function resize(){const d=Math.min(devicePixelRatio||1,2)*SCALE;
    cv.width=Math.round(cv.clientWidth*d)||Math.round(innerWidth*d);
    cv.height=Math.round(cv.clientHeight*d)||Math.round(innerHeight*d);
    gl.viewport(0,0,cv.width,cv.height);}
  addEventListener('resize',resize);resize();
  addEventListener('pointermove',e=>{const k=cv.width/(cv.clientWidth||innerWidth);
    tmx=e.clientX*k;tmy=cv.height-e.clientY*k;
    if(mAmt<0.02){mx=tmx;my=tmy;}mOn=true;});
  addEventListener('pointerleave',()=>mOn=false);
  document.addEventListener('visibilitychange',()=>visible=!document.hidden);
  if('IntersectionObserver' in window)
    new IntersectionObserver(e=>{visible=e[0].isIntersecting&&!document.hidden;},{threshold:.01}).observe(cv);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) paused=true;
  let FILA=IMGS.slice();
  if(OPT.sortear){ for(let j=FILA.length-1;j>0;j--){
    const r=Math.floor(Math.random()*(j+1)); const t=FILA[j]; FILA[j]=FILA[r]; FILA[r]=t; } }
  (async()=>{ for(const src of FILA){
    const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>r(null);x.src=src;});
    if(im) S.push(mkTex(im)); if(S.length===2) ready=true;
    await new Promise(r=>setTimeout(r,0));
  } if(S.length) ready=true; })();
  function frame(now){
    requestAnimationFrame(frame);
    if(!visible||!ready){last=now;return;}
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(!paused){clock+=dt;t+=dt*P.speed*0.5;if(t>=1){t=0;i=(i+1)%S.length;}}
    const A=S[i],B=S[(i+1)%S.length],k=cv.width/(cv.clientWidth||innerWidth);
    const kp=1-Math.exp(-dt*9.05),ka=1-Math.exp(-dt*4.35);
    mx+=(tmx-mx)*kp;my+=(tmy-my)*kp;mAmt+=((mOn?1:0)-mAmt)*ka;
    if(enter<1){enterT+=dt;enter=Math.min(1,easeOut(Math.max(0,enterT-0.15)/1.45));}
    const kc=1-Math.exp(-dt*3.2);
    for(const nome of ['ink','paper','acc'])
      for(let c=0;c<3;c++) COR[nome][c]+=(ALVO[nome][c]-COR[nome][c])*kc;
    const e0=t*t*(3-2*t);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.tex);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.tex);
    gl.uniform2f(U.uRes,cv.width,cv.height);
    gl.uniform2f(U.uSA,A.w,A.h);gl.uniform2f(U.uSB,B.w,B.h);gl.uniform2f(U.uM,mx,my);
    gl.uniform1f(U.uT,Math.min(1,Math.max(0,(e0-0.5)*1.55+0.5)));
    gl.uniform1f(U.uTime,clock);gl.uniform1f(U.uEnter,enter);
    gl.uniform1f(U.uDot,P.dot*k);gl.uniform1f(U.uAng,P.angle);gl.uniform1f(U.uAng2,P.angle2);
    gl.uniform1f(U.uBleed,P.bleed);gl.uniform1f(U.uContrast,P.contrast);gl.uniform1f(U.uGamma,P.gamma);
    gl.uniform1f(U.uAmp,P.amp);gl.uniform1f(U.uEdge,P.edge);gl.uniform1f(U.uZoom,P.zoom);
    gl.uniform1f(U.uAcc,P.accent);gl.uniform1f(U.uGrain,P.grain);gl.uniform1f(U.uVig,P.vig);
    gl.uniform1f(U.uMode,P.mode);gl.uniform1f(U.uTrans,P.trans);gl.uniform1f(U.uFit,P.fit);
    gl.uniform1f(U.uCur,P.cur);gl.uniform1f(U.uMAmt,mAmt*P.mforce);gl.uniform1f(U.uMRad,P.mrad*k);
    gl.uniform3fv(U.uInk,COR.ink);gl.uniform3fv(U.uPaper,COR.paper);gl.uniform3fv(U.uAccent,COR.acc);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
  return {entrada(){enter=0;enterT=0;}, pausar(v){paused=!!v;}, P:P,
    cor(o){ if(o.ink)ALVO.ink=hex(o.ink); if(o.paper)ALVO.paper=hex(o.paper);
            if(o.acc)ALVO.acc=hex(o.acc); }};
}
return {montar:montar};
})();

</script>
<script>
const MAP = {
  /* ═══ DADO DO PROJETO ═══════════════════════════════════════════════
     Andaime vazio, com o contrato à vista. O deck de origem trazia 107 KB
     de lotes reais — endereço, nome de operador, coordenada — e isso não
     entra num arquivo público. Como montar o seu: sistemas/gabaritos/mapa.md
     ═══════════════════════════════════════════════════════════════════ */
  "base": {
    "rua":     {"img": "", "w": 1200, "h": 1500, "tex": ""},
    "cluster": {"img": "", "w": 1024, "h": 768,  "tex": ""}
  },
  "lotes": [
    /* {"n":"rótulo","end":"Endereço, 000","lat":-23.55,"lon":-46.63,
        "d":[[x,y],…] (contorno),"r":0,"t":0,"offset":[0,0]} */
  ],
  "pts":   [],   /* pontos do mapa de cluster */
  "msrua": [],   /* recorte da rua           */
  "sj":    [],   /* recorte auxiliar         */
  "fundo": [],   /* massa de fundo           */
  "aiu": 0, "calc": 0, "chave": 0, "req": 0
} /* ← DADO DESTE DECK. O do estudo de posicionamento tinha 107 KB de lotes
       reais, com endereço e nome de operador: saiu daqui porque este arquivo é
       público. Ao montar um mapa, gerar o MAP do projeto — receita em
       sistemas/gabaritos/mapa.md. */;
/* imagens embutidas — carrossel da capa (capamorph_R6) e o par antes/depois */
/* carrossel da abertura — nove peças de 640 px em WebP, com a
   auto-exposição já aplicada no arquivo. A engine sobe com prep:false:
   sem isso são nove correções de histograma na thread principal, na carga. */
/* carrossel da abertura e dos divisores — imagens DESTA apresentação.
   Regra de 22/08/2026: cada deck usa as suas, senão a trama de fundo vira
   enfeite genérico e briga com o assunto. Três a cinco imagens, não dez —
   cada uma de 1024 px custa ~3,7 MB de VRAM.
   640 px de largura, WebP, com a auto-exposição da engine JÁ APLICADA no
   arquivo — por isso a chamada sobe com prep:false. A gama de cada uma
   saiu de log(0,50)/log(média), piso 0,42, igual ao prep() da engine. */
/* ═══ dois carrosséis, dois canvas ════════════════════════════════════════
   Decisão do Michel em 22/08/2026, depois de ver os dois lados:

   CAPA_IMGS — as nove peças do portfólio dele. Ficam ATRÁS DA MARCA, na
   abertura e no fechamento. É a assinatura: a frase da marca roda sempre
   sobre o trabalho de quem assina, seja qual for o deck.

   DIV_IMGS — as imagens DESTE deck. Ficam atrás dos divisores de seção.
   Três a cinco imagens do próprio projeto, não dez.

   Todas a 640 px em WebP, com a auto-exposição da engine JÁ APLICADA no
   arquivo — por isso as duas chamadas sobem com prep:false. A gama de cada
   uma saiu de log(0,50)/log(média), piso 0,42, igual ao prep() da engine. */
const CAPA_IMGS=[] /* ← acervo da MARCA. Vem do bloco da marca. Vazio = fundo chapado, que é estado aceitável. */;
const DIV_IMGS=[] /* ← imagens DESTE deck para o divisor. Vazio = divisor só trama, que é o padrão. */;
const F_ANTES=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_DEPOIS=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO1=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO2=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO3=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
const F_FOTO4=""; /* ← foto do deck. Slot vazio renderiza retângulo hachurado. */
/* lote destacado no mapa da quadra -> foto do empreendimento */
const FOTO_LOTE={0:F_FOTO1,1:F_FOTO2,2:F_FOTO3,3:F_FOTO4};

const COR={toq:'#B85C38',ret:'#211D1A',obra:'#6B6A4B',novo:'#8C8A5E',planta:'#6E6486'};
function wpx(lat,lon,z){const n=Math.pow(2,z)*256,la=lat*Math.PI/180;
  return [(lon+180)/360*n,(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n];}
function proj(m){const {z,ox,oy,esc,mpp,fw,fh}=m;
  const n=Math.pow(2,z)*256;
  return {X:(la,lo)=>+((wpx(la,lo,z)[0]-ox)*esc).toFixed(1),
          Y:(la,lo)=>+((wpx(la,lo,z)[1]-oy)*esc).toFixed(1),
          /* inverso: o locador precisa de lat/lon a partir do pixel do viewBox */
          lo:x=>(x/esc+ox)/n*360-180,
          la:y=>{const t=Math.PI-2*Math.PI*(y/esc+oy)/n;
                 return 180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t)));},
          r:v=>+(v/mpp*esc).toFixed(1),w:fw,h:fh};}
const via=(P,a)=>a.map(c=>`${P.X(c[0],c[1])},${P.Y(c[0],c[1])}`).join(' ');
const vias=(P,arr,attr)=>arr.map(c=>`<polyline points="${via(P,c)}" ${attr}/>`).join('');
function barra(P,m,x,y){const L=P.r(m);
  return `<g transform="translate(${x},${y})"><line x1="0" y1="0" x2="${L}" y2="0" stroke="#211D1A" stroke-width="1.4"/><line x1="0" y1="-5" x2="0" y2="5" stroke="#211D1A" stroke-width="1.4"/><line x1="${L}" y1="-5" x2="${L}" y2="5" stroke="#211D1A" stroke-width="1.4"/><text x="${(L/2).toFixed(1)}" y="-10" text-anchor="middle" font-family="DM Mono,monospace" font-size="15" fill="#211D1A" opacity=".72">${m} m</text></g>`;}


/* ─── janela retrato para o mapa em sangria ───────────────────────────────
   O painel do mapa e 48vw x 100vh — em 16:9 isso da 0,85 de proporcao.
   O viewBox cheio da base e paisagem, entao com `slice` os rotulos da
   esquerda eram decepados. Aqui se recorta uma janela ja no formato do
   painel, centrada no que interessa, e o slice so come a folga.          */
function janela(P,pts,asp){
  asp=asp||0.85;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(([x,y])=>{if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;});
  const mx=(x1-x0)*0.035+10, my=(y1-y0)*0.035+10;
  x0-=mx;x1+=mx;y0-=my;y1+=my;
  let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(w/h>asp){ h=w/asp; } else { w=h*asp; }
  x0=cx-w/2;y0=cy-h/2;
  return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}
function mapaRua(sang){
  const B=MAP.base.rua,P=proj(B);
  const rot={0:[16,30,'start'],1:[0,-18,'middle'],2:[24,-6,'start'],3:[0,30,'middle'],4:[0,-16,'middle'],5:[-20,2,'end'],6:[-20,2,'end']};
  /* a janela tem de conter os rotulos, nao so os poligonos: eles saem bem
     para fora do lote e eram decepados pelo slice. Largura estimada pelo
     avanco da DM Mono, ~0,60 em, a 17 px.                                */
  const alvo=[];
  MAP.lotes.forEach((l,i)=>{
    l.r.forEach(c=>alvo.push([P.X(c[0],c[1]),P.Y(c[0],c[1])]));
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    const lw=l.n.length*10.2, ax=X+o[0], ay=Y+o[1];
    const e=o[2]==='start'?[ax,ax+lw]:o[2]==='end'?[ax-lw,ax]:[ax-lw/2,ax+lw/2];
    alvo.push([e[0],ay-14],[e[1],ay+6]);
  });
  const vb=sang?janela(P,alvo):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb}" role="img" aria-label="mapa de lotes">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  MAP.fundo.forEach(r=>{s+=`<polygon points="${via(P,r)}" fill="none" stroke="#211D1A" stroke-opacity=".16" stroke-width=".8"/>`;});
  s+=vias(P,MAP.msrua,'fill="none" stroke="#B85C38" stroke-opacity=".15" stroke-width="'+P.r(12)+'" stroke-linecap="round"');
  const fl=MAP.msrua.flat(); const r0=fl[Math.floor(fl.length*0.28)];
  s+=`<text x="${P.X(r0[0],r0[1])}" y="${P.Y(r0[0],r0[1])-16}" text-anchor="middle" font-family="DM Mono,monospace" font-style="italic" font-size="17" fill="#B85C38" opacity=".95">${MAP.rotulo||''}</text>`;
  MAP.lotes.forEach((l,i)=>{
    const c=COR[l.t];
    s+=`<g class="lote" data-l="${i}" tabindex="0"><path d="M${via(P,l.r).replace(/ /g,'L')}Z" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="1.8" stroke-opacity=".85" stroke-dasharray="6 4"/></g>`;});
  MAP.lotes.forEach((l,i)=>{
    const X=P.X(l.lat,l.lon),Y=P.Y(l.lat,l.lon),o=rot[i]||[0,24,'middle'];
    s+=`<text x="${X+o[0]}" y="${Y+o[1]}" text-anchor="${o[2]}" font-family="DM Mono,monospace" font-style="italic" font-size="17" fill="#211D1A" paint-order="stroke" stroke="#EDE6DA" stroke-width="4" pointer-events="none">${l.n}</text>`;});
  s+=barra(P,50,44,P.h-20);
  return s+`</svg>`;
}

/* ─── locador: os dois perímetros da subvenção ────────────────────────────
   O Requalifica Centro tem 6,4 km² e a AIU do Setor Central, 2.780 ha —
   quatro vezes o recorte do mapa principal. Desenhar por cima só cruzaria
   a tela com uma linha. Vai como locador no canto, com o retângulo do
   recorte atual dentro.
   A distinção importa em dinheiro: desde o Decreto 65.205 de 26/05/2026 a
   AIU vale para HIS-1, HIS-2 e HMP; residencial de mercado (R2v) e não
   residencial continuam restritos ao perímetro do Requalifica.          */
function locador(P,vb,W){
  const A=[].concat(MAP.aiu||[],MAP.req||[]).flat();
  if(!A.length) return '';
  const H=Math.round(W*1.02), pad=9;
  let la0=1e9,la1=-1e9,lo0=1e9,lo1=-1e9;
  A.forEach(([la,lo])=>{if(la<la0)la0=la;if(la>la1)la1=la;if(lo<lo0)lo0=lo;if(lo>lo1)lo1=lo;});
  const kx=(W-2*pad)/(lo1-lo0), ky=(H-2*pad)/(la1-la0), k=Math.min(kx,ky);
  const cx=(lo0+lo1)/2, cy=(la0+la1)/2;
  const X=lo=>pad+(W-2*pad)/2+(lo-cx)*k, Y=la=>pad+(H-2*pad)/2-(la-cy)*k;
  /* 1 vértice a cada N: a AIU tem 2.259 e o locador tem 190 px de largura */
  const cam=(an,n)=>an.filter((_,i)=>i%n===0||i===an.length-1)
    .map(([la,lo])=>`${X(lo).toFixed(1)},${Y(la).toFixed(1)}`).join(' ');
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#EFEAE0" stroke="#211D1A" stroke-opacity=".28" stroke-width="1"/>`;
  (MAP.aiu||[]).forEach(an=>{g+=`<polygon points="${cam(an,9)}" fill="#6B6A4B" fill-opacity=".13" stroke="#6B6A4B" stroke-width="1" stroke-opacity=".7" stroke-dasharray="3 2.5"/>`;});
  (MAP.req||[]).forEach(an=>{g+=`<polygon points="${cam(an,2)}" fill="#B85C38" fill-opacity=".16" stroke="#B85C38" stroke-width="1.3"/>`;});
  /* o retângulo do recorte que está sendo mostrado ao lado */
  const v=vb.split(' ').map(Number);
  const cantos=[[v[0],v[1]],[v[0]+v[2],v[1]],[v[0]+v[2],v[1]+v[3]],[v[0],v[1]+v[3]]]
    .map(([x,y])=>{const la=P.la(y),lo=P.lo(x);return `${X(lo).toFixed(1)},${Y(la).toFixed(1)}`;}).join(' ');
  g+=`<polygon points="${cantos}" fill="none" stroke="#211D1A" stroke-width="1.6"/>`;
  g+=`<text x="${pad}" y="${H-19}" font-family="DM Mono,monospace" font-size="10.5" fill="#B85C38">requalifica · 6,4 km² · tudo</text>`;
  g+=`<text x="${pad}" y="${H-6}" font-family="DM Mono,monospace" font-size="10.5" fill="#6B6A4B">aiu · 2.780 ha · só his</text>`;
  return g;
}
function mapaCluster(sang){
  const B=MAP.base.cluster,P=proj(B),r=P.r(200);
  const alvo2=[];MAP.pts.forEach(q=>{const X=P.X(q.lat,q.lon),Y=P.Y(q.lat,q.lon);
    alvo2.push([X-r,Y-r],[X+r,Y+r]);});
  const vb2=sang?janela(P,alvo2):`0 0 ${P.w} ${P.h}`;
  let s=`<svg viewBox="${vb2}" role="img" aria-label="Centro — raios de 200 m">`;
  s+=`<image href="${B.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  s+=vias(P,MAP.calc,'fill="none" stroke="#6B6A4B" stroke-width="11" stroke-opacity=".3" stroke-linecap="round"');
  s+=vias(P,MAP.calc,'fill="none" stroke="#3F3E2C" stroke-width="2.4" stroke-dasharray="1.5 6" stroke-linecap="round" stroke-opacity="1"');
  s+=vias(P,MAP.sj,'fill="none" stroke="#B85C38" stroke-width="16" stroke-opacity=".2" stroke-linecap="round"');
  s+=vias(P,MAP.sj,'fill="none" stroke="#B85C38" stroke-width="2.6" stroke-dasharray="11 7" stroke-linecap="round" stroke-opacity=".95"');
  const sjf=MAP.sj.flat(); const m0=sjf[Math.floor(sjf.length*0.5)];
  if(m0) s+=`<text x="${P.X(m0[0],m0[1])+14}" y="${P.Y(m0[0],m0[1])-12}" font-family="DM Mono,monospace" font-style="italic" font-size="19" fill="#B85C38" paint-order="stroke" stroke="#EFEAE0" stroke-width="4">boulevard são joão</text>`;
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<circle class="raio" data-i="${i}" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="${r}" fill="#6B6A4B" fill-opacity=".11" stroke="#6B6A4B" stroke-opacity=".34" stroke-width="1"/>`;});
  MAP.pts.forEach((p,i)=>{if(!p.cred)return;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="16"/><circle class="anel" cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="9"/><circle cx="${P.X(p.lat,p.lon)}" cy="${P.Y(p.lat,p.lon)}" r="4" fill="#4F4E38"/></g>`;});
  MAP.pts.forEach((p,i)=>{if(!p.toq)return;
    const X=P.X(p.lat,p.lon),Y=P.Y(p.lat,p.lon);
    if(p.anc) s+=`<circle cx="${X}" cy="${Y}" r="21" fill="none" stroke="#B85C38" stroke-width="1.6" stroke-dasharray="3 3" opacity=".85"/>`;
    s+=`<g class="pin" data-i="${i}" tabindex="0"><circle class="hit" cx="${X}" cy="${Y}" r="24"/><circle class="anel" cx="${X}" cy="${Y}" r="18"/><circle cx="${X}" cy="${Y}" r="${p.anc?15:12}" fill="#B85C38" stroke="#EDE6DA" stroke-width="${p.anc?2.6:1.8}"/><text x="${X}" y="${Y+5}" text-anchor="middle" font-family="DM Mono,monospace" font-weight="500" font-size="15" fill="#EDE6DA">${p.k}</text></g>`;});
  s+=barra(P,200,48,P.h-20);
  if(sang){
    const v=vb2.split(' ').map(Number), W=Math.round(v[2]*0.30);
    const gx=v[0]+v[2]*0.035, gy=v[1]+v[3]-Math.round(W*1.02)-v[3]*0.035;
    s+=`<g transform="translate(${gx.toFixed(1)},${gy.toFixed(1)})">${locador(P,vb2,W)}</g>`;
  }
  return s+`</svg>`;
}
function ligaHover(root){
  const box=root.querySelector('#minfo'); if(!box)return;
  const base=box.innerHTML;
  let tmr;
  const pinta=html=>{box.classList.add('trocando');clearTimeout(tmr);
    tmr=setTimeout(()=>{box.innerHTML=html;box.classList.remove('trocando');},170);};
  const mostra=(n,p,d,f)=>{box.classList.remove('vazio');
    pinta((f?`<span class="mfoto"><img src="${f}" alt="${n}"></span>`:'')
      +`<span class="mtx"><span class="mn">${n}</span>${p?`<span class="mp">${p}</span>`:''}${d?`<span class="md">${d}</span>`:''}</span>`);};
  const limpa=()=>{box.classList.add('vazio');pinta(base);};
  const solta=()=>root.querySelectorAll('.pin.on,.raio.on,.lote.on').forEach(e=>e.classList.remove('on'));
  root.querySelectorAll('.lote').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');const i=+g.dataset.l,l=MAP.lotes[i];
      mostra(l.n,l.end,l.d, (typeof FOTO_LOTE!=='undefined'?FOTO_LOTE[i]:null)||null);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelectorAll('.pin').forEach(g=>{
    const on=()=>{solta();g.classList.add('on');
      const i=+g.dataset.i,p=MAP.pts[i],rr=root.querySelector(`.raio[data-i="${i}"]`);
      if(rr)rr.classList.add('on');
      let d='';
      if(p.cred){
        const brl=v=>'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0});
        d=`${p.quem}. Categoria ${p.cat}, ${p.pts} pontos, `
          +`${p.pct!=null?p.pct.toString().replace('.',',')+'% de subvenção — ':''}`
          +`${brl(p.vl)} concedidos no chamamento ${p.cham}.`;
      }else{
        d=p.viz.length?'Credenciados no raio de 200 m: '+p.viz.map(([m,n])=>`${n} a ${m} m`).join(' · ')+'.':'Nenhum credenciado dentro de 200 m.';
        if(p.fora.length)d+=` O mais próximo fora do raio é ${p.fora[0][1]}, a ${p.fora[0][0]} m.`;
      }
      mostra(p.n,p.toq?`${p.pt} pontos de proximidade`:'projeto credenciado',d);};
    g.addEventListener('mouseenter',on);g.addEventListener('focus',on);
    g.addEventListener('click',e=>{e.stopPropagation();on();});});
  root.querySelector('.mapa').addEventListener('mouseleave',()=>{solta();limpa();});
  box.classList.add('vazio');
}
function isometrico(cena,esc){
  /* sobre a oliva a tinta some: o desenho troca de cor, nao de forma */
  const TI = esc ? '#EDE6DA' : '#211D1A';
  const W=620,H=660,ux=0.866,uy=0.5;
  /* o viewBox sai do proprio desenho. Escrito a mao, ele decepava os dois
     ultimos predios da carteira toda vez que o espacamento mudava. */
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  const marca=(px,py)=>{if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;};
  const janelaIso=(padx,pady)=>{
    const x0=bx0-padx,y0=by0-pady,w=(bx1-bx0)+padx*2,h=(by1-by0)+pady*2;
    return `${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;};
  const S=1.16;const iso=(x,y,z)=>[300+(x-y)*ux*S,H-130-((x+y)*uy*.52*S)-z*S];
  const P=(a)=>a.map(p=>p.join(',')).join(' ');
  function caixa(cx,cy,w,d,pav,alt,rot,pal){
    /* pal: o prédio grande ficou fora dos cenários; entra só como escala */
    const o=pal?0.34:1, h=pav*alt,pts=[];
    const A=iso(cx,cy,0),Bp=iso(cx+w,cy,0),C=iso(cx+w,cy+d,0),D=iso(cx,cy+d,0);
    const A2=iso(cx,cy,h),B2=iso(cx+w,cy,h),C2=iso(cx+w,cy+d,h),D2=iso(cx,cy+d,h);
    /* o vertice mais proximo da camera e A (menor x+y). As duas faces visiveis
       sao as que encostam na aresta A-A2: a esquerda (A-D) e a direita (A-B).
       Antes desenhava-se B-C, que fica ESCONDIDA atras do solido, e a esquerda
       ficava vazada. Corrigido em 21/08/2026.                                */
    let g=`<polygon points="${P([A,D,D2,A2])}" fill="${TI}" fill-opacity="${(.17*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A,Bp,B2,A2])}" fill="${TI}" fill-opacity="${(.075*o).toFixed(3)}" stroke="${TI}" stroke-width="1" stroke-opacity="${(.5*o).toFixed(2)}"/>`;
    g+=`<polygon points="${P([A2,B2,C2,D2])}" fill="#B85C38" fill-opacity="${(.26*o).toFixed(3)}" stroke="#B85C38" stroke-width="1.2" stroke-opacity="${o}"/>`;
    /* aresta vertical da frente, marcada: e ela que le a altura */
    g+=`<line x1="${A[0]}" y1="${A[1]}" x2="${A2[0]}" y2="${A2[1]}" stroke="${TI}" stroke-width="1.1" stroke-opacity="${(.55*o).toFixed(2)}"/>`;
    for(let i=1;i<pav;i++){const l=iso(cx,cy+d,i*alt),m=iso(cx,cy,i*alt),o=iso(cx+w,cy,i*alt);
      g+=`<polyline points="${P([l,m,o])}" fill="none" stroke="${TI}" stroke-width=".5" stroke-opacity="${(.3*o).toFixed(2)}"/>`;}
    [A,Bp,C,D,A2,B2,C2,D2].forEach(q=>marca(q[0],q[1]));
    const top=iso(cx+w/2,cy+d/2,h);
    if(rot){ const lw=rot.length*4.6; marca(top[0]-lw,top[1]-46); marca(top[0]+lw,top[1]-30); }
    /* 34 px acima da cumeeira: com 16 o rotulo encostava no telhado */
    g+=`<text x="${top[0]}" y="${top[1]-34}" text-anchor="middle" font-family="DM Mono,monospace" font-style="italic" font-size="15" fill="${TI}" opacity="${pal?0.55:1}">${rot}</text>`;
    return g;
  }
  function arvore(x,y){const b=iso(x,y,0),t=iso(x,y,26);
    return `<line x1="${b[0]}" y1="${b[1]}" x2="${t[0]}" y2="${t[1]}" stroke="#6B6A4B" stroke-width="1.6"/><circle cx="${t[0]}" cy="${t[1]}" r="9" fill="#6B6A4B" fill-opacity=".45" stroke="#6B6A4B" stroke-width="1"/>`;}
  function carro(x,y){const a=iso(x,y,0),b=iso(x+16,y,0),c=iso(x+16,y+8,0),d=iso(x,y+8,0),
    a2=iso(x,y,9),b2=iso(x+16,y,9),c2=iso(x+16,y+8,9),d2=iso(x,y+8,9);
    return `<polygon points="${P([a,b,c,d])}" fill="${TI}" fill-opacity=".1"/><polygon points="${P([a2,b2,c2,d2])}" fill="${TI}" fill-opacity=".3" stroke="${TI}" stroke-width=".8"/><polygon points="${P([b,c,c2,b2])}" fill="${TI}" fill-opacity=".2" stroke="${TI}" stroke-width=".8"/>`;}
  let s=`<svg viewBox="55 66 545 596" role="img" aria-label="Escala comparativa de porte">`;
  /* a fileira da carteira e mais longa que a do porte: o chao e a rua
     acompanham, senao os dois ultimos predios ficam sem calcada */
  const XM = cena==='portfolio' ? 500 : 330;
  const g0=iso(-34,40,0),g1=iso(XM,40,0),g2=iso(XM,200,0),g3=iso(-34,200,0);
  s+=`<polygon points="${P([g0,g1,g2,g3])}" fill="${TI}" fill-opacity=".045"/>`;
  const r0=iso(-34,52,0),r1=iso(XM,52,0),r2=iso(XM,80,0),r3=iso(-34,80,0);
  s+=`<polygon points="${P([r0,r1,r2,r3])}" fill="${TI}" fill-opacity=".1"/>`;
  if(cena==='portfolio'){
    /* a carteira desenhada: 4 pequenos e 3 medios, na mesma escala do slide
       do porte. E o mesmo desenho, para o olho reconhecer o tamanho.     */
    /* tudo numa fileira só: com os pequenos atrás dos médios a conta não
       se lia. Agora é da esquerda para a direita, 4 + 3, mesma linha. */
    /* mais respiro entre os volumes: colados, a conta de 4 + 3 nao se lia */
    let x=0;
    for(let i=0;i<4;i++){ s+=caixa(x,96,38,34,5,10,i===1?'4 × pequeno':''); x+=62; }
    x+=34;
    for(let i=0;i<3;i++){ s+=caixa(x,96,52,42,12,10,i===1?'3 × médio':''); x+=78; }
    /* a arvore acompanha a fileira inteira, ate o ultimo predio */
    for(let v=-18;v<=x-30;v+=56) s+=arvore(v,66);
    const vb=janelaIso(26,22);
    const cy2=(by1+26);
    s+=`<text x="${((bx0+bx1)/2).toFixed(1)}" y="${(cy2+16).toFixed(1)}" text-anchor="middle" font-family="DM Mono,monospace" font-size="13" fill="${TI}" opacity=".5">15.600 m² construídos · mesma escala do slide do porte</text>`;
    marca(bx0,cy2+22);marca(bx1,cy2+22);
    return s.replace('viewBox="55 66 545 596"','viewBox="'+janelaIso(26,22)+'"')+`</svg>`;
  }
  s+=caixa(0,96,52,44,5,10,'pequeno · 5 pav');
  s+=caixa(112,96,62,50,12,10,'médio · 12 pav');
  s+=caixa(238,96,72,56,24,10,'grande · 24 pav','pal');
  [ -18, 46, 100, 160, 216, 288 ].forEach(x=>{s+=arvore(x,66);});
  s+=carro(56,60); s+=carro(196,60);
  s+=`<text x="${W/2}" y="${H-16}" text-anchor="middle" font-family="DM Mono,monospace" font-size="14" fill="${TI}" opacity=".55">escala comparativa · pé-direito de 3 m</text>`;
  return s+`</svg>`;
}

const palco=document.getElementById('palco');
/* as fotos moram em js_fotos.js como constantes; o DECK guarda o NOME delas.
   Assim o array de slides continua legivel e o base64 fica de fora.        */
const IMG={};
