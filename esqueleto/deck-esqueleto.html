function tpl(s){
  const k=s.kick?`<div class="kick${s.barra?' barra':''} rev">${s.kick}</div>`:'';
  const et=s.etapas?' passo etapa':'';
  const grande=(s.g==='frase'||s.g==='capa'||s.g==='jogadas');
  /* R$ é símbolo de moeda, não texto: sobrevive ao text-transform:lowercase
     dos títulos. Aplicado no render para não poluir o DECK com <span>. */
  const RS=x=>String(x).replace(/R\$/g,'<span class="ru">R$</span>');
  const t=s.t?`<h1 class="${grande?'mega':'big'} rev">${RS(s.t)}</h1>`:'';
  const sub=s.sub?`<p class="sub rev">${s.sub}</p>`:'';
  const prem=s.prem?`<p class="prem rev">${s.prem}</p>`:'';
  const pre=s.pre?`<p class="sub rev" style="margin-top:0;margin-bottom:clamp(10px,1.6vh,22px);max-width:44ch">${s.pre}</p>`:'';
  /* o texto de apoio do dado não fica na tela: o slide mostra número e
     rótulo, e a memória de cálculo abre no ponteiro. Menos coisa competindo
     pela atenção, e o argumento continua a um gesto de distância. */
  const dad=s.dados?`<div class="dados rev">`+s.dados.map(([v,l,n],j)=>
    `<div class="dado${n?' tem':''}"${n?` tabindex="0" data-dn="${j}"`:''}>`
    +`<span class="v">${RS(v)}</span><span class="l">${l}</span>`
    +(n?`<span class="n">${n}</span>`:'')+`</div>`).join('')+`</div>`:'';
  /* pilula da abertura: markup identico ao do capa-morph_R6, inclusive a
     seta como glifo &rarr;. Tentei SVG para nao depender de fonte de
     sistema e o desenho saiu diferente do padrao — o R6 manda.          */
  const inicio=s.comecar?'<button class="ms-start">começar <span class="seta">&rarr;</span></button>':'';
  if(s.g==='marca'){
    const u=s.pisca?'<i class="pisca">_</i>':'<i>_</i>';
    return `<div class="frase">`
      +(s.qr?`<div class="qr rev">${QR}</div>`:'')
      +`<div class="sigla-mini rev">${s.sigla}<i>_</i>${s.papel?`<em>${s.papel}</em>`:''}</div>`
      +(s.slogan?`<div class="slogan rev">${s.slogan}${u}</div>`:'')
      +(s.assinatura?`<div class="assina rev">${s.assinatura}${u}</div>`:'')
      +(s.site?`<div class="site rev">${s.site}</div>`:'')
      +inicio+`</div>`;
  }
  const met=s.metas?`<div class="metas rev">`+s.metas.map(([l,v])=>`<div><span class="ml">${l}</span><span class="mv">${v}</span></div>`).join('')+`</div>`:'';
  if(s.g==='capa') return `<div class="wrap">${k}${t}${sub}${met}${inicio}</div>`;
  if(s.g==='divisor') return `<div class="divisor"><span class="dn rev">${s.dn}</span><h1 class="dt rev">${RS(s.dt)}<i class="pisca">_</i></h1><p class="ds rev">${s.ds}</p></div>`;
  if(s.g==='frase') return `<div class="wrap">${k}${pre}${t}${sub}${prem}${dad}</div>`;
  if(s.g==='jogadas') return `<div class="wrap">${k}${t}<div class="jogadas rev">`+s.itens.map(([n,ti,d])=>`<div class="jogada${et}"><span class="jn">${n}</span><span class="jt">${ti}</span><span class="jd">${d}</span></div>`).join('')+`</div></div>`;
  if(s.g==='unit') return `<div class="wrap">${k}${t}${sub}<div class="unit rev">`+s.cards.map(([ti,a,r,l,m])=>`<div class="uc${et}"><span class="ut">${ti}</span><span class="ua">${a}</span><span class="ur">${RS(r)}</span><span class="ul">${l}</span><span class="um">${m}</span></div>`).join('')+`</div></div>`;
  if(s.g==='trio') return `<div class="wrap">${k}${t}${sub}<ol class="trio">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='lista'||s.g==='fim') return `<div class="wrap${s.largo?' largo':''}">${k}${pre}${t}${sub}<ol class="lista${s.largo?' largo':''}">`+s.itens.map(([q,x])=>`<li class="passo"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('')+`</ol></div>`;
  if(s.g==='cheia'){
    /* render em sangria total. Ver sistemas/gabaritos/render-cheia.md */
    const img = s.src
      ? `<img src="${s.src}" alt="${(s.cap||'').replace(/"/g,'&quot;')}">`
      : `<div class="slot"><u>_</u><b>${s.lbl||'render'}</b><s>16:9 · sangria total</s></div>`;
    return `<div class="full"><div class="ph">${img}</div></div>`
      + `<div class="ov">${s.h2?`<h2 class="rev">${s.h2}</h2>`:''}`
      + (s.cap?`<div class="cap rev">${s.cap}</div>`:'') + `</div>`;
  }
  if(s.g==='duo'){
    const RES=IMG;
    /* o slot so aparece se a imagem falhar — antes ele ficava por cima da foto */
    const f=s.figs.map(([tag,src,cap,cl])=>`<div class="dfig ${cl}"><img src="${RES[src]||src}" alt="${cap}" onerror="const p=this.parentNode;this.remove();p.classList.add('semimg')"><span class="tag">${tag}</span><div class="slot"><b>slot de imagem</b><span>${cap}</span></div><span class="dcap">${cap}</span></div>`).join('');
    return `<div class="wrap" style="max-width:none">${k}${t}${sub}<div class="dcols rev">${f}</div><p class="dleg rev">${s.leg}</p></div>`;
  }
  if(s.g==='fotos'){
    const li=s.itens.map(([q,x],i)=>`<li class="passo" data-f="${i}"><span class="q">${q}</span><span class="t">${x}</span></li>`).join('');
    const im=s.itens.map(([q,x,src,cap],i)=>src?`<img data-f="${i}" src="${IMG[src]||src}" alt="${cap}" onerror="this.dataset.err=1">`:'').join('');
    return `<div class="wrap">${k}${t}<ol class="lista">${li}</ol></div>
      <div class="fbleed">${im}<div class="slot"><b>slot de imagem</b><span class="scap"></span><span class="sfon"></span></div><span class="cred"></span></div>`;
  }
  /* ⚑ `prancha` vem ANTES do `const tab`. Os dois usam `cols`, e com
     significados incompatíveis: aqui é um NÚMERO de colunas, lá é um array
     de cabeçalhos. Deixar o `tab` correr primeiro derruba o deck inteiro
     com `s.cols.map is not a function`. É a armadilha do campo reservado,
     registrada em 23/08 e paga de novo em 29/08.
     Receita: sistemas/gabaritos/prancha-referencia.md */
  if(s.g==='prancha'){
    const foto=(src,cap,ar)=>`<div class="ph"${ar?` style="flex:0 0 auto;aspect-ratio:${ar}"`:''}>`
      + (src?`<img loading="lazy" src="${src}" alt="${(cap||'').replace(/"/g,'&quot;')}">`
            :`<div class="slot"><u>_</u><b>${cap||'imagem'}</b><s>16:9 ou 4:3</s></div>`)+`</div>`;
    const cels=(s.items||[]).map(it=>{
      if(it.pilha){
        return `<div class="cel pilha rev" style="aspect-ratio:${it.ar||'0.70'}">`
          + it.pilha.map(f=>foto(f.src,f.cap,null)).join('')
          + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
      }
      return `<div class="cel rev">`+foto(it.src,it.cap,it.ar||s.ar)
        + (it.cap?`<span class="pcap">${it.cap}</span>`:'')+`</div>`;
    }).join('');
    /* a proporção decide as colunas: retrato aceita 3 ou 4, deitada pede 2.
       Aviso no console em vez de regra escondida num .md.
       Ver sistemas/gabaritos/prancha-referencia.md */
    (function(){
      const ars=(s.items||[]).map(i=>parseFloat(i.ar||s.ar||0)).filter(n=>n>0);
      if(!ars.length) return;
      const med=ars.reduce((a,b)=>a+b,0)/ars.length, c=s.cols||3;
      if(med>1.2&&c>2) console.warn('prancha: imagem deitada (ar~'+med.toFixed(2)+') em '+c+' colunas. Deitada pede 2, ou 3 recortando em quadrado.');
      if(med<0.85&&c<3) console.warn('prancha: imagem em retrato (ar~'+med.toFixed(2)+') em '+c+' colunas. Retrato aceita 3 ou 4.');
    })();
    const topo=(s.top&&(s.top.h2||s.top.lead))
      ? `<div class="ptop rev"><h2>${s.top.h2||''}</h2>`
        + (s.top.lead?`<div class="plead">${s.top.lead}</div>`:'')+`</div>` : '';
    const centra=s.ar||(s.items||[]).some(i=>i.ar||i.pilha);
    return `<div class="pbody">${topo}<div class="grade" style="grid-template-columns:repeat(${s.cols||3},1fr)`
      + (centra?';align-content:center;align-items:center':'')+`">${cels}</div></div>`;
  }
  const tab=s.cols?`<div class="rev"><table class="tb"><thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`+
    s.linhas.map((r,i)=>`<tr class="${s.hi===i?'hi':''}${s.fora===i?' fora':''}">`+r.map((c,j)=>`<td class="${j>0&&r.length>2?'':(j===r.length-1?'d':'')}">${c}</td>`).join('')+`</tr>`).join('')+`</tbody></table></div>`:'';
  if(s.g==='porte'){
    const f2=s.fecho?`<p class="sub rev" style="max-width:44ch">${s.fecho}</p>`:'';
    const nota=(n)=>n?`<div class="notaN"><span class="nn">${RS(n[0])}</span><span class="nt">${n[1]}</span></div>`:'';
    /* troca:1 — dois estados no MESMO slide. O isometrico e o titulo nao
       re-animam; o clique so faz o bloco da direita atravessar. Como dois
       slides, tudo entrava de novo a cada passagem. */
    const miolo = s.troca
      ? `<div class="trbox rev"><div class="tr tr-a">${tab}${nota(s.nota)}</div>`
        + `<div class="tr tr-b passo">${nota(s.nota2)}${dad}</div></div>`
      : `${tab}${s.nota?`<div class="rev">${nota(s.nota)}</div>`:''}${dad}${f2}`;
    return `<div class="pcols${s.alto?' alto':''}${s.meia?' meia':''}">`
      + `<div class="iso${s.troca?'':' rev'}">${isometrico(s.iso,s.esc)}</div>`
      + `<div class="wrap">${k}${t}${sub}${miolo}</div></div>`;
  }
  if(s.g==='tabela'){
    const f=s.fecho?`<p class="sub rev" style="max-width:56ch">${s.fecho}</p>`:'';
    const nt=s.nota?`<div class="notaN rev"><span class="nn">${RS(s.nota[0])}</span><span class="nt">${s.nota[1]}</span></div>`:'';
    return `<div class="wrap">${k}${t}${sub}${tab}${f}${nt}${prem}</div>`;
  }
  if(s.g==='plug'){
    /* mapa-resumo da carteira: as sete âncoras do Epicentro em pílula, cada
       uma com as oportunidades que saem do seu entorno. A distribuição se
       redesenha sozinha porque ela é mesmo indefinida — o que se afirma é
       estar plugado nas sete, não um número por âncora.                   */
    const A=s.ancoras.map((n,i)=>`<div class="pg" data-a="${i}">`
      +`<span class="pgn">${n}</span>`
      +`<span class="pgo" data-o="${i}"></span></div>`).join('');
    return `<div class="wrap largo">${k}${t}${sub}<div class="pgrid rev">${A}</div>`
      +`<p class="pgr rev">${s.rodape||''}</p></div>`;
  }
  if(s.g==='duasfrentes'){
    /* pilula + subtitulo em duas linhas, e item numerado em mono terracota.
       23/08: a caixa terracota CRESCE para baixo a cada item revelado — o
       pacote se fecha na frente do cliente. O que nao entra fica FORA da
       caixa, na segunda linha da grade, para quebrar a leitura de propósito. */
    const col=(c)=>`<div class="fr">`
      + `<div class="frcab rev"><span class="frpil">${c[0]}</span>`
      + `<span class="frsub">${c[1]}</span></div>`
      + `<div class="frcx"><div class="frbg"></div><ul class="frl">`
      + c.slice(2).map(([ti,d],j)=>`<li class="passo"><span class="frn">${String(j+1).padStart(2,'0')}</span>`
        + `<span class="frtx"><span class="frti">${ti}</span><span class="frd">${d}</span></span></li>`).join('')
      + `</ul></div></div>`;
    /* os dois "fora" sao filhos diretos da grade: caem na linha de baixo,
       alinhados entre si, e so entram depois dos oito itens das duas colunas */
    const fora=(x)=>x?`<div class="frfora passo"><span class="ffl">não está incluso</span>`
      + `<span class="fft">${x}</span></div>`:'<div></div>';
    return `<div class="wrap largo">${k}${t}${sub}<div class="frcols rev">`
      + col(s.esq)+col(s.dir)+fora(s.esqfora)+fora(s.dirfora)+`</div></div>`;
  }

  /* ─── sumario: o argumento inteiro em seis blocos, um por secao ───────── */
  if(s.g==='sumario'){
    const it=s.itens.map(([n,ti,d])=>`<div class="sm passo"><span class="smn">${n}</span>`
      +`<span class="smt">${RS(ti)}</span><span class="smd">${RS(d)}</span></div>`).join('');
    return `<div class="wrap largo">${k}${t}${sub}<div class="smgrid rev">${it}</div>`
      +(s.fecho?`<p class="smf rev">${RS(s.fecho)}</p>`:'')+`</div>`;
  }

  /* ─── players: quem ja compra no mesmo perimetro, em faixas verticais ─── */
  if(s.g==='players'){
    const c=s.casas.map(([nome,esco,num,rot,linhas])=>`<div class="pl passo">`
      +`<span class="plpil">${nome}</span><span class="plesc">${esco}</span>`
      +`<span class="plv">${RS(num)}</span><span class="pll">${rot}</span>`
      +`<ul class="plu">`+linhas.map(x=>`<li>${RS(x)}</li>`).join('')+`</ul></div>`).join('');
    return `<div class="wrap largo">${k}${t}${sub}<div class="plcols rev">${c}</div>`
      +(s.fecho?`<p class="plf rev">${RS(s.fecho)}</p>`:'')+`</div>`;
  }

  /* ─── avulso: o preco de mercado de cada frente, dentro e fora do pacote ─ */
  if(s.g==='avulso'){
    const nota=s.nota?`<div class="notaN rev"><span class="nn">${RS(s.nota[0])}</span><span class="nt">${RS(s.nota[1])}</span></div>`:'';
    const gr=s.grupos.map(([tit,sb,rows],gi)=>`<div class="av av${gi}">`
      +`<div class="avcab rev"><span class="avpil">${tit}</span>`
      +(sb?`<span class="avsub">${sb}</span>`:'')+`</div>`
      +`<ul class="avl">`+rows.map(([a,b,cc])=>`<li class="passo"><span class="ava">${RS(a)}</span>`
        +`<span class="avb">${RS(b)}</span><span class="avc">${RS(cc)}</span></li>`).join('')
      +`</ul></div>`).join('');
    return `<div class="wrap largo">${k}${t}${sub}`
      +`<div class="avcols n${s.grupos.length} rev">${gr}</div>${nota}${prem}</div>`;
  }
  if(s.g==='mapa' && !(MAP.lotes||[]).length && !(MAP.pts||[]).length){
    /* andaime vazio: o gabarito existe, o dado do projeto não. Antes isto
       derrubava o deck inteiro. Agora vira slot, como qualquer imagem que
       falta. Receita: sistemas/gabaritos/mapa-lotes.md */
    return `<div class="vazio rev"><div class="vmarca">_</div>`
      + `<h2>${s.t||'mapa'}</h2>`
      + (s.sub?`<p class="vsub">${s.sub}</p>`:'')
      + `<p class="vnota">falta o objeto <code>MAP</code> deste projeto — `
      + `receita em sistemas/gabaritos/mapa-lotes.md</p></div>`;
  }
  if(s.g==='mapa'){
    const svg=s.which==='rua'?mapaRua(s.sang):mapaCluster(s.sang);
    const lg=s.leg?`<div class="leg rev">`+s.leg.map(([c,x])=>{
      const cl=c==='ln'?'ln':c==='lnv'?'ln lnv':c==='anc'?'anc':'';
      const st=(c==='ln'||c==='lnv'||c==='anc')?'':`background:${c}`;
      return `<span><i class="${cl}" style="${st}"></i>${x}</span>`;}).join('')+`</div>`:'';
    const ch=s.chave?`<ol class="chave rev">`+CHAVE.map(([n,p],i)=>`<li><span class="ci">${i+1}</span><span class="cn">${n}</span><span class="cp">${p}</span></li>`).join('')+`</ol>`:'';
    const inf=`<div id="minfo" class="vazio rev"><span class="mn">${s.hint||''}</span></div>`;
    /* sang:1 — o mapa toma a metade direita de fora a fora, sem moldura.
       O texto e a legenda ficam empilhados a esquerda. Decidido em 21/08. */
    const cl=s.sang?' sang':'';
    const sv=s.sang?svg.replace('<svg ','<svg preserveAspectRatio="xMidYMid slice" '):svg;
    return `<div class="mcols${cl}"><div class="mtxt">${k}${t}${sub}${ch}${inf}${lg}<p class="credito">base cartográfica © OpenStreetMap · CARTO — lotes: cadastro municipal / GeoSampa</p></div><div class="mapa${cl} rev">${sv}</div></div>`;
  }
  return '';
}
let secs=[];DECK.forEach((s,i)=>{if(s.sec)secs.push({nome:s.sec,i})});
let sa='';DECK.forEach(s=>{if(s.sec)sa=s.sec;s._sec=sa});
let num=0;DECK.forEach(s=>{if(s.div){s._b=null;return}if(!s.sub_)num++;s._b=num});
const TOT=num;
DECK.forEach(s=>{if(s._b===null){s._sub=0;return}const ir=DECK.filter(x=>x._b===s._b);s._sub=ir.length>1?ir.indexOf(s)+1:0});
const dots=document.querySelector('.dots');
secs.forEach((sc,i)=>{const d=document.createElement('span');d.className='sdot';d.innerHTML=`<span>${sc.nome}</span>`;d.onclick=e=>{e.stopPropagation();go(sc.i)};dots.appendChild(d)});
palco.innerHTML=DECK.map((s,i)=>`<section class="slide g-${s.g}${s.g==='fotos'?' temfoto':''}${s.sang?' temmapa':''}${s.cel?' cel':''}" data-i="${i}">${tpl(s)}</section>`).join('');
const sl=[...document.querySelectorAll('.slide')];
sl.forEach(el=>[...el.querySelectorAll('.rev')].forEach((r,j)=>r.style.setProperty('--i',Math.min(j,10))));
sl.forEach((el,i)=>{if(DECK[i].g==='mapa')ligaHover(el)});
/* ─── o viewBox do isométrico sai do desenho, não de conta à mão ─────────
   Toda vez que o espaçamento dos volumes mudava, o número escrito no código
   decepava os dois últimos prédios. getBBox() mede o que de fato foi
   desenhado — chão, rua, árvores, rótulos e legenda — e o quadro passa a
   acompanhar sozinho. */
sl.forEach(el=>{
  const sv=el.querySelector('.iso svg'); if(!sv)return;
  requestAnimationFrame(()=>{ try{
    const b=sv.getBBox(); if(!b.width||!b.height)return;
    const m=Math.max(b.width,b.height)*0.035;
    sv.setAttribute('viewBox',
      `${(b.x-m).toFixed(1)} ${(b.y-m).toFixed(1)} ${(b.width+m*2).toFixed(1)} ${(b.height+m*2).toFixed(1)}`);
  }catch(e){} });
});
/* ─── carteira que se redistribui ────────────────────────────────────────
   Sete oportunidades caindo em sete âncoras, sorteadas a cada ciclo. Só
   roda no slide ativo, e para com prefers-reduced-motion.               */
sl.forEach((el,i)=>{
  if(DECK[i].g!=='plug')return;
  const n=DECK[i].ancoras.length, alvos=[...el.querySelectorAll('.pgo')];
  const parado=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pinta=(d)=>alvos.forEach((o,j)=>{
    o.innerHTML=Array.from({length:d[j]},()=>'<i></i>').join('');
    o.parentNode.classList.toggle('vazia',d[j]===0);});
  const sorteia=()=>{const d=new Array(n).fill(0);
    for(let q=0;q<7;q++)d[Math.floor(Math.random()*n)]++;return d;};
  pinta(parado?new Array(n).fill(1):sorteia());
  if(parado)return;
  let t=null;
  const liga=()=>{clearInterval(t);t=setInterval(()=>{
    if(!el.classList.contains('ativo')){clearInterval(t);t=null;return;}
    pinta(sorteia());},2600);};
  const obs=new MutationObserver(()=>{if(el.classList.contains('ativo')&&!t)liga();});
  obs.observe(el,{attributes:true,attributeFilter:['class']});
  if(el.classList.contains('ativo'))liga();
});
/* ─── popover de justificativa ────────────────────────────────────────────
   Um numero que sustenta um argumento precisa poder ser aberto na frente do
   cliente sem virar mais um paragrafo no slide. `<mark class="pop"
   data-pop="chave">` abre o par [titulo, corpo] declarado em `pops`.      */
sl.forEach((el,i)=>{
  const ps=DECK[i].pops||{};
  /* cada dado com texto de apoio vira uma entrada de popover, gerada do
     próprio markup — assim o DECK não precisa declarar `pops` para isso */
  el.querySelectorAll('.dado.tem').forEach(d=>{
    const k='d'+d.dataset.dn;
    ps[k]=[d.querySelector('.l').textContent, d.querySelector('.n').innerHTML];
    d.classList.add('pop'); d.dataset.pop=k;
  });
  if(!Object.keys(ps).length)return;
  const cx=document.createElement('div'); cx.className='popbox';
  el.appendChild(cx);
  let t=null;
  const abre=(g)=>{const d=ps[g.dataset.pop]; if(!d)return;
    clearTimeout(t);
    /* só o texto: o título já está na tela, no próprio elemento que abriu.
       Repeti-lo dentro da caixa era eco. */
    cx.innerHTML=`<span class="popd">${d[1]}</span>`;
    /* ⚠ 25/08 · o quadro é escalado por transform, então getBoundingClientRect
       devolve pixel de TELA e style.left/top são pixel de LAYOUT. Sem dividir
       por k a caixa saía do lugar em toda tela que não fosse 1600x900 — e
       quanto mais longe da medida de projeto, mais longe ela ia. */
    const K=(+getComputedStyle(document.documentElement).getPropertyValue('--k'))||1;
    const r=g.getBoundingClientRect(), e=el.getBoundingClientRect();
    /* a caixa alinha pela ESQUERDA do elemento e nasce logo abaixo da linha
       dele, para o olho ler os dois como uma coisa só */
    cx.style.minWidth=Math.min(r.width/K,420)+'px';
    cx.style.left='0px'; cx.style.top='0px';
    const w=cx.offsetWidth, ew=e.width/K;
    cx.style.left=Math.max(8,Math.min((r.left-e.left)/K, ew-w-8))+'px';
    /* sem espaço embaixo, a caixa vira para cima do elemento em vez de
       sangrar para fora da tela */
    const h=cx.offsetHeight, folga=(innerHeight-r.bottom)/K-24;
    cx.style.top = (h>folga ? ((r.top-e.top)/K-h-12) : ((r.bottom-e.top)/K+12))+'px';
    cx.classList.add('on'); g.classList.add('aberto');};
  const fecha=(g)=>{t=setTimeout(()=>cx.classList.remove('on'),160);
    if(g)g.classList.remove('aberto');};
  el.querySelectorAll('.pop').forEach(g=>{
    g.addEventListener('mouseenter',()=>abre(g));
    g.addEventListener('focus',()=>abre(g));
    g.addEventListener('mouseleave',()=>fecha(g));
    g.addEventListener('blur',()=>fecha(g));
    g.addEventListener('click',e=>{e.stopPropagation();abre(g);});
    g.tabIndex=0;
  });
  cx.addEventListener('mouseenter',()=>clearTimeout(t));
  cx.addEventListener('mouseleave',()=>fecha(null));
});
let cur=-1;
const passos=i=>[...sl[i].querySelectorAll('.passo')];
function foto(i){
  const s=DECK[i];if(s.g!=='fotos')return;
  const el=sl[i],ps=passos(i),on=ps.filter(p=>p.classList.contains('on'));
  const k=on.length?+on[on.length-1].dataset.f:-1;
  let ok=false;
  el.querySelectorAll('.fbleed img').forEach(im=>{const v=+im.dataset.f===k&&!im.dataset.err;im.classList.toggle('on',v);if(v)ok=true});
  const it=k>=0?s.itens[k]:null;
  el.querySelector('.scap').textContent=it?it[3]:'';
  el.querySelector('.sfon').textContent=it?`fonte — ${it[4]}`:'';
  el.querySelector('.slot').style.opacity=ok?0:1;
  const c=el.querySelector('.cred');c.textContent=it?it[3]:'';c.classList.toggle('on',ok);
}
/* ─── a caixa terracota do `duasfrentes` ──────────────────────────────────
   A altura sai do LAYOUT (offsetTop), nao do getBoundingClientRect: o item
   entra com translateY, e medir a caixa pelo retangulo pintado faria a
   borda pular junto com a animacao do texto. */
function caixa(i){
  if(DECK[i].g!=='duasfrentes')return;
  sl[i].querySelectorAll('.frcx').forEach(cx=>{
    const bg=cx.querySelector('.frbg'); if(!bg)return;
    const on=[...cx.querySelectorAll('li.passo.on')];
    if(!on.length){bg.style.height='0px';bg.classList.remove('on');return}
    const l=on[on.length-1], pad=parseFloat(getComputedStyle(cx).paddingBottom)||0;
    bg.classList.add('on');
    bg.style.height=(l.offsetTop+l.offsetHeight+pad)+'px';
  });
}
/* ─── dica de rolagem ────────────────────────────────────────────────────
   Em tela grande nenhuma prancha rola. No celular algumas rolam de
   propósito — e o usuário precisa VER que rola, senão lê meia prancha e
   passa adiante. `rola` só entra quando de fato transborda. */
function rola(i){
  const el=sl[i];
  requestAnimationFrame(()=>el.classList.toggle('rola',el.scrollHeight-el.clientHeight>4));
}
addEventListener('resize',()=>{if(cur>=0)rola(cur)});
function go(i,tudo){
  i=Math.max(0,Math.min(DECK.length-1,i));if(i===cur)return;
  const ant=cur;cur=i;
  sl.forEach((el,j)=>el.classList.toggle('ativo',j===i));
  if(ant>=0)sl[ant].classList.remove('revelado');
  void sl[i].offsetWidth;sl[i].classList.add('revelado');
  passos(i).forEach(p=>p.classList.toggle('on',!!tudo));
  foto(i);caixa(i);rola(i);
  const s=DECK[i];
  document.body.classList.toggle('esc',!!s.esc);
  document.body.classList.toggle('terra',!!s.terra);
  /* ─── fundo morph nos divisores ───────────────────────────────────────
     O canvas e as texturas ja estao na GPU desde a abertura: ligar o fundo
     num divisor nao carrega imagem nem ocupa VRAM. O custo e so o rAF
     enquanto o slide esta visivel, e a engine auto-pausa fora dele.
     `?semdivisor` na URL desliga, para comparar o ritmo lado a lado.    */
  /* ⚑ O `!!` NÃO É ENFEITE. `classList.toggle(nome, undefined)` IGNORA o
     segundo argumento e ALTERNA — então num deck em que nenhum divisor traz
     `fundo`, esta linha devolvia `undefined`, a classe `fundo-div` ligava
     sozinha, o véu Cal a 60% entrava por cima e o campo do divisor saía
     lavado. Achado na peça EMEI Presidente Dutra, 02/09/2026: passou dois
     meses invisível porque todo deck anterior trazia `fundo:1` no divisor. */
  const divFundo = !!(s.g==='divisor' && s.fundo && !location.search.includes('semdivisor'));
  /* "divisor só trama": slide verde de conteúdo roda o MESMO carrossel da
     marca, mas sob véu quase opaco. O que sobra é o pontilhado em movimento,
     sem imagem legível — que é o efeito pedido, e sem um terceiro contexto
     WebGL só para isso. */
  const trama = !!s.trama && !location.search.includes('semtrama');
  const marcaFundo = !!((!!s.fundo && s.g!=='divisor') || trama);   /* idem */
  document.body.classList.toggle('com-fundo',marcaFundo||divFundo);
  document.body.classList.toggle('em-cheia', s.g==='cheia');
  document.body.classList.toggle('fundo-div',divFundo);
  document.body.classList.toggle('fundo-trama',trama);
  /* cada canvas tem o seu conjunto de imagens e a sua paleta, fixados no
     montar(). A troca entre os dois e por opacidade, nao por cor(). */
  if(window.MSF ){ MSF .pausar(!marcaFundo); if(marcaFundo) MSF .entrada(); }
  if(window.MSFD){ MSFD.pausar(!divFundo);   if(divFundo)   MSFD.entrada(); }
  document.body.classList.toggle('na-capa',!!s.capa);
  document.body.classList.toggle('na-marca',s.g==='marca'&&!s.fim_);
  /* no fechamento o chrome fica: as bolinhas para voltar a qualquer secao e
     as setas, para o caso de um clique a mais passar do fim. */
  document.body.classList.toggle('no-fim',!!s.fim_);
  document.querySelector('.sl').textContent=s._sec||'';
  const si=secs.findIndex(x=>x.nome===s._sec);
  document.querySelector('.sn').textContent=si>=0?String(si+1).padStart(2,'0'):'';
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===si));
  conta();location.hash=i+1;
}
function conta(){
  const s=DECK[cur],ps=passos(cur),on=ps.filter(p=>p.classList.contains('on')).length;
  let txt=s._b===null?`— / ${TOT}`:(s._sub?`${s._b}.${s._sub}`:s._b)+` / ${TOT}`;
  if(ps.length)txt+=` · ${on}/${ps.length}`;
  document.querySelector('.cont').textContent=txt;
}
function avanca(){const ps=passos(cur),p=ps.find(x=>!x.classList.contains('on'));
  if(p){p.classList.add('on');foto(cur);caixa(cur);rola(cur);conta();return}go(cur+1)}
const recua=()=>go(cur>0?cur-1:0,true);
document.getElementById('pro').onclick=e=>{e.stopPropagation();avanca()};
document.getElementById('ant').onclick=e=>{e.stopPropagation();recua()};
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();avanca()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();recua()}
  else if(e.key==='ArrowDown'){e.preventDefault();go(cur+1,true)}
  else if(e.key==='ArrowUp'){e.preventDefault();go(cur-1,true)}});
palco.addEventListener('click',e=>{if(e.target.closest('.ms-start')){go(cur+1);return}if(e.target.closest('a,button,.pin,.lote'))return;avanca()});
let tx=0;
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>52){d<0?avanca():recua()}},{passive:true});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));


/* ─── cortina diagonal: intercepta a primeira saída da abertura, venha de onde
   vier (pílula, seta do chrome, teclado ou toque). ─── */
(function(){
  const cortina=document.getElementById('mscortina');let correndo=false;
  const _go=window.go||go;
  function varre(depois){
    correndo=true;cortina.classList.remove('sai');void cortina.offsetWidth;
    cortina.classList.add('on');
    setTimeout(depois,580);
    setTimeout(()=>{cortina.classList.remove('on');cortina.classList.add('sai')},660);
    setTimeout(()=>{cortina.classList.remove('sai');cortina.style.visibility='hidden';
      void cortina.offsetWidth;cortina.style.visibility='';correndo=false},1340);
  }
  window.go=function(i,tudo){
    const j=Math.max(0,Math.min(DECK.length-1,i));
    /* a diagonal marca duas coisas: a saida da abertura e a entrada de cada
       divisor de secao. Em nenhum outro lugar. */
    const vale = !correndo && j>cur && (cur===0 || DECK[j].g==='divisor');
    if(vale && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      varre(()=>_go(j,tudo));return;
    }
    _go(i,tudo);
  };
})();

/* ─── dois fundos morph, um por papel ──────────────────────────────────────
   O canvas da marca roda o portfólio do Michel; o do divisor roda as imagens
   do deck. Duas instâncias em vez de uma porque o `montar()` fixa o conjunto
   de texturas na carga — não há como trocar a lista depois.
   Custo real: um segundo contexto WebGL2 e ~8 MB de VRAM. Nenhuma das duas
   desenha fora do seu slide: o go() pausa a que não está em cena.
   `?semfundo` desliga as duas. `?semdivisor` desliga só a do divisor.      */
if(!location.search.includes('semfundo')){
  const sobe=(id,imgs,opt)=>{
    try{ return MSFundo.montar(document.getElementById(id), imgs,
      Object.assign({scale:0.85, prep:false, sortear:true}, opt)); }
    catch(e){ console.warn('fundo morph indisponivel em #'+id,e); return null; }
  };
  const subir=()=>{
    /* marca: oliva, com o terracota de acento — a paleta da casa */
    window.MSF  = sobe('msfundo',   CAPA_IMGS, {paper:'#6B6A4B', acc:'#B85C38'});
    /* divisor: terracota chapada, acento na tinta */
    window.MSFD = sobe('msfundo-d', DIV_IMGS,  {paper:'#B85C38', acc:'#211D1A'});
    const b=document.body.classList;
    if(window.MSF ){ MSF .pausar(!b.contains('com-fundo')||b.contains('fundo-div'));
                     if(b.contains('com-fundo')&&!b.contains('fundo-div')) MSF.entrada(); }
    if(window.MSFD){ MSFD.pausar(!b.contains('fundo-div'));
                     if(b.contains('fundo-div')) MSFD.entrada(); }
  };
  ('requestIdleCallback' in window) ? requestIdleCallback(subir,{timeout:1200}) : setTimeout(subir,300);
}

</script>
<!-- retorno ao acervo + camada de toque. Comportamento em modulos/ms-voltar.js.

     não sabia dele. Toda peça do acervo carrega esta linha. -->
<script>
/* ─── ociosidade do ponteiro ───────────────────────────────────────────
   1,8 s parado e o body ganha `ocioso`. Qualquer gesto tira. Genérico de
   propósito: quem decide ONDE o efeito acontece é a classe `em-cheia`.
   ─────────────────────────────────────────────────────────────────── */
(function(){
  var t=null, ATRASO=1800;
  window.__msAcorda=function(){
    document.body.classList.remove('ocioso');
    clearTimeout(t);
    t=setTimeout(function(){ document.body.classList.add('ocioso'); }, ATRASO);
  };
  ['pointermove','pointerdown','wheel','keydown','touchstart'].forEach(function(ev){
    addEventListener(ev, window.__msAcorda, {passive:true});
  });
  window.__msAcorda();
})();
</script>
