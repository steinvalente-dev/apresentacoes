:root{
  /* ── tokens por PAPEL, não por nome de cor. Ver MARCA-AMAZ / bloco de tema ── */
  --papel:#F4F1EA;      /* superfície clara            */
  --tinta:#06392F;      /* Tiber · texto e fundo marca */
  --escura:#04251F;     /* Mata funda · superfície     */
  --acento:#B95118;     /* Cobre                       */
  --apoio:#D9C9A3;      /* Areia · acento sobre escuro */
  --material:#BFA783;   /* Pinho · cor da MLC          */
  --soft:#06392F99; --hair:#06392F26;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
  --gut:clamp(22px,4.2vw,86px); --top:clamp(46px,5.4vh,74px); --bot:clamp(46px,5.4vh,74px);
  --fs-mega:clamp(30px,5.6vw,88px); --fs-big:clamp(24px,3.9vw,62px); --fs-h:clamp(19px,2.3vw,36px);
  --fs-item:clamp(14px,1.32vw,21px); --fs-body:clamp(13px,1.05vw,17px);
  --fs-cap:clamp(9.5px,.74vw,12.5px); --fs-num:clamp(25px,3.15vw,54px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;transition:background .38s ease,color .38s ease}

/* ── as duas superfícies escuras. Sobre escuro o acento é AREIA, nunca Cobre:
      Cobre sobre Tiber é 2,6:1 e sobre Mata funda ~3,1:1 — não lê como texto. ── */
body.esc{background:var(--tinta);color:var(--papel)}
body.funda{background:var(--escura);color:var(--papel)}
body.esc, body.funda{--soft:#F4F1EAb8; --hair:#F4F1EA2e}

#palco{position:fixed;inset:0;z-index:1}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(var(--top) + clamp(14px,2.4vh,40px)) var(--gut) calc(var(--bot) + clamp(14px,2.4vh,40px));
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .15s,transform .15s}
.slide.ativo{opacity:1;pointer-events:auto;transform:none;transition:opacity .44s ease,transform .44s ease}
.rev{opacity:0;transform:translateY(14px)}
.revelado .rev{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*42ms)}
.passo{opacity:0;transform:translateY(14px);transition:opacity .34s,transform .34s}
.passo.on{opacity:1;transform:none}

/* ── display é Bricolage 800, tracking negativo. Nada de itálico caixa-baixa:
      aquilo era a voz do michel stein_, não é herdado. ── */
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.035em;line-height:1.02}
u{text-decoration:none;color:var(--acento)}
body.esc u,body.funda u{color:var(--apoio)}

.wrap{max-width:min(100%,1180px)}
.kick{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);letter-spacing:.18em;
  text-transform:uppercase;color:var(--soft);margin-bottom:clamp(14px,2vh,28px);
  display:flex;align-items:center;gap:11px}
.kick::before{content:"";width:26px;height:2px;background:var(--acento);flex:none}
body.esc .kick::before,body.funda .kick::before{background:var(--apoio)}
.mega{font-size:var(--fs-mega);max-width:16ch}
.big{font-size:var(--fs-big);max-width:22ch}
.sub{font-size:var(--fs-body);line-height:1.62;max-width:52ch;color:var(--soft);margin-top:clamp(11px,1.8vh,28px)}
.prem{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);letter-spacing:.06em;line-height:1.7;
  color:var(--acento);border-left:2px solid var(--acento);padding-left:13px;
  margin-top:clamp(14px,2vh,26px);max-width:62ch}
body.esc .prem,body.funda .prem{color:var(--apoio);border-color:var(--apoio)}
.pend{font-family:var(--sans);font-size:var(--fs-cap);letter-spacing:.06em;color:var(--acento);
  border-left:2px dashed var(--acento);padding-left:12px;margin-top:clamp(12px,1.8vh,22px);
  line-height:1.6;max-width:64ch}
body.esc .pend,body.funda .pend{color:var(--apoio);border-color:var(--apoio)}

/* dados */
.dados{display:grid;gap:clamp(14px,2vw,34px);margin-top:clamp(18px,3vh,52px);
  grid-template-columns:repeat(auto-fit,minmax(clamp(150px,15vw,230px),1fr))}
.dado{border-top:1px solid var(--hair);padding-top:clamp(10px,1.4vh,18px)}
.dado .v{font-family:var(--disp);font-weight:800;font-size:var(--fs-num);letter-spacing:-.045em;line-height:1;display:block}
.dado .l{font-size:var(--fs-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:10px;display:block;line-height:1.5}
.dado .n{font-size:var(--fs-body);color:var(--soft);margin-top:8px;line-height:1.5;display:block}

/* lista numerada */
ol.lista{list-style:none;margin-top:clamp(20px,3vh,42px);display:grid;gap:clamp(10px,1.5vh,20px)}
ol.lista.largo{max-width:none}
ol.lista li{display:grid;grid-template-columns:clamp(46px,4.6vw,78px) 1fr;gap:clamp(10px,1.4vw,22px);
  align-items:baseline;border-top:1px solid var(--hair);padding-top:clamp(9px,1.2vh,15px)}
ol.lista .q{font-family:var(--sans);font-weight:600;font-size:var(--fs-cap);letter-spacing:.14em;
  text-transform:uppercase;color:var(--acento)}
body.esc ol.lista .q,body.funda ol.lista .q{color:var(--apoio)}
ol.lista .t{font-size:var(--fs-item);line-height:1.5}
ol.lista .t b{font-weight:600}

/* tabela */
table.tb{width:100%;border-collapse:collapse;margin-top:clamp(20px,3vh,42px);font-size:var(--fs-item)}
table.tb th{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);letter-spacing:.16em;
  text-transform:uppercase;color:var(--soft);text-align:left;padding:0 0 12px;border-bottom:1px solid currentColor}
table.tb td{padding:clamp(11px,1.5vh,19px) 0;border-bottom:1px solid var(--hair);vertical-align:baseline;line-height:1.45}
table.tb td+td,table.tb th+th{padding-left:clamp(14px,2vw,40px)}
table.tb td.d{font-family:var(--disp);font-weight:800;font-size:clamp(15px,1.5vw,25px);letter-spacing:-.03em}
table.tb tr.hi td{color:var(--acento)}
body.esc table.tb tr.hi td,body.funda table.tb tr.hi td{color:var(--apoio)}
table.tb mark{background:none;color:inherit;font-weight:600}

/* ── chrome ── */
.chrome{position:fixed;left:0;right:0;pointer-events:none;z-index:9;font-family:var(--sans);
  font-weight:500;font-size:var(--fs-cap);letter-spacing:.16em;text-transform:lowercase;color:var(--soft);
  padding:0 var(--gut);display:flex;align-items:center;justify-content:space-between;height:var(--top)}
.chrome.topo{top:0}
.chrome.pe{top:auto;bottom:0;height:var(--bot)}
.secao{position:relative;padding-left:26px;white-space:nowrap}
.secao .sn{position:absolute;left:0;top:50%;transform:translateY(-50%);opacity:.55}
.dots{display:flex;gap:9px;pointer-events:auto}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.28;cursor:pointer;position:relative;transition:opacity .25s}
.sdot.on{opacity:1}
.sdot span{position:absolute;bottom:150%;left:50%;transform:translateX(-50%);opacity:0;white-space:nowrap;
  letter-spacing:.1em;transition:opacity .2s;pointer-events:none}
.sdot:hover span{opacity:.9}
/* a marca no chrome: wordmark vetorial, herda a cor por currentColor */
.marca{display:flex;align-items:center;gap:7px}
.marca svg{height:clamp(8px,.62vw,11px);width:auto;display:block;flex:none}
.marca i{width:2px;height:clamp(8px,.62vw,11px);background:var(--acento);display:block;flex:none}
body.esc .marca i,body.funda .marca i{background:var(--apoio)}
/* ── navegação · pastilha de leitura garantida ──────────────────────────
   Regra de sistema, decidida em 23/08/2026. O contador e as setas param de
   herdar a cor do slide e passam a viver numa pastilha própria: fundo Papel
   a 94%, glifo em tinta, filete de tinta a 22% e sombra baixa.

   Por que clara e não escura. Medi as duas contra cinco fundos — Papel,
   Tiber, Mata funda, foto clara e foto escura:

     pastilha escura → contraste do glifo entre 6,2:1 e 14,9:1
     pastilha clara  → contraste do glifo entre 9,7:1 e 11,4:1

   A clara tem o piso mais alto e a menor variação. A fraqueza dela é sumir
   como forma sobre fundo claro (1,0:1 sobre Papel) — e isso o filete escuro
   resolve. A escura tem a fraqueza simétrica sobre fundo escuro, e ali um
   filete claro não salvaria a foto escura, onde ela some junto com a borda.

   `backdrop-filter` é reforço, não requisito: sem suporte, os 94% de opacidade
   já entregam o contraste. ── */
.nav{display:flex;align-items:center;gap:clamp(8px,.9vw,14px);pointer-events:auto;
  background:rgba(244,241,234,.94);
  -webkit-backdrop-filter:blur(7px) saturate(1.1);backdrop-filter:blur(7px) saturate(1.1);
  border:1px solid rgba(6,57,47,.22);border-radius:999px;
  padding:clamp(4px,.42vw,6px) clamp(7px,.7vw,11px) clamp(4px,.42vw,6px) clamp(11px,1.05vw,17px);
  box-shadow:0 1px 5px rgba(4,37,31,.16);
  color:var(--tinta)}
.cont{font-variant-numeric:tabular-nums;letter-spacing:.1em;color:var(--tinta);opacity:.72}
.seta{width:clamp(23px,2vw,30px);height:clamp(23px,2vw,30px);
  border:1px solid rgba(6,57,47,.34);border-radius:50%;
  display:grid;place-items:center;cursor:pointer;opacity:.9;
  transition:opacity .2s,transform .1s,background .2s;
  background:none;color:var(--tinta);font-size:11px}
.seta:hover{opacity:1;background:rgba(6,57,47,.08)}
.seta:active{transform:scale(.94)}
body.na-marca .chrome{opacity:0;pointer-events:none}
body.na-capa .chrome.pe .pj{opacity:0}

/* ── gabarito marca — abertura e contracapa ──
   Bloco único à esquerda, quatro linhas no mesmo eixo. A estrutura é herdada
   do sistema; o conteúdo e a cor são da AMAZ. */
/* ── gabarito `marca` ──
   O lockup vai para o canto superior esquerdo, na mesma calha do chrome, e
   sai do fluxo. Quem carrega a prancha é a frase, não a marca. O tamanho é
   quase fixo: a faixa é estreita de propósito, só para não ficar grande
   demais em monitor pequeno.

   VERSÃO REDUZIDA — abaixo de ~200px de largura o descritor cairia para
   menos de 5px de corpo (0,0242·W) e viraria mancha. Nesse tamanho o lockup
   reduz ao wordmark, como já acontece no chrome. Isto responde na prática a
   uma das pendências abertas do bloco de tema: o tamanho mínimo do lockup
   completo é ~200px de largura. */
.slide.g-marca .lockup{position:absolute;left:var(--gut);top:var(--top);
  --W:clamp(102px,8vw,132px)}
.slide.g-marca .lockup .desc{display:none}
.frase{display:flex;flex-direction:column;align-items:flex-start;
  gap:clamp(9px,1.35vh,20px);padding-left:var(--gut)}
/* ── lockup ──
   Proporções do bloco de tema §3, todas em função da largura do wordmark W.
   O `font-size` do lockup É o corpo do descritor (0,0242·W); daí tudo em em.
   O descritor fica ABAIXO do wordmark, alinhado pela esquerda dele. */
.lockup{--W:clamp(150px,26vw,400px);width:var(--W);font-size:calc(var(--W)*.0242)}
.lockup .wm{width:100%;height:auto;display:block}
.lockup .desc{display:flex;align-items:stretch;margin-top:calc(var(--W)*.0274)}
.lockup .bar{width:.28em;background:var(--acento);flex:none}
.lockup .dtx{font-family:var(--sans);font-weight:400;font-size:1em;
  line-height:1.22;letter-spacing:.005em;margin-left:.70em;color:var(--apoio)}
.slogan{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.6vw,112px);
  letter-spacing:-.042em;line-height:1.02;white-space:nowrap;margin-top:clamp(6px,1vh,16px)}
.assina{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5.6vw,112px);
  letter-spacing:-.042em;line-height:1.02}
.site{font-family:var(--sans);font-weight:400;font-size:clamp(10px,.78vw,15px);
  letter-spacing:.14em;color:var(--soft)}
.ms-start{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);letter-spacing:.16em;
  text-transform:uppercase;background:var(--acento);color:var(--papel);border:0;border-radius:999px;
  padding:clamp(7px,.85vh,11px) clamp(14px,1.35vw,22px);cursor:pointer;
  display:inline-flex;align-items:center;gap:.6em;margin-top:clamp(10px,1.8vh,26px);
  transition:transform .2s,gap .2s}
.ms-start:hover{transform:translateY(-1px);gap:.95em}
.ms-start svg{width:15px;height:9px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){.slogan,.assina{white-space:normal;max-width:14ch}}

/* ── capa do projeto ── */
.metas{display:flex;flex-wrap:wrap;gap:clamp(20px,3.4vw,64px);margin-top:clamp(24px,4vh,58px)}
.metas .ml{font-size:var(--fs-cap);letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block}
.metas .mv{font-family:var(--sans);font-weight:500;font-size:var(--fs-item);margin-top:7px;display:block}
.regua{width:180px;max-width:40vw;height:3px;background:var(--acento);margin-top:clamp(22px,3.4vh,48px)}
body.esc .regua{background:var(--apoio)}

/* ── divisor de ato ── */
.divisor{justify-content:center}
.divisor .dn{font-family:var(--disp);font-weight:800;font-size:clamp(54px,13vw,190px);
  line-height:.82;letter-spacing:-.06em;opacity:.20;display:block}
.divisor .dt{font-family:var(--disp);font-weight:800;font-size:clamp(30px,6.6vw,104px);
  letter-spacing:-.045em;line-height:1;margin-top:clamp(-30px,-3.4vw,-14px)}
.divisor .ds{font-size:var(--fs-item);color:var(--soft);margin-top:clamp(16px,2.4vh,32px);max-width:44ch;line-height:1.6}

/* ── donut do ACV ── */
.dncols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:clamp(20px,3.4vw,64px);align-items:center;width:100%}
.dnwrap{min-width:0}
.dnwrap svg{width:100%;height:auto;max-height:calc(100vh - var(--top) - var(--bot) - clamp(40px,7vh,120px));display:block}
.dnleg{display:flex;flex-wrap:wrap;gap:clamp(12px,1.8vw,28px);margin-top:clamp(12px,1.8vh,24px);
  font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.dnleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
@media(max-width:960px){.dncols{grid-template-columns:1fr;gap:20px}}

/* ── camadas: a axonométrica esquemática do módulo ── */
.cmcols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);
  gap:clamp(20px,3.4vw,64px);align-items:center;width:100%}
.cmwrap svg{width:100%;height:auto;max-height:56vh;display:block}
.cmwrap svg .cmlayer{transition:opacity .4s ease,transform .4s ease}
@media(max-width:960px){.cmcols{grid-template-columns:1fr}}

/* ── casos: os três benchmarks ── */
.casos{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.6vw,52px);margin-top:clamp(22px,3.4vh,54px)}
.caso{border-top:1.5px solid currentColor;padding-top:clamp(12px,1.7vh,20px)}
.caso .cn{font-family:var(--disp);font-weight:800;font-size:var(--fs-h);letter-spacing:-.035em;line-height:1.1;display:block}
.caso .cl{font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:7px;display:block}
.caso .cv{font-family:var(--disp);font-weight:800;font-size:clamp(20px,2.6vw,42px);letter-spacing:-.045em;
  line-height:1;color:var(--acento);margin-top:clamp(12px,1.8vh,22px);display:block}
body.esc .caso .cv,body.funda .caso .cv{color:var(--apoio)}
.caso .cd{font-size:var(--fs-body);color:var(--soft);margin-top:9px;line-height:1.55;display:block}
@media(max-width:860px){.casos{grid-template-columns:1fr}}

/* ── duas leituras ── */
.duas{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr);
  gap:0 clamp(14px,2.2vw,44px);margin-top:clamp(20px,3vh,44px);font-size:var(--fs-body)}
.duas .hd{font-size:var(--fs-cap);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
  padding-bottom:12px;border-bottom:1px solid currentColor}
.duas .cel{padding:clamp(10px,1.4vh,17px) 0;border-bottom:1px solid var(--hair);line-height:1.5}
.duas .fato{font-family:var(--sans);font-weight:600}
.duas .inv{color:var(--acento)}
body.esc .duas .inv,body.funda .duas .inv{color:var(--apoio)}
@media(max-width:860px){.duas{grid-template-columns:1fr;gap:0}.duas .hd{display:none}
  .duas .cel{border-bottom:0;padding:2px 0}.duas .fato{border-top:1px solid var(--hair);padding-top:12px;margin-top:10px}}

@media(max-height:780px){:root{--fs-mega:clamp(26px,4.4vw,62px);--fs-big:clamp(22px,3.3vw,48px);
  --fs-num:clamp(21px,2.6vw,40px);--top:clamp(40px,5vh,58px);--bot:clamp(40px,5vh,58px)}}
@media(max-width:960px){.secao{display:none}.mega{max-width:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── correções da varredura de 23/08 ─────────────────────────────────────
   Cinco transbordos medidos em 1366×768, 1280×720 e 430×932. Todos em
   gabaritos densos: `camadas`, `tabela` e `casos`. Composição corrigida,
   nunca resolvida com scroll. ── */

/* camadas: era o pior caso (131px no retrato). A isometria passa a ceder
   altura antes do texto, e no estreito ela empilha acima da lista. */
.cmwrap svg{max-height:min(50vh,400px)}
.g-camadas ol.lista{margin-top:clamp(14px,2vh,28px);gap:clamp(8px,1.1vh,15px)}
.g-camadas ol.lista li{padding-top:clamp(7px,1vh,12px)}
.g-camadas .sub{max-width:46ch;margin-top:clamp(9px,1.3vh,18px)}
@media(max-height:820px){
  .cmwrap svg{max-height:min(42vh,330px)}
  .g-camadas .mega,.g-camadas .big{font-size:clamp(22px,3vw,42px)}
}
@media(max-width:960px){
  .cmcols{grid-template-columns:1fr;gap:14px}
  .cmwrap svg{max-height:32vh}
  .g-camadas .sub{display:none}   /* no retrato a lista já diz o mesmo */
}

/* tabela densa: 4px em 1280×720. Sai da entrelinha, não da fonte. */
@media(max-height:820px){
  table.tb{margin-top:clamp(14px,2vh,28px)}
  table.tb td{padding:clamp(8px,1.05vh,14px) 0}
  .g-tabela .sub{margin-top:clamp(8px,1.2vh,18px)}
}

/* casos: 12px no retrato. As três colunas já empilham; falta apertar o vão. */
@media(max-width:860px){
  .casos{gap:clamp(12px,2vh,22px);margin-top:clamp(14px,2vh,28px)}
  .caso{padding-top:clamp(9px,1.2vh,14px)}
  .caso .cv{margin-top:clamp(8px,1.2vh,14px)}
}

/* o bloco de pendência é nota de trabalho: encolhe antes do conteúdo */
@media(max-height:820px){.pend{margin-top:clamp(9px,1.3vh,16px);line-height:1.5}}

/* camadas · segunda passada. Medido em 1280×720: a coluna de texto ocupa
   627px contra 606px disponíveis — quem estoura é o texto, não a isometria.
   O `.sub` diz o mesmo que a lista logo abaixo, então ele é o que cede. */
@media(max-height:820px){
  .g-camadas .sub{display:none}
  .g-camadas .pend{font-size:clamp(9px,.7vw,11.5px)}
}
@media(max-width:960px){.cmwrap svg{max-height:26vh}}

/* ═══════════════════════════════════════════════════════════════════════
   MÓDULO · revelação por clique — o fio varre da esquerda, o texto desce
   Comportamento PADRÃO de todo item `passo` do deck. Não é opcional e não
   precisa de classe extra.

   A regra que faz funcionar: o item reserva a altura do fio com uma borda
   TRANSPARENTE, e quem desenha a linha visível é o ::before, que nasce em
   scaleX(0). Sem isso aparecem duas linhas — uma parada no lugar onde a
   outra vai chegar. Foi exatamente o bug de 23/08: `.dado.etapa` repunha a
   borda em currentColor depois da regra que a apagava, com a mesma
   especificidade, e vencia por vir depois.

   Toda família de item que ganhar `passo` precisa entrar na lista abaixo.
   ═══════════════════════════════════════════════════════════════════════ */
ol.lista li.passo,
ol.credenciais li.passo,
.dado.passo{border-top:1.5px solid transparent}

.passo{opacity:1;transform:none;position:relative}
.passo::before{content:"";position:absolute;left:0;right:0;top:-1.5px;height:1.5px;
  background:currentColor;opacity:.42;transform:scaleX(0);transform-origin:left center;
  transition:transform .42s cubic-bezier(.52,0,.18,1)}
.passo.on::before{transform:scaleX(1)}
/* nos itens de dado e credencial o fio é elemento de composição, não filete
   de lista: entra cheio. */
.dado.passo::before,
ol.credenciais li.passo::before{opacity:1}

.passo>*{opacity:0;transform:translateY(-11px);
  transition:opacity .28s ease,transform .28s cubic-bezier(.3,.8,.3,1)}
.passo.on>*{opacity:1;transform:none}
.passo.on>*:nth-child(1){transition-delay:.30s}
.passo.on>*:nth-child(2){transition-delay:.36s}
.passo.on>*:nth-child(3){transition-delay:.42s}
.passo.on>*:nth-child(4){transition-delay:.48s}
.passo.on>*:nth-child(5){transition-delay:.54s}
@media(prefers-reduced-motion:reduce){
  .passo::before{transform:scaleX(1)}
  .passo>*{opacity:1;transform:none;transition:none}
}

/* ═══ gabarito `dado` — um número por prancha, sobre imagem sangrada ═══
   A imagem ocupa a prancha inteira; o véu garante o contraste do texto.
   Sem imagem, o slot fica visível: é lembrete de produção, não erro. */
.slide.g-dado{padding-left:0;padding-right:0}
.bleed{position:absolute;inset:0;overflow:hidden;background:var(--escura);z-index:0}
.bleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 /* véu vertical, e não diagonal: com o número centralizado, um véu que
    escurece só de um lado deixa metade do texto sem contraste. */
.bleed::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#04251FD8 0%,#04251FB0 38%,#04251FB0 62%,#04251FE8 100%)}
.bleed .slot{position:absolute;right:clamp(18px,2.6vw,42px);
  bottom:calc(var(--bot) + clamp(8px,1.4vh,18px));
  z-index:2;text-align:right;max-width:44ch;font-family:var(--sans);font-size:var(--fs-cap);
  letter-spacing:.14em;line-height:1.7;color:#F4F1EA55}
.bleed .slot b{display:block;color:var(--acento);font-weight:600;text-transform:uppercase}
.slide.g-dado{align-items:center;text-align:center}
.dadowrap{position:relative;z-index:1;padding:0 var(--gut);
  max-width:min(100%,1180px);margin-inline:auto}
.dadowrap .num{font-family:var(--disp);font-weight:800;
  font-size:clamp(72px,15.5vw,290px);line-height:.84;letter-spacing:-.055em;
  color:var(--papel);display:block}
.dadowrap .rot{font-family:var(--sans);font-weight:500;font-size:clamp(15px,1.9vw,32px);
  line-height:1.24;color:var(--apoio);margin-top:clamp(12px,2vh,30px);
  max-width:24ch;margin-inline:auto;display:block}
.dadowrap .nota{font-size:var(--fs-body);line-height:1.6;color:#F4F1EAb0;
  margin-top:clamp(12px,2vh,26px);max-width:56ch;margin-inline:auto;display:block}
.dadowrap .fonte{font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;
  color:#F4F1EA70;margin-top:clamp(14px,2.2vh,28px);display:block}

/* ═══ gabarito `logo` — a entrada da marca ═══ */
.slide.g-logo{align-items:flex-start}
.logowrap{display:flex;flex-direction:column;align-items:flex-start;
  gap:clamp(14px,2.4vh,34px);padding-left:clamp(16px,4vw,108px)}
.logowrap .ante{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.22em;text-transform:uppercase;color:var(--apoio);
  display:flex;align-items:center;gap:13px}
.logowrap .ante::before{content:"";width:44px;height:2px;background:var(--acento)}
.logowrap .lockup{--W:clamp(230px,44vw,700px)}
.logowrap .dep{font-family:var(--sans);font-size:var(--fs-item);line-height:1.6;

/* ═══ gabarito `socio` — a qualificação de cada sócio ═══ */
.sccols{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1fr);
  gap:clamp(20px,3.4vw,64px);align-items:center;width:100%}
.scfoto{position:relative;aspect-ratio:4/5;background:#06392F0f;
  border:1px solid var(--hair);overflow:hidden;max-height:64vh}
body.esc .scfoto,body.funda .scfoto{background:#F4F1EA10}

.scfoto .slot{position:absolute;inset:0;display:flex;flex-direction:column;

  line-height:1.7;color:var(--soft)}
.scfoto .slot b{color:var(--acento);font-weight:600;text-transform:uppercase;letter-spacing:.16em}
body.esc .scfoto .slot b,body.funda .scfoto .slot b{color:var(--apoio)}
.scnome{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.5vw,58px);

.scpapel{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.2em;text-transform:uppercase;color:var(--acento);margin-top:11px;display:block}
body.esc .scpapel,body.funda .scpapel{color:var(--apoio)}
.scbio{font-size:var(--fs-body);line-height:1.6;color:var(--soft);
  margin-top:clamp(12px,1.8vh,24px);max-width:48ch}
ol.credenciais{list-style:none;margin-top:clamp(16px,2.6vh,36px);display:grid;gap:clamp(9px,1.4vh,18px)}
ol.credenciais li{display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,1.6vw,26px);

ol.credenciais .cq{font-family:var(--disp);font-weight:800;font-size:clamp(19px,2.2vw,36px);

body.esc ol.credenciais .cq,body.funda ol.credenciais .cq{color:var(--apoio)}

@media(max-width:960px){.sccols{grid-template-columns:1fr;gap:18px}

/* prancha "o metro quadrado" no retrato: pre + título + sub + premissa + nota
   é muito bloco de texto para 430px. O `pre` cede — ele repete o kicker. */
@media(max-width:620px){

}

@media(max-width:620px){

}

/* prancha da Europa no retrato: quatro itens longos + premissa + nota.
   A grade de dois eixos vira um eixo, e o rótulo do país sobe para cima
   do texto em vez de disputar largura com ele. */
@media(max-width:620px){
  ol.lista li{grid-template-columns:1fr;gap:5px}
  ol.lista .q{font-size:clamp(9px,2.4vw,11px)}

/* últimos dois no retrato: a Europa (texto longo demais) e o `camadas`

@media(max-width:620px){

/* ═══════════════════════════════════════════════════════════════════════
   TELA LARGA E BAIXA — a armadilha que faltava
   1600×900 é a referência do sistema (1vw = 16px) e era o pior caso do
   arquivo: a tipografia cresce por vw e a altura não acompanha. Seis
   pranchas transbordavam só aqui. A faixa pega qualquer viewport com
   proporção de 3:2 para cima e menos de 960px de altura.
   ═══════════════════════════════════════════════════════════════════════ */
@media(max-height:960px) and (min-aspect-ratio:3/2){
  :root{--fs-mega:clamp(30px,4.3vw,74px);--fs-big:clamp(24px,3.2vw,52px);
        --fs-num:clamp(22px,2.65vw,44px)}
  .dados{margin-top:clamp(14px,2.2vh,34px);gap:clamp(12px,1.8vw,28px)}
  .dado{padding-top:clamp(8px,1.2vh,15px)}
  .prem,.pend{margin-top:clamp(10px,1.5vh,18px);line-height:1.55}
  .sub{margin-top:clamp(9px,1.4vh,20px)}
  ol.lista{margin-top:clamp(14px,2.2vh,30px);gap:clamp(8px,1.2vh,16px)}
  ol.lista li{padding-top:clamp(7px,1vh,12px)}
  table.tb{margin-top:clamp(14px,2vh,28px)}
  table.tb td{padding:clamp(8px,1.1vh,14px) 0}
  .cmwrap svg{max-height:min(44vh,340px)}
  .casos{margin-top:clamp(16px,2.4vh,38px)}
  .duas{margin-top:clamp(14px,2.2vh,32px)}
  .duas .cel{padding:clamp(8px,1.1vh,14px) 0}
  /* a prancha da Europa tem quatro itens longos: o corpo dela cede um ponto */
  ol.lista .t{font-size:clamp(13px,1.16vw,18px);line-height:1.45}
}

/* ═══════════════════════════════════════════════════════════════════════
   MÓDULO · grifo — a faixa que destaca a palavra
   Portado da Lavrō (v26), com a cor da AMAZ. Não é negrito: é marca de
   caneta por trás do texto, desenhada da esquerda para a direita.

   Usa `background-size` animado em vez de pseudo-elemento absoluto — assim
   a faixa acompanha a quebra de linha via `box-decoration-break: clone`, em
   vez de cobrir só o primeiro pedaço. Roda uma vez, com a revelação.
   ═══════════════════════════════════════════════════════════════════════ */
.grifo{
  background-image:linear-gradient(var(--grifo-cor,rgba(6,57,47,.15)),
                                   var(--grifo-cor,rgba(6,57,47,.15)));
  background-repeat:no-repeat;background-position:0 .14em;
  background-size:0% calc(100% - .22em);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .12em;margin:0 -.12em;border-radius:2px}
.revelado .grifo{animation:amz-grifo 620ms cubic-bezier(.22,.61,.36,1) forwards;
  animation-delay:var(--gd,760ms)}
@keyframes amz-grifo{to{background-size:100% calc(100% - .22em)}}
body.esc .grifo,body.funda .grifo{--grifo-cor:rgba(217,201,163,.24)}
/* no acento o grifo é Cobre, e aí ele grita — reservado para uma palavra só */
.grifo.forte{--grifo-cor:rgba(185,81,24,.34)}
body.esc .grifo.forte,body.funda .grifo.forte{--grifo-cor:rgba(185,81,24,.52)}
@media(prefers-reduced-motion:reduce){
  .grifo{background-size:100% calc(100% - .22em)!important;animation:none!important}}

/* ═══ lista com rótulo em palavra, e não em número ═══
   `rotulo:1` no slide. A coluna estreita de número não cabe uma palavra como
   "durabilidade": ela colidia com o texto. Aqui o rótulo sobe para linha
   própria, maior, e o texto corre embaixo em largura cheia. */
ol.lista.rot li{grid-template-columns:1fr;gap:clamp(6px,.9vh,11px)}
ol.lista.rot .q{font-family:var(--disp);font-weight:800;
  font-size:clamp(17px,1.85vw,30px);letter-spacing:-.035em;line-height:1;
  text-transform:none;color:var(--tinta)}
body.esc ol.lista.rot .q,body.funda ol.lista.rot .q{color:var(--papel)}
ol.lista.rot .t{font-size:var(--fs-body);line-height:1.55;max-width:92ch}
ol.lista.rot{gap:clamp(12px,1.9vh,26px)}

/* ═══ sócio · foto sangrando pela borda ═══
   O slot deixa de ser cartão e passa a encostar em cima, embaixo e na
   lateral. `dir:'dir'` no slide inverte o lado — as três pranchas alternam. */
/* a prancha do sócio perde TODO o padding: a foto encosta em cima, embaixo e
   na lateral. Quem recompõe a margem é só a coluna de texto. */
/* `display:block` no slide, e não flex: com flex + justify-content:center, um
   filho de altura 100% resolve contra a caixa errada e o slide transborda em
   todos os tamanhos. Foi o que aconteceu na primeira tentativa. */
.slide.g-socio{padding:0;display:block}
.sccols{grid-template-columns:minmax(0,.52fr) minmax(0,1fr);gap:0;
  align-items:stretch;height:100%}
.sccols.dir{grid-template-columns:minmax(0,1fr) minmax(0,.52fr)}
.sccols.dir .scfoto{order:2}
/* ATENÇÃO · elemento de sangria nunca usa o translateY da revelação.
   A foto tem a altura exata da prancha; deslocada 14px para baixo, ela
   transborda 14px enquanto a transição roda — invisível numa captura
   tardia, visível no olho e pega pela varredura em 70ms. Aqui a revelação
   é só de opacidade. Vale para qualquer elemento que encoste na borda. */
.scfoto{aspect-ratio:auto;max-height:none;height:100%;border:0;
  border-right:1px solid var(--hair)}
.scfoto.rev,.revelado .scfoto.rev{transform:none}
.sccols.dir .scfoto{border-right:0;border-left:1px solid var(--hair)}
.sccols .wrap{align-self:center;
  padding:calc(var(--top) + clamp(14px,2.4vh,40px)) var(--gut)
          calc(var(--bot) + clamp(14px,2.4vh,40px))}
@media(max-width:960px){
  .slide.g-socio{padding-left:0;padding-right:0}
  .sccols,.sccols.dir{grid-template-columns:1fr}
  .sccols.dir .scfoto{order:0}
  .scfoto{aspect-ratio:16/9;max-height:30vh;border:0;border-bottom:1px solid var(--hair)}
  .sccols{min-height:0}
  .sccols .wrap{padding:clamp(14px,3vw,26px) var(--gut) calc(var(--bot) + 14px)}
}

/* ═══ gabarito `pergunta` — a sanfona ═══
   Prancha única, ancorada no centro da tela: uma frase em display e três
   caminhos. Os três botões têm o MESMO peso gráfico — todos em Cobre — e o
   que diferencia o que está ativo é a etiqueta "em breve", não a cor. */
.slide.g-pergunta{align-items:center;justify-content:center;text-align:center}
.pergwrap{max-width:min(100%,1000px);display:flex;flex-direction:column;
  align-items:center;gap:clamp(20px,3.4vh,52px)}
.pergwrap .pq{font-family:var(--disp);font-weight:800;
  font-size:clamp(26px,4.6vw,76px);letter-spacing:-.04em;line-height:1.04;
  max-width:17ch}
.pergwrap .pd{font-size:var(--fs-body);line-height:1.6;color:var(--soft);
  max-width:48ch;margin-top:clamp(-12px,-1.4vh,-6px)}
.tempo{display:flex;flex-wrap:wrap;justify-content:center;
  gap:clamp(10px,1.1vw,18px)}
.tbtn{font-family:var(--sans);font-weight:500;font-size:var(--fs-cap);
  letter-spacing:.16em;text-transform:uppercase;border-radius:999px;
  padding:clamp(11px,1.35vh,17px) clamp(19px,1.9vw,32px);
  border:1px solid var(--acento);background:var(--acento);color:var(--papel);
  display:inline-flex;align-items:center;gap:.7em;cursor:pointer;
  transition:transform .2s,gap .2s,box-shadow .2s}
.tbtn:hover{transform:translateY(-1px);gap:1.05em;
  box-shadow:0 3px 14px rgba(185,81,24,.34)}
/* inativo: mesmo peso, mesma cor. Quem avisa é a etiqueta. */
.tbtn.off{cursor:not-allowed}
.tbtn.off:hover{transform:none;gap:.7em;box-shadow:none}
.tbtn .tag{font-size:.82em;letter-spacing:.08em;text-transform:lowercase;
  font-weight:400;padding:.24em .62em .2em;border-radius:999px;
  background:rgba(244,241,234,.22);color:var(--papel)}
.tbtn svg{width:15px;height:9px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){.tempo{flex-direction:column;width:100%}
  .tbtn{justify-content:center;width:100%}}

/* ── ajuste fino de 23/08, terceira rodada ──
   O título de quatro linhas com grifo (a prancha do metro quadrado) é o bloco
   mais alto do deck. Em 1920 ele não é limitado por vw nenhum, então precisa
   de teto próprio. E a lista `rot`, com rótulo em display, também cresceu. */
.g-frase .mega{max-width:19ch}
@media(min-width:1700px){:root{--fs-mega:clamp(30px,4.1vw,80px)}}
@media(max-height:1120px){
  .g-frase .mega{line-height:1.0}
  ol.lista.rot{gap:clamp(10px,1.5vh,20px)}
  ol.lista.rot li{padding-top:clamp(7px,1vh,12px)}
  ol.lista.rot .q{font-size:clamp(16px,1.6vw,25px)}
}
@media(max-width:620px){
  ol.lista.rot .q{font-size:clamp(15px,4vw,20px)}
  ol.lista.rot{gap:clamp(9px,1.4vh,16px)}
}

/* prancha da Europa: quatro itens de regulação + fecho. É a mais textual do
   deck, e o fecho é longo de propósito — é ele que faz a ponte para a madeira.
   Cede o corpo dos itens, não o fecho. */
.g-lista ol.lista+.sub{margin-top:clamp(12px,1.8vh,26px)}
@media(min-width:1700px){ol.lista .t{font-size:clamp(13px,.95vw,17px)}}
@media(max-width:620px){
  ol.lista+.sub{font-size:clamp(12px,3.1vw,15px);line-height:1.5}
  ol.lista .t{font-size:clamp(11.5px,2.95vw,14px);line-height:1.42}
  /* no retrato a nota de pendência de uma prancha já longa vira nota de pé:
     ela é lembrete de produção, não conteúdo de apresentação. */
  .g-lista .pend{font-size:clamp(8.5px,2.2vw,10.5px);line-height:1.45;
    margin-top:clamp(8px,1.2vh,14px)}
}

/* ── donut · mouse over e a linha por unidade ── */
.fatia{cursor:default;outline:none}
.fatia path{transition:opacity .22s ease,transform .22s ease;transform-origin:center;transform-box:fill-box}
.dnwrap:hover .fatia path{opacity:.42}

.dnunid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,24px);

.dnunid .un{border-top:1px solid var(--hair);padding-top:clamp(8px,1.1vh,13px)}
.dnunid .um{font-size:var(--fs-cap);letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);display:block}
.dnunid .uv{font-family:var(--disp);font-weight:800;font-size:clamp(15px,1.55vw,26px);
  letter-spacing:-.04em;line-height:1.1;margin-top:7px;display:block}
.dnunid .un2{font-size:var(--fs-cap);color:var(--soft);margin-top:5px;display:block;line-height:1.45}

/* ── mitos · ícone ao lado do rótulo ── */
ol.lista.rot .q{display:flex;align-items:center;gap:.5em}
ol.lista.rot .q svg{width:1.05em;height:1.05em;flex:none;stroke:var(--acento);
  fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
body.esc ol.lista.rot .q svg,body.funda ol.lista.rot .q svg{stroke:var(--apoio)}

/* ── logo com vídeo de fundo ── */
.slide.g-logo .bleed{z-index:0}
.slide.g-logo .logowrap{position:relative;z-index:1}
.slide.g-logo .bleed::after{background:linear-gradient(96deg,#04251FF2 0%,#04251FD8 46%,#04251F8C 100%)}
/* a marca entra construída: cada letra sobe, e a barra do descritor varre */

.logowrap .lockup .wm{clip-path:inset(0 100% 0 0);transition:clip-path 1.05s cubic-bezier(.22,.61,.36,1) .18s}
.revelado .logowrap .lockup .wm{clip-path:inset(0 0 0 0)}
@media(prefers-reduced-motion:reduce){.logowrap .lockup .wm{clip-path:none;transition:none}}

/* mitos: o ícone somou altura à linha do rótulo. E o `casos` do Brasil tem
   descrições mais longas que o internacional. */
@media(max-height:960px){
  ol.lista.rot li{padding-top:clamp(6px,.9vh,11px)}
  ol.lista.rot{gap:clamp(9px,1.3vh,17px)}

  .g-lista .sub{max-width:64ch}
}
@media(max-width:860px){
  .caso .cd{font-size:clamp(11.5px,2.9vw,13.5px);line-height:1.45}
  .caso .cn{font-size:clamp(16px,4.2vw,22px)}

  .g-casos .prem,.g-casos .pend{font-size:clamp(8.5px,2.2vw,10.5px);line-height:1.45}
}
/* prancha de referências no retrato: três casos com descrição longa + premissa
   + nota é o bloco mais alto do deck. A nota é lembrete de produção e some. */
@media(max-width:620px){

  .caso{padding-top:clamp(7px,1vh,11px)}
  .caso .cv{font-size:clamp(17px,4.6vw,26px);margin-top:clamp(6px,1vh,11px)}
  .caso .cd{font-size:clamp(11px,2.75vw,13px)}

}

/* aviso de orientação */
#giro{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:32px;
  background:#04251FEE;color:var(--papel);text-align:center;font-family:var(--sans)}

#giro b{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.03em;display:block;margin-bottom:10px}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   AMAZ · apresentação institucional — protótipo
   Estrutura consolidada da sessão pós-visita à ITA + extração do WoodDay 2025.

   Oito atos. Trocar conteúdo = mexer só aqui. A engine abaixo não se toca.
   Marcações VERIFICAR / CONFIRMAR / PREENCHER renderizam em acento com barra
   tracejada: é o que ainda exige confirmação oficial e não pode ser afirmado.
   ═══════════════════════════════════════════════════════════════════════════ */

const DECK=[

/* ─── ABERTURA ────────────────────────────────────────────────────────── */

{g:'marca',capa:1,div:1,esc:1,comecar:1,pisca:1,
 lockup:1, slogan:'casas que respiram',
 site:'www.amaz.com.br'},

{g:'capa',capa:1,esc:1,
 kick:'incorporadora de vilas em madeira',
 t:'um novo olhar<br>no mercado<br>imobiliário',
 sub:'O mercado imobiliário vende metro quadrado. Nós vendemos uma casa viva. Esta apresentação é sobre o sistema construtivo que sustenta essa diferença — e sobre por que ele é, ao mesmo tempo, o melhor argumento de venda e o melhor argumento financeiro que temos.',
 metas:[['assunto','Apresentação institucional'],['etapa','Documento de trabalho'],['data','agosto de 2026']],
 tempo:'Antes de começar — quanto tempo você tem?',

/* ─── ATO 01 · O MERCADO HOJE ─────────────────────────────────────────── */

{g:'divisor',div:1,funda:1,sec:'o mercado hoje',dn:'01',dt:'o mercado hoje',
 ds:'Antes de falar da AMAZ: o que o setor da construção virou, em cinco números. Um problema crônico e estrutural que o mercado inteiro passou a tratar como normal.'},

{g:'dado',funda:1,
 num:'25%',
 rot:'do material que entra num canteiro nunca vira edificação',
 nota:'Um quarto de tudo o que foi comprado, transportado e descarregado sai de novo pelo portão, dentro de uma caçamba. Isso é considerado normal. Está dentro do orçamento, tem uma linha própria na planilha, e ninguém questiona.',
 fonte:'VERIFICAR fonte primária',
 slot:'caçamba de entulho na calçada · resíduo espalhado após chuva'},

{g:'dado',funda:1,
 num:'−22%',
 rot:'de mão de obra a menos na construção brasileira em dez anos',
 nota:'Estimativa da CBIC. Não é oscilação de ciclo — é evasão. O setor que mais depende de gente é o que menos consegue segurá-la, e a construção convencional precisa de muita gente pouco qualificada exatamente onde ela está desaparecendo. Quem depende desse modelo está apostando contra uma curva que não dá sinal de virar.',
 fonte:'CBIC · VERIFICAR ano-base e metodologia',
 slot:'canteiro convencional com equipe reduzida · ou obra parada'},

{g:'dado',funda:1,
 num:'11×',
 rot:'a curva de juros brasileira inverteu de tendência em vinte anos',
 nota:'Não é ruído de mercado: é a condição de operação. Cada mês a mais de canteiro é um mês a mais de exposição a um cenário que ninguém controla. Num país assim, prazo de obra não é assunto de engenharia. É assunto financeiro.',
 fonte:'VERIFICAR fonte primária',
 slot:'imagem abstrata · gráfico, curva, ou obra parada'},

{g:'dado',funda:1,
 num:'40%',
 rot:'das emissões globais de CO₂ vêm do setor de construção',
 nota:'Onze por cento vêm dos materiais, e oito por cento apenas da estrutura — aço e concreto. Some tudo o que veio antes: o material que vira entulho, a gente que falta, o dinheiro exposto ao tempo. Tudo isso desemboca aqui. A decisão estrutural de um projeto é, sozinha, uma das maiores decisões ambientais que um incorporador toma — e é tomada uma vez só, sem correção possível depois.',
 fonte:'VERIFICAR fonte primária · provavelmente UNEP Global Status Report',
 slot:'canteiro de obra convencional · vista aérea ou fachada de torre em concreto'},

{g:'frase',esc:1,kick:'o produto',
 pre:'Planta, metragem, valor de revenda.',
 t:'o imóvel é concebido<br>como <span class="grifo forte">aplicação financeira</span><br>antes de ser pensado<br>como <span class="grifo">um lugar pra viver</span>',
 sub:'Não somos contra o número — ele importa, e é o que torna um empreendimento viável. Mas quando ele é a única coisa na mesa, vence o método mais rápido e mais conhecido, que é também o que mais agride. O resultado é um produto nivelado por baixo: seco, frio, igual ao do vizinho. <span class="grifo">E esse modo de pensar gera custos que não aparecem em nenhuma planilha de lançamento.</span>',
 prem:'Eles são só empurrados para frente — e aparecem depois, na manutenção do morador, na assistência técnica do incorporador e no ciclo inteiro do empreendimento.'},

{g:'frase',kick:'o morador',
 pre:'Nunca se esteve tão conectado. Nem tão cansado disso.',
 t:'o desejo mudou<br>de lugar',
 sub:'Numa era de hiperconectividade e inteligência artificial, o que as pessoas passaram a procurar é o oposto do que a cidade oferece: contato com a <u>natureza</u>, silêncio, materialidade, um <u>ritmo</u> de vida mais leve. Quase ninguém pede isso em voz alta — mas é o que se procura quando se procura casa.',
 dados:[
  ['o que falta','<u>natureza e ritmo</u>','Não é discurso de sustentabilidade. É demanda concreta por casa com jardim, luz, silêncio e escala humana — dentro da cidade, não a duas horas dela.'],
  ['o que se oferece','<u>a mesma torre</u>','Concreto, planta espelhada, varanda gourmet, área de lazer padronizada. A diferenciação acontece no acabamento, nunca na matéria.'],
  ['a oportunidade','<u>o meio-termo</u>','Construção artesanal no toque e industrializada no método. Entre a torre e o sítio existe um espaço inteiro que ninguém no residencial brasileiro está ocupando de maneira profissional.']],
 etapas:1},

/* ─── ATO 02 · A VIRADA ───────────────────────────────────────────────── */

{g:'divisor',div:1,funda:1,sec:'a virada',dn:'02',dt:'a virada',
 ds:'Duas coisas que já estão em curso no mundo e ainda não chegaram ao residencial brasileiro. A terceira é consequência das duas.'},

{g:'frase',kick:'01 · construção industrializada',
 pre:'O canteiro de obra é o pior lugar do mundo para fabricar qualquer coisa.',
 t:'a fabricação sai<br>do canteiro e volta<br>para a fábrica',
 sub:'Sem controle de umidade, temperatura, luz, ferramenta ou repetição, e com a equipe mudando a cada etapa. Industrializar não é sobre robô: é sobre mover a fabricação para onde ela pode ser medida. O canteiro deixa de fabricar e passa a montar.',
 dados:[
  ['fábrica','onde a precisão é absoluta','Umidade, temperatura, ferramenta e repetição sob controle. A peça sai pronta para montar — sem imprevisto, sem improviso e sem desperdício. O que precisa ser ajustado é ajustado ali, antes de sair.'],
  ['projeto','onde se decide','A decisão migra para a etapa mais barata do processo. Mudar uma linha no projeto custa horas; mudar a mesma coisa na obra custa semanas.'],
  ['montagem','onde a previsibilidade é inteira','O que chega ao terreno já está resolvido, numerado e conferido. <span class="grifo">A obra não é lugar de decidir nem de mudar: é lugar de executar.</span>']],
 etapas:1},

{g:'lista',largo:1,kick:'03 · a europa já legislou',
 t:'lá o carbono do<br>material virou lei',
 sub:'O que aqui ainda é argumento de venda, na Europa já é condição de licença. E a direção é uma só.',
 itens:[
  ['dinamarca','Primeiro país do mundo a impor <b>limite obrigatório de carbono incorporado</b>. Desde 2023, edificações novas acima de 1.000 m² não podem passar de 12 kg CO₂e/m² por ano. Em 2025 o limite caiu para cerca de 7,1 kg e o escopo passou a incluir transporte e canteiro. <b>Projeto que não cumpre não recebe licença.</b>'],
  ['frança','A RE2020 vale para residencial desde 2022 e usa análise de ciclo de vida dinâmica. O teto de carbono da fase de construção desce em calendário fixo, de cerca de 640 kg CO₂e/m² rumo a 415 kg no início da próxima década.'],
  ['países baixos','Foi o primeiro país a exigir análise de ciclo de vida em edificação nova, em vigor desde 2013. Treze anos de dado acumulado.'],
  ['união europeia','A diretiva revisada de desempenho energético entrou em vigor em 2024 e obriga os Estados-membros a levar exigência de carbono de ciclo de vida completo para a lei nacional, com cálculo obrigatório para edificações grandes a partir de 2028.']],
 fecho:'Nada disso é regra brasileira. Mas <span class="grifo forte">o nosso cliente já viu isso de perto.</span> Quem compra alto padrão viajou, hospedou-se nesses prédios, entendeu a diferença e voltou admirando. Ele não precisa que a lei brasileira mude para reconhecer o que está vendo — ele precisa da chance de comprar isso aqui. <span class="grifo">É essa chance que ainda não existe no Brasil.</span>',
 pend:'VERIFICAR os números antes de circular. Fontes: Buro Happold, One Click LCA, Stora Enso, Comissão Europeia (EPBD).'},

/* ─── ATO 03 · A AMAZ ─────────────────────────────────────────────────── */

{g:'divisor',div:1,funda:1,sec:'a amaz',dn:'03',dt:'um novo olhar',
 ds:'Não é uma incorporadora a mais fazendo a mesma coisa com outro nome. É outra maneira de olhar para o que uma casa deveria ser, e para como ela deveria ser feita.'},

{g:'frase',esc:1,kick:'a origem',
 pre:'Um arquiteto, um engenheiro e um publicitário começaram desenhando uma casa para eles mesmos.',
 t:'mais do mesmo?<br>não. a ideia foi<br>repensar do zero.',
 sub:'Era um projeto pessoal: onde a gente gostaria de morar, feito do jeito que a gente acha que uma casa deveria ser feita. Quando ficou pronto no papel, a conclusão foi outra — <span class="grifo">isso não é vontade de três pessoas. É um produto que falta no mercado.</span>',
 dados:[
  ['a matéria','madeira engenheirada','O único material estrutural que estoca carbono, se repõe sozinho e as pessoas querem tocar.'],
  ['o método','industrializado','A fabricação na fábrica, a decisão no projeto, e o canteiro reduzido a montagem.'],
  ['a escala','a vila','Poucas casas em torno de um verde comum, dentro do bairro consolidado. Escala humana como projeto, não como limitação.']],
 etapas:1,
 pend:'A resposta não foi fazer torres mais bonitas nem apartamentos mais bem acabados. Foi trocar a matéria, o método e a escala ao mesmo tempo — porque são o mesmo problema visto de três ângulos.'},

{g:'socio',dir:0,nome:'Adriano Carvalho',papel:'marketing e comunicação',
 slotfoto:'retrato · filtro Hora Dourada',
 bio:'Responsável pelo posicionamento, pela construção de marca e pela conversa com o mercado. É quem transforma um sistema construtivo em argumento que o comprador entende.',
 cred:[
  ['—','<b>PREENCHER:</b> marcas e contas de comunicação já atendidas — as três ou quatro mais reconhecíveis, com o segmento de cada uma.'],
  ['—','<b>PREENCHER:</b> anos de atuação, e se houve agência própria ou cargo de liderança.'],
  ['—','<b>PREENCHER:</b> prêmios, cases ou números de campanha que valham citar.']],
 pend:'Adriano: mandar as marcas de comunicação, o tempo de estrada e o que pode ser mostrado em imagem. Sem isso esta prancha não vai para fora.'},

{g:'socio',dir:1,nome:'Eduardo Eid',papel:'engenharia e obra',
 slotfoto:'obra de grande porte · aeroporto ou instalação industrial · filtro Mata',
 bio:'Responsável pela viabilidade, pelo sistema construtivo e pela execução. Traz para a escala da vila a disciplina de quem entregou instalações de grande porte, onde erro de coordenação custa caro e prazo não se negocia.',
 cred:[
  ['—','<b>PREENCHER:</b> o aeroporto — qual, qual escopo, qual metragem, qual ano.'],
  ['—','<b>PREENCHER:</b> as demais instalações de grande porte executadas e entregues, com m² e valor de contrato quando puder ser citado.'],
  ['—','<b>PREENCHER:</b> total de m² executados na carreira. É o número que qualifica de imediato.']],
 pend:'Eduardo: mandar a lista de obras entregues, com metragem e imagem liberada para uso. Priorizar o aeroporto — é o que dá escala ao currículo aos olhos de investidor.'},

{g:'socio',dir:0,nome:'Michel Stein',papel:'arquitetura e produto',
 slotfoto:'projeto autoral entregue · filtro Mata',
 bio:'Responsável pelo projeto, pela prospecção de terreno e pelo material de venda. É quem define o produto — a casa, a vila e a relação de cada uma com o bairro em que entra.',
 cred:[
  ['—','<b>PREENCHER:</b> m² projetados e entregues na carreira.'],
  ['—','<b>PREENCHER:</b> três a quatro projetos autorais que representem o repertório, com imagem própria.'],
  ['—','<b>PREENCHER:</b> tempo de escritório próprio e tipologias dominadas.']],
 pend:'Michel: escolher os projetos que entram e fechar o número de m². Usar o filtro Mata em todas as imagens para que as três pranchas de sócio leiam como um conjunto.'},

{g:'frase',esc:1,kick:'quem faz',
 pre:'Comunicação, engenharia e arquitetura — as três competências que decidem um empreendimento, sentadas na mesma mesa.',
 t:'a convergência,<br>e não a aposta',
 sub:'Incorporadora pequena costuma ter uma perna faltando e terceirizar caro. É aí que ela perde margem, prazo e controle de qualidade. Aqui nenhuma das três pernas é contratada — e cada uma chega com <span class="grifo">quilometragem própria antes da AMAZ existir</span>.',
 prem:'O que é novo é a combinação, não a capacidade. Nenhum dos três está aprendendo o próprio ofício neste projeto.'},

{g:'frase',kick:'o que fazemos',
 t:'vilas residenciais<br>em bairros<br>consolidados',
 sub:'Casas independentes em formato de vila, com área comum e paisagismo, dentro da cidade que já existe — não no vazio urbano. Venda de casa mais terreno. Escala humana, poucas unidades, sistema construtivo industrializado em madeira engenheirada.',
 dados:[
  ['Ônica','a linha autoral','Primeiro projeto: Ônica Madalena, na Vila Madalena. Poucas unidades, arquitetura autoral, grandes aberturas para o jardim.'],
  ['Vila do Bem','a linha acessível','Mesmo DNA de vila, madeira e sustentabilidade, endereçando outra faixa de renda.'],
  ['AMAZ','a plataforma','A marca-mãe é dona do sistema construtivo. É ela que se repete; os produtos é que variam.']],
 etapas:1},

{g:'camadas',kick:'o módulo',t:'a casa<br>industrializada',
 sub:'Quatro camadas que chegam separadas e se montam no terreno. A fundação é a única etapa convencional; da laje para cima, tudo é peça cortada em fábrica, etiquetada e numerada.',
 itens:[
  ['01','fundação','A única etapa que ainda é obra convencional. Acontece enquanto a estrutura está sendo fabricada.'],
  ['02','estrutura em MLC','Pilares, vigas e lajes em madeira lamelada colada. Chega pré-cortada, sobe em dias.'],
  ['03','vedação e caixilharia','Produzida em paralelo à estrutura — não depois dela. É o que o controle milimétrico permite.'],
  ['04','paisagismo e cobertura','O verde não é sobra de terreno: é parte do projeto desde a primeira camada.']],
 pend:'Esta é uma axonométrica esquemática, gerada por código. A peça definitiva é um desenho autoral da casa-módulo Ônica — item de produção nossa.'},

{g:'logo',esc:1,capa:1,video:1,
 ante:'e foi daí que veio',
 dep:'Uma incorporadora que existe para fazer uma coisa só, e fazer bem: vilas residenciais em madeira engenheirada, em bairros urbanos consolidados de São Paulo.',
 slot:'VÍDEO DE FUNDO · copa de árvore em contraluz, filtro amaz-mata-video · o hero que já existe em Hero video/'},

{g:'frase',janela:1,kick:'a tese',
 pre:'Num mercado que se diferencia por planta, metragem e acabamento, escolhemos nos diferenciar por aquilo que a casa é feita.',
 t:'a alma da casa<br>vem primeiro.<br>a planta vem depois.',
 sub:'A maioria dos empreendimentos começa pelo produto e escolhe o material no fim, pelo custo. Nós fazemos o contrário: a escolha da matéria é a primeira decisão, e é dela que descem o projeto, o prazo, o preço e a sensação de morar ali.',
 prem:'Isso não é vender madeira — é deixar que ela decida a casa. A AMAZ não fornece material; entrega um lugar de morar cuja natureza inteira vem de uma escolha feita antes do primeiro traço.',
 pend:'A madeira pertence à AMAZ, não à Ônica. A AMAZ domina o sistema; a Ônica é a primeira aplicação dele. Se a matéria virar atributo de produto, perdemos a plataforma.'},

/* ─── ATO 04 · A MADEIRA ──────────────────────────────────────────────── */

{g:'divisor',div:1,funda:1,sec:'a madeira',dn:'04',dt:'a madeira',
 ds:'O material mais antigo da construção acaba de chegar ao século XXI. Por que a madeira deveria ser o padrão — e por que ainda não é.'},

{g:'frase',esc:1,kick:'a escolha estrutural',
 pre:'Existem empreendimentos em madeira no mercado. Quase todos escondem isso.',
 t:'nós colocamos<br>a madeira<br>em primeiro lugar',
 sub:'A MLC não é acabamento nem detalhe de projeto — é o sistema estrutural inteiro. Quem usa madeira e mostra com receio está pedindo desculpa por uma escolha. Nós fazemos o oposto: é o primeiro assunto, com orgulho.',
 prem:'Quem não gosta de madeira não é cliente da AMAZ. Isso é filtro de público, não perda de mercado.'},

{g:'frase',esc:1,kick:'a virada silenciosa',
 pre:'Por décadas, a briga do carbono na construção foi sobre energia de operação: ar-condicionado, iluminação, aquecimento. Essa briga está ganha.',
 t:'o carbono mudou<br>de lugar',
 sub:'À medida que as edificações ficam eficientes em operação, o que sobra é o carbono que já estava embutido nos materiais — gasto antes de alguém se mudar. Estima-se hoje entre 10% e 20% da pegada total de uma edificação, e a proporção só cresce conforme a operação melhora.',
 prem:'É a única parcela do carbono de um edifício que não pode ser corrigida depois. Ela é decidida uma vez, na escolha estrutural, e fica trancada ali por toda a vida útil.',
 dados:[
  ['aço e concreto','emitem para existir','Não há como fabricá-los sem queimar. O ganho possível é marginal — otimizar traço, reduzir seção, trocar clínquer.'],
  ['a madeira','estoca em vez de emitir','A árvore não emitiu para crescer: ela absorveu. É o único material estrutural que chega à obra como estoque de carbono, e não como dívida.'],
  ['e ela volta','o único que renasce','Reflorestamento é a única cadeia de material estrutural em que a matéria-prima se repõe sozinha, em escala de décadas e não de eras geológicas.']],
 etapas:1,
 pend:'VERIFICAR os percentuais de carbono incorporado com fonte citável antes de qualquer material impresso.'},

{g:'donut',esc:1,kick:'análise de ciclo de vida',
 unidade:[
  ['1 m³ de madeira','−1 t de CO₂','Retira carbono da atmosfera em vez de emitir. Número da Urbem para mass timber.'],
  ['1 m³ de concreto','+ emite','PREENCHER com fator verificado — sai do estudo de ACV.'],
  ['1 m³ de aço','+ emite muito','PREENCHER com fator verificado — sai do estudo de ACV.']],
 t:'2% do material.<br>45% das emissões.',
 sub:'A comparação entre o volume de material de uma obra e o carbono que cada material emite. O aço ocupa 2% do volume e responde por 45% das emissões — cerca de 22 vezes mais carbono por unidade de volume que a madeira. A madeira é 34% do volume e apenas 13% das emissões.',
 pend:'VERIFICAR a fonte primária e o escopo do estudo (A1-A3 ou A1-A5). Os valores aparentam ser percentuais normalizados de um caso específico, não absolutos. Se não for possível rastrear, refazer o cálculo com uma casa Ônica e fatores brasileiros.'},

{g:'frase',kick:'de onde vem',t:'reflorestamento,<br>não floresta',
 sub:'Madeira de reflorestamento, com cadeia de custódia rastreável e origem verificável. Vem cedo na apresentação de propósito: é a objeção que trava a conversa antes dela começar.',
 prem:'Este slide também responde ao risco do nosso próprio nome. Reflorestamento na entrada, resíduo zero na saída — o ciclo fechado é o argumento, e ele é operacional, não decorativo.',
 pend:'CONFIRMAR com a ITA: certificação (FSC ou CERFLOR), espécie, base florestal e estado de origem.'},

{g:'lista',rotulo:1,kick:'os quatro enganos',t:'o que você acha<br>que sabe sobre<br>madeira',
 sub:'Quatro crenças que circulam sobre madeira na construção civil. Nenhuma delas se sustenta diante do material que existe hoje — e as quatro juntas explicam por que o Brasil ainda constrói do jeito que constrói.',
 itens:[
  ['incêndio','fogo','<span class="grifo">Carboniza de fora para dentro em taxa previsível</span> e mantém a capacidade do núcleo. O aço, que o imaginário considera seguro, perde resistência e colapsa sem aviso.'],
  ['cupim e fungo','cupim','Imersão em tratamento preservativo, antifúngico e anticupim, antes de sair da fábrica. A peça chega à obra já protegida.'],
  ['durabilidade','relogio','<span class="grifo">20 anos de garantia</span> — patamar que bate de frente com o mercado convencional, e supera boa parte dele.'],
  ['escala','predio','<span class="grifo">Brock Commons: 18 pavimentos e 54 metros em madeira, Vancouver, 2017.</span> Se dá para aprovar isso, uma casa de dois pavimentos está em outra ordem de grandeza.']],
 pend:'CONFIRMAR com a ITA: nome correto do produto de imersão, escopo exato da garantia de 20 anos, TRRF atingido e taxa de carbonização, com laudo e norma ABNT.'},

{g:'frase',esc:1,kick:'02 · madeira engenheirada',
 pre:'A madeira que limitava projeto era a madeira maciça serrada — com nó, fibra torta e variação de peça para peça.',
 t:'a engenharia<br>tirou os defeitos<br>da árvore',
 sub:'MLC e CLT são lamelas selecionadas e coladas em direções controladas. O resultado é uma peça sem os pontos fracos da madeira natural, com desempenho previsível, dimensão sob encomenda e resistência por unidade de peso superior à do aço.',
 dados:[
  ['leveza','que desce até a fundação','Estrutura mais leve significa fundação menor, menos escavação e menos concreto justamente na única etapa que ainda é convencional. A economia começa antes da madeira chegar.'],
  ['vãos','que a maciça não fazia','Peças coladas alcançam vãos e alturas que a madeira serrada nunca permitiu. A limitação que criou o preconceito deixou de existir.'],
  ['precisão','de peça industrial','Tolerância de fábrica em milímetros, não em centímetros. É isso que permite fabricar o caixilho antes de a estrutura subir.']],
 etapas:1,
 pend:'CONFIRMAR com a ITA a tolerância dimensional real de fábrica, em milímetros, e a resistência específica da MLC fornecida.'},

{g:'frase',esc:1,kick:'precisão',
 pre:'Na construção convencional o arquiteto desenha, vai à obra e precisa conferir medida em loco — porque o concreto trabalha e a precisão não existe.',
 t:'na obra se constrói.<br>não se decide.',
 sub:'Daí vem o retrabalho, o furo no meio da obra, o jeitinho. Na madeira as decisões estão todas no projeto, porque o sistema chega como solução completa, cortada em fábrica.',
 prem:'A prova material: o caixilho pode ser produzido antes da estrutura estar de pé. Nenhuma construção convencional consegue isso — porque nenhuma sabe, de antemão, onde o vão vai estar.'},

{g:'frase',esc:1,kick:'a entrega',
 pre:'A estrutura chega pré-cortada, etiquetada e numerada. A obra deixa de ser fabricação e passa a ser montagem — e montagem tem duração previsível, o que fabricação em canteiro nunca teve.',
 t:'velocidade de<br>entrega<br>incomparável',
 sub:'Uma equipe pequena e treinada levanta em dias o que a construção convencional levaria meses para erguer. E essa velocidade não beneficia um lado só: <span class="grifo">ela paga três vezes, para três pessoas diferentes, ao mesmo tempo</span>.',
 dados:[
  ['o investidor','recebe antes','Ciclo curto é capital girando antes e menos meses de exposição a juros, obra e imprevisto. É o argumento financeiro mais direto do sistema.'],
  ['o morador','entra antes','Menos tempo de espera, menos aluguel em paralelo, menos incerteza sobre quando a casa fica pronta — e uma data que se cumpre.'],
  ['a obra','erra menos','Menos tempo de canteiro é menos exposição a chuva, furto, acidente e rotatividade de equipe. Prazo curto não é só rápido: é mais seguro.']],
 etapas:1,
 pend:'PREENCHER com números reais: tempo de fabricação por lote, dias de montagem por casa e número de montadores. A confirmar com a ITA — este slide é forte demais para sair sem número.'},

{g:'frase',kick:'resíduo',t:'a obra que não<br>suja a rua',
 sub:'Obra convencional gera resíduo e sujeira. Na primeira chuva o material se espalha, a calçada e a mata em volta ficam sujas. Há bota-fora, sobra, peça quebrada e refeita. Com o sistema industrializado isso não acontece: o que chega ao terreno é o que vai ser montado.',

/* ═══ donut do ACV ═══
   Dois anéis: volume de material e emissões. Desenhados por código para não
   depender de imagem — os valores vêm do DECK, não estão soldados aqui. */
function donut(){
  const P={concreto:'#D9C9A3',madeira:'#BFA783',aco:'#B95118'};
  const sets=[
    {t:'volume de material',u:'m³',d:[['concreto',64],['madeira',34],['aço',2]]},
    {t:'emissões de carbono',u:'CO₂e',d:[['aço',45],['concreto',42],['madeira',13]]}
  ];
  const cor=n=>n==='aço'?P.aco:(n==='madeira'?P.madeira:P.concreto);
  const R=86,r=44,W=470,H=286;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  sets.forEach((set,k)=>{
    const cx=k===0?120:350, cy=118, tot=set.d.reduce((a,b)=>a+b[1],0);
    let ang=-Math.PI/2;
    set.d.forEach(([nome,v])=>{
      const sw=v/tot*Math.PI*2, e=ang+sw, gr=sw>Math.PI?1:0;
      const p=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
      const [x1,y1]=p(R,ang),[x2,y2]=p(R,e),[x3,y3]=p(r,e),[x4,y4]=p(r,ang);
      const id=`${k}-${nome}`;
      /* a madeira é a única em Bricolage; concreto e aço em Inter negrito.
         É o que faz a proporção das emissões saltar sem legenda. */
      const dela = nome==='madeira';
      s+=`<g class="fatia" data-f="${id}" tabindex="0">`
        +`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${gr} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`
        +` L${x3.toFixed(1)} ${y3.toFixed(1)} A${r} ${r} 0 ${gr} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z"`
        +` fill="${cor(nome)}" stroke="#04251F" stroke-width="2"/>`;
      const [lx,ly]=p((R+r)/2,ang+sw/2);
      const dentro=v/tot>0.07;
      const [ox,oy]=p(R+22,ang+sw/2);
      s+=`<text x="${(dentro?lx:ox).toFixed(1)}" y="${((dentro?ly:oy)+(dela?7:6)).toFixed(1)}" text-anchor="middle"`
        +` font-family="${dela?'Bricolage Grotesque':'Inter'},sans-serif"`
        +` font-weight="${dela?800:600}" font-size="${dela?25:19}"`
        +` letter-spacing="${dela?'-.7':'0'}" fill="${dentro?'#04251F':'#F4F1EA'}">${v}</text>`;
      /* etiqueta do mouse over */
      const [tx,ty]=p((R+r)/2,ang+sw/2);
      s+=`<g class="dica" transform="translate(${tx.toFixed(1)} ${(ty-30).toFixed(1)})">`
        +`<rect x="-46" y="-15" width="92" height="24" rx="12" fill="#F4F1EA"/>`
        +`<text x="0" y="2" text-anchor="middle" font-family="Inter,sans-serif" font-size="11"`
        +` font-weight="600" letter-spacing=".6" fill="#06392F">${nome} ${v}${k?'%':'%'}</text></g>`;
      s+=`</g>`;
      ang=e;
    });
    s+=`<text x="${cx}" y="${H-38}" text-anchor="middle" font-family="Inter,sans-serif"`
      +` font-size="10.5" font-weight="500" letter-spacing="1.7" fill="#F4F1EAb8">`
      +`${set.t.toUpperCase()}</text>`;
  });
  return s+'</svg>';
}

/* ═══ camadas: axonométrica esquemática do módulo ═══
   Quatro planos em isometria, separados na vertical. Esquema, não desenho —
   a peça definitiva é autoral. */
function camadas(){
  const W=420,H=430;
  const ox=210, base=352, passo=78, kx=1.0, ky=0.5, lg=88;
  /* i=0 é a BASE. De baixo para cima: fundação, estrutura, vedação, paisagismo.
     O slide roda sobre Papel, então todo traço é Tiber — nada de Areia aqui. */
  const cores=['#D9C9A3','#F4F1EA','#BFA783','#8FA88C'];
  const TIN='#06392F';
  const face=(cx,cy,f)=>{
    const p=(dx,dy)=>[cx+(dx-dy)*kx*f,cy+(dx+dy)*ky*f];
    const a=p(-lg,-lg),b=p(lg,-lg),c=p(lg,lg),d=p(-lg,lg);
    return [a,b,c,d];
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  /* linhas de chamada, do topo à base */
  const bd=face(ox,base,1);
  bd.forEach((pt,i)=>{
    s+=`<line x1="${pt[0].toFixed(1)}" y1="${pt[1].toFixed(1)}" x2="${pt[0].toFixed(1)}"`
      +` y2="${(pt[1]-passo*3-14).toFixed(1)}" stroke="${TIN}" stroke-width=".8"`
      +` stroke-dasharray="3 4" opacity=".30"/>`;
  });
  for(let i=0;i<4;i++){
    const cy=base-passo*i, q=face(ox,cy,1);
    const pts=q.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    s+=`<polygon class="cmlayer" points="${pts}" fill="${cores[i]}" fill-opacity="${i===1?.14:.9}"`
      +` stroke="${TIN}" stroke-width="1.6"/>`;
    /* espessura: uma faixa lateral, para o plano ler como camada e não como folha */
    if(i!==1){
      const e=9;
      s+=`<polygon points="${q[3][0].toFixed(1)},${q[3][1].toFixed(1)} ${q[2][0].toFixed(1)},${q[2][1].toFixed(1)}`
        +` ${q[2][0].toFixed(1)},${(q[2][1]+e).toFixed(1)} ${q[3][0].toFixed(1)},${(q[3][1]+e).toFixed(1)}"`
        +` fill="${TIN}" fill-opacity=".22" stroke="${TIN}" stroke-width="1.2"/>`;
    }
    /* na camada 2 (estrutura), uma grelha de pilares para ler MLC */
    if(i===1){
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
        const px=ox+(a*58-b*58)*kx, py=cy+(a*58+b*58)*ky;
        s+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}"`
          +` y2="${(py+passo-16).toFixed(1)}" stroke="#8A6A3E" stroke-width="3.4" stroke-linecap="round"/>`;
      }
    }
    s+=`<text x="${(ox-lg*kx-26).toFixed(1)}" y="${(cy+5).toFixed(1)}" text-anchor="end"`
      +` font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="15"`
      +` fill="${TIN}">0${i+1}</text>`;
  }
  return s+'</svg>';
}

/* ═══ montagem dos gabaritos ═══ */
const palco=document.getElementById('palco');

function tpl(s){
  const k=s.kick?`<div class="kick rev">${s.kick}</div>`:'';
  const grande=(s.g==='frase'||s.g==='capa'||s.g==='donut');
  const t=s.t?`<h1 class="${grande?'mega':'big'} rev">${s.t}</h1>`:'';
  const sub=s.sub?`<p class="sub rev">${s.sub}</p>`:'';
  const prem=s.prem?`<p class="prem rev">${s.prem}</p>`:'';
  const pend=s.pend?`<p class="pend rev">${s.pend}</p>`:'';
  const pre=s.pre?`<p class="sub rev" style="margin-top:0;margin-bottom:clamp(10px,1.6vh,22px);max-width:46ch">${s.pre}</p>`:'';
  /* `etapas:1` faz os dados entrarem por clique. A varredura do fio é o
     comportamento padrão de `passo` — não precisa de classe extra. */
  const et=s.etapas?' passo':'';
  const dad=s.dados?`<div class="dados rev">`+s.dados.map(([v,l,n])=>
    `<div class="dado${et}"><span class="v">${v}</span><span class="l">${l}</span>${n?`<span class="n">${n}</span>`:''}</div>`).join('')+`</div>`:'';
  const inicio=s.comecar?`<button class="ms-start">começar ${SETA}</button>`:'';

  if(s.g==='marca'){
    /* sem underscore piscante: aquilo é a assinatura do michel stein_.
       O dispositivo da AMAZ é a barra de acento do lockup. */
    return `<div class="frase">`
      +(s.lockup?lockup():'')
      +(s.slogan?`<div class="slogan rev">${s.slogan}</div>`:'')
      +(s.assina?`<div class="assina rev">${s.assina}</div>`:'')
      +(s.site?`<div class="site rev">${s.site}</div>`:'')
      +inicio+`</div>`;
  }
  const met=s.metas?`<div class="metas rev">`+s.metas.map(([l,v])=>
    `<div><span class="ml">${l}</span><span class="mv">${v}</span></div>`).join('')+`</div>`:'';
  if(s.g==='capa'){
    /* a sanfona: por enquanto só o percurso completo anda. Os dois atalhos
       ficam desenhados e desligados, para o formato já existir na conversa. */
    const tp=s.tempo?`<div class="tempo rev"><span class="tq">${s.tempo}</span>`
      +s.opcoes.map(([rot,ativo])=>ativo
        ? `<button class="tbtn on ms-start">${rot} ${SETA}</button>`
        : `<button class="tbtn off" disabled>${rot} </button>`).join('')
      +`</div>`:'<div class="regua rev"></div>';
    return `<div class="wrap">${k}${t}${sub}${met}${tp}</div>`;
  }
  if(s.g==='divisor') return `<div class="divisor"><span class="dn rev">${s.dn}</span>`
    +`<h1 class="dt rev">${s.dt}</h1><p class="ds rev">${s.ds}</p></div>`;
  if(s.g==='frase') return `<div class="wrap">${k}${pre}${t}${sub}${prem}${dad}${pend}</div>`;

  if(s.g==='lista'||s.g==='fim') return `<div class="wrap${s.largo?' largo':''}">${k}${pre}${t}${sub}`
    +`<ol class="lista${s.largo?' largo':''}${s.rotulo?' rot':''}">`+s.itens.map(it=>{
      const [q,x,y]=it, temIco=y!==undefined;
      const rot=temIco?`${ICO[x]||''}<span>${q}</span>`:q;
      return `<li class="passo"><span class="q">${rot}</span><span class="t">${temIco?y:x}</span></li>`;
    }).join('')
    +`</ol>${s.fecho?`<p class="sub rev" style="max-width:58ch">${s.fecho}</p>`:''}${prem}${pend}</div>`;

  if(s.g==='tabela'){
    const tab=`<div class="rev"><table class="tb"><thead><tr>`
      +s.cols.map(c=>`<th>${c}</th>`).join('')+`</tr></thead><tbody>`
      +s.linhas.map(r=>`<tr>`+r.map(c=>`<td>${c}</td>`).join('')+`</tr>`).join('')
      +`</tbody></table></div>`;
    const f=s.fecho?`<p class="sub rev" style="max-width:56ch">${s.fecho}</p>`:'';
    return `<div class="wrap">${k}${t}${sub}${tab}${f}${pend}</div>`;
  }

  if(s.g==='donut') return `<div class="dncols"><div class="wrap">${k}${t}${sub}${pend}</div>`
    +`<div class="dnwrap rev">${donut()}`
    +`<div class="dnleg"><span><i style="background:#D9C9A3"></i>concreto</span>`
    +`<span><i style="background:#BFA783"></i>madeira</span>`
    +`<span><i style="background:#B95118"></i>aço</span></div>`
    +(s.unidade?`<div class="dnunid">`+s.unidade.map(([m,v,n])=>
      `<div class="un"><span class="um">${m}</span><span class="uv">${v}</span>`
      +`<span class="un2">${n}</span></div>`).join('')+`</div>`:'')
    +`</div></div>`;

  if(s.g==='camadas') return `<div class="cmcols"><div class="cmwrap rev">${camadas()}</div>`
    +`<div class="wrap">${k}${t}${sub}<ol class="lista">`
    +s.itens.map(([q,ti,d])=>`<li class="passo"><span class="q">${q}</span>`
      +`<span class="t"><b>${ti}</b><br>${d}</span></li>`).join('')
    +`</ol>${pend}</div></div>`;

  if(s.g==='casos') return `<div class="wrap" style="max-width:none">${k}${t}${sub}`
    +`<div class="casos rev">`+s.itens.map(([n,l,v,d])=>
      `<div class="caso"><span class="cn">${n}</span><span class="cl">${l}</span>`
      +`<span class="cv">${v}</span><span class="cd">${d}</span></div>`).join('')
    +`</div>${prem}${pend}</div>`;

  if(s.g==='duas') return `<div class="wrap" style="max-width:none">${k}${t}${sub}`
    +`<div class="duas rev"><span class="hd">o fato</span><span class="hd">para o investidor</span>`
    +`<span class="hd">para o morador</span>`
    +s.linhas.map(([f,i,m])=>`<span class="cel fato">${f}</span>`
      +`<span class="cel inv">${i}</span><span class="cel">${m}</span>`).join('')
    +`</div>${pend}</div>`;

  if(s.g==='dado'){
    const im=s.img?`<img src="${s.img}" alt="">`:'';
    const slot=s.img?'':`<div class="slot"><b>slot de imagem</b><span>${s.slot||''}</span></div>`;
    return `<div class="bleed">${im}${slot}</div>`
      +`<div class="dadowrap">`
      +`<span class="num rev">${s.num}</span>`
      +`<span class="rot rev">${s.rot}</span>`
      +(s.nota?`<span class="nota rev">${s.nota}</span>`:'')
      +(s.fonte?`<span class="fonte rev">${s.fonte}</span>`:'')
      +`</div>`;
  }

  if(s.g==='logo'){
    return `<div class="logowrap">`
      +(s.ante?`<div class="ante rev">${s.ante}</div>`:'')
      +lockup()
      +(s.dep?`<p class="dep rev">${s.dep}</p>`:'')
      +`</div>`;
  }

  if(s.g==='socio'){
    const im=s.foto?`<img src="${s.foto}" alt="${s.nome}">`:'';
    const slot=s.foto?'':`<div class="slot"><b>slot de imagem</b><span>${s.slotfoto||''}</span></div>`;
    return `<div class="sccols${s.dir?' dir':''}"><div class="scfoto rev">${im}${slot}</div>`
      +`<div class="wrap"><span class="scnome rev">${s.nome}</span>`
      +`<span class="scpapel rev">${s.papel}</span>`
      +`<p class="scbio rev">${s.bio}</p>`
      +`<ol class="credenciais">`+s.cred.map(([q,x])=>
        `<li class="passo"><span class="cq">${q}</span><span class="ct">${x}</span></li>`).join('')
      +`</ol>${pend}</div></div>`;
  }

  return '';
}

/* ═══ seções, numeração e montagem ═══ */
let secs=[];DECK.forEach((s,i)=>{if(s.sec)secs.push({nome:s.sec,i})});
let sa='';DECK.forEach(s=>{if(s.sec)sa=s.sec;s._sec=sa});
let num=0;DECK.forEach(s=>{if(s.div){s._b=null;return}num++;s._b=num});
const TOT=num;

const dots=document.querySelector('.dots');
secs.forEach((sc,i)=>{const d=document.createElement('span');d.className='sdot';
  d.innerHTML=`<span>${sc.nome}</span>`;
  d.onclick=e=>{e.stopPropagation();go(sc.i)};dots.appendChild(d)});
document.querySelector('.marca').innerHTML=WM+'<i></i>';

palco.innerHTML=DECK.map((s,i)=>
  `<section class="slide g-${s.g}" data-i="${i}">${tpl(s)}</section>`).join('');
const sl=[...document.querySelectorAll('.slide')];
sl.forEach(el=>[...el.querySelectorAll('.rev')].forEach((r,j)=>
  r.style.setProperty('--i',Math.min(j,10))));

/* ═══ navegação ═══ */
let cur=-1;
const passos=i=>[...sl[i].querySelectorAll('.passo')];

function go(i,tudo){
  i=Math.max(0,Math.min(DECK.length-1,i));if(i===cur)return;
  const ant=cur;cur=i;
  sl.forEach((el,j)=>el.classList.toggle('ativo',j===i));
  if(ant>=0)sl[ant].classList.remove('revelado');
  void sl[i].offsetWidth;sl[i].classList.add('revelado');
  passos(i).forEach(p=>p.classList.toggle('on',!!tudo));
  const s=DECK[i];
  document.body.classList.toggle('esc',!!s.esc);
  document.body.classList.toggle('funda',!!s.funda);
  document.body.classList.toggle('na-capa',!!s.capa);
  /* na abertura o chrome some; na contracapa ele FICA — sem ele não há como
     voltar nem pular por seção, e voltar do fim é o gesto mais comum quando
     alguém pergunta algo no meio da conversa. */
  document.body.classList.toggle('na-marca',s.g==='marca'&&!s.fim_);
  document.querySelector('.sl').textContent=s._sec||'';
  const si=secs.findIndex(x=>x.nome===s._sec);
  document.querySelector('.sn').textContent=si>=0?String(si+1).padStart(2,'0'):'';
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===si));
  conta();location.hash=i+1;
}
function conta(){
  const s=DECK[cur],ps=passos(cur),on=ps.filter(p=>p.classList.contains('on')).length;
  let txt=s._b===null?`— / ${TOT}`:`${s._b} / ${TOT}`;
  if(ps.length)txt+=` · ${on}/${ps.length}`;
  document.querySelector('.cont').textContent=txt;
}
/* passo a passo por clique: o item numerado entra um de cada vez.
   Regra do deck, não opção — a apresentação é por voz. */
function avanca(){const ps=passos(cur),p=ps.find(x=>!x.classList.contains('on'));
  if(p){p.classList.add('on');conta();return}go(cur+1)}
const recua=()=>go(cur>0?cur-1:0,true);

document.getElementById('pro').onclick=e=>{e.stopPropagation();avanca()};
document.getElementById('ant').onclick=e=>{e.stopPropagation();recua()};
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();avanca()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();recua()}
  else if(e.key==='ArrowDown'){e.preventDefault();go(cur+1,true)}
  else if(e.key==='ArrowUp'){e.preventDefault();go(cur-1,true)}});
palco.addEventListener('click',e=>{
  if(e.target.closest('.ms-start')){go(cur+1);return}
  if(e.target.closest('a,button'))return;avanca()});
let tx=0;
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;
  if(Math.abs(d)>52){d<0?avanca():recua()}},{passive:true});

/* aviso de orientação — sugestão, nunca barreira */
(function(){
  const el=document.getElementById('giro');let era=null;
  const movel=()=>matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<=820;
  function avalia(){
    if(!movel())return;
    const ret=innerHeight>innerWidth;
    if(era===null){era=ret;if(ret)el.classList.add('on');return}
    if(ret!==era){era=ret;el.classList.toggle('on',ret)}
  }
  el.addEventListener('click',e=>{e.stopPropagation();el.classList.remove('on')});
  addEventListener('touchend',e=>{if(el.classList.contains('on'))e.stopPropagation()},true);
  addEventListener('orientationchange',()=>setTimeout(avalia,260));
  addEventListener('resize',()=>setTimeout(avalia,260));
  avalia();
})();

go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));

</script>
