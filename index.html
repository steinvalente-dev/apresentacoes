<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#6B6A4B">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>apresentações_michel stein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#6B6A4B; --cream:#EDE6DA; --ink:#211D1A; --terra:#B85C38;
    --soft:#EDE6DAcc; --muted:#EDE6DA8c; --line:#EDE6DA2e; --hair:#EDE6DA1a;
    --mono:'DM Mono',ui-monospace,monospace;
    --card:#211D1Aa6;              /* tinta translúcida, garante a leitura */
    --card-forte:#211D1Ac4;
    --card-linha:#EDE6DA24;
    --fundo:var(--olive);          /* troca com a aba */
    --acento:var(--terra);         /* o traço da marca */
  }
  body.sistema{
    --fundo:var(--terra);
    --acento:var(--ink);           /* sobre terracota o traço vira tinta */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  #msfundo{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
  #msveu{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:var(--fundo);opacity:.18;transition:background-color .55s}
  #msveu::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,var(--fundo) 0%,transparent 16%,transparent 84%,var(--fundo) 100%);
    opacity:.30;transition:background .55s}
  body>nav,body>main,body>footer{position:relative;z-index:2}
  body{
    background:var(--fundo);color:var(--cream);
    transition:background-color .55s cubic-bezier(.4,0,.2,1);
    font-family:'Inter',system-ui,sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  ::selection{background:var(--cream);color:var(--fundo)}
  .mark{font-family:var(--mono);font-weight:500;font-style:italic;
    text-transform:lowercase;letter-spacing:-.04em;line-height:1}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .tr{color:var(--acento);animation:blink 1.1s step-end infinite;transition:color .55s}

  nav{display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(20px,6vw,72px)}
  nav a.brand{font-size:19px;color:var(--cream);text-decoration:none}
  nav .back{color:var(--muted);text-decoration:none;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:color .3s}
  nav .back:hover{color:var(--cream)}

  main{flex:1;width:100%;max-width:1240px;
    padding:clamp(32px,7vh,72px) clamp(20px,6vw,72px) 0}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--muted);margin-bottom:22px}
  h1.tit{font-size:clamp(40px,8vw,86px);margin-bottom:22px}
  .lede{max-width:56ch;color:var(--soft);font-size:14.5px}

  /* ── abas ─────────────────────────────────────────────── */
  .abas{position:relative;display:inline-grid;grid-auto-flow:column;
    grid-auto-columns:1fr;margin:34px 0 clamp(38px,6vh,60px);
    border:1px solid var(--card-linha);border-radius:999px;padding:4px;
    background:var(--card);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    transition:border-color .55s,background .55s}
  .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
    background:var(--cream);border-radius:999px;
    transition:transform .42s cubic-bezier(.65,0,.25,1);pointer-events:none}
  .abas[data-sel="1"] .knob{transform:translateX(100%)}
  .aba{position:relative;z-index:1;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    background:none;border:0;padding:9px clamp(18px,3vw,30px);border-radius:999px;
    cursor:pointer;white-space:nowrap;transition:color .32s}
  .aba:hover{color:var(--cream)}
  .aba[aria-selected="true"]{color:var(--ink)}
  .abas .aba:not([aria-selected="true"]){color:var(--soft)}
  .aba:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

  .painel[hidden]{display:none}
  .col-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted);margin-bottom:20px}

  /* ── arquivo: projetos | peças ────────────────────────── */
  .arquivo{display:grid;grid-template-columns:minmax(190px,270px) 1fr;
    gap:clamp(26px,5vw,58px);align-items:start}
  .projetos{list-style:none;display:flex;flex-direction:column;gap:4px}
  .projetos button{width:100%;display:flex;align-items:baseline;
    justify-content:space-between;gap:16px;text-align:left;background:none;
    border:1px solid transparent;background:var(--card);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    border-radius:999px;padding:11px 21px;cursor:pointer;color:var(--soft);
    font-family:var(--mono);font-style:italic;font-weight:500;text-transform:lowercase;
    letter-spacing:-.02em;font-size:clamp(17px,2vw,21px);line-height:1.25;
    transition:color .25s,border-color .25s,background .25s}
  .projetos button:hover{color:var(--cream);background:var(--card-forte)}
  .projetos button[aria-current="true"]{border-color:var(--cream);color:var(--cream);
    background:var(--card-forte)}
  .projetos button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .projetos .qt{font-family:'Inter',sans-serif;font-style:normal;font-weight:400;
    font-size:11px;letter-spacing:.06em;color:var(--muted);
    margin-left:auto;flex-shrink:0}

  .pecas{border-left:1px solid var(--line);padding-left:clamp(20px,4vw,44px);
    min-height:220px}
  .peca{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(14px,2.4vw,28px);
    align-items:center;border:1px solid var(--card-linha);border-radius:6px;
    background:var(--card);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    padding:clamp(16px,2.2vw,22px) clamp(16px,2.4vw,26px);margin-bottom:12px;
    transition:border-color .25s,background .25s}
  .peca:hover{border-color:var(--line);background:var(--card-forte)}
  .peca .n{font-family:var(--mono);font-style:italic;font-weight:500;
    font-size:clamp(24px,3.4vw,34px);color:var(--cream);line-height:1;
    letter-spacing:-.04em;min-width:2.2ch}
  .peca .nome{font-family:var(--mono);font-style:italic;font-weight:500;
    text-transform:lowercase;letter-spacing:-.03em;
    font-size:clamp(16px,2.1vw,21px);line-height:1.2;display:block}
  .peca .sub{font-size:12px;color:var(--muted);margin-top:6px;display:block;
    font-variant-numeric:tabular-nums}
  .peca .sub i{font-style:normal;opacity:.45;margin:0 2px}
  .peca .sub .pesada{color:var(--cream)}
  .peca .sub .pesada::after{content:"↑";margin-left:3px;font-size:.85em;opacity:.7}
  .acoes{display:flex;align-items:center;gap:clamp(12px,2vw,22px);flex-shrink:0}
  .acoes button,.acoes a{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--cream);background:none;
    border:1px solid var(--line);border-radius:999px;
    text-decoration:none;cursor:pointer;padding:9px 17px;white-space:nowrap;
    transition:background .26s,color .26s,border-color .26s}
  .acoes button:hover,.acoes a:hover{background:var(--cream);color:var(--fundo);
    border-color:var(--cream)}
  .acoes button:focus-visible,.acoes a:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  .acoes .abrir{display:inline-flex;align-items:center;gap:.6em}
  .acoes .abrir svg{width:15px;height:9px;transition:transform .28s}
  .acoes .abrir:hover svg{transform:translateX(3px)}
  .acoes .copiado{background:var(--cream);color:var(--fundo);border-color:var(--cream)}

  .orfas{border:1px solid var(--cream);border-radius:6px;padding:16px 20px;
    margin-bottom:14px;background:var(--card-forte);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    font-size:12.5px;line-height:1.6;color:var(--cream)}
  .orfas b{font-weight:600}
  .orfas code{font-family:var(--mono);font-size:11.5px;opacity:.85}
  .vazio{border:1px dashed var(--line);border-radius:6px;padding:34px 26px;
    background:var(--card);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    color:var(--muted);font-size:13.5px;max-width:52ch}
  .vazio b{color:var(--soft);font-weight:500}

  /* ── sistema ──────────────────────────────────────────── */
  .grupo{font-family:var(--mono);font-style:italic;font-weight:500;
    text-transform:lowercase;letter-spacing:-.02em;font-size:clamp(17px,2vw,21px);
    color:var(--cream);display:flex;align-items:center;gap:18px;margin:44px 0 12px}
  .grupo:first-child{margin-top:0}
  .grupo::after{content:"";flex:1;height:3px;background:var(--cream);border-radius:2px}
  .docs{list-style:none;border:1px solid var(--card-linha);border-radius:6px;
    overflow:hidden;background:var(--card);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
  .doc-item{border-bottom:1px solid var(--card-linha);transition:background .25s}
  .doc-item:last-child{border-bottom:0}
  .doc-item:hover{background:var(--card-forte)}
  .doc-linha{display:grid;grid-template-columns:32px 1fr auto;
    gap:clamp(12px,2.4vw,24px);align-items:center;
    padding:14px clamp(14px,2vw,22px)}
  .doc-linha>.corpo{min-width:0}
  .doc-acoes a:focus-visible,.doc-acoes button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  .doc-item .g{font-family:var(--mono);font-style:italic;font-size:13px;color:var(--muted)}
  .doc-item .nm{font-family:var(--mono);font-style:italic;font-weight:500;
    text-transform:lowercase;letter-spacing:-.03em;font-size:clamp(16px,1.9vw,19px);display:block}
  .doc-item .ds{font-size:12px;color:var(--muted);margin-top:3px;display:block}
  .doc-acoes{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .doc-acoes .go,.doc-acoes .ver{font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--cream);
    border:1px solid var(--line);border-radius:999px;padding:8px 15px;
    white-space:nowrap;text-decoration:none;
    transition:background .26s,color .26s,border-color .26s}
  .doc-acoes .go:hover,.doc-acoes .ver:hover{background:var(--cream);
    color:var(--fundo);border-color:var(--cream)}
  .doc-acoes .ver{border-color:var(--cream)}
  .nota{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:22px;max-width:64ch}
  .nota b{color:var(--soft);font-weight:500}

  footer{margin-top:clamp(48px,9vh,96px);padding:24px clamp(20px,6vw,72px);
    border-top:1px solid var(--hair);display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--cream)}

  /* ── leitor de markdown ───────────────────────────────── */
  #leitor{--acento:var(--terra);position:fixed;inset:0;background:var(--cream);color:var(--ink);z-index:60;
    display:none;flex-direction:column;
    background-image:radial-gradient(#211D1A22 .5px,transparent .5px);background-size:24px 24px}
  #leitor.on{display:flex}
  .lbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px clamp(18px,5vw,54px);border-bottom:1px solid #211D1A22;background:#EDE6DAee}
  .lbar .qual{font-family:var(--mono);font-style:italic;font-weight:500;
    text-transform:lowercase;letter-spacing:-.03em;font-size:17px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbar a,.lbar button{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:#211D1A99;background:none;border:0;cursor:pointer;
    text-decoration:none;padding:4px;transition:color .25s}
  .lbar a:hover,.lbar button:hover{color:var(--terra)}
  .lbar .acoes2{display:flex;align-items:center;gap:18px;flex-shrink:0}
  .lbar .fechar{color:var(--ink)}
  .folha{flex:1;overflow-y:auto;padding:clamp(28px,6vh,64px) clamp(18px,5vw,54px) 90px}
  .doc{max-width:74ch;margin:0 auto;font-size:15px;line-height:1.72;color:#211D1Acc}
  .doc h1,.doc h2,.doc h3{font-family:var(--mono);font-style:italic;font-weight:500;
    text-transform:lowercase;letter-spacing:-.03em;color:var(--ink);line-height:1.2}
  .doc h1{font-size:clamp(28px,4vw,42px);margin:0 0 26px}
  .doc h2{font-size:clamp(21px,2.6vw,28px);margin:52px 0 16px;padding-top:20px;border-top:1px solid #211D1A22}
  .doc h3{font-size:17px;margin:32px 0 12px;font-style:normal;font-weight:400;
    text-transform:uppercase;letter-spacing:.14em;color:#6B6A4B}
  .doc p{margin:0 0 16px}
  .doc strong{font-weight:600;color:var(--ink)}
  .doc a{color:#6B6A4B;text-decoration:underline;text-underline-offset:3px}
  .doc ul,.doc ol{margin:0 0 18px;padding-left:22px}
  .doc li{margin-bottom:7px}
  .doc ul{list-style:none;padding-left:0}
  .doc ul>li{position:relative;padding-left:22px}
  .doc ul>li::before{content:"—";position:absolute;left:0;color:var(--terra);font-family:var(--mono)}
  .doc blockquote{border-left:2px solid var(--terra);padding:2px 0 2px 18px;margin:0 0 18px;color:#211D1A99}
  .doc hr{border:0;border-top:1px solid #211D1A22;margin:34px 0}
  .doc code{font-family:var(--mono);font-size:.88em;background:#211D1A0d;padding:1px 5px;border-radius:2px;color:var(--ink)}
  .doc pre{background:#211D1A0d;border:1px solid #211D1A22;padding:16px 18px;overflow-x:auto;margin:0 0 20px}
  .doc pre code{background:none;padding:0;font-size:12.5px;line-height:1.6;display:block}
  .doc table{width:100%;border-collapse:collapse;margin:0 0 22px;font-size:13.5px}
  .doc th{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:#6B6A4B;text-align:left;font-weight:400;padding:0 12px 9px 0;border-bottom:1px solid #211D1A22}
  .doc td{padding:11px 12px 11px 0;border-bottom:1px solid #211D1A1a;vertical-align:top}
  .doc td:last-child,.doc th:last-child{padding-right:0}
  .aviso{padding:50px 0;color:#211D1A99;font-size:14px}

  @media (max-width:860px){
    .arquivo{grid-template-columns:1fr;gap:26px}
    .projetos{flex-direction:row;flex-wrap:wrap;gap:8px}
    .projetos button{width:auto}
    .pecas{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:24px}
  }
  @media (max-width:620px){
    .peca{grid-template-columns:auto 1fr;row-gap:14px}
    .acoes{grid-column:1/-1;justify-content:flex-start;gap:22px}
  }
  /* sistema: em tela estreita o texto corre inteiro e os botoes descem */
  @media (max-width:760px){
    .doc-linha{grid-template-columns:26px 1fr;column-gap:14px;row-gap:14px;
      align-items:start;padding:16px clamp(14px,2vw,22px)}
    .doc-item .g{padding-top:3px}
    .doc-item .nm{font-size:18px}
    .doc-item .ds{margin-top:5px;line-height:1.55;max-width:52ch}
    .doc-acoes{grid-column:2/-1;justify-content:flex-start;flex-wrap:wrap;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="msfundo" aria-hidden="true"></canvas>
<div id="msveu" aria-hidden="true"></div>

<nav>
  <a class="brand mark" href="https://michel-stein.netlify.app/">michel stein<span class="tr">_</span></a>
  <a class="back" href="https://michel-stein.netlify.app/">michelstein.com.br</a>
</nav>

<main>
  <p class="eyebrow">arquivo de projeto</p>
  <h1 class="tit mark">apresentações<span class="tr">_</span></h1>
  <p class="lede">Estudos e projetos em prancha única, para ler no navegador.
    Cada linha abre sempre a versão mais recente.</p>

  <div class="abas" role="tablist" aria-label="seções" data-sel="0">
    <span class="knob" aria-hidden="true"></span>
    <button class="aba" role="tab" id="t-arquivo" aria-controls="p-arquivo" aria-selected="true">arquivo</button>
    <button class="aba" role="tab" id="t-sistema" aria-controls="p-sistema" aria-selected="false">sistema</button>
  </div>

  <section class="painel" id="p-arquivo" role="tabpanel" aria-labelledby="t-arquivo">
    <div class="arquivo">
      <div>
        <p class="col-lbl">projetos</p>
        <ul class="projetos" id="lista-projetos"></ul>
      </div>
      <div>
        <p class="col-lbl">apresentação</p>
        <div id="orfas"></div>
        <div class="pecas" id="lista-pecas"></div>
      </div>
    </div>
  </section>

  <section class="painel" id="p-sistema" role="tabpanel" aria-labelledby="t-sistema" hidden>
    <div id="lista-docs"></div>
    <p class="nota" id="nota-docs"></p>
  </section>
</main>

<footer>
  <span class="mark" style="font-size:13px;text-transform:none">michel stein<span class="tr">_</span>arquiteto</span>
  <a href="https://github.com/steinvalente-dev/apresentacoes" target="_blank" rel="noopener">repositório</a>
</footer>

<div id="leitor" role="dialog" aria-modal="true" aria-labelledby="qual">
  <div class="lbar">
    <span class="qual mark" id="qual"></span>
    <span class="acoes2">
      <a id="bruto" href="#" target="_blank" rel="noopener">markdown</a>
      <button class="fechar" id="fechar">fechar ✕</button>
    </span>
  </div>
  <div class="folha"><div class="doc" id="doc"></div></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   ARQUIVO — agrupado por projeto

   Peça nova: acrescentar UM objeto em `pecas` do projeto certo.
   Projeto novo: acrescentar UM objeto a `projetos`.

   Campos da peça, os quatro sempre:
     nome      o que é a peça, minúsculas
     pranchas  quantas pranchas o deck tem
     unid      opcional; troca o rótulo "pranchas" (a lavrō conta em "telas")
     peso      MB do arquivo NO DISCO, não o transferido. O Pages comprime:
               a casa ITTB são 11,9 MB no disco e 9,3 MB no fio. Quem vai
               mandar por e-mail ou WhatsApp precisa do primeiro número.
     data      DD.MM.AAAA
     tipo      opcional; "sistema" manda a peça para o bloco de baixo,
               "sistema visual" — interativos e demais grafismos do projeto
     sub       opcional; texto curto no lugar da contagem de pranchas,
               para peça que não é deck ("interativo")
   Não escrever número: 01, 02 saem da ordem, mais recente em cima.
   `oculto:true` esconde sem apagar o registro.
   ───────────────────────────────────────────────────────────── */
const BASE = "https://steinvalente-dev.github.io/apresentacoes/";

const projetos = [
  {
    nome: "lavrō",
    pecas: [
      { nome: "apresentação institucional", pranchas: 15, unid: "telas", peso: 0.36,
        data: "23.08.2026", href: "lavro/apresentacao.html" }
    ]
  },
  {
    nome: "AMAZ",
    pecas: [
      { nome: "protótipo · os três pilares do produto", pranchas: 2, peso: 1.9,
        data: "25.08.2026", href: "amaz-pilares/apresentacao.html" },
      { nome: "protótipo · convergência dos sócios", pranchas: 2, peso: 2.4,
        data: "25.08.2026", href: "amaz-convergencia/apresentacao.html" },
      { nome: "identidade visual", pranchas: 9, unid: "seções", peso: 3.5,
        data: "23.08.2026", href: "amaz-identidade/apresentacao.html" },
      { nome: "grafismo · marchetaria", pranchas: 9, unid: "seções", peso: 0.15,
        data: "23.08.2026", href: "amaz-grafismo/apresentacao.html" },
      { nome: "apresentação institucional", pranchas: 37, peso: 0.16,
        data: "23.08.2026", href: "amaz/apresentacao.html" },
      { nome: "marchetaria · laboratório", tipo: "sistema", sub: "interativo",
        peso: 0.050, data: "23.08.2026", href: "amaz-marchetaria/tabuas.html" },
      { nome: "marchetaria · vocabulário", tipo: "sistema", sub: "interativo",
        peso: 0.035, data: "23.08.2026", href: "amaz-marchetaria/campo-quadrado.html" }
    ]
  },
  {

(function(){

    history.replaceState(null, '', sis ? '#sistema' : '#arquivo');

/* ── arquivo ─────────────────────────────────────────────── */
(function(){
  const visiveis = projetos.filter(function(p){ return !p.oculto; });
  const elProj = document.getElementById('lista-projetos');
  const elPec  = document.getElementById('lista-pecas');
  let atual = 0;

  elProj.innerHTML = visiveis.map(function(p, k){
    const n = p.pecas.filter(function(x){ return !x.oculto; }).length;
    return '<li><button data-k="' + k + '" aria-current="' + (k===0) + '">'
      + p.nome + '<span class="qt">' + (n || '—') + '</span></button></li>';
  }).join('');

  /* ficha da peça: pranchas · peso · data, nessa ordem, sempre.
     Peso acima de 8 MB ganha marca — passa do limite de anexo de e-mail. */
  function ficha(x){
    const p = [];
    if(x.sub) p.push(x.sub);
    if(x.pranchas) p.push(x.pranchas + ' ' + (x.unid || 'pranchas'));
    if(x.peso){
      const n = x.peso < 0.1
        ? Math.round(x.peso * 1024) + ' kB'
        : (x.peso >= 10 ? x.peso.toFixed(0) : x.peso.toFixed(1).replace('.', ',')) + ' MB';
      p.push('<span class="' + (x.peso > 8 ? 'pesada' : '') + '">' + n + '</span>');
    }
    if(x.data) p.push(x.data);
    return p.join(' <i>·</i> ');
  }

  function pinta(){
    const p = visiveis[atual];
    const lista = p.pecas.filter(function(x){ return !x.oculto; });
    if(!lista.length){
      elPec.innerHTML = '<div class="vazio"><b>Nenhuma peça publicada ainda.</b><br>'
        + 'Quando a apresentação deste projeto entrar no ar, ela aparece aqui.</div>';
      return;
    }
    /* Dois blocos dentro do projeto: as apresentações em cima, na
       sequência de sempre, e embaixo as peças de sistema — os
       interativos e demais grafismos. `tipo:"sistema"` põe a peça no
       segundo bloco. O separador é o mesmo .grupo da aba sistema.
       A numeração é por bloco, mais recente em cima, como antes. */
    function cartao(x, i, n){
      const num = String(n - i).padStart(2, '0');
      const url = BASE + x.href;
      return '<article class="peca">'
        + '<span class="n">' + num + '</span>'
        + '<span><span class="nome">' + x.nome + '</span>'
        + '<span class="sub">' + ficha(x) + '</span></span>'
        + '<span class="acoes">'
        +   '<button class="copiar" data-url="' + url + '">copiar link</button>'
        +   '<a class="abrir" href="' + x.href + '" target="_blank" rel="noopener">abrir ' + SETA + '</a>'
        + '</span></article>';
    }
    const blocos = [
      { rot: '',               itens: lista.filter(function(x){ return x.tipo !== 'sistema'; }) },
      { rot: 'sistema visual', itens: lista.filter(function(x){ return x.tipo === 'sistema'; }) }
    ];
    elPec.innerHTML = blocos.map(function(bl){
      if(!bl.itens.length) return '';
      return (bl.rot ? '<p class="grupo">' + bl.rot + '</p>' : '')
        + bl.itens.map(function(x, i){ return cartao(x, i, bl.itens.length); }).join('');
    }).join('');
  }
  pinta();

  elProj.addEventListener('click', function(e){
    const b = e.target.closest('button[data-k]');
    if(!b) return;
    atual = Number(b.dataset.k);
    elProj.querySelectorAll('button').forEach(function(x){
      x.setAttribute('aria-current', x === b ? 'true' : 'false');
    });
    pinta();
  });

  elPec.addEventListener('click', function(e){
    const b = e.target.closest('button.copiar');
    if(!b) return;
    const volta = function(){
      b.textContent = 'copiado';
      b.classList.add('copiado');
      setTimeout(function(){ b.textContent = 'copiar link'; b.classList.remove('copiado'); }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(b.dataset.url).then(volta, function(){ b.textContent = 'copie da barra'; });
    }else{
      const t = document.createElement('textarea');
      t.value = b.dataset.url; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); volta(); }catch(err){ b.textContent = 'copie da barra'; }
      document.body.removeChild(t);
    }
  });
})();

/* ── detector de peça órfã ───────────────────────────────────
   Três Projetos publicam neste mesmo repositório, e cada um precisa lembrar
   de registrar a peça no array acima. Esquecer não dá sintoma: o arquivo fica
   no ar e ninguém acha. Aqui a árvore do repositório é comparada com o que
   está listado, e o que sobra aparece como aviso.
   A API pública limita a 60 chamadas por hora por IP — se falhar, silencia. */
(function(){
  const IGNORA = ['index.html', 'sistemas/', 'modulos/', 'fundo/'];
  const listados = new Set();
  projetos.forEach(function(p){
    p.pecas.forEach(function(x){ listados.add(x.href.split('?')[0]); });
  });

  fetch('https://api.github.com/repos/steinvalente-dev/apresentacoes/git/trees/main?recursive=1')
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      const orfas = (d.tree || [])
        .filter(function(x){ return x.type === 'blob' && x.path.endsWith('.html'); })
        .map(function(x){ return x.path; })
        .filter(function(p){
          return !IGNORA.some(function(i){ return p === i || p.startsWith(i); })
              && !listados.has(p);
        });
      if(!orfas.length) return;
      document.getElementById('orfas').innerHTML =
        '<div class="orfas"><b>' + orfas.length + ' peça' + (orfas.length > 1 ? 's' : '')
        + ' no repositório sem registro no índice.</b><br>'
        + orfas.map(function(p){ return '<code>' + p + '</code>'; }).join('<br>')
        + '<br>Está no ar, mas ninguém acha por aqui — falta o objeto em <code>pecas</code>.</div>';
    })
    .catch(function(){ /* limite da API ou sem rede: o aviso é auxílio, não requisito */ });
})();

/* ── leitor de markdown ──────────────────────────────────── */
(function(){
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    return s
      .replace(/`([^`]+)`/g, function(m,c){ return '<code>'+c+'</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(txt){
    const L = esc(txt.replace(/\r/g,'')).split('\n');
    let out = '', i = 0, buf = [];
    function solta(){ if(buf.length){ out += '<p>' + inline(buf.join(' ')) + '</p>'; buf = []; } }
    while(i < L.length){
      const l = L[i];
      if(/^```/.test(l)){
        solta(); i++;
        let c = [];
        while(i < L.length && !/^```/.test(L[i])){ c.push(L[i]); i++; }
        i++; out += '<pre><code>' + c.join('\n') + '</code></pre>'; continue;
      }
      if(/^\s*$/.test(l)){ solta(); i++; continue; }
      if(/^(-{3,}|_{3,}|\*{3,})\s*$/.test(l)){ solta(); out += '<hr>'; i++; continue; }
      if(/^#{1,6}\s/.test(l)){
        solta();
        const n = Math.min(l.match(/^#+/)[0].length, 3);
        out += '<h'+n+'>' + inline(l.replace(/^#+\s*/,'')) + '</h'+n+'>'; i++; continue;
      }
      if(/^\s*&gt;\s?/.test(l)){
        solta(); let q = [];
        while(i < L.length && /^\s*&gt;\s?/.test(L[i])){ q.push(L[i].replace(/^\s*&gt;\s?/,'')); i++; }
        out += '<blockquote>' + inline(q.join(' ')) + '</blockquote>'; continue;
      }
      if(/^\|/.test(l) && i+1 < L.length && /^\|[\s:|-]+\|?\s*$/.test(L[i+1])){
        solta();
        const cel = function(r){ return r.replace(/^\||\|$/g,'').split('|').map(function(c){ return inline(c.trim()); }); };
        const cab = cel(l); i += 2;
        let corpo = '';
        while(i < L.length && /^\|/.test(L[i])){
          corpo += '<tr>' + cel(L[i]).map(function(c){ return '<td>'+c+'</td>'; }).join('') + '</tr>'; i++;
        }
        out += '<table><thead><tr>' + cab.map(function(c){ return '<th>'+c+'</th>'; }).join('')
             + '</tr></thead><tbody>' + corpo + '</tbody></table>';
        continue;
      }
      if(/^\s*\d+[.)]\s+/.test(l)){
        solta(); let li = '';
        while(i < L.length && /^\s*\d+[.)]\s+/.test(L[i])){
          let t = L[i].replace(/^\s*\d+[.)]\s+/,''); i++;
          while(i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*\d+[.)]\s/.test(L[i])){ t += ' ' + L[i].trim(); i++; }
          li += '<li>' + inline(t) + '</li>';
        }
        out += '<ol>' + li + '</ol>'; continue;
      }
      if(/^\s*[-*+]\s+/.test(l)){
        solta(); let li = '';
        while(i < L.length && /^\s*[-*+]\s+/.test(L[i])){
          let t = L[i].replace(/^\s*[-*+]\s+/,''); i++;
          while(i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*[-*+]\s/.test(L[i])){ t += ' ' + L[i].trim(); i++; }
          li += '<li>' + inline(t) + '</li>';
        }
        out += '<ul>' + li + '</ul>'; continue;
      }
      buf.push(l.trim()); i++;
    }
    solta();
    return out;
  }

  const leitor = document.getElementById('leitor');
  const doc = document.getElementById('doc');
  const qual = document.getElementById('qual');
  const bruto = document.getElementById('bruto');
  let volta = null;

  function abrir(arq, nome, btn){
    volta = btn || null;
    qual.textContent = nome;
    bruto.href = 'https://github.com/steinvalente-dev/apresentacoes/blob/main/' + arq;
    doc.innerHTML = '<p class="aviso">carregando…</p>';
    leitor.classList.add('on');
    document.body.style.overflow = 'hidden';
    document.getElementById('fechar').focus();
    fetch(arq, {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(t){ doc.innerHTML = md(t); doc.parentElement.scrollTop = 0; })
      .catch(function(){
        doc.innerHTML = '<p class="aviso"><b>Não deu para abrir o arquivo.</b> '
          + 'Ele pode ter sido renomeado ou ainda não estar publicado. O botão '
          + '<em>markdown</em>, ali em cima, leva ao original no GitHub.</p>';
      });
  }
  function fechar(){
    leitor.classList.remove('on');
    document.body.style.overflow = '';
    if(volta) volta.focus();
  }
  document.getElementById('lista-docs').addEventListener('click', function(e){
    const b = e.target.closest('button[data-arq]');
    if(b) abrir(b.dataset.arq, b.dataset.nome, b);
  });
  document.getElementById('fechar').addEventListener('click', fechar);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && leitor.classList.contains('on')) fechar();
  });
})();
</script>

<script>
/* fundo morph — nove peças a 640px WebP, já pré-expostas no arquivo (prep:false)
   e em ordem sorteada, para cada abertura começar por um par diferente.
   Sobe fora do caminho crítico; sem WebGL2 a página fica chapada, que é estado
   aceitável. A engine já auto-pausa por visibilidade.                          */
const FUNDO_V = 2;   /* subir ao trocar qualquer peça: o Pages serve com max-age=600 */
(function(){
  function sobe(){
    if(!window.MSFundo) return;
    try{
      const sis = document.body.classList.contains('sistema');
      window.MSF = MSFundo.montar(
        document.getElementById('msfundo'),
        ['01','02','03','04','05','06','07','08','09']
          .map(function(n){ return 'fundo/'+n+'.webp?v=' + FUNDO_V; }),
        { paper: sis ? '#B85C38' : '#6B6A4B',
          acc:   sis ? '#211D1A' : '#B85C38',
          scale: 0.85, prep: false, sortear: true }
      );
      window.MSF.entrada();
    }catch(e){ /* fundo é enfeite: falhar aqui não pode derrubar a página */ }
  }
  if('requestIdleCallback' in window) requestIdleCallback(sobe,{timeout:1200});
  else addEventListener('load',function(){ setTimeout(sobe,120); });
})();
</script>
