<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AMAZ — marchetaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MARCHETARIA — o azulejo em madeira
   ------------------------------------------------------------
   Mesma gramática do azulejo, mesma semente, mesmas 5 regras.
   O que muda é a matéria: o corte de cada célula deixa de ser
   uma linha e passa a ser a junta entre duas madeiras.

     arco  →  anéis de crescimento centrados no VÉRTICE.
              Como o centro é vértice de grelha, a família de
              anéis continua nas células vizinhas: dois arcos
              convergindo fazem meia tora, três fazem a tora
              quase inteira — atravessando blocos.
     reta  →  feixe de fibras. A reta que fecha o três-quartos
              irradia do centro: é a fenda radial da tora.
     olho  →  nó, com as fibras desviando em volta. Só em reta.

   Paleta: Mata Fechada (identidade AMAZ, rodada 03). Os tons de
   bloco são a própria paleta em opacidade sobre a base — nenhuma
   cor nova. Cobre não entra na textura: é acento de tipo.

   Escolhas do Michel em 23.08.2026:
     par     Mata funda (o verde mais escuro) — é o padrão
     veio    madeira; desenhado como segunda opção
             geométrico descartado
   O par elétrico segue no arquivo só como comparação: o azul pode
   voltar mais adiante, para equilibrar a precisão da industrialização
   contra a madeira. Não é decisão deste protótipo.
   ============================================================ */
:root{
  /* Mata Fechada — rodada 03 */
  --tiber:#06392F;      /* base           */
  --mata:#04251F;       /* superfície     */
  --cobre:#B95118;      /* acento         */
  --areia:#D9C9A3;      /* apoio          */
  --papel:#F4F1EA;      /* fundo claro    */
  --eletrico:#0123FF;   /* Lavrō, só para comparar */
  --t-ui:220ms; --t-entra:560ms;
  --e-saida:cubic-bezier(.25,.7,.3,1);
  --e-ui:cubic-bezier(.3,.8,.3,1);
  --f-display:'Bricolage Grotesque',sans-serif;   /* face de display da AMAZ */
  --f-corpo:'Inter',sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
}
/* ---------- os pares: fundo · madeira clara · madeira escura ·
     veio · junta. O tom do bloco é sempre a paleta em alfa. ---------- */
body[data-tema="mata"]{
  --bg:#04251F;
  --tomA:rgba(217,201,163,.130);   /* Areia sobre a base */
  --tomB:rgba(217,201,163,.028);
  --veio:rgba(217,201,163,.30);
  --junta:rgba(217,201,163,.10);
  --veu:rgba(4,37,31,.74);
  --tit:#F4F1EA; --txt:rgba(244,241,234,.66); --kick:rgba(244,241,234,.44);
  --acento:#B95118; --borda-ui:rgba(244,241,234,.28);
}
body[data-tema="papel"]{
  --bg:#F4F1EA;
  --tomA:rgba(6,57,47,.090);       /* Tiber sobre o papel */
  --tomB:rgba(6,57,47,.020);
  --veio:rgba(6,57,47,.36);
  --junta:rgba(6,57,47,.13);
  --veu:rgba(244,241,234,.76);
  --tit:#04251F; --txt:rgba(4,37,31,.72); --kick:rgba(4,37,31,.48);
  --acento:#B95118; --borda-ui:rgba(4,37,31,.24);
}
body[data-tema="tiber"]{
  --bg:#06392F;
  --tomA:rgba(217,201,163,.150);
  --tomB:rgba(217,201,163,.032);
  --veio:rgba(217,201,163,.32);
  --junta:rgba(217,201,163,.11);
  --veu:rgba(6,57,47,.68);
  --tit:#F4F1EA; --txt:rgba(244,241,234,.78); --kick:rgba(244,241,234,.56);
  --acento:#D9C9A3;                /* sobre Tiber o Cobre escurece: sobe p/ Areia */
  --borda-ui:rgba(244,241,234,.42);
}
/* quarta opção, só para comparação de marca — não é paleta AMAZ */
body[data-tema="eletrico"]{
  --bg:#0123FF;
  --tomA:rgba(255,255,255,.13);
  --tomB:rgba(255,255,255,.05);
  --veio:rgba(255,255,255,.32);
  --junta:rgba(255,255,255,.12);
  --veu:rgba(1,25,190,.60);
  --tit:#FFFFFF; --txt:rgba(255,255,255,.78); --kick:rgba(255,255,255,.60);
  --acento:#FFFFFF; --borda-ui:rgba(255,255,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tit);
  font-family:var(--f-corpo);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color var(--t-ui) var(--e-ui);
}
/* ---------- a textura ---------- */
#tex{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#tomA{fill:var(--tomA);stroke:none}
#tomB{fill:var(--tomB);stroke:none}
#veio{fill:none;stroke:var(--veio);stroke-width:1.05;stroke-linecap:round;
      vector-effect:non-scaling-stroke}
#junta{fill:none;stroke:var(--junta);stroke-width:1;vector-effect:non-scaling-stroke}
#fenda{fill:none;stroke:var(--veio);stroke-width:1.7;stroke-linecap:round;opacity:.85;
       vector-effect:non-scaling-stroke}
#tomA,#tomB,#veio,#junta,#fenda{transition:fill var(--t-ui) var(--e-ui),stroke var(--t-ui) var(--e-ui)}
.veu{position:fixed;inset:0;z-index:2;pointer-events:none;
     background:linear-gradient(104deg,var(--veu) 0%,rgba(0,0,0,0) 66%);
     transition:background var(--t-ui) var(--e-ui)}
/* ---------- conteúdo ---------- */
.abertura{
  position:relative;z-index:3;height:100%;
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;
  padding:clamp(40px,7vw,120px);
  padding-right:clamp(40px,22vw,340px);
}
.marca-mono{
  font-family:var(--f-mono);font-weight:500;
  font-size:clamp(12px,1.15vw,15px);
  letter-spacing:.34em;text-transform:uppercase;
  color:var(--kick);margin-bottom:clamp(20px,3.4vh,40px);
}
.marca-mono b{font-weight:500;color:var(--acento)}
h1{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(44px,8.2vw,132px);
  line-height:1.0;letter-spacing:-.035em;max-width:14em;
}
.ac{position:relative;display:inline-block;color:var(--acento)}
/* sobre a cor de marca da Lavrō o acento é branco e precisa da
   barra para não se perder no texto branco. Na AMAZ não: o Cobre
   (e a Areia sobre Tiber) já é outro matiz, não aponta para si. */
body[data-tema="eletrico"] .ac::after{
  content:'';position:absolute;left:1.5%;right:1.5%;bottom:-.13em;
  height:.07em;border-radius:2px;background:currentColor;
}
.apoio{
  margin-top:clamp(22px,3.6vh,42px);
  font-size:clamp(15px,1.45vw,21px);line-height:1.55;
  color:var(--txt);max-width:34em;
}
.rev{opacity:0;transform:translateY(16px);animation:sobe var(--t-entra) var(--e-saida) forwards}
.r1{animation-delay:140ms}.r2{animation-delay:260ms}.r3{animation-delay:420ms}
@keyframes sobe{to{opacity:1;transform:none}}
/* A entrada da textura NÃO anima a opacidade do SVG: isso obriga o
   navegador a re-rasterizar as dezenas de milhares de coordenadas a cada
   quadro (medido: 4 fps num campo de 1920×1080). Em vez disso, uma
   cortina de cor sólida por cima se abre — é composição pura. */
.cortina{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:var(--bg);
  animation:abre 900ms var(--e-saida) forwards;
}
@keyframes abre{to{opacity:0}}
/* ---------- controles ---------- */
.painel{position:fixed;top:22px;right:22px;z-index:6;
        display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.temas{display:flex;gap:10px}
.tema-btn{width:22px;height:22px;border-radius:999px;border:1px solid var(--borda-ui);
          cursor:pointer;padding:0;transition:transform 120ms var(--e-ui),box-shadow var(--t-ui);
          -webkit-tap-highlight-color:transparent}
.tema-btn:active{transform:scale(.9)}
.tema-btn.on{box-shadow:0 0 0 2px var(--borda-ui)}
.tema-btn[data-tema="mata"]{background:#04251F}
.tema-btn[data-tema="papel"]{background:#F4F1EA}
.tema-btn[data-tema="tiber"]{background:#06392F}
.tema-btn[data-tema="eletrico"]{background:#0123FF}
.veios{display:flex;gap:6px}
.veio-btn{
  font-family:var(--f-mono);font-size:9.5px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--kick);background:none;cursor:pointer;
  border:1px solid var(--borda-ui);border-radius:999px;
  padding:.35em .7em;transition:color var(--t-ui),border-color var(--t-ui);
  -webkit-tap-highlight-color:transparent;
}
.veio-btn.on{color:var(--tit);border-color:var(--tit)}
/* ---------- rodapé ---------- */
.rodape{
  position:fixed;right:22px;bottom:20px;z-index:6;
  font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--kick);text-align:right;
}
.rodape b{font-weight:500;color:var(--txt)}
.rodape button{
  font:inherit;letter-spacing:inherit;text-transform:inherit;
  color:var(--acento);background:none;border:none;cursor:pointer;padding:0;
  border-bottom:1px solid currentColor;
}
/* ---------- vocabulário ---------- */
.voc{
  position:fixed;inset:0;z-index:9;
  background:var(--bg);
  padding:clamp(26px,4vw,58px);
  overflow-y:auto;
  opacity:0;visibility:hidden;
  transition:opacity var(--t-ui) var(--e-ui),visibility 0s linear var(--t-ui);
}
.voc.aberto{opacity:1;visibility:visible;transition:opacity var(--t-entra) var(--e-saida)}
.voc h2{
  font-family:var(--f-mono);font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--kick);
  margin-bottom:clamp(18px,3vh,32px);
}
.voc-grid{
  display:grid;gap:clamp(16px,2.4vw,32px);
  grid-template-columns:repeat(3,minmax(0,1fr));
  max-width:1400px;
}
.peca .quadro{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
               border:1px solid var(--junta);overflow:hidden}
.peca svg{display:block;max-width:100%;max-height:100%}
.peca .nome{
  font-family:var(--f-display);font-weight:700;
  font-size:clamp(15px,1.4vw,19px);margin-top:.7em;
}
.peca .nome em{font-style:normal;color:var(--acento)}
.peca .desc{
  font-size:clamp(12.5px,1.05vw,14.5px);line-height:1.5;
  color:var(--txt);margin-top:.35em;
}
.peca .cod{
  font-family:var(--f-mono);font-size:9.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--kick);
}
.voc-fechar{
  position:fixed;top:22px;right:22px;z-index:10;
  font-family:var(--f-mono);font-size:10px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--kick);background:none;border:1px solid var(--borda-ui);
  border-radius:999px;padding:.5em 1em;cursor:pointer;
}
@media (max-width:1020px){ .voc-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .voc-grid{grid-template-columns:1fr} }
@media (max-width:700px){
  .abertura{padding-right:clamp(40px,7vw,120px)}
  .rodape{left:22px;right:auto;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rev{opacity:1!important;transform:none!important}
  .cortina{display:none}
}
</style>
</head>
<body data-tema="mata">
<svg id="tex" aria-hidden="true">
  <path id="tomA"/><path id="tomB"/><path id="junta"/><path id="veio"/><path id="fenda"/>
</svg>
<div class="cortina" aria-hidden="true"></div>
<div class="veu" aria-hidden="true"></div>
<div class="painel">
  <div class="temas" aria-label="Par de fundo e madeira">
    <button class="tema-btn on" data-tema="mata" aria-label="Mata funda"></button>
    <button class="tema-btn" data-tema="papel" aria-label="Papel"></button>
    <button class="tema-btn" data-tema="tiber" aria-label="Tiber"></button>
    <button class="tema-btn" data-tema="eletrico" aria-label="Elétrico (Lavrō, comparação)"></button>
  </div>
  <div class="veios" aria-label="Corte do veio">
    <button class="veio-btn on" data-org="0.55">madeira</button>
    <button class="veio-btn" data-org="1.1">desenhado</button>
  </div>
</div>
<main class="abertura">
  <p class="marca-mono rev r1">AM<b>A</b>Z</p>
  <h1 class="rev r2">Uma <span class="ac">clareira</span><br>no caos.</h1>
  <p class="apoio rev r3">Vilas de casas em madeira engenheirada, em bairros
  consolidados de São Paulo. Uma vila de cada vez.</p>
</main>
<p class="rodape">semente <b id="oSemente">—</b><br><span id="oMix">—</span> ·
  <button id="btnVoc">vocabulário</button></p>
<section class="voc" id="voc" aria-hidden="true">
  <h2>Marchetaria · vocabulário de peças</h2>
  <div class="voc-grid" id="vocGrid"></div>
</section>
<button class="voc-fechar" id="btnFechar" style="display:none">fechar</button>
<script>
(function(){
  'use strict';
  /* ==========================================================
     MOTOR — idêntico ao do azulejo. As 5 regras não mudaram.
       R1 nenhuma peça idêntica em trinca (linha, coluna, canto 2×2)
       R2 três-quartos nunca fica "quase": a quarta célula recebe a
          reta que irradia do centro — em madeira, a fenda radial
       R3 convergência: dois arcos cercando um vértice pesam ×9
       R4 tora inteira NUNCA (é da janela do wordmark)
       R5 reta não encosta em reta nas 8 vizinhanças
     Prioridade: R4 e R5 invioláveis; colidindo com R2, entra um
     arco que se afasta.
     ========================================================== */
  var svg = document.getElementById('tex');
  var pTomA = document.getElementById('tomA'), pTomB = document.getElementById('tomB');
  var pVeio = document.getElementById('veio'), pJunta = document.getElementById('junta');
  var pFenda = document.getElementById('fenda');
  var elSemente = document.getElementById('oSemente'), elMix = document.getElementById('oMix');
  var ORG = 0.55;             /* .55 madeira (padrão) · 1.1 desenhado.
                                O geométrico (irregularidade zero) foi descartado
                                pelo Michel em 23.08.2026. */

  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function ehReta(p){ return !!p && p.charAt(0) === 'd'; }

  /* ---------- sorteio da grade (as 5 regras) ---------- */
  function sorteiaGrade(semente, cols, lins){
    var rnd = mulberry32(semente), g = [], rad = [], nRetas = 0, nCel = 0, wReta = 1;
    function em(i, j){ if (j < 0 || i < 0 || !g[j]) return null; return g[j][i] || null; }
    function vArco(i, j, p){
      if (p === 'a0') return i + ',' + j;
      if (p === 'a1') return (i + 1) + ',' + j;
      if (p === 'a2') return (i + 1) + ',' + (j + 1);
      if (p === 'a3') return i + ',' + (j + 1);
      return null;
    }
    function nArcos(vi, vj){
      var v = vi + ',' + vj, n = 0;
      for (var dj = -1; dj <= 0; dj++) for (var di = -1; di <= 0; di++){
        var p = em(vi + di, vj + dj);
        if (p && p.charAt(0) === 'a' && vArco(vi + di, vj + dj, p) === v) n++;
      }
      return n;
    }
    function irradia(i, j, p, v){
      if (p === 'd0') return v === i + ',' + j || v === (i + 1) + ',' + (j + 1);
      if (p === 'd1') return v === (i + 1) + ',' + j || v === i + ',' + (j + 1);
      return false;
    }
    function sorteia(pares){
      var soma = 0, k;
      for (k = 0; k < pares.length; k++) soma += pares[k][1];
      var alvo = rnd() * soma;
      for (k = 0; k < pares.length; k++){ alvo -= pares[k][1]; if (alvo <= 0) return pares[k][0]; }
      return pares[pares.length - 1][0];
    }
    for (var j = 0; j < lins; j++){
      g[j] = []; rad[j] = [];
      for (var i = 0; i < cols; i++){
        var esq = em(i-1,j), cima = em(i,j-1), diag = em(i-1,j-1), diagD = em(i+1,j-1);
        var esq2 = em(i-2,j), cima2 = em(i,j-2);
        var okTrinca = function(q){
          if (esq === q && cima === q) return false;
          if (esq === q && diag === q) return false;
          if (cima === q && diag === q) return false;
          if (esq === q && esq2 === q) return false;
          if (cima === q && cima2 === q) return false;
          return true;
        };
        var retaViz = ehReta(esq) || ehReta(cima) || ehReta(diag) || ehReta(diagD);
        var vTL = i + ',' + j, nTL = nArcos(i, j), p;
        if (nTL === 3){
          if (!retaViz){ p = 'd0'; rad[j][i] = true; }  /* a fenda radial */
          else {
            var alt = ['a1','a2','a3'].filter(okTrinca);
            p = alt.length ? alt[Math.floor(rnd() * alt.length)] : 'a2';
          }
        } else {
          var pesos = { a0:1, a1:1, a2:1, a3:1, d0:wReta, d1:wReta };
          if (nTL === 2){
            var radial = false, viz = [[i-1,j-1],[i,j-1],[i-1,j]];
            for (var k = 0; k < viz.length; k++){
              var q = em(viz[k][0], viz[k][1]);
              if (!q) continue;
              if (q.charAt(0) === 'a' && vArco(viz[k][0], viz[k][1], q) === vTL) continue;
              if (irradia(viz[k][0], viz[k][1], q, vTL)) radial = true;
            }
            pesos.a0 = radial ? 9 : 0;
          }
          if (nArcos(i + 1, j) === 2){
            /* antevisão: o terceiro arco obriga a fenda radial na
               célula seguinte. Se a R5 já a barra lá, veta aqui. */
            pesos.a1 = ehReta(em(i + 2, j - 1)) ? 0 : pesos.a1 * 9;
          }
          var cand = ['a0','a1','a2','a3','d0','d1'], validos = [], q2;
          for (var m = 0; m < cand.length; m++){
            q2 = cand[m];
            if (pesos[q2] <= 0) continue;
            if (ehReta(q2) && retaViz) continue;
            if (!okTrinca(q2)) continue;
            validos.push([q2, pesos[q2]]);
          }
          if (!validos.length){
            for (var n2 = 0; n2 < 4; n2++) if (pesos[cand[n2]] > 0) validos.push([cand[n2], 1]);
            if (!validos.length) validos = [['a1',1],['a2',1],['a3',1]];
          }
          p = sorteia(validos);
        }
        g[j][i] = p; nCel++; if (ehReta(p)) nRetas++;
        wReta = Math.max(.2, Math.min(3, 1 + (0.22 - nRetas / nCel) * 12));
      }
    }
    /* A fenda radial pode aparecer por dois caminhos: a célula que
       fecha o vértice recebendo a reta (R2), ou uma reta já posta
       antes que irradia e permite o terceiro arco. Então marca-se
       depois, varrendo os vértices — assim nenhuma fenda fica sem
       ser reconhecida como fenda. */
    for (var vj = 1; vj < lins; vj++){
      for (var vi = 1; vi < cols; vi++){
        var v = vi + ',' + vj, cels = [[vi-1,vj-1],[vi,vj-1],[vi-1,vj],[vi,vj]];
        var arcos = [], fora = [], cc, pp, w;
        for (w = 0; w < 4; w++){
          cc = cels[w]; pp = em(cc[0], cc[1]);
          if (pp && pp.charAt(0) === 'a' && vArco(cc[0], cc[1], pp) === v) arcos.push(cc);
          else fora.push(cc);
        }
        if (arcos.length !== 3 || fora.length !== 1) continue;
        cc = fora[0]; pp = em(cc[0], cc[1]);
        if (pp && pp.charAt(0) === 'd' && irradia(cc[0], cc[1], pp, v)) rad[cc[1]][cc[0]] = true;
      }
    }
    return { grade: g, radial: rad, retas: nRetas, cels: nCel };
  }

  /* ==========================================================
     MATÉRIA — a madeira de cada bloco
     ========================================================== */
  /* sinal do eixo local (u,v) por peça: o vértice do arco é o
     canto TL/TR/BR/BL e a célula ocupa o quadrante à sua frente */
  var SG = { a0:[1,1], a1:[-1,1], a2:[-1,-1], a3:[1,-1] };
  function verticePx(i, j, p, cel){
    var x = i * cel, y = j * cel;
    if (p === 'a0') return [x, y];
    if (p === 'a1') return [x + cel, y];
    if (p === 'a2') return [x + cel, y + cel];
    return [x, y + cel];
  }
  /* ângulo GLOBAL do ponto local t — é o que faz a família de
     anéis casar entre células que compartilham o vértice */
  function thetaG(p, t){
    if (p === 'a0') return t;
    if (p === 'a1') return Math.PI - t;
    if (p === 'a2') return Math.PI + t;
    return -t;
  }
  /* a tora de cada vértice: espaçamento e irregularidade próprios,
     iguais para todas as células que a compartilham */
  function tora(vi, vj, semente, cache){
    var ch = vi + '_' + vj;
    if (cache[ch]) return cache[ch];
    var r = mulberry32((semente ^ (vi * 73856093) ^ (vj * 19349663)) | 0);
    /* anos de crescimento: espaçamento quase constante, com jitter
       curto. Em ~35% dos anos entra um segundo anel colado — é o
       lenho tardio, o que dá o listrado da ref. 07. */
    var nIn = 9 + Math.floor(r() * 5), fr = [], k, f;
    for (k = 1; k <= nIn; k++){
      f = Math.pow(k / nIn, .93) * (1 + (r() - .5) * .05);
      fr.push(f);
      if (r() < .35 && k < nIn) fr.push(f * 1.045);
    }
    fr[nIn - 1] = 1;                       /* o corte é sempre um anel */
    var nOut = 4 + Math.floor(r() * 3);
    for (k = 1; k <= nOut; k++){
      f = 1 + k * (.52 / nOut) * (1 + (r() - .5) * .07);
      fr.push(f);
      if (r() < .35) fr.push(f * 1.04);
    }
    fr.sort(function(a, b){ return a - b; });
    /* irregularidade: amplitude pequena, frequência alta — anel de
       árvore, não curva de nível */
    var t = { fr: fr, amp: .009 + r() * .013,
              f1: 3 + Math.floor(r() * 4), p1: r() * 6.2832,
              f2: 8 + Math.floor(r() * 7), p2: r() * 6.2832 };
    cache[ch] = t; return t;
  }
  function num(n){ return Math.round(n); }

  /* um anel dentro da célula. Raio > lado sai do quadrado: o ponto
     de fora é descartado (a serra aparou o anel no bloco). */
  function anel(p, vx, vy, cel, fr, t, org, fechado, fase){
    var s = SG[p], N = Math.max(6, Math.round(6 + 11 * Math.min(fr, 1.5))), pts = [], k;
    fase = fase || 0;
    for (k = 0; k <= N; k++){
      var lt = k / N * Math.PI / 2, th = thetaG(p, lt);
      var w = org * t.amp * (.62 * Math.sin(t.f1 * th + t.p1 + fase)
                           + .38 * Math.sin(t.f2 * th + t.p2 + fase * 1.7));
      var r = fr * cel * (1 + w);
      var u = r * Math.cos(lt), v = r * Math.sin(lt);
      if (fechado){                        /* o anel do corte: apara na borda */
        if (u > cel) u = cel;
        if (v > cel) v = cel;
      } else if (u > cel || v > cel) continue;
      pts.push([vx + s[0] * u, vy + s[1] * v]);
    }
    return pts;
  }
  function poli(pts){
    var d = 'M' + num(pts[0][0]) + ' ' + num(pts[0][1]) + 'L', k;
    for (k = 1; k < pts.length; k++) d += num(pts[k][0]) + ' ' + num(pts[k][1]) + ' ';
    return d;
  }

  /* feixe de fibras de uma reta, com nó opcional */
  function fibras(p, i, j, cel, org, semente, comOlho, fenda){
    var x0 = i * cel, y0 = j * cel, cx = x0 + cel / 2, cy = y0 + cel / 2;
    var dx = p === 'd0' ? Math.SQRT1_2 : -Math.SQRT1_2, dy = Math.SQRT1_2;
    var nx = -dy, ny = dx;
    var r = mulberry32((semente ^ (i * 374761393) ^ (j * 668265263)) | 0);
    var amp = cel * .038, k1 = 1.6 + r() * 1.8, ph1 = r() * 6.2832,
        k2 = 4.0 + r() * 3.2, ph2 = r() * 6.2832;
    var olho = comOlho === true || (comOlho !== false && r() < .42);
    var rK = cel * (.10 + r() * .05);
    /* o centro do nó é confinado com a folga do maior semieixo dos
       laços — sem isso o olho sangra para o módulo vizinho. */
    var folga = rK * 1.766 * 1.14 + 1.5;
    var sK = 0, oK = 0;
    if (olho){
      if (cel < folga * 2.2){ olho = false; }
      else {
        var kx = x0 + folga + r() * (cel - folga * 2);
        var ky = y0 + folga + r() * (cel - folga * 2);
        sK = (kx - cx) * dx + (ky - cy) * dy;
        oK = (kx - cx) * nx + (ky - cy) * ny;
      }
    }
    var sig = rK * 2.3;
    var passo = fenda ? cel / 7 : cel / 13, K = fenda ? 5 : 10;
    var saida = { corte:'', veio:'', olho:'', fenda:'' };
    if (fenda) olho = false;
    /* cada fibra tem fase e espaçamento próprios: madeira não é
       hachura. O feixe é paralelo em média, nunca em cada linha. */
    var jit = [], fas = [], qq;
    for (qq = -K; qq <= K; qq++){ jit.push((r() - .5) * passo * .55); fas.push(r() * 6.2832); }
    for (var q = -K; q <= K; q++){
      var off = q * passo + jit[q + K], fq = fas[q + K];
      if (fenda && q === 0) continue;      /* o lugar da fibra central é da fenda */
      if (olho && Math.abs(off - oK) < rK * .42) continue;
      var pts = [], S = 22;
      for (var m = 0; m <= S; m++){
        var s = (-1 + 2 * m / S) * cel;
        var w = org * amp * (.6 * Math.sin(k1 * s / cel + ph1 + fq * .35)
                           + .4 * Math.sin(k2 * s / cel + ph2 + fq));
        var o = off + w;
        if (olho){
          var dn = off - oK, ds = s - sK;
          var bump = Math.exp(-(ds * ds) / (2 * sig * sig));
          o += (dn < 0 ? -1 : 1) * rK * 1.15 * bump * Math.exp(-Math.abs(dn) / (rK * 1.9));
        }
        var px = cx + s * dx + o * nx, py = cy + s * dy + o * ny;
        if (px < x0 - .5 || px > x0 + cel + .5 || py < y0 - .5 || py > y0 + cel + .5){
          if (pts.length > 1) saida[q === 0 ? 'corte' : 'veio'] += poli(pts);
          pts = []; continue;
        }
        pts.push([px, py]);
      }
      if (pts.length > 1) saida[q === 0 ? 'corte' : 'veio'] += poli(pts);
    }
    if (fenda){
      /* a fenda radial: uma greta que abre no meio e fecha nas
         pontas, com duas ramificações curtas. Ref. 07. */
      var lados = [1, -1], br;
      for (br = 0; br < 2; br++){
        var lp2 = [];
        for (var f2 = 0; f2 <= 16; f2++){
          var u2 = -1 + 2 * f2 / 16;
          var abre = Math.cos(u2 * Math.PI / 2);            /* fecha nas pontas */
          var jg = (r() - .5) * cel * .012;
          var o2 = lados[br] * cel * .016 * abre + jg;
          lp2.push([cx + u2 * cel * .706 * dx + o2 * nx, cy + u2 * cel * .706 * dy + o2 * ny]);
        }
        saida.fenda += poli(lp2);
      }
      for (br = 0; br < 2; br++){
        var u3 = (r() - .5) * 1.1, L3 = cel * (.10 + r() * .12), ang = (r() < .5 ? 1 : -1) * (.35 + r() * .3);
        var bx = cx + u3 * cel * .706 * dx, by = cy + u3 * cel * .706 * dy;
        var rx = dx * Math.cos(ang) - dy * Math.sin(ang), ry = dx * Math.sin(ang) + dy * Math.cos(ang);
        saida.fenda += 'M' + num(bx) + ' ' + num(by) + 'L' + num(bx + rx * L3) + ' ' + num(by + ry * L3) + ' ';
      }
    }
    if (olho){
      for (var lo = 0; lo < 4; lo++){
        var a = rK * (.42 + lo * .24) * 1.55, b = rK * (.28 + lo * .22), lp = [];
        for (var f = 0; f <= 22; f++){
          var an = f / 22 * 6.2832;
          var wob = 1 + org * .10 * Math.sin(3 * an + ph1 + lo);
          var lu = a * Math.cos(an) * wob, lv = b * Math.sin(an) * wob;
          lp.push([cx + (sK + lu) * dx + (oK + lv) * nx, cy + (sK + lu) * dy + (oK + lv) * ny]);
        }
        saida.olho += poli(lp) + 'Z';
      }
    }
    return saida;
  }

  /* ---------- o desenho completo de uma grade ---------- */
  function desenha(alvo, grade, cols, lins, cel, semente, org, opts){
    opts = opts || {};
    var radial = opts.radial || [];
    var dA = '', dB = '', dV = '', dJ = '', dF = '', cache = {};
    var Wd = cols * cel, Ht = lins * cel;
    for (var c = 1; c < cols; c++) dJ += 'M' + num(c * cel) + ' 0V' + num(Ht);
    for (var l = 1; l < lins; l++) dJ += 'M0 ' + num(l * cel) + 'H' + num(Wd);
    for (var j = 0; j < lins; j++){
      for (var i = 0; i < cols; i++){
        var p = grade[j][i], x = i * cel, y = j * cel;
        if (!p) continue;
        if (p.charAt(0) === 'd'){
          /* bloco de fio: a tábua inteira num tom só. Qual dos dois
             é sorteado por célula — são madeiras diferentes, e o fio
             é uma ilha (R5), então isso não desmancha figura nenhuma. */
          var rt = mulberry32((semente ^ (i * 2246822519) ^ (j * 3266489917)) | 0);
          var quad = 'M' + num(x) + ' ' + num(y) + 'h' + num(cel) + 'v' + num(cel) + 'h' + num(-cel) + 'Z';
          if (rt() < .45) dA += quad; else dB += quad;
          var eFenda = !!(radial[j] && radial[j][i]);
          var fb = fibras(p, i, j, cel, org, semente,
                          opts.olho === 'forcar' ? true : opts.olho === 'nunca' ? false : undefined,
                          eFenda);
          dV += fb.veio + fb.corte + fb.olho;
          dF += fb.fenda;
          continue;
        }
        /* bloco de topo: anéis centrados no vértice */
        var vp = verticePx(i, j, p, cel), vx = vp[0], vy = vp[1];
        var t = tora(p === 'a0' ? i : p === 'a1' ? i + 1 : p === 'a2' ? i + 1 : i,
                     p === 'a0' ? j : p === 'a1' ? j : p === 'a2' ? j + 1 : j + 1,
                     semente, cache);
        var corte = anel(p, vx, vy, cel, 1, t, org, true);
        var s = SG[p];
        /* setor (a madeira que contém o centro) */
        dA += 'M' + num(vx) + ' ' + num(vy) + 'L';
        for (var k = 0; k < corte.length; k++) dA += num(corte[k][0]) + ' ' + num(corte[k][1]) + ' ';
        dA += 'Z';
        /* complemento (a sobra côncava) */
        dB += 'M' + num(corte[0][0]) + ' ' + num(corte[0][1]) + 'L';
        for (k = 1; k < corte.length; k++) dB += num(corte[k][0]) + ' ' + num(corte[k][1]) + ' ';
        dB += num(vx + s[0] * cel) + ' ' + num(vy + s[1] * cel) + ' ';   /* canto oposto */
        dB += 'Z';
        /* os anéis */
        for (k = 0; k < t.fr.length; k++){
          var fr = t.fr[k];
          var pts = anel(p, vx, vy, cel, fr, t, org, fr <= 1.0001, k * .38);
          if (pts.length > 1) dV += poli(pts);
        }
      }
    }
    alvo.A.setAttribute('d', dA);
    alvo.B.setAttribute('d', dB);
    alvo.V.setAttribute('d', dV);
    if (alvo.J) alvo.J.setAttribute('d', dJ);
    if (alvo.F) alvo.F.setAttribute('d', dF);
    return dA.length + dB.length + dV.length + dJ.length + dF.length;
  }

  /* ---------- a prancha ---------- */
  var semente = 20260823, ultimo = {};
  function doHash(){
    var m = /s=(\d+)/.exec(location.hash || '');
    return m ? (parseInt(m[1], 10) % 2147483647) : 20260823;
  }
  function gera(){
    var cx = svg.getBoundingClientRect();
    var Wd = Math.round(cx.width) || window.innerWidth;
    var Ht = Math.round(cx.height) || window.innerHeight;
    var cel = Math.max(140, Math.round(Wd / 8));
    var cols = Math.ceil(Wd / cel), lins = Math.ceil(Ht / cel);
    var t0 = performance.now();
    svg.setAttribute('viewBox', '0 0 ' + Wd + ' ' + Ht);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    var s = sorteiaGrade(semente, cols, lins);
    var bytes = desenha({ A:pTomA, B:pTomB, V:pVeio, J:pJunta, F:pFenda },
                        s.grade, cols, lins, cel, semente, ORG, { radial: s.radial });
    var reta = Math.round(s.retas / s.cels * 100);
    elSemente.textContent = semente;
    elMix.textContent = (100 - reta) + '% topo · ' + reta + '% fio · '
                      + (bytes / 1024).toFixed(1) + ' kB · '
                      + (performance.now() - t0).toFixed(1) + ' ms';
    window.__marchetaria = { semente:semente, grade:s.grade, radial:s.radial,
                             cols:cols, lins:lins, cel:cel, org:ORG };
    ultimo = { cols:cols, lins:lins, cel:cel };
  }
  function aplica(s){
    semente = s; gera();
    try { history.replaceState(null, '', '#s=' + semente); } catch (e) {}
  }
  aplica(doHash());

  document.addEventListener('click', function(e){
    if (e.target.closest && (e.target.closest('.painel') || e.target.closest('.voc')
        || e.target.closest('#btnVoc') || e.target.closest('#btnFechar'))) return;
    aplica((semente * 16807 + 1) % 2147483647);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault(); aplica((semente * 16807 + 1) % 2147483647);
    }
    var i = ['1','2','3','4'].indexOf(e.key);
    if (i >= 0) trocaTema(['mata','papel','tiber','eletrico'][i]);
    if (e.key === 'c' || e.key === 'C') abreVoc(!document.getElementById('voc').classList.contains('aberto'));
    if (e.key === 'Escape') abreVoc(false);
  });
  var timer = null;
  window.addEventListener('resize', function(){
    clearTimeout(timer); timer = setTimeout(gera, 150);
  });

  /* ---------- controles ---------- */
  var botoes = Array.prototype.slice.call(document.querySelectorAll('.tema-btn'));
  function trocaTema(t){
    document.body.dataset.tema = t;
    botoes.forEach(function(b){ b.classList.toggle('on', b.dataset.tema === t); });
  }
  botoes.forEach(function(b){ b.addEventListener('click', function(){ trocaTema(b.dataset.tema); }); });
  var vb = Array.prototype.slice.call(document.querySelectorAll('.veio-btn'));
  vb.forEach(function(b){
    b.addEventListener('click', function(){
      ORG = parseFloat(b.dataset.org);
      vb.forEach(function(x){ x.classList.toggle('on', x === b); });
      gera(); if (document.getElementById('voc').classList.contains('aberto')) montaVoc();
    });
  });

  /* ---------- vocabulário ----------
     As mesmas funções desenhando grades feitas à mão: é assim que
     cada peça e cada figura emergente se olha isolada. */
  var PECAS = [
    { cod:'a0 · a1 · a2 · a3', nome:'anel <em>(topo)</em>',
      desc:'O arco virou um anel entre vários, centrados no vértice. Cada bloco é topo de tora com a medula num canto diferente; o corte do sistema é um dos anéis.',
      g:[['a0','a2'],['a3','a1']] },
    { cod:'d0 · d1', nome:'fio <em>(feixe)</em>',
      desc:'A reta virou feixe de fibras — o bloco aparelhado no fio, entre blocos de topo. Cada fibra tem fase própria: madeira não é hachura.',
      g:[['a0','d0'],['a3','a1']], olho:'nunca' },
    { cod:'d0 + nó', nome:'olho <em>(nó)</em>',
      desc:'O nó como acento dentro do fio: as fibras desviam em volta e voltam. Cai em cerca de dois quintos dos blocos de fio.',
      g:[['a0','d0'],['a3','a1']], olho:'forcar' },
    { cod:'a2 + a3', nome:'meia tora',
      desc:'Dois arcos convergindo no mesmo vértice. Porque os anéis são do vértice e não da célula, a família atravessa a junta: meia seção de tronco em dois blocos.',
      g:[['a2','a3'],['a0','a1']] },
    { cod:'a2 a3 a1 + d0', nome:'três-quartos com <em>fenda</em>',
      desc:'Três arcos e a quarta célula obrigada a irradiar (R2). É a figura que a regra 3 persegue — e a fenda radial que a madeira teria de verdade.',
      g:[['a2','a3'],['a1','d0']], radial:[[],[false,true]] },
    { cod:'a2 a3 a1 a0', nome:'tora inteira <em>(reservada)</em>',
      desc:'Quatro arcos fechando o círculo. A R4 proíbe: a tora inteira é da janela do wordmark, não da textura. Está aqui só para se reconhecer o que nunca aparece.',
      g:[['a2','a3'],['a1','a0']] }
  ];
  function montaVoc(){
    var box = document.getElementById('vocGrid');
    box.innerHTML = '';
    PECAS.forEach(function(pc, n){
      var cel = 155, W = 2 * cel, H = 2 * cel;
      var art = document.createElement('article');
      art.className = 'peca';
      art.innerHTML =
        '<div class="quadro"><svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
        + '<rect width="' + W + '" height="' + H + '" fill="var(--bg)"/>'
        + '<path class="a" fill="var(--tomA)"/><path class="b" fill="var(--tomB)"/>'
        + '<path class="j" fill="none" stroke="var(--junta)" stroke-width="1"/>'
        + '<path class="v" fill="none" stroke="var(--veio)" stroke-width="1.05" stroke-linecap="round"/>'
        + '<path class="f" fill="none" stroke="var(--veio)" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>'
        + '</svg></div>'
        + '<p class="cod">' + pc.cod + '</p>'
        + '<p class="nome">' + pc.nome + '</p>'
        + '<p class="desc">' + pc.desc + '</p>';
      box.appendChild(art);
      var sv = art.querySelector('svg');
      desenha({ A:sv.querySelector('.a'), B:sv.querySelector('.b'),
                V:sv.querySelector('.v'), J:sv.querySelector('.j'), F:sv.querySelector('.f') },
              pc.g, 2, 2, cel, 20260900 + n * 11, ORG,
              { olho: pc.olho, radial: pc.radial });
    });
  }
  function abreVoc(v){
    document.getElementById('voc').classList.toggle('aberto', v);
    document.getElementById('voc').setAttribute('aria-hidden', v ? 'false' : 'true');
    document.getElementById('btnFechar').style.display = v ? 'block' : 'none';
    if (v) montaVoc();
  }
  document.getElementById('btnVoc').addEventListener('click', function(e){
    e.stopPropagation(); abreVoc(true);
  });
  document.getElementById('btnFechar').addEventListener('click', function(e){
    e.stopPropagation(); abreVoc(false);
  });
})();
</script>
</body>
